<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春秋·列国志</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%239c2b26'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f6e8c9' font-family='KaiTi,serif'%3E%E6%98%A5%3C/text%3E%3C/svg%3E">
<style>
/* ============ 春秋·列国志 —— 水墨样式 ============ */
:root{
  --paper:#efe3c8;
  --paper-2:#e6d7b6;
  --paper-3:#dcc9a2;
  --ink:#1f1b17;
  --ink-2:#42392f;
  --ink-3:#6d6052;
  --seal:#9c2b26;
  --seal-2:#b8443a;
  --gold:#a67c34;
  --jade:#4d6f56;
  --azure:#3c5e78;
  --line:#b9a37e;
  --shadow:rgba(40,28,16,.28);
  --serif:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:var(--serif);color:var(--ink);
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.5), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(160,130,80,.18), transparent 50%),
    repeating-linear-gradient(32deg, rgba(120,95,60,.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-58deg, rgba(120,95,60,.03) 0 2px, transparent 2px 6px),
    linear-gradient(150deg,#f4ead4,#e7d8b8 55%,#e2cfa9);
  overflow:hidden;
}
#app{
  display:grid;height:100vh;
  grid-template-columns:1fr 268px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"hud hud" "screen log";
}
button{font-family:var(--serif);cursor:pointer;}
::selection{background:rgba(156,43,38,.22);}

/* ---------- 顶栏 ---------- */
#hud{
  grid-area:hud;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:8px 16px;border-bottom:2px solid var(--line);
  background:linear-gradient(180deg,rgba(246,238,220,.96),rgba(233,219,190,.92));
  box-shadow:0 3px 14px rgba(90,70,40,.14);position:relative;z-index:5;
}
#hud:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:rgba(120,95,60,.25);}
.hud-brand{display:flex;align-items:center;gap:8px;}
.brand-seal{
  width:34px;height:34px;display:grid;place-items:center;border-radius:3px;
  background:linear-gradient(160deg,var(--seal),#7d1f1c);color:#f6e8c9;
  font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,225,190,.28),0 2px 6px var(--shadow);
}
.brand-text{font-size:19px;letter-spacing:4px;color:var(--ink);}
.hud-player{display:flex;align-items:baseline;gap:8px;padding-left:6px;border-left:1px solid var(--line);padding-right:4px;}
.hud-name{font-size:17px;letter-spacing:2px;}
.hud-prof{font-size:12px;color:var(--seal);border:1px solid rgba(156,43,38,.4);padding:1px 6px;border-radius:2px;}
.hud-rank{font-size:12px;color:var(--jade);}
.hud-stats{display:flex;gap:12px;margin-left:auto;}
.hud-stats .stat{display:flex;align-items:center;gap:4px;font-size:14px;}
.hud-stats .stat i{font-style:normal;font-size:11px;color:#f3e7cc;background:var(--ink-3);border-radius:2px;padding:1px 4px;}
.hud-stats .stat b{font-weight:600;letter-spacing:.5px;}
.hud-time{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 10px;border:1px solid var(--line);border-radius:2px;background:rgba(255,250,235,.5);}
.hud-time .season{color:var(--seal);font-size:12px;}
.hud-nav{display:flex;gap:4px;flex-wrap:wrap;}
.hud-nav button{
  border:1px solid transparent;background:transparent;padding:5px 10px;font-size:14px;color:var(--ink-2);
  border-radius:2px;letter-spacing:2px;transition:.16s;
}
.hud-nav button:hover{background:rgba(166,124,52,.14);border-color:rgba(166,124,52,.35);}
.hud-nav button.active{background:var(--ink);color:#f3e6cb;border-color:var(--ink);box-shadow:0 2px 8px rgba(30,20,10,.28);}

/* ---------- 主区域 ---------- */
.screen{grid-area:screen;overflow:auto;padding:18px 22px 32px;position:relative;}
.screen::-webkit-scrollbar,aside::-webkit-scrollbar{width:9px;}
.screen::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:rgba(120,95,60,.35);border-radius:5px;}

/* 通用面板 */
.panel{
  background:linear-gradient(175deg,rgba(251,245,229,.92),rgba(240,229,203,.88));
  border:1px solid var(--line);box-shadow:0 4px 18px rgba(90,70,40,.12);
  padding:16px 18px;position:relative;
}
.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--line);}
.panel:before{left:3px;top:3px;border-right:0;border-bottom:0;}
.panel:after{right:3px;bottom:3px;border-left:0;border-top:0;}
.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:4px;font-weight:500;display:flex;align-items:center;gap:10px;}
.panel h2 .sub{font-size:12px;letter-spacing:1px;color:var(--ink-3);font-weight:400;}
.panel .desc{color:var(--ink-3);font-size:13px;line-height:1.75;margin:6px 0 14px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0;}

/* ---------- 舆图 ---------- */
.map-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;height:100%;min-height:0;}
.map-panel{padding:10px;display:flex;flex-direction:column;min-height:0;}
.map-svg-box{flex:1;min-height:0;position:relative;border:1px solid rgba(120,95,60,.25);background:
  radial-gradient(circle at 60% 40%,rgba(255,252,240,.55),transparent 60%),
  linear-gradient(160deg,#f2e8d0,#e4d4b0);overflow:hidden;}
#map-svg{width:100%;height:100%;display:block;}
.map-city{cursor:pointer;}
.map-city circle.hit{fill:transparent;}
.map-city .dot{transition:.18s;}
.map-city:hover .dot{r:9;}
.map-city text{font-family:var(--serif);font-size:15px;fill:#33291f;paint-order:stroke;stroke:rgba(246,238,220,.85);stroke-width:3.5px;pointer-events:none;letter-spacing:1px;}
.map-city .star{fill:var(--seal);}
.map-road{stroke:#b39d78;stroke-width:1.6;stroke-dasharray:5 4;opacity:.75;}
.map-road.sea{stroke:var(--azure);stroke-dasharray:2 6;}
.map-river{fill:none;stroke:#7d97a6;stroke-width:6;opacity:.55;stroke-linecap:round;}
.map-river.thin{stroke-width:3;opacity:.4;}
.map-state-label{font-family:var(--serif);font-size:26px;fill:rgba(80,60,40,.22);letter-spacing:8px;pointer-events:none;}
#player-token{transition:transform .8s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding:8px 4px 0;}
.map-legend span{display:flex;align-items:center;gap:5px;}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

.map-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px;}
.city-card .city-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.city-card h3{margin:0;font-size:20px;letter-spacing:3px;}
.city-card .state-tag{font-size:12px;padding:1px 7px;border-radius:2px;color:#f6ecd6;}
.city-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 0;font-size:13px;color:var(--ink-2);}
.city-meta b{font-weight:600;color:var(--ink);}
.route-line{font-size:13px;line-height:1.7;color:var(--ink-2);border-top:1px dashed rgba(120,95,60,.3);padding-top:8px;}
.route-line em{color:var(--seal);font-style:normal;}

/* ---------- 按钮 ---------- */
.btn{
  font-family:var(--serif);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,251,240,.95),rgba(238,227,203,.9));
  color:var(--ink);padding:8px 14px;font-size:14px;letter-spacing:1.5px;border-radius:2px;transition:.15s;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 6px rgba(90,70,40,.12);
}
.btn:hover{border-color:var(--seal);color:var(--seal);transform:translateY(-1px);box-shadow:0 4px 12px rgba(90,70,40,.18);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(180deg,#a83a33,var(--seal));color:#f8eed7;border-color:#7d1f1c;text-shadow:0 1px 0 rgba(0,0,0,.25);}
.btn.primary:hover{color:#fff;filter:brightness(1.07);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.sm{padding:4px 10px;font-size:12.5px;letter-spacing:.5px;}
.btn.block{display:block;width:100%;text-align:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- 城中 ---------- */
.city-hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:14px 18px;border:1px solid var(--line);margin-bottom:14px;
  background:
    radial-gradient(circle at 88% 10%,rgba(166,124,52,.16),transparent 55%),
    linear-gradient(170deg,rgba(252,246,231,.94),rgba(236,224,198,.9));
  box-shadow:0 4px 18px rgba(90,70,40,.12);
}
.city-hero h1{margin:0;font-size:30px;letter-spacing:6px;font-weight:500;}
.city-hero .hero-sub{color:var(--ink-3);font-size:13px;margin-top:6px;line-height:1.7;max-width:640px;}
.city-hero .hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.tag{font-size:11.5px;border:1px solid rgba(77,111,86,.45);color:var(--jade);padding:1px 7px;border-radius:2px;letter-spacing:1px;}
.tag.war{border-color:rgba(156,43,38,.45);color:var(--seal);}
.tag.gray{border-color:rgba(109,96,82,.4);color:var(--ink-3);}

.cols{display:grid;grid-template-columns:1.25fr .95fr;gap:14px;align-items:start;}
@media (max-width:1080px){.cols{grid-template-columns:1fr;}}
.section-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;letter-spacing:3px;color:var(--ink-2);}
.section-title:before{content:"";width:4px;height:14px;background:var(--seal);}
.section-title .hint{font-size:11.5px;color:var(--ink-3);letter-spacing:0;}

.action-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;}
.action{
  text-align:left;border:1px solid var(--line);background:rgba(255,251,240,.72);padding:11px 13px;border-radius:2px;
  transition:.16s;position:relative;overflow:hidden;
}
.action:hover{background:#fffaf0;border-color:var(--gold);box-shadow:0 4px 14px rgba(90,70,40,.16);transform:translateY(-1px);}
.action .a-name{font-size:15px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.action .a-desc{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.6;}
.action .a-cost{position:absolute;right:10px;top:10px;font-size:11px;color:var(--seal);}
.action:disabled{opacity:.45;}

.npc-list{display:flex;flex-direction:column;gap:8px;}
.npc-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid rgba(185,163,126,.65);
  background:rgba(255,250,238,.6);transition:.15s;cursor:pointer;
}
.npc-row:hover{background:#fffaf0;border-color:var(--gold);}
.avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:2px;display:grid;place-items:center;
  font-size:17px;color:#f7edd8;background:linear-gradient(160deg,var(--ink-3),var(--ink-2));
  box-shadow:inset 0 0 0 1px rgba(255,235,200,.25);
}
.npc-row .n-main{flex:1;min-width:0;}
.npc-row .n-name{font-size:15px;letter-spacing:1px;}
.npc-row .n-title{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.npc-row .n-rel{font-size:11.5px;color:var(--seal);white-space:nowrap;}

/* 数值条 */
.bar{height:7px;background:rgba(120,95,60,.18);border-radius:4px;overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#c9a45b);border-radius:4px;transition:width .4s;}
.bar.red>i{background:linear-gradient(90deg,var(--seal),#c4695f);}
.bar.green>i{background:linear-gradient(90deg,var(--jade),#7fa387);}
.bar.blue>i{background:linear-gradient(90deg,var(--azure),#7d9db8);}

/* 人物面板 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.stat-line{font-size:13px;}
.stat-line .sl-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.stat-line .sl-top b{font-weight:600;}
.stat-line .sl-top span{color:var(--ink-3);font-size:11.5px;}
.skill-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.skill-table td{padding:6px 4px;border-bottom:1px dashed rgba(120,95,60,.22);}
.skill-table td.lv{text-align:center;width:64px;color:var(--seal);letter-spacing:1px;}
.skill-table td.act{text-align:right;width:92px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;}
.kv dt{color:var(--ink-3);}
.kv dd{margin:0;}

/* 差事 */
.quest{border:1px solid rgba(185,163,126,.7);background:rgba(255,251,241,.66);padding:12px 14px;margin-bottom:10px;position:relative;}
.quest .q-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.quest h4{margin:0;font-size:15.5px;letter-spacing:1.5px;font-weight:600;}
.quest .q-from{font-size:11.5px;color:var(--ink-3);}
.quest .q-desc{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:6px 0;}
.quest .q-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);}
.quest .q-meta b{color:var(--seal);font-weight:600;}
.quest.done{opacity:.55;}
.quest.urgent{border-color:rgba(156,43,38,.55);box-shadow:0 0 0 1px rgba(156,43,38,.12) inset;}
.empty{color:var(--ink-3);font-size:13px;padding:18px;text-align:center;border:1px dashed rgba(120,95,60,.35);}

/* 名鉴 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.npc-card{
  border:1px solid var(--line);background:linear-gradient(170deg,rgba(255,250,238,.92),rgba(238,226,200,.9));
  padding:12px;text-align:center;position:relative;transition:.16s;cursor:pointer;
}
.npc-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(90,70,40,.2);border-color:var(--gold);}
.npc-card .avatar{width:56px;height:56px;font-size:24px;margin:0 auto 8px;}
.npc-card .c-name{font-size:15px;letter-spacing:1px;}
.npc-card .c-title{font-size:11px;color:var(--ink-3);margin-top:3px;min-height:15px;}
.npc-card .c-state{position:absolute;left:6px;top:6px;font-size:10px;color:#fff;padding:0 4px;border-radius:2px;}
.npc-card.locked{filter:grayscale(1);opacity:.45;}
.npc-card.locked .avatar{background:#8d8478;}

/* 交游 */
.rel-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px dashed rgba(120,95,60,.25);}
.rel-row .rel-mid{flex:1;min-width:0;}
.rel-row .rel-name{font-size:14.5px;display:flex;align-items:center;gap:8px;}
.rel-row .rel-sub{font-size:11.5px;color:var(--ink-3);margin:3px 0 5px;}
.rel-tier{font-size:11px;color:var(--seal);border:1px solid rgba(156,43,38,.35);padding:0 5px;border-radius:2px;}

/* ---------- 右侧纪事 ---------- */
#log-panel{grid-area:log;border-left:2px solid var(--line);background:linear-gradient(180deg,rgba(240,230,208,.9),rgba(232,219,192,.86));display:flex;flex-direction:column;min-height:0;}
#log-panel h3{margin:0;padding:12px 16px 8px;font-size:14px;letter-spacing:6px;color:var(--ink-2);border-bottom:1px solid rgba(120,95,60,.25);font-weight:500;}
#log-list{list-style:none;margin:0;padding:8px 12px 20px;overflow:auto;flex:1;font-size:12.5px;line-height:1.7;}
#log-list li{padding:5px 0;border-bottom:1px dotted rgba(120,95,60,.2);color:var(--ink-2);animation:fadeUp .35s;}
#log-list li .l-date{color:var(--ink-3);font-size:10.5px;margin-right:6px;}
#log-list li.war{color:var(--seal);}
#log-list li.gain{color:var(--jade);}
#log-list li.big{color:var(--gold);font-weight:600;}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- 弹窗 ---------- */
#modal-root{position:fixed;inset:0;display:none;z-index:60;}
#modal-root.on{display:block;}
.modal-back{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(30,22,14,.42),rgba(20,14,8,.62));backdrop-filter:blur(2px);animation:fade .2s;}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 90% 0,rgba(166,124,52,.14),transparent 55%),
    linear-gradient(175deg,#faf4e4,#ecdfc1);
  border:1px solid #8f7c5c;box-shadow:0 22px 60px rgba(20,12,6,.5),inset 0 0 0 3px rgba(255,255,255,.35);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide{width:min(980px,96vw);}
.modal.narrow{width:min(520px,94vw);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid rgba(143,124,92,.5);background:rgba(255,250,236,.55);}
.modal-head h3{margin:0;font-size:19px;letter-spacing:3px;font-weight:500;}
.modal-head .m-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:1px;}
.modal-close{border:0;background:transparent;font-size:20px;color:var(--ink-3);line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--seal);}
.modal-body{padding:16px 18px;overflow:auto;font-size:14px;line-height:1.85;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid rgba(143,124,92,.4);background:rgba(255,250,236,.45);flex-wrap:wrap;}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}

.dialog-line{display:flex;gap:12px;margin-bottom:14px;}
.dialog-line .avatar{width:46px;height:46px;flex:0 0 46px;font-size:20px;}
.dialog-line .dl-body{flex:1;min-width:0;}
.dialog-line .dl-name{font-size:12.5px;color:var(--ink-3);letter-spacing:1px;margin-bottom:3px;}
.dialog-line .dl-text{background:rgba(255,252,242,.85);border:1px solid rgba(185,163,126,.6);padding:10px 13px;font-size:14px;line-height:1.8;position:relative;}
.dialog-line.me .dl-text{background:rgba(244,236,216,.9);}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.choice-btn{
  text-align:left;border:1px solid var(--line);background:rgba(255,251,240,.8);padding:9px 13px;font-size:14px;
  transition:.15s;letter-spacing:.5px;
}
.choice-btn:hover{border-color:var(--seal);background:#fffaf0;padding-left:18px;}
.choice-btn small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px;letter-spacing:0;}

/* ---------- 小游戏 ---------- */
.mg-stage{display:flex;flex-direction:column;gap:12px;}
.mg-hint{font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.7;}
.mg-bar-wrap{position:relative;height:52px;border:1px solid var(--line);background:linear-gradient(180deg,#efe4cb,#e3d3ae);overflow:hidden;}
.mg-zone{position:absolute;top:0;bottom:0;}
.mg-zone.good{background:rgba(77,111,86,.22);}
.mg-zone.perfect{background:rgba(166,124,52,.45);}
.mg-marker{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--seal);box-shadow:0 0 10px rgba(156,43,38,.8);}
.mg-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);}
.mg-result{text-align:center;font-size:16px;letter-spacing:2px;min-height:26px;}
.combat-hp{display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:13px;}
.combat-hp .side{flex:1;}
.combat-hp .side.right{text-align:right;}
.combat-hp .hpbar{height:10px;background:rgba(120,95,60,.2);margin-top:4px;border-radius:5px;overflow:hidden;}
.combat-hp .hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#7f9a6a,#b4674f);transition:width .35s;}
.combat-arena{
  height:120px;border:1px solid rgba(185,163,126,.6);margin:10px 0;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 120%,rgba(120,95,60,.22),transparent 60%),
    repeating-linear-gradient(90deg,rgba(120,95,60,.05) 0 1px,transparent 1px 26px),
    linear-gradient(180deg,#f3e9d3,#e2d0ab);
  display:flex;align-items:center;justify-content:center;gap:60px;
}
.fighter{font-size:46px;letter-spacing:0;transition:.2s;}
.fighter.hit{animation:shake .3s;}
.fighter.p{color:var(--ink);}
.fighter.e{color:var(--seal);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px) rotate(-3deg);}75%{transform:translateX(7px) rotate(3deg);}}
.move-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.move-btn{padding:10px 4px;text-align:center;border:1px solid var(--line);background:rgba(255,251,240,.85);transition:.14s;}
.move-btn:hover{border-color:var(--seal);background:#fffaf0;transform:translateY(-1px);}
.move-btn b{display:block;font-size:17px;letter-spacing:2px;}
.move-btn small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;}
.move-btn.dim{opacity:.4;}
.combat-log{height:112px;overflow:auto;font-size:12.5px;line-height:1.7;border-top:1px dashed rgba(120,95,60,.3);padding-top:8px;color:var(--ink-2);}
.combat-log p{margin:0 0 3px;}
.combat-log p.hit{color:var(--seal);}
.debate-meter{height:14px;background:rgba(120,95,60,.18);border-radius:7px;overflow:hidden;margin:6px 0 2px;}
.debate-meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),#7fa3bd);transition:width .4s;}
.debate-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.debate-opt{padding:10px 12px;border:1px solid var(--line);background:rgba(255,251,240,.82);text-align:left;transition:.14s;}
.debate-opt:hover{border-color:var(--azure);background:#fdf9ee;transform:translateY(-1px);}
.debate-opt b{letter-spacing:2px;font-size:15px;}
.debate-opt small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px;}

/* 表格 */
.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(120,95,60,.35);}
.table td{padding:7px 8px;border-bottom:1px dashed rgba(120,95,60,.22);}
.table tr:hover td{background:rgba(255,250,235,.6);}
.table .num{text-align:right;font-variant-numeric:tabular-nums;}
.price-up{color:var(--seal);}
.price-down{color:var(--jade);}
.badge{display:inline-block;font-size:11px;padding:0 5px;border-radius:2px;background:rgba(166,124,52,.16);color:var(--gold);}

/* ---------- Toast / 时间条 ---------- */
#toast-root{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:90;pointer-events:none;}
.toast{
  background:rgba(31,27,23,.92);color:#f4e9d3;padding:8px 18px;font-size:13.5px;letter-spacing:1px;
  border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastIn .25s,toastOut .3s 2.2s forwards;
  border-left:3px solid var(--gold);
}
.toast.gain{border-left-color:var(--jade);}
.toast.war{border-left-color:var(--seal);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}
#tick-bar{position:fixed;left:0;right:0;bottom:0;height:2px;background:transparent;z-index:80;pointer-events:none;}
#tick-fill{height:100%;width:0;background:var(--seal);transition:width .2s;}

/* ---------- 标题 / 结局 ---------- */
.title-screen{display:grid;place-items:center;height:100%;}
.title-inner{text-align:center;max-width:760px;padding:30px;}
.title-big{font-size:64px;letter-spacing:22px;margin:0 0 6px;text-indent:22px;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4);}
.title-sub{font-size:14px;letter-spacing:10px;color:var(--ink-3);margin-bottom:26px;}
.title-quote{font-size:14px;color:var(--ink-2);line-height:2.2;margin:0 auto 30px;max-width:520px;border-top:1px solid rgba(120,95,60,.3);border-bottom:1px solid rgba(120,95,60,.3);padding:16px 0;}
.creation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:14px 0;}
.prof-card{border:1px solid var(--line);background:rgba(255,251,240,.75);padding:12px 14px;text-align:left;transition:.16s;}
.prof-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 16px rgba(90,70,40,.16);}
.prof-card.sel{border-color:var(--seal);background:#fff8e9;box-shadow:0 0 0 1px var(--seal) inset;}
.prof-card b{font-size:16px;letter-spacing:2px;}
.prof-card small{display:block;color:var(--ink-3);font-size:12px;line-height:1.65;margin-top:5px;}
.field{display:flex;align-items:center;gap:10px;margin:10px 0;}
.field label{font-size:13px;color:var(--ink-3);width:72px;}
.field input[type=text]{
  flex:1;border:1px solid var(--line);background:rgba(255,252,242,.9);padding:8px 10px;font-family:var(--serif);
  font-size:15px;letter-spacing:2px;color:var(--ink);border-radius:2px;outline:none;
}
.field input[type=text]:focus{border-color:var(--seal);}
.field .seg{display:flex;gap:6px;}
.field .seg button{border:1px solid var(--line);background:rgba(255,251,240,.7);padding:6px 14px;font-size:13px;}
.field .seg button.sel{background:var(--ink);color:#f3e6cb;border-color:var(--ink);}
.end-rank{font-size:34px;letter-spacing:8px;color:var(--seal);margin:6px 0 2px;}
.end-quote{font-size:14px;color:var(--ink-2);line-height:2;border-left:3px solid var(--gold);padding-left:14px;margin:16px 0;}
.ending-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;}
.ending-stats .es{border:1px solid var(--line);padding:9px;text-align:center;background:rgba(255,251,240,.6);}
.ending-stats .es b{display:block;font-size:19px;color:var(--seal);}
.ending-stats .es small{font-size:11px;color:var(--ink-3);}

/* 存档 */
.save-grid{display:flex;flex-direction:column;gap:10px;}
textarea.save-area{width:100%;height:110px;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);background:rgba(255,252,242,.9);padding:8px;resize:vertical;}
.mono{font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;color:var(--ink-3);}
.news-item{border-left:3px solid var(--seal);padding:4px 0 4px 12px;margin-bottom:10px;}
.news-item .n-y{font-size:11.5px;color:var(--ink-3);letter-spacing:1px;}
.news-item .n-t{font-size:15px;letter-spacing:2px;margin:2px 0 3px;}
.news-item .n-b{font-size:12.5px;color:var(--ink-2);line-height:1.7;}
.footnote{font-size:11.5px;color:var(--ink-3);line-height:1.7;margin-top:10px;}
kbd{font-family:var(--serif);border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:2px;background:rgba(255,251,240,.8);font-size:12px;}

/* ---------- 标题模式（隐藏 HUD 与纪事） ---------- */
body.title-mode #hud, body.title-mode #log-panel { display: none; }
body.title-mode #app { grid-template-columns: 1fr; grid-template-rows: 1fr; grid-template-areas: "screen"; }
body.title-mode .screen { display: flex; align-items: center; justify-content: center; padding: 24px; }
body.title-mode .screen > * { width: 100%; }

/* ---------- 册命试炼 ---------- */
.trial-grid{display:grid;gap:6px;margin:10px 0}
.trial-cell{
  aspect-ratio:1/1;border:1px solid var(--line);background:rgba(255,251,240,.8);font-family:var(--serif);
  font-size:15px;color:var(--ink-3);transition:.15s;border-radius:2px;
}
.trial-cell:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;transform:translateY(-1px)}
.trial-cell:disabled{cursor:default;opacity:.85}
.trial-cell.near{background:rgba(166,124,52,.22);color:#7a5a1e;border-color:rgba(166,124,52,.5)}
.trial-cell.far{background:rgba(120,95,60,.08);color:#8d8478}
.trial-cell.hit{background:rgba(156,43,38,.85);color:#f8eed7;border-color:#7d1f1c;font-weight:600}
.rite-clues{font-size:13px;line-height:1.9;color:var(--ink-2);background:rgba(255,251,240,.6);border:1px dashed rgba(120,95,60,.3);padding:8px 12px;margin:8px 0}
.rite-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;min-height:38px}
.rite-chip{display:inline-block;padding:5px 10px;border:1px solid var(--line);background:rgba(255,251,240,.9);font-size:13.5px;border-radius:2px}
.rite-chip.done{background:rgba(77,111,86,.16);border-color:rgba(77,111,86,.55);color:var(--jade)}
.rite-arrow{color:var(--ink-3);font-size:12px}


/* ---------- 修习：射靶与配对 ---------- */
.target-track{position:relative;height:54px;margin:12px 0;border:1px solid var(--line);background:linear-gradient(180deg,#efe4cb,#e3d3ae);overflow:hidden}
.target-center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(156,43,38,.55);transform:translateX(-1px)}
.target-center:before{content:"靶心";position:absolute;top:2px;left:4px;font-size:10px;color:#9c2b26;letter-spacing:1px}
.target-dot{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c9554b,#8a2621);box-shadow:0 2px 8px rgba(90,30,20,.4);transition:left .05s linear}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.match-btn{display:block;width:100%;text-align:center;border:1px solid var(--line);background:rgba(255,251,240,.85);
  padding:9px 8px;font-family:var(--serif);font-size:13.5px;margin-bottom:7px;border-radius:2px;transition:.14s}
.match-btn:hover:not(:disabled){border-color:var(--gold);background:#fffaf0}
.match-btn.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset;background:#fff7e8}
.match-btn.done{opacity:.45;border-color:rgba(77,111,86,.55);color:var(--jade);cursor:default}


/* ---------- 论辩：对症/相悖标记 ---------- */
.debate-opt.match{border-color:rgba(77,111,86,.75);background:rgba(77,111,86,.10);box-shadow:0 0 0 1px rgba(77,111,86,.25) inset}
.debate-opt.match:hover{border-color:var(--jade);background:rgba(77,111,86,.16)}
.debate-opt.opp{border-color:rgba(156,43,38,.45);background:rgba(156,43,38,.06)}
.debate-opt.opp small{color:#9c2b26}


/* ---------- 三回合论辩 ---------- */
.debate-speech{
  margin:12px 0;padding:12px 15px;border-left:3px solid var(--seal);
  background:rgba(255,251,240,.75);font-size:15px;line-height:1.9;
}
.debate-speech:before{content:"对方：";color:var(--ink-3);font-size:12px;margin-right:6px}
.debate-meter{height:16px;margin:18px 0 10px;background:rgba(120,95,60,.18);border-radius:8px;overflow:visible;position:relative}
.debate-meter .bar{height:10px;margin-top:3px;background:rgba(120,95,60,.18);border-radius:5px;overflow:hidden}
.debate-meter .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),#7fa3bd);transition:width .4s}
.debate-mark{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(60,94,120,.7)}
.debate-mark-label{position:absolute;top:-15px;transform:translateX(-50%);font-size:10px;color:var(--ink-3)}
.debate-opt.match small{color:var(--jade)}

</style>

<script>
(function () {
  var shown = false;
  function show(msg, detail) {
    if (shown) return; shown = true;
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    document.getElementById('boot-error-msg').textContent = msg || '脚本未能启动。';
    document.getElementById('boot-error-detail').textContent = detail || '';
  }
  window.addEventListener('error', function (e) {
    var where = (e.filename || '') + (e.lineno ? ':' + e.lineno : '');
    var stack = e.error && e.error.stack ? e.error.stack : '';
    show('页面脚本出错：' + (e.message || '未知错误'), where + '  ' + stack);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    show('页面脚本出错（Promise）：' + (r.message || String(e.reason)), r.stack || '');
  });
  setTimeout(function () {
    var screen = document.getElementById('screen');
    if (screen && screen.children.length === 0 && !shown) {
      var hint = location.protocol === 'file:'
        ? '当前是以 file:// 直接打开，浏览器会拦截 ES Module。'
        : '脚本尚未渲染任何内容，请打开浏览器控制台（F12）查看报错。';
      show(hint, 'URL: ' + location.href + ' ｜ 可运行 npm start 后访问 http://localhost:5173，或直接打开单文件版 chunqiu.html。');
    }
  }, 2500);
})();
</script>

",stats:{wu:48,zhi:86,zheng:92,mei:70},skills:{quanmou:6,shanggu:6,xuewen:7},bias:"yi",pref:"qi",teach:["shanggu","xuewen"],quote:"当官而行，何强之有？",desc:"楚之令尹，毁家纾难，治民有方，楚人颂之。"},{id:"qin_mu",name:"秦穆公",title:"秦伯",state:"qin",city:"yong",birth:-683,death:-621,role:"ruler",stats:{wu:60,zhi:80,zheng:82,mei:78},skills:{bingfa:5,quanmou:6,shanggu:4},bias:"yi",pref:"ma",teach:["quanmou"],quote:"吾不以一眚掩大德。",desc:"秦国之主，广纳贤才，东服强晋，西霸戎夷。"},{id:"bai_li_xi",name:"百里奚",title:"秦之大夫",state:"qin",city:"yong",birth:-725,death:-620,role:"minister",stats:{wu:34,zhi:94,zheng:92,mei:72},skills:{xuewen:8,quanmou:7,shanggu:6,suanshu:7},bias:"yi",pref:"su",teach:["xuewen","suanshu"],quote:"五羖大夫，何敢忘贫贱之交。",desc:"秦之贤相，五张羊皮赎身而入秦，谋国二十年，秦以强盛。"},{id:"jian_shu",name:"蹇叔",title:"秦之上大夫",state:"qin",city:"yong",birth:-720,death:-620,role:"minister",stats:{wu:40,zhi:90,zheng:84,mei:66},skills:{quanmou:7,bingfa:6,xuewen:7},bias:"yi",pref:"ge",teach:["quanmou","bingfa"],quote:"劳师以袭远，非所闻也。",desc:"秦之老臣，料事如神，殽之战前哭师，后果如其言。"},{id:"song_xiang",name:"宋襄公",title:"宋公",state:"song",city:"shangqiu",birth:-700,death:-637,role:"ruler",stats:{wu:52,zhi:48,zheng:58,mei:76},skills:{xuewen:5,biancai:4},bias:"ming",pref:"yu",teach:["xuewen"],quote:"君子不重伤，不禽二毛。",desc:"宋国之主，慕仁义之名，泓水之战不鼓不成列，遂败。"},{id:"hua_yuan",name:"华元",title:"宋之右师",state:"song",city:"shangqiu",birth:-620,death:-560,role:"minister",stats:{wu:54,zhi:80,zheng:84,mei:78},skills:{biancai:7,quanmou:6,bingfa:4},bias:"yi",pref:"ge",teach:["biancai","quanmou"],quote:"敝邑易子而食，析骸以爨，虽然，城下之盟，有以国毙，不能从也。",desc:"宋国执政，登床劫盟，后又倡弭兵之会，以纾宋难。"},{id:"xiang_xu",name:"向戌",title:"宋之左师",state:"song",city:"shangqiu",birth:-600,death:-530,role:"minister",stats:{wu:40,zhi:82,zheng:86,mei:88},skills:{biancai:9,quanmou:7},bias:"ming",pref:"si",teach:["biancai"],quote:"弭兵之会，天下息肩。",desc:"宋国左师，奔走列国，合晋楚之成，为春秋一大盛事。"},{id:"wei_wen",name:"卫文公",title:"卫侯",state:"wei",city:"chaoge",birth:-720,death:-635,role:"ruler",stats:{wu:48,zhi:66,zheng:72,mei:62},skills:{shanggu:5,xuewen:4},bias:"yi",pref:"si",teach:["shanggu"],quote:"卫之遗民，革车三十乘，今已三百乘矣。",desc:"卫国之君，国破之后励精图治，轻赋平罪，卫以复兴。"},{id:"yan_zhuang",name:"燕庄公",title:"燕侯",state:"yan",city:"ji",birth:-730,death:-658,role:"ruler",stats:{wu:44,zhi:56,zheng:58,mei:60},skills:{bingfa:3,xuewen:3},bias:"yi",pref:"ge",teach:["xuewen"],quote:"燕处北鄙，赖齐侯以安。",desc:"燕国之君，山戎侵伐，赖齐桓公救而存国。"},{id:"chen_xuan",name:"陈宣公",title:"陈侯",state:"chen",city:"wanqiu",birth:-720,death:-648,role:"ruler",stats:{wu:40,zhi:54,zheng:56,mei:58},skills:{xuewen:3},bias:"ming",pref:"qi",teach:["xuewen"],quote:"陈，小国也，事大国以自安。",desc:"陈国之君，国小势微，周旋于晋楚之间。"},{id:"cai_ai",name:"蔡哀公",title:"蔡侯",state:"cai",city:"shangcai",birth:-730,death:-675,role:"ruler",stats:{wu:42,zhi:46,zheng:50,mei:54},skills:{jianshu:2},bias:"ming",pref:"yu",teach:["jianshu"],quote:"蔡人亦自有志。",desc:"蔡国之君，地薄兵弱，为楚所窥。"},{id:"cao_gong",name:"曹共公",title:"曹伯",state:"cao",city:"tao",birth:-720,death:-618,role:"ruler",stats:{wu:38,zhi:44,zheng:48,mei:50},skills:{shanggu:3},bias:"li",pref:"su",teach:["shanggu"],quote:"陶为天下之中，商旅辐辏，寡人亦有以自养。",desc:"曹国之君，据陶之利，国小而富。"},{id:"chu_zhuang",name:"楚庄王",title:"楚王",state:"chu",city:"ying",birth:-640,death:-591,role:"ruler",stats:{wu:72,zhi:88,zheng:88,mei:80},skills:{bingfa:7,quanmou:8,biancai:4},bias:"shi",pref:"qi",teach:["bingfa","quanmou"],quote:"三年不蜚，蜚将冲天；三年不鸣，鸣将惊人。",desc:"楚国之主，问鼎中原，邲之战大败晋师，遂霸诸侯。"},{id:"yan_ying",name:"晏婴",title:"齐之相国",state:"qi",city:"linzi",birth:-578,death:-500,role:"minister",stats:{wu:35,zhi:92,zheng:94,mei:86},skills:{biancai:10,quanmou:8,xuewen:8},bias:"yi",pref:"si",teach:["biancai","xuewen"],quote:"橘生淮南则为橘，生于淮北则为枳。",desc:"齐之贤相，历事三君，节俭力行，折冲樽俎之间。"},{id:"shu_xiang",name:"叔向",title:"晋之太傅",state:"jin",city:"jiang",birth:-620,death:-528,role:"minister",stats:{wu:42,zhi:86,zheng:90,mei:74},skills:{xuewen:9,biancai:8,quanmou:6},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"国将亡，必多制。",desc:"晋国贤大夫，博闻强识，以礼法持国论。"},{id:"zi_chan",name:"子产",title:"郑之执政",state:"zheng",city:"xinzheng",birth:-600,death:-522,role:"minister",stats:{wu:40,zhi:92,zheng:96,mei:82},skills:{xuewen:9,quanmou:8,biancai:7,shanggu:5},bias:"yi",pref:"yu",teach:["xuewen","quanmou"],quote:"苟利社稷，死生以之。",desc:"郑国执政，铸刑书，不毁乡校，小国而能自立于晋楚之间。"},{id:"lao_zi",name:"老子",title:"周之守藏史",state:"zhou",city:"luoyi",birth:-571,death:-471,role:"scholar",stats:{wu:26,zhi:96,zheng:72,mei:80},skills:{xuewen:10,biancai:7,quanmou:8},bias:"yi",pref:"yu",teach:["xuewen","quanmou"],quote:"上善若水，水善利万物而不争。",desc:"周室守藏室之史，博古知今，其学以自隐无名为务。"},{id:"kong_zi",name:"孔子",title:"鲁之学者",state:"lu",city:"qufu",birth:-551,death:-479,role:"scholar",stats:{wu:52,zhi:94,zheng:86,mei:90},skills:{xuewen:10,biancai:8,bingfa:4,suanshu:5},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"学而时习之，不亦说乎？",desc:"鲁国陬邑人，少而好学，设教阙里，弟子三千，贤者七十。"},{id:"sun_wu",name:"孙武",title:"吴之将军",state:"wu",city:"gusu",birth:-545,death:-470,role:"general",stats:{wu:78,zhi:96,zheng:70,mei:66},skills:{bingfa:10,quanmou:8,jianshu:6,xuewen:7},bias:"shi",pref:"ma",teach:["bingfa","jianshu"],quote:"兵者，国之大事，死生之地，存亡之道，不可不察也。",desc:"齐人而仕于吴，以兵法十三篇见阖闾，西破强楚，北威齐晋。"},{id:"wu_zixu",name:"伍子胥",title:"吴之相国",state:"wu",city:"gusu",birth:-559,death:-484,role:"minister",stats:{wu:82,zhi:88,zheng:80,mei:60},skills:{quanmou:8,bingfa:7,jianshu:6},bias:"yi",pref:"ma",teach:["quanmou","bingfa"],quote:"日暮途远，吾故倒行而逆施之。",desc:"楚之亡臣，父兄被戮，奔吴以谋复仇，终以吴师入郢。"},{id:"he_lu",name:"阖闾",title:"吴王",state:"wu",city:"gusu",birth:-560,death:-496,role:"ruler",stats:{wu:74,zhi:78,zheng:76,mei:70},skills:{bingfa:6,quanmou:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"吴虽僻远，愿与上图一争高下。",desc:"吴国之主，任伍胥、孙武，西破楚而入郢，东南之势成。"},{id:"fu_cha",name:"夫差",title:"吴王",state:"wu",city:"gusu",birth:-540,death:-473,role:"ruler",stats:{wu:80,zhi:62,zheng:58,mei:70},skills:{bingfa:6,jianshu:7},bias:"ming",pref:"yu",teach:["jianshu"],quote:"寡人岂敢忘越王之杀吾父耶！",desc:"吴国之主，夫椒胜越，黄池会盟，然矜功自伐，终为越所灭。"},{id:"gou_jian",name:"勾践",title:"越王",state:"yue",city:"kuaiji",birth:-520,death:-465,role:"ruler",stats:{wu:70,zhi:86,zheng:80,mei:66},skills:{quanmou:8,bingfa:5},bias:"shi",pref:"tie",teach:["quanmou"],quote:"卧薪尝胆，十年生聚，十年教训。",desc:"越国之主，败于夫椒而不屈，忍辱负重，终以三千越甲吞吴。"},{id:"fan_li",name:"范蠡",title:"越之上将军",state:"yue",city:"kuaiji",birth:-536,death:-448,role:"merchant",stats:{wu:56,zhi:94,zheng:88,mei:84},skills:{shanggu:10,quanmou:8,biancai:7,suanshu:8},bias:"li",pref:"yu",teach:["shanggu","suanshu","quanmou"],quote:"飞鸟尽，良弓藏；狡兔死，走狗烹。",desc:"越国谋臣，佐勾践灭吴，功成身退，浮海至陶，三致千金，号陶朱公。"},{id:"wen_zhong",name:"文种",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-472,role:"minister",stats:{wu:40,zhi:86,zheng:88,mei:72},skills:{quanmou:7,xuewen:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou","xuewen"],quote:"伐吴七术，越王用其三而吴灭。",desc:"越国大夫，与范蠡共佐勾践，灭吴之后不能去，终赐剑而死。"},{id:"ji_liang",name:"季梁",title:"随之贤大夫",state:"sui",city:"sui",birth:-720,death:-660,role:"minister",stats:{wu:38,zhi:88,zheng:84,mei:72},skills:{xuewen:7,quanmou:6,biancai:5},bias:"yi",pref:"yu",teach:["quanmou","xuewen"],quote:"夫民，神之主也。是以圣王先成民而后致力于神。",desc:"随国贤臣，谏随侯修政亲邻，以民为本，汉东赖之。"},{id:"liu_xiahui",name:"展获",title:"鲁之柳下惠",state:"lu",city:"fei",birth:-720,death:-621,role:"scholar",stats:{wu:40,zhi:84,zheng:80,mei:90},skills:{xuewen:8,biancai:6,quanmou:4},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"直道而事人，焉往而不三黜？",desc:"鲁之贤大夫，食邑柳下。坐怀不乱，三黜而不去，士人称其和。"},{id:"qu_wan",name:"屈完",title:"楚之大夫",state:"chu",city:"shen",birth:-700,death:-640,role:"minister",stats:{wu:54,zhi:84,zheng:78,mei:86},skills:{biancai:8,quanmou:5,bingfa:4},bias:"shi",pref:"ma",teach:["biancai","quanmou"],quote:"君若以德绥诸侯，谁敢不服？",desc:"楚之辩士，召陵之盟单车入齐师，以一言折诸侯之兵。"},{id:"yang_youji",name:"养由基",title:"楚之射师",state:"chu",city:"ying",birth:-640,death:-570,role:"general",stats:{wu:86,zhi:60,zheng:42,mei:58},skills:{sheshu:10,jianshu:6,bingfa:4},bias:"ming",pref:"ma",teach:["sheshu","jianshu"],quote:"去柳叶者百步而射之，百发而百中。",desc:"楚之善射者，百步穿杨，鄢陵之战中箭而死。"}],T=Object.fromEntries(de.map(e=>[e.id,e]))});var w,Mi,Cn,Ei,U=ne(()=>{w={su:{name:"粟",unit:"石",base:22,bulk:1},yan:{name:"盐",unit:"车",base:38,bulk:1},tie:{name:"铁",unit:"担",base:52,bulk:1},si:{name:"丝",unit:"匹",base:66,bulk:1},ma:{name:"马",unit:"匹",base:140,bulk:2},qi:{name:"漆",unit:"桶",base:44,bulk:1},yu:{name:"玉",unit:"双",base:210,bulk:1},ge:{name:"革",unit:"张",base:48,bulk:1}},Mi={luoyi:"yu",linzi:"yan",qufu:"si",jiang:"ma",handan:"tie",yong:"ma",ying:"qi",shangqiu:"ge",chaoge:"si",xinzheng:"yu",ji:"ge",gusu:"si",kuaiji:"tie",wanqiu:"ge",shangcai:"su",tao:"su",ju:"yan",zhu:"su",fei:"si",diqiu:"ge",quwo:"tie",pingyang:"ma",shen:"tie",xi:"qi",sui:"yu",qi2:"qi",pengcheng:"su",zhoulai:"ge",zhuji:"si",xu:"ge",linyi:"ma"},Cn={luoyi:{yu:1.35,si:1.15,yan:.95,ma:.9},linzi:{yan:.72,si:.95,tie:1.15,ma:1.1,yu:1.05},qufu:{si:.78,su:.95,yu:1.1,yan:1.1},jiang:{ma:.82,tie:.95,su:1,si:1.1,yan:1.15},handan:{tie:.78,ma:1.05,su:1,ge:1.05},yong:{ma:.8,tie:1.05,si:1.25,yan:1.2,yu:1.15},ying:{qi:.8,si:.95,yu:1.15,ma:1.15},shangqiu:{ge:.82,su:.95,tie:1.1,yu:1.1},chaoge:{si:.85,su:.9,yan:1.05,qi:1.1},xinzheng:{yu:.85,si:1,su:.95,tie:1.05},ji:{ge:.85,su:1.05,si:1.3,yan:1.25,tie:1.1},gusu:{si:.86,yan:1.2,yu:1.2,qi:1.1},kuaiji:{tie:.82,yan:1.25,si:1.25,su:1},wanqiu:{ge:.88,su:1,qi:1.1},shangcai:{su:.88,ge:1,ma:1.15},tao:{su:.86,si:1,yan:1.05,yu:1.12,ge:1},ju:{yan:.7,si:1.1,ma:1.05,su:1},zhu:{su:.88,ge:1.05,si:1.05},fei:{si:.82,su:.95,yu:1.1},diqiu:{ge:.85,su:1,yan:1.05,tie:1.05},quwo:{tie:.8,ma:1,su:1},pingyang:{ma:.8,tie:1.05,si:1.1},shen:{tie:.82,qi:1.1,yu:1.1,su:.98},xi:{qi:.85,su:.98,yu:1.05},sui:{yu:.86,si:1.05,qi:1.05},qi2:{qi:.86,yu:1.05,ma:1.08},pengcheng:{su:.86,ge:1,si:1.08},zhoulai:{ge:.88,yan:1.1,tie:1.1},zhuji:{si:.88,tie:1.1,yan:1.15},xu:{ge:.9,su:.95,yu:1.08},linyi:{ma:.85,ge:1.05,si:1.15}},Ei=(e,t)=>Cn[e]?.[t]??1});var he,Ue,Dt=ne(()=>{he=[{id:"ke_duan",year:-722,month:5,title:"郑伯克段于鄢",where:{state:"zheng"},body:"郑庄公之弟共叔段据京邑为乱，庄公命子封帅车二百乘伐京。京人叛段，段出奔共。",effects:[{t:"power",s:"zheng",v:4}],choices:[{label:"往观郑师军容",hint:"武艺或兵法可有所得",check:{k:"bingfa",dc:34},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:2}],fail:[{t:"fame",v:1}],text:"你混在人群里看郑军列阵，戈矛如林，鼓声不乱，颇有所悟。"},{label:"闭门不出",hint:"不涉是非",effects:[],text:"乱起于萧墙，你只作不知。"}]},{id:"zhou_huan",year:-720,month:3,title:"周平王崩",where:{state:"zhou"},body:"周平王崩于洛邑，孙林即位，是为桓王。王室益微，诸侯朝聘渐疏。",effects:[{t:"power",s:"zhou",v:-3}],choices:[{label:"赴洛邑观礼",hint:"结交王畿士人",effects:[{t:"fame",v:3},{t:"money",v:-20}],text:"你随众人在王城之外观礼，见鼎彝陈列，礼容肃穆，心生感慨。"},{label:"不往",hint:"",effects:[],text:"天子之丧，于你不过一则传闻。"}]},{id:"lu_yin_si",year:-712,month:11,title:"鲁隐公遇弑",where:{state:"lu"},body:"公子翚谮于隐公，求为太宰，不许，遂弑隐公于蒍氏，立桓公。鲁国自此多事。",effects:[{t:"power",s:"lu",v:-4}],choices:[{label:"暗中查访此事",hint:"权谋之试",check:{k:"quanmou",dc:46},success:[{t:"fame",v:4},{t:"skill",k:"quanmou",v:1}],fail:[{t:"health",v:-4}],text:"你在市井间探得蛛丝马迹，却也因此触了忌讳。"},{label:"不论国事",hint:"",effects:[],text:"鲁国之乱，非布衣所能置喙。"}]},{id:"xu_ge",year:-707,month:8,title:"繻葛之战",where:{state:"zheng"},body:"周桓王夺郑伯政，郑不朝。王以诸侯伐郑，战于繻葛。郑祝聃射王中肩，王师败绩。",effects:[{t:"power",s:"zhou",v:-6},{t:"power",s:"zheng",v:5}],choices:[{label:"从郑军观战",hint:"箭术与胆气",check:{k:"sheshu",dc:44},success:[{t:"fame",v:5},{t:"merit",v:10},{t:"skill",k:"sheshu",v:1}],fail:[{t:"health",v:-8}],text:"你随郑军左拒，见王师中军动摇，一箭之机，终身难忘。"},{label:"避于乡野",hint:"",effects:[{t:"health",v:2}],text:"兵锋之下，你避入乡野，听远处鼓声渐息。"}]},{id:"qi_huan_li",year:-685,month:1,title:"齐桓公即位",where:{state:"qi"},body:"公孙无知被杀，公子小白自莒先入齐，是为桓公。桓公不计射钩之仇，用鲍叔牙之荐，相管仲。",effects:[{t:"power",s:"qi",v:6},{t:"flag",k:"guan_zhong_相齐",v:!0}],choices:[{label:"赴临淄求见管仲",hint:"需在齐地，或有晋身之阶",effects:[{t:"rel",id:"guan_zhong",v:10},{t:"fame",v:2}],text:"你于相府门外候了半日，管仲乘车而出，瞥你一眼，命从者记下你的名字。"},{label:"观望齐国之变",hint:"",effects:[],text:"齐国内乱方定，你且看这新君如何行事。"}]},{id:"changshao",year:-684,month:6,title:"长勺之战",where:{state:"lu"},body:"齐师伐鲁，鲁庄公御之。曹刿请见，与公同乘，待齐人三鼓而后进，齐师败绩。",effects:[{t:"power",s:"lu",v:4},{t:"power",s:"qi",v:-3}],choices:[{label:"随鲁军听曹刿论战",hint:"兵法之试",check:{k:"bingfa",dc:40},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:3},{t:"rel",id:"cao_gui",v:8}],fail:[{t:"fame",v:1}],text:"曹刿按剑立于车右，曰「未可」，你屏息听着鼓声，第一次明白「气」字的分量。"},{label:"远远避兵",hint:"",effects:[{t:"stamina",v:-3}],text:"你避兵于山阜，看齐师车辙乱、旗靡，方知鲁人胜了。"}]},{id:"beixing",year:-681,month:4,title:"北杏之会",where:{state:"qi"},body:"齐桓公会宋、陈、蔡、邾于北杏，以平宋乱。诸侯始服齐，管仲之谋也。",effects:[{t:"power",s:"qi",v:4}],choices:[{label:"携礼往会",hint:"花费三十金，或得声名",effects:[{t:"money",v:-30},{t:"fame",v:5},{t:"rel",id:"bao_shuya",v:6}],text:"会盟之坛上，诸侯歃血为盟。你立于末席，看见齐侯的旌旗在风里招展。"},{label:"不入会是非",hint:"",effects:[],text:"诸侯会盟，与你一个布衣何干。"}]},{id:"qi_ba",year:-679,month:3,title:"齐桓公始霸",where:{state:"qi"},body:"齐桓公会诸侯于鄄，宋、陈、卫、郑皆至。齐遂为诸侯长，天下翕然宗之。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"献书于齐侯",hint:"学问或辩才",check:{k:"xuewen",dc:40},success:[{t:"fame",v:6},{t:"rel",id:"qi_huan",v:8}],fail:[{t:"fame",v:1}],text:"你陈说「尊王攘夷」之义，齐侯抚掌，命人将你的书简收于府中。"},{label:"不往",hint:"",effects:[],text:"霸主之名，起于会盟。"}]},{id:"shanrong",year:-664,month:5,title:"齐救燕",where:{state:"yan"},body:"山戎伐燕，燕告急于齐。齐桓公救燕，遂伐山戎，至于孤竹而还。燕君送齐侯出境，齐侯割燕君所至之地与燕。",effects:[{t:"power",s:"yan",v:3},{t:"power",s:"qi",v:2}],choices:[{label:"从齐师北伐山戎",hint:"武艺与胆略",check:{k:"sheshu",dc:46},success:[{t:"fame",v:5},{t:"merit",v:12},{t:"skill",k:"sheshu",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:1}],text:"北地苦寒，你随齐师穿过山谷，冻裂的手指终于拉开了一次弓。"},{label:"送燕侯一程",hint:"",effects:[{t:"rel",id:"yan_zhuang",v:8},{t:"fame",v:2}],text:"燕侯的车驾向北而去，你立于道旁，听他说「燕人不忘齐侯之德」。"}]},{id:"zhaoling",year:-656,month:7,title:"召陵之盟",where:{state:"chu"},body:"齐桓公率诸侯伐楚，责包茅不入。楚使屈完如师，齐侯陈诸侯之师与之观，屈完曰：「君若以德绥诸侯，谁敢不服？」遂盟于召陵。",effects:[{t:"power",s:"qi",v:4},{t:"power",s:"chu",v:-2}],choices:[{label:"为诸侯执笔盟辞",hint:"学问与辩才",check:{k:"xuewen",dc:48},success:[{t:"fame",v:8},{t:"skill",k:"biancai",v:1},{t:"money",v:60}],fail:[{t:"fame",v:2}],text:"盟辞一字之差，诸侯半日不决。你据《周礼》改定三字，遂定盟。"},{label:"旁观诸侯之师",hint:"",effects:[{t:"skill",k:"bingfa",v:1}],text:"八国之师阵列于召陵，你第一次见识何为「诸侯之师」。"}]},{id:"kuaiqiu",year:-651,month:8,title:"葵丘之会",where:{state:"song"},body:"齐桓公会诸侯于葵丘，周天子使宰孔赐胙，命齐侯无拜。齐侯下拜受赐，诸侯皆服。盟曰：毋雍泉，毋讫籴，毋易树子，毋以妾为妻。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"与会观礼",hint:"声名之会",effects:[{t:"money",v:-40},{t:"fame",v:8},{t:"rel",id:"qi_huan",v:6}],text:"坛上诸侯束牲载书，你听见齐侯一字一句念出盟辞。天下秩序，似乎就系于这几句话上。"},{label:"不入会",hint:"",effects:[],text:"霸主之会，往来皆卿相，与你无涉。"}]},{id:"hanyuan",year:-645,month:9,title:"韩原之战",where:{state:"qin"},body:"晋惠公背秦赂，秦穆公伐晋，战于韩原。晋惠公马陷泥中，为秦所俘。秦人欲杀之，穆公夫人以死请，乃归晋侯。",effects:[{t:"power",s:"qin",v:5},{t:"power",s:"jin",v:-4}],choices:[{label:"从秦军观战",hint:"兵法之试",check:{k:"bingfa",dc:50},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:4}],fail:[{t:"health",v:-8}],text:"你看见晋侯的战车陷在泥里，秦人的甲士一拥而上。战阵之间，胜负只在一瞬。"},{label:"劝秦伯勿杀晋侯",hint:"辩才之试",check:{k:"biancai",dc:52},success:[{t:"rel",id:"qin_mu",v:10},{t:"fame",v:6}],fail:[{t:"fame",v:1}],text:"你言「杀之则天下以秦为暴」，秦伯默然，最终归晋侯于绛。"}]},{id:"huan_gong_si",year:-643,month:10,title:"齐桓公卒",where:{state:"qi"},body:"管仲已卒，竖刁、易牙、开方用事。桓公病，五公子争立，宫中空虚，尸在床上六十七日，虫流出户。",effects:[{t:"power",s:"qi",v:-12},{t:"flag",k:"hegemon",v:""}],choices:[{label:"入宫收敛桓公",hint:"重义之举",effects:[{t:"fame",v:10},{t:"money",v:-50},{t:"rel",id:"bao_shuya",v:6}],text:"你与数名老臣入宫，掩上那扇久无人开的大门。一代霸主，终究不过一具尸骸。"},{label:"叹息而去",hint:"",effects:[{t:"fame",v:1}],text:"盛极而衰，你在临淄的市上听见这个消息，只觉得风吹得冷。"}]},{id:"hongshui",year:-638,month:11,title:"泓水之战",where:{state:"song"},body:"宋襄公伐郑，楚救之，战于泓。宋人既成列，楚人未济，目夷请击之，公曰不可。楚人济而未成列，又请击，公曰不可。既成列而后击之，宋师大败，公伤股。",effects:[{t:"power",s:"song",v:-6},{t:"power",s:"chu",v:3}],choices:[{label:"谏宋公半渡而击",hint:"兵法之试",check:{k:"bingfa",dc:44},success:[{t:"rel",id:"song_xiang",v:4},{t:"fame",v:5},{t:"skill",k:"bingfa",v:1}],fail:[{t:"fame",v:1}],text:"你引《军志》「先人有夺人之心」，宋公摇头不语，仍待楚人成列。"},{label:"预避于岸",hint:"",effects:[],text:"你在岸上看着宋军溃散，泓水被血染成暗红。"}]},{id:"chengpu",year:-632,month:4,title:"城濮之战",where:{state:"jin"},body:"晋文公伐曹卫以救宋，楚子玉帅师来战。晋师退避三舍，战于城濮。晋下军蒙马以虎皮先犯陈蔡，楚右师溃；狐毛设二旆而退，楚左师溃。楚师败绩。",effects:[{t:"power",s:"jin",v:8},{t:"power",s:"chu",v:-6},{t:"flag",k:"hegemon",v:"jin"},{t:"power",s:"song",v:2}],choices:[{label:"从晋中军，献策破楚",hint:"兵法之试，晋地可入",req:{state:"jin"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:60},{t:"fame",v:14},{t:"rel",id:"xian_zhen",v:12},{t:"skill",k:"bingfa",v:1}],fail:[{t:"health",v:-18},{t:"fame",v:3}],text:"你随先轸登车，望见楚右师阵脚已乱。战后清点军功，你的名字被记在竹简上。"},{label:"以辩才说楚子玉退兵",hint:"辩才之试，极难",check:{k:"biancai",dc:64},success:[{t:"fame",v:20},{t:"power",s:"jin",v:2},{t:"skill",k:"biancai",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:4}],text:"你单车入楚营，陈说利害。子玉怒而不听，你退出营门时，听见身后甲叶作响。"},{label:"避于他国",hint:"",effects:[{t:"stamina",v:-5}],text:"中原大战，你避于他国，只从行人口中听闻战况。"}]},{id:"xiao_zhi_zhan",year:-627,month:4,title:"殽之战",where:{state:"qin"},body:"秦穆公不听蹇叔之谏，遣孟明视等袭郑。郑商人弦高以牛十二犒师，秦师以为郑有备，灭滑而还。晋先轸伏兵于殽，秦师覆没。",effects:[{t:"power",s:"qin",v:-6},{t:"power",s:"jin",v:3},{t:"rel",id:"xian_gao",v:6}],choices:[{label:"随弦高犒秦师",hint:"在郑地，重义",req:{state:"zheng"},effects:[{t:"fame",v:12},{t:"rel",id:"xian_gao",v:14},{t:"money",v:-40},{t:"skill",k:"shanggu",v:1}],text:"你与弦高一同驱牛入秦营，自称郑君所遣。秦人按兵，郑国得免一劫。"},{label:"赴殽山吊唁秦师",hint:"",effects:[{t:"fame",v:3}],text:"殽山之间尸骨相枕，你与乡人掩埋了数十具尸骸。"}]},{id:"bi_zhi_zhan",year:-597,month:6,title:"邲之战",where:{state:"chu"},body:"楚庄王围郑，晋师救之，战于邲。晋中军先济，士卒争舟，舟中之指可掬。楚师大胜，饮马于河，遂霸中原。",effects:[{t:"power",s:"chu",v:8},{t:"power",s:"jin",v:-6},{t:"flag",k:"hegemon",v:"chu"}],choices:[{label:"从楚军，观其用兵",hint:"兵法之试，楚地",req:{state:"chu"},check:{k:"bingfa",dc:56},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:8},{t:"rel",id:"chu_zhuang",v:10}],fail:[{t:"health",v:-12}],text:"你立于楚王战车之侧，看他旌旗一动，三军如臂使指。"},{label:"救晋军溃卒",hint:"重义，可增名声",effects:[{t:"fame",v:8},{t:"health",v:-6},{t:"stamina",v:-10}],text:"你在河岸拉起十几个晋国溃卒，他们的手指都被舟楫削断。"}]},{id:"an_zhi_zhan",year:-589,month:6,title:"鞌之战",where:{state:"qi"},body:"齐顷公伐鲁卫，晋郤克帅师救之，战于鞌。齐侯轻敌，不介马而驰，为晋所败。齐侯几为俘，逢丑父易位以免之。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"qi",v:-4}],choices:[{label:"随晋军为御",hint:"御术与胆气",check:{k:"jianshu",dc:48},success:[{t:"merit",v:30},{t:"fame",v:6},{t:"skill",k:"jianshu",v:1}],fail:[{t:"health",v:-14}],text:"战车在泥泞里打着旋，你死死拉住缰绳，听见身后箭矢破空。"},{label:"不预其事",hint:"",effects:[],text:"齐晋之战，与你无涉。"}]},{id:"yanling",year:-575,month:6,title:"鄢陵之战",where:{state:"zheng"},body:"晋厉公伐郑，楚共王救之，战于鄢陵。晋将魏锜射中楚王目，楚师夜遁。养由基善射，一箭穿杨，然终不能挽楚之败。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"chu",v:-3}],choices:[{label:"与养由基比射",hint:"射术之试",check:{k:"sheshu",dc:58},success:[{t:"rel",id:"yang_youji",v:14},{t:"fame",v:10},{t:"skill",k:"sheshu",v:1}],fail:[{t:"fame",v:2},{t:"health",v:-4}],text:"百步之外的柳叶在风里颤。你射中了，养由基大笑，说「可教也」。"},{label:"救护伤卒",hint:"",effects:[{t:"fame",v:4},{t:"health",v:-3}],text:"你在战场上奔走，把伤卒一个一个拖到车下。"}]},{id:"mibing",year:-546,month:5,title:"弭兵之会",where:{state:"song"},body:"宋左师向戌奔走晋楚之间，合诸侯之大夫盟于宋。晋楚之从交相见，天下息兵。向戌辞邑，曰：「以靖小国，请免之。」",effects:[{t:"power",s:"song",v:5},{t:"flag",k:"mibing",v:!0}],choices:[{label:"为向戌执笔记盟",hint:"学问或辩才",check:{k:"xuewen",dc:52},success:[{t:"fame",v:14},{t:"rel",id:"xiang_xu",v:12},{t:"money",v:80}],fail:[{t:"fame",v:2}],text:"盟书凡七国，字字斟酌。向戌拍你的肩说：「天下自此少死许多人。」"},{label:"往观盟礼",hint:"",effects:[{t:"fame",v:4}],text:"诸侯之大夫会于宋，歃血之后，各自归国。"}]},{id:"zi_chan_si",year:-522,month:12,title:"子产卒",where:{state:"zheng"},body:"郑子产卒。孔子闻之，出涕曰：「古之遗爱也。」郑人相与哭于巷，三月不闻竽瑟之声。",effects:[{t:"power",s:"zheng",v:-5}],choices:[{label:"往新郑吊之",hint:"重义",effects:[{t:"fame",v:6},{t:"money",v:-20}],text:"你在子产之丧上，听见郑人哭声不绝。"},{label:"读其刑书而叹",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1}],text:"铸于鼎上的刑书，第一次让庶民知法之所在。"}]},{id:"baiju",year:-506,month:11,title:"柏举之战",where:{state:"wu"},body:"吴王阖闾用伍子胥、孙武之谋，五战入郢。楚昭王出奔，吴人入楚王宫。伍子胥掘楚平王墓，鞭尸三百。",effects:[{t:"power",s:"wu",v:10},{t:"power",s:"chu",v:-10}],choices:[{label:"从吴军入郢",hint:"在吴地，武艺或兵法",req:{state:"wu"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:50},{t:"fame",v:14},{t:"money",v:150},{t:"rel",id:"wu_zixu",v:10}],fail:[{t:"health",v:-16}],text:"五战五捷，吴师入郢。你站在楚王宫阶前，看伍子胥一言不发地走向平王墓。"},{label:"随楚人奔随",hint:"重义",effects:[{t:"fame",v:6},{t:"health",v:-8}],text:"你随楚昭王奔随，山路崎岖，王的车驾在身后只剩一点尘。"}]},{id:"zui_li",year:-496,month:5,title:"槜李之战",where:{state:"wu"},body:"越王允常卒，勾践立。吴王阖闾伐越，越人使死士三行，属剑于颈而自刭，吴师属目，越人因而袭之。阖闾伤指，还卒于陉。",effects:[{t:"power",s:"yue",v:6},{t:"power",s:"wu",v:-5}],choices:[{label:"救吴王于阵中",hint:"武艺之试",check:{         <li><b>说客</b>：三回合论辩。认同度初始 50，每轮从三项具体回应中选一：切中顾虑 +15、有道理 +5、回避 −10；思路合心性 +5、相悖 −5；每局可出示一次相关证据 +10。三轮后 ≥70 成功、40–69 妥协、<40 失败。心性固定可见，三回合中不会改变。成则名声与盟约俱增。</li>
        <li><b>学者</b>：设坛讲学收弟子，著书立说成一家；亦可与名士论辩。</li>
      </ul>

      <div class="section-title">时日与技艺</div>
      <p>一切行事皆耗时日与体力。修习为时机小游戏：光标落入朱色区间时按「止」。城中校场、学宫、市肆各有所长，
      在其地修习可得地利。技艺十级为满，名声、爵位、金钱与弟子数决定结局评价。</p>

      <div class="section-title">交游与差事</div>
      <p>城中人物可交谈、赠礼、问学、切磋、论辩。交情二十五以上可请教学艺，五十二以上为知己，七十五以上为挚友。
      榜文上的差事分「出行」与「即办」两类：出行须在限期之内抵达目的地，运货类还须自备货物。</p>

      <div class="section-title">论辩</div>
      <p>论辩共三回合，认同度从 50 开始。每轮对方提出一个具体顾虑，你从三个回应中选择：
      切中顾虑 +15，有道理但未解决 +5，回避或触忌 −10；回应思路若合对方心性再 +5，相悖则 −5。
      每局可出示一次证据，只在对应顾虑时有效，+10，用错不消耗。三轮后 ≥70 说服成功、40–69 达成妥协、低于 40 失败。
      50 个场景覆盖内政、邦交、军事、朝堂、商贸；妥协时有权限的对象会追加后续差事，降将、平民等则不会。</p>

      <div class="section-title">官阶与五等爵</div>
      <p>游侠、说客、学者可出仕（商人无仕途）。名声达到 8 后，往有「朝廷」的都城点「谒见国君」，
      成算取决于政略、魅力、名声与辩才；失败后须等十日。也可与卿相结好至交情 50，请其「举荐」直接入仕。</p>
      <p>出仕后获得的是<b>官阶</b>：士 → 中士 → 上士 → 大夫 → 中大夫 → 上大夫 → 卿 → 执政，
      每月初按功勋升一级，并按官阶领取月俸。</p>
      <p><b>爵位</b>是另一套五等爵：男 → 子 → 伯 → 侯 → 公，由周天子册命。官阶至卿、执政且功勋与名声达标后，
      可往洛邑领受「<b>册命之试</b>」：每级爵位有三道专属试炼（围捕/折冲/治邑/军略/定礼），
      完成后方可请封。请封按试炼评价计算成算，未准则名声小损、贽礼退半，并另命新试；
      累计五次未准后，第六次必得册命。受封后另有食邑月入，并计入结局评价。列国国君亦各有其爵：宋公、齐侯、郑伯、楚子、许男等。</p>
      <p style="color:#6d6052;font-size:13px">按史实，五等爵本为诸侯之封，卿大夫多以采邑为食；本作把「周室衰微、以功册命」作为演绎，
      让玩家也能由男爵累进至公爵。官阶（士→执政）则对应卿、大夫、士的官职体系。</p>

      <div class="section-title">操作</div>
      <p>顶栏切换舆图、城中、人物、差事、交游、名鉴、存档。舆图上点击城邑可见路程与国势，再点「启程前往」。
      修习时可按 <kbd>空格</kbd> 代替「止」，<kbd>Esc</kbd> 关闭弹窗。存档可导出为文本备份。</p>

:{money:70,fame:4,merit:6}}),x("meeting","会盟争长","diplomacy","ming",!0,"大夫","掌礼","诸侯会盟，谁先歃血谁为长。大夫想争，又怕得罪晋楚。",[u("晋楚都比我们强，争这个盟主之位，值得吗？",o("ming","hit","不求盟主，只求史册记明我国未曾屈从。","大夫点头：「留名而不争实，倒也体面。」"),o("shi","reason","可联合几个小国，先造成既成事实。","他说：「小国靠得住吗？风一吹就散。」"),o("yi","evade","盟主之位，本就该由天子册命。","他叹：「天子若管用，就不会有这会盟了。」")),u("小国们都在观望，怎样才能让他们站到我们这边？",o("ming","hit","许他们在盟书中列名，共享盟约之利。","大夫道：「有名有利，他们自然会来。」"),o("li","reason","给些粮布，先把人请来再说。","他摇头：「给得越多，他们越觉得我们心虚。」"),o("yi","evade","以诚待人，他们总能看见。","他苦笑：「会盟场上，诚字最不值钱。」")),u("若晋楚联手施压，要我们放弃争长，怎么下台？",o("ming","hit","可退一步，但要求由我们执笔记盟，掌盟书之权。","大夫目光一亮：「执笔之人，往往比盟主更要紧。」"),o("shi","reason","先答应，回头再在盟辞上做文章。","他皱眉：「做文章也要有人撑腰。」"),o("yi","evade","大不了一走了之，不与他们同流合污。","他反问：「走了之后呢？他们照样盟。」"))],k("会盟旧档",1,"你出示旧档：某次会盟，执笔者认为盟辞有误，迫诸侯重议。"),{success:"会盟之上，我国不亢不卑，声名大振。",compromise:"大夫同意争长，但要你先行筹备会盟事宜。",fail:"争长失败，诸侯轻视我国。"},{success:{fame:8,rel:5},compromise:{fame:3,rel:2},fail:{fame:-4,rel:-3}},{title:"筹备会盟",desc:"大夫命你前往洛邑，筹备会盟的礼仪与盟书。",mode:"travel",targetCity:"luoyi",days:24,reward:{money:80,fame:5,merit:8}}),x("tribute","朝贡天子","diplomacy","yi",!0,"国君","国君","天子虽微，朝贡之礼不可废。国君既怕贡物不足，又怕路上被盗。",[u("府库不丰，贡物拿不出手，天子会不会怪罪？",o("yi","hit","贡物不在厚薄，而在诚敬，可附一封陈情表。","国君点头：「礼轻情重，天子或能体谅。」"),o("li","reason","向富商借一批珍货，回来自会还上。","他叹：「借来的贡物，终究是债。」"),o("ming","evade","从前齐侯朝周，也只献了几车鱼盐。","他反问：「齐侯有几车鱼盐，我们有什么？」")),u("路上盗匪横行，贡物被劫，颜面何存？",o("yi","hit","轻车简从，贡物分装，纵被劫也不至全失。","国君道：「分装而行，是个办法。」"),o("shi","reason","派一队甲士护送，寻常盗匪不敢动手。","他说：「甲士一动，沿途诸侯便知道贡物贵重。」"),o("ming","evade","打着天子旗号，盗匪总不敢冒犯。","他苦笑：「盗匪若怕天子，就不做盗匪了。」")),u("天子若收下贡物却不给好脸色，这趟岂不是白跑？",o("yi","hit","朝贡本为守礼，不为邀宠，天子如何，是天子的事。","国君肃然：「这话说得好，寡人受教。」"),o("ming","reason","可请随行史官将朝贡之事记入史册。","他点头：「史册一记，便不白走。」"),o("li","evade","天子总要给些回赐，不会让我们吃亏。","他叹：「回赐？如今天子比我们还穷。」"))],k("贡道图",1,"你出示贡道图：绕行南阳可避开盗匪最盛的一段。"),{success:"朝贡成礼，天子嘉许，诸侯侧目。",compromise:"国君同意朝贡，但要你负责押运贡物。",fail:"贡物被劫，天子震怒，国君蒙羞。"},{success:{fame:6,rel:5},compromise:{fame:2,rel:3},fail:{fame:-4,rel:-4}},{title:"押运贡物",desc:"国君命你押运贡物前往洛邑，绕行南阳。",mode:"travel",targetCity:"luoyi",days:22,reward:{money:60,
