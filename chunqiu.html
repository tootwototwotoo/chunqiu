"师旷曰：「君可与言乐矣。」",compromise:"师旷曰：「君之言，可采。」",fail:"师旷曰：「君未知音。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shikuang_guang","盲而听政","court","ming",!1,"师旷","晋之乐师","师旷目盲，而晋国之政，多所匡正。或问：「盲者何以知政？」",[r("目盲而能知政，其道何在？",t("ming","hit","目盲则耳聪，耳聪则听其言而察其心。言之诚伪，无不见。","师旷曰：「此吾之所以能也。」"),t("li","reason","目者见事，耳者听言。舍目而恃耳，未尽也。","师旷曰：「臣非瞽也，盲于目耳。」"),t("yi","evade","知政在德，不在耳目。","师旷曰：「国有大政，臣与闻焉。」")),r("君有过，当直谏乎？抑或婉讽？",t("yi","hit","直谏则君怒，婉讽则君悟。吾取婉讽。","师旷曰：「此吾之所以托于乐也。」"),t("li","reason","当直谏。婉讽则言不达。","师旷曰：「臣非不直也，直而无益。」"),t("ming","evade","二者皆谏，视君之性。","师旷曰：「君之声不和。」")),r("盲者听政，其弊安在？",t("ming","hit","弊在偏听。故必兼听众，不以一耳为断。","师旷曰：「此吾之所以慎也。」"),t("li","reason","弊在不见其事，徒听其言。","师旷曰：「臣非瞽也，盲于目耳。」"),t("yi","evade","弊在自信太过。","师旷曰：「国有大政，臣与闻焉。」"))],null,{success:"师旷曰：「君可与言谏矣。」",compromise:"师旷曰：「君之言，得半。」",fail:"师旷曰：「君未达谏之难。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},am={theme:"疾与政",intro:"医和视晋平公疾，曰：「疾不可为也，是谓近女室，疾如蛊。」",debates:[f("v_yihe_gu","疾如蛊","court","yi",!0,"医和","秦之良医","晋平公疾。医和视之，曰：「疾不可为也。是谓近女室，疾如蛊，非鬼非食，惑以丧志。」",[r("非鬼非食，惑以丧志。君以为何疾？",t("yi","hit","是贪欲之疾。惑其志而无节，非药石所能攻。","医和曰：「此吾所谓蛊也。」"),t("li","reason","鬼与食皆有其因。当先辨其所由。","医和曰：「非鬼非食。」"),t("ming","evade","疾之成，皆由数，何必深究？","医和曰：「良臣将死，天命不佑。」")),r("有良臣而不任用，其疾为何？",t("yi","hit","此亦蛊也。惑于私而不悟，虽有良臣，不能用。","医和曰：「此吾所以言良臣也。」"),t("li","reason","疾在身，不在政。二者不可混。","医和曰：「不穀之疾，虽以蛊名之，然其本在惑。」"),t("shi","evade","医者视疾，不必论政。","医和曰：「疾如蛊。」")),r("疾在骨髓，虽良医何为？",t("yi","hit","医者治未病。既入骨髓，则非医之罪，乃主之过。","医和曰：「此吾所以言疾不可为也。」"),t("li","reason","当尽力施治。医者不可先言不治。","医和曰：「疾不可为也。」"),t("ming","evade","生死有命，医者听之。","医和曰：「非鬼非食，惑以丧志。」"))],k("晋平公脉案",1,"你呈上脉案：六脉俱虚，而肝脉独盛。"),{success:"医和曰：「君可与言医道矣。」",compromise:"医和曰：「君之言，有可取。」",fail:"医和曰：「君未见其本。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yihe_yi","医与政","court","yi",!1,"医和","秦之良医","医和曰：「上医医国，其次疾人。固医官也。」",[r("上医医国，其说如何？",t("yi","hit","国之有政，如身之血脉。血脉壅则病，政令壅则乱。","医和曰：「此吾所谓医国也。」"),t("li","reason","医者医身，政者治国。术不同，不可混。","医和曰：「医官之职，不唯疾人。」"),t("ming","evade","医国之名，近于夸。","医和曰：「上医医国。」")),r("六气之淫，可为疾。政之淫，何以治之？",t("yi","hit","节之。阴淫寒疾，阳淫热疾，风淫末疾。政之淫亦然，以礼节之。","医和曰：「善哉！君知节矣。」"),t("li","reason","政之淫则以法理之，不必比之六气。","医和曰：「阴阳风雨晦明，其过则为菑。」"),t("shi","evade","政之得失，非医师所能知。","医和曰：「天有六气，降生五味。」")),r("医国与医人，其术可通乎？",t("yi","hit","可通。皆在察其本而调其偏。","医和曰：「上医医国，其次疾人，固医官也。」"),t("li","reason","不可通。国与身，理不同。","医和曰：「医官之职，不唯疾人。」"),t("ming","evade","名同理异，不必强合。","医和曰：「天有六气，降生五味。」"))],null,{success:"医和曰：「君可与言医国矣。」",compromise:"医和曰：「君之言，可采。」",fail:"医和曰：「君犹分医与政为二。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},sm={theme:"巧与义",intro:"公输般为楚造云梯之械，将以攻宋。",debates:[f("v_gongshu_yunti","云梯","military","shi",!0,"公输般","鲁之巧匠","公输般为楚造云梯之械成，将以攻宋。墨子闻之，见公输般。",[r("造器以攻人国，君以为义乎？",t("shi","hit","匠人之职在成器，不在用器。器之用于义，则在君。","公输般曰：「吾固不欲攻宋。」"),t("yi","reason","器既成而用于攻，则匠者与有责焉。","公输般曰：「不可，吾既已言之王矣。」"),t("li","reason","受人之禄，忠人之事。不必问义。","公输般曰：「诺。」")),r("君之巧，可为舟车以利民，何必为攻具？",t("yi","hit","巧者无善恶，其用有善恶。君能移其巧于民，则功在百世。","公输般曰：「此吾之所未思也。」"),t("shi","reason","攻具亦国之所需。非专为攻人也。","公输般曰：「不可，吾既已言之王矣。」"),t("ming","evade","巧之所在，随人而施。","公输般曰：「诺。」")),r("九攻九距，君之械尽。今将如何？",t("shi","hit","械尽而攻城不下，则当止。器不能胜备，攻徒伤众。","公输般曰：「吾知所以距子矣。」"),t("li","reason","当再思新械，必破其城。","公输般曰：「不可。」"),t("yi","evade","战之成败，非匠者所主。","公输般曰：「诺。」"))],k("云梯图",1,"你呈上云梯图：钩援临冲，九攻之具。"),{success:"公输般曰：「君可与言巧矣。」",compromise:"公输般曰：「君之言，有可取。」",fail:"公输般曰：「君之说，非匠者之职。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_gongshu_qiao","巧之极","court","shi",!1,"公输般","鲁之巧匠","公输般削竹木以为鹊，成而飞之，三日不下。",[r("木鹊飞三日，可谓巧乎？",t("shi","hit","可以为巧，未可以为功。不如为车輗，可以任重致远。","公输般曰：「此墨翟之言也。」"),t("ming","reason","巧至此，人不能及。何论功？","公输般曰：「巧者，吾之所长也。」"),t("li","reason","无用之巧，费日耗财。","公输般曰：「不然。」")),r("巧匠与圣人，孰重？",t("yi","hit","巧匠成器，圣人成俗。器可以利一时，俗可以化百世。","公输般曰：「此吾之所未及。」"),t("shi","reason","巧匠之功可见，圣人之功难征。匠为重。","公输般曰：「巧固吾之长也。」"),t("ming","evade","二者各有所长，不必相较。","公输般曰：「吾之巧，岂虚也哉？」")),r("巧而有用，与巧而无用，孰取？",t("shi","hit","取有用。巧而无用，虽奇何益？","公输般曰：「此墨翟之言也。」"),t("ming","reason","取无用以见巧。巧之为巧，正在其无用。","公输般曰：「巧者，吾之所长也。」"),t("li","reason","二者皆取。有用者以养民，无用者以见道。","公输般曰：「不然。」"))],null,{success:"公输般曰：「君可与言巧矣。」",compromise:"公输般曰：「君之言，半是。」",fail:"公输般曰：「君未知巧之难。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},nm={theme:"优谏",intro:"优孟，故楚之乐人也。长八尺，多辩，常以谈笑讽谏。",debates:[f("v_youmeng_yiguan","衣冠谏王","court","ming",!1,"优孟","楚之优人","楚相孙叔敖死，其子穷困。优孟着孙叔敖衣冠，抵掌谈语，岁余，像孙叔敖。",[r("以优人之身，效相国之仪，不惧乎？",t("ming","hit","优者，言之无罪，闻之者足以戒。此吾之所以敢也。","优孟曰：「此吾之所以为优也。」"),t("li","reason","僭拟大臣，罪当死。","优孟曰：「臣请以臣之身，效孙叔敖。」"),t("yi","evade","戏耳，何罪之有？","优孟曰：「楚相不足为也。」")),r("孙叔敖为相尽忠，而其后穷困。君以为何如？",t("ming","hit","相国廉洁，故家贫。此正可为王言之。","优孟曰：「楚相不足为也！」"),t("yi","reason","忠臣之后当有恤。此国之义也。","优孟曰：「其子穷困负薪。」"),t("li","evade","身后之事，非相国所虑。","优孟曰：「马者畜也，何与人同礼？」")),r("优人之言，何以能入？",t("ming","hit","以其戏也。戏则言之无罪，闻者足以戒。","优孟曰：「此吾之所以为优也。」"),t("yi","reason","以其忠也。忠则言虽戏而意正。","优孟曰：「楚相不足为也。」"),t("li","reason","以君之乐也。乘其乐而言，易入。","优孟曰：「臣请以人君礼葬之。」"))],null,{success:"优孟曰：「君可与言讽矣。」",compromise:"优孟曰：「君之言，可采。」",fail:"优孟曰：「君未达讽谏之妙。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youmeng_xiao","谈笑讽谏","court","ming",!1,"优孟","楚之优人","楚庄王有爱马，衣以文绣，置之华屋，以枣脯养之。马病肥死，欲以棺椁大夫礼葬之。",[r("葬马以大夫之礼，可乎？",t("ming","hit","不可。请以人君礼葬之，使诸侯闻之，皆知大王贱人而贵马。","优孟曰：「此吾之所以谏也。」"),t("yi","reason","王之所爱，厚葬之，亦人情。","优孟曰：「以大夫礼葬之，薄。」"),t("li","reason","马者畜也，不可与人同礼。","优孟曰：「请以人君礼葬之。」")),r("直谏与讽谏，孰善？",t("ming","hit","讽善于直。直则君怒而事不济，讽则君笑而事自改。","优孟曰：「此吾之所以为优也。」"),t("yi","reason","直谏为忠。讽则近于戏，非人臣正道。","优孟曰：「臣请以人君礼葬之。」"),t("shi","evade","视君之性而择之。","优孟曰：「王曰：寡人之过，一至此乎！」")),r("人主之过，其始皆微。何以及于大？",t("ming","hit","以其无人敢言也。言路既塞，一言之过遂成国之祸。","优孟曰：「此吾之所以谏也。」"),t("li","reason","以其渐也。渐则不觉，久而不可返。","优孟曰：「请以人君礼葬之。」"),t("yi","evade","过之大小，皆其自取。","优孟曰：「王曰：寡人之过，一至此乎！」"))],null,{success:"优孟曰：「君可与言谏矣。」",compromise:"优孟曰：「君之言，半是。」",fail:"优孟曰：「君犹重直而轻讽。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},om={theme:"知音",intro:"伯牙鼓琴，钟子期听之。志在高山，志在流水。",debates:[f("v_boya_zhixin","高山流水","court","ming",!1,"伯牙","善琴者","伯牙鼓琴，志在高山。钟子期曰：「善哉，峨峨兮若泰山！」",[r("琴声何以及于高山流水？",t("ming","hit","声者，心之迹也。心在高山，则声自巍峨。","伯牙曰：「此吾之所以鼓也。」"),t("li","reason","声者物理，山者形势，二者不相关。","伯牙曰：「善哉，洋洋兮若江河！」"),t("yi","evade","心有所寄，则声有所示。","伯牙曰：「吾于何逃声哉？」")),r("知音既死，鼓琴何为？",t("ming","hit","破琴绝弦，终身不复鼓。无知音则声无所归。","伯牙曰：「此吾之所以破琴也。」"),t("li","reason","琴者自娱，何必待人知？","伯牙曰：「终身不复鼓琴。」"),t("yi","evade","知与不知，于琴无损。","伯牙曰：「吾于何逃声哉？」")),r("知音难遇，君以为可求乎？",t("ming","hit","不可求。遇则遇矣，求之反失。","伯牙曰：「此吾之所以破琴也。」"),t("li","reason","可求。广其交游，自有知者。","伯牙曰：「终身不复鼓琴。」"),t("yi","evade","遇与不遇，皆有其数。","伯牙曰：「吾于何逃声哉？」"))],null,{success:"伯牙曰：「君知音矣。」",compromise:"伯牙曰：「君之言，可采。」",fail:"伯牙曰：「君未知声之所出。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_boya_ting","听音辨事","court","ming",!1,"伯牙","善琴者","伯牙学琴于成连，三年而成。至于精神寂寞，情之专一，未能得也。",[r("琴之至，在技乎？在心乎？",t("ming","hit","在心。技可以学，心不可以授。","伯牙曰：「此吾之所以从成连也。」"),t("li","reason","无技则心无所寄。当先精其技。","伯牙曰：「吾师之教我也。」"),t("yi","evade","技与心，皆不可偏废。","伯牙曰：「善哉，鼓琴者。」")),r("移情于海，遂成绝技。其说可信乎？",t("ming","hit","可信。闻海水之震荡，山林之杳冥，而心与之化。","伯牙曰：「此吾之所以成也。」"),t("li","reason","技在指，不在山水。此近于虚。","伯牙曰：「吾之琴，遂为天下妙。」"),t("shi","evade","成与不成，皆有其数。","伯牙曰：「先生将移我情。」")),r("技成而心不至，何以处之？",t("ming","hit","弃其技而养其心。心至则技自至。","伯牙曰：「此吾之所以从成连也。」"),t("li","reason","当益精其技。技精则心自至。","伯牙曰：「吾师之教我也。」"),t("yi","evade","二者交养可也。","伯牙曰：「善哉，鼓琴者。」"))],null,{success:"伯牙曰：「君可与言琴矣。」",compromise:"伯牙曰：「君之言，半得。」",fail:"伯牙曰：「君犹求于指。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},rm={theme:"天地之气",intro:"苌弘，周之史官，通天地之气。",debates:[f("v_changhong_qi","天地之气","court","ming",!1,"苌弘","周之史官","晋有分野之灾，苌弘曰：「天地之气，不失其序。」",[r("天地之气，可推而知乎？",t("ming","hit","可。气有常数，过则为灾。察其过而预为之备。","苌弘曰：「此吾之所以能言也。」"),t("li","reason","气者虚也，何可推？","苌弘曰：「天地之气，不失其序。」"),t("yi","evade","知其序者，唯圣人。","苌弘曰：「若过其序，民乱之也。」")),r("阳伏而不能出，阴迫而不能烝，于是有地震。君以为然乎？",t("ming","hit","然。此阴阳之常，非妖也。知者不惧，唯备之。","苌弘曰：「此吾所谓气也。」"),t("yi","reason","地震者，天示也。当修德以应之。","苌弘曰：「其所以为灾者，皆有其序。」"),t("shi","evade","震与不震，皆有其数。","苌弘曰：「天地之气，不失其序。」")),r("气之过，可预知其灾乎？",t("ming","hit","可。察其序之失常，则知灾之所自。","苌弘曰：「此吾之所以能言也。」"),t("yi","reason","不可。天意难测，唯修德以待。","苌弘曰：「天地之气，不失其序。」"),t("li","reason","不必知。备之则灾不至。" 谷，以军养军，再向豪商籴买余粮。",reply:"国君点头：「屯田是长久之计，籴粮可解眼前。」"},{tag:"shi",level:"reason",text:"先发兵威，逼邻国输粮，以战养战。",reply:"国君皱眉：「以战养战，胜了还好，败了呢？」"},{tag:"yi",level:"evade",text:"加赋于民，令百姓节衣缩食以奉军。",reply:"国君叹道：「军粮有了，民心却要散了。」"}]},{id:"scholars",q:"士人非议朝政，清议汹汹，君将何以处之？",options:[{tag:"ming",level:"hit",text:"开言路、纳谏诤，择其善者而行，清议自平。",reply:"国君笑道：「让他们说，说得对的寡人照办。」"},{tag:"yi",level:"reason",text:"兴学宫、养士人，以教化导之。",reply:"国君点头：「教化是根本，只是见效慢些。」"},{tag:"shi",level:"evade",text:"禁止聚议，为首者治罪。",reply:"国君冷声道：「堵得住嘴，堵得住人心吗？」"}]},{id:"flood",q:"秋汛将至，河堤年久失修，君将何以处之？",options:[{tag:"li",level:"hit",text:"分段修堤，以工代赈，既固河防又安流民。",reply:"国君目光一亮：「以工代赈，一举两得。」"},{tag:"yi",level:"reason",text:"迁低地之民于高处，先保人命，再议修堤。",reply:"国君叹道：「迁民也是难事，但总比死人强。」"},{tag:"ming",level:"evade",text:"祭河祈安，上天自会护佑。",reply:"国君反问：「若上天不佑，谁来担这个责？」"}]},{id:"talent",q:"朝中乏才，政事壅滞，君将何以取士？",options:[{tag:"yi",level:"hit",text:"举寒门、试以事，不问出身，唯才是举。",reply:"国君抚掌：「英雄不问出处，正合寡人之意。」"},{tag:"ming",level:"reason",text:"依乡里清议与旧制荐举，稳重为上。",reply:"国君沉吟：「旧制稳妥，却怕漏了真才。」"},{tag:"li",level:"evade",text:"任用亲族，至少忠心可保。",reply:"国君冷笑：「忠心而无才，只会误事。」"}]},{id:"diplomacy",q:"诸侯会盟在即，君欲争一时之先，当以何策？",options:[{tag:"shi",level:"hit",text:"先联近邻、陈兵于会，以势压诸侯，再定盟约。",reply:"国君点头：「有势可恃，盟辞才有人听。」"},{tag:"yi",level:"reason",text:"以信义相召，让诸侯自愿推我为长。",reply:"国君叹道：「信义虽好，会盟场上还是看实力。」"},{tag:"ming",level:"evade",text:"多送礼物，买通各国大夫。",reply:"国君皱眉：「买来的盟，明日就能被别人买走。」"}]},{id:"oath",q:"诸侯背弃旧盟，边邑已起争端，君将何以处之？",options:[{tag:"ming",level:"hit",text:"会诸侯于旧盟之地，重订盟书，使背盟者无所遁形。",reply:"国君点头：「先把道理摆在诸侯面前。」"},{tag:"yi",level:"reason",text:"先遣使责以大义，彼若知愧，兵戈可免。",reply:"国君叹道：「义责要有兵威作后盾才管用。」"},{tag:"li",level:"evade",text:"许以边市之利，换他退兵。",reply:"国君反问：「今日许利，明日他再进一步呢？」"}]},{id:"plague",q:"灾后疫气流行，医者不足，君将何以处之？",options:[{tag:"yi",level:"hit",text:"征召良医、设隔离之所，官给汤药，先救疫区。",reply:"国君颔首：「先救人，再谈其余。」"},{tag:"li",level:"reason",text:"拨款购药，命各乡上报病户。",reply:"国君道：「钱要花，可谁来管这些药？」"},{tag:"shi",level:"evade",text:"封锁疫区，禁止出入。",reply:"国君皱眉：「封得住人，封不住疫气。」"}]},{id:"saltiron",q:"盐铁之利尽归豪商，府库日虚，君将何以处之？",options:[{tag:"li",level:"hit",text:"官营盐铁，设官榷税，余利仍许商人经营。",reply:"国君目光一亮：「官商分利，倒不至于竭泽。」"},{tag:"shi",level:"reason",text:"派兵查封私盐，杀一儆百。",reply:"国君沉吟：「查得了一时，查不了天下。」"},{tag:"yi",level:"evade",text:"与民争利非仁政，不如听其自然。",reply:"国君反问：「府库空了，仁政拿什么行？」"}]},{id:"luxury",q:"宗室竞相奢靡，用度逾制，君将何以处之？",options:[{tag:"ming",level:"hit",text:"申明礼制，按爵定用，逾制者夺其封邑。",reply:"国君点头：「先立规矩，再谈罚。」"},{tag:"yi",level:"reason",text:"以俭德示范，劝其自省。",reply:"国君苦笑：「寡人节俭，他们照旧。」"},{tag:"li",level:"evade",text:"削减宗室俸禄，充作军费。",reply:"国君摇头：「削俸只会逼他们另寻财路。」"}]},{id:"warlord",q:"边将拥兵自重，诏令不行，君将何以处之？",options:[{tag:"shi",level:"hit",text:"调其部曲、换其防区，以粮饷节制其兵。",reply:"国君低声道：「不动刀兵而削其权，最好。」"},{tag:"ming",level:"reason",text:"召其入朝，加官进爵，留在身边。",reply:"国君沉吟：「他若不肯来呢？」"},{tag:"yi",level:"evade",text:"以忠义相责，令其自请解兵。",reply:"国君反问：「他若有忠义，就不会拥兵了。」"}]},{id:"waterfight",q:"两邑争水，械斗将起，君将何以处之？",options:[{tag:"ming",level:"hit",text:"查旧渠碑与纳赋册，按田亩定水，立石为界。",reply:"国君点头：「有碑有册，才好断。」"},{tag:"li",level:"reason",text:"令两邑共修新渠，按出工分水。",reply:"国君道：「修渠是好事，可远水难救近火。」"},{tag:"yi",level:"evade",text:"令乡老自行调解，官府不必插手。",reply:"国君叹道：「调得成，就不会打到县衙来了。」"}]},{id:"clan_talent",q:"世族把持朝位，寒士无由进身，君将何以处之？",options:[{tag:"yi",level:"hit",text:"设策问、试以事，寒士与世族同场比试。",reply:"国君目光一亮：「同场比试，世族也无话可说。」"},{tag:"shi",level:"reason",text:"另立新军、新府，绕开世族旧衙门。",reply:"国君沉吟：「另起炉灶，也需钱粮。」"},{tag:"ming",level:"evade",text:"依乡里清议荐举，自然会有贤才。",reply:"国君反问：「清议还不是世族说了算？」"}]},{id:"punishment",q:"刑罚过滥，狱中多冤，君将何以处之？",options:[{tag:"ming",level:"hit",text:"亲录囚徒，疑罪从轻，择贤者为司寇。",reply:"国君颔首：「亲录囚徒，至少能少几桩冤案。」"},{tag:"yi",level:"reason",text:"修订刑律，明定轻重，使民知所避就。",reply:"国君道：「律要修，可眼下牢里已经满了。」"},{tag:"shi",level:"evade",text:"严刑峻法，使奸人不敢犯。",reply:"国君反问：「严到百姓不敢申冤，也算治世？」"}]},{id:"granary",q:"官仓账实不符，仓吏称损耗，君将何以处之？",options:[{tag:"li",level:"hit",text:"突击盘仓、对账，亏空者连坐赔偿。",reply:"国君点头：「对账连坐，仓吏才不敢伸手。」"},{tag:"ming",level:"reason",text:"遣御史巡查，公开账目于市。",reply:"国君沉吟：「公开是好事，御史肯不肯得罪人？」"},{tag:"yi",level:"evade",text:"申饬仓吏，令其自行补足。",reply:"国君冷笑：「自己补？那还是从仓里拿。」"}]},{id:"monopoly",q:"大商垄断市货，小贩无以为生，君将何以处之？",options:[{tag:"li",level:"hit",text:"设官市平价、限大户囤积，小贩可入市。",reply:"国君点头：「给小人一条活路，市面才稳。」"},{tag:"shi",level:"reason",text:"派兵查抄囤货，罚其重金。",reply:"国君皱眉：「抄了这家，别家还会囤。」"},{tag:"ming",level:"evade",text:"表彰义商，劝其让利。",reply:"国君反问：「义商有几个？」"}]},{id:"military_award",q:"军功赏罚不明，将士离心，君将何以处之？",options:[{tag:"ming",level:"hit",text:"当众核验军功簿，按功行赏，虚报者治罪。",reply:"国君颔首：「公开核功，才服众。」"},{tag:"yi",level:"reason",text:"厚待阵亡者家属，以慰军心。",reply:"国君叹道：「抚恤要做，可活着的功劳也不能含糊。」"},{tag:"shi",level:"evade",text:"加重军法，退缩者斩。",reply:"国君反问：「只罚不赏，谁还肯向前？」"}]},{id:"heir",q:"太子失教，近臣阿谀，君将何以处之？",options:[{tag:"yi",level:"hit",text:"择端方之士为傅，令太子习礼知民。",reply:"国君点头：「师傅选对了，比什么都强。」"},{tag:"ming",level:"reason",text:"令太子参与朝会，使知政事。",reply:"国君沉吟：「旁听容易，肯不肯听进去？」"},{tag:"li",level:"evade",text:"多给俸邑，使其安享富贵。",reply:"国君反问：「安享富贵，就能当好国君吗？」"}]},{id:"famine_neighbor",q:"邻国大饥，遣使求籴，君将何以处之？",options:[{tag:"yi",level:"hit",text:"平价粜粮，并附盟书，使邻国记此恩义。",reply:"国君颔首：「既救人，也结一份情义。」"},{tag:"li",level:"reason",text:"按市价加价出售，府库可获厚利。",reply:"国君叹道：「利是得了，邻国却要记恨。」"},{tag:"shi",level:"evade",text:"闭关禁籴，先保本国。",reply:"国君反问：「邻国饿死的人，就不会往我们这边跑？」"}]},{id:"tribute_king",q:"天子遣使索贡，礼数甚重，君将何以处之？",options:[{tag:"ming",level:"hit",text:"依礼朝贡，但贡物从简，附陈情表说明民力。",reply:"国君点头：「礼数到了，也不至于掏空府库。」"},{tag:"yi",level:"reason",text:"天子虽微，名义尚在，不可失礼。",reply:"国君沉吟：「礼要守，可使者未必体谅。」"},{tag:"shi",level:"evade",text:"托辞不贡，看天子能奈我何。",reply:"国君皱眉：「今日不贡，明日诸侯就会拿这做文章。」"}]}],Ba=[{id:"fu_grain",follow:!0,q:"君复问：粮价若再涨，百姓买不起，又当如何？",options:[{tag:"li",level:"hit",text:"官仓限量平粜，同时严查囤积，双管齐下。",reply:"国君点头：「有粮可买，价才压得住。」"},{tag:"yi",level:"reason",text:"先赈最贫者，余者听其自便。",reply:"国君叹道：「赈得了一时，赈不了一世。」"},{tag:"shi",level:"evade",text:"派兵封市，禁止涨价。",reply:"国君反问：「封了市，粮从何处来？」"}]},{id:"fu_army",follow:!0,q:"君复问：军粮只够一月，援军却要三月才到，如何撑住？",options:[{tag:"shi",level:"hit",text:"收缩防线、集中兵力，先守要害，再图反击。",reply:"国君点头：「舍小保大，才有得守。」"},{tag:"li",level:"reason",text:"就地征粮，许以战后减免赋税。",reply:"国君沉吟：「就地征粮，怕要激起民怨。」"},{tag:"yi",level:"evade",text:"令将士以忠义自励，死守待援。",reply:"国君反问：「空言忠义，能当军粮吗？」"}]},{id:"fu_clans",follow:!0,q:"君复问：若卿族先发制人，君当如何自处？",options:[{tag:"shi",level:"hit",text:"先调外兵入卫，再以君命分其党羽。",reply:"国君低声道：「先保君位，再论其他。」"},{tag:"yi",level:"reason",text:"召诸卿共誓，以宗庙之盟约束彼此。",reply:"国君叹道：「盟誓对无信之人，没有多少用。」"},{tag:"ming",level:"evade",text:"下罪己诏，平息其怨。",reply:"国君摇头：「罪己可以，退让却不行。」"}]},{id:"fu_justice",follow:!0,q:"君复问：若翻案牵出先君旧臣，君敢动吗？",options:[{tag:"ming",level:"hit",text:"只论案情，不问身份，公开审理。",reply:"国君目光一凝：「公开审，才没人能暗中插手。」"},{tag:"yi",level:"reason",text:"为其保留体面，令其自请致仕。",reply:"国君沉吟：「留体面可以，冤案还是要平。」"},{tag:"shi",level:"evade",text:"到此为止，不再深究。",reply:"国君反问：「冤者不服，这案子算结了吗？」"}]},{id:"fu_oath",follow:!0,q:"君复问：若诸侯会盟时公然辱我，君将何以应之？",options:[{tag:"ming",level:"hit",text:"当场援引盟辞，令史官记其失礼，再议后图。",reply:"国君点头：「先占住礼字，他便理亏。」"},{tag:"yi",level:"reason",text:"以大局为重，暂忍一时。",reply:"国君叹道：「忍可以，但不能白忍。」"},{tag:"li",level:"evade",text:"送他厚礼，求他改口。",reply:"国君冷声道：「送得越多，他越轻我。」"}]},{id:"fu_river",follow:!0,q:"君复问：修堤之费，府库只能出一半，余数何来？",options:[{tag:"li",level:"hit",text:"以工代赈、富户摊派，再向邻县借料。",reply:"国君点头：「三处凑一凑，或可成事。」"},{tag:"yi",level:"reason",text:"劝富户捐输，许其立碑记名。",reply:"国君沉吟：「捐输要有名分，他们才肯。」"},{tag:"ming",level:"evade",text:"先动工再说，钱不够再想办法。",reply:"国君反问：「动工到一半没钱，堤怎么办？」"}]},{id:"fu_talent",follow:!0,q:"君复问：所举之人若行事乖张，君当如何？",options:[{tag:"yi",level:"hit",text:"举者连坐，用人不察者同罚。",reply:"国君点头：「有连坐，举荐才不敢乱来。」"},{tag:"ming",level:"reason",text:"先试以小任，观其行事再定。",reply:"国君沉吟：「试任可以，只怕耽误了正事。」"},{tag:"li",level:"evade",text:"既然举了，便护到底。",reply:"国君反问：「护他，谁护国事？」"}]},{id:"fu_meeting",follow:!0,q:"君复问：会盟之上，晋楚争长，君欲站在哪一边？",options:[{tag:"shi",level:"hit",text:"不急于站队，先联小国自成一势，待两强相争再定。",reply:"国君目光一亮：「先有自重之势，才谈得上取舍。」"},{tag:"yi",level:"reason",text:"依周礼尊卑定席次，不偏不倚。",reply:"国君叹道：「礼若能定，就不会争了。」"},{tag:"ming",level:"evade",text:"谁给的好处多，就站谁那边。",reply:"国君冷笑：「今日贪利，明日两边都轻你。」"}]},{id:"fu_trade",follow:!0,q:"君复问：若商旅来时课以轻税，府库入不敷出，君当如何？",options:[{tag:"li",level:"hit",text:"先养商三年，再渐增其税；商既成群，税自重。",reply:"国君点头：「先养后取，才取得到。」"},{tag:"yi",level:"reason",text:"省去冗费，胜于加税。",reply:"国君沉吟：「省费也是难事，冗员都是人情。」"},{tag:"shi",level:"evade",text:"商既愿来，多取一些无妨。",reply:"国君反问：「多取一些，他们还来第二回吗？」"}]},{id:"fu_scholars",follow:!0,q:"君复问：士人既议朝政，其言又多迂阔，君尚纳之乎？",options:[{tag:"ming",level:"hit",text:"纳其言之可行者，迂阔者不罪，自无怨望。"       <p>出仕后获得的是<b>官阶</b>：士 → 中士 → 上士 → 大夫 → 中大夫 → 上大夫 → 卿 → 执政，
      每月初按功勋升一级，并按官阶领取月俸。</p>
      <p><b>爵位</b>是另一套五等爵：男 → 子 → 伯 → 侯 → 公，由周天子册命。官阶至卿、执政且功勋与名声达标后，
      可往洛邑领受「<b>册命之试</b>」：每级爵位有三道专属试炼（围捕/折冲/治邑/军略/定礼），
      完成后方可请封。请封按试炼评价计算成算，未准则名声小损、贽礼退半，并另命新试；
      累计五次未准后，第六次必得册命。受封后另有食邑月入，并计入结局评价。列国国君亦各有其爵：宋公、齐侯、郑伯、楚子、许男等。</p>
      <p style="color:#6d6052;font-size:13px">按史实，五等爵本为诸侯之封，卿大夫多以采邑为食；本作把「周室衰微、以功册命」作为演绎，
      让玩家也能由男爵累进至公爵。官阶（士→执政）则对应卿、大夫、士的官职体系。</p>

      <div class="section-title">操作</div>
      <p>顶栏切换舆图、城中、人物、差事、交游、名鉴、存档。舆图上点击城邑可见路程与国势，再点「启程前往」。
      修习时可按 <kbd>空格</kbd> 代替「止」，<kbd>Esc</kbd> 关闭弹窗。存档可导出为文本备份。</p>
