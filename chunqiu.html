,z("通敌密信",2,"你出示密信：权臣与敌国使臣往来，约定里应外合。"),{success:"权臣伏法，朝堂为之一清。",compromise:"大夫同意弹劾，但要你先搜集其党羽罪证。",fail:"弹劾失败，大夫被贬。"},{success:{fame:8,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-5,rel:-6}},{title:"搜集罪证",desc:"大夫命你暗中搜集权臣党羽的罪证。",mode:"check",checkSkill:"quanmou",dc:48,days:20,reward:{money:80,fame:4,merit:12}}),f("succession","立储之争","court","ming",!0,"国君","国君","国君年迈，诸子争立。长幼、母族与大臣各执一词。",[l("长子仁弱，幼子聪慧，到底该立谁？",t("ming","hit","立长以安宗庙，再择贤者为辅，名分与才具两全。","国君缓缓点头：「立长而辅以贤，或可两全。」"),t("yi","reason","择贤而立，社稷为重，何必拘泥长幼。","他叹：「择贤？谁来说谁贤？」"),t("shi","evade","谁背后的兵多，就立谁。","他脸色一沉：「那寡人还不如早点退位。」")),l("幼子母族势大，若立长子，他们会不会生乱？",t("ming","hit","立长子的同时，厚封幼子于外邑，使其母族无话可说。","国君目光一动：「分封而安，倒是个法子。」"),t("shi","reason","先夺其母族兵权，再立长子。","他说：「夺兵权容易，结怨也容易。」"),t("yi","evade","都是寡人之子，他们总不至于兵戎相见。","他苦笑：「寡人当年也是这么想的。」")),l("大臣们各有拥立之功的盘算，怎么不让他们结党？",t("ming","hit","立储之事由国君独断，不让大臣预闻，事后再论功。","国君点头：「不给他们机会，才不会有党。」"),t("li","reason","许他们拥立之后各有封赏，他们便不会闹。","他摇头：「封赏越多，胃口越大。」"),t("shi","evade","谁敢结党，就杀谁。","他反问：「杀得完吗？」"))],z("宗室谱牒",0,"你出示宗室谱牒：长子为嫡出，幼子母族虽强，却非正室。"),{success:"储位既定，朝局渐稳。",compromise:"国君同意立储，但要你先联络朝中重臣。",fail:"储位久悬，诸子相争。"},{success:{fame:6,rel:6,merit:8},compromise:{fame:3,rel:3},fail:{fame:-4,rel:-5}},{title:"联络朝臣",desc:"国君命你私下联络朝中重臣，探明立储风向。",mode:"check",checkSkill:"quanmou",dc:46,days:18,reward:{money:70,fame:4,merit:10}}),f("corruption","处置贪墨","court","li",!0,"执政","当国","地方官贪墨赈粮，民怨沸腾。执政要追赃、要牵连、还要平民愤。",[l("贪墨的官把钱花光了，赃款追不回来，怎么办？",t("li","hit","查抄其家产与田宅，不足之数由其上司分赔。","执政道：「上司分赔，才会真的管住下属。」"),t("shi","reason","把他贬为庶人，流放边地，也算惩罚。","他说：「流放了他，百姓的粮还是没回来。」"),t("yi","evade","只要他认罪悔过，便给他一条生路。","他冷笑：「百姓饿死时，谁给他们生路？」")),l("查下去牵连甚广，连执政你的旧部也在其中，怎么办？",t("li","hit","不论亲疏，一律按律查办，我先自请回避。","执政沉默良久：「回避，才能查得下去。」"),t("ming","reason","让御史台独立查案，我不插手。","他点头：「交给御史，倒还公道。」"),t("shi","evade","到此为止，再查下去朝局就乱了。","他反问：「朝局稳了，民心呢？」")),l("民怨已起，百姓要一个交代，怎么安抚？",t("yi","hit","把贪墨所得悉数发还灾民，当众宣读判词。","执政道：「当众发还，民心才服。」"),t("li","reason","再拨一批粮，先把眼前的饥荒压下去。","他说：「拨粮能救急，却救不了心。」"),t("ming","evade","发一道罪己诏，把责任揽到朝廷身上。","他叹：「罪己诏发多了，就没人信了。」"))],z("贪墨账册",0,"你出示账册：赈粮被层层克扣，经手官吏多达十余人。"),{success:"贪官伏法，赃款发还灾民。",compromise:"执政同意查办，但要你负责追缴赃款。",fail:"查办草草收场，民怨更盛。"},{success:{fame:6,rel:6},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"追缴赃款",desc:"执政命你追缴赃款，清点发还。",mode:"check",checkSkill:"suanshu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),f("ritual","宗庙祭祀","court","yi",!0,"国君","国君","宗庙大祭将行，礼制、费用与吉日都有争议。",[l("礼制该照旧典，还是从简？府库并不宽裕。",t("yi","hit","礼贵诚敬，牺牲可减，仪节不可废。","国君点头：「减物不减礼，说得通。」"),t("li","reason","一切从简，省下的钱用于军费。","他皱眉：「祭礼从简，宗室怕要说话。」"),t("ming","evade","照旧典办，免得被人说不敬祖宗。","他叹：「旧典办下来，府库就见底了。」")),l("宗室坚持要用天子规格，可我们只是诸侯，怎么办？",t("yi","hit","按本国爵位行礼，多献一篇颂辞以表敬意。","国君道：「守礼而不僭越，才合本分。」"),t("shi","reason","天子衰微，诸侯用天子礼的也不止我们一家。","他摇头：「别人僭越，我们不能跟着。」"),t("ming","evade","让宗人府去争，寡人不置可否。","他苦笑：「不置可否，最后还是要寡人担名。」")),l("占卜说吉日与农时冲突，百姓要下田，怎么选？",t("yi","hit","祭礼提前一日，既合吉时，也不误农时。","国君点头：「两全其美，就这么办。」"),t("ming","reason","农时可以等，祭礼不能误。","他反问：「误了农时，明年吃什么？」"),t("li","evade","多雇些人来行礼，百姓照常下田。","他说：「雇来的人，行礼能诚吗？」"))],z("旧礼图",1,"你出示旧礼图：诸侯之祭本有减等之礼，并非僭越。"),{success:"祭礼成，宗室与百姓皆无怨言。",compromise:"国君同意从简，但要你主持筹备祭礼。",fail:"祭礼失序，诸侯讥笑。"},{success:{fame:4,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"筹备祭礼",desc:"国君命你筹备宗庙祭礼，核定仪节与用度。",mode:"check",checkSkill:"xuewen",dc:44,days:14,reward:{money:50,fame:3,merit:6}}),f("law","制定刑律","court","ming",!0,"执政","当国","旧刑律已不合时宜，执政要修律，旧族反对、轻重难定、执行更难。",[l("旧族说祖宗之法不可改，怎么回应？",t("ming","hit","刑律随世而变，但可保留旧律中的礼教条款，以示不忘本。","执政点头：「存其礼，改其刑，旧族便无话可说。」"),t("yi","reason","法为治民，不为守旧，该改就得改。","他叹：「道理都对，旧族不会听。」"),t("shi","evade","谁反对就贬谁，看谁还敢说话。","他皱眉：「律未成，先失人心。」")),l("刑轻则奸人不怕，刑重则百姓受苦，怎么定？",t("ming","hit","按罪行轻重分等，赃多者重，过失者轻。","执政道：「分等定罪，才算公允。」"),t("li","reason","重刑之下必有畏服，先镇住再说。","他摇头：「镇得了一时，镇不了一世。」"),t("yi","evade","以德化民，刑罚只是不得已而用。","他反问：「德化得了盗跖吗？」")),l("律令定了，地方官不肯照办，怎么办？",t("ming","hit","把刑律铸于鼎上，公示于市，百姓可据律申冤。","执政目光一亮：「公示于民，官吏便瞒不住。」"),t("shi","reason","派御史巡查，违律者免官。","他说：「御史只有几个人，管不了天下。」"),t("li","evade","把律令与考绩挂钩，办得好的升官。","他叹：「考绩也能造假。」"))],z("旧律残卷",1,"你出示旧律残卷：其中已有按赃论罪的分等之法。"),{success:"新律颁行，吏民有所遵循。",compromise:"执政同意修律，但要你先征询旧臣意见。",fail:"修律受阻，旧律继续沿用。"},{success:{fame:6,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"征询旧臣",desc:"执政命你走访旧臣，征询修律意见。",mode:"check",checkSkill:"xuewen",dc:46,days:18,reward:{money:60,fame:3,merit:8}}),f("merits","朝堂论功","court","ming",!0,"国君","国君","战事方歇，朝堂论功行赏。标准、派系与赏赐都争执不下。",[l("有人斩首多，有人守城有功，谁该居首功？",t("ming","hit","斩首者赏金，守城者授爵，各按其功，不分高下。","国君点头：「各赏其功，便不用争了。」"),t("li","reason","按军功簿上的首级数来定，最简单。","他说：「守城之人，哪来的首级？」"),t("yi","evade","都是为国尽忠，何必分那么清。","他反问：「不分清，谁还肯拼命？」")),l("两派将领各拥其功，互相攻讦，怎么平息？",t("ming","hit","当众宣读军功簿，逐条核对，让两派都无话可说。","国君道：「公开核对，最服人。」"),t("shi","reason","各打五十大板，两边都压一压。","他叹：「压下去，心里还是不服。」"),t("yi","evade","让他们以国事为重，不要再争。","他苦笑：「以国事为重，说来轻巧。」")),l("府库赏赐不够，是先赏功臣还是先补军需？",t("li","hit","先赏战功最著者，其余记功待补，军需另筹。","国君点头：「先赏首功，余者记功，可行。」"),t("ming","reason","先补军需，来年再论功行赏。","他摇头：「将士等不到来年。」"),t("yi","evade","功臣深明大义，会体谅朝廷的难处。","他叹：「体谅一次可以，次次都体谅就寒心了。」"))],z("军功簿",0,"你出示军功簿：守城之功与斩首之功分列，互不掩没。"),{success:"论功得当，朝堂归心。",compromise:"国君同意论功，但要你先核实军功簿。",fail:"论功不公，两派将领离心。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"核实军功",desc:"国君命你核实军功簿，剔除虚报。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:60,fame:3,merit:8}}),f("hunt","劝谏游猎","court","yi",!0,"国君","国君","国君沉迷游猎，荒废朝政。大夫想劝，又怕扫了君兴、触怒近臣。",[l("君上正玩得高兴，此时进谏，会不会扫兴获罪？",t("yi","hit","等君上猎罢歇息时，以农时与边患为切入，缓缓进言。","国君沉默片刻：「你倒是会挑时候。」"),t("ming","reason","可引前代贤君故事，让君上自己醒悟。","他说：「故事好听，君上未必往心里去。」"),t("shi","evade","君上若再游猎，就把猎场封了。","他反问：「你有几个脑袋敢封猎场？」")),l("近臣靠陪君上游猎得宠，他们会在君上耳边说你坏话。",t("yi","hit","进谏时只谈国事，不指责任何人，近臣便无从挑拨。","国君点头：「不点名，他们也不好说什么。」"),t("ming","reason","可先结交其中一二，让他们替你说话。","他叹：「与近臣结交，久了也成党。」"),t("li","evade","给他们些好处，让他们闭嘴。","他冷笑：「今天给好处，明天他们就要更多。」")),l("君上说游猎是为了练武备边，怎么反驳？",t("yi","hit","练武可在校场，何必践踏农田、劳烦百姓。","国君面色微变：「你这话，说得太重了。」"),t("ming","reason","可按古礼定下猎期，不误农时即可。","他点头：「定个规矩，倒还可行。」"),t("shi","evade","把猎场周围的百姓迁走，就没人说话了。","他反问：「迁走百姓，谁去种田？」"))],z("农时历",1,"你出示农时历：君上游猎的时日，正与播种、收割相冲。"),{success:"国君减猎，朝政渐理。",compromise:"国君同意节制游猎，但要你先安排农事。",fail:"劝谏触怒国君，大夫被疏远。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"安排农事",desc:"国君命你安排猎场周边农事，不得误期。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:50,fame:3,merit:6}}),f("recommend","举荐贤才","court","yi",!0,"执政","当国","执政要举荐一位寒门贤才，却怕资历浅、同僚非议、君上不用。",[l("此人出身寒微，骤然举荐，群臣会不会说你结党？",t("yi","hit","举荐时陈明其才德与实绩，不称门生，不结私谊。","执政点头：「只论才，不认门生，便无话可说。」"),t("ming","reason","可先让他做个小吏，做出政绩再举荐。","他说：「这法子稳，只是慢。」"),t("shi","evade","谁敢非议，就让他拿出更好的人来。","他苦笑：「他们拿不出人，却拿得出闲话。」")),l("君上嫌他资历浅，不肯用，怎么办？",t("yi","hit","请君上先试之以一事，成则用，不成则退。","执政目光一亮：「试而后用，君上多半肯。」"),t("li","reason","许君上此人只做副手，不会专权。","他说：「副手做久了，也未必能转正。」"),t("ming","evade","把此人的文章呈给君上，君上自会赏识。","他反问：「君上若只看文章，还要政绩做什么？」")),l("此人若上任后与你政见不合，你会不会后悔？",t("yi","hit","举贤不避异己，他若有更好的主张，我自当让贤。","执政大笑：「这话，我记下了。」"),t("shi","reason","先用其才，若真不合，再调他处。","他点头：「用人所长，也算务实。」"),t("li","evade","先与他约定，大事必须听我的。","他叹：「这样的贤才，来了也施展不开。」"))],z("策论简",0,"你出示此人的策论简：论农田水利，条理分明，切中时弊。"),{success:"贤才得用，朝政为之一新。",compromise:"执政同意举荐，但要你亲自前往征辟。",fail:"举荐被驳回，贤才另投他国。"},{success:{fame:6,rel:5,merit:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"征辟贤者",desc:"执政命你前往曲阜，征辟这位寒门贤才。",mode:"travel",targetCity:"qufu",days:18,reward:{money:60,fame:4,merit:8}})]});var Mn,An=R(()=>{Ze();Mn=[f("seedloan","借贷粮种","trade","li",!1,"老农","乡里农夫","春耕在即，老农无种下田，想向富户借粮种，又怕利息与天灾。",[l("借粮种要还三成利，若秋收不好，我拿什么还？",t("li","hit","可先还一半，余下延到明年，利钱不再滚。","老农松了口气：「不滚利，倒还能喘口气。」"),t("yi","reason","乡里乡亲，总该互相帮衬，哪能见死不救。","他叹气：「帮衬是好，可债主也要吃饭。」"),t("shi","evade","不借便罢，我另想办法。","他苦笑：「你若有办法，就不会站在这儿了。」")),l("富户要我用田契作抵押，田没了，一家老小怎么办？",t("li","hit","只押一季收成，不押田契，白纸黑字写清楚。","老农点头：「只押收成，田还在，行。」"),t("ming","reason","可请乡老作保，不必押田契。","他说：「乡老肯保吗？富户未必认。」"),t("yi","evade","人无信不立，既然借了，就该拿田契作押。","他急道：「田没了，我们一家喝西北风？」")),l("若秋收前遭了天灾，官府又不赈济，这债怎么算？",t("li","hit","借约写明：遇灾则减半，官府有赈则先还官。","老农目光一亮：「有这一条，我才敢借。」"),t("yi","reason","天灾非人力可抗，债主总该讲点良心。","他叹：「良心？债主的良心也是粮养的。」"),t("ming","evade","官府总会赈济，不必杞人忧天。","他反问：「去年官府赈了吗？」"))],z("乡约旧例",0,"你出示乡约旧例：灾年借种，利钱减半，不得夺田。"),{success:"老农借到粮种，春耕如期。",compromise:"老农愿意借种，但要求你替他向富户说情。",fail:"老农借不到种，田地荒废。"},{success:{fame:3,rel:5},compromise:{fame:1,rel:2},fail:{fame:-1,rel:-2}},null),f("saltiron","盐铁专营","trade","li",!0,"大夫","掌财赋","官府欲行盐铁专营，以充府库，却触动私盐商人与百姓生计。",[l("私盐贩子遍地，官府一专营，他们必会闹事，怎么处置？",t("li","hit","先收编大商，给小贩发引票，让他们在官价下营生。","大夫点头：「给条活路，才不会逼反。」"),t("shi","reason","派兵查禁，见私盐就没收。","他说：「查得了一时，查不了遍地。」"),t("yi","evade","百姓吃不起盐，专营也该顾及民生。","他皱眉：「顾及民生，府库就空了。」")),l("盐价一涨，百姓怨声载道，怎么平？",t("li","hit","官盐分三等，最次一等平价卖给贫户。","大夫道：「分等而售，贫户也吃得起。」"),t("ming","reason","可贴告示说明专营是为了军费，百姓应当体谅。","他叹：「体谅归体谅，盐还是要吃。」"),t("yi","evade","宁可府库少收，也不能让百姓吃不起盐。","他反问：「府库空了，军饷谁来出？」")),l("大商巨贾会勾结官吏走私，怎么防？",t("li","hit","盐引编号、账目对查，官商勾结必留痕迹。","大夫目光一凝：「编号对账，倒能查出内鬼。」"),t("shi","reason","派亲信去盐场盯着，不经过地方官。","他说：「亲信也会被收买。」"),t("ming","evade","严刑峻法，走私者抄家灭族。","他叹：「法太酷，反而没人敢报官。」"))],z("私盐账册",0,"你出示私盐账册：本地私盐多经三名吏员放行。"),{success:"盐铁专营推行，府库渐充。",compromise:"大夫同意专营，但要你先查清私盐渠道。",fail:"专营受阻，私盐更加猖獗。"},{success:{fame:4,rel:4,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"查私盐",desc:"大夫命你查禁私盐，揪出放行的吏员。",mode:"check",checkSkill:"quanmou",dc:44,days:16,reward:{money:80,fame:3,merit:8}}),f("inflation","物价飞涨","trade","li",!0,"司徒","掌财赋","城中物价飞涨，粮布皆贵。司徒要压价，却怕伤商、怕无粮、怕民怨。",[l("商家说进价就高，压价他们就关门，怎么办？",t("li","hit","官府先平价售一部分粮布，商家怕货砸手里，自会跟价。","司徒点头：「以小搏大，可以一试。」"),t("shi","reason","定最高价，违者罚没。","他说：「罚没了几家，别家就藏货不卖。」"),t("yi","evade","商人总要讲点良心，不该发国难财。","他冷笑：「良心要是能压价，我就不用愁了。」")),l("官仓存粮不多，平价售粮能撑多久？",t("li","hit","只售到秋收，同时向邻县调运，撑过青黄不接。","司徒道：「算着日子售，才不至于见底。」"),t("shi","reason","强征豪商存粮，先压住局面。","他说：「强征容易，商路断了更难。」"),t("ming","evade","可请君上下诏，令豪商平价出售。","他反问：「诏书下了，他们照办吗？」")),l("百姓买不到粮，已经开始抢粮，怎么稳住？",t("li","hit","按户发粮牌，凭牌限量购买，杜绝囤积。","司徒目光一亮：「凭牌限购，倒能稳住。」"),t("yi","reason","开仓赈济，先让最穷的人有饭吃。","他叹：「开仓容易，后续难以为继。」"),t("shi","evade","派兵弹压，抢粮者就地正法。","他皱眉：「杀得了一时，杀不了一世。」"))],z("商路图",1,"你出示商路图：邻县粮价尚低，运程只需五日。"),{success:"物价渐平，民心稍安。",compromise:"司徒同意平价售粮，但要你主持平售之事。",fail:"物价失控，城中大乱。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"平价售粮",desc:"司徒命你主持平价售粮，按户发票、限量供应。",mode:"check",checkSkill:"shanggu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),f("caravan","商队通行","trade","shi",!0,"关吏","边关守吏","一支大商队要过关，关吏既想收税，又怕盗匪与间谍混在其中。",[l("商队货物繁多，一件件查验，商队等得起吗？",t("shi","hit","分货类抽验，贵重与军械全查，其余放行。","关吏点头：「抽验加重点，倒还快。」"),t("li","reason","按货值收税，多收些钱，商队自然愿意等。","他说：「收得多了，商队下次就绕道。」"),t("ming","evade","按旧例查验，不必多事。","他反问：「旧例查得出间谍吗？」")),l("关外盗匪横行，商队若在关外被劫，会不会怪我们？",t("shi","hit","派一队关卒护送出界，既保商队，也显国威。","关吏道：「护送一程，商队才会再来。」"),t("li","reason","收一笔护送费，由商队自己出人。","他皱眉：「商队自己出人，还要我们做什么？」"),t("yi","evade","盗匪劫财，与我们无关，不必多管。","他叹：「商队被劫一次，就再也不来了。」")),l("商队里若有敌国探子，放过去就是大罪，怎么查？",t("shi","hit","查符传与货主名籍，军中工匠与地图匠重点盘问。","关吏目光一凛：「查工匠与地图匠，倒是要害。」"),t("ming","reason","让商队互保，一人犯事，全队连坐。","他说：「连坐能逼他们自己查。」"),t("li","evade","多收些保证金，出了事就扣钱。","他反问：「探子会在乎那点钱吗？」"))],z("商队符传",1,"你出示商队符传：其中三名工匠的名籍与货单不符。"),{success:"商队顺利过关，关税与安全两全。",compromise:"关吏同意放行，但要你护送商队出界。",fail:"商队被劫，边关声誉受损。"},{success:{fame:4,rel:4,merit:6},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"护送商队",desc:"关吏命你护送商队出界，防备盗匪。",mode:"combat",enemy:{name:"关外盗匪",wu:54,skill:3,hp:88},days:12,reward:{money:80,fame:4,merit:8}}),f("strike","工匠罢工","trade","li",!1,"工匠","城中匠户","官府催造军械，工匠却因工钱拖欠而罢作，双方僵持。",[l("工钱拖欠了三个月，让我们怎么干活？",t("li","hit","先发一个月工钱，余下按半月一结，绝不拖欠。","工匠头目点头：「先发一个月，兄弟们才肯动。」"),t("yi","reason","朝廷也有难处，大家该共渡难关。","他冷笑：「难关都让我们渡，官老爷吃什么？」"),t("shi","evade","再不复工，就抓几个带头的。","他怒道：「抓吧，抓完了看谁给你造兵器。」")),l("军械催得急，工期赶不上，谁担这个责任？",t("li","hit","加派人手、分班昼夜赶工，工钱按件另计。","工匠们低声商议，神色稍缓。"),t("ming","reason","请上官宽限几日，先赶最急的一批。","他说：「宽限？上官会听我们的？」"),t("yi","evade","为将者当体恤匠人，不可一味催逼。","他叹：「体恤？兵器造不出来，先掉脑袋的是我们。」")),l("带头罢工的几个人，官府要办他们，你怎么看？",t("li","hit","只要复工，往罪不究，工钱照补。","头目沉默半晌：「不究往罪，我们就复工。」"),t("yi","reason","他们也是被逼无奈，罚些钱便算了。","他反问：「罚钱？我们连饭都吃不上。」"),t("shi","evade","带头的必须办，不然以后人人效仿。","他冷声道：「那就没人给你干活了。」"))],z("工钱簿",0,"你出示工钱簿：拖欠工钱属实，经手官吏还克扣了一成。"),{success:"工匠复工，军械如期交付。",compromise:"工匠同意复工，但要你督办补发工钱。",fail:"罢工扩大，军械停工。"},{success:{fame:3,rel:4,merit:6},compromise:{fame:1,rel:2},fail:{fame:-3,rel:-3}},null),f("manumit","奴婢赎身","trade","yi",!0,"主人","城中富户","一名奴婢想赎身，主人要价甚高，又怕开了 些。」"},{tag:"shi",level:"evade",text:"禁止聚议，为首者治罪。",reply:"国君冷声道：「堵得住嘴，堵得住人心吗？」"}]},{id:"flood",q:"秋汛将至，河堤年久失修，君将何以处之？",options:[{tag:"li",level:"hit",text:"分段修堤，以工代赈，既固河防又安流民。",reply:"国君目光一亮：「以工代赈，一举两得。」"},{tag:"yi",level:"reason",text:"迁低地之民于高处，先保人命，再议修堤。",reply:"国君叹道：「迁民也是难事，但总比死人强。」"},{tag:"ming",level:"evade",text:"祭河祈安，上天自会护佑。",reply:"国君反问：「若上天不佑，谁来担这个责？」"}]},{id:"talent",q:"朝中乏才，政事壅滞，君将何以取士？",options:[{tag:"yi",level:"hit",text:"举寒门、试以事，不问出身，唯才是举。",reply:"国君抚掌：「英雄不问出处，正合寡人之意。」"},{tag:"ming",level:"reason",text:"依乡里清议与旧制荐举，稳重为上。",reply:"国君沉吟：「旧制稳妥，却怕漏了真才。」"},{tag:"li",level:"evade",text:"任用亲族，至少忠心可保。",reply:"国君冷笑：「忠心而无才，只会误事。」"}]},{id:"diplomacy",q:"诸侯会盟在即，君欲争一时之先，当以何策？",options:[{tag:"shi",level:"hit",text:"先联近邻、陈兵于会，以势压诸侯，再定盟约。",reply:"国君点头：「有势可恃，盟辞才有人听。」"},{tag:"yi",level:"reason",text:"以信义相召，让诸侯自愿推我为长。",reply:"国君叹道：「信义虽好，会盟场上还是看实力。」"},{tag:"ming",level:"evade",text:"多送礼物，买通各国大夫。",reply:"国君皱眉：「买来的盟，明日就能被别人买走。」"}]},{id:"oath",q:"诸侯背弃旧盟，边邑已起争端，君将何以处之？",options:[{tag:"ming",level:"hit",text:"会诸侯于旧盟之地，重订盟书，使背盟者无所遁形。",reply:"国君点头：「先把道理摆在诸侯面前。」"},{tag:"yi",level:"reason",text:"先遣使责以大义，彼若知愧，兵戈可免。",reply:"国君叹道：「义责要有兵威作后盾才管用。」"},{tag:"li",level:"evade",text:"许以边市之利，换他退兵。",reply:"国君反问：「今日许利，明日他再进一步呢？」"}]},{id:"plague",q:"灾后疫气流行，医者不足，君将何以处之？",options:[{tag:"yi",level:"hit",text:"征召良医、设隔离之所，官给汤药，先救疫区。",reply:"国君颔首：「先救人，再谈其余。」"},{tag:"li",level:"reason",text:"拨款购药，命各乡上报病户。",reply:"国君道：「钱要花，可谁来管这些药？」"},{tag:"shi",level:"evade",text:"封锁疫区，禁止出入。",reply:"国君皱眉：「封得住人，封不住疫气。」"}]},{id:"saltiron",q:"盐铁之利尽归豪商，府库日虚，君将何以处之？",options:[{tag:"li",level:"hit",text:"官营盐铁，设官榷税，余利仍许商人经营。",reply:"国君目光一亮：「官商分利，倒不至于竭泽。」"},{tag:"shi",level:"reason",text:"派兵查封私盐，杀一儆百。",reply:"国君沉吟：「查得了一时，查不了天下。」"},{tag:"yi",level:"evade",text:"与民争利非仁政，不如听其自然。",reply:"国君反问：「府库空了，仁政拿什么行？」"}]},{id:"luxury",q:"宗室竞相奢靡，用度逾制，君将何以处之？",options:[{tag:"ming",level:"hit",text:"申明礼制，按爵定用，逾制者夺其封邑。",reply:"国君点头：「先立规矩，再谈罚。」"},{tag:"yi",level:"reason",text:"以俭德示范，劝其自省。",reply:"国君苦笑：「寡人节俭，他们照旧。」"},{tag:"li",level:"evade",text:"削减宗室俸禄，充作军费。",reply:"国君摇头：「削俸只会逼他们另寻财路。」"}]},{id:"warlord",q:"边将拥兵自重，诏令不行，君将何以处之？",options:[{tag:"shi",level:"hit",text:"调其部曲、换其防区，以粮饷节制其兵。",reply:"国君低声道：「不动刀兵而削其权，最好。」"},{tag:"ming",level:"reason",text:"召其入朝，加官进爵，留在身边。",reply:"国君沉吟：「他若不肯来呢？」"},{tag:"yi",level:"evade",text:"以忠义相责，令其自请解兵。",reply:"国君反问：「他若有忠义，就不会拥兵了。」"}]},{id:"waterfight",q:"两邑争水，械斗将起，君将何以处之？",options:[{tag:"ming",level:"hit",text:"查旧渠碑与纳赋册，按田亩定水，立石为界。",reply:"国君点头：「有碑有册，才好断。」"},{tag:"li",level:"reason",text:"令两邑共修新渠，按出工分水。",reply:"国君道：「修渠是好事，可远水难救近火。」"},{tag:"yi",level:"evade",text:"令乡老自行调解，官府不必插手。",reply:"国君叹道：「调得成，就不会打到县衙来了。」"}]},{id:"clan_talent",q:"世族把持朝位，寒士无由进身，君将何以处之？",options:[{tag:"yi",level:"hit",text:"设策问、试以事，寒士与世族同场比试。",reply:"国君目光一亮：「同场比试，世族也无话可说。」"},{tag:"shi",level:"reason",text:"另立新军、新府，绕开世族旧衙门。",reply:"国君沉吟：「另起炉灶，也需钱粮。」"},{tag:"ming",level:"evade",text:"依乡里清议荐举，自然会有贤才。",reply:"国君反问：「清议还不是世族说了算？」"}]},{id:"punishment",q:"刑罚过滥，狱中多冤，君将何以处之？",options:[{tag:"ming",level:"hit",text:"亲录囚徒，疑罪从轻，择贤者为司寇。",reply:"国君颔首：「亲录囚徒，至少能少几桩冤案。」"},{tag:"yi",level:"reason",text:"修订刑律，明定轻重，使民知所避就。",reply:"国君道：「律要修，可眼下牢里已经满了。」"},{tag:"shi",level:"evade",text:"严刑峻法，使奸人不敢犯。",reply:"国君反问：「严到百姓不敢申冤，也算治世？」"}]},{id:"granary",q:"官仓账实不符，仓吏称损耗，君将何以处之？",options:[{tag:"li",level:"hit",text:"突击盘仓、对账，亏空者连坐赔偿。",reply:"国君点头：「对账连坐，仓吏才不敢伸手。」"},{tag:"ming",level:"reason",text:"遣御史巡查，公开账目于市。",reply:"国君沉吟：「公开是好事，御史肯不肯得罪人？」"},{tag:"yi",level:"evade",text:"申饬仓吏，令其自行补足。",reply:"国君冷笑：「自己补？那还是从仓里拿。」"}]},{id:"monopoly",q:"大商垄断市货，小贩无以为生，君将何以处之？",options:[{tag:"li",level:"hit",text:"设官市平价、限大户囤积，小贩可入市。",reply:"国君点头：「给小人一条活路，市面才稳。」"},{tag:"shi",level:"reason",text:"派兵查抄囤货，罚其重金。",reply:"国君皱眉：「抄了这家，别家还会囤。」"},{tag:"ming",level:"evade",text:"表彰义商，劝其让利。",reply:"国君反问：「义商有几个？」"}]},{id:"military_award",q:"军功赏罚不明，将士离心，君将何以处之？",options:[{tag:"ming",level:"hit",text:"当众核验军功簿，按功行赏，虚报者治罪。",reply:"国君颔首：「公开核功，才服众。」"},{tag:"yi",level:"reason",text:"厚待阵亡者家属，以慰军心。",reply:"国君叹道：「抚恤要做，可活着的功劳也不能含糊。」"},{tag:"shi",level:"evade",text:"加重军法，退缩者斩。",reply:"国君反问：「只罚不赏，谁还肯向前？」"}]},{id:"heir",q:"太子失教，近臣阿谀，君将何以处之？",options:[{tag:"yi",level:"hit",text:"择端方之士为傅，令太子习礼知民。",reply:"国君点头：「师傅选对了，比什么都强。」"},{tag:"ming",level:"reason",text:"令太子参与朝会，使知政事。",reply:"国君沉吟：「旁听容易，肯不肯听进去？」"},{tag:"li",level:"evade",text:"多给俸邑，使其安享富贵。",reply:"国君反问：「安享富贵，就能当好国君吗？」"}]},{id:"famine_neighbor",q:"邻国大饥，遣使求籴，君将何以处之？",options:[{tag:"yi",level:"hit",text:"平价粜粮，并附盟书，使邻国记此恩义。",reply:"国君颔首：「既救人，也结一份情义。」"},{tag:"li",level:"reason",text:"按市价加价出售，府库可获厚利。",reply:"国君叹道：「利是得了，邻国却要记恨。」"},{tag:"shi",level:"evade",text:"闭关禁籴，先保本国。",reply:"国君反问：「邻国饿死的人，就不会往我们这边跑？」"}]},{id:"tribute_king",q:"天子遣使索贡，礼数甚重，君将何以处之？",options:[{tag:"ming",level:"hit",text:"依礼朝贡，但贡物从简，附陈情表说明民力。",reply:"国君点头：「礼数到了，也不至于掏空府库。」"},{tag:"yi",level:"reason",text:"天子虽微，名义尚在，不可失礼。",reply:"国君沉吟：「礼要守，可使者未必体谅。」"},{tag:"shi",level:"evade",text:"托辞不贡，看天子能奈我何。",reply:"国君皱眉：「今日不贡，明日诸侯就会拿这做文章。」"}]}],La=[{id:"fu_grain",follow:!0,q:"君复问：粮价若再涨，百姓买不起，又当如何？",options:[{tag:"li",level:"hit",text:"官仓限量平粜，同时严查囤积，双管齐下。",reply:"国君点头：「有粮可买，价才压得住。」"},{tag:"yi",level:"reason",text:"先赈最贫者，余者听其自便。",reply:"国君叹道：「赈得了一时，赈不了一世。」"},{tag:"shi",level:"evade",text:"派兵封市，禁止涨价。",reply:"国君反问：「封了市，粮从何处来？」"}]},{id:"fu_army",follow:!0,q:"君复问：军粮只够一月，援军却要三月才到，如何撑住？",options:[{tag:"shi",level:"hit",text:"收缩防线、集中兵力，先守要害，再图反击。",reply:"国君点头：「舍小保大，才有得守。」"},{tag:"li",level:"reason",text:"就地征粮，许以战后减免赋税。",reply:"国君沉吟：「就地征粮，怕要激起民怨。」"},{tag:"yi",level:"evade",text:"令将士以忠义自励，死守待援。",reply:"国君反问：「空言忠义，能当军粮吗？」"}]},{id:"fu_clans",follow:!0,q:"君复问：若卿族先发制人，君当如何自处？",options:[{tag:"shi",level:"hit",text:"先调外兵入卫，再以君命分其党羽。",reply:"国君低声道：「先保君位，再论其他。」"},{tag:"yi",level:"reason",text:"召诸卿共誓，以宗庙之盟约束彼此。",reply:"国君叹道：「盟誓对无信之人，没有多少用。」"},{tag:"ming",level:"evade",text:"下罪己诏，平息其怨。",reply:"国君摇头：「罪己可以，退让却不行。」"}]},{id:"fu_justice",follow:!0,q:"君复问：若翻案牵出先君旧臣，君敢动吗？",options:[{tag:"ming",level:"hit",text:"只论案情，不问身份，公开审理。",reply:"国君目光一凝：「公开审，才没人能暗中插手。」"},{tag:"yi",level:"reason",text:"为其保留体面，令其自请致仕。",reply:"国君沉吟：「留体面可以，冤案还是要平。」"},{tag:"shi",level:"evade",text:"到此为止，不再深究。",reply:"国君反问：「冤者不服，这案子算结了吗？」"}]},{id:"fu_oath",follow:!0,q:"君复问：若诸侯会盟时公然辱我，君将何以应之？",options:[{tag:"ming",level:"hit",text:"当场援引盟辞，令史官记其失礼，再议后图。",reply:"国君点头：「先占住礼字，他便理亏。」"},{tag:"yi",level:"reason",text:"以大局为重，暂忍一时。",reply:"国君叹道：「忍可以，但不能白忍。」"},{tag:"li",level:"evade",text:"送他厚礼，求他改口。",reply:"国君冷声道：「送得越多，他越轻我。」"}]},{id:"fu_river",follow:!0,q:"君复问：修堤之费，府库只能出一半，余数何来？",options:[{tag:"li",level:"hit",text:"以工代赈、富户摊派，再向邻县借料。",reply:"国君点头：「三处凑一凑，或可成事。」"},{tag:"yi",level:"reason",text:"劝富户捐输，许其立碑记名。",reply:"国君沉吟：「捐输要有名分，他们才肯。」"},{tag:"ming",level:"evade",text:"先动工再说，钱不够再想办法。",reply:"国君反问：「动工到一半没钱，堤怎么办？」"}]},{id:"fu_talent",follow:!0,q:"君复问：所举之人若行事乖张，君当如何？",options:[{tag:"yi",level:"hit",text:"举者连坐，用人不察者同罚。",reply:"国君点头：「有连坐，举荐才不敢乱来。」"},{tag:"ming",level:"reason",text:"先试以小任，观其行事再定。",reply:"国君沉吟：「试任可以，只怕耽误了正事。」"},{tag:"li",level:"evade",text:"既然举了，便护到底。",reply:"国君反问：「护他，谁护国事？」"}]},{id:"fu_meeting",follow:!0,q:"君复问：会盟之上，晋楚争长，君欲站在哪一边？",options:[{tag:"shi",level:"hit",text:"不急于站队，先联小国自成一势，待两强相争再定。",reply:"国君目光一亮：「先有自重之势，才谈得上取舍。」"},{tag:"yi",level:"reason",text:"依周礼尊卑定席次，不偏不倚。",reply:"国君叹道：「礼若能定，就不会争了。」"},{tag:"ming",level:"evade",text:"谁给的好处多，就站谁那边。",reply:"国君冷笑：「今日贪利，明日两边都轻你。」"}]},{id:"fu_trade",follow:!0,q:"君复问：若商旅来时课以轻税，府库入不敷出，君当如何？",options:[{tag:"li",level:"hit",text:"先养商三年，再渐增其税；商既成群，税自重。",reply:"国君点头：「先养后取，才取得到。」"},{tag:"yi",level:"reason",text:"省去冗费，胜于加税。",reply:"国君沉吟：「省费也是难事，冗员都是人情。」"},{tag:"shi",level:"evade",text:"商既愿来，多取一些无妨。",reply:"国君反问：「多取一些，他们还来第二回吗？」"}]},{id:"fu_scholars",follow:!0,q:"君复问：士人既议朝政，其言又多迂阔，君尚纳之乎？",options:[{tag:"ming",level:"hit",text:"纳其言之可行者，迂阔者不罪，自无怨望。",reply:"国君笑道：「只取可用的，不必与他争辩。」"},{tag:"yi",level:"reason",text:"设学宫养其才，使有为而不为乱。",reply:"国君点头：「给他们去处，比堵他们的嘴强。」"},{tag:"shi",level:"evade",text:"择其言事切直者，先治一二人以立威。",reply:"国君摇头：「立了威，清议只会更凶。」"}]},{id:"fu_plague",follow:!0,q:"君复问：疫气既起，若封城断行，恐民生断绝，君当如何？",options:[{tag:"yi",level:"hit",text:"不封全城，只隔病户，粮药仍由官送。",reply:"国君点头：「隔病不隔人，才是正办。」"},{tag:"li",level:"reason",text:"募医者巡诊，官给其食，重赏之下必有应者。",reply:"国君沉吟：「重赏募医，也是一法。」"},{       每月初按功勋升一级，并按官阶领取月俸。</p>
      <p><b>爵位</b>是另一套五等爵：男 → 子 → 伯 → 侯 → 公，由周天子册命。官阶至卿、执政且功勋与名声达标后，
      可往洛邑领受「<b>册命之试</b>」：每级爵位有三道专属试炼（围捕/折冲/治邑/军略/定礼），
      完成后方可请封。请封按试炼评价计算成算，未准则名声小损、贽礼退半，并另命新试；
      累计五次未准后，第六次必得册命。受封后另有食邑月入，并计入结局评价。列国国君亦各有其爵：宋公、齐侯、郑伯、楚子、许男等。</p>
      <p style="color:#6d6052;font-size:13px">按史实，五等爵本为诸侯之封，卿大夫多以采邑为食；本作把「周室衰微、以功册命」作为演绎，
      让玩家也能由男爵累进至公爵。官阶（士→执政）则对应卿、大夫、士的官职体系。</p>

：「泠然善也。」"),t("yi","evade","成与不成，皆有其时。","列御寇曰：「犹有所待者也。」"))],null,{success:"列御寇曰：「君可与言虚矣。」",compromise:"列御寇曰：「君之言，可采。」",fail:"列御寇曰：「君犹有所待。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_lieyukou_ju","拒粟","court","ming",!1,"列御寇","郑之隐者","子阳为郑相，使人遗列子粟。列子再拜而辞。",[l("相馈之粟，君何故辞？",t("ming","hit","君非自知我也，以人之言而遗我粟；至其罪我也，又且以人之言。此吾所以不受也。","列御寇曰：「此吾之所以辞也。」"),t("li","reason","受之无伤。饥而辞粟，非智。","列御寇曰：「君非自知我也。」"),t("yi","evade","受与不受，皆小节。","列御寇曰：「再拜而辞。」")),l("民有饥色而辞人之粟，君以为矫乎？",t("ming","hit","不矫。受非其道，则终身受制于人。","列御寇曰：「此吾之所守也。」"),t("li","reason","矫矣。饥而死，何守可言？","列御寇曰：「其妻望之而拊心。」"),t("shi","evade","矫与不矫，唯其自知。","列御寇曰：「君非自知我也。」")),l("子阳既死，其党皆诛，而君独免。何故？",t("ming","hit","以吾不受其粟也。受则为其党，不受则非其党。","列御寇曰：「此吾之所以免也。」"),t("li","reason","偶然耳，非辞粟之功。","列御寇曰：「民有饥色。」"),t("yi","evade","免与不免，皆有其数。","列御寇曰：「再拜而辞。」"))],null,{success:"列御寇曰：「君可与言守矣。」",compromise:"列御寇曰：「君之言，半得。」",fail:"列御寇曰：「君犹重口体。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Jc={theme:"为我贵己",intro:"杨子取为我，拔一毛而利天下，不为也。",debates:[f("v_yangzhu_weiwo","为我","court","li",!0,"杨朱","杨朱学派","杨朱曰：「拔一毛而利天下，不为也。」",[l("拔一毛而利天下，君何故不为？",t("li","hit","天下非一毛所能利。今日拔一毛，明日断一臂，其终必至于身。","杨朱曰：「此吾之所以为我也。」"),t("yi","reason","一毛至轻，天下至重。何惜一毛？","杨朱曰：「拔一毛而利天下，不为也。」"),t("shi","evade","为与不为，各从其志。","杨朱曰：「损一毫利天下，不与也。」")),l("人人为我，则天下谁治？",t("li","hit","人人不损一毫，人人不利天下，天下治矣。各安其分，不相侵也。","杨朱曰：「此吾所谓治也。」"),t("yi","reason","人人为我，则公义不存，天下必乱。","杨朱曰：「悉天下奉一身，不取也。」"),t("ming","evade","治与乱，非为我之说所能致。","杨朱曰：「拔一毛而利天下，不为也。」")),l("孟子曰「杨朱墨翟之言盈天下」，君以为何如？",t("li","hit","天下之论，各有所主。吾言为我，彼言兼爱，皆所以救世。","杨朱曰：「此吾之所以不辩也。」"),t("yi","reason","盈天下则天下乱矣。当辟之。","杨朱曰：「拔一毛而利天下，不为也。」"),t("ming","evade","言之盈虚，非所计。","杨朱曰：「全性保真。」"))],null,{success:"杨朱曰：「君可与言己矣。」",compromise:"杨朱曰：「君之言，有见。」",fail:"杨朱曰：「君之说，墨者之属也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yangzhu_gui","贵己","court","li",!1,"杨朱","杨朱学派","杨朱曰：「全性保真，不以物累形。」",[l("何为贵己？",t("li","hit","贵己者，非自私也。全其性，保其真，不为外物所役。","杨朱曰：「此吾之学也。」"),t("yi","reason","贵己则轻人。此与禽兽何异？","杨朱曰： 是。」",fail:"惠施曰：「君犹恋于位。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},iu={theme:"白马非马",intro:"公孙龙，赵人，平原君之客。倡离坚白、白马非马。",debates:[f("v_gongsunlong_baima","白马非马","court","li",!0,"公孙龙","赵之辩者","公孙龙曰：「白马非马。」",[l("白马非马，其说如何？",t("li","hit","马者，所以命形也；白者，所以命色也。命色非命形也，故曰白马非马。","公孙龙曰：「此吾之所以辩也。」"),t("yi","reason","白马自是马之一类，何得云非马？","公孙龙曰：「求马，黄黑马皆可致；求白马，黄黑马不可致。」"),t("shi","evade","名实之辩，无关于治。","公孙龙曰：「白马非马。」")),l("求马而得白马，可乎？",t("li","hit","可。求马者，形也；得白马者，形与色俱。","公孙龙曰：「此吾所谓非马也。」"),t("yi","reason","白马即马，求马得白马，理所当然。","公孙龙曰：「求白马，黄黑马不可致。」"),t("ming","evade","名与实，各有所指。","公孙龙曰：「白马非马。」")),l("孔穿与之辩而不胜，君以为何故？",t("li","hit","穿执常理，龙用名辩。常理可服人，名辩可屈人。","公孙龙曰：「此吾之所以能胜也。」"),t("yi","reason","穿本不必与之辩。辩则已落其术中。","公孙龙曰：「白马非马。」"),t("shi","evade","胜败皆一时之论。","公孙龙曰：「离坚白。」"))],null,{success:"公孙龙曰：「君可与言名矣。」",compromise:"公孙龙曰：「君之言，有见。」",fail:"公孙龙曰：「君之说，未离于形。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_gongsunlong_jianbai","离坚白","court","li",!1,"公孙龙","赵之辩者","公孙龙曰：「坚白石三，可乎？曰：不可。二，可乎？曰：可。」",[l("坚白石，何以为二？",t("li","hit","视不得其所坚而得其所白，无坚也；拊不得其所白而得其所坚，无白也。","公孙龙曰：「此吾之所谓离也。」"),t("yi","reason","坚与白俱在石中，何得为二？","公孙龙曰：「坚白石三，可乎？曰：不可。」"),t("ming","evade","离与合，皆名之辨。","公孙龙曰：「二，可乎？曰：可。」")),l("名实之辩，何益于治？",t("li","hit","名正而后事成。名不正则言不顺，言不顺则事不成。","公孙龙曰：「此吾之所谓辩也。」"),t("yi","reason","无益。徒乱人心，无补于政。","公孙龙曰：「坚白石二。」"),t("shi","evade","益与不益，非辩者所计。","公孙龙曰：「离坚白。」")),l("平原君厚遇君而不任以事，何如？",t("li","hit","辩者之职在辩，不在政。厚遇足矣。","公孙龙曰：「此吾之所以安也。」"),t("yi","reason","当自请任事，以见其用。","公孙龙曰：「平原君之客。」"),t("ming","evade","遇与不遇，皆有其分。","公孙龙曰：「白马非马。」"))],null,{success:"公孙龙曰：「君可与言名实矣。」",compromise:"公孙龙曰：「君之言，可采。」",fail:"公孙龙曰：「君之说，未离于物。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},tu={theme:"五德终始",intro:"邹衍，齐之阴阳家。著终始大圣之篇。",debates:[f("v_zouyan_wude","五德终始","court","ming",!0,"邹衍","阴阳家","邹衍曰：「五德从所不胜，虞土、夏木、殷金、周火。」",[l("五德终始，其说可据乎？",t("ming","hit","可。天有五行，代有兴替。观其德之所属，则知运之所归。","邹衍曰：「此吾之所谓终始也。」"),t("li","reason","国之兴亡在人，不在德运。","邹衍曰：「五德从所不胜。」"),t("yi","evade","运数之说，不必深究。","邹衍曰：「五德终始。」")),l("水德将兴，代周者谁也？",t("ming","hit","火德既衰，水德当王。然谁居之，未可预知。","邹衍曰：「此吾之所以言也。」"),t("li","reason","强者居之。德运之说，因人而显。","邹衍曰：「五德从所不胜。」"),t("shi","evade","兴替有时，非人所能测。","邹衍曰：「著终始大圣之篇。」")),l("以德运说诸侯，君不惧为谶纬之始乎？",t("ming","hit","德运者，理也；谶纬者，妄也。以理示人，非以妖惑人。","邹衍曰：「善哉！君知吾之分矣。」"),t("li","reason","近于谶纬。人主信之，必怠于人事。","邹衍曰：「五德终始。」"),t("yi","evade","理与妄，后人自辨。","邹衍曰：「五德从所不胜。」"))],null,{success:"邹衍曰：「君可与言运矣。」",compromise:"邹衍曰：「君之言，有见。」",fail:"邹衍曰：「君之说，非观运之法。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zouyan_dajiuzhou","大九州","court","ming",!1,"邹衍","阴阳家","邹衍曰：「中国名曰赤县神州，乃天下八十一分之一耳。」",[l("中国不过天下八十一分之一，可信乎？",t("ming","hit","天地之广，非耳目所能尽。执一隅而疑其大，不足与观。","邹衍曰：「此吾之所谓大九州也。」"),t("li","reason","此皆臆说。无凭而谈天地，非学者所为。","邹衍曰：「中国名曰赤县神州。」"),t("yi","evade","天下之大，非所宜言。","邹衍曰：「乃天下八十一分之一。」")),l("既言天地之广，则何以自处？",t("ming","hit","知其大则不敢自满，知其小则不吝自守。此所以能容人也。","邹衍曰：「善哉！君知大九州之义矣。」"),t("li","reason","知其大亦无益。当务其近者。","邹衍曰：「中国名曰赤县神州。」"),t("shi","evade","大与小，皆不必较。","邹衍曰：「大九州之数。」")),l("燕昭王拥彗先驱以迎君，何如？",t("ming","hit","彼礼其言，非礼其身。吾亦以言报之。","邹衍曰：「此吾之所以适燕也。」"),t("li","reason","当受之。士之见礼，国之盛事。","邹衍曰：「昭王拥彗先驱。」"),t("yi","evade","礼之厚薄，非所计。","邹衍曰：「五德终始。」"))],null,{success:"邹衍曰：「君可与言天地矣。」",compromise:"邹衍曰：「君之言，半得。」",fail:"邹衍曰：「君犹拘于一隅。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},au={theme:"滑稽多辩",intro:"淳于髡，齐之赘婿。长不满七尺，滑稽多辩。",debates:[f("v_chunyu_yiming","一鸣惊人","court","ming",!0,"淳于髡","齐之稷下","齐威王好为淫乐，沈湎不治。淳于髡说之以隐曰：「国中有大鸟，止王之庭，三年不飞不鸣。」",[l("三年不飞不鸣，此鸟何名？",t("ming","hit","此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。","威王曰：「善。」乃朝诸县令长。"),t("li","reason","此鸟无能耳。当去之，别求贤者。","淳于髡曰：「国中有大鸟。」"),t("yi","evade","鸟之飞鸣，各有时。","淳于髡曰：「三年不飞不鸣。」")),l("以隐语谏君，何如直谏？",t("ming","hit","隐语入之易，直谏触之难。君既悟，则其改也速。","淳于髡曰：「此吾之所以为滑稽也。」"),t("yi","reason","直谏为忠。隐语近于戏。","淳于髡曰：「一鸣惊人。」"),t("shi","evade","视君之性而择之。","淳于髡曰：「国中有大鸟。」")),l("王曰「善」而罢长夜之饮。君以为隐语之力乎？",t("ming","hit","然。隐语者，因其乐而导之，故易入。","淳于髡曰：「此滑稽之所以有用也。」"),t("li","reason","偶然耳。王自悟之。","淳于髡曰：「酒极则乱。」"),t("yi","evade","力之所在，不可尽言。","淳于髡曰：「一鸣惊人。」"))],null,{success:"淳于髡曰：「君可与言谏矣。」",compromise:"淳于髡曰：「君之言，可采。」",fail:"淳于髡曰：「君未达隐语之妙。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_chunyu_jiuji","酒极则乱","court","ming",!1,"淳于髡","齐之稷下","威王问：「先生能饮几何而醉？」髡曰：「臣饮一斗亦醉，一石亦醉。」",[l("一斗亦醉，一石亦醉，何也？",t("ming","hit","酒极则乱，乐极则悲。凡事皆然。","淳于髡曰：「此吾之所以讽也。」"),t("li","reason","量有定也，何得两说？","淳于髡曰：「臣饮一斗亦醉，一石亦醉。」"),t("yi","evade","醉与不醉，皆在己心。","淳于髡曰：「酒极则乱，乐极则悲。」")),l("君耽于酒，臣当如何进言？",t("ming","hit","乘其乐而讽之。乐时之言，易入而难忘。","淳于髡曰：「此吾之所以为也。」"),t("yi","reason","当正色谏之。乘乐而讽，近于谄。","淳于髡曰：「酒极则乱。」"),t("li","evade","君之好恶，非臣所能移。","淳于髡曰：「一石亦醉。」")),l("滑稽之士，于国有用乎？",t("ming","hit","有用。言不逆耳，而君自改。此滑稽之所以不可废。","淳于髡曰：「此吾之所以自处也。」"),t("yi","reason","无用。优伶之属，何补于政？","淳于髡曰：「一鸣惊人。」"),t("li","evade","有用无用，视其君。","淳于髡曰：「酒极则乱。」"))],null,{success:"淳于髡曰：「君可与言讽矣。」",compromise:"淳于髡曰：「君之言，半是。」",fail:"淳于髡曰：「君犹以酒论酒。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},su={theme:"隐与孝",intro:"老莱子，楚之隐者。著书十五篇。",debates:[f("v_laolaizi_yin","隐者","court","ming",!0,"老莱子","楚之隐者","楚王欲召老莱子为相。老莱子辞，与其妻逃于江南。",[l("王召为相，君何故辞？",t("ming","hit","隐者不能受人之禄。受禄则受制，受制则失其真。","老莱子曰：「此吾之所以逃也。」"),t("li","reason","可受。为相可以行其道，何必隐？","老莱子曰：「吾不能为人所制。」"),t("yi","evade","隐与仕，各从其志。","老莱子曰：「与其妻逃于江南。」")),l("隐而不仕，于天下何益？",t("ming","hit","隐者非无用。上不夺民之利，下不争人之位，此亦有益。","老莱子曰：「此吾之所守也。」"),t("li","reason","无益。贤者当出而济世。","老莱子曰：「吾不能为人所制。」"),t("shi","evade","益与不益，非隐者所计。","老莱子曰：「著书十五篇。」")),l("妻亦劝君勿仕，君以为然乎？",t("ming","hit","然。夫妇同其志，则可以久。独行则易变。","老莱子曰：「此吾之所以与妻偕隐也。」"),t("li","reason","妇人何知？当自决之。","老莱子曰：「其妻曰：可食以酒肉者，可随以鞭棰。」"),t("yi","evade","妻之言，亦是一说。","老莱子曰：「遂逃于江南。」"))],null,{success:"老莱子曰：「君可与言隐矣。」",compromise:"老莱子曰：「君之言，有见。」",fail:"老莱子曰：「君犹慕于禄。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_laolaizi_caiyi","戏彩娱亲","court","yi",!1,"老莱子","楚之隐者","老莱子年七十，着五色斑斓之衣，为婴儿戏于亲侧。",[l("年七十而作婴儿戏，何如？",t("yi","hit","孝之至也。亲老则忧其衰，故作婴儿之态以娱之。","老莱子曰：「此吾之所以为也。」"),t("li","reason","近于戏。老者当自重。","老莱子曰：「着五色斑斓之衣。」"),t("ming","evade","娱亲之术，各随其宜。","老莱子曰：「为婴儿戏于亲侧。」")),l("孝之至，在养其身乎？在娱其心乎？",t("yi","hit","在娱其心。身之养易，心之乐难。","老莱子曰：「此吾所谓孝也。」"),t("li","reason","在养其身。口体不足，何乐之有？","老莱子曰：「为婴儿戏于亲侧。」"),t("ming","evade","二者兼尽，方为孝。","老莱子曰：「此吾之所以为也。」")),l("诈跌卧地，作婴儿啼，以娱亲意。君以为过乎？",t("yi","hit","不过。亲之心在一笑，则跌亦无伤。","老莱子曰：「此吾之所以为也。」"),t("li","reason","过矣。老者跌仆，恐致伤。","老莱子曰：「诈跌卧地。」"),t("shi","evade","过与不过，唯亲知之。","老莱子曰：「为婴儿戏于亲侧。」"))],null,{success:"老莱子曰：「君可与言孝矣。」",compromise:"老莱子曰：「君之言，半得。」",fail:"老莱子曰：「君犹重体而轻心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},nu={theme:"中庸与诚",intro:"子思作《中庸》，传孔子之道于孟子。",debates:[f("v_zisi_zhongyong","中庸","court","yi",!0,"子思","孔门之孙","子思曰：「喜怒哀乐之未发，谓之中；发而皆中节，谓之和。」",[l("中和之说，何以治天下？",t("yi","hit","致中和，天地位焉，万物育焉。上之情正，则下自安。","子思曰：「此吾之所谓中庸也。」"),t("li","reason","情之发有节，则事无过不及。此治之要。","子思曰：「发而皆中节，谓之和。」"),t("ming","evade","中和者，修养之事，非政之要。","子思曰：「喜怒哀乐之未发。」")),l("中庸与乡愿，何以别？",t("yi","hit","中庸者，择善而固执；乡愿者，同流而合污。貌似而心异。","子思曰：「此吾之所以辨也。」"),t("li","reason","二者皆不偏不倚，何别之有？","子思曰：「发而皆中节。」"),t("shi","evade","名异实同，不必深辨。","子思曰：「喜怒哀乐之未发，谓之中。」")),l("夫子之道，何以能传？",t("yi","hit","以诚传之。诚则不息，不息则久。","子思曰：「此吾之所以作《中庸》也。」"),t("li","reason","以言传之。著之竹帛，则道不亡。","子思曰：「诚者，天之道也。」"),t("ming","evade","传与不传，皆有其数。","子思曰：「喜怒哀乐之未发。」"))],null,{success:"子思曰：「君可与言中矣。」",compromise:"子思曰：「君之言，可采。」",fail:"子思曰：「君之说，近于乡愿。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zisi_cheng","诚","court","yi",!1,"子思","孔门之孙","子思曰：「诚者，天之道也；诚之者，人之道也。」",[l("诚可为天下之本乎？",t("yi","hit","可。不诚无物。上不诚则下不信，下不信则事不成。","子思曰：「此吾之所谓诚也。」"),t("li","reason","诚者一人之德，何关天下？","子思曰：「诚者，天之道也。」"),t("ming","evade","诚与不诚，唯其自知。","子思曰：「诚之者，人之道也。」")),l("至诚可以前知，其说如何？",t("yi","hit","至诚之道，可以前知。国家将兴，必有祯祥；将亡，必有妖孽。","子思曰：「此吾之所以言诚也。」"),t("li","reason","前知者，术数之事，非诚所能致。","子思曰：「至诚如神。」"),t("shi","evade","知与不知，皆在诚之外。","子思曰：「诚者，天之道也。」")),l("诚与明，孰先？",t("yi","hit","诚则明矣，明则诚矣。二者相生，非有先后。","子思曰：「此吾之所谓诚明也。」"),t("li","reason","先明。明而后知所诚。","子思曰：「自诚明，谓之性。」"),t("ming","evade","先后之说，不必执一。","子思曰：「诚则明矣。」"))],null,{success:"子思曰：「君可与言诚矣。」",compromise:"子思曰：「君之言，半是。」",fail:"子思曰：「君犹以诚为虚。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ru={theme:"戎狄之治",intro:"由余，其先晋人也，亡入戎。秦穆公闻其贤。",debates:[f("v_youyu_shishu","诗书礼乐","court","yi",!0,"由余","秦之上卿","秦穆公问：「中国以诗书礼乐法度为政，然尚时乱。今戎夷无此，何以为治？」",[l("戎夷无法度而治，中国有法度而乱，其故安在？",t("yi","hit","中国之乱，正由上失其德而下争其位。礼乐者，饰也；无德则饰为虚。","由余曰：「此吾之所以对也。」"),t("li","reason","戎夷之治，简陋而已，不足称治。","由余曰：「此中国之所以乱也。」"),t("shi","evade","治乱各因其俗，不必相较。","由余曰：「戎夷无此，何以为治？」")),l("以女乐遗戎王，使其荒怠。此术可乎？",t("li","hit","可。兵者诡道，不以奇取胜，则取之必难。","由余曰：「此吾之所以去戎也。」"),t("yi","reason","以女乐乱人之国，非仁者所为。","由余曰：「秦穆公以女乐遗戎王。」"),t("shi","evade","术之正否，视其成败。","由余曰：「此中国之所以乱也。」")),l("戎王既荒于乐，君遂去之。君以为可乎？",t("li","hit","可。谏而不听，则去。留而无益。","由余曰：「此吾之所以降秦也。」"),t("yi","reason","不可。既事其君，当死其难。","由余曰：「戎王不听。」"),t("ming","evade","去留皆有其时。","由余曰：「遂降秦。」"))],null,{success:"由余曰：「君可与言治矣。」",compromise:"由余曰：「君之言，有见。」",fail:"由余曰：「君之说，犹守虚文。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youyu_rong","去戎事秦","court","li",!1,"由余","秦之上卿","由余数谏戎王，戎王不听。由余遂降秦。",[l("去戎而降秦，君以为可乎？",t("li","hit","可。谏而不听，则去。留而无益，徒自困耳。","由余曰：「此吾之所以降也。」"),t("yi","reason","不可。既事其君，当死其难。","由余曰：「戎王不听。」"),t("shi","evade","去留皆有其时。","由余曰：「遂降秦。」")),l("以戎之情告秦，君不以为负乎？",t("li","hit","非负也。吾已去戎，则戎非吾君。","由余曰：「此吾之所以为秦谋也。」"),t("yi","reason","负矣。戎王虽不听，犹是故主。","由余曰：「秦用其谋，遂霸西戎。」"),t("ming","evade","负与不负，后人自评。","由余曰：「由余遂降秦。」")),l("秦用君之谋而霸西戎，君以为功乎？",t("li","hit","功在秦，不在我。谋者臣职，用者君权。","由余曰：「此吾之所以自处也。」"),t("yi","reason","功在我。无吾之谋，秦不能霸。","由余曰：「秦用其谋。」"),t("shi","evade","功之所属，不必较。","由余曰：「遂霸西戎。」"))],null,{success:"由余曰：「君可与言去就矣。」",compromise:"由余曰：「君之言，半得。」",fail:"由余曰：「君犹以故主为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ou={theme:"召陵之盟",intro:"齐桓公伐楚，次于陉。楚子使屈完如师。",debates:[f("v_quwan_zhaoling","召陵之盟","diplomacy","yi",!0,"屈完","楚之大夫","齐侯曰：「以此众战，谁能御之？以此攻城，何城不克？」",[l("齐侯以众威胁，君何以对？",t("yi","hit","君若以德绥诸侯，谁敢不服？若以力，楚国方城以为城，汉水以为池，虽众无所用之。","屈完曰：「此吾之所以对也。」"),t("li","reason","当示弱以求和。齐强楚弱，不可硬抗。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","强弱之势，言之无益。","屈完曰：「以此众战，谁能御之？」")),l("齐以包茅不入为辞，君以为有理乎？",t("yi","hit","包茅不入，寡君之罪也。然齐以此为名，其实畏楚之强。","屈完曰：「贡之不入，寡君之罪也。」"),t("li","reason","无理。齐欲伐楚，假此为由耳。","屈完曰：「昭王之不复，君其问诸水滨。」"),t("ming","evade","名与实，不必深辨。","屈完曰：「君若以德绥诸侯。」")),l("盟成，君与齐侯同乘而观。君以为荣乎？",t("yi","hit","非荣也。盟成则兵息，此吾之所以从也。","屈完曰：「此吾之所以同乘也。」"),t("li","reason","荣矣。与霸主同乘，楚国之光。","屈完曰：「屈完与齐侯同乘。」"),t("shi","evade","荣与不荣，皆外也。","屈完曰：「君若以德绥诸侯。」"))],null,{success:"屈完曰：「君可与言辞矣。」",compromise:"屈完曰：「君之言，可采。」",fail:"屈完曰：「君之说，示弱于敌。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_quwan_ci","辞令","diplomacy","yi",!1,"屈完","楚之大夫","或问：「以弱国使强邻，何以为辞？」屈完曰：「不卑不亢。」",[l("不卑不亢，其道如何？",t("yi","hit","卑则见轻，亢则见怒。守其分而不失其辞，斯可矣。","屈完曰：「此吾之所以为使也。」"),t("li","reason","当卑辞以求存。小国无亢之理。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","辞之卑亢，视其势。","屈完曰：「楚国方城以为城。」")),l("强国以兵威相挟，君将何以处之？",t("yi","hit","示之以不可胜。彼知难而退，则不战而存。","屈完曰：「此吾之所以言方城汉水也。」"),t("li","reason","当许其请。兵威之下，无辞可恃。","屈完曰：「虽众无所用之。」"),t("ming","evade","威与德，皆外也。","屈完曰：「不卑不亢。」")),l("使而不辱命，其要安在？",t("yi","hit","在知其国之不可犯，而不轻言其可犯。","屈完曰：「善哉！君知使矣。」"),t("li","reason","在善辞令，能转人之意。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","要在得人，非一言可尽。","屈完曰：「不卑不亢。」"))],null,{success:"屈完曰：「君可与言使矣。」",compromise:"屈完曰：「君之言，半是。」",fail:"屈完曰：「君犹失辞。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},lu={theme:"隐谏",intro:"伍举，楚之大夫。以「三年不飞不鸣」之隐谏庄王。",debates:[f("v_wuju_yin","隐谏","court","ming",!0,"伍举","楚之大夫","楚庄王即位三年，不出号令，日夜为乐。伍举入谏曰：「有鸟在于阜，三年不飞不鸣，是何鸟也？」",[l("三年不飞不鸣，此鸟何也？",t("ming","hit","三年不飞，飞将冲天；三年不鸣，鸣将惊人。","庄王曰：「举退矣，吾知之矣。」"),t("li","reason","此鸟无能耳。君当去之。","伍举曰：「有鸟在于阜。」"),t("yi","evade","鸟之飞鸣，自有其时。","伍举曰：「三年不飞不鸣。」")),l("王曰「吾知之矣」而不改，君当如何？",t("ming","hit","再谏。一言未入，则更其辞。","伍举曰：「此吾之所以再谏也。」"),t("li","reason","当去。谏而不改，则无可为。","伍举曰：「有鸟在于阜。」"),t("shi","evade","改与不改，在君。","伍举曰：「三年不鸣。」")),l("苏从继君而谏，王遂听之。君以为何如？",t("ming","hit","谏者非一人之力。吾发其端，苏从成其终。","伍举曰：「此吾之所以与从也。」"),t("li","reason","苏从之谏，胜于吾之隐语。","伍举曰：「有鸟在于阜。」"),t("yi","evade","谁之力，不必较。","伍举曰：「三年不飞不鸣。」"))],null,{success:"伍举曰：「君可与言谏矣。」",compromise:"伍举曰：「君之言，可采。」",fail:"伍举曰：「君未达隐谏之法。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_wuju_zhanghua","章华之台","domestic","ming",!1,"伍举","楚之大夫","楚灵王为章华之台，与伍举升焉。曰：「台美夫！」",[l("台之美，君以为可夸乎？",t("ming","hit","臣闻国君服宠以为美，安民以为乐，听德以为聪，致远以为明。不闻以土木之崇高为美。","伍举曰：「此吾之所以谏也。」"),t("li","reason","台成而美，亦是国之威仪。","伍举曰：「台美夫！」"),t("yi","evade","美与不美，皆外也。","伍举曰：「臣闻国君服宠以为美。」")),l("土木之费，何以为度？",t("ming","hit","不夺民时，不耗民财。台以望氛祥，榭以讲军实，斯可矣。","伍举曰：「此吾之所谓度也。」"),t("li","reason","国力所及，即可为之。","伍举曰：「不闻其以土木之崇高为美。」"),t("shi","evade","度之所在，随其时而异。","伍举曰：「台美夫！」")),l("灵王不听，终有乾溪之祸。君以为何如？",t("ming","hit","谏而不听，则君自受之。非谏者之罪。","伍举曰：「此吾之所以尽言也。」"),t("li","reason","当更强谏。不听则去。","伍举曰：「台美夫！」"),t("yi","evade","祸福有数，非人所能回。","伍举曰：「臣闻国君服宠以为美。」"))],null,{success:"伍举曰：「君可与言奢俭矣。」",compromise:"伍举曰：「君之言，半得。」",fail:"伍举曰：「君犹以土木为美。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},cu={theme:"君明乐官",intro:"田子方，魏文侯之师，学于子夏。",debates:[f("v_tianzifang_yue","君明乐官","court","yi",!0,"田子方","魏之师","魏文侯与田子方饮，文侯曰：「钟声不比乎？左高。」田子方笑。",[l("君知乐音，君以为明乎？",t("yi","hit","臣闻之，君明乐官，不明乐音。今君审于音，臣恐其聋于官也。","田子方曰：「此吾之所以笑也。」"),t("li","reason","知音者近于明。君能审音，亦足见其聪。","田子方曰：「君明乐官，不明乐音。」"),t("ming","evade","音之高低，小节耳。","田子方曰：「钟声不比乎？」")),l("君当务其大者，抑或兼察其细？",t("yi","hit","务其大者。人主之职在任官，不在审音。","田子方曰：「此吾之所以言也。」"),t("li","reason","兼察其细。细不察则大亦废。","田子方曰：「臣恐其聋于官也。」"),t("shi","evade","大细各有所宜。","田子方曰：「君明乐官。」")),l("文侯曰「善」，君以为可教乎？",t("yi","hit","可教。知过而即改，此君之所以为贤。","田子方曰：「此吾之所以事魏也。」"),t("li","reason","一时之顺耳。未必真改。","田子方曰：「君明乐官。」"),t("ming","evade","改与不改，在他日。","田子方曰：「钟声不比乎？」"))],null,{success:"田子方曰：「君可与言君道矣。」",compromise:"田子方曰：「君之言，可采。」",fail:"田子方曰：「君犹务其细。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_tianzifang_pin","贫贱骄人","court","yi",!1,"田子方","魏之师","子击逢田子方于道，下车伏谒。子方不为礼。",[l("富贵者骄人，抑或贫贱者骄人？",t("yi","hit","亦贫贱者骄人耳。诸侯而骄人则失其国，贫贱者行不合则去之楚越，若脱躧然。","田子方曰：「此吾之所以不为礼也。」"),t("li","reason","富贵者骄人。位高则易慢。","田子方曰：「亦贫贱者骄人耳。」"),t("shi","evade","骄与不骄，在人不在位。","田子方曰：「富贵者安敢骄人？」")),l("子方不为礼，君以为倨乎？",t("yi","hit","非倨也。师者不臣于弟子，礼不为屈。","田子方曰：「此吾之所以自处也。」"),t("li","reason","倨矣。子击虽弟子，亦是贵胄。","田子方曰：「贫贱者骄人耳。」"),t("ming","evade","礼之屈伸，各有所宜。","田子方曰：「亦贫贱者骄人耳。」")),l("子击怒而问之，君以何对？",t("yi","hit","以理对，不以位对。位可屈人，理不可以屈。","田子方曰：「善哉！君知吾之意矣。」"),t("li","reason","当谢过。失礼于贵胄，非全身之道。","田子方曰：「亦贫贱者骄人耳。」"),t("shi","evade","对与不对，皆一时之事。","田子方曰：「富贵者安敢骄人？」"))],null,{success:"田子方曰：「君可与言礼矣。」",compromise:"田子方曰：「君之言，半是。」",fail:"田子方曰：「君犹以位论人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},uu={theme:"不为臣",intro:"段干木，晋之隐士，学于子夏。魏文侯过其闾而式之。",debates:[f("v_duanganmu_yuqiang","逾墙避之","court","ming",!0,"段干木","晋之隐士","魏文侯欲见段干木，段干木逾墙避之。",[l("君侯求见而逾墙避之，何也？",t("ming","hit","不为臣则不见诸侯。见则有君臣之分，分定则不能守其志。","段干木曰：「此吾之所以避也。」"),t("li","reason","君侯礼贤，何故避之？当就见。","段干木曰：「不为臣不见诸侯。」"),t("yi","evade","见与不见，皆小节。","段干木曰：「逾墙避之。」")),l("文侯过其闾而式之，何如？",t("ming","hit","式其闾者，式其德也。不以其位，而以其道。","段干木曰：「此吾之所以不仕而名也。」"),t("li","reason","过其闾而式，过礼也。君侯太屈。","段干木曰：「文侯过其闾而式之。」"),t("shi","evade","式与不式，皆君侯之意。","段干木曰：「不为臣不见诸侯。」")),l("隐者之名，何以能重于诸侯？",t("ming","hit","以其不入也。不入则无求，无求则其言重。","段干木曰：「此吾之所以能不仕也。」"),t("li","reason","名者人所加。隐者何名之重？","段干木曰：「文侯过其闾而式之。」"),t("shi","evade","轻重之势，非人所能强。","段干木曰：「不为臣不见诸侯。」"))],null,{success:"段干木曰：「君可与言守矣。」",compromise:"段干木曰：「君之言，有见。」",fail:"段干木曰：「君犹慕于见用。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_duanganmu_xian","好贤之效","court","ming",!1,"段干木","晋之隐士","魏文侯谓曰：「寡人何如？」曰：「君好贤矣。」",[l("好贤而不任用，可乎？",t("ming","hit","好之不如用之。好而不举，犹不好也。","段干木曰：「此吾之所以不仕也。」"),t("li","reason","好之已足。贤者不必尽用。","段干木曰：「君好贤矣。」"),t("yi","evade","好与用，各有其分。","段干木曰：「不为臣不见诸侯。」")),l("文侯曰「寡人好贤」，而秦国不敢加兵。君以为何如？",t("ming","hit","好贤之名，亦可以止兵。名之所至，实效随之。","段干木曰：「此吾所谓不仕而有益也。」"),t("li","reason","虚名耳，不能御兵。","段干木曰：「君好贤矣。」"),t("yi","evade","名与实，不必相待。","段干木曰：「文侯过其闾而式之。」")),l("隐而不仕，其功何在？",t("ming","hit","在使人主知有不可屈之士。此风一立，天下之士皆至。","段干木曰：「善哉！君知隐者之功矣。」"),t("li","reason","无功可言。不仕则不任其事。","段干木曰：「君好贤矣。」"),t("shi","evade","功之有无，非所计。","段干木曰：「不为臣不见诸侯。」"))],null,{success:"段干木曰：「君可与言贤矣。」",compromise:"段干木曰：「君之言，半得。」",fail:"段干木曰：「君犹好名而不好实。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},du={theme:"老而可用",intro:"鬻子名熊，楚之先祖。年九十见周文王。",debates:[f("v_yuzi_lao","老而可用","court","yi",!0,"鬻子","楚之先师","鬻子年九十见文王。文王曰：「嘻，老矣。」鬻子曰：「使臣捕兽逐麋，则老矣；使臣坐策国事，则臣尚少也。」",[l("年九十而策国事，可乎？",t("yi","hit","可。谋者在心，不在筋骨。老者谋事，其思虑深。","鬻子曰：「此吾之所以对文王也。」"),t("li","reason","不可。齿衰则思亦衰。当用壮者。","鬻子曰：「坐策国事，臣尚少也。」"),t("ming","evade","老少各有所宜。","鬻子曰：「嘻，老矣。」")),l("老臣与少臣，孰宜于谋？",t("yi","hit","老臣谋其大，少臣任其劳。二者相须。","鬻子曰：「此吾之所以能事周也。」"),t("li","reason","少臣锐进，老臣守旧。用少为宜。","鬻子曰：「坐策国事，臣尚少也。」"),t("shi","evade","视事之难易而择。","鬻子曰：「捕兽逐麋，则老矣。」")),l("文王遂用君，君以为何如？",t("yi","hit","文王之用，非用吾身，用吾言也。此王者之所以兴。","鬻子曰：「此吾之所以事周也。」"),t("li","reason","过矣。九十之人，岂能任事？","鬻子曰：「坐策国事，臣尚少也。」"),t("ming","evade","用与不用，皆有其时。","鬻子曰：「嘻，老矣。」"))],null,{success:"鬻子曰：「君可与言用贤矣。」",compromise:"鬻子曰：「君之言，可采。」",fail:"鬻子曰：「君犹以年论人。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yuzi_jiaohua","教化","court","yi",!1,"鬻子","楚之先师","鬻子曰：「君子不以其所能者病人。」",[l("不以其所能者病人，其说如何？",t("yi","hit","己能之而人不能，则不当以此责人。责之则人不堪。","鬻子曰：「此吾之所以教也。」"),t("li","reason","能者当教不能者。不责则人无所劝。","鬻子曰：「君子不以其所能者病人。」"),t("ming","evade","能与不能，本自不同。","鬻子曰：「老而可用。」")),l("教民之道，当宽乎？当严乎？",t("yi","hit","宽而有节。严则民畏而不亲，宽则民慢而不从。","鬻子曰：「此吾之所谓教也。」"),t("li","reason","当严。民无知，非严不立。","鬻子曰：「君子不以其所能者病人。」"),t("shi","evade","宽严随时，不必执一。","鬻子曰：「坐策国事，臣尚少也。」")),l("楚之兴，君以为在何？",t("yi","hit","在后世能守其教。教存则国存。","鬻子曰：「此吾之所以为楚先也。」"),t("li","reason","在兵力。无兵则虽有教不立。","鬻子曰：「君子不以其所能者病人。」"),t("ming","evade","兴亡有数，非一言可尽。","鬻子曰：「老而可用。」"))],null,{success:"鬻子曰：「君可与言教矣。」",compromise:"鬻子曰：「君之言，半是。」",fail:"鬻子曰：「君犹以己度人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},mu={theme:"弭兵",intro:"华元，宋之大夫。倡弭兵之会。",debates:[f("v_huayuan_mibing","弭兵","diplomacy","yi",!0,"华元","宋之大夫","华元倡弭兵之会，晋楚既成，各国息兵。",[l("兵可弭乎？",t("yi","hit","可弭一时。弭兵者，弭目前之兵耳。欲弭百世之兵，则须有礼。","华元曰：「此吾之所以为会也。」"),t("li","reason","不可。兵者国之大事，岂能尽弭？","华元曰：「晋楚既成，各国息兵。」"),t("shi","evade","弭与不弭，皆有其时。","华元曰：「兵可弭乎？」")),l("以私交成两国之好，可乎？",t("yi","hit","可。弭兵之会，本由私交而成。然私交易败，故当继之以礼。","华元曰：「此吾之所以成也。」"),t("li","reason","不可。国之大事，不当以私交决之。","华元曰：「吾与晋楚之大夫皆相善。」"),t("ming","evade","公私之界，有时难分。","华元曰：「晋楚既成。」")),l("弭兵之后，诸侯益骄，兵争如故。君以为何如？",t("yi","hit","弭兵者，息一时之肩，非弭百世之患。能息一时，亦足矣。","华元曰：「此吾之所以不悔也。」"),t("li","reason","弭兵无功。徒长诸侯之骄。","华元曰：「晋楚既成。」"),t("shi","evade","功过皆后人论之。","华元曰：「兵可弭乎？」"))],null,{success:"华元曰：「君可与言弭兵矣。」",compromise:"华元曰：「君之言，可采。」",fail:"华元曰：「君之说，未达弭兵之意。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_huayuan_yangzhen","羊斟","military","yi",!1,"华元","宋之大夫","宋华元将战，杀羊食士，其御羊斟不与。",[l("杀羊食士而遗其御，君以为失乎？",t("yi","hit","失矣。一羊之微，而致师败身囚。小不忍则乱大谋。","华元曰：「此吾之所以败也。」"),t("li","reason","无失。御者不当与之。","华元曰：「畴昔之羊，子为政。」"),t("shi","evade","得失皆小，不必论。","华元曰：「羊斟不与。」")),l("小怨而致大祸，当如何防之？",t("yi","hit","凡事当均。均则无怨。","华元曰：「此吾之所以悔也。」"),t("li","reason","当严刑以惩。惩一人则众惧。","华元曰：「今日之事，我为政。」"),t("ming","evade","事之变，非人所豫防。","华元曰：「杀羊食士。」")),l("既败而逃归，君以为可耻乎？",t("yi","hit","可耻。为将而败，当死。吾之不死，为宋国也。","华元曰：「此吾之所以自愧也。」"),t("li","reason","不可耻。留身以图后效。","华元曰：「吾遂逃归。」"),t("shi","evade","耻与不耻，皆外也。","华元曰：「杀羊食士。」"))],null,{success:"华元曰：「君可与言均矣。」",compromise:"华元曰：「君之言，半得。」",fail:"华元曰：「君犹忽于小。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},hu={theme:"再弭兵",intro:"向戌，宋之大夫。继华元之后再倡弭兵之会。",debates:[f("v_xiangxu_mibing","再倡弭兵","diplomacy","yi",!0,"向戌","宋之大夫","向戌欲弭兵，告于晋楚，晋楚许之。会于宋，诸侯从之。",[l("弭兵再度举行，其效可久乎？",t("yi","hit","可久一时。然弭兵而不废兵，兵犹在也。","向戌曰：「此吾之所知也。」"),t("li","reason","可久。诸侯既盟，谁敢违约？","向戌曰：「晋楚既许之。」"),t("shi","evade","久暂有数，非人所能料。","向戌曰：「会于宋。」")),l("以弭兵为名求名于诸侯，可乎？",t("yi","hit","弭兵者，为天下息肩，非为名也。若为名，则其会不能久。","向戌曰：「此吾之所守也。」"),t("li","reason","可。名既立，则事自成。","向戌曰：「宋之大夫向戌。」"),t("ming","evade","名实之间，难以尽分。","向戌曰：「诸侯从之。」")),l("会既成，君请免死之邑。君以为当乎？",t("li","hit","不当。弭兵者天下之利，非一身之功。以为功而请邑，则其会为利也。","向戌曰：「此吾之所以见讥也。」"),t("yi","reason","当。有功而不赏，则人无所劝。","向戌曰：「请免死之邑。」"),t("shi","evade","请与不请，各从其意。","向戌曰：「子罕削而与之。」"))],null,{success:"向戌曰：「君可与言弭兵矣。」",compromise:"向戌曰：「君之言，可采。」",fail:"向戌曰：「君犹以名为事。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xiangxu_fengyi","请邑","court","li",!1,"向戌","宋之大夫","弭兵既成，向戌请免死之邑于宋公。司城子罕曰：「凡诸侯小国，晋楚所以兵威之。」",[l("子罕削其邑，君不怨乎？",t("li","hit","不怨。子罕之言，正吾之失。","向戌曰：「此吾之所以服也。」"),t("yi","reason","当怨。功成而赏削，非国之信。","向戌曰：「子罕削而与之。」"),t("ming","evade","怨与不怨，皆私情。","向戌曰：「请免死之邑。」")),l("有功而不受赏，君以为高乎？",t("li","hit","高。功成不居，则人不能以利诱之。","向戌曰：「此吾之所以终服子罕也。」"),t("yi","reason","不高。有功当赏，逃赏则沮来者。","向戌曰：「请免死之邑。」"),t("shi","evade","受与不受，各从其志。","向戌曰：「子罕削而与之。」")),l("弭兵之利，果在诸侯乎？",t("li","hit","在民。兵息则民得耕，此其利也。","向戌曰：「此吾之所以为会也。」"),t("yi","reason","在晋楚。小国仍受其制。","向戌曰：「凡诸侯小国，晋楚所以兵威之。」"),t("ming","evade","利之所在，难以一言尽。","向戌曰：「诸侯从之。」"))],null,{success:"向戌曰：「君可与言功矣。」",compromise:"向戌曰：「君之言，半是。」",fail:"向戌曰：「君犹以功为利。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},fu={theme:"权臣",intro:"祭足，字仲，郑之权臣。",debates:[f("v_jizu_quan","权臣","court","li",!0,"祭足","郑之卿","宋人执祭仲，使立厉公。祭仲许之，遂出昭公而立厉公。",[l("君命与国存，孰重？",t("li","hit","国存为重。身与君命，皆可权。","祭足曰：「此吾之所以许宋也。」"),t("yi","reason","君命为重。背君命以求存，非臣道。","祭足曰：「宋人执我，使我立厉公。」"),t("shi","evade","存亡之际，难以常理论。","祭足曰：「遂出昭公而立厉公。」")),l("出君立君，君不惧后世之讥乎？",t("li","hit","惧。然郑不立君则乱，乱则亡。宁受讥而存国。","祭足曰：「此吾之所以行也。」"),t("yi","reason","当守节而死。死则名存，国亦不亡。","祭足曰：「吾许之。」"),t("ming","evade","讥与不讥，后人之论。","祭足曰：「祭仲立昭公。」")),l("权臣专国，其祸安在？",t("li","hit","在身死而国乱。权不去则君不安，君不安则国不宁。","祭足曰：「此吾之所以自知也。」"),t("yi","reason","在失臣节。专权者终必不忠。","祭足曰：「祭仲专。」"),t("shi","evade","祸福相倚，非一言可尽。","祭足曰：「遂出昭公而立厉公。」"))],null,{success:"祭足曰：「君可与言权矣。」",compromise:"祭足曰：「君之言，有见。」",fail:"祭足曰：「君犹守常而不达变。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jizu_zhuanquan","专权","court","li",!1,"祭足","郑之卿","祭仲专郑国之政，厉公患之，使其婿雍纠杀之。",[l("权臣专国，君当如何处之？",t("li","hit","当徐夺其权，不可骤诛。骤诛则其党必乱。","祭足曰：「此吾之所以能专也。」"),t("yi","reason","当明正其罪而诛之。迟则生变。","祭足曰：「厉公使雍纠杀我。」"),t("shi","evade","专与不专，皆有其势。","祭足曰：「祭仲专。」")),l("雍纠之谋泄，君以为谁之过？",t("li","hit","谋不密则败。雍纠之过，非君之过。","祭足曰：「此吾之所以得免也。」"),t("yi","reason","君之过。用人不当，谋及私人。","祭足曰：「雍纠之妻，吾女也。」"),t("ming","evade","事之成败，非一人之过。","祭足曰：「遂杀雍纠。」")),l("雍姬告其父，君以为可乎？",t("li","hit","可。人尽夫也，父一而已。","祭足曰：「此吾女之所以告我也。」"),t("yi","reason","不可。夫妻之义，亦不可弃。","祭足曰：「雍姬告之。」"),t("shi","evade","告与不告，皆有其难。","祭足曰：「遂杀雍纠。」"))],null,{success:"祭足曰：「君可与言权矣。」",compromise:"祭足曰：「君之言，半是。」",fail:"祭足曰：「君犹昧于机事。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},pu={theme:"夏日之日",intro:"赵盾，晋之正卿。狐偃曰：「赵衰冬日之日也，赵盾夏日之日也。」",debates:[f("v_zhaodun_dongri","夏日之日","court","yi",!0,"赵盾","晋之正卿","或问：「赵衰冬日之日，赵盾夏日之日，何谓也？」",[l("冬日之日与夏日之日，孰为政之道？",t("yi","hit","冬日之日可爱，夏日之日可畏。政宽则人爱，政严则人畏。二者不可偏废。","赵盾曰：「此吾之所以为政也。」"),t("li","reason","冬日者，人之所愿。为政当宽。","赵盾曰：「赵衰冬日之日也。」"),t("shi","evade","爱与畏，皆外也。","赵盾曰：「赵盾夏日之日也。」")),l("政严则人畏，君不惧失民心乎？",t("yi","hit","畏而后可以立政。民不畏法则法不行，法不行则乱。","赵盾曰：「此吾之所以严也。」"),t("li","reason","当宽以得众。严则民离。","赵盾曰：「夏日之日。」"),t("ming","evade","宽严随时，不必执一。","赵盾曰：「赵衰冬日之日也。」")),l("父子异道，君以为何如？",t("yi","hit","时异则道异。衰之时宜宽，盾之时宜严。","赵盾曰：「此吾之所以异于先君也。」"),t("li","reason","当守父之道。改之则失其本。","赵盾曰：「赵衰冬日之日也。」"),t("shi","evade","道之同异，非所计。","赵盾曰：「赵盾夏日之日也。」"))],null,{success:"赵盾曰：「君可与言政矣。」",compromise:"赵盾曰：「君之言，可采。」",fail:"赵盾曰：「君之说，未达宽严之宜。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhaodun_donghu","董狐直笔","court","yi",!1,"赵盾","晋之正卿","晋灵公欲杀赵盾。盾出奔，未出境而赵穿弑灵公。太史书曰：「赵盾弑其君。」",[l("盾未弑君，而史书弑君，君以为冤乎？",t("yi","hit","不冤。吾为正卿，亡不越境，反不讨贼，非我而谁？","赵盾曰：「此吾之所以受之也。」"),t("li","reason","冤矣。弑者赵穿，非盾。","赵盾曰：「董狐，良史也。」"),t("shi","evade","书法之严，后人自明。","赵盾曰：「亡不越境，反不讨贼。」")),l("孔子曰「越竟乃免」，君以为然乎？",t("yi","hit","然。越境则君臣之义绝，义绝则不任其责。","赵盾曰：「此夫子之所以惜我也。」"),t("li","reason","不然。未弑君而书弑，法之过也。","赵盾曰：「惜也，越竟乃免。」"),t("ming","evade","免与不免，皆有其义。","赵盾曰：「赵盾弑其君。」")),l("董狐不改其笔，君以为贤乎？",t("yi","hit","贤。史之职在直笔，不在全身。","赵盾曰：「董狐，古之良史也。」"),t("li","reason","太执。事有可权，何必自苦？","赵盾曰：「书法不隐。」"),t("shi","evade","贤与不贤，后人自评。","赵盾曰：「亡不越境，反不讨贼。」"))],null,{success:"赵盾曰：「君可与言史法矣。」",compromise:"赵盾曰：「君之言，半得。」",fail:"赵盾曰：「君犹以身为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},gu={theme:"三仕三已",intro:"子文，楚之令尹。三仕为令尹，无喜色；三已之，无愠色。",debates:[f("v_ziwen_sanshi","三仕三已","court","yi",!0,"子文","楚之令尹","子文三仕为令尹，无喜色；三已之，无愠色。",[l("三仕无喜，三已无愠，君以为难乎？",t("yi","hit","难。禄位者，人之所争。能不以得失动心者，鲜矣。","子文曰：「此吾之所以自处也。」"),t("li","reason","不难。位有去来，何必动心？","子文曰：「三仕为令尹，无喜色。」"),t("shi","evade","喜愠皆情，何必强抑？","子文曰：「三已之，无愠色。」")),l("旧政必告新令尹，君以为忠乎？",t("yi","hit","忠。政非一人之私，当以国为重。","子文曰：「此吾之所以告也。」"),t("li","reason","不必。新令尹自有其政。","子文曰：「旧令尹之政，必以告新令尹。」"),t("ming","evade","告与不告，皆有其分。","子文曰：「何勤民之惧而告之？」")),l("孔子称其「忠」，君以为何如？",t("yi","hit","忠者，尽己之谓。吾之所行，不过尽己而已。","子文曰：「此夫子之所以称我也。」"),t("li","reason","忠而未智。三已而不去，何益？","子文曰：「三已之，无愠色。」"),t("shi","evade","称与不称，皆外也。","子文曰：「三仕为令尹。」"))],null,{success:"子文曰：「君可与言忠矣。」",compromise:"子文曰：「君之言，可采。」",fail:"子文曰：「君犹动于得失。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_ziwen_hui","毁家纾难","domestic","yi",!1,"子文","楚之令尹","楚有内乱，子文毁其家以纾国难。",[l("毁家纾难，君以为可乎？",t("yi","hit","可。国亡则家无所托。先国而后家。","子文曰：「此吾之所以为也。」"),t("li","reason","不可。家者国之本，家毁则国亦弱。","子文曰：「毁其家以纾国难。」"),t("shi","evade","缓急之势，各有所宜。","子文曰：「国之多难。」")),l("国难既纾，而家已毁。君悔乎？",t("yi","hit","不悔。国存则家可复，国亡则家无从。","子文曰：「此吾之所以不悔也。」"),t("li","reason","悔。当留其家，为后日之计。","子文曰：「毁其家。」"),t("ming","evade","悔与不悔，皆无及矣。","子文曰：「国之多难，吾不敢爱死。」")),l("家与国，孰为本？",t("yi","hit","国为本。国存则家可立，国亡则家无所依。","子文曰：「此吾之所以毁家也。」"),t("li","reason","家为本。家齐而后国治。","子文曰：「毁其家以纾国难。」"),t("shi","evade","本之所在，随其时而异。","子文曰：「国之多难。」"))],null,{success:"子文曰：「君可与言国矣。」",compromise:"子文曰：「君之言，半是。」",fail:"子文曰：「君犹以家为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},xo={shi_mo:Wc,deng_xi:Zc,lie_yu_kou:Xc,yang_zhu:Jc,hui_shi:eu,gong_sun_long:iu,zou_yan:tu,chunyu_kun:au,lao_lai_zi:su,zi_si:nu,you_yu:ru,qu_wan:ou,wu_ju:lu,tian_zi_fang:cu,duan_gan_mu:uu,yu_zi:du,hua_yuan:mu,xiang_xu:hu,ji_zu:fu,jin_zhao_dun:pu,zi_wen:gu};Ze();var yu={theme:"勇与义",intro:"子路性鄙，好勇力，志伉直，冠雄鸡，佩豭豚。",debates:[f("v_zilu_yong","好勇","military","shi",!0,"子路","孔门政事","子路曰：「君子尚勇乎？」子曰：「君子义以为上。君子有勇而无义为乱。」",[l("勇而无义，则为乱。君以为然乎？",t("shi","hit","然。勇者，器也。器无义，则伤人。","子路曰：「此吾之所以受教也。」"),t("yi","reason","勇者天资，不必尽以义绳之。","子路曰：「君子尚勇乎？」"),t("li","evade","勇与义，各行其道，不必相属。","子路曰：「有勇而无义者为乱。」")),l("闻斯行诸？",t("shi","hit","当先禀父兄，然后行之。","子路曰：「有父兄在，如之何其闻斯行之？」"),t("yi","hit","当度其义。义所在则行，不待命。","子路曰：「聞斯行之。」"),t("li","reason","当虑其利害。有利则行。","子路曰：「有父兄在。」")),l("结缨而死，君以为过乎？",t("shi","hit","不过。冠者，君子之服。死不忘其服，义也。","子路曰：「君子死，冠不免。」"),t("li","reason","过矣。留身以图后效，胜于一死。","子路曰：「结缨而死。」"),t("yi","evade","死生之际，非人所能择。","子路曰：「食其食者不避其难。」"))],z("结缨图",1,"你呈上结缨图：蒯聩之乱，子路结缨而死于台下。"),{success:"子路曰：「君可与言勇矣。」",compromise:"子路曰：「君之言，有可取。」",fail:"子路曰：「君之说，非大丈夫之言。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zilu_zheng","政事","court","shi",!1,"子路","孔门政事","子路问政。子曰：「先之，劳之。」请益。曰：「无倦。」",[l("先之劳之，其说如何？",t("shi","hit","上先其劳，则民不惜其力。上劳则下劝，不待令也。","子路曰：「此吾之所谓政也。」"),t("li","reason","在上者当总其成，不必亲劳。","子路曰：「无倦。」"),t("yi","evade","为政之道，因时而异。","子路曰：「先之，劳之。」")),l("夫子曰「无倦」，何以能无倦？",t("shi","hit","以政为志，则不以政为苦。志在其中，故无倦。","子路曰：「请益。」"),t("li","reason","分任群下，则己可以不倦。","子路曰：「无倦。」"),t("ming","evade","倦与不倦，存乎其人。","子路曰：「先之，劳之。」")),l("蒲邑三年而民信，其道何在？",t("shi","hit","先之劳之而已。不欺民，民亦不欺上。","子路曰：「此吾之所以治蒲也。」"),t("li","reason","严刑峻法而已。民畏则信。","子路曰：「三年而民信。」"),t("yi","evade","民自化之，非政所能致。","子路曰：「可使治其赋也。」"))],null,{success:"子路曰：「君可与言政矣。」",compromise:"子路曰：「君之言，可采。」",fail:"子路曰：「君之说，非治邑之道。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zilu_xiao","孝与直","court","yi",!1,"子路","孔门政事","叶公语孔子曰：「吾党有直躬者，其父攘羊，而子证之。」",[l("父攘羊而子证之，可谓直乎？",t("yi","hit","吾党之直者异于是：父为子隐，子为父隐，直在其中矣。","子路曰：「此吾师之言也。」"),t("shi","reason","证之，直也。父子之私，不可蔽国法。","子路曰：「吾党有直躬者。」"),t("li","reason","不证则法废。当使有司自察。","子路曰：「父为子隐。」")),l("孝与忠，相冲突时当如何？",t("yi","hit","先孝。孝者，人之本也。本立而道生。","子路曰：「此吾之所守也。」"),t("shi","reason","先忠。忠者，公义也。私不可胜公。","子路曰：「直在其中矣。」"),t("ming","evade","二者有时而相成，不必相害。","子路曰：「父为子隐。」")),l("负米百里以养亲，其劳可堪乎？",t("yi","hit","可堪。亲在则劳不以为苦，亲亡则欲养而无由。","子路曰：「此吾之所以伤也。」"),t("li","reason","当求禄以养，不必自苦。","子路曰：「伤哉贫也！」"),t("shi","evade","劳与不劳，皆人子之常。","子路曰：「由也事二亲之时。」"))],null,{success:"子路曰：「君可与言孝矣。」",compromise:"子路曰：「君之言，半是。」",fail:"子路曰：「君未知孝之本。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},vu={theme:"孝与三省",intro:"曾子之孝，孔子以为能通孝道，故授之业，作《孝经》。",debates:[f("v_zengshen_sanxing","三省","court","yi",!0,"曾参","孔门传道","曾子曰：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」",[l("三省之中，孰为最难？",t("yi","hit","传不习乎。忠信犹可勉强，习则须日日为之，不能欺己。","曾参曰：「此吾之所以日省也。」"),t("shi","reason","为人谋而忠，最难。利害当前，忠易失。","曾参曰：「吾日三省吾身。」"),t("li","reason","与朋友交而信，最难。信涉财货。","曾参曰：「为人谋而不忠乎？」")),l("日省其身，何益于国？",t("yi","hit","一国之治，自人人自省始。己正则不待上之督。","曾参曰：「此大学之道也。」"),t("shi","reason","省身者私事，治国者公事，二者不相关。","曾参曰：「吾日三省吾身。」"),t("ming","evade","省与不省，皆在一心。","曾参曰：「传不习乎？」")),l("三省而犹有过，当如何？",t("yi","hit","有过则改。改之未已，又省之。此终身之事。","曾参曰：「过则勿惮改。」"),t("shi","reason","三省而犹有过，则省之无益。当求师法。","曾参曰：「吾日三省吾身。」"),t("li","evade","人孰无过？不必自苦。","曾参曰：「君子之过也，如日月之食焉。」"))],z("孝经竹简",1,"你呈上《孝经》竹简：「身体发肤，受之父母。」"),{success:"曾参曰：「君可与言学矣。」",compromise:"曾参曰：「君之言，有可取。」",fail:"曾参曰：「君之说，未及于省。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zengshen_xiao","孝","court","yi",!0,"曾参","孔门传道","曾子耘瓜，误斩其根。曾皙怒，建大杖以击其背。",[l("父怒而杖之，子当受乎？避乎？",t("yi","hit","小杖则受，大杖则走。受大杖而死，是陷父于不义。","曾参曰：「此夫子之所以教我也。」"),t("shi","reason","当受。子不可避父之责。","曾参曰：「参罪大矣。」"),t("li","reason","当避。身者亲之遗体，不可毁伤。","曾参曰：「身体发肤，受之父母。」")),l("孝之至，在养乎？在敬乎？",t("yi","hit","在敬。养而不敬，与犬马之养何异？","曾参曰：「此孝之本也。」"),t("li","reason","在养。口体不给，敬无所施。","曾参曰：「今之孝者，是谓能养。」"),t("ming","evade","养与敬，皆当尽。","曾参曰：「孝子之养老也。」")),l("身体发肤，不敢毁伤。君以为然乎？",t("yi","hit","然。毁伤其体，即毁伤父母之遗。此孝之始也。","曾参曰：「此吾所作《孝经》之首也。」"),t("shi","reason","成仁取义者，岂能尽免毁伤？","曾参曰：「战阵无勇，非孝也。」"),t("li","evade","身之毁伤，有时势所迫。","曾参曰：「身体发肤，受之父母。」"))],null,{success:"曾参曰：「君可与言孝矣。」",compromise:"曾参曰：「君之言，半得。」",fail:"曾参曰：「君未知孝之道。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zengshen_zhongshu","忠恕","court","yi",!1,"曾参","孔门传道","子曰：「参乎！吾道一以贯之。」曾子曰：「唯。」",[l("夫子之道，忠恕而已矣。其说如何？",t("yi","hit","尽己之谓忠，推己之谓恕。一以贯之，无他道也。","曾参曰：「此吾之法也。」"),t("shi","reason","道大，岂忠恕二字所能尽？","曾参曰：「夫子之道，忠恕而已矣。」"),t("li","reason","当有更精之说，忠恕其粗者。","曾参曰：「吾道一以贯之。」")),l("君子之道，何以能一以贯之？",t("yi","hit","以其本在己。本正则万变不离。","曾参曰：「此吾所谓一也。」"),t("shi","reason","事有万端，岂能以一御之？","曾参曰：「忠恕而已矣。」"),t("ming","evade","一以贯之，唯圣人能之。","曾参曰：「夫子之道。」")),l("士不可以不弘毅，任重而道远。其说如何？",t("yi","hit","仁以为己任，不亦重乎？死而后已，不亦远乎？","曾参曰：「此吾之所自勉也。」"),t("li","reason","任重道远者，当量力。不必自苦。","曾参曰：「士不可以不弘毅。」"),t("shi","evade","弘毅之名，后人加之。","曾参曰：「任重而道远。」"))],null,{success:"曾参曰：「君可与言道矣。」",compromise:"曾参曰：「君之言，有见。」",fail:"曾参曰：「君之说，犹在言语。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},bu={theme:"哭秦庭",intro:"伍员与申包胥友。员曰：「我必覆楚。」包胥曰：「我必存之。」",debates:[f("v_shenbaoxu_kuting","哭秦庭","diplomacy","yi",!0,"申包胥","楚之大夫","吴入郢。申包胥如秦乞师，立依于庭墙而哭，日夜不绝声，勺饮不入口，七日。",[l("哭七日以求师，君以为效乎？",t("yi","hit","效。秦伯赋《无衣》，为之出师。精诚所至，金石为开。","申包胥曰：「此吾之所以哭也。」"),t("li","reason","哀哭无益于兵。不如陈其利害。","申包胥曰：「寡君越在草莽，未获所伏。」"),t("shi","evade","哭与非哭，事成则已。","申包胥曰：「秦伯为之赋《无衣》。」")),l("吴兵在郢，楚已亡。君何以言存？",t("yi","hit","国者，非独城郭宫室。社稷未绝，则非亡也。","申包胥曰：「吾必存之。」"),t("li","reason","既已亡，当图复兴，不必强言。","申包胥曰：「吴为封豕长蛇。」"),t("ming","evade","存亡有数，非人所能强。","申包胥曰：「若亡，则无以事君。」")),l("友人覆楚，君存楚。朋友之义安在？",t("yi","hit","各尽其忠，不为朋友而废其国。吾告之曰：子能覆之，我必能兴之。","申包胥曰：「此吾所以与伍员言也。」"),t("shi","reason","当先朋友而后国。有约在先。","申包胥曰：「我必存之。」"),t("li","reason","从强者而已。不必拘于旧誓。","申包胥曰：「吾必存之。」"))],z("秦庭墙图",1,"你呈上秦庭图：包胥立依于墙，日夜哭不绝声。"),{success:"申包胥曰：「君可与言忠矣。」",compromise:"申包胥曰：「君之言，可采。」",fail:"申包胥曰：「君之说，非存国之道。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenbaoxu_gong","逃赏","court","yi",!1,"申包胥","楚之大夫","楚昭王入郢，赏申包胥。包胥曰：「吾为君也，非为身也。」遂逃赏。",[l("赏而逃之，何也？",t("yi","hit","吾为君耳，非为身也。受赏则非其本心。","申包胥曰：「此吾之所以逃也。」"),t("li","reason","有功当赏。逃之则沮后来者。","申包胥曰：「吾为君也，非为身也。」"),t("ming","evade","受与不受，各有其意。","申包胥曰：「遂不受。」")),l("有功不受赏，君以为矫乎？",t("yi","hit","非矫也。心之所存惟国，则赏不能动之。","申包胥曰：「此吾之所存也。」"),t("li","reason","近于矫。矫者悖常以取名。","申包胥曰：「吾为君也。」"),t("shi","evade","矫与不矫，唯其自知。","申包胥曰：「逃赏。」")),l("国既复，君将何之？",t("yi","hit","退而耕。功成不居，此吾之志。","申包胥曰：「吾不为身。」"),t("li","reason","当留于朝，以固其功。","申包胥曰：「遂逃赏。」"),t("ming","evade","去留随时，不必固守。","申包胥曰：「吾为君也，非为身也。」"))],null,{success:"申包胥曰：「君可与言义矣。」",compromise:"申包胥曰：「君之言，半是。」",fail:"申包胥曰：「君犹以赏为重。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenbaoxu_you","复国","court","yi",!1,"申包胥","楚之大夫","吴既退，楚国残破。或问：「何以复楚？」",[l("残破之国，当自何始？",t("yi","hit","先安民。民安则国自复，不必急于宫室。","申包胥曰：「此吾之所务也。」"),t("li","reason","先修城郭甲兵。无兵则再亡。","申包胥曰：「若亡，则无以事君。」"),t("shi","evade","复国之事，非一策可尽。","申包胥曰：「吾为君也。」")),l("吴虽退，其势犹强。君将如何？",t("yi","hit","修德以固本，结邻以御外。吴之势不能久。","申包胥曰：「此吾之所以存楚也。」"),t("shi","reason","当先发制人，乘其退而击之。","申包胥曰：「吴为封豕长蛇。」"),t("li","evade","强弱之势，自有其时。","申包胥曰：「吾必存之。」")),l("忠臣复国而不居功，后人何以效之？",t("yi","hit","效其心不效其事。心存于国，则赏亦不必辞；心存于名，则辞亦无所取。","申包胥曰：「善哉！君知本矣。」"),t("li","reason","当居功受赏，使人知所劝。","申包胥曰：「吾为君也，非为身也。」"),t("ming","evade","后人之效，非所豫虑。","申包胥曰：「遂逃赏。」"))],null,{success:"申包胥曰：「君可与谋国矣。」",compromise:"申包胥曰：「君之言，可采。」",fail:"申包胥曰：「君之说，急近功。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},wu={theme:"伐吴七术",intro:"文种事越王勾践，献伐吴七术。",debates:[f("v_wenzhong_qishu","伐吴七术","diplomacy","li",!0,"文种","越之大夫","越王问伐吴之策。文种曰：「臣有七术，请试其一二。」",[l("以七术伐国，君以为正当乎？",t("li","hit","兵者诡道。弱国图强，不能以堂堂之阵。术者，不得已也。","文种曰：「此吾之所以献也。」"),t("yi","reason","术多近于诡。君子当以正取胜。","文种曰：「寡君用其半而败吴。」"),t("shi","evade","术之正当与否，视其成败。","文种曰：「臣有七术。」")),l("遗之巧匠，使起宫室以耗其财。此术可乎？",t("li","hit","可。彼好宫室，则民力疲，府库空。不战而弱之。","文种曰：「此吾之第一术也。」"),t("yi","reason","此术伤彼国之民，非仁者所为。","文种曰：「越王用其半。」"),t("ming","evade","胜负之际，无所不用其术。","文种曰：「臣有七术。」")),l("越既灭吴，君之功最大。将如何自处？",t("li","hit","当早退。范蠡已去，吾犹留此，恐不能免。","文种曰：「此吾之所以不及蠡也。」"),t("yi","reason","当留。功未酬而先去，非忠。","文种曰：「寡君赐剑。」"),t("shi","evade","去留随时，不必豫虑。","文种曰：「吾不用蠡之言。」"))],z("七术竹简",1,"你呈上伐吴七术竹简：捐货币、贵籴粟、遗巧匠…"),{success:"文种曰：「君可与言谋矣。」",compromise:"文种曰：「君之言，有见。」",fail:"文种曰：「君之说，迂阔难行。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_wenzhong_tui","不退之祸","court","li",!1,"文种","越之大夫","范蠡去，遗文种书曰：「蜚鸟尽，良弓藏。子何不去？」",[l("范蠡遗书劝去，君当如何？",t("li","hit","当去。蠡见其机，吾不见，故及于祸。","文种曰：「此吾之所以悔也。」"),t("yi","reason","当留。吾于越有大功，越王岂忍负我？","文种曰：「吾不用蠡之言。」"),t("shi","evade","去留皆有其数。","文种曰：「寡君赐剑。」")),l("功大者危，君以为然乎？",t("li","hit","然。功大则震主，震主则不容。","文种曰：「此吾之所以死也。」"),t("yi","reason","功大者当受赏，何危之有？","文种曰：「寡君赐剑而死。」"),t("ming","evade","危与不危，在君之贤否。","文种曰：「吾不用蠡之言。」")),l("越王赐剑，曰「子教寡人伐吴七术」，君当如何答？",t("li","hit","无言可答。术出于我，而用在于君。君以此罪我，无理而足以杀我。","文种曰：「此吾之所以自尽也。」"),t("yi","reason","当谢罪。君虽不仁，臣不可不敬。","文种曰：「寡君赐剑。」"),t("shi","evade","死生有命，何必辩？","文种曰：「吾不用蠡之言，遂自杀。」"))],null,{success:"文种曰：「君可与言进退矣。」",compromise:"文种曰：「君之言，可采。」",fail:"文种曰：「君犹恋于功。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_wenzhong_zhi","治越","domestic","li",!1,"文种","越之大夫","越败于会稽，文种治其国，十年生聚，十年教训。",[l("十年生聚，十年教训。其序可易乎？",t("li","hit","不可易。民不足则无以教，教不先则无以战。","文种曰：「此吾之次第也。」"),t("yi","reason","当先教训。民知义则自奋，不待生聚。","文种曰：「十年生聚，十年教训。」"),t("shi","evade","二者并行，不必分先后。","文种曰：「此吾之所以治越也。」")),l("民之可用，在富乎？在教乎？",t("li","hit","在富而后教。腹不饱者不知义。","文种曰：「此吾之政也。」"),t("yi","reason","在教。教行则虽贫可用。","文种曰：「十年教训。」"),t("ming","evade","二者兼行，方能致用。","文种曰：「民可用矣。」")),l("越之复，君与范蠡孰功多？",t("li","hit","蠡长于谋，种长于治。谋可以取胜，治可以持久。","文种曰：「此吾与蠡之分也。」"),t("yi","reason","蠡功多。谋定而后动，无蠡则无越。","文种曰：「臣有七术。」"),t("shi","evade","功之多寡，非所计也。","文种曰：「此吾之所以治越也。」"))],null,{success:"文种曰：「君可与言治矣。」",compromise:"文种曰：「君之言，半得。」",fail:"文种曰：「君之说，未及于序。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ku={theme:"五羖大夫",intro:"百里奚，虞人也。秦穆公以五羖羊皮赎之。",debates:[f("v_bailixi_wuyang","五羖之赎","court","yi",!0,"百里奚","秦之大夫","秦穆公以五羖羊皮赎百里奚，授之国政。",[l("以五羖赎贤者，君不以为辱乎？",t("yi","hit","不辱。彼以皮赎我，我以国报之。贱其身者，贵其道也。","百里奚曰：「此吾之所以留也。」"),t("li","reason","当辞。以贱价相赎，是轻吾也。","百里奚曰：「五羖大夫。」"),t("ming","evade","身之贵贱，不在其价。","百里奚曰：「以五羖羊皮赎之。」")),l("虞亡而君在秦，是何故？",t("yi","hit","虞君不用吾言，故亡。吾不死者，为有待也。","百里奚曰：「虞君不用吾言。」"),t("li","reason","当死虞难。既食其禄，不可弃其君。","百里奚曰：「吾得脱，而事秦。」"),t("shi","evade","去留皆有其时。","百里奚曰：「臣之事秦，为秦谋耳。」")),l("年七十而始用，君不以为晚乎？",t("yi","hit","不晚。用之得其道，一日足矣。","百里奚曰：「此吾之所以报也。」"),t("li","reason","晚矣。齿已衰，何能为？","百里奚曰：「年已七十矣。」"),t("ming","evade","早晚有天，非人所能择。","百里奚曰：「谋无不当，举必有功。」"))],z("五羖羊皮图",1,"你呈上五羖羊皮图：秦人以贱价赎贤，而授之以政。"),{success:"百里奚曰：「君可与言士矣。」",compromise:"百里奚曰：「君之言，可采。」",fail:"百里奚曰：「君之说，重价而轻道。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_bailixi_baqin","霸西戎","diplomacy","yi",!1,"百里奚","秦之大夫","秦穆公问：「秦国何以霸？」百里奚曰：「善用人之长，不以其短。」",[l("用人当取其长，抑或求其全？",t("yi","hit","取长。人无完人。求其全，则天下无可用之人。","百里奚曰：「此吾之所以相秦也。」"),t("li","reason","当求其全。一德之亏，或败大事。","百里奚曰：「善用人之长。」"),t("ming","evade","长短各有所宜，视其位。","百里奚曰：「不以其短。」")),l("西戎之地，可得而有乎？",t("yi","hit","不必有之。得其心则地为用，徒有其地则耗内。","百里奚曰：「此吾所谓霸也。」"),t("shi","reason","当尽取之。地广则国强。","百里奚曰：「秦国霸西戎。」"),t("li","evade","取与不取，视其力。","百里奚曰：「善用人之长。」")),l("秦之处西，中国以夷狄视之。君何以处？",t("yi","hit","以礼自处，则以中国自居；以力自处，则人亦以夷狄视之。","百里奚曰：「此吾之所以教秦也。」"),t("shi","reason","当以力取中国之地，然后可言礼。","百里奚曰：「秦霸西戎。」"),t("li","evade","夷狄之目，于人何损？","百里奚曰：「不以其短。」"))],null,{success:"百里奚曰：「君可与言相矣。」",compromise:"百里奚曰：「君之言，有见。」",fail:"百里奚曰：「君之说，未及用人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_bailixi_ming","知人之明","court","yi",!1,"百里奚","秦之大夫","百里奚荐蹇叔，曰：「臣不及蹇叔，君请用之。」",[l("荐贤而自谓不及，君以为智乎？",t("yi","hit","智。知其不及而荐之，则国得其用，己亦不失其名。","百里奚曰：「此吾之所以荐也。」"),t("li","reason","不智。荐胜己者，则己之位危。","百里奚曰：「臣不及蹇叔。」"),t("ming","evade","荐不荐，皆有其分。","百里奚曰：「君请用之。」")),l("蹇叔既至，君以何者为政？",t("yi","hit","听之而已。既知其贤，则不疑其言。","百里奚曰：「此吾之所以相秦也。」"),t("li","reason","当分其权。一人专任，非国之福。","百里奚曰：「臣不及蹇叔。」"),t("shi","evade","政之得失，视其时。","百里奚曰：「君请用之。」")),l("殽之败，二子皆言不可。君以何责？",t("yi","hit","无可责。言而不用，非言之罪。","百里奚曰：「臣之言不用。」"),t("li","reason","当责其不能强谏。","百里奚曰：「吾不以一眚掩大德。」"),t("ming","evade","成败有数，非人所能尽。","百里奚曰：「此吾之所以谏也。」"))],null,{success:"百里奚曰：「君可与言知人矣。」",compromise:"百里奚曰：「君之言，半是。」",fail:"百里奚曰：「君犹忌胜己者。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},xu={theme:"知不可为",intro:"蹇叔贤而世莫知。百里奚荐之，秦穆公迎以为上大夫。",debates:[f("v_jianshu_yao","殽之谏","military","yi",!0,"蹇叔","秦之大夫","秦穆公兴师袭郑。蹇叔曰：「劳师以袭远，非所闻也。」",[l("劳师袭远，君以为不可乎？",t("yi","hit","不可。师劳力竭，远主备之。师之所为，郑必知之。","蹇叔曰：「此吾之所以谏也。」"),t("shi","reason","可。出其不意，正所以取胜。","蹇叔曰：「吾见师之出而不见其入也。」"),t("li","evade","行与不行，视其势。","蹇叔曰：「劳师以袭远，非所闻也。」")),l("君哭师，曰「吾见师之出而不见其入也」。何敢言此？",t("yi","hit","知其必败，故哭之。哭者，非诅也，痛之也。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","出师而哭，沮军心。当缄其口。","蹇叔曰：「吾见师之出而不见其入也。」"),t("ming","evade","成败未可知，何必先哭？","蹇叔曰：「吾见师之出而不见其入也。」")),l("既知其败，君何不固谏？",t("yi","hit","谏之不听，则尽吾言而已。君之志不可夺，非吾力所及。","蹇叔曰：「此吾之所以退也。」"),t("shi","reason","当固谏。以死争之，庶几可回。","蹇叔曰：「吾不能回君之志。」"),t("li","evade","谏而不用，则去可也。","蹇叔曰：「劳师以袭远，非所闻也。」"))],z("殽山地形图",1,"你呈上殽山地形图：两山之间，车不得方轨。"),{success:"蹇叔曰：「君可与言兵矣。」",compromise:"蹇叔曰：「君之言，可采。」",fail:"蹇叔曰：「君之说，与吾同忧。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jianshu_zhi","知与不知","court","yi",!1,"蹇叔","秦之大夫","或问：「子何以知殽之必败？」蹇叔曰：「以理推之。」",[l("以理推事，可尽知乎？",t("yi","hit","不能尽知，然可知其大者。理之所至，势不能违。","蹇叔曰：「此吾之所以能言也。」"),t("li","reason","理者虚也。事有万变，非理所能尽。","蹇叔曰：「劳师以袭远，非所闻也。」"),t("ming","evade","知与不知，皆有其分。","蹇叔曰：「吾见师之出而不见其入也。」")),l("既知而不能救，知之何益？",t("yi","hit","知之则可以备。虽不能救此役，可以戒后来。","蹇叔曰：「此吾之所谓知也。」"),t("li","reason","知而不能救，不如不知。","蹇叔曰：「吾见师之出而不见其入也。」"),t("shi","evade","益与不益，非所计。","蹇叔曰：「以理推之。」")),l("世莫知君，而百里奚荐之。君以为何如？",t("yi","hit","士之遇不遇，系于知己。奚知我，故我为之用。","蹇叔曰：「此吾之所以事秦也。」"),t("li","reason","既世莫知，则当自显其才，不必待人荐。","蹇叔曰：「蹇叔贤而世莫知。」"),t("ming","evade","知与不知，皆外也。","蹇叔曰：「百里奚荐之。」"))],null,{success:"蹇叔曰：「君可与言理矣。」",compromise:"蹇叔曰：「君之言，半得。」",fail:"蹇叔曰：「君犹以知为无用。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_jianshu_zi","哭子","court","yi",!1,"蹇叔","秦之大夫","殽之役，蹇叔之子与师。蹇叔哭之曰：「晋人御师必于殽。」",[l("知子必死而使之行，君以为忍乎？",t("yi","hit","非忍也。君命不可违，吾不能以私废公。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","忍矣。既知其死，当留之。","蹇叔曰：「吾见师之出而不见其入也。」"),t("shi","evade","去留之权，不在父而在君。","蹇叔曰：「吾见师之出而不见其入也。」")),l("父子之情与君臣之义，孰先？",t("yi","hit","在朝则先君，在家则先父。其位不同，其守亦异。","蹇叔曰：「善哉！君知分矣。」"),t("shi","reason","父子天性，当先父。","蹇叔曰：「吾不能以私废公。」"),t("li","reason","君臣之义，关乎国。当先君。","蹇叔曰：「君命不可违。」")),l("子既死于殽，君后悔乎？",t("yi","hit","不悔。吾所言者，非为吾子，为秦师也。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","悔。若留其子，则可免一死。","蹇叔曰：「吾见师之出而不见其入也。」"),t("ming","evade","悔与不悔，皆无及矣。","蹇叔曰：「晋人御师必于殽。」"))],null,{success:"蹇叔曰：「君可与言分矣。」",compromise:"蹇叔曰：「君之言，可采。」",fail:"蹇叔曰：「君未明公私之分。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},$o={zi_lu:yu,zeng_shen:vu,shen_bao_xu:bu,wen_zhong:wu,bai_li_xi:ku,jian_shu:xu};var $u={theme:"仁与礼",intro:"子温而厉，威而不猛，恭而安。",debates:[f("v_kongzi_ren","问仁","court","yi",!0,"孔子","鲁之学者","你向孔子请教为政之道。夫子不答，先反问：「君以为政，何者为先？」",[l("为政以德，譬如北辰，居其所而众星共之。君若能之乎？",t("yi","hit","德者，非徒善也。上与下同其欲，则民不令而从。","夫子莞尔：「可与言政矣。」"),t("li","reason","先立赏罚，使人知所劝惩，德乃可施。","夫子点头：「亦有此说。然刑不立乎？」"),t("shi","evade","政在得人，得人则事无不成。","夫子曰：「人存政举，人亡政息。君之言得之，而未尽也。」")),l("道之以政，齐之以刑，民免而无耻。君以为如何？",t("yi","hit","免而无耻，非小患也。耻者，人之所自守，刑之所不能及。","夫子曰：「善哉！此吾所谓『有耻且格』也。」"),t("li","reason","民愚，不知耻；刑立而後可教。","夫子叹曰：「不教而杀，谓之虐。」"),t("ming","evade","三代之政，皆先刑后教，君不闻乎？","夫子曰：「夏殷之礼，吾能言之，杞宋不足征也。」")),l("君子之德风，小人之德草。君自视，风乎？草乎？",t("yi","hit","在上者一言之失，四方传之。德不修，则草偃而不从。","夫子肃然：「君知此，可矣。」"),t("shi","reason","臣非风非草，乃风与草之介也。","夫子曰：「然。上下之间，唯士为难。」"),t("li","evade","人在其位，各尽其分，何问风草？","夫子不答，良久曰：「君未之思也。」"))],z("乡校议政录",1,"你呈上乡校议政的记录：国人议论朝政，未尝壅塞。"),{success:"孔子曰：「善哉！不毁乡校，此子产之所以为贤也。」此后每有政事，必先问你的见解。",compromise:"孔子沉吟：「君之言亦有可取。然礼之失，非一日可复。」",fail:"孔子不语，转身取琴而鼓之，终不复言。"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_kongzi_li","论礼","court","yi",!1,"孔子","鲁之学者","鲁国宗庙祭祀，礼器陈设失序。你问孔子：「礼之为礼，在器乎？在心乎？」",[l("礼云礼云，玉帛云乎哉？",t("yi","hit","玉帛者，礼之文也。无其心而用其器，是谓虚礼。","夫子拊掌：「赐也，始可与言《诗》已矣！」"),t("li","reason","器既失序，则礼无所寄。先正其器，心自随之。","夫子曰：「然。然亦不可徒事其器。」"),t("shi","evade","礼者，先王之成法，遵之而已，何必问心？","夫子曰：「如礼何！如礼何！」")),l("今之孝者，是谓能养。至于犬马，皆能有养。不敬，何以别乎？",t("yi","hit","敬者，不在声色。察其志之所向，顺而导之。","夫子曰：「此之谓敬。」"),t("li","reason","养其身，供其欲，父母安之，斯可矣。","夫子曰：「今之孝者，是谓能养。」"),t("ming","evade","孝者，天下之通义，不待教而能。","夫子曰：「小人皆能养其亲，君子不敬，何以辨？」")),l("君欲使鲁国之民皆知礼，当自何始？",t("yi","hit","自士始。士知礼，则庶人观之而化。","夫子曰：「先有司，赦小过，举贤才。」"),t("li","reason","自朝廷始。上有所好，下必甚焉。","夫子曰：「其身正，不令而行。」"),t("shi","evade","礼者，民自化之，不必驱也。","夫子曰：「民可使由之，不可使知之。」"))],null,{success:"孔子曰：「可与共学矣。」遂以《礼》授你，并留你论学三日。",compromise:"孔子为你陈说礼之本末，你记下了大半。",fail:"孔子曰：「礼者，敬而已矣。君心未敬，何论于礼？」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-3}}),f("v_kongzi_xue","论学","court","ming",!1,"孔子","鲁之学者","有少年问孔子：「学何为？」夫子曰：「女奚不曰：其为人也，发愤忘食，乐以忘忧。」",[l("学而时习之，不亦说乎？君以为，学之乐在何处？",t("ming","hit","在知其所以然。习之既久，豁然贯通，此乐非外物可比。","夫子曰：「可与言学矣。」"),t("li","reason","学成则禄在其中，此乐最实。","夫子曰：「君子谋道不谋食。」"),t("shi","evade","学不必求乐，求其有用耳。","夫子曰：「古之学者为己，今之学者为人。」")),l("知之者不如好之者，好之者不如乐之者。君自居何等？",t("ming","hit","臣方在「好之」，未能「乐之」。愿从夫子学。","夫子曰：「知之为知之，不知为不知，是知也。」"),t("yi","reason","知之为先，好乐可渐致。","夫子曰：「譬如为山，未成一篑。」"),t("li","evade","知足矣。好与乐，非治世所需。","夫子曰：「三年学，不至于谷，不易得也。」")),l("吾尝终日不食，终夜不寝，以思，无益，不如学也。君以为然乎？",t("ming","hit","思而不学则殆。臣尝困于此，故知夫子之言不虚。","夫子曰：「学而不思则罔，思而不学则殆。君兼之矣。」"),t("shi","reason","思者，自得之道，何必尽从人言？","夫子曰：「吾与回言终日，不违如愚。」"),t("yi","evade","学与思，皆所以为道，不必分先后。","夫子曰：「赐也，非尔所及也。」"))],null,{success:"孔子曰：「君可与共学，可与适道矣。」此后你有疑难，皆可来问。",compromise:"孔子为你讲论半日，你记下了数条。",fail:"孔子曰：「吾语女：其为人也，学道不厌。」遂不再言。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},_u={theme:"无为",intro:"老子修道德，其学以自隐无名为务。",debates:[f("v_laozi_wuwei","无为","court","ming",!1,"老子","周之守藏室史","你问老子：「治国者，当有所为乎？」老子曰：「道常无为而无不为。」",[l("为者败之，执者失之。君欲为，其可乎？",t("ming","hit","为而不恃，功成而不居。为之以无为，则无败。","老子颔首：「几于道矣。」"),t("li","reason","不为则事废。国家不可一日无所事。","老子曰：「治大国若烹小鲜。」"),t("shi","evade","为与不为，皆听其自然可也。","老子曰：「莫知其极，可以有国。」")),l("民之饥，以其上食税之多。君若居上位，税之乎？",t("yi","hit","民食过多则饥。损之又损，以至于无为。","老子曰：「此圣人之言也。」"),t("li","reason","无税则国无所养。宜轻，不宜废。","老子曰：「民之难治，以其上之有为。」"),t("ming","evade","税之轻重，皆非道也。","老子曰：「绝圣弃智，民利百倍。」")),l("柔弱胜刚强。君以为，治国者当柔弱乎？",t("ming","hit","天下莫柔弱于水，而攻坚强者莫之能胜。","老子曰：「上善若水。」"),t("shi","reason","柔以守之，刚以断之，二者不可偏废。","老子曰：「是以兵强则灭，木强则折。」"),t("li","evade","柔弱之名，适为敌国所轻。","老子曰：「大巧若拙。」"))],z("守藏室竹简",1,"你呈上守藏室的旧简：往昔之政，以简驭繁者多，以烦致乱者亦多。"),{success:"老子曰：「君可与言道矣。」遂出《道德》二篇示你。",compromise:"老子曰：「君之言，得其一端。」",fail:"老子闭目不言，久之曰：「道不同，不相为谋。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-1,rel:-3}}),f("v_laozi_fan","反者道之动","court","ming",!1,"老子","周之守藏室史","你问老子：「天下之势，盛极而衰，可有以救之？」",[l("反者道之动，弱者道之用。君将何以用之？",t("ming","hit","于盛时思衰，于治时思乱。持而盈之，不如其已。","老子曰：「揣而锐之，不可长保。」"),t("li","reason","盛时宜进取，衰时方思退。此人之常情。","老子曰：「功成名遂身退，天之道。」"),t("shi","evade","盛衰有数，非人力所能移。","老子曰：「天地尚不能久，而况于人乎？」")),l("功成名遂身退，天之道。君能退乎？",t("ming","hit","退非避也。功成而不居，则名不去。","老子曰：「生而不有，为而不恃，长而不宰。」"),t("yi","reason","功成当继其业，退则前功尽弃。","老子曰：「金玉满堂，莫之能守。」"),t("li","evade","退者，为身谋也，非为天下。","老子曰：「贵以身为天下，若可寄天下。」")),l("上士闻道，勤而行之；中士闻道，若存若亡。君居何等？",t("ming","hit","臣不敢自居上士，然愿勤而行之。","老子笑曰：「下士闻道，大笑之。不笑，不足以为道。」"),t("shi","reason","道者难知，中士之守，亦足自全。","老子曰：「明道若昧，进道若退。」"),t("li","evade","道既难知，不如守其器、行其事。","老子曰：「朴散则为器，圣人用之则为官长。」"))],null,{success:"老子曰：「君可与言道之反矣。」遂为你言盛衰往复之数。",compromise:"老子曰：「君姑记之，他日自悟。」",fail:"老子曰：「知者不言，言者不知。」遂不复语。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_laozi_zhi","知与不知","court","ming",!1,"老子","周之守藏室史","你向老子请教：「治国者当博闻强识，抑或守拙而已？」",[l("知者不言，言者不知。君既来问，是有知乎？抑无知乎？",t("ming","hit","臣来问，正为不知。知之为知之，不知为不知，是知也。","老子曰：「善。此可与言矣。」"),t("li","reason","不言则下情不上达，非治世之道。","老子曰：「多言数穷，不如守中。」"),t("shi","evade","知与不知，皆不必较。行之而已。","老子曰：「为学日益，为道日损。」")),l("不出户，知天下；不窥牖，见天道。其可乎？",t("ming","hit","其出弥远，其知弥少。臣尝走遍诸国，反不如静坐一日。","老子曰：「不行而知，不见而名。」"),t("shi","reason","不历其事，何以知其难易？","老子曰：「其出弥远，其知弥少。」"),t("li","evade","欲知天下，当广遣间谍，岂能闭户？","老子曰：「以智治国，国之贼。」")),l("绝圣弃智，民利百倍。君若用之，天下可治乎？",t("ming","hit","圣智之名既立，则争名者众。弃之，则民返其朴。","老子曰：「见素抱朴，少私寡欲。」"),t("yi","reason","民不知则易愚，愚则易乱。教之乃可安。","老子曰：「古之善为道者，非以明民，将以愚之。」"),t("li","evade","弃智之政，适为强邻所乘。","老子曰：「以其不争，故天下莫能与之争。」"))],null,{success:"老子曰：「君可与论道之本矣。」为你言「为学日益，为道日损」之旨。",compromise:"老子曰：「君且思之。」遂不再言。",fail:"老子曰：「知者不言。」闭目端坐，竟日不语。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},zu={theme:"兼爱非攻",intro:"墨者以裘褐为衣，以跂为服，日夜不休，以自苦为极。",debates:[f("v_mozi_jianai","兼爱","court","yi",!0,"墨子","墨家巨子","你问墨子：「天下大乱，其故安在？」墨子曰：「起不相爱。」",[l("天下之人皆不相爱，强者劫弱，众者暴寡。君以为，治之当自何始？",t("yi","hit","兼相爱则治，交相恶则乱。使人视人之国若其国，视人之家若其家。","墨子喜曰：「善哉！此吾所谓兼爱也。」"),t("li","reason","先明赏罚，使不爱人者有所畏，则爱可渐致。","墨子曰：「刑罚不足以移风。」"),t("shi","evade","亲疏有别，爱有差等，此天理也。","墨子曰：「此儒者之说，吾所不取。」")),l("吾闻为政者必先立威。君以为然乎？",t("yi","hit","威者，末也。上不能兼爱下，则威虽立而不久。","墨子曰：「上之为政，得下之情则治。」"),t("shi","reason","不威则令不行，令不行则乱。","墨子曰：「天下之所以乱者，生于无政长。」"),t("ming","evade","威与爱并行，何须偏废？","墨子曰：「兼者，圣王之道也。」")),l("若天下人人兼爱，则君上与匹夫同等，岂非乱之始乎？",t("yi","hit","兼爱非等贵贱，乃使人不以其位而相害。","墨子曰：「天下兼相爱则治，交相恶则乱。」"),t("li","reason","上下既无等，则政无所施。","墨子曰：「官无常贵，民无终贱。」"),t("shi","evade","兼爱之论，迂阔难行。","墨子曰：「今天下之所同义者，圣王之法也。」"))],z("宋国守御图",1,"你呈上宋城的守御图：城小而守法备，墨者所教也。"),{success:"墨子曰：「君可与言兼爱矣。」遂授你《墨子》数篇。",compromise:"墨子曰：「君之言半得之。」与你论至夜半。",fail:"墨子拂衣而起：「子之言，天下之害也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_mozi_feigong","非攻","military","yi",!1,"墨子","墨家巨子","楚将攻宋。墨子裂裳裹足，十日十夜至郢，劝公输般收兵。",[l("杀一人谓之不义，今攻一国而杀众，人皆称之曰义。君以为，此何故？",t("yi","hit","以小为非，以大为是，此名实之乱也。","墨子曰：「是以知天下之君子，辨义与不义之乱也。」"),t("li","reason","攻国者，为国利也，与杀一人不同。","墨子曰：「苟亏人愈多，其不仁兹甚，罪益厚。」"),t("shi","evade","兵者国之大事，不可以小义绳之。","墨子曰：「今至大为不义攻国，则弗知非。」")),l("今有强国攻小国，小国不能守，君将救之乎？",t("yi","hit","救之，非为小国，为天下之利也。","墨子曰：「禹之征有苗，非以求名。」"),t("li","reason","救小国而结怨强邻，非国之利。","墨子曰：「杀所不足，而争所有余，非仁也。」"),t("ming","evade","两国之争，我何必与焉？","墨子曰：「今有人于此，少见黑曰黑，多见黑曰白。」")),l("公输般为楚造云梯，九攻而君九距之。今其械尽，君之城备。楚王当如何？",t("yi","hit","吾知子之所以距我，我亦知子之所以距我。然臣之弟子禽滑厘等三百人，已持臣守圉之器，在宋城上而待楚寇矣。","墨子言毕，楚王曰：「善哉！吾请无攻宋矣。」"),t("li","reason","器械虽尽，楚甲犹众，宋终不可恃。","墨子曰：「杀臣，宋莫能守，乃可攻也。」"),t("shi","evade","守御之术，可以一当十乎？","墨子曰：「楚王曰：善哉！吾请无攻宋矣。」"))],z("守圉器图",1,"你呈上守城器械图：转射机、连弩车，墨者所造。"),{success:"墨子虽缁衣而笑：「君可与言非攻矣。」",compromise:"墨子曰：「君意未尽合，然肯听言，亦可取。」",fail:"墨子曰：「君之说，便于攻者，非吾徒也。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_mozi_jieyong","节用","domestic","yi",!1,"墨子","墨家巨子","鲁国大造宫室，工匠万人。你与墨子同观，墨子蹙然不悦。",[l("宫室之法：其旁可以圉风寒，上可以御雪霜，中可以为男女之别。君以为过乎？",t("yi","hit","足以为此则止。不加费，不劳民。","墨子曰：「此圣王之道也。」"),t("li","reason","天子之室，当有威仪，以示天下。","墨子曰：「圣王为宫室，足以为之，不加费。」"),t("ming","evade","宫室之制，皆先王成法，何可轻议？","墨子曰：「今之为宫室，必厚作敛于百姓。」")),l("国家之富，当以何为务？",t("yi","hit","去无用之费。无用之费去，则有用于民者厚矣。","墨子曰：「凡足以奉给民用，则止。」"),t("li","reason","厚积府库，以备凶荒。","墨子曰：「府库实而不用，何益于民？」"),t("shi","evade","富国在通商，不在节用。","墨子曰：「今为衣服，冬则轻暖，夏则轻凊，皆已具矣。」")),l("人皆谓墨者自苦太过，不可为天下法。君以为然乎？",t("yi","hit","自苦者为天下之利也。若人皆自苦而利天下，则天下治矣。","墨子曰：「虽不耕而食者众，而吾何辞焉。」"),t("li","reason","人伦之乐不可废。自苦之说，反于人情。","墨子曰：「士虽有学，而行为本焉。」"),t("ming","evade","苦乐各从其志，不必强人。","墨子曰：「嘿则思，言则诲，动则事。」"))],null,{success:"墨子喜曰：「君能节用，天下幸甚。」",compromise:"墨子曰：「君言可采者半。」",fail:"墨子怅然：「君未之思也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},qu={theme:"节俭而多智",intro:"晏婴长不满六尺，而相齐三世，以节俭力行重于齐。",debates:[f("v_yanying_ju","橘逾淮为枳","diplomacy","ming",!1,"晏婴","齐之正卿","你奉命使楚。楚王设宴，缚一人过庭，曰：「齐人善盗乎？」晏婴在座。",[l("齐人固善盗乎？",t("ming","hit","婴闻之，橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。今民生长于齐不盗，入楚则盗，得无楚之水土使民善盗耶？","楚王笑曰：「圣人非所与熙也，寡人反取病焉。」"),t("yi","reason","齐人之盗者，自有其罪。此一人之行，非齐国之风。","楚王曰：「然。是寡人之过也。」"),t("li","evade","齐楚之好，不宜以一人之罪相疑。","楚王沉吟：「子之言，近于避。」")),l("楚与齐交恶，使者何颜立于此？",t("ming","hit","使于四方，不辱君命，臣之职也。若楚不容，臣不敢辞。","楚王曰：「善。」遂礼而归之。"),t("yi","reason","两国交兵，不斩来使。此古之通义。","楚王曰：「子可谓知礼。」"),t("shi","evade","楚强而齐弱，祸福未可知。","楚王曰：「子之慎也。」")),l("天下将合纵以抗强秦，齐当何从？",t("li","hit","合纵则信难久，连横则势易孤。齐宜守境而观衅。","晏婴曰：「子之算，可为齐谋矣。」"),t("ming","hit","不以信结，则纵散；不以利合，则横薄。齐宜先信后利。","晏婴曰：「此三王之道也。」"),t("shi","evade","齐之事，齐君自决，使者不必越俎。","晏婴曰：「子之守分，亦佳。」"))],z("楚庭席次图",1,"你取出楚庭席次图：楚王欲以小门纳使，示轻齐也。"),{success:"晏婴后与人曰：「此使可交。」齐楚之好遂成。",compromise:"晏婴曰：「子之辞亦有取。」",fail:"晏婴摇头：「子失辞矣。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yanying_tao","二桃杀三士","court","li",!0,"晏婴","齐之正卿","公孙接、田开疆、古冶子三人，以勇力闻，而无礼于君。晏婴过而趋，三人不起。",[l("三士无礼于君，君以为当诛乎？",t("li","hit","勇而无礼者，国之患也。不诛则群臣效之。","晏婴曰：「此吾所虑也。」"),t("yi","reason","三士有功于齐，不可以无礼杀之。","晏婴曰：「有勇而无义，终必为乱。」"),t("shi","evade","待其后自败可也，何必自君手？","晏婴曰：「养乱而俟其成，非谋也。」")),l("若诛之，恐失人心。君有何策？",t("li","hit","以两桃赐三人，令其自论功而食。争则必乱，让则必死。","晏婴曰：「此吾所以为此也。」"),t("ming","hit","当众责其失礼，使自知耻。耻则自退，不烦刀刃。","晏婴曰：「使士知耻，胜于杀之。然彼不知耻也。」"),t("yi","evade","以力制之，明正其罪，何虑人心？","晏婴曰：「杀有功者，齐人将非之。」")),l("三人既死，齐失三勇。君不惧乎？",t("li","hit","失三勇，得众心。勇者可求，而无礼之勇不可用。","晏婴曰：「国之所贵，不在勇力。」"),t("yi","reason","三士死而国无将，邻国必有窥伺之心。","晏婴曰：「齐之将，不患无人。」"),t("shi","evade","死者已矣，无需再论。","晏婴曰：「不然。谋始者不可不虑其终。」"))],null,{success:"晏婴曰：「子之谋，可与共国矣。」后荐你于齐侯。",compromise:"晏婴曰：「子之见，尚浅。」",fail:"晏婴叹曰：「子之不忍，且不足谋也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_yanying_jian","谏君","court","yi",!1,"晏婴","齐之正卿","齐景公饮酒七日不罢，晏婴入见，不拜而坐。",[l("君不拜而谏，可乎？",t("yi","hit","臣之所以不拜者，君废朝七日，臣无以拜也。","晏婴曰：「子知礼之变矣。」"),t("li","reason","朝廷之礼不可废。先拜而后谏，方为得体。","晏婴曰：「然。然礼有从权者。」"),t("shi","evade","礼者小节，救君之失为大。","晏婴曰：「不然。无礼则上下乱。」")),l("君耽于酒，臣屡谏而不听。当何以处之？",t("yi","hit","君有过则谏，不听则去。臣不去者，为一国之民也。","晏婴曰：「此吾之所以不去也。」"),t("li","reason","顺其所好，徐导之后，可渐入佳境。","晏婴曰：「顺君之欲，非忠也。」"),t("ming","evade","君之失，非臣所能正。听其自悟可也。","晏婴曰：「见义不为，无勇也。」")),l("臣之事君，忠与智孰重？",t("yi","hit","无智之忠，适足以陷君。智者，所以行其忠也。","晏婴曰：「善哉！此可与言事君矣。」"),t("li","reason","忠者本也。智为忠用，不可倒置。","晏婴曰：「君以为本，吾以为末。」"),t("shi","evade","二者不可兼得，则舍智而取忠。","晏婴曰：「有忠而无智，是匹夫之谅也。」"))],null,{success:"晏婴起而拜：「子可谓知臣道矣。」",compromise:"晏婴曰：「子之言，得半。」",fail:"晏婴曰：「子未可与言谏。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ju={theme:"富国之道",intro:"管仲相齐，通货积财，富国强兵，与俗同好恶。",debates:[f("v_guanzhong_canglin","仓廪实而知礼节","domestic","li",!0,"管仲","齐之相","你问管仲治国之序。仲曰：「仓廪实而知礼节，衣食足而知荣辱。」",[l("民贫而教之以礼，可乎？",t("li","hit","不可。腹不饱者不知礼，身不暖者不恤辱。先足其食，礼自可兴。","管仲曰：「上服度则六亲固。」"),t("yi","reason","礼者，人之所自守。贫而有礼者，自古有之。","管仲曰：「故其称曰：仓廪实而知礼节。」"),t("ming","evade","贫富与礼义，各不相干。","管仲曰：「四维不张，国乃灭亡。」")),l("欲富国，当以何为先？",t("li","hit","先通货积财。轻重之权操于上，则府库实而民不困。","管仲曰：「善哉！此其所长也。」"),t("yi","reason","薄赋敛，宽徭役，使民自富，国自足。","管仲曰：「省刑罚，薄税敛，则民富。」"),t("shi","evade","富国在广地。取他国之利，胜于自谋。","管仲曰：「战而胜，则国危。」")),l("四民分业而居，士农工商各安其处。君以为何如？",t("li","hit","各安其业则艺精。士之子常为士，工之子常为工，则事无废堕。","管仲曰：「此吾之法也。」"),t("yi","reason","人之才不同，强分其业，则才有所屈。","管仲曰：「仓廪实而民知礼，四维张而国不亡。」"),t("ming","evade","民自择业，何须分处？","管仲曰：「令顺民心，则威令行。」"))],z("齐国盐铁簿",1,"你呈上齐国盐铁之簿：官山海之利，岁入倍于往昔。"),{success:"管仲曰：「可与言富国之术矣。」遂授你轻重之法。",compromise:"管仲曰：「君言亦有可取。」",fail:"管仲笑曰：「子之言，书生之见也。」"},{success:{fame:6,rel:8,money:60},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_guanzhong_zunwang","尊王攘夷","diplomacy","yi",!0,"管仲","齐之相","齐桓公会诸侯于葵丘。管仲曰：「君欲霸，必尊周室。」",[l("周室衰微，诸侯不朝。君何以尊之？",t("yi","hit","尊其名而假其令。诸侯朝齐如朝周，则齐有霸之名而无篡之实。","管仲曰：「善哉！此吾之谋也。」"),t("li","reason","以力并诸侯，何须假周室之名？","管仲曰：「以力假仁者霸，以德行仁者王。」"),t("ming","evade","周室之衰，天也。齐何与焉？","管仲曰：「夷狄豺狼，不可厌也。」")),l("戎狄侵燕，邢卫继亡。齐当救乎？",t("yi","hit","救之。攘夷者，诸侯之所共望也。救则名归齐。","管仲曰：「此霸王之举也。」"),t("li","reason","远道救燕，劳师费财，所得不偿所失。","管仲曰：「戎狄豺狼，不可厌也；诸夏亲昵，不可弃也。」"),t("ming","evade","诸国自守其境，何必齐救？","管仲曰：「宴安酖毒，不可怀也。」")),l("霸业既成，君之名位当如何？",t("li","hit","守臣节，不越分。名分一坏，则天下皆可以力取。","管仲曰：「此吾之所以戒也。」"),t("yi","reason","功高者当受上赏，虽用天子之礼亦可。","管仲曰：「名不正则言不顺。」"),t("shi","evade","名位者，虚器也，不必较。","管仲曰：「四维不张，国乃灭亡。」"))],null,{success:"管仲曰：「可与谋霸矣。」为你陈说尊王攘夷之略。",compromise:"管仲曰：「君之谋，可用其半。」",fail:"管仲曰：「君之说，徐偃王之仁也，将亡。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_guanzhong_penqiu","烹小鲜","court","li",!1,"管仲","齐之相","齐桓公欲易相。问管仲：「将何以治齐？」",[l("治国当频更法度乎？抑或守而勿失？",t("li","hit","法不可数变。数变则民惑，民惑则奸生。","管仲曰：「此为政之本也。」"),t("yi","reason","时移则法异。守旧法者，必困于新事。","管仲曰：「变则通，然不可骤。」"),t("ming","evade","法之存废，皆赖得人。得其人则法自善。","管仲曰：「人存政举。」")),l("若大臣专权，君当如何处之？",t("li","hit","分其权而不夺其位。权分则不能独擅，位存则不致生怨。","管仲曰：「制之有道，不在杀也。」"),t("shi","reason","专权者当诛，不诛则君权旁落。","管仲曰：「刑赏之柄，不可假人。」"),t("yi","evade","以礼待之，彼自感其恩。","管仲曰：「恩不足恃。」")),l("君好奢而民贫，君以为可乎？",t("li","hit","上之欲必有度。君敛一分，下必有十分之困。","管仲曰：「君之所好，臣必有甚焉。」"),t("yi","reason","君之威仪不可损，民之贫富自有其数。","管仲曰：「上服度则六亲固。」"),t("ming","evade","君民之间，各尽其分而已。","管仲曰：「政之所兴，在顺民心。」"))],null,{success:"管仲曰：「可与共政矣。」",compromise:"管仲曰：「子之言平。」",fail:"管仲曰：「子之谋，适足以乱国。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Su={theme:"铸刑书与不毁乡校",intro:"子产相郑，为政以信，国人诵之。",debates:[f("v_zichan_xing","铸刑书","court","li",!0,"子产","郑之正卿","郑国铸刑书于鼎。叔向使诒子产书曰：「民知争端矣，将弃礼而征于书。」",[l("叔向谓「民知有辟，则不忌于上」。君以为如何？",t("li","hit","法既明布，则民知所避就。上不能以喜怒为轻重，此治国之要也。","子产曰：「吾以救世也。」"),t("yi","reason","礼者禁未然之前，法者施已然之后。舍礼用法，是舍本逐末。","子产曰：「若吾子之言，吾不虑矣。」"),t("shi","evade","刑书既铸，不可复收，何必多言？","子产曰：「侨不才，不能及子孙。」")),l("民知争之必以书，则讼必繁。讼繁而国乱，君惧乎？",t("li","hit","讼繁者，正以曲直有定。无书则吏得任意，其害 أكبر。","子产曰：「吾无求于下，下无求于上。」"),t("yi","reason","无讼为上。导民以礼，使不争，胜于定其争。","子产曰：「《诗》曰：『仪式刑文王之德。』」"),t("ming","evade","讼之繁简，在吏之贤否，不在刑书。","子产曰：「吾闻君子长国家者，非无贿之患。」")),l("君使臣，臣事君，以礼乎？以法乎？",t("li","hit","以法为辅，以礼为本。两者不可偏废。","子产曰：「善哉！此吾意也。」"),t("yi","reason","礼可感人，法可制人。治世当先感之。","子产曰：「求逞于人，不可。」"),t("shi","evade","上下之分明，则礼法皆可不用。","子产曰：「举不逾等，则位班也。」"))],z("刑书拓本",1,"你呈上刑书拓本：条文既明，吏无所容其奸。"),{success:"子产曰：「君知法之要矣。」后郑人诵之。",compromise:"子产曰：「君之说，可与共议。」",fail:"子产曰：「子之言，叔向之遗也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zichan_xiangxiao","不毁乡校","domestic","yi",!1,"子产","郑之正卿","郑人游于乡校，以议执政之善否。然明谓子产曰：「毁乡校，如何？」",[l("民聚而议政，君以为当毁乎？",t("yi","hit","胡为不毁？夫其所善者，吾则行之；其所恶者，吾则改之。是吾师也，若之何毁之？","子产曰：「吾闻忠善以损怨，不闻作威以防怨。」"),t("li","reason","庶人议政，则上无威，令不行。当毁之。","子产曰：「防民之口，甚于防川。」"),t("ming","evade","听之而已。议论既久，自当止歇。","子产曰：「我闻学而后入政，未闻以政学者也。」")),l("民怨既积，壅之与导之，孰优？",t("yi","hit","导之。如川之决，若壅而溃，伤人必多。吾不克救也，不如小决使道。","子产曰：「此吾所以不毁也。」"),t("li","reason","壅之则怨伏于下，发则不可制。宜早绝其源。","子产曰：「不如小决使道，不如吾闻而药之也。」"),t("shi","evade","民之怨，无关于国。听其自散可也。","子产曰：「我闻忠善以损怨。」")),l("为政以宽，抑或以猛？",t("li","hit","宽难。唯有德者能以宽服民，其次莫如猛。火烈，民望而畏之，故鲜死焉。","子产曰：「此吾所谓猛也。」"),t("yi","reason","宽则得众。民感其德，自不为非。","子产曰：「唯有德者能以宽服民。」"),t("ming","evade","宽猛随时，不必执一。","子产曰：「尽心力以事君，死生以之。」"))],null,{success:"子产曰：「可与言政矣。」留你论执政之道。",compromise:"子产曰：「君之言，有可取者。」",fail:"子产曰：「子之见，犹未及此。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zichan_xin","为政以信","court","yi",!0,"子产","郑之正卿","郑伯欲背晋盟。子产曰：「盟以信也。背之，无乃不可乎？」",[l("晋弱而楚强，背晋从楚，君以为可乎？",t("yi","hit","盟以信立。一背之，则天下无复与郑盟者。虽强邻压境，不可弃信。","子产曰：「子之言，吾言也。」"),t("li","reason","小国处两强之间，当择强者而从，信不敌势。","子产曰：「国不竞亦陵，何国之为？」"),t("ming","evade","两不相助，自守其境，信与势皆不必计。","子产曰：「凡诸侯小国，晋楚所以兵威之。」")),l("小国之存，在信抑在力？",t("yi","hit","在小在德，不在力。有信则人为之援，无信则众弃之。","子产曰：「善哉！此郑之所以存也。」"),t("li","reason","小国无信则孤，然无兵亦亡。宜并修之。","子产曰：「陈我之自入，以恃其信也。」"),t("shi","evade","小国之存亡，系于邻国之欲，非己所能。","子产曰：「小国无文德而有武功，祸莫大焉。」")),l("有民而无信，犹有国乎？",t("yi","hit","无信则民不相保，虽有城郭甲兵，不可守也。","子产曰：「信，国之宝也，民之所庇也。」"),t("li","reason","民之从君，为利也。信不足恃，利足则可。","子产曰：「信不可弃，弃信而逼，无乃不可乎？」"),t("ming","evade","信者虚名，国实为要。","子产曰：「《诗》曰：『维此文王，小心翼翼。』昭事上帝，聿怀多福。」"))],null,{success:"子产曰：「君可与守信矣。」",compromise:"子产曰：「君之言，可采其半。」",fail:"子产叹曰：「郑将无以自立矣。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Eu={theme:"兵者诡道",intro:"孙子武者，齐人也。以兵法见于吴王阖闾。",debates:[f("v_sunwu_guidao","兵者诡道","military","shi",!0,"孙武","吴之将军","吴王问：「兵者何先？」孙武曰：「兵者，诡道也。」",[l("兵者诡道也。故能而示之不能，用而示之不用。君以为然乎？",t("shi","hit","近而示之远，远而示之近。利而诱之，乱而取之。此兵家之胜，不可先传也。","孙武曰：「可与言兵矣。」"),t("yi","reason","诡道者，欺敌也。然失信于天下，终必自损。","孙武
