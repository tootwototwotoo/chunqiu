曰：「兵以诈立，以利动。」"),t("li","reason","兵贵实力。示弱于人，恐自堕其气。","孙武曰：「实而备之，强而避之。」")),l("不战而屈人之兵，与百战百胜，孰善？",t("shi","hit","不战而屈人之兵，善之善者也。百战百胜，非善之善者也。","孙武曰：「上兵伐谋，其次伐交。」"),t("li","reason","不战而胜者，敌未服也。后必复起。","孙武曰：「全国为上，破国次之。」"),t("yi","evade","战与不战，视乎义之所在，非以胜负论。","孙武曰：「主不可以怒而兴师。」")),l("知彼知己，百战不殆。若彼己皆不知，当如何？",t("shi","hit","不知彼不知己，每战必殆。故当先为不可胜，以待敌之可胜。","孙武曰：「先为不可胜，以待敌之可胜。」"),t("li","reason","既不知，则不可战。当速退以全军。","孙武曰：「小敌之坚，大敌之擒也。」"),t("ming","evade","不知则问谍。谍者，兵之要也。","孙武曰：「故明君贤将，能以上智为间者，必成大功。」"))],z("吴军阵图",1,"你呈上吴军阵图：五阵相生，奇正相倚。"),{success:"孙武曰：「君可与言兵矣。」遂以十三篇相示。",compromise:"孙武曰：「君之言，得兵之半。」",fail:"孙武曰：「君之说，纸上之兵也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_sunwu_zhong","将在外","military","shi",!1,"孙武","吴之将军","吴王欲伐楚，而朝中多异议。孙武曰：「将在军，君命有所不受。」",[l("君命与军令相左，将当从谁？",t("shi","hit","从军令。战场瞬息，君命远至则失机。","孙武曰：「将者，国之辅也。」"),t("yi","reason","将从君命。君为国之主，将不可专断。","孙武曰：「君之所以患于军者三。」"),t("li","evade","择其利者而从之。","孙武曰：「不知三军之权，而同三军之任，则军士疑矣。」")),l("久战而民疲，君欲罢兵，将不可。君以为何如？",t("shi","hit","兵贵胜，不贵久。若胜在旦夕，不宜罢；若不可胜，则应早退。","孙武曰：「夫兵久而国利者，未之有也。」"),t("yi","reason","民为邦本。民疲而战，虽胜亦危。","孙武曰：「久暴师则国用不足。」"),t("li","evade","战之利害，唯将知之。君不必问民。","孙武曰：「不尽知用兵之害者，则不能尽知用兵之利也。」")),l("吴军入郢，五战而胜。今楚人复聚，君将何以处之？",t("shi","hit","胜而后求战者，先为不可胜也。今当整军而守，不可贪进。","孙武曰：「善用兵者，修道而保法。」"),t("li","reason","乘胜逐北，可一举灭楚。","孙武曰：「穷寇勿迫，此用兵之法也。」"),t("ming","evade","既已入郢，当收其民心，兵事可缓。","孙武曰：「卒善而养之，是谓胜敌而益强。」"))],null,{success:"孙武曰：「子知兵矣。」后与子胥共谋伐楚。",compromise:"孙武曰：「君之言，可用其半。」",fail:"孙武曰：「君未知道也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_sunwu_shi","势与节","military","shi",!1,"孙武","吴之将军","吴王问：「兵之势，何以如转圆石于千仞之山？」",[l("激水之疾，至于漂石者，势也。何以造势？",t("shi","hit","势如彍弩，节如发机。蓄之既久，发之必疾。","孙武曰：「善战者，其势险，其节短。」"),t("li","reason","势者，众力所聚。多其兵则可。","孙武曰：「兵非益多也，惟无武进。」"),t("yi","evade","势者天也，非人力可造。","孙武曰：「故善战者，求之于势，不责于人。」")),l("以正合，以奇胜。奇正之变，何所底止？",t("shi","hit","奇正相生，如循环之无端，孰能穷之？","孙武曰：「此兵家之要也。」"),t("li","reason","正者常也，奇者变也。守常而待变可矣。","孙武曰：「凡战者，以正合，以奇胜。」"),t("ming","evade","奇正之术，因人而异，不可言传。","孙武曰：「人皆知我所以胜之形，而莫知吾所以制胜之形。」")),l("兵无常势，水无常形。君以何者为常？",t("shi","hit","唯变是常。能因敌变化而取胜者，谓之神。","孙武曰：「故五行无常胜，四时无常位。」"),t("yi","reason","唯义是常。兵虽诡，终不可以不义行之。","孙武曰：「兵者，国之大事，死生之地。」"),t("li","evade","唯利是常。兵之所向，在利而已。","孙武曰：「合于利而动，不合于利而止。」"))],null,{success:"孙武曰：「可与论势矣。」",compromise:"孙武曰：「君之见，未尽。」",fail:"孙武曰：「君之说，纸上谈兵。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Mu={theme:"持盈定倾节事",intro:"范蠡事越王勾践，深谋二十余年，竟灭吴。",debates:[f("v_fanli_gongcheng","功成身退","diplomacy","li",!0,"范蠡","越之上将军","吴既灭，范蠡辞于勾践。或问之曰：「功成而去，何也？」",[l("功成身退，君以为智乎？",t("li","hit","飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。","范蠡曰：「此吾之所以去也。」"),t("yi","reason","君臣之义，当共始终。功成而去，非忠也。","范蠡曰：「君行令，臣行意。」"),t("ming","evade","去留皆有数，何必较智愚？","范蠡曰：「时不至，不可强生；事不究，不可强成。」")),l("若不去，果有祸乎？",t("li","hit","必有其祸。名高者危，功大者疑。","范蠡曰：「蜚鸟尽，良弓藏。」"),t("yi","reason","越王尝卧薪尝胆，必不负功臣。","范蠡曰：「越王为人长颈鸟喙。」"),t("shi","evade","祸福无门，唯人所召，何必预虑？","范蠡曰：「天道盈而不溢，盛而不骄。」")),l("文种不去，终赐剑而死。君以为其智不及君乎？",t("li","hit","非智不及，系于名。种自恃其功，不肯去耳。","范蠡曰：「种之去，不及吾早。」"),t("yi","reason","种死于忠，非愚也。忠臣不避死。","范蠡曰：「此忠臣之节，然非智也。」"),t("ming","evade","死生有命，非人所能与。","范蠡曰：「持满者与天。」"))],z("越王赐书",1,"你呈上越王赐文种之书：「子教寡人伐吴七术，寡人用其三而败吴。」"),{success:"范蠡曰：「君知进退之机矣。」遂与论治生之道。",compromise:"范蠡曰：「君之言，亦有见。」",fail:"范蠡曰：「君之说，犹恋于功名。」"},{success:{fame:6,rel:8,money:40},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_fanli_zhisheng","治生之术","trade","li",!1,"范蠡","陶朱公","范蠡浮海出齐，变姓名，自谓鸱夷子皮，耕于海畔。",[l("旱则资舟，水则资车。君以为然乎？",t("li","hit","反其道而行之。人弃我取，人取我与。此治生之要也。","范蠡曰：「善哉！可与言治生矣。」"),t("yi","reason","预为备则可。然囤积居奇，非仁者所为。","范蠡曰：「旱则资舟，水则资车，物之理也。」"),t("ming","evade","市价有常，随时而买卖，何须逆计？","范蠡曰：「贵上极则反贱，贱下极则反贵。」")),l("三致千金而三散之，君以为何如？",t("li","hit","财者，天下之公物。聚而不散，则招祸；散而不聚，则无以济人。","范蠡曰：「此吾之所以三散也。」"),t("yi","reason","散财者，义也。然当先富而后能散。","范蠡曰：「富好行其德。」"),t("ming","evade","聚散有数，不必有意为之。","范蠡曰：「知斗则修备，时用则知物。」")),l("积贮待价与周转获利，孰优？",t("li","hit","周转为上。财币欲其行如流水，积而不流则滞。","范蠡曰：「务完物，无息币。」"),t("ming","reason","积贮者，待时也。时至则利倍。","范蠡曰：「无敢居贵。」"),t("shi","evade","二者皆市道，唯视其时而择。","范蠡曰：「论其有余不足，则知贵贱。」"))],null,{success:"范蠡曰：「君可与言治生矣。」授你积贮之理。",compromise:"范蠡曰：「君之言，得半。」",fail:"范蠡笑曰：「君之算，犹未精也。」"},{success:{fame:5,rel:7,money:80},compromise:{fame:2,rel:3,money:20},fail:{fame:-1,rel:-2}}),f("v_fanli_chiyying","持盈定倾","diplomacy","li",!1,"范蠡","越之上将军","越为吴所败，栖于会稽。范蠡曰：「持满者与天，定倾者与人，节事者与地。」",[l("国家倾危，当何以定之？",t("li","hit","定倾者与人。卑辞厚礼以事之，因其所欲，然后图之。","范蠡曰：「此吾之谋也。」"),t("shi","reason","倾危之际，唯有死战。","范蠡曰：「勇者不惧，然不足以定倾。」"),t("yi","reason","以诚信感人，虽强敌亦服。","范蠡曰：「卑辞厚礼，此定倾之道也。」")),l("屈身事仇，君以为耻乎？",t("li","hit","耻在一时而存社稷，胜于快一时而亡宗庙。","范蠡曰：「此勾践之所以能复也。」"),t("yi","reason","君辱臣死。屈身事仇，非人臣所忍。","范蠡曰：「死易，处死难。」"),t("shi","evade","屈与不屈，皆亡国之道，何必择？","范蠡曰：「夫国者，成天之柄也。」")),l("吴既赦越，越当务何者为先？",t("li","hit","先富民。民富则兵强，兵强则可图。","范蠡曰：「善哉！此治国之本也。」"),t("shi","reason","先练兵。兵未强而图之，是再败也。","范蠡曰：「兵者不可先动。」"),t("yi","evade","先修德。德修而民心归，兵不待练而可用矣。","范蠡曰：「天时不作，弗为人客。」"))],null,{success:"范蠡曰：「君可与谋国矣。」",compromise:"范蠡曰：「君之言，可采。」",fail:"范蠡曰：「君未谙危亡之势。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Au={theme:"复仇与忠谏",intro:"伍子胥父兄为楚平王所杀，奔吴，誓复其仇。",debates:[f("v_zixu_chou","复仇","military","shi",!0,"伍子胥","吴之相","你问伍子胥：「父兄之仇，不当报乎？」子胥曰：「吾日暮途远，吾故倒行而逆施之。」",[l("以臣仇君，可乎？",t("shi","hit","君杀吾父兄，是君先绝其恩。恩绝则义亦绝，何不可报？","子胥曰：「吾之仇，非君也，杀吾父者。」"),t("yi","reason","君虽无道，臣不可以仇君。此大伦也。","子胥曰：「吾不能忍，故为之。」"),t("li","evade","仇可报，当以其道，不宜借兵他国。","子胥曰：「吾借吴之力，以报吾仇。」")),l("掘墓鞭尸，君以为过乎？",t("shi","hit","不及其身，故鞭其尸。吾所求者，偿其罪耳。","子胥曰：「此吾所不及于忠者。」"),t("yi","reason","死者已矣。鞭尸者，逞其愤也，非义。","子胥曰：「吾日暮途远，故倒行而逆施之。」"),t("ming","evade","尸者无知，鞭之无益。","子胥曰：「吾不为此，无以慰死者。」")),l("若仇人已死，而仇人之后在朝，君将复仇乎？",t("shi","hit","仇不除根，必复生。当及其未大而图之。","子胥曰：「此吾所以去也。」"),t("yi","reason","祸不及嗣。仇人既死，则仇已报。","子胥曰：「君命不可违，吾不敢受。」"),t("li","evade","复仇者，当量力。不可量力，则姑置之。","子胥曰：「吾不量力，故至于此。」"))],z("楚平王墓志",1,"你呈上楚平王墓志：其父之死于谗，而平王实杀其子。"),{success:"子胥曰：「君知吾心矣。」遂与论复仇之义。",compromise:"子胥曰：「君之言，未尽吾意。」",fail:"子胥咬牙：「子非吾徒也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zixu_jian","忠谏","court","shi",!1,"伍子胥","吴之相","吴王夫差将伐齐，子胥曰：「未可。越，腹心之疾；齐，疥癣也。」",[l("越与齐，孰为吴之患？",t("shi","hit","越为腹心之疾，齐为疥癣。伐齐而越在外，必为后患。","子胥曰：「此吾所以谏也。」"),t("li","reason","齐大而富，取之可以强国。越僻小，不足虑。","子胥曰：「昔者越之战，几乎亡吴。」"),t("yi","evade","当以德服之，不在择敌。","子胥曰：「今王恃其国之大，欲以亡国之臣为谋。」")),l("忠谏而不听，君将如何？",t("shi","hit","谏而不听，则姑徐之。不可去，去则无人复谏。","子胥曰：「吾不能如蠡之去也。」"),t("li","reason","不听则去。留而无益，徒取祸耳。","子胥曰：「此范蠡之所以能存其身也。」"),t("ming","evade","谏者尽吾心，听不听在君。","子胥曰：「吾故倒行而逆施之。」")),l("君赐属镂之剑，令子自杀。子将如何？",t("shi","hit","受剑而死。死前留言：必树吾墓上以梓，令可以为器；而抉吾眼悬吴东门之上，以观越寇之入灭吴也。","子胥曰：「我死后，吴国必亡。」"),t("yi","reason","不当受剑。既知吴将亡，当去以待其时。","子胥曰：「臣不忠，不如子胥之死。」"),t("li","evade","死生有命。受与不受，皆亡也。","子胥曰：「吾生不能正君，死无以复言。」"))],null,{success:"子胥曰：「君可与言忠矣。」",compromise:"子胥曰：「君之言，有可取。」",fail:"子胥怒曰：「子欲吾负先君乎！」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}}),f("v_zixu_ben","去国","diplomacy","shi",!1,"伍子胥","吴之相","楚平王杀伍奢、伍尚。子胥出奔。过昭关，关吏欲执之。",[l("父兄就戮，君当同死，抑或出奔？",t("shi","hit","死而无益，不若出奔以图后效。吾非惜死，惜其死之无补。","子胥曰：「此吾之所以出奔也。」"),t("yi","reason","父兄死而子遁，非孝。当同死。","子胥曰：「吾死则仇无人报。」"),t("li","evade","去留皆无补，何必较？","子胥曰：「日暮途远，吾故倒行而逆施之。」")),l("借他国之兵以伐母国，君不惧为天下所非乎？",t("shi","hit","吾所求者，一人之罪。非伐楚国，除其贼耳。","子胥曰：「吾非叛国，报父兄之仇也。」"),t("yi","reason","母国不可伐。虽仇在人，楚国无罪。","子胥曰：「吾日暮途远，故倒行而逆施之。」"),t("ming","evade","是非之名，听之后世可也。","子胥曰：「吾不量力，故至于此。」")),l("昭关之吏捕君甚急。君将如何脱身？",t("shi","hit","一夜白头，易容而出。急则智生。","子胥曰：「此吾之所为也。」"),t("li","reason","以财贿吏，可脱。","子胥曰：「吾无财，唯有死耳。」"),t("yi","evade","天不绝人，自会有路。","子胥曰：「天之所助，人也。」"))],null,{success:"子胥曰：「君知吾心之难矣。」",compromise:"子胥曰：「君之言，犹隔一层。」",fail:"子胥曰：「子未见吾之痛。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Tu={theme:"辞令之利",intro:"烛之武年过七十，为郑伯夜缒而出，见秦伯。",debates:[f("v_zhuzhiwu_pei","亡郑以陪邻","diplomacy","li",!0,"烛之武","郑之大夫","秦晋围郑。烛之武夜缒而出，见秦伯曰：「秦晋围郑，郑既知亡矣。」",[l("郑亡而秦得之，君以为利乎？",t("li","hit","越国以鄙远，君知其难也。亡郑以陪邻，邻之厚，君之薄也。","秦伯曰：「然。」遂与郑盟。"),t("yi","reason","灭郑者义也。既与之盟，不可背。","烛之武曰：「夫晋，何厌之有？」"),t("shi","evade","兵已在城下，言之无益。","烛之武曰：「若亡郑而有益于君，敢以烦执事。」")),l("晋与秦素善，君结盟于郑，不惧晋乎？",t("li","hit","晋许君焦、瑕，朝济而夕设版焉。夫晋何厌之有？既东封郑，又欲肆其西封。","秦伯曰：「微夫人之力不及此。」"),t("yi","reason","晋秦之好，非一日矣。君背之，天下其谓君何？","烛之武曰：「邻之厚，君之薄也。」"),t("ming","evade","晋之志，君自知之，不必吾言。","烛之武曰：「若不阙秦，将焉取之？」")),l("郑既存，当何以事秦？",t("li","hit","郑愿为东道主，行李之往来，共其乏困。","烛之武曰：「若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。」"),t("yi","reason","郑当坚守其义，不偏事一国。","烛之武曰：「阙秦以利晋，唯君图之。」"),t("shi","evade","事秦事晋，皆非长久之计。","烛之武曰：「夫晋，何厌之有？」"))],z("秦晋围郑图",1,"你呈上围城形势图：秦军在西，晋军在北，两军不相属。"),{success:"秦伯与郑人盟，使杞子、逢孙、杨孙戍之，乃还。郑以不亡。",compromise:"秦伯沉吟：「子之言，亦有理。」",fail:"秦伯曰：「吾已与晋约矣。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhuzhiwu_ci","辞令","diplomacy","li",!1,"烛之武","郑之大夫","郑伯将盟于晋，择使于朝。或荐烛之武，武辞曰：「臣之壮也，犹不如人。」",[l("君老矣，尚能为国使乎？",t("li","hit","老而智存，何不可使？辞者，让也，非不能也。","烛之武曰：「今老矣，无能为也已。」"),t("yi","reason","老者当安其养。国之大事，付之壮者。","烛之武曰：「臣之壮也，犹不如人。」"),t("ming","evade","能与否，试之而后知。","烛之武曰：「许之。」")),l("郑伯曰「吾不能早用子，今急而求子，是寡人之过也」。君当如何答？",t("li","hit","君既知之，则不必辞。国危矣，若之何不往？","烛之武曰：「然，郑亡，子亦有不利焉。」"),t("yi","reason","君既谢过，臣当尽节。虽老不辞。","烛之武曰：「许之。」"),t("shi","evade","让之再三，以全君之体面。","烛之武曰：「夜缒而出。」")),l("说辞之要，在何？",t("li","hit","在明利害，不在争是非。敌国之人，未必听义，必听利。","烛之武曰：「善哉！此吾之所以能说秦伯也。」"),t("yi","reason","在动其心。人心一感，事自成。","烛之武曰：「若舍郑以为东道主。」"),t("shi","evade","在示其威。无威则言不听。","烛之武曰：「邻之厚，君之薄也。」"))],null,{success:"烛之武曰：「君可与言辞矣。」",compromise:"烛之武曰：「君之言，得辞之半。」",fail:"烛之武摇头：「是说不足以动人也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zhuzhiwu_li","利与义","diplomacy","li",!1,"烛之武","郑之大夫","或谓烛之武曰：「子之说秦伯，皆言利，不言义。无乃非君子之道乎？」",[l("说人以利，可乎？",t("li","hit","小国无义可言，唯有利可恃。言之于义则迂，言之于利则动。","烛之武曰：「此小国之所以存也。」"),t("yi","reason","不可。言利则人皆趋于利，无复有义。","烛之武曰：「义者，大国之饰也。」"),t("ming","evade","利义并行，视其时而用。","烛之武曰：「君亦无所害。」")),l("郑事秦又事晋，君以为可长久乎？",t("li","hit","两属则两不亲。然小国处其间，非两属无以自存。","烛之武曰：「此郑之所以为郑也。」"),t("yi","reason","当择一而从之，忠信不二。","烛之武曰：「郑亡，子亦有不利焉。」"),t("shi","evade","事之长久，非人所能谋。","烛之武曰：「夫晋，何厌之有？」")),l("郑终为晋所并。君之谋，可谓效乎？",t("li","hit","谋者，救一时之危。郑之亡，在数世之后，非吾谋之失。","烛之武曰：「若舍郑以为东道主，君亦无所害。」"),t("yi","reason","谋而不终，无功可言。","烛之武曰：「许之。」"),t("ming","evade","国之存亡有数，非一使所能移。","烛之武曰：「夜缒而出。」"))],null,{success:"烛之武曰：「君知小国之难矣。」",compromise:"烛之武曰：「君之言，未尽。」",fail:"烛之武曰：「子犹以大国之道责小国也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ou={theme:"逍遥与齐物",intro:"庄子钓于濮水，楚王使大夫二人往先焉。",debates:[f("v_zhuangzi_xiaoyao","逍遥","court","ming",!1,"庄周","蒙之漆园吏","楚王使二大夫往聘庄子。庄子持竿不顾，曰：「吾闻楚有神龟。」",[l("神龟死已三千岁，王巾笥而藏之庙堂之上。此龟者，宁其死为留骨而贵乎？",t("ming","hit","宁其生而曳尾于涂中。吾将曳尾于涂中。","二大夫曰：「宁生而曳尾涂中。」庄子曰：「往矣！吾将曳尾于涂中。」"),t("li","reason","死而贵，胜于生而贱。庙堂之显，人所愿也。","庄子曰：「往矣！吾将曳尾于涂中。」"),t("shi","evade","生与贵，各有所取，何必择？","庄子曰：「往矣！无以汝为也。」")),l("鹏之徙于南冥也，水击三千里。蜩与学鸠笑之。君以为孰是？",t("ming","hit","二者皆有所待。鹏待风，鸠待枝，皆非逍遥。","庄子曰：「此小大之辩也。」"),t("li","reason","鹏志在千里，鸠安于一枝，鹏是。","庄子曰：「之二虫又何知？」"),t("shi","evade","大小各适其性，无所谓是非。","庄子曰：「小知不及大知，小年不及大年。」")),l("夫子之道，天下莫能容。君不惧乎？",t("ming","hit","不容何病？不容然后见君子。且天地之大，岂独一容身之处？","庄子曰：「独不见狸狌乎？」"),t("yi","reason","道不行于世，则当自修，以待其时。","庄子曰：「小夫之知，不离苞苴竿牍。」"),t("li","evade","道不欲容，容则失其真。","庄子曰：「人皆知有用之用，而莫知无用之用也。」"))],z("濮水钓图",1,"你呈上濮水图：此处水清而鱼肥，远离朝市。"),{success:"庄子曰：「君可与言逍遥矣。」遂与游于濠梁之上。",compromise:"庄子曰：「君之言，犹有所待。」",fail:"庄子曰：「君之见，犹在瓮中。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhuangzi_qiwu","齐物","court","ming",!1,"庄周","蒙之漆园吏","你与庄子游于濠梁之上。庄子曰：「鯈鱼出游从容，是鱼之乐也。」",[l("子非鱼，安知鱼之乐？",t("ming","hit","子非我，安知我不知鱼之乐？","庄子曰：「请循其本。」"),t("li","reason","鱼之乐，不可知。子之言，无据。","庄子曰：「既已知吾知之而问我，我知之濠上也。」"),t("yi","evade","乐者，人自知之，不必辩。","庄子曰：「天地与我并生，而万物与我为一。」")),l("天下莫大于秋豪之末，而太山为小。君以为然乎？",t("ming","hit","以道观之，物无贵贱。大小之别，自其形也。","庄子曰：「此齐物之论也。」"),t("li","reason","泰山大于秋毫，人所共见。此说不可通。","庄子曰：「自其异者视之，肝胆楚越也。」"),t("shi","evade","大小之辩，无益于治。","庄子曰：「大辩不言。」")),l("昔者庄周梦为胡蝶，栩栩然胡蝶也。不知周之梦为胡蝶与？胡蝶之梦为周与？",t("ming","hit","此之谓物化。周与蝶，必有分矣，然其分不可得而知。","庄子曰：「此之谓物化。」"),t("yi","reason","梦醒而辨，何疑之有？周自周，蝶自蝶。","庄子曰：「不知周也。」"),t("li","evade","梦觉之事，无关于治国。","庄子曰：「且有大觉而后知此其大梦也。」"))],null,{success:"庄子曰：「君可与言齐物矣。」",compromise:"庄子曰：「君之言，犹隔一尘。」",fail:"庄子曰：「君犹以形求之。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zhuangzi_wuyong","无用之用","court","ming",!1,"庄周","蒙之漆园吏","匠石之齐，至乎曲辕，见栎社树，其大蔽牛。匠石不顾，曰：「散木也，无所可用。」",[l("无用之木，何以得寿？",t("ming","hit","以其不材，故能若是之寿。此无用之用也。","庄子曰：「此乃神人之所以为大祥也。」"),t("li","reason","无用则见弃，见弃则不能自存。","庄子曰：「且予求无所可用久矣。」"),t("yi","evade","材与不材，皆非道也。","庄子曰：「周将处乎材与不材之间。」")),l("人皆求有用，君独言无用，何也？",t("ming","hit","有用者为人所役，无用者得全其天。","庄子曰：「人皆知有用之用，而莫知无用之用也。」"),t("li","reason","无用则无功，无功则无位。","庄子曰：「此之谓不材之木。」"),t("shi","evade","有用无用，名耳，何必较？","庄子曰：「名者，实之宾也。」")),l("处于材与不材之间，君以为如何？",t("ming","hit","未足。材与不材之间，似是而非，犹未免乎累。","庄子曰：「若夫乘道德而浮游则不然。」"),t("yi","reason","此中庸之道，可矣。","庄子曰：「其唯道德之乡乎！」"),t("li","evade","二者之间，可以自全，何必更求？","庄子曰：「周将处乎材与不材之间。」"))],null,{success:"庄子曰：「君可与言无用矣。」",compromise:"庄子曰：「君之见，犹有所执。」",fail:"庄子曰：「君犹以用求物。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Cu={theme:"义利之辨",intro:"孟子见梁惠王。王曰：「叟不远千里而来，亦将有以利吾国乎？」",debates:[f("v_mengzi_yili","义利之辨","court","yi",!0,"孟子","邹之学者","梁惠王曰：「叟不远千里而来，亦将有以利吾国乎？」孟子对曰：「王何必曰利？」",[l("王何必曰利？亦有仁义而已矣。君以为然乎？",t("yi","hit","上下交征利而国危矣。万乘之国，弑其君者，必千乘之家。","孟子曰：「王亦曰仁义而已矣，何必曰利？」"),t("li","reason","国无利则不能存。仁义者，饰也。","孟子曰：「苟为后义而先利，不夺不餍。」"),t("ming","evade","义利并行，不必偏废。","孟子曰：「未有仁而遗其亲者也。」")),l("今有强国陈兵于境，言仁义则不能退敌。君将如何？",t("yi","hit","以仁义固其民，民效死而弗去，则虽强敌不能攻。","孟子曰：「得道者多助，失道者寡助。」"),t("li","reason","兵来则兵挡。言仁义于战阵，无益。","孟子曰：「城非不高也，池非不深也，兵革非不坚利也，委而去之。」"),t("shi","evade","战与和，视其势，不必以仁义为名。","孟子曰：「天时不如地利，地利不如人和。」")),l("人皆有不忍人之心。君以为然乎？",t("yi","hit","乍见孺子将入于井，皆有怵惕恻隐之心。此非为交情，非为名誉。","孟子曰：「无恻隐之心，非人也。」"),t("li","reason","人心本私。所谓不忍，皆有所为而发。","孟子曰：「仁义礼智，非由外铄我也，我固有之也。」"),t("ming","evade","心之善恶，不必论。行之善即可。","孟子曰：「乃若其情，则可以为善矣。」"))],z("井田旧图",1,"你呈上井田旧图：八家同井，出入相友，守望相助。"),{success:"孟子曰：「善哉！此王道之始也。」遂为王陈王道。",compromise:"孟子曰：「王之言，犹未离于利。」",fail:"孟子曰：「王若曰利，则上下交征利而国危矣。」"},{success:{fame:7,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_mengzi_rensheng","舍生取义","court","yi",!1,"孟子","邹之学者","孟子曰：「生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。」",[l("生与义不可得兼，君取何者？",t("yi","hit","取义。所欲有甚于生者，故不为苟得也。","孟子曰：「此之谓失其本心。」"),t("li","reason","取生。身死则义无所附。","孟子曰：「一箪食，一豆羹，得之则生，弗得则死。」"),t("shi","evade","当视其时，不可执一。","孟子曰：「万钟则不辨礼义而受之。」")),l("行道而见逐，君以为义乎？",t("yi","hit","义在其行，不在其效。道不行，非我之罪。","孟子曰：「穷则独善其身，达则兼善天下。」"),t("li","reason","见逐则当改其道，以求行于世。","孟子曰：「枉道而从彼，何也？」"),t("ming","evade","行与不行，皆有命焉。","孟子曰：「莫非命也，顺受其正。」")),l("王馈兼金一百而不受，或馈七十镒而受。君以为何故？",t("yi","hit","有故而去者，不受；以其道来者，受之。义不在物而在其义。","孟子曰：「若于齐，则未有处也。」"),t("li","reason","金之同也，何择焉？受之可也。","孟子曰：「无处而馈之，是货之也。」"),t("shi","evade","受与不受，皆小节，不必论。","孟子曰：「可以取，可以无取，取伤廉。」"))],null,{success:"孟子曰：「君可与言义矣。」",compromise:"孟子曰：「君之言，近是而未尽。」",fail:"孟子曰：「君犹未离于利也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_mengzi_wangdao","仁政","domestic","yi",!0,"孟子","邹之学者","孟子曰：「五亩之宅，树之以桑，五十者可以衣帛矣。」",[l("欲行王政，当自何始？",t("yi","hit","先制民之产。民无恒产，则无恒心。","孟子曰：「此王道之本也。」"),t("li","reason","先立制度，明赏罚。","孟子曰：「徒法不能以自行。」"),t("shi","evade","先修兵备。无兵则虽有善政，不能守。","孟子曰：「制梃以挞秦楚之坚甲利兵矣。」")),l("民有恒产则治，无恒产则乱。君以为然乎？",t("yi","hit","无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。","孟子曰：「此吾之所谓也。」"),t("li","reason","民之乱，非尽由贫。教之亦可安。","孟子曰：「谨庠序之教，申之以孝悌之义。」"),t("ming","evade","治乱有数，非人力所能尽。","孟子曰：「七十者衣帛食肉，黎民不饥不寒。」")),l("王道之成，当何以验之？",t("yi","hit","老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。","孟子曰：「善哉！此吾所谓王也。」"),t("li","reason","府库充盈，兵甲坚利，则王道成矣。","孟子曰：「然而不王者，未之有也。」"),t("shi","evade","验之何益？行之而已。","孟子曰：「王如善之，则何为不行？」"))],null,{success:"孟子曰：「君可与行王政矣。」",compromise:"孟子曰：「君之言，有可取者。」",fail:"孟子曰：「君之志，在霸不在王。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Iu={theme:"性恶与礼法",intro:"荀卿三为稷下祭酒，倡「人之性恶，其善者伪也」。",debates:[f("v_xunzi_xing_e","性恶","court","li",!0,"荀子","稷下祭酒","荀子曰：「人之性恶，其善者伪也。」",[l("人之性恶乎？善乎？",t("li","hit","性恶。目好色，耳好声，口好味，心好利，皆生于情。必待师法而后正。","荀子曰：「此吾所谓性恶也。」"),t("yi","reason","性本善。恻隐之心，人皆有之。","荀子曰：「然则人之性恶明矣，其善者伪也。」"),t("ming","evade","性之善恶，不必论。教之可使为善。","荀子曰：「人之性恶，必将待师法然后正。」")),l("既言性恶，则礼义从何而生？",t("li","hit","生于圣人之伪。圣人化性而起伪，故立礼义以正之。","荀子曰：「此礼之所由起也。」"),t("yi","reason","礼义本于心，非外铄也。","荀子曰：「凡礼义者，是生于圣人之伪。」"),t("shi","evade","礼义者，先王之成法，遵之可也。","荀子曰：「故必将有师法之化、礼义之道。」")),l("性恶之说，天下必非之。君不惧乎？",t("li","hit","不惧。吾言其理，非言其情。知其恶，方能化之。","荀子曰：「善言古者必有节于今。」"),t("yi","reason","纵言理实，然伤人心。不可不惧。","荀子曰：「赠人以言，重于金石珠玉。」"),t("ming","evade","是非听之后世，何必争于一时？","荀子曰：「不诱于誉，不恐于诽。」"))],z("劝学篇简",1,"你呈上劝学竹简：「学不可以已。」"),{success:"荀子曰：「君可与言性矣。」",compromise:"荀子曰：「君之说，半得之。」",fail:"荀子曰：「君犹惑于孟子之说。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xunzi_tian","天人之分","domestic","li",!1,"荀子","稷下祭酒","星坠木鸣，国人皆恐。荀子曰：「是天地之变，阴阳之化，物之罕至者也。」",[l("天变可畏乎？",t("li","hit","怪之可也，畏之非也。天行有常，不为尧存，不为桀亡。","荀子曰：「此吾所谓明于天人之分也。」"),t("yi","reason","天变即天示。人君当修德以应之。","荀子曰：「日月食而救之，天旱而雩，卜筮然后决大事。」"),t("ming","evade","天变之事，不可知。不必论其可畏与否。","荀子曰：「唯圣人为不求知天。」")),l("人当听命于天，抑或制天命而用之？",t("li","hit","制天命而用之。天有其时，地有其财，人有其治，夫是之谓能参。","荀子曰：「善哉！此吾之学也。」"),t("yi","reason","人当顺天。逆天者必败。","荀子曰：「应之以治则吉，应之以乱则凶。」"),t("shi","evade","天人各行其道，不必相与。","荀子曰：「明于天人之分，则可谓至人矣。」")),l("祭祀之礼，既不信鬼神，何以为之？",t("li","hit","君子以为文，百姓以为神。文以致敬，非以求福。","荀子曰：「此礼之大凡也。」"),t("yi","reason","祭祀者，人心所寄，不可废也。","荀子曰：「其在君子，以为人道也。」"),t("ming","evade","既不信，则废之可也。","荀子曰：「其在百姓，以为鬼事也。」"))],null,{success:"荀子曰：「君可与言天人之分矣。」",compromise:"荀子曰：「君之言，近道而未达。」",fail:"荀子曰：「君犹蔽于天也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_xunzi_li","隆礼重法","court","li",!0,"荀子","稷下祭酒","荀子曰：「隆礼至法则国有常，尚贤使能则民知方。」",[l("治国礼先乎？法先乎？",t("li","hit","礼者，法之大分，类之纲纪。无礼则法无所依。","荀子曰：「此吾礼法之说也。」"),t("yi","reason","法明则民知所避，礼则缓而不切。","荀子曰：「法而不能，则职废。」"),t("shi","evade","二者相须，不必分先后。","荀子曰：「隆礼至法，而尚有奸邪者，有矣。」")),l("涂之人可以为禹，君以为然乎？",t("li","hit","然。涂之人有可以知之质、可以能之具，惟待师法之教。","荀子曰：「此吾所谓『可以为』也。」"),t("yi","reason","人分上下智愚，涂人岂能为圣？","荀子曰：「涂之人可以为禹，曷谓也？」"),t("ming","evade","可为不可为，在人自勉，何须定论？","荀子曰：「君子生非异也，善假于物也。」")),l("君与师，孰重？",t("li","hit","国将兴，必贵师而重傅。师者，人之模范也。","荀子曰：「此吾之所以重师也。」"),t("yi","reason","君为一国之主，师不过一人。","荀子曰：「君师者，治之本也。」"),t("shi","evade","二者各有其分，不可相较。","荀子曰：「言而不称师谓之畔。」"))],null,{success:"荀子曰：「君可与共治矣。」",compromise:"荀子曰：「君之见，得半。」",fail:"荀子曰：「君之说，未及于礼。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Nu={theme:"法术势",intro:"韩非疾治国不务修明其法制，故作《孤愤》《五蠹》。",debates:[f("v_hanfei_fa","法术势","court","li",!0,"韩非","韩之公子","韩非曰：「法者，编著之图籍，设之于官府而布之于百姓者也。」",[l("治国以法为主，君以为然乎？",t("li","hit","法明则内无怨女，外无旷夫；法不明则奸臣窃柄。","韩非曰：「此吾法之要也。」"),t("yi","reason","徒法不能自足。人主治国，当以德感之。","韩非曰：「释法术而心治，尧不能正一国。」"),t("shi","evade","法与德并行，何须偏执？","韩非曰：「不务修明其法制，执势以御其臣下。」")),l("术之于法，孰为要？",t("li","hit","法者明也，术者幽也。法以布之于众，术以御之于内。二者不可偏废。","韩非曰：「君无术则弊于上，臣无法则乱于下。」"),t("yi","reason","法布之众，人所共见，君不必以术。","韩非曰：「术者，藏之于胸中，以偶众端而潜御群臣者也。」"),t("ming","evade","势足矣。有势则法自行。","韩非曰：「抱法处势则治。」")),l("臣主之间，何以立势？",t("li","hit","权势不可以假人。去其私党，绝其私请，则势自在我。","韩非曰：「此吾所谓势也。」"),t("yi","reason","信臣如信己，何须防之？","韩非曰：「人主之患在于信人，信人则制于人。」"),t("shi","evade","势之存否，在国之大；不在术之得失。","韩非曰：「千钧得船则浮，锱铢失船则沉。」"))],z("孤愤篇简",1,"你呈上《孤愤》竹简：智术之士，必远见而明察，不明察不能烛私。"),{success:"韩非曰：「君可与言法矣。」",compromise:"韩非曰：「君之言，未尽其术。」",fail:"韩非曰：「君之说，儒者之饰也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_hanfei_wudu","五蠹","domestic","li",!1,"韩非","韩之公子","韩非曰：「儒以文乱法，侠以武犯禁。」",[l("儒与侠，国之蠹乎？",t("li","hit","皆蠹也。儒以文乱法，侠以武犯禁，而人主兼礼之，此所以乱也。","韩非曰：「此五蠹之首也。」"),t("yi","reason","儒侠皆贤者，何蠹之有？","韩非曰：「行货赂而袭当涂者则求得。」"),t("ming","evade","蠹与否，视其行，不可一概而论。","韩非曰：「不期修古，不法常可。」")),l("世异则事异，事异则备变。君以为然乎？",t("li","hit","守株待兔者，非愚也，乃不知变也。今欲以先王之政，治当世之民，皆守株之类也。","韩非曰：「此吾所谓不期修古。」"),t("yi","reason","先王之道，万世不易。何可轻变？","韩非曰：「世易时移，变法宜矣。」"),t("shi","evade","变与不变，视势而定。","韩非曰：「事异则备变。」")),l("人主之患，在信人乎？",t("li","hit","在信人。信人则制于人。信人者，必有以验之。","韩非曰：「此人主之患也。」"),t("yi","reason","不信臣下，则无人可用。","韩非曰：「人主之于人也，或疑之，或信之。」"),t("ming","evade","信与不信，在人之贤否。","韩非曰：「不贤而为贤者所欺，乱之始也。」"))],null,{success:"韩非曰：「君可与言治矣。」",compromise:"韩非曰：「君之言，可采者半。」",fail:"韩非曰：「君之说，五蠹之属也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_hanfei_maodun","自相矛盾","court","li",!1,"韩非","韩之公子","楚人有鬻盾与矛者，誉之曰：「吾盾之坚，物莫能陷也。」",[l("以子之矛陷子之盾，何如？",t("li","hit","其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。","韩非曰：「此吾所谓矛盾之说也。」"),t("yi","reason","此戏言耳，何关于治？","韩非曰：「今尧舜之不可两誉，矛盾之说也。」"),t("ming","evade","一物之誉，不必深究。","韩非曰：「誉所不能立，此言之患也。」")),l("今有言「贤者不必用，用者不必贤」。君以为何如？",t("li","hit","此亦矛盾也。既用其贤，则不当复疑其不贤。","韩非曰：「今两誉而并立，此矛盾之说也。」"),t("yi","reason","贤与用，本非一事。用者量才，贤者修己。","韩非曰：「使天下必待贤而后治，则贤者不足。」"),t("shi","evade","言之得失，不必尽辩。","韩非曰：「不期修古，不法常可。」")),l("法术之士，何以往往不见容于时君？",t("li","hit","法术之臣，必危其主之私。人主欲私，故恶法。","韩非曰：「此《孤愤》之所由作也。」"),t("yi","reason","法术严酷，失民之心，故不见容。","韩非曰：「不仁哉，人主之信人也。」"),t("ming","evade","时运不济，非术之过。","韩非曰：「术士之所以危也。」"))],null,{success:"韩非曰：「君可与言辩矣。」",compromise:"韩非曰：「君之言，未抵于理。」",fail:"韩非曰：「君之说，自相矛盾而不觉。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ru={theme:"纵横与货殖",intro:"子贡一出，存鲁、乱齐、破吴、强晋而霸越。",debates:[f("v_zigong_cunlu","存鲁","diplomacy","ming",!0,"子贡","孔门言语","齐将伐鲁。孔子曰：「夫鲁，坟墓所处，父母之国。」子贡请行。",[l("齐伐鲁，鲁弱不能支。君何以救之？",t("ming","hit","不救鲁而救鲁。说齐移兵伐吴，则鲁自安。","子贡曰：「此吾之所以行也。」"),t("yi","reason","当合诸侯以救鲁，明大义于天下。","子贡曰：「合诸侯者，势散而难成。」"),t("li","reason","不如事齐以求存。","子贡曰：「事齐则鲁亡矣。」")),l("说齐伐吴，是以邻为壑。君不惧为天下所非乎？",t("ming","hit","存鲁者，吾志也。齐吴之祸，非吾所致，彼自好战耳。","子贡曰：「此吾术也。」"),t("yi","reason","嫁祸于人，非君子所为。","子贡曰：「赐也何敢望回，然事有不得已。」"),t("shi","evade","是非之名，听之后世。","子贡曰：「善为之辞，则天下从之。」")),l("鲁既存，齐吴晋越皆动。君之计，其利安在？",t("ming","hit","一举而四国动，鲁存而赐之名成。此所谓一使之力也。","子贡曰：「此吾所以为言语之科也。」"),t("li","reason","徒存一鲁而乱四国，所得不偿所失。","子贡曰：「存鲁者，吾师之志也。」"),t("yi","evade","事之成败，非所逆睹。","子贡曰：「赐也，始可与言《诗》已矣。」"))],z("四国使节录",1,"你呈上四国使节往来之录：齐吴晋越，皆已动。"),{success:"子贡曰：「君可与言纵横矣。」",compromise:"子贡曰：「君之谋，得半。」",fail:"子贡曰：「君之说，不足以动四国。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_zigong_huozhi","货殖","trade","li",!1,"子贡","孔门言语","子贡既学于仲尼，退而仕于卫，废著鬻财于曹鲁之间。",[l("君子固穷，子何为好货殖？",t("li","hit","赐不受命，而货殖焉，亿则屡中。富而无骄，何损于德？","子贡曰：「此吾之所以异于颜回也。」"),t("yi","reason","学者当以道为重，货殖非所宜。","子贡曰：「富而好礼，亦圣人所许。」"),t("ming","evade","富与道，各不相碍。","子贡曰：「贫而无谄，富而无骄，何如？」")),l("亿则屡中，君何以能之？",t("li","hit","观时之盈虚，察人之所需。贵出如粪土，贱取如珠玉。","子贡曰：「此吾之所以屡中也。」"),t("ming","reason","时运耳，非人力也。","子贡曰：「赐也何敢望回。」"),t("shi","evade","市道之术，言不可尽。","子贡曰：「《诗》云：如切如磋，如琢如磨。」")),l("富而无骄，与贫而无谄，孰优？",t("yi","hit","二者皆未若贫而乐、富而好礼。","子贡曰：「《诗》云：如切如磋，如琢如磨。其斯之谓与？」"),t("li","reason","无骄无谄，已是难得。何必更进一步？","子曰：「赐也，始可与言《诗》已矣。」"),t("ming","evade","贫富之境不同，各安其分可也。","子贡曰：「富而好礼者也。」"))],null,{success:"子贡曰：「君可与言货殖矣。」",compromise:"子贡曰：「君之算，犹有未尽。」",fail:"子贡曰：「君之说，非治生之道。」"},{success:{fame:5,rel:7,money:100},compromise:{fame:2,rel:3,money:30},fail:{fame:-1,rel:-2}}),f("v_zigong_yanyu","言语之科","court","ming",!1,"子贡","孔门言语","孔子曰：「言语：宰我、子贡。」",[l("言语之要，在何？",t("ming","hit","在知其心。对方所欲，先与之；所惧，先解之。","子贡曰：「此吾之所以为使也。」"),t("li","reason","在明其利。利之所在，人自听之。","子贡曰：「赐也，始可与言《诗》已矣。」"),t("yi","reason","在守其义。义正，则辞自壮。","子贡曰：「君子一言以为知，一言以为不知。」")),l("巧言令色，圣人所耻。言语之科，岂非巧言？",t("ming","hit","巧言者，无其实而饰其辞。言语者，有其实而善其辞。二者殊途。","子贡曰：「此吾所谓言语也。」"),t("yi","reason","然终近于巧。不如讷于言而敏于行。","子贡曰：「君子欲讷于言而敏于行。」"),t("shi","evade","言辞之间，难以尽辨。","子贡曰：「不患人之不己知，患不知人也。」")),l("夫子之道，可得而闻乎？",t("yi","hit","夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。","子贡曰：「此吾之所以无言也。」"),t("ming","reason","道在日用之间，何必求之高远？","子贡曰：「夫子之墙数仞。」"),t("li","evade","道不可言，言则非道。","子贡曰：「不得其门而入，不见宗庙之美。」"))],null,{success:"子贡曰：「君可与言言语矣。」",compromise:"子贡曰：「君之言，可采。」",fail:"子贡曰：「君之辞，未得要领。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Lu={theme:"安贫乐道",intro:"颜回年二十九，发尽白，蚤死。孔子哭之恸。",debates:[f("v_yanhui_le","安贫乐道","court","yi",!1,"颜回","孔门之首","子曰：「贤哉回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。」",[l("人不堪其忧，回也不改其乐。其乐何在？",t("yi","hit","乐在道，不在物。得道则虽贫亦乐，失道则虽富亦忧。","颜回曰：「此回之所谓乐也。」"),t("li","reason","贫而乐者，强颜耳。人孰不欲富？","颜回曰：「回也不愚。」"),t("ming","evade","乐者自得，不必问其何在。","颜回曰：「愿无伐善，无施劳。」")),l("学道而贫，君以为值得乎？",t("yi","hit","道之所在，贫富不與焉。若以贫富较之，则道为货矣。","颜回曰：「回虽不敏，请事斯语矣。」"),t("li","reason","学道本为致用。贫而无用，学之何益？","颜回曰：「夫子循循然善诱人。」"),t("shi","evade","值与不值，各在其人。","颜回曰：「语之而不惰者，其回也与！」")),l("若使君治一邑，当以何为先？",t("yi","hit","先正己。己正而民自正，不待刑也。","颜回曰：「请问其目。」"),t("li","reason","先立制度，明赏罚。","颜回曰：「愿無伐善，無施勞。」"),t("ming","evade","先观其时，随事而应。","颜回曰：「回也闻一以知十。」"))],z("陋巷图",1,"你呈上陋巷图：一箪食，一瓢饮，弦歌不辍。"),{success:"颜回曰：「君可与言道矣。」",compromise:"颜回曰：「君之言，犹有物在。」",fail:"颜回曰：「君之说，非回所闻。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yanhui_sheng","三省","court","yi",!1,"颜回","孔门之首","曾子曰：「吾日三省吾身。」颜回曰：「回也，终日不违，如愚。」",[l("终日不违，如愚。君以为然乎？",t("yi","hit","退而省其私，亦足以发。回也不愚。","颜回曰：「此夫子之所以知回也。」"),t("li","reason","唯唯而已，无所发明。近于愚矣。","颜回曰：「于吾言无所不说。」"),t("ming","evade","愚与不愚，在人自见。","颜回曰：「不迁怒，不贰过。」")),l("君子之学，为人乎？为己乎？",t("yi","hit","为己。学以修己，非以炫人。","颜回曰：「古之学者为己。」"),t("li","reason","为己而学，则无以济世。","颜回曰：「君子学道则爱人。」"),t("shi","evade","为人为己，皆可学也。","颜回曰：「回也闻一以知十。」")),l("不迁怒，不贰过。君能之乎？",t("yi","hit","臣未能也。然知其为难，故日省之。","颜回曰：「回也不敏，请事斯语。」"),t("li","reason","怒者可迁，过者可改。不必自苦。","颜回曰：「不迁怒，不贰过。」"),t("ming","evade","此小节也，何必较？","颜回曰：「回也，其心三月不违仁。」"))],null,{success:"颜回曰：「君可与共学矣。」",compromise:"颜回曰：「君之见，得半。」",fail:"颜回曰：「君之说，未及于学。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_yanhui_ren","问仁","court","yi",!0,"颜回","孔门之首","颜渊问仁。子曰：「克己复礼为仁。」颜渊曰：「请问其目。」",[l("克己复礼为仁。其目安在？",t("yi","hit","非礼勿视，非礼勿听，非礼勿言，非礼勿动。","颜回曰：「回虽不敏，请事斯语矣。」"),t("li","reason","克己者，节其欲而已。礼者，顺其俗而已。","颜回曰：「请问其目。」"),t("ming","evade","仁者本心，何待目？","颜回曰：「回也，其心三月不违仁。」")),l("克己与顺性，孰为仁？",t("yi","hit","克己而后性正。性之所欲，未必为仁。","颜回曰：「此回之所事也。」"),t("ming","reason","顺性自然。刻意克己，反近于伪。","颜回曰：「君子成人之美。」"),t("li","evade","二者皆可，视其时。","颜回曰：「为仁由己，而由人乎哉？」")),l("天下归仁焉，其效何如？",t("yi","hit","为仁由己，非由人。己正则天下自归，不在求也。","颜回曰：「此夫子之教也。」"),t("li","reason","归仁者，须有政令驱之。","颜回曰：「天下归仁焉。」"),t("shi","evade","效之迟速，非人所能必。","颜回曰：「愿无伐善，无施劳。」"))],null,{success:"颜回曰：「君可与言仁矣。」",compromise:"颜回曰：「君之言，近是。」",fail:"颜回曰：「君犹未克己。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Pu={theme:"观乐与让国",intro:"吴公子季札聘于鲁，请观周乐。",debates:[f("v_jizha_yue","观乐","court","ming",!1,"季札","吴之公子","季札请观周乐。使工为之歌《周南》《召南》。曰：「美哉！始基之矣。」",[l("闻乐而知政，可有此事？",t("ming","hit","有。乐者，政之象也。政平则声和，政乱则声哀。","季札曰：「此吾之所以能观也。」"),t("li","reason","乐者声也，政者事也，二者无涉。","季札曰：「美哉！犹有憾。」"),t("yi","evade","乐之感人，直入其心，不必假政。","季札曰：「德至矣哉！」")),l("《郑》声之细，君以为何如？",t("ming","hit","美哉！其细已甚，民弗堪也。是其先亡乎！","季札曰：「此吾所以叹也。」"),t("li","reason","音细者，非大雅之音。当废之。","季札曰：「美哉！始基之矣。」"),t("yi","evade","音之粗细，各从其俗，何必疑？","季札曰：「其细已甚。」")),l("观止矣。若有他乐，吾不敢请已。何谓也？",t("ming","hit","乐之至者，无复有加。《韶》尽美矣，又尽善也。","季札曰：「观止矣。」"),t("yi","reason","尽善者，德之至也。乐不能独尽之。","季札曰：「德至矣哉！大矣。」"),t("shi","evade","乐之尽处，可言者尽于此。","季札曰：「若有他乐，吾不敢请已。」"))],z("鲁太师乐谱",1,"你呈上鲁太师乐谱：十五国风，次序井然。"),{success:"季札曰：「君可与观乐矣。」",compromise:"季札曰：「君之识，未尽乐之奥。」",fail:"季札曰：「君未知音。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jizha_rang","让国","court","yi",!0,"季札","吴之公子","吴子诸樊欲立季札，季札辞。诸樊卒，遗命授弟，欲以次致国于札。",[l("父兄之命，君何故不受？",t("yi","hit","札虽不才，愿附于子臧之义。礼有旧制，不可乱也。","季札曰：「此吾之所以去也。」"),t("li","reason","兄终弟及，先君之命也。辞之则乱吴。","季札曰：「君义嗣，谁敢干君？」"),t("ming","evade","受与不受，皆可。何必自苦？","季札曰：「吾愿弃其室而耕。」")),l("弃其室而耕，君不悔乎？",t("yi","hit","不悔。所守者义，非位也。","季札曰：「吾子勉之。」"),t("li","reason","弃位而耕，是弃吴也。","季札曰：「吾不受国，非轻吴也。」"),t("shi","evade","悔与不悔，皆在一时之心。","季札曰：「愿附于子臧之义。」")),l("吴终有阖闾之祸。君之让，可谓智乎？",t("yi","hit","祸在后世，非札之让所能致。若贪位则祸在今日。","季札曰：「吾非之所能及也。」"),t("li","reason","若受国，则无阖闾之乱。让者非智。","季札曰：「吾子勉之。」"),t("ming","evade","事之後来，非人所能料。","季札曰：「虽不能至，然心乡往之。」"))],z("延陵挂剑图",1,"你呈上延陵图：季札解剑挂于徐君墓树而已。"),{success:"季札曰：「君可与言义矣。」",compromise:"季札曰：「君之言，有可取。」",fail:"季札曰：「君之见，犹恋于位。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}}),f("v_jizha_jian","挂剑","diplomacy","yi",!1,"季札","吴之公子","季札使于徐。徐君好季札剑，口弗敢言。季札心知之，为使上国，未献。",[l("心许之而未言，可乎？",t("yi","hit","心许即诺。虽未言，吾心已许之矣。","季札曰：「此吾之所以挂剑也。」"),t("li","reason","未出口则不为诺。何必自缚？","季札曰：「始吾心已许之，岂以死倍吾心哉？」"),t("ming","evade","诺与不诺，在心不在言。","季札曰：「心许之矣。」")),l("徐君已死，君挂剑于墓。有此必要乎？",t("yi","hit","必要。所守者心，非为人也。","季札曰：「此吾之所以能自安也。」"),t("li","reason","死者无知，挂剑无益。徒为虚名。","季札曰：「不然。」"),t("shi","evade","为之则安，不必问其益。","季札曰：「吾心已许之。」")),l("小信若此，君不以为迂乎？",t("yi","hit","信之小者尚守之，则大者可知。此不迂也。","季札曰：「善哉！君知信矣。」"),t("li","reason","然。信之大者，在国不在剑。","季札曰：「岂以死倍吾心哉？」"),t("ming","evade","迂与不迂，人各有见。","季札曰：「吾心已许之矣。」"))],null,{success:"季札曰：「君可与言信矣。」",compromise:"季札曰：「君之言，半是。」",fail:"季札曰：「君未知心许之重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Hu={theme:"大义灭亲",intro:"卫石碏，纯臣也。恶州吁而厚与焉。大义灭亲，其是之谓乎！",debates:[f("v_shique_mieqin","大义灭亲","court","yi",!0,"石碏","卫之老臣","州吁弑桓公而立。石碏之子石厚助之。石碏使人诱二人至陈，请陈执之。",[l("子助乱臣，父当如何？",t("yi","hit","执而诛之。父子之情，不能蔽君臣之义。","石碏曰：「此吾之所以为之也。」"),t("li","reason","父子天性。当先责而后教，不可遽诛。","石碏曰：「吾何为不除害？」"),t("ming","evade","子之罪，子自受之。父不必与。","石碏曰：「石碏纯臣也。」")),l("大义灭亲，君以为仁乎？忍乎？",t("yi","hit","非忍也，义不得已。杀一子以安社稷，仁之至也。","石碏曰：「此君子所称也。」"),t("li","reason","终近于忍。虎毒不食子。","石碏曰：「吾不得已。」"),t("shi","evade","仁与忍，皆外人之评。","石碏曰：「大义灭亲，其是之谓乎。」")),l("若因子而废国法，天下将如何？",t("yi","hit","国法废则乱臣接踵。一人之私，不可乱一国之纪。","石碏曰：「善哉！此吾之志也。」"),t("li","reason","法有轻重。父子之亲，法所当宥。","石碏曰：「不可。」"),t("ming","evade","执法者自有其权，不必问天下。","石碏曰：「君子曰：石碏，纯臣也。」"))],z("陈国囚车图",1,"你呈上陈国囚车图：二人既执，石碏使家宰杀之。"),{success:"石碏曰：「君可与言义矣。」",compromise:"石碏曰：「君之言，有见。」",fail:"石碏曰：「君犹蔽于私。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shique_jian","谏宠","court","yi",!1,"石碏","卫之老臣","卫庄公娶于齐，曰庄姜，美而无子。又娶于陈，生桓公。公子州吁，嬖人之子也，有宠而好兵。",[l("宠子好兵，君以为可乎？",t("yi","hit","不可。夫宠而不骄，骄而能降，降而不憾，憾而能眕者，鲜矣。","石碏曰：「此吾所以谏也。」"),t("li","reason","爱子者，当顺其性。好兵者，或为将才。","石碏曰：「将立州吁，乃定之矣。」"),t("ming","evade","宠与不宠，在君之心。","石碏曰：「爱子，教之以义方，弗纳于邪。」")),l("「六逆」「六顺」，何谓也？",t("yi","hit","贱妨贵、少陵长、远间亲、新间旧、小加大、淫破义，此六逆也。君义、臣行、父慈、子孝、兄爱、弟敬，此六顺也。","石碏曰：「去顺效逆，所以速祸也。」"),t("li","reason","此皆旧礼，今日之势已异。","石碏曰：「君人者，将祸是务去。」"),t("shi","evade","名目虽多，行之在人。","石碏曰：「无乃不可乎？」")),l("君不听谏，君将如何？",t("yi","hit","告老而已。不去则祸及己身。","石碏曰：「吾将老矣。」"),t("li","reason","当守其位，徐图之。","石碏曰：「弗听。」"),t("ming","evade","去留有时，不必固执。","石碏曰：「其子厚与州吁游，禁之不可。」"))],null,{success:"石碏曰：「君可与言礼矣。」",compromise:"石碏曰：「君之言，亦有理。」",fail:"石碏曰：「君之说，近于宠。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_shique_chunchen","纯臣","court","yi",!1,"石碏","卫之老臣","君子曰：「石碏，纯臣也。恶州吁而厚与焉。」",[l("何谓纯臣？",t("yi","hit","国而忘家，公而忘私。不以亲害义，不以私害公。","石碏曰：「此吾之所守也。」"),t("li","reason","忠而不愚，方为纯臣。","石碏曰：「吾何为不除害？」"),t("ming","evade","纯臣之名，后世所加。当时岂暇计此？","石碏曰：「君子曰：石碏，纯臣也。」")),l("国而忘家，则家何以安？",t("yi","hit","国不安则家无所托。故先国而后家。","石碏曰：「善哉！此纯臣之志也。」"),t("li","reason","家为国之本。家不宁则国不治。","石碏曰：「不可。」"),t("shi","evade","国与家，各有其时。","石碏曰：「吾将老矣。」")),l("纯臣之祸，往往及身。君不惧乎？",t("yi","hit","义之所在，祸不足避。","石碏曰：「此吾之所以为纯臣也。」"),t("li","reason","避祸者，人之常情。纯臣亦当自保。","石碏曰：「吾何为不除害？」"),t("ming","evade","祸福有命，非所豫虑。","石碏曰：「大义灭亲，其是之谓乎。」"))],null,{success:"石碏曰：「君可与言臣道矣。」",compromise:"石碏曰：「君之言，得半。」",fail:"石碏曰：「君犹以私家为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Du={theme:"在德不在鼎",intro:"楚子伐陆浑之戎，遂至于雒，观兵于周疆。问鼎之大小轻重焉。",debates:[f("v_wangsunman_ding","在德不在鼎","diplomacy","yi",!0,"王孙满","周之大夫","楚庄王问鼎之大小轻重。王孙满对曰：「在德不在鼎。」",[l("鼎之大小轻重，可得闻乎？",t("yi","hit","在德不在鼎。昔夏之方有德也，远方图物，贡金九牧，铸鼎象物。","王孙满曰：「此吾所以对也。」"),t("li","reason","鼎者重器，其数当有定。明示之以服楚。","王孙满曰：「周德虽衰，天命未改。」"),t("shi","evade","此周室之器，非使者所当问。","王孙满曰：「鼎之轻重，未可问也。」")),l("周德既衰，鼎何以为重？",t("yi","hit","德之休明，虽小重也；其奸回昏乱，虽大轻也。","王孙满曰：「此鼎之所以为重也。」"),t("li","reason","德衰则鼎轻。不如早迁之楚。","王孙满曰：「成王定鼎于郏鄏，卜世三十，卜年七百。」"),t("ming","evade","轻重之数，非人所知。","王孙满曰：「天所命也。」")),l("楚子问鼎，君以何辞拒之而不怒？",t("yi","hit","举天命以拒之，不斥其僭。彼虽强，不敢逆天。","王孙满曰：「周德虽衰，天命未改。」"),t("li","reason","当以兵威拒之，辞不足恃。","王孙满曰：「在德不在鼎。」"),t("shi","evade","顺其意而徐图之。","王孙满曰：「鼎之轻重，未可问也。」"))],z("九鼎图",1,"你呈上九鼎图：鼎象百物，使民知神奸。"),{success:"王孙满曰：「君可与言天命矣。」",compromise:"王孙满曰：「君之言，有可取。」",fail:"王孙满曰：「君犹以力论也。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_wangsunman_tianming","天命","court","yi",!1,"王孙满","周之大夫","王孙满曰：「周德虽衰，天命未改。鼎之轻重，未可问也。」",[l("天命可改乎？",t("yi","hit","可改，然非人力所能强。德至则天命归，德衰则天命去。","王孙满曰：「此吾所谓在德也。」"),t("li","reason","力强者受天命。楚之强，天命在楚。","王孙满曰：「卜世三十，卜年七百，天所命也。」"),t("ming","evade","天命之事，不可知。","王孙满曰：「未可问也。」")),l("周室微弱，诸侯不朝。君何以自处？",t("yi","hit","守其礼，不坠其名。名存则天下犹有所归。","王孙满曰：「此周之所以久也。」"),t("li","reason","弱而守虚名，不如自强。","王孙满曰：「德之休明，虽小重也。」"),t("shi","evade","时势如此，聊以自安而已。","王孙满曰：「天命未改。」")),l("德与力，孰能久？",t("yi","hit","德久。力者一时，德者百世。","王孙满曰：「善哉！君可与言矣。」"),t("li","reason","力久。无德有力者，尚可以存。","王孙满曰：「其奸回昏乱，虽大轻也。」"),t("ming","evade","久暂有数，非所豫知。","王孙满曰：「鼎之轻重，未可问也。」"))],null,{success:"王孙满曰：「君可与言德矣。」",compromise:"王孙满曰：「君之言，半是。」",fail:"王孙满曰：「君犹重鼎而轻德。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_wangsunman_li","礼与名","court","yi",!1,"王孙满","周之大夫","或问：「周室衰微，何恃而不亡？」王孙满曰：「恃礼与名。」",[l("礼与名，可使国不亡乎？",t("yi","hit","名存则诸侯犹有所忌。礼在则上下犹有所守。","王孙满曰：「此周室所以久也。」"),t("li","reason","空名不能御兵。不如务实。","王孙满曰：「在德不在鼎。」"),t("ming","evade","存亡有数，非一礼所能持。","王孙满曰：「天命未改。」")),l("若诸侯皆弃礼，则将如何？",t("yi","hit","则天下大乱。然弃礼者先亡，守礼者后亡。","王孙满曰：「此吾之所惧也。」"),t("li","reason","则当以兵威正之。","王孙满曰：「鼎之轻重，未可问也。」"),t("shi","evade","天下大势，非人力可回。","王孙满曰：「其奸回昏乱，虽大轻也。」")),l("君之职，在守礼乎？在强国乎？",t("yi","hit","守礼。周之职在礼，不在强。强非其所长，礼乃其所有。","王孙满曰：「此吾之所以自处也。」"),t("li","reason","当先强国。无国则礼无所施。","王孙满曰：「周德虽衰，天命未改。」"),t("ming","evade","二者皆当兼行。","王孙满曰：「在德不在鼎。」"))],null,{success:"王孙满曰：「君可与守礼矣。」",compromise:"王孙满曰：「君之言，可采。」",fail:"王孙满曰：「君未知礼之重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Fu={theme:"礼与刑",intro:"叔向，晋之贤大夫。郑铸刑书，叔向使诒子产书。",debates:[f("v_shuxiang_xingshu","论刑书","court","yi",!0,"叔向","晋之大夫","郑铸刑书。叔向使诒子产书曰：「始吾有虞于子，今则已矣。」",[l("昔先王议事以制，不为刑辟。君以为如何？",t("yi","hit","惧民之有争心也。闲之以义，纠之以政，行之以礼，守之以信。","叔向曰：「此吾之所以非刑书也。」"),t("li","reason","议事以制，则吏得任意。不如明法。","叔向曰：「民知有辟，则不忌于上。」"),t("ming","evade","法与礼，皆所以治，不必偏废。","叔向曰：「国将亡，必多制。」")),l("民知争端矣，将弃礼而征于书。君惧乎？",t("yi","hit","惧。锥刀之末，将尽争之。乱狱滋丰，贿赂并行。","叔向曰：「此吾所谓忧也。」"),t("li","reason","争讼虽繁，曲直有定，胜于无书。","叔向曰：「肸闻之，国将亡，必多制。」"),t("shi","evade","讼之繁简，在吏之贤否。","叔向曰：「民知有辟，则不忌于上。」")),l("刑书既铸，君以为后世如何？",t("yi","hit","后世必有以法为争者。然乱不在法，在无礼以先之。","叔向曰：「此吾之所以忧也。」"),t("li","reason","后世有法可循，胜于无法。","叔向曰：「国将亡，必多制。」"),t("ming","evade","后世之事，非今所及。","叔向曰：「肸闻之，国将亡，必多制。」"))],z("叔向诒子产书",1,"你呈上叔向致子产书：「肸闻之，国将亡，必多制。」"),{success:"叔向曰：「君可与言礼矣。」",compromise:"叔向曰：「君之言，有可取。」",fail:"叔向曰：「君之说，助刑书之势也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shuxiang_pin","贫与德","court","yi",!1,"叔向","晋之大夫","叔向见韩宣子。宣子忧贫，叔向贺之。宣子曰：「吾有卿之名，而无其实。」",[l("贫可贺乎？",t("yi","hit","可贺。昔栾武子无一卒之田，其宫不备其宗器，而德建行直。","叔向曰：「此吾之所以贺也。」"),t("li","reason","贫何可贺？富而后能施德。","叔向曰：「今吾子有栾武子之贫，吾以为能其德矣。」"),t("ming","evade","贫富皆外物，不必贺亦不必忧。","叔向曰：「若不忧德之不建，而患货之不足。」")),l("忧德与忧贫，孰为要？",t("yi","hit","忧德。德不建而货足，祸必及之。","叔向曰：「将吊不暇，何贺之有？」"),t("li","reason","忧贫。无财则无以立德。","叔向曰：「贺其贫也。」"),t("shi","evade","二者俱忧，方可无失。","叔向曰：「若不忧德之不建。」")),l("今有卿而贫，君贺之乎？吊之乎？",t("yi","hit","贺之。贫而能德，胜于富而无德。","叔向曰：「贺其贫也。」"),t("li","reason","吊之。卿而贫，是国之失政。","叔向曰：「若不忧德之不建。」"),t("ming","evade","贺吊皆虚文，不必较。","叔向曰：「将吊不暇，何贺之有？」"))],null,{success:"叔向曰：「君可与言德矣。」",compromise:"叔向曰：「君之言，半是。」",fail:"叔向曰：「君犹患货之不足。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Bu={theme:"赏刑之度",intro:"申叔时，楚之贤大夫。",debates:[f("v_shenshushi_shang","赏不僭而刑不滥","court","yi",!0,"申叔时","楚之大夫","申叔时曰：「善为国者，赏不僭而刑不滥。」",[l("赏僭与刑滥，孰为害大？",t("yi","hit","赏僭则惧及淫人，刑滥则惧及善人。若不幸而过，宁僭无滥。","申叔时曰：「此吾所以言也。」"),t("li","reason","赏滥则人侥幸，刑轻则人无畏。二害相等。","申叔时曰：「与其失善，宁其利淫。」"),t("ming","evade","赏刑之度，各有其宜。","申叔时曰：「赏不僭而刑不滥。」")),l("宁僭无滥，无乃纵恶乎？",t("yi","hit","非纵恶也。与其杀不辜，宁失不经。此古之训也。","申叔时曰：「善哉！君知刑之本矣。」"),t("li","reason","纵恶则奸无所畏，乱之始也。","申叔时曰：「刑滥则惧及善人。」"),t("shi","evade","过与不及，皆失。宜持平。","申叔时曰：「赏不僭而刑不滥。」")),l("赏刑之柄，当操于谁？",t("yi","hit","操于君，而不可假于臣。假之则赏刑皆私。","申叔时曰：「此治国之要也。」"),t("li","reason","操于有司。君总其成而已。","申叔时曰：「赏不僭而刑不滥。」"),t("ming","evade","操于谁皆可，唯得其人。","申叔时曰：「善为国者。」"))],null,{success:"申叔时曰：「君可与言刑矣。」",compromise:"申叔时曰：「君之言，可采。」",fail:"申叔时曰：「君之说，失其本。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenshushi_chen","谏陈","diplomacy","yi",!1,"申叔时","楚之大夫","楚子入陈，杀夏徵舒，因县陈。申叔时使于齐，反，复命而退。",[l("讨贼而县其国，可乎？",t("yi","hit","不可。夏徵舒弑其君，讨之，义也；县陈，贪也。以义始而以贪终，非霸者之举。","申叔时曰：「此吾之所以不进也。」"),t("li","reason","陈既破，取之为县，可强国。","申叔时曰：「牵牛以蹊人之田，而夺之牛。」"),t("ming","evade","既已取之，何必多言？","申叔时曰：「诸侯之从者，曰讨有罪也。」")),l("「蹊田夺牛」之喻，君以为然乎？",t("yi","hit","然。牵牛蹊田者，信有罪矣；夺其牛，罚已重矣。","申叔时曰：「诸侯之从者，曰讨有罪也。」"),t("li","reason","譬喻不足以断事。罪当视其轻重。","申叔时曰：「此吾之所以喻也。」"),t("shi","evade","譬喻之词，听其意可也。","申叔时曰：「今县陈，贪其富也。」")),l("既县陈而复封之，君以为何如？",t("yi","hit","复封之，则义全。讨其罪而不利其地，诸侯自服。","申叔时曰：「此吾之所以言也。」"),t("li","reason","既已得之，复弃之，非计。","申叔时曰：「诸侯之从者，曰讨有罪也。」"),t("shi","evade","封与不封，皆楚之利。","申叔时曰：「今县陈，贪其富也。」"))],null,{success:"申叔时曰：「君可与言义矣。」",compromise:"申叔时曰：「君之言，可采。」",fail:"申叔时曰：「君犹贪其利。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}})]},Gu={theme:"直道事人",intro:"柳下惠为士师，三黜。人曰：「子未可以去乎？」曰：「直道而事人，焉往而不三黜？」",debates:[f("v_liuxiahui_sanchu","三黜不去","court","yi",!1,"展获","鲁之士师","柳下惠为士师，三黜。人曰：「子未可以去乎？」",[l("三黜而不去，何也？",t("yi","hit","直道而事人，焉往而不三黜？枉道而事人，何必去父母之邦？","展获曰：「此吾之所以不去也。」"),t("li","reason","三黜则知其不容，当去以求用。","展获曰：「枉道而事人，何必去父母之邦？」"),t("ming","evade","去留皆可，何必执着？","展获曰：「直道而事人，焉往而不三黜？」")),l("直道而屡黜，与枉道而显达，君取何者？",t("yi","hit","取直道。枉道而达，非达也。","展获曰：「此吾所守也。」"),t("li","reason","达而后可以行志。枉一时以伸百世。","展获曰：「枉道而事人，何必去父母之邦？」"),t("shi","evade","直与枉，视其时。","展获曰：「直道而事人。」")),l("父母之邦不可去，然君不见用。君将终老于此乎？",t("yi","hit","终老于此。道在我，用不用在人。","展获曰：「此吾之所以不去也。」"),t("li","reason","当去他国求用。道行而后可以言守。","展获曰：「枉道而事人，何必去父母之邦？」"),t("ming","evade","去留皆可，视其时而定。","展获曰：「直道而事人。」"))],null,{success:"展获曰：「君可与言直矣。」",compromise:"展获曰：「君之言，有可取。」",fail:"展获曰：「君之说，枉道之属也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_liuxiahui_zuohuai","坐怀不乱","court","yi",!1,"展获","鲁之士师","柳下惠夜宿郭门，有女子来同宿，恐其冻死，坐之于怀，至晓不为乱。",[l("坐怀而不乱，君信之乎？",t("yi","hit","信之。心正者，虽处嫌疑之地而不失其守。","展获曰：「此吾之所为也。」"),t("li","reason","人情所难。此说近于夸。","展获曰：「吾岂以是自异哉？」"),t("ming","evade","信与不信，在人而已。","展获曰：「尔为尔，我为我。」")),l("处嫌疑之地，当避之乎？",t("yi","hit","当避则避，不可避则守其心。避与守，皆所以全德。","展获曰：「善哉！君知守身矣。」"),t("li","reason","当避之。君子不处嫌疑。","展获曰：「虽袒裼裸裎于我侧，尔焉能浼我哉？」"),t("shi","evade","嫌疑之迹，不必尽避。","展获曰：「尔为尔，我为我。」")),l("君子之守，当为人所见乎？抑在人所不见？",t("yi","hit","在人所不见。见而守之，未必真守。","展获曰：「此吾之所以能也。」"),t("li","reason","当为人所见。使人知有守，则风俗自正。","展获曰：「尔为尔，我为我。」"),t("ming","evade","见与不见，皆外也。","展获曰：「虽袒裼裸裎于我侧，尔焉能浼我哉？」"))],null,{success:"展获曰：「君可与言守矣。」",compromise:"展获曰：「君之言，半得。」",fail:"展获曰：「君犹重迹而轻心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Yu={theme:"以乐谏君",intro:"师旷，晋之乐师，目盲而善听。",debates:[f("v_shikuang_yin","以乐谏","court","ming",!1,"师旷","晋之乐师","晋平公铸大钟，使工听之，皆以为调。师旷曰：「不调。」",[l("众工皆以为调，君独曰不调，何也？",t("ming","hit","钟声不和于心。心不和则声不和，臣以耳听之。","师旷曰：「此臣之所以能听也。」"),t("li","reason","众工之听，精于一人。当从众。","师旷曰：「後世有知音者，将知钟之不调也。」"),t("yi","evade","调与不调，皆细事，何必争？","师旷曰：「臣窃为君耻之。」")),l("乐之调否，何关于政？",t("ming","hit","大有关。乐者政之象。钟不调则政不和。","师旷曰：「此吾之所以谏也。」"),t("li","reason","乐者娱耳，政者治民，二者无涉。","师旷曰：「夫乐，以开山川之风也。」"),t("shi","evade","调否自有工师，君不必问。","师旷曰：「不调。」")),l("君有过，乐师当以何谏？",t("ming","hit","托于声。声不和则君自知，不待言也。","师旷曰：「此吾之所以托于乐也。」"),t("yi","reason","当直言。托于声则近于戏。","师旷曰：「臣非不直也，直而无益。」"),t("li","reason","当择其可谏者谏之，不必尽言。","师旷曰：「不调。」"))],null,{success:"师旷曰：「君可与言乐矣。」",compromise:"师旷曰：「君之言，可采。」",fail:"师旷曰：「君未知音。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shikuang_guang","盲而听政","court","ming",!1,"师旷","晋之乐师","师旷目盲，而晋国之政，多所匡正。或问：「盲者何以知政？」",[l("目盲而能知政，其道何在？",t("ming","hit","目盲则耳聪，耳聪则听其言而察其心。言之诚伪，无不见。","师旷曰：「此吾之所以能也。」"),t("li","reason","目者见事，耳者听言。舍目而恃耳，未尽也。","师旷曰：「臣非瞽也，盲于目耳。」"),t("yi","evade","知政在德，不在耳目。","师旷曰：「国有大政，臣与闻焉。」")),l("君有过，当直谏乎？抑或婉讽？",t("yi","hit","直谏则君怒，婉讽则君悟。吾取婉讽。","师旷曰：「此吾之所以托于乐也。」"),t("li","reason","当直谏。婉讽则言不达。","师旷曰：「臣非不直也，直而无益。」"),t("ming","evade","二者皆谏，视君之性。","师旷曰：「君之声不和。」")),l("盲者听政，其弊安在？",t("ming","hit","弊在偏听。故必兼听众，不以一耳为断。","师旷曰：「此吾之所以慎也。」"),t("li","reason","弊在不见其事，徒听其言。","师旷曰：「臣非瞽也，盲于目耳。」"),t("yi","evade","弊在自信太过。","师旷曰：「国有大政，臣与闻焉。」"))],null,{success:"师旷曰：「君可与言谏矣。」",compromise:"师旷曰：「君之言，得半。」",fail:"师旷曰：「君未达谏之难。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Uu={theme:"疾与政",intro:"医和视晋平公疾，曰：「疾不可为也，是谓近女室，疾如蛊。」",debates:[f("v_yihe_gu","疾如蛊","court","yi",!0,"医和","秦之良医","晋平公疾。医和视之，曰：「疾不可为也。是谓近女室，疾如蛊，非鬼非食，惑以丧志。」",[l("非鬼非食，惑以丧志。君以为何疾？",t("yi","hit","是贪欲之疾。惑其志而无节，非药石所能攻。","医和曰：「此吾所谓蛊也。」"),t("li","reason","鬼与食皆有其因。当先辨其所由。","医和曰：「非鬼非食。」"),t("ming","evade","疾之成，皆由数，何必深究？","医和曰：「良臣将死，天命不佑。」")),l("有良臣而不任用，其疾为何？",t("yi","hit","此亦蛊也。惑于私而不悟，虽有良臣，不能用。","医和曰：「此吾所以言良臣也。」"),t("li","reason","疾在身，不在政。二者不可混。","医和曰：「不穀之疾，虽以蛊名之，然其本在惑。」"),t("shi","evade","医者视疾，不必论政。","医和曰：「疾如蛊。」")),l("疾在骨髓，虽良医何为？",t("yi","hit","医者治未病。既入骨髓，则非医之罪，乃主之过。","医和曰：「此吾所以言疾不可为也。」"),t("li","reason","当尽力施治。医者不可先言不治。","医和曰：「疾不可为也。」"),t("ming","evade","生死有命，医者听之。","医和曰：「非鬼非食，惑以丧志。」"))],z("晋平公脉案",1,"你呈上脉案：六脉俱虚，而肝脉独盛。"),{success:"医和曰：「君可与言医道矣。」",compromise:"医和曰：「君之言，有可取。」",fail:"医和曰：「君未见其本。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yihe_yi","医与政","court","yi",!1,"医和","秦之良医","医和曰：「上医医国，其次疾人。固医官也。」",[l("上医医国，其说如何？",t("yi","hit","国之有政，如身之血脉。血脉壅则病，政令壅则乱。","医和曰：「此吾所谓医国也。」"),t("li","reason","医者医身，政者治国。术不同，不可混。","医和曰：「医官之职，不唯疾人。」"),t("ming","evade","医国之名，近于夸。","医和曰：「上医医国。」")),l("六气之淫，可为疾。政之淫，何以治之？",t("yi","hit","节之。阴淫寒疾，阳淫热疾，风淫末疾。政之淫亦然，以礼节之。","医和曰：「善哉！君知节矣。」"),t("li","reason","政之淫则以法理之，不必比之六气。","医和曰：「阴阳风雨晦明，其过则为菑。」"),t("shi","evade","政之得失，非医师所能知。","医和曰：「天有六气，降生五味。」")),l("医国与医人，其术可通乎？",t("yi","hit","可通。皆在察其本而调其偏。","医和曰：「上医医国，其次疾人，固医官也。」"),t("li","reason","不可通。国与身，理不同。","医和曰：「医官之职，不唯疾人。」"),t("ming","evade","名同理异，不必强合。","医和曰：「天有六气，降生五味。」"))],null,{success:"医和曰：「君可与言医国矣。」",compromise:"医和曰：「君之言，可采。」",fail:"医和曰：「君犹分医与政为二。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Vu={theme:"巧与义",intro:"公输般为楚造云梯之械，将以攻宋。",debates:[f("v_gongshu_yunti","云梯","military","shi",!0,"公输般","鲁之巧匠","公输般为楚造云梯之械成，将以攻宋。墨子闻之，见公输般。",[l("造器以攻人国，君以为义乎？",t("shi","hit","匠人之职在成器，不在用器。器之用于义，则在君。","公输般曰：「吾固不欲攻宋。」"),t("yi","reason","器既成而用于攻，则匠者与有责焉。","公输般曰：「不可，吾既已言之王矣。」"),t("li","reason","受人之禄，忠人之事。不必问义。","公输般曰：「诺。」")),l("君之巧，可为舟车以利民，何必为攻具？",t("yi","hit","巧者无善恶，其用有善恶。君能移其巧于民，则功在百世。","公输般曰：「此吾之所未思也。」"),t("shi","reason","攻具亦国之所需。非专为攻人也。","公输般曰：「不可，吾既已言之王矣。」"),t("ming","evade","巧之所在，随人而施。","公输般曰：「诺。」")),l("九攻九距，君之械尽。今将如何？",t("shi","hit","械尽而攻城不下，则当止。器不能胜备，攻徒伤众。","公输般曰：「吾知所以距子矣。」"),t("li","reason","当再思新械，必破其城。","公输般曰：「不可。」"),t("yi","evade","战之成败，非匠者所主。","公输般曰：「诺。」"))],z("云梯图",1,"你呈上云梯图：钩援临冲，九攻之具。"),{success:"公输般曰：「君可与言巧矣。」",compromise:"公输般曰：「君之言，有可取。」",fail:"公输般曰：「君之说，非匠者之职。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_gongshu_qiao","巧之极","court","shi",!1,"公输般","鲁之巧匠","公输般削竹木以为鹊，成而飞之，三日不下。",[l("木鹊飞三日，可谓巧乎？",t("shi","hit","可以为巧，未可以为功。不如为车輗，可以任重致远。","公输般曰：「此墨翟之言也。」"),t("ming","reason","巧至此，人不能及。何论功？","公输般曰：「巧者，吾之所长也。」"),t("li","reason","无用之巧，费日耗财。","公输般曰：「不然。」")),l("巧匠与圣人，孰重？",t("yi","hit","巧匠成器，圣人成俗。器可以利一时，俗可以化百世。","公输般曰：「此吾之所未及。」"),t("shi","reason","巧匠之功可见，圣人之功难征。匠为重。","公输般曰：「巧固吾之长也。」"),t("ming","evade","二者各有所长，不必相较。","公输般曰：「吾之巧，岂虚也哉？」")),l("巧而有用，与巧而无用，孰取？",t("shi","hit","取有用。巧而无用，虽奇何益？","公输般曰：「此墨翟之言也。」"),t("ming","reason","取无用以见巧。巧之为巧，正在其无用。","公输般曰：「巧者，吾之所长也。」"),t("li","reason","二者皆取。有用者以养民，无用者以见道。","公输般曰：「不然。」"))],null,{success:"公输般曰：「君可与言巧矣。」",compromise:"公输般曰：「君之言，半是。」",fail:"公输般曰：「君未知巧之难。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ku={theme:"优谏",intro:"优孟，故楚之乐人也。长八尺，多辩，常以谈笑讽谏。",debates:[f("v_youmeng_yiguan","衣冠谏王","court","ming",!1,"优孟","楚之优人","楚相孙叔敖死，其子穷困。优孟着孙叔敖衣冠，抵掌谈语，岁余，像孙叔敖。",[l("以优人之身，效相国之仪，不惧乎？",t("ming","hit","优者，言之无罪，闻之者足以戒。此吾之所以敢也。","优孟曰：「此吾之所以为优也。」"),t("li","reason","僭拟大臣，罪当死。","优孟曰：「臣请以臣之身，效孙叔敖。」"),t("yi","evade","戏耳，何罪之有？","优孟曰：「楚相不足为也。」")),l("孙叔敖为相尽忠，而其后穷困。君以为何如？",t("ming","hit","相国廉洁，故家贫。此正可为王言之。","优孟曰：「楚相不足为也！」"),t("yi","reason","忠臣之后当有恤。此国之义也。","优孟曰：「其子穷困负薪。」"),t("li","evade","身后之事，非相国所虑。","优孟曰：「马者畜也，何与人同礼？」")),l("优人之言，何以能入？",t("ming","hit","以其戏也。戏则言之无罪，闻者足以戒。","优孟曰：「此吾之所以为优也。」"),t("yi","reason","以其忠也。忠则言虽戏而意正。","优孟曰：「楚相不足为也。」"),t("li","reason","以君之乐也。乘其乐而言，易入。","优孟曰：「臣请以人君礼葬之。」"))],null,{success:"优孟曰：「君可与言讽矣。」",compromise:"优孟曰：「君之言，可采。」",fail:"优孟曰：「君未达讽谏之妙。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youmeng_xiao","谈笑讽谏","court","ming",!1,"优孟","楚之优人","楚庄王有爱马，衣以文绣，置之华屋，以枣脯养之。马病肥死，欲以棺椁大夫礼葬之。",[l("葬马以大夫之礼，可乎？",t("ming","hit","不可。请以人君礼葬之，使诸侯闻之，皆知大王贱人而贵马。","优孟曰：「此吾之所以谏也。」"),t("yi","reason","王之所爱，厚葬之，亦人情。","优孟曰：「以大夫礼葬之，薄。」"),t("li","reason","马者畜也，不可与人同礼。","优孟曰：「请以人君礼葬之。」")),l("直谏与讽谏，孰善？",t("ming","hit","讽善于直。直则君怒而事不济，讽则君笑而事自改。","优孟曰：「此吾之所以为优也。」"),t("yi","reason","直谏为忠。讽则近于戏，非人臣正道。","优孟曰：「臣请以人君礼葬之。」"),t("shi","evade","视君之性而择之。","优孟曰：「王曰：寡人之过，一至此乎！」")),l("人主之过，其始皆微。何以及于大？",t("ming","hit","以其无人敢言也。言路既塞，一言之过遂成国之祸。","优孟曰：「此吾之所以谏也。」"),t("li","reason","以其渐也。渐则不觉，久而不可返。","优孟曰：「请以人君礼葬之。」"),t("yi","evade","过之大小，皆其自取。","优孟曰：「王曰：寡人之过，一至此乎！」"))],null,{success:"优孟曰：「君可与言谏矣。」",compromise:"优孟曰：「君之言，半是。」",fail:"优孟曰：「君犹重直而轻讽。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Qu={theme:"知音",intro:"伯牙鼓琴，钟子期听之。志在高山，志在流水。",debates:[f("v_boya_zhixin","高山流水","court","ming",!1,"伯牙","善琴者","伯牙鼓琴，志在高山。钟子期曰：「善哉，峨峨兮若泰山！」",[l("琴声何以及于高山流水？",t("ming","hit","声者，心之迹也。心在高山，则声自巍峨。","伯牙曰：「此吾之所以鼓也。」"),t("li","reason","声者物理，山者形势，二者不相关。","伯牙曰：「善哉，洋洋兮若江河！」"),t("yi","evade","心有所寄，则声有所示。","
