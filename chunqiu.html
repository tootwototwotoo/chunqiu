。」")),r("越王赐剑，曰「子教寡人伐吴七术」，君当如何答？",t("li","hit","无言可答。术出于我，而用在于君。君以此罪我，无理而足以杀我。","文种曰：「此吾之所以自尽也。」"),t("yi","reason","当谢罪。君虽不仁，臣不可不敬。","文种曰：「寡君赐剑。」"),t("shi","evade","死生有命，何必辩？","文种曰：「吾不用蠡之言，遂自杀。」"))],null,{success:"文种曰：「君可与言进退矣。」",compromise:"文种曰：「君之言，可采。」",fail:"文种曰：「君犹恋于功。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_wenzhong_zhi","治越","domestic","li",!1,"文种","越之大夫","越败于会稽，文种治其国，十年生聚，十年教训。",[r("十年生聚，十年教训。其序可易乎？",t("li","hit","不可易。民不足则无以教，教不先则无以战。","文种曰：「此吾之次第也。」"),t("yi","reason","当先教训。民知义则自奋，不待生聚。","文种曰：「十年生聚，十年教训。」"),t("shi","evade","二者并行，不必分先后。","文种曰：「此吾之所以治越也。」")),r("民之可用，在富乎？在教乎？",t("li","hit","在富而后教。腹不饱者不知义。","文种曰：「此吾之政也。」"),t("yi","reason","在教。教行则虽贫可用。","文种曰：「十年教训。」"),t("ming","evade","二者兼行，方能致用。","文种曰：「民可用矣。」")),r("越之复，君与范蠡孰功多？",t("li","hit","蠡长于谋，种长于治。谋可以取胜，治可以持久。","文种曰：「此吾与蠡之分也。」"),t("yi","reason","蠡功多。谋定而后动，无蠡则无越。","文种曰：「臣有七术。」"),t("shi","evade","功之多寡，非所计也。","文种曰：「此吾之所以治越也。」"))],null,{success:"文种曰：「君可与言治矣。」",compromise:"文种曰：「君之言，半得。」",fail:"文种曰：「君之说，未及于序。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},fu={theme:"五羖大夫",intro:"百里奚，虞人也。秦穆公以五羖羊皮赎之。",debates:[f("v_bailixi_wuyang","五羖之赎","court","yi",!0,"百里奚","秦之大夫","秦穆公以五羖羊皮赎百里奚，授之国政。",[r("以五羖赎贤者，君不以为辱乎？",t("yi","hit","不辱。彼以皮赎我，我以国报之。贱其身者，贵其道也。","百里奚曰：「此吾之所以留也。」"),t("li","reason","当辞。以贱价相赎，是轻吾也。","百里奚曰：「五羖大夫。」"),t("ming","evade","身之贵贱，不在其价。","百里奚曰：「以五羖羊皮赎之。」")),r("虞亡而君在秦，是何故？",t("yi","hit","虞君不用吾言，故亡。吾不死者，为有待也。","百里奚曰：「虞君不用吾言。」"),t("li","reason","当死虞难。既食其禄，不可弃其君。","百里奚曰：「吾得脱，而事秦。」"),t("shi","evade","去留皆有其时。","百里奚曰：「臣之事秦，为秦谋耳。」")),r("年七十而始用，君不以为晚乎？",t("yi","hit","不晚。用之得其道，一日足矣。","百里奚曰：「此吾之所以报也。」"),t("li","reason","晚矣。齿已衰，何能为？","百里奚曰：「年已七十矣。」"),t("ming","evade","早晚有天，非人所能择。","百里奚曰：「谋无不当，举必有功。」"))],k("五羖羊皮图",1,"你呈上五羖羊皮图：秦人以贱价赎贤，而授之以政。"),{success:"百里奚曰：「君可与言士矣。」",compromise:"百里奚曰：「君之言，可采。」",fail:"百里奚曰：「君之说，重价而轻道。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_bailixi_baqin","霸西戎","diplomacy","yi",!1,"百里奚","秦之大夫","秦穆公问：「秦国何以霸？」百里奚曰：「善用人之长，不以其短。」",[r("用人当取其长，抑或求其全？",t("yi","hit","取长。人无完人。求其全，则天下无可用之人。","百里奚曰：「此吾之所以相秦也。」"),t("li","reason","当求其全。一德之亏，或败大事。","百里奚曰：「善用人之长。」"),t("ming","evade","长短各有所宜，视其位。","百里奚曰：「不以其短。」")),r("西戎之地，可得而有乎？",t("yi","hit","不必有之。得其心则地为用，徒有其地则耗内。","百里奚曰：「此吾所谓霸也。」"),t("shi","reason","当尽取之。地广则国强。","百里奚曰：「秦国霸西戎。」"),t("li","evade","取与不取，视其力。","百里奚曰：「善用人之长。」")),r("秦之处西，中国以夷狄视之。君何以处？",t("yi","hit","以礼自处，则以中国自居；以力自处，则人亦以夷狄视之。","百里奚曰：「此吾之所以教秦也。」"),t("shi","reason","当以力取中国之地，然后可言礼。","百里奚曰：「秦霸西戎。」"),t("li","evade","夷狄之目，于人何损？","百里奚曰：「不以其短。」"))],null,{success:"百里奚曰：「君可与言相矣。」",compromise:"百里奚曰：「君之言，有见。」",fail:"百里奚曰：「君之说，未及用人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_bailixi_ming","知人之明","court","yi",!1,"百里奚","秦之大夫","百里奚荐蹇叔，曰：「臣不及蹇叔，君请用之。」",[r("荐贤而自谓不及，君以为智乎？",t("yi","hit","智。知其不及而荐之，则国得其用，己亦不失其名。","百里奚曰：「此吾之所以荐也。」"),t("li","reason","不智。荐胜己者，则己之位危。","百里奚曰：「臣不及蹇叔。」"),t("ming","evade","荐不荐，皆有其分。","百里奚曰：「君请用之。」")),r("蹇叔既至，君以何者为政？",t("yi","hit","听之而已。既知其贤，则不疑其言。","百里奚曰：「此吾之所以相秦也。」"),t("li","reason","当分其权。一人专任，非国之福。","百里奚曰：「臣不及蹇叔。」"),t("shi","evade","政之得失，视其时。","百里奚曰：「君请用之。」")),r("殽之败，二子皆言不可。君以何责？",t("yi","hit","无可责。言而不用，非言之罪。","百里奚曰：「臣之言不用。」"),t("li","reason","当责其不能强谏。","百里奚曰：「吾不以一眚掩大德。」"),t("ming","evade","成败有数，非人所能尽。","百里奚曰：「此吾之所以谏也。」"))],null,{success:"百里奚曰：「君可与言知人矣。」",compromise:"百里奚曰：「君之言，半是。」",fail:"百里奚曰：「君犹忌胜己者。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},gu={theme:"知不可为",intro:"蹇叔贤而世莫知。百里奚荐之，秦穆公迎以为上大夫。",debates:[f("v_jianshu_yao","殽之谏","military","yi",!0,"蹇叔","秦之大夫","秦穆公兴师袭郑。蹇叔曰：「劳师以袭远，非所闻也。」",[r("劳师袭远，君以为不可乎？",t("yi","hit","不可。师劳力竭，远主备之。师之所为，郑必知之。","蹇叔曰：「此吾之所以谏也。」"),t("shi","reason","可。出其不意，正所以取胜。","蹇叔曰：「吾见师之出而不见其入也。」"),t("li","evade","行与不行，视其势。","蹇叔曰：「劳师以袭远，非所闻也。」")),r("君哭师，曰「吾见师之出而不见其入也」。何敢言此？",t("yi","hit","知其必败，故哭之。哭者，非诅也，痛之也。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","出师而哭，沮军心。当缄其口。","蹇叔曰：「吾见师之出而不见其入也。」"),t("ming","evade","成败未可知，何必先哭？","蹇叔曰：「吾见师之出而不见其入也。」")),r("既知其败，君何不固谏？",t("yi","hit","谏之不听，则尽吾言而已。君之志不可夺，非吾力所及。","蹇叔曰：「此吾之所以退也。」"),t("shi","reason","当固谏。以死争之，庶几可回。","蹇叔曰：「吾不能回君之志。」"),t("li","evade","谏而不用，则去可也。","蹇叔曰：「劳师以袭远，非所闻也。」"))],k("殽山地形图",1,"你呈上殽山地形图：两山之间，车不得方轨。"),{success:"蹇叔曰：「君可与言兵矣。」",compromise:"蹇叔曰：「君之言，可采。」",fail:"蹇叔曰：「君之说，与吾同忧。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jianshu_zhi","知与不知","court","yi",!1,"蹇叔","秦之大夫","或问：「子何以知殽之必败？」蹇叔曰：「以理推之。」",[r("以理推事，可尽知乎？",t("yi","hit","不能尽知，然可知其大者。理之所至，势不能违。","蹇叔曰：「此吾之所以能言也。」"),t("li","reason","理者虚也。事有万变，非理所能尽。","蹇叔曰：「劳师以袭远，非所闻也。」"),t("ming","evade","知与不知，皆有其分。","蹇叔曰：「吾见师之出而不见其入也。」")),r("既知而不能救，知之何益？",t("yi","hit","知之则可以备。虽不能救此役，可以戒后来。","蹇叔曰：「此吾之所谓知也。」"),t("li","reason","知而不能救，不如不知。","蹇叔曰：「吾见师之出而不见其入也。」"),t("shi","evade","益与不益，非所计。","蹇叔曰：「以理推之。」")),r("世莫知君，而百里奚荐之。君以为何如？",t("yi","hit","士之遇不遇，系于知己。奚知我，故我为之用。","蹇叔曰：「此吾之所以事秦也。」"),t("li","reason","既世莫知，则当自显其才，不必待人荐。","蹇叔曰：「蹇叔贤而世莫知。」"),t("ming","evade","知与不知，皆外也。","蹇叔曰：「百里奚荐之。」"))],null,{success:"蹇叔曰：「君可与言理矣。」",compromise:"蹇叔曰：「君之言，半得。」",fail:"蹇叔曰：「君犹以知为无用。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_jianshu_zi","哭子","court","yi",!1,"蹇叔","秦之大夫","殽之役，蹇叔之子与师。蹇叔哭之曰：「晋人御师必于殽。」",[r("知子必死而使之行，君以为忍乎？",t("yi","hit","非忍也。君命不可违，吾不能以私废公。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","忍矣。既知其死，当留之。","蹇叔曰：「吾见师之出而不见其入也。」"),t("shi","evade","去留之权，不在父而在君。","蹇叔曰：「吾见师之出而不见其入也。」")),r("父子之情与君臣之义，孰先？",t("yi","hit","在朝则先君，在家则先父。其位不同，其守亦异。","蹇叔曰：「善哉！君知分矣。」"),t("shi","reason","父子天性，当先父。","蹇叔曰：「吾不能以私废公。」"),t("li","reason","君臣之义，关乎国。当先君。","蹇叔曰：「君命不可违。」")),r("子既死于殽，君后悔乎？",t("yi","hit","不悔。吾所言者，非为吾子，为秦师也。","蹇叔曰：「此吾之所以哭也。」"),t("li","reason","悔。若留其子，则可免一死。","蹇叔曰：「吾见师之出而不见其入也。」"),t("ming","evade","悔与不悔，皆无及矣。","蹇叔曰：「晋人御师必于殽。」"))],null,{success:"蹇叔曰：「君可与言分矣。」",compromise:"蹇叔曰：「君之言，可采。」",fail:"蹇叔曰：「君未明公私之分。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Un={zi_lu:uu,zeng_shen:mu,shen_bao_xu:du,wen_zhong:hu,bai_li_xi:fu,jian_shu:gu}});var pu,yu,vu,bu,_u,xu,wu,ku,zu,qu,Qn,Wn=O(()=>{Ae();pu={theme:"尊王攘夷",intro:"寡人欲伯诸侯，奈何？",debates:[f("v_qihuan_bo","何以称霸","diplomacy","yi",!0,"齐桓公","齐国国君","齐桓公问管仲：「寡人欲伯诸侯，奈何？」",[r("欲伯诸侯，当自何始？",t("yi","hit","尊王攘夷。名正而后诸侯从，不待兵也。","桓公曰：「善。」遂用管仲之谋。"),t("li","reason","先强其兵。兵强则诸侯自服。","桓公曰：「寡人欲伯诸侯，奈何？」"),t("shi","evade","当结盟以聚众。众聚则势成。","桓公曰：「诸侯皆叛，寡人独守。」")),r("周室衰微，君尊之有何益？",t("yi","hit","周之名犹在。假其名以令诸侯，则不争而自服。","桓公曰：「此吾之所以伯也。」"),t("li","reason","尊虚名而无实利，不如自取之。","桓公曰：「寡人欲伯诸侯。」"),t("ming","evade","名与实，不必较。","桓公曰：「寡人赖先君之灵。」")),r("北杏之会，诸侯有叛者。君何以处之？",t("yi","hit","以礼责之，不以兵加。责之而服，则霸业成。","桓公曰：「此吾之所以会诸侯也。」"),t("shi","reason","当讨之。讨不服则众惧。","桓公曰：「余姑翦灭此而朝食。」"),t("li","evade","叛者自叛，听其去留。","桓公曰：「诸侯皆叛，寡人独守。」"))],k("葵丘盟书",1,"你呈上葵丘盟书：「凡我同盟之人，既盟之后，言归于好。」"),{success:"桓公曰：「君可与言伯矣。」",compromise:"桓公曰：「君之言，有可取。」",fail:"桓公曰：「君之说，非伯者之道。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_qihuan_guan","用管仲","court","yi",!0,"齐桓公","齐国国君","鲍叔牙荐管仲。桓公曰：「管仲射寡人中钩，殆于死。」",[r("射钩之仇，君忘之乎？",t("yi","hit","忘之。彼时各为其主，今日各为其国。","桓公曰：「此吾之所以用管仲也。」"),t("li","reason","不可忘。射君者不可用。","桓公曰：「管仲射寡人中钩。」"),t("shi","evade","用与不用，视其才，不视其仇。","桓公曰：「寡人欲伯诸侯，奈何？」")),r("用仇人为相，何以服众？",t("yi","hit","以功服之。功成则众自服，不待辩也。","桓公曰：「善。」遂相管仲。"),t("li","reason","当先正其罪，然后论其才。","桓公曰：「管仲射寡人中钩。」"),t("ming","evade","众之服否，非一日可致。","桓公曰：「寡人赖先君之灵。」")),r("管仲临终，谓竖刁、易牙不可用。君从之乎？",t("yi","hit","从之。彼既知人，则其言当听。","桓公曰：「寡人从之。」"),t("li","reason","不顺。此三人事君久矣，岂有异心？","桓公曰：「君若欲之，何患无有？」"),t("shi","evade","用人之事，各有时。","桓公曰：「寡人欲伯诸侯。」"))],null,{success:"桓公曰：「君知用人之要矣。」",compromise:"桓公曰：「君之言，半是。」",fail:"桓公曰：「君犹以私怨论人。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_qihuan_wan","晚节","court","li",!1,"齐桓公","齐国国君","桓公病，五公子争立，竖刁、易牙作乱，塞宫门，筑高墙。",[r("管仲既殁，君何故用竖刁、易牙？",t("yi","hit","吾不能用仲之言，此吾之过也。","桓公曰：「寡人悔之。」"),t("li","reason","彼事君久，未必有异心。","桓公曰：「君若欲之，何患无有？」"),t("shi","evade","用人得失，皆有其数。","桓公曰：「寡人欲伯诸侯。」")),r("五公子争立，君将何以处之？",t("yi","hit","早定太子，则不争。此吾所以失也。","桓公曰：「此吾之所以悔也。」"),t("li","reason","当以兵威定之。强者立则可。","桓公曰：「余姑翦灭此而朝食。」"),t("ming","evade","立谁皆有其数，不必强定。","桓公曰：「寡人赖先君之灵。」")),r("伯业之成，在人乎？在制乎？",t("yi","hit","在制。人亡而制存，则业不坠。吾恃人而不立制，故及此。","桓公曰：「君之言，吾所未及。」"),t("li","reason","在人。得人则兴，失人则亡。","桓公曰：「寡人欲伯诸侯。」"),t("shi","evade","二者皆有其时。","桓公曰：「诸侯皆叛，寡人独守。」"))],null,{success:"桓公曰：「君可与言治乱矣。」",compromise:"桓公曰：「君之言，可采。」",fail:"桓公曰：「君之说，未及于本。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}})]},yu={theme:"退避三舍",intro:"退避三舍，所以报也。",debates:[f("v_jinwen_san","退避三舍","military","yi",!0,"晋文公","晋国国君","晋楚战于城濮。晋侯曰：「昔在楚，楚君待我以礼，许之退避三舍。」",[r("战阵之间，君何故退避？",t("yi","hit","吾尝许之，不可以失信。退而战，则我直而楚曲。","文公曰：「此吾之所以退也。」"),t("shi","reason","战场上无信可言。当先发制人。","文公曰：「战也。战而捷，必得诸侯。」"),t("li","evade","退与不退，皆视其势。","文公曰：「退避三舍，所以报也。」")),r("守信而失机，君以为值得乎？",t("yi","hit","值得。机可再得，信一失则天下不复与晋盟。","文公曰：「善哉！君知信之重矣。」"),t("li","reason","不值。战败则国危，何信之有？","文公曰：「战而捷，必得诸侯。」"),t("shi","evade","信与机，皆非人力可尽。","文公曰：「退避三舍，所以报也。」")),r("城濮既胜，君何以定霸业？",t("yi","hit","践土之盟，尊周室而会诸侯。名正而后霸成。","文公曰：「此吾之所以伯也。」"),t("shi","reason","当乘胜取楚地，以广晋疆。","文公曰：「战也。」"),t("li","evade","霸与不霸，听之后世。","文公曰：「退避三舍。」"))],k("城濮战图",1,"你呈上城濮战图：楚师背酅而舍，晋师退三舍以避之。"),{success:"文公曰：「君可与言信矣。」",compromise:"文公曰：「君之言，可采。」",fail:"文公曰：「君之说，非伯者之言。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_jinwen_liu","十九年","court","yi",!0,"晋文公","晋国国君","晋公子重耳出亡十九年，从者狐偃、赵衰、先轸辈皆贤。",[r("出亡十九年，君何以能不失其志？",t("yi","hit","有从者相劝。一人之志易堕，众人之志难移。","文公曰：「此吾之所以能反国也。」"),t("li","reason","志在得国，故不堕。","文公曰：「吾争国于外。」"),t("shi","evade","久困而心自坚，非人力所致。","文公曰：「退避三舍。」")),r("从亡之臣，归国后当何以待之？",t("yi","hit","赏其功，而不假其权。功不可没，权不可专。","文公曰：「此吾之所以定霸也。」"),t("li","reason","当尽赏之。彼从君于难，岂可负之？","文公曰：「吾争国于外，奈何以信？」"),t("ming","evade","赏与不赏，各在其时。","文公曰：「退避三舍，所以报也。」")),r("介子推不言禄，禄亦不及。君以为何如？",t("yi","hit","吾之失也。赏不及隐者，则士不出。","文公曰：「此吾之过也。」"),t("li","reason","彼自不言，非君之过。","文公曰：「吾争国于外。」"),t("shi","evade","隐者之志，非赏所能致。","文公曰：「退避三舍。」"))],null,{success:"文公曰：「君可与言赏矣。」",compromise:"文公曰：「君之言，半是。」",fail:"文公曰：「君之说，未及于功。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jinwen_cong","从亡之臣","court","yi",!1,"晋文公","晋国国君","狐偃曰：「臣从君十九年，罪多矣。」文公曰：「寡人与之盟于河。」",[r("从亡者恃功，君何以处之？",t("yi","hit","忘其功而不忘其言。功可赏，恃功则不可长。","文公曰：「此吾之所以能伯也。」"),t("li","reason","当厚赏之。彼从君于难，理所当报。","文公曰：「吾争国于外，奈何以信？」"),t("shi","evade","恃与不恃，视其人之品。","文公曰：「退避三舍，所以报也。」")),r("狐偃请辞，君投璧于河。此何意？",t("yi","hit","与之盟，示不背也。君疑臣则臣去，故盟以固之。","文公曰：「此吾之所以留之也。」"),t("li","reason","近于要挟。君不当与人盟。","文公曰：「寡人与之盟于河。」"),t("ming","evade","盟与不盟，皆一时之权。","文公曰：「退避三舍。」")),r("霸业既成，从亡者多居要职。君不惧乎？",t("yi","hit","惧。故分其权，使相制也。","文公曰：「此吾之所以定晋也。」"),t("li","reason","不惧。彼既从君于难，必不负君。","文公曰：「吾争国于外。」"),t("shi","evade","惧与不惧，皆外也。","文公曰：「退避三舍，所以报也。」"))],null,{success:"文公曰：「君可与言君臣矣。」",compromise:"文公曰：「君之言，可采。」",fail:"文公曰：「君犹以私恩论政。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},vu={theme:"一鸣惊人",intro:"三年不蜚，蜚将冲天；三年不鸣，鸣将惊人。",debates:[f("v_chuzhuang_ming","一鸣惊人","court","shi",!0,"楚庄王","楚国国君","庄王即位三年，不出号令，日夜为乐。伍举以隐语谏之。",[r("三年不飞不鸣，君之意安在？",t("shi","hit","不飞则已，飞将冲天；不鸣则已，鸣将惊人。","庄王曰：「举退矣，吾知之矣。」"),t("yi","reason","君当早决政事，何待三年？","庄王曰：「三年不蜚，蜚将冲天。」"),t("li","evade","飞鸣自有时，不必问。","庄王曰：「国中有大鸟。」")),r("王之沈湎，臣下侧目。此三年可堪乎？",t("shi","hit","可堪。不窥其实者，不知其志。三年之蓄，一朝而发。","庄王曰：「此吾之所以能霸也。」"),t("yi","reason","不可堪。君不理事，国将乱。","庄王曰：「三年不飞不鸣。」"),t("li","evade","堪与不堪，皆外人之见。","庄王曰：「吾知之矣。」")),r("既发之后，当以何为先？",t("shi","hit","先正其纲纪。所诛者数百人，所进者数百人。","庄王曰：「此吾之所以治楚也。」"),t("yi","reason","先施仁政，以安民心。","庄王曰：「楚虽蛮夷。」"),t("li","reason","先强其兵，以威诸侯。","庄王曰：「三年不蜚，蜚将冲天。」"))],k("大鸟图",1,"你呈上大鸟图：三年止于王之庭，不飞不鸣。"),{success:"庄王曰：「君可与言隐矣。」",compromise:"庄王曰：「君之言，有见。」",fail:"庄王曰：「君之说，未达吾志。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_chuzhuang_ding","问鼎","diplomacy","shi",!0,"楚庄王","楚国国君","楚子伐陆浑之戎，观兵于周疆。问鼎之大小轻重焉。",[r("问鼎于周，君之意为何？",t("shi","hit","欲观周室之虚实。鼎之轻重，即天命之去留。","庄王曰：「此吾之所以问也。」"),t("yi","reason","不可问。此僭礼之举，诸侯将叛。","庄王曰：「在德不在鼎。」"),t("li","evade","问与不问，皆无关于得国。","庄王曰：「楚虽蛮夷。」")),r("王孙满曰「在德不在鼎」，君服乎？",t("shi","hit","服其辞，不服其意。周德既衰，鼎终当移。","庄王曰：「此吾之所以退也。」"),t("yi","reason","当服其言。德不修而争鼎，非伯者。","庄王曰：「在德不在鼎。」"),t("li","evade","辞之服否，皆一时。","庄王曰：「问鼎之大小轻重焉。」")),r("邲之战，晋师败绩。君何以处之？",t("shi","hit","止戈为武。胜而不骄，乃可久。","庄王曰：「此吾之所以霸也。」"),t("li","reason","当乘胜逐北，尽取晋地。","庄王曰：「三年不蜚，蜚将冲天。」"),t("yi","reason","当示德于诸侯，以收其心。","庄王曰：「楚虽蛮夷。」"))],null,{success:"庄王曰：「君可与言德矣。」",compromise:"庄王曰：「君之言，半是。」",fail:"庄王曰：「君之说，未及于时。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_chuzhuang_youmeng","优孟","court","shi",!1,"楚庄王","楚国国君","庄王有爱马，衣以文绣，以大夫礼葬之。优孟请以人君礼葬。",[r("葬马以大夫之礼，君以为过乎？",t("shi","hit","过矣。吾之过也，优孟之言是也。","庄王曰：「寡人之过，一至此乎！」"),t("li","reason","不过。吾之所爱，厚葬之宜。","庄王曰：「以大夫礼葬之。」"),t("yi","evade","葬之厚薄，皆小节。","庄王曰：「有爱马。」")),r("优孟以人君礼讽之，君何以受？",t("shi","hit","受其讽。讽者不逆耳，而吾自悟。","庄王曰：「此吾之所以能用优孟也。」"),t("yi","reason","当责其戏君。人君之礼不可戏。","庄王曰：「请以人君礼葬之。」"),t("li","evade","戏与不戏，皆在其人。","庄王曰：「楚虽蛮夷。」")),r("君之过失，谁能正之？",t("shi","hit","能讽者正之。直言者或死，讽者常存。","庄王曰：「善哉！君知谏矣。」"),t("yi","reason","能谏者正之。忠臣不避死。","庄王曰：「寡人之过，一至此乎！」"),t("li","evade","君自正之，何待于人？","庄王曰：「三年不蜚。」"))],null,{success:"庄王曰：「君可与言谏矣。」",compromise:"庄王曰：「君之言，可采。」",fail:"庄王曰：「君犹以为小节。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}})]},bu={theme:"不以一眚掩大德",intro:"吾不以一眚掩大德。",debates:[f("v_qinmu_yao","殽之败","military","yi",!0,"秦穆公","秦国国君","秦师败于殽。三帅归，穆公素服郊次，乡师而哭。",[r("三帅丧师，君何以不罪？",t("yi","hit","吾不以一眚掩大德。过在寡人，不在三帅。","穆公曰：「此吾之所以哭也。」"),t("li","reason","当罪之。丧师者不诛，则军法不立。","穆公曰：「吾不以一眚掩大德。」"),t("shi","evade","罪与不罪，皆一时之权。","穆公曰：「乡师而哭。」")),r("不听蹇叔之谏，君自悔乎？",t("yi","hit","悔之。吾以贪得郑，故不听老臣之言。","穆公曰：「此吾之过也。」"),t("li","reason","不悔。兵者偶有胜负，何悔之有？","穆公曰：「吾不以一眚掩大德。」"),t("ming","evade","悔与不悔，皆无及矣。","穆公曰：「秦师败于殽。」")),r("败而后何以复振？",t("yi","hit","修政而用贤。政修则民附，民附则兵强。","穆公曰：「此吾之所以霸西戎也。」"),t("shi","reason","当速报殽之仇，以雪其耻。","穆公曰：「秦师败于殽。」"),t("li","evade","振与不振，皆有其时。","穆公曰：「吾不以一眚掩大德。」"))],k("殽山战图",1,"你呈上殽山战图：晋人御师于殽，秦师覆没。"),{success:"穆公曰：「君可与言过矣。」",compromise:"穆公曰：「君之言，可采。」",fail:"穆公曰：「君之说，未及于责己。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_qinmu_rong","霸西戎","diplomacy","yi",!0,"秦穆公","秦国国君","由余降秦。穆公问：「中国以诗书礼乐法度为政，然尚时乱。今戎夷无此，何以为治？」",[r("戎夷无法度而治，中国有法度而乱，其故安在？",t("yi","hit","中国之乱，由上失其德。礼乐者饰也，无德则饰为虚。","穆公曰：「善哉！」遂用由余之谋。"),t("li","reason","戎夷简陋，不足称治。","穆公曰：「中国以诗书礼乐为政。」"),t("shi","evade","治乱各因其俗，不必相较。","穆公曰：「何以为治？」")),r("以女乐遗戎王，使其荒怠。此术可乎？",t("yi","hit","可。兵者诡道，不以奇取胜则难。","穆公曰：「此吾之所以霸西戎也。」"),t("li","reason","不可。以乐乱人之国，非仁者所为。","穆公曰：「以女乐遗戎王。」"),t("shi","evade","术之正否，视其成败。","穆公曰：「吾不以一眚掩大德。」")),r("秦国处西，中国以夷狄视之。君何以处？",t("yi","hit","以礼自处，则中国自居；以力自处，则人亦以夷狄视之。","穆公曰：「此吾之所以教秦也。」"),t("shi","reason","当以力取中国之地，然后可言礼。","穆公曰：「秦霸西戎。」"),t("li","evade","夷狄之目，于人何损？","穆公曰：「吾不以一眚掩大德。」"))],null,{success:"穆公曰：「君可与言治矣。」",compromise:"穆公曰：「君之言，有见。」",fail:"穆公曰：「君之说，犹守虚文。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_qinmu_xun","三良","court","yi",!1,"秦穆公","秦国国君","穆公卒，以子车氏三良为殉。国人哀之，赋《黄鸟》。",[r("以良臣殉葬，君以为可乎？",t("yi","hit","不可。吾之过也。君子不以所爱害所敬。","穆公曰：「此吾之所以悔也。」"),t("li","reason","可。君之爱臣，死生相从。","穆公曰：「三良殉葬。」"),t("shi","evade","殉与不殉，皆旧制也。","穆公曰：「国人哀之。」")),r("国人赋《黄鸟》以哀之，君闻乎？",t("yi","hit","闻之。民之哀，即吾之罪也。","穆公曰：「此吾之所以愧也。」"),t("li","reason","民之哀，无关于国法。","穆公曰：「以子车氏三良为殉。」"),t("ming","evade","哀与不哀，皆后人之情。","穆公曰：「吾不以一眚掩大德。」")),r("秦之霸，以此失人心，君以为值得乎？",t("yi","hit","不值。霸者以得人为本，失人则霸无根。","穆公曰：「君之言，吾所未及。」"),t("li","reason","值得。殉葬者旧制，霸业者大功。","穆公曰：「秦霸西戎。」"),t("shi","evade","值不值，后人自评。","穆公曰：「三良殉葬，国人哀之。」"))],null,{success:"穆公曰：「君可与言本矣。」",compromise:"穆公曰：「君之言，半是。」",fail:"穆公曰：「君犹以旧制自解。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},_u={theme:"多行不义必自毙",intro:"多行不义必自毙。寡人且待之。",debates:[f("v_zhengzhuang_duan","克段于鄢","court","li",!0,"郑庄公","郑国国君","共叔段据京邑为乱。祭仲曰：「不如早为之所。」公曰：「多行不义必自毙。」",[r("段之骄纵，君何故纵之？",t("li","hit","非纵也，待其自毙。早除则人谓我不弟，晚除则罪在彼。","庄公曰：「此吾之所以待之也。」"),t("yi","reason","当早正其罪，以全兄弟之恩。","庄公曰：「多行不义必自毙。」"),t("shi","evade","纵与不纵，皆有其时。","庄公曰：「寡人且待之。」")),r("克段之后，君置姜氏于城颍，誓曰「不及黄泉，无相见也」。悔乎？",t("li","hit","悔之。吾之誓，一时之忿也。","庄公曰：「此吾之所以悔也。」"),t("yi","reason","不悔。母助其弟为乱，当有所责。","庄公曰：「不及黄泉，无相见也。」"),t("shi","evade","悔与不悔，皆家事。","庄公曰：「多行不义必自毙。」")),r("隧而相见，君以为孝乎？",t("li","hit","孝之权也。誓不可废，而母不可绝，故隧以通之。","庄公曰：「此吾之所以隧也。」"),t("yi","reason","非孝。誓既出，则当守之。","庄公曰：「不及黄泉，无相见也。」"),t("ming","evade","孝与不孝，后人自评。","庄公曰：「寡人且待之。」"))],k("鄢之战图",1,"你呈上鄢之战图：京人叛段，段出奔共。"),{success:"庄公曰：「君可与言权矣。」",compromise:"庄公曰：「君之言，可采。」",fail:"庄公曰：「君之说，未达吾心。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhengzhuang_wang","射王中肩","military","li",!0,"郑庄公","郑国国君","繻葛之战，祝聃射王中肩。庄公曰：「君子不欲多上人，况敢陵天子乎？」",[r("射王中肩，君何以止祝聃？",t("li","hit","不可再进。陵天子者，天下共讨之。","庄公曰：「此吾之所以止之也。」"),t("shi","reason","当乘胜取周，以定天下。","庄公曰：「祝聃射王中肩。」"),t("yi","evade","战阵之间，何暇择人？","庄公曰：「君子不欲多上人。」")),r("既射王，何以自处？",t("li","hit","夜遣祭足劳王，且问左右。示不敢陵，则诸侯无辞。","庄公曰：「此吾之所以自处也。」"),t("yi","reason","当谢罪于周，以全君臣之义。","庄公曰：「况敢陵天子乎？」"),t("shi","evade","自处之道，各随其时。","庄公曰：「多行不义必自毙。」")),r("郑之强，在礼乎？在力乎？",t("li","hit","在力，亦在名。有力而无名，则诸侯共讨。","庄公曰：「善哉！君知郑之所以强矣。」"),t("shi","reason","在力。有force则诸侯自服。","庄公曰：「祝聃射王中肩。」"),t("yi","reason","在礼。守礼则诸侯亲之。","庄公曰：「君子不欲多上人。」"))],null,{success:"庄公曰：「君可与言名矣。」",compromise:"庄公曰：「君之言，半是。」",fail:"庄公曰：「君之说，未及于势。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhengzhuang_xu","许田","diplomacy","li",!1,"郑庄公","郑国国君","郑伯入许。许庄公奔卫。郑伯使许大夫百里奉许叔以居许东偏。",[r("既得许，君何故复封之？",t("li","hit","吾非贪其土，为讨其罪耳。罪人既去，则当复其祀。","庄公曰：「此吾之所以封许也。」"),t("shi","reason","当尽取之。得地则国强。","庄公曰：「郑伯入许。」"),t("yi","evade","封与不封，皆一时之宜。","庄公曰：「多行不义必自毙。」")),r("使许叔居东偏，君以为仁乎？",t("li","hit","非仁也，权也。许不可灭，故分而弱之。","庄公曰：「此吾之所以处许也。」"),t("yi","reason","仁矣。不绝人之祀，此古之道。","庄公曰：「使许叔以居许东偏。」"),t("shi","evade","仁与不仁，后人自评。","庄公曰：「寡人且待之。」")),r("君子谓郑庄公「于是乎有礼」，君以为然乎？",t("li","hit","然。礼者，名分也。守名分则人不能加我。","庄公曰：「此吾之所以守礼也。」"),t("yi","reason","不然。许之土，郑之利，何必以礼饰之？","庄公曰：「郑伯入许。」"),t("ming","evade","礼与不礼，皆外人加之。","庄公曰：「多行不义必自毙。」"))],null,{success:"庄公曰：「君可与言礼矣。」",compromise:"庄公曰：「君之言，可采。」",fail:"庄公曰：「君犹以礼为饰。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},xu={theme:"仁义之师",intro:"君子不重伤，不禽二毛。",debates:[f("v_songxiang_hong","泓之战","military","yi",!0,"宋襄公","宋国国君","宋楚战于泓。楚人未既济，司马曰：「半渡而击之。」公曰：「不可。」",[r("半渡而击，君何故不许？",t("yi","hit","君子不困人于厄。楚未济而击，胜之不武。","襄公曰：「此吾之所以不许也。」"),t("li","reason","兵者诡道。胜则为君，败则为虏。","襄公曰：「君子不重伤，不禽二毛。」"),t("shi","evade","击与不击，各视其时。","襄公曰：「不可。」")),r("既济而未成列，又可击乎？",t("yi","hit","不可。未成列而击，是乘人之乱也。","襄公曰：「此吾之所以待之也。」"),t("li","reason","可。战中无礼，胜者为要。","襄公曰：「不可。」"),t("ming","evade","礼与不礼，后人自论。","襄公曰：「君子不重伤。」")),r("既败，国人皆咎君。君自悔乎？",t("yi","hit","不悔。吾虽亡国之余，不失仁义之名。","襄公曰：「此吾之所以自守也。」"),t("li","reason","当悔。败军亡国，仁义何用？","襄公曰：「君子不重伤，不禽二毛。」"),t("shi","evade","悔与不悔，皆无及矣。","襄公曰：「楚人未既济。」"))],k("泓水战图",1,"你呈上泓水战图：楚师半渡，宋师列于岸。"),{success:"襄公曰：「君可与言义矣。」",compromise:"襄公曰：「君之言，有见。」",fail:"襄公曰：「君之说，功利之言也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_songxiang_hui","会盟","diplomacy","yi",!1,"宋襄公","宋国国君","宋襄公欲合诸侯，盟于鹿上。公子目夷曰：「小国争盟，祸也。」",[r("小国争盟，君以为可乎？",t("yi","hit","可。不争则永为属国，争则或有一日之望。","襄公曰：「此吾之所以争也。」"),t("li","reason","不可。宋小力薄，争盟必败。","襄公曰：「小国争盟，祸也。」"),t("shi","evade","争与不争，皆有其势。","襄公曰：「宋，小国也。」")),r("盟而被执，君以为辱乎？",t("yi","hit","辱。然吾为合诸侯而受辱，非为己也。","襄公曰：「此吾之所以甘之也。」"),t("li","reason","大辱。为人君而受执，国之耻也。","襄公曰：「盟于鹿上。」"),t("ming","evade","辱与不辱，皆外也。","襄公曰：「君子不重伤。」")),r("仁义与国力，孰为宋之本？",t("yi","hit","仁义。宋小不能以力争，唯可以义守。","襄公曰：「善哉！君知宋矣。」"),t("li","reason","国力。无国力则仁义无所施。","襄公曰：「宋，小国也。」"),t("shi","evade","二者各有所宜。","襄公曰：「君子不重伤，不禽二毛。」"))],null,{success:"襄公曰：「君可与言义矣。」",compromise:"襄公曰：「君之言，可采。」",fail:"襄公曰：「君犹以力论国。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_songxiang_ren","仁义之效","court","yi",!1,"宋襄公","宋国国君","或问：「君之仁义，终不能救宋之弱。仁义何用？」",[r("仁义无用，君以为何如？",t("yi","hit","仁义者，不为一时之用。虽败而名存，名存则国不亡。","襄公曰：「此吾之所以守也。」"),t("li","reason","果无用。国既弱矣，名何益焉？","襄公曰：「君子不重伤。」"),t("shi","evade","用与不用，非一日可见。","襄公曰：「宋，小国也。」")),r("以宋之弱，当如何自处？",t("yi","hit","守义而不争。事大以礼，自守以信。","襄公曰：「此吾之所以事宋也。」"),t("li","reason","当择强者而从之，以图存。","襄公曰：「小国争盟，祸也。」"),t("ming","evade","自处之道，各随其国。","襄公曰：「盟于鹿上。」")),r("后世论君，或以为迂。君自谓如何？",t("yi","hit","迂者，人言之也。吾所守者，吾自知之。","襄公曰：「善哉！君知吾心矣。」"),t("li","reason","确然迂矣。兵败身伤，何守可言？","襄公曰：「君子不重伤。」"),t("shi","evade","迂与不迂，听之后世。","襄公曰：「楚人未既济。」"))],null,{success:"襄公曰：「君可与言守矣。」",compromise:"襄公曰：「君之言，半是。」",fail:"襄公曰：「君亦以吾为迂乎？」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},wu={theme:"用兵如神",intro:"吾欲兴师伐楚，谁可为将？",debates:[f("v_helu_wu","用伍员孙武","military","shi",!0,"吴王阖闾","吴国国君","伍员、孙武入吴。阖闾曰：「寡人欲兴师伐楚，二子以为何如？」",[r("吴僻处东南，何以伐楚？",t("shi","hit","楚虽大，政出多门。疲之而后可入。","阖闾曰：「此吾之所以用二子也。」"),t("yi","reason","当先修德政，待楚自乱。","阖闾曰：「吾欲兴师伐楚。」"),t("li","evade","伐与不伐，视其势。","阖闾曰：「谁可为将？」")),r("孙武以宫女试兵，斩王之爱姬。君怒乎？",t("shi","hit","怒，然知其能用兵。将者，不可以私害法。","阖闾曰：「此吾之所以用孙武也。」"),t("yi","reason","当罪之。斩君之爱姬，无礼甚矣。","阖闾曰：「孙武以宫女试兵。」"),t("li","evade","怒与不怒，皆一时。","阖闾曰：「谁可为将？」")),r("五战入郢，君何以处之？",t("shi","hit","入郢而不能定楚，此吾之失也。当安其民，收其心。","阖闾曰：「此吾之所以悔也。」"),t("li","reason","当尽取楚地，以广吴疆。","阖闾曰：「吾欲兴师伐楚。」"),t("yi","evade","处之之道，各随其时。","阖闾曰：「谁可为将？」"))],k("柏举战图",1,"你呈上柏举战图：吴师五战及郢。"),{success:"阖闾曰：「君可与言兵矣。」",compromise:"阖闾曰：「君之言，可采。」",fail:"阖闾曰：「君之说，未达用兵之要。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_helu_zhuanzhu","专诸","court","shi",!0,"吴王阖闾","吴国国君","公子光欲弑王僚，伍子胥进专诸。专诸曰：「王僚可杀也。」",[r("弑君而自立，君以为可乎？",t("shi","hit","可为则为。王僚非应立者，吾取其所当取。","阖闾曰：「此吾之所以为也。」"),t("yi","reason","不可。弑君者天下共讨之。","阖闾曰：「王僚可杀也。」"),t("li","evade","可与否，皆成者之论。","阖闾曰：「寡人欲兴师伐楚。」")),r("专诸刺王僚而死，君何以报之？",t("shi","hit","封其子，世不绝祀。死士不可负。","阖闾曰：「此吾之所以报也。」"),t("li","reason","厚赏其家，足矣。","阖闾曰：「专诸刺王僚。」"),t("yi","evade","死者已矣，报之何益？","阖闾曰：「王僚可杀也。」")),r("以刺客得国，君不惧后人之效乎？",t("shi","hit","惧。故吾立威以镇之，使后来者不敢。","阖闾曰：「此吾之所以强吴也。」"),t("yi","reason","当以德化之，使之不生异心。","阖闾曰：「寡人欲兴师伐楚。」"),t("li","evade","效与不效，皆有其数。","阖闾曰：「王僚可杀也。」"))],null,{success:"阖闾曰：「君可与言权矣。」",compromise:"阖闾曰：「君之言，半是。」",fail:"阖闾曰：「君之说，书生之言也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_helu_fuchai","夫差","court","shi",!1,"吴王阖闾","吴国国君","阖闾伐越，伤于檇李。将死，谓夫差曰：「尔而忘勾践杀汝父乎？」",[r("将死而嘱子复仇，君以为可乎？",t("shi","hit","可。仇不报则国轻，国轻则亡。","阖闾曰：「此吾之所以嘱之也。」"),t("yi","reason","不可。结怨相报，无有已时。","阖闾曰：「尔而忘勾践杀汝父乎？」"),t("li","evade","嘱与不嘱，皆父子之情。","阖闾曰：「吾欲兴师伐楚。」")),r("越之患与楚之患，孰急？",t("shi","hit","越为腹心，楚为疥癣。先越而后楚。","阖闾曰：「此吾之所以戒夫差也。」"),t("li","reason","楚大而近，当先图楚。","阖闾曰：「寡人欲兴师伐楚。」"),t("yi","evade","二者皆患，不必择。","阖闾曰：「谁可为将？」")),r("夫差忘仇而伐齐，君地下有知，当如何？",t("shi","hit","当恨之。吾之言，彼不之省也。","阖闾曰：「此吾之所以不瞑目也。」"),t("yi","reason","当谅之。齐亦吴之敌。","阖闾曰：「尔而忘勾践杀汝父乎？」"),t("li","evade","地下之事，不可知。","阖闾曰：「吾欲兴师伐楚。」"))],null,{success:"阖闾曰：「君可与言患矣。」",compromise:"阖闾曰：「君之言，可采。」",fail:"阖闾曰：「君未明缓急。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ku={theme:"卧薪尝胆",intro:"寡人栖于会稽，此耻不可忘。",debates:[f("v_goujian_huiji","会稽之耻","court","li",!0,"越王勾践","越国国君","越败于夫椒，栖于会稽。勾践曰：「吾终于此乎？」文种曰：「汤系夏台，文王囚羑里。」",[r("国几亡而屈身事仇，君以为可乎？",t("li","hit","可。耻在一时而存社稷，胜于快一时而亡宗庙。","勾践曰：「此吾之所以忍也。」"),t("yi","reason","不可。君辱臣死，何面目事仇？","勾践曰：「吾终于此乎？」"),t("shi","evade","屈与不屈，皆有其时。","勾践曰：「寡人栖于会稽。」")),r("为吴王前马，君不以为耻乎？",t("li","hit","耻甚。然耻者，吾之资也。不忘其耻，则可以复。","勾践曰：「此吾之所以卧薪尝胆也。」"),t("yi","reason","大耻。宁死不为此。","勾践曰：「吾终于此乎？」"),t("ming","evade","耻与不耻，皆外人之见。","勾践曰：「此耻不可忘。」")),r("十年生聚，十年教训。其序可易乎？",t("li","hit","不可易。民不足则无以教，教不先则无以战。","勾践曰：「此吾之所以复越也。」"),t("yi","reason","当先教训。民知义则自奋。","勾践曰：「十年生聚，十年教训。」"),t("shi","evade","二者并行，不必分先后。","勾践曰：「寡人栖于会稽。」"))],k("会稽山图",1,"你呈上会稽山图：越师栖于山上，甲盾五千。"),{success:"勾践曰：「君可与言忍矣。」",compromise:"勾践曰：「君之言，可采。」",fail:"勾践曰：「君之说，未及于忍。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_goujian_wen","文种范蠡","court","li",!0,"越王勾践","越国国君","范蠡曰：「飞鸟尽，良弓藏；狡兔死，走狗烹。」遂去。文种不去。",[r("范蠡既去，君何以处之？",t("li","hit","听其去。去者不追，则来者不惧。","勾践曰：「此吾之所以听之也。」"),t("yi","reason","当留之。功成而赏未及，何遽去？","勾践曰：「范蠡曰：飞鸟尽，良弓藏。」"),t("shi","evade","去与不去，各从其志。","勾践曰：「寡人栖于会稽。」")),r("文种不去，君赐之剑。君以为可乎？",t("li","hit","可。功高震主者，不可久留。","勾践曰：「此吾之所以赐剑也。」"),t("yi","reason","不可。文种有大功于越，岂忍杀之？","勾践曰：「子教寡人伐吴七术。」"),t("shi","evade","杀与不杀，皆有其势。","勾践曰：「此耻不可忘。」")),r("功臣与国，孰为重？",t("li","hit","国为重。功臣可再有，国不可再立。","勾践曰：「此吾之所以为越也。」"),t("yi","reason","功臣为重。无功臣则无国。","勾践曰：「子教寡人伐吴七术。」"),t("ming","evade","轻重之势，各随其时。","勾践曰：「寡人栖于会稽。」"))],null,{success:"勾践曰：「君可与言国矣。」",compromise:"勾践曰：「君之言，半是。」",fail:"勾践曰：「君犹以功为念。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_goujian_woxin","卧薪尝胆","court","li",!1,"越王勾践","越国国君","勾践反国，乃苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆。",[r("自苦若此，君以为有效乎？",t("li","hit","有效。身不苦则志不坚，志不坚则仇不报。","勾践曰：「此吾之所以能复也。」"),t("yi","reason","不必自苦。修政用贤，自有其效。","勾践曰：「置胆于坐。」"),t("shi","evade","效与不效，皆在一心。","勾践曰：「此耻不可忘。」")),r("尝胆之事，近于自饰。君以为何如？",t("li","hit","近于自饰，然使人知吾不忘耻。此亦政也。","勾践曰：「善哉！君知吾意矣。」"),t("yi","reason","确然自饰。为君者当务其实。","勾践曰：「饮食亦尝胆。」"),t("ming","evade","饰与不饰，外人难知。","勾践曰：「寡人栖于会稽。」")),r("既灭吴，君以为仇已报乎？",t("li","hit","仇报而耻未忘。忘记则国复危。","勾践曰：「此吾之所以终不敢怠也。」"),t("yi","reason","仇已报矣。当布仁政，以安吴民。","勾践曰：「此耻不可忘。」"),t("shi","evade","报与不报，皆一时之论。","勾践曰：「置胆于坐。」"))],null,{success:"勾践曰：「君可与言志矣。」",compromise:"勾践曰：「君之言，可采。」",fail:"勾践曰：「君未察吾心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},zu={theme:"观中国之政",intro:"楚虽蛮夷，亦欲观中国之政。",debates:[f("v_chucheng_qi","召陵之盟","diplomacy","yi",!0,"楚成王","楚国国君","齐桓公以诸侯之师侵蔡，遂伐楚。楚子使屈完如师。",[r("齐以包茅不入为辞，君以为有理乎？",t("yi","hit","包茅之贡，寡君之罪也。然齐以此为名，其实畏楚之强。","成王曰：「此吾之所以使屈完也。」"),t("li","reason","无理。齐欲伐楚，假此为由耳。","成王曰：「昭王之不复，君其问诸水滨。」"),t("shi","evade","名与实，不必深辨。","成王曰：「楚虽蛮夷。」")),r("屈完与齐侯盟，君以为屈乎？",t("yi","hit","不屈。盟成则兵息，此吾之所以从也。","成王曰：「此吾之所以使屈完也。」"),t("li","reason","屈矣。与齐盟，是服于齐也。","成王曰：「君若以德绥诸侯。」"),t("ming","evade","屈与不屈，皆一时之辞。","成王曰：「楚虽蛮夷，亦欲观中国之政。」")),r("齐桓既殁，楚当何以为政？",t("yi","hit","北向而争中原。齐衰则楚当代其伯。","成王曰：「此吾之所以图中原也。」"),t("li","reason","当守境自安，不争中原。","成王曰：「楚虽蛮夷。」"),t("shi","evade","争与不争，皆有其时。","成王曰：「召陵之盟。」"))],k("召陵盟图",1,"你呈上召陵盟图：齐楚就盟，屈完与齐侯同乘。"),{success:"成王曰：「君可与言交矣。」",compromise:"成王曰：「君之言，可采。」",fail:"成王曰：「君之说，未达南北之势。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_chucheng_shangchen","商臣","court","li",!1,"楚成王","楚国国君","楚子将立商臣为太子，子上曰：「君之齿未也，而又多爱。」弗听。既又欲立职。",[r("既立商臣，又欲废之，君以为可乎？",t("li","hit","不可。太子既立而复废，必生乱。","成王曰：「此吾之所以及祸也。」"),t("yi","reason","可。立贤不立长，国之利也。","成王曰：「吾欲立职。」"),t("shi","evade","废立之事，皆有其势。","成王曰：「楚虽蛮夷。」")),r("子上言「君之齿未也」，君何故不听？",t("li","hit","吾之过也。老臣之言，多验于后。","成王曰：「此吾之所以悔也。」"),t("yi","reason","彼言其早，吾言之决，何悔？","成王曰：「将立商臣为太子。」"),t("ming","evade","听与不听，皆有其数。","成王曰：「君之齿未也。」")),r("商臣弑君，君以为谁之过？",t("li","hit","吾之过也。立之不正，废之不时，故及此。","成王曰：「此吾之所以自取也。」"),t("yi","reason","商臣之罪也。弑父者，天下之大恶。","成王曰：「商臣弑君。」"),t("shi","evade","过之所在，后人自论。","成王曰：「楚虽蛮夷。」"))],null,{success:"成王曰：「君可与言立嗣矣。」",compromise:"成王曰：「君之言，半是。」",fail:"成王曰：「君之说，未及于本。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_chucheng_zhongyuan","问中原","diplomacy","yi",!1,"楚成王","楚国国君","楚子使於菟治兵于睽，终朝而毕，不戮一人。君子称之。",[r("治兵而不戮一人，君以为能乎？",t("yi","hit","能。刑不滥用，则民不怨；民不怨，则兵可用。","成王曰：「此吾之所以用子文也。」"),t("li","reason","不能。兵者尚威，不戮则无威。","成王曰：「终朝而毕，不戮一人。」"),t("shi","evade","戮与不戮，各视其兵。","成王曰：「楚虽蛮夷。」")),r("楚欲观中国之政，当以何为先？",t("yi","hit","先修其政。政修而后中国不能轻楚。","成王曰：「此吾之所以图中原也。」"),t("li","reason","先强其兵。兵强而后可争。","成王曰：「楚虽蛮夷，亦欲观中国之政。」"),t("ming","evade","先后之序，各随其时。","成王曰：「召陵之盟。」")),r("中国以夷狄待楚，君以为可改乎？",t("yi","hit","可改。行中国之礼，则中国自不能外之。","成王曰：「善哉！君知楚之志矣。」"),t("li","reason","不可改。夷狄之名，出于其地，非礼可移。","成王曰：「楚虽蛮夷。」"),t("shi","evade","名之改否，非所计。","成王曰：「问中原之政。」"))],null,{success:"成王曰：「君可与言楚矣。」",compromise:"成王曰：「君之言，可采。」",fail:"成王曰：「君犹以夷狄视楚。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},qu={theme:"复先君之业",intro:"寡人始复先君之业。",debates:[f("v_jindao_fu","复霸","diplomacy","yi",!0,"晋悼公","晋国国君","晋悼公即位，逐不臣者七人，修旧功，施德惠。",[r("即位之初，当以何为先？",t("yi","hit","先正其朝。朝正而后政行，政行而后诸侯服。","悼公曰：「此吾之所以复霸也。」"),t("li","reason","先强其兵。兵强则诸侯自服。","悼公曰：「寡人始复先君之业。」"),t("shi","evade","先后之序，各随其时。","悼公曰：「逐不臣者七人。」")),r("逐不臣者七人，君不惧其党为乱乎？",t("yi","hit","惧。故逐而不诛，存其体面，则党不结。","悼公曰：「此吾之所以逐而不杀也。」"),t("li","reason","当尽诛之，以绝后患。","悼公曰：「逐不臣者七人。」"),t("ming","evade","逐与不逐，皆有其势。","悼公曰：「寡人始复先君之业。」")),r("悼公之霸，与文公之霸，孰难？",t("yi","hit","悼公难。文公因城濮之胜，悼公则起于衰微之后。","悼公曰：「善哉！君知晋之难矣。」"),t("li","reason","文公难。出亡十九年而得国。","悼公曰：「寡人始复先君之业。」"),t("shi","evade","难易皆后人论之。","悼公曰：「逐不臣者七人。」"))],k("晋悼公复霸图",1,"你呈上晋国复霸图：三驾而楚不能与争。"),{success:"悼公曰：「君可与言复矣。」",compromise:"悼公曰：「君之言，可采。」",fail:"悼公曰：「君之说，未达晋之势。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jindao_wei","魏绛","court","yi",!1,"晋悼公","晋国国君","悼公弟杨干乱行，魏绛戮其仆。公怒，欲杀绛。",[r("魏绛戮君弟之仆，君以为可乎？",t("yi","hit","可。军法不可以贵贱异。","悼公曰：「此吾之所以用魏绛也。」"),t("li","reason","不可。辱君之弟，是无君也。","悼公曰：「魏绛戮其仆。」"),t("shi","evade","可与否，皆有其势。","悼公曰：「寡人始复先君之业。」")),r("既怒而欲杀之，何以后止？",t("yi","hit","闻其言而止。法既立，则君亦当守法。","悼公曰：「此吾之所以能霸也。」"),t("li","reason","当杀之。君之怒不可已。","悼公曰：「魏绛戮其仆。」"),t("ming","evade","止与不止，皆一时之决。","悼公曰：「寡人始复先君之业。」")),r("法与亲，孰为重？",t("yi","hit","法重。法行则亲不能乱，亲乱则法亡。","悼公曰：「善哉！君知法矣。」"),t("li","reason","亲重。亲者君之骨肉，法者后起之制。","悼公曰：「魏绛戮其仆。」"),t("shi","evade","二者各有时。","悼公曰：「逐不臣者七人。」"))],null,{success:"悼公曰：「君可与言法矣。」",compromise:"悼公曰：「君之言，半是。」",fail:"悼公曰：「君犹以亲废法。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_jindao_san","三驾","military","yi",!1,"晋悼公","晋国国君","晋悼公用魏绛之谋，三驾而楚不能与争。",[r("三驾而后楚服，君何以能之？",t("yi","hit","疲之而不与战。楚远来则疲，吾逸而待之。","悼公曰：「此吾之所以复霸也。」"),t("li","reason","当决战。一战而定，何必三驾？","悼公曰：「三驾而楚不能与争。」"),t("shi","evade","战与不战，皆有其时。","悼公曰：「寡人始复先君之业。」")),r("郑服晋又服楚，君当如何处之？",t("yi","hit","不责其贰。郑居两强之间，贰乃其势。","悼公曰：「此吾之所以服郑也。」"),t("li","reason","当讨之。贰心者当伐。","悼公曰：「郑服晋又服楚。」"),t("ming","evade","贰与不贰，皆小国之势。","悼公曰：「三驾而楚不能与争。」")),r("霸业之要，在兵乎？在谋乎？",t("yi","hit","在谋。兵者谋之器，谋定而后兵可用。","悼公曰：「善哉！君知霸之要矣。」"),t("li","reason","在兵。无兵则谋无所施。","悼公曰：「三驾而楚不能与争。」"),t("shi","evade","二者相须，不可偏废。","悼公曰：「寡人始复先君之业。」"))],null,{success:"悼公曰：「君可与言谋矣。」",compromise:"悼公曰：「君之言，可采。」",fail:"悼公曰：「君未达疲楚之策。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Qn={qi_huan:pu,jin_wen:yu,chu_zhuang:vu,qin_mu:bu,zheng_zhuang:_u,song_xiang:xu,he_lu:wu,gou_jian:ku,chu_cheng:zu,jin_dao:qu}});var $u,ju,Eu,Su,Mu,Au,Ou,Tu,Zn,Jn=O(()=>{Ae();$u={theme:"一鼓作气",intro:"肉食者鄙，未能远谋。",debates:[f("v_caogui_gu","一鼓作气","military","yi",!0,"曹刿","鲁之将","长勺之战，齐师伐鲁。鲁庄公将战，曹刿请见。",[r("何以战？",t("yi","hit","取信于民。小大之狱，虽不能察，必以情。","曹刿曰：「忠之属也，可以一战。」"),t("li","reason","以兵战。兵强者胜。","曹刿曰：「肉食者鄙，未能远谋。」"),t("shi","evade","战则战矣，何必预设？","曹刿曰：「何以战？」")),r("齐人三鼓，君何以不许击之？",t("yi","hit","夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。","曹刿曰：「此吾之所以待之也。」"),t("li","reason","当先发制人。待其鼓而我鼓，则气已泄。","曹刿曰：「一鼓作气，再而衰。」"),t("shi","evade","鼓之先后，皆可战。","曹刿曰：「未可。」")),r("既胜，君何故下视其辙、登轼而望？",t("yi","hit","夫大国难测也，惧有伏焉。视其辙乱、望其旗靡，故逐之。","曹刿曰：「此吾之所以逐之也。」"),t("li","reason","胜则可逐，何必多疑？","曹刿曰：「夫大国难测也。」"),t("shi","evade","视与不视，皆一时之举。","曹刿曰：「一鼓作气。」"))],k("长勺战图",1,"你呈上长勺战图：齐师三鼓而鲁师不动。"),{success:"曹刿曰：「君可与言战矣。」",compromise:"曹刿曰：「君之言，可采。」",fail:"曹刿曰：「君亦肉食者之见也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_caogui_rou","肉食者鄙","court","yi",!1,"曹刿","鲁之将","曹刿曰：「肉食者鄙，未能远谋。」乡人曰：「肉食者谋之，又何间焉？」",[r("乡人之言，君以为何如？",t("yi","hit","不然。国之安危，匹夫有责。肉食者未必能谋。","曹刿曰：「此吾之所以请见也。」"),t("li","reason","然。谋者有其位，不在其位者不当与。","曹刿曰：「肉食者鄙，未能远谋。」"),t("shi","evade","与不与，皆有其时。","曹刿曰：「又何间焉？」")),r("肉食者果鄙乎？",t("yi","hit","未必尽鄙。然其居位日久，多循故事而不察实情。","曹刿曰：「此吾所以言也。」"),t("li","reason","鄙。朝中无人能远谋，故国屡败。","曹刿曰：「肉食者鄙。」"),t("ming","evade","鄙与不鄙，各在其人。","曹刿曰：「何以战？」")),r("布衣谋国，其言何由得达？",t("yi","hit","在君之能听。君能听，则布衣可近；不能听，则虽肉食者亦无益。","曹刿曰：「善哉！君知言之难矣。」"),t("li","reason","当由有司转达。布衣直谏，非国体。","曹刿曰：「请见。」"),t("shi","evade","达与不达，皆有其数。","曹刿曰：「肉食者鄙，未能远谋。」"))],null,{success:"曹刿曰：「君可与言谏矣。」",compromise:"曹刿曰：「君之言，半是。」",fail:"曹刿曰：「君亦以位论人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_caogui_qing","察狱","court","yi",!1,"曹刿","鲁之将","鲁庄公曰：「小大之狱，虽不能察，必以情。」曹刿曰：「忠之属也，可以一战。」",[r("察狱之情，何以能战？",t("yi","hit","民信其君，则效死而不去。此战之本也。","曹刿曰：「此吾所谓可以一战也。」"),t("li","reason","狱者内政，战者外事，二者不相关。","曹刿曰：「忠之属也。」"),t("shi","evade","情之察否，非一日可见。","曹刿曰：「必以情。」")),r("民之不信，虽胜亦危。君以为然乎？",t("yi","hit","然。胜而民散，是胜之而亡之也。","曹刿曰：「善哉！君知战之本矣。」"),t("li","reason","不然。胜则国强，民自归之。","曹刿曰：「何以战？」"),t("ming","evade","信与不信，皆外也。","曹刿曰：「一鼓作气。」")),r("战之本在民，其末在兵。二者可偏废乎？",t("yi","hit","不可。本立而末从，徒修其末则本拔。","曹刿曰：「此吾之所谓谋也。」"),t("li","reason","可偏。兵强者可以取胜，民自服。","曹刿曰：「肉食者鄙。」"),t("shi","evade","本末之序，各随其时。","曹刿曰：「一鼓作气，再而衰。」"))],null,{success:"曹刿曰：「君可与言本矣。」",compromise:"曹刿曰：「君之言，可采。」",fail:"曹刿曰：「君未察战之本。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ju={theme:"诡道与死节",intro:"兵者，诡道也。",debates:[f("v_xianzhen_gui","诡道","military","shi",!0,"先轸","晋之中军元帅","城濮之战，先轸曰：「楚师老矣，必败。」遂以诡道破之。",[r("兵者诡道，君以为何如？",t("shi","hit","然。兵不厌诈。拘于礼则败，达于变则胜。","先轸曰：「此吾之所以破楚也。」"),t("yi","reason","不然。以诈取胜，虽胜不武。","先轸曰：「兵者，诡道也。」"),t("li","evade","诈与不诈，皆视其势。","先轸曰：「楚师老矣。」")),r("诡道屡施，诸侯不复信晋，君不惧乎？",t("shi","hit","惧。故胜而后盟，以信补之。诈用于战，信用于盟。","先轸曰：「此吾之所以伯也。」"),t("yi","reason","大惧。信一失则诸侯不复与晋通。","先轸曰：「兵者，诡道也。」"),t("ming","evade","信与不信，非一战所能定。","先轸曰：「楚师老矣。」")),r("战之胜，在谋乎？在勇乎？",t("shi","hit","在谋。勇者谋之器，谋定而勇可用。","先轸曰：「善哉！君知兵矣。」"),t("yi","reason","在勇。勇者不惧，则无往不克。","先轸曰：「兵者，诡道也。」"),t("li","evade","二者相须，不可偏废。","先轸曰：「楚师老矣。」"))],k("城濮阵图",1,"你呈上城濮阵图：晋师蒙马以虎皮，先犯陈蔡。"),{success:"先轸曰：「君可与言兵矣。」",compromise:"先轸曰：「君之言，可采。」",fail:"先轸曰：「君之说，迂阔难行。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xianzhen_mian","免胄入狄","military","shi",!0,"先轸","晋之中军元帅","先轸怒晋襄公纵秦囚，不顾而唾。既而曰：「匹夫逞志于君而无讨，敢不自讨乎？」",[r("唾君之面，君以为可乎？",t("shi","hit","不可，然吾不得不为。吾言不行，则国事败。","先轸曰：「此吾之所以自讨也。」"),t("yi","reason","大不可。无礼于君，罪当死。","先轸曰：「不顾而唾。」"),t("li","evade","可与否，皆一时之忿。","先轸曰：「兵者，诡道也。」")),r("既唾君，何以免胄入狄师而死？",t("shi","hit","自讨也。君不讨我，我当自讨。死以明志，不失其节。","先轸曰：「此吾之所以死也。」"),t("yi","reason","不必死。谢罪于君，可全其身。","先轸曰：「匹夫逞志于君而无讨。」"),t("ming","evade","死与不死，皆有其数。","先轸曰：「免胄入狄师。」")),r("死节与成功，孰为重？",t("shi","hit","死节为重。功可后人成，节一失则不可复。","先轸曰：「善哉！君知将之道矣。」"),t("yi","reason","成功为重。身死则国失一将。","先轸曰：「吾为元帅，师不用命，是吾罪也。」"),t("li","evade","二者各有时。","先轸曰：「兵者，诡道也。」"))],null,{success:"先轸曰：「君可与言节矣。」",compromise:"先轸曰：「君之言，半是。」",fail:"先轸曰：「君犹以身为重。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xianzhen_qiu","纵囚","military","shi",!1,"先轸","晋之中军元帅","殽之战，晋获秦三帅。文嬴请而释之。先轸曰：「武夫力而拘诸原，妇人暂而免诸国。」",[r("君释秦囚，君以为何如？",t("shi","hit","失策。将士力战而获之，一朝释之，则将士寒心。","先轸曰：「此吾之所以怒也。」"),t("yi","reason","得策。释囚以结秦好，胜于拘之。","先轸曰：「妇人暂而免诸国。」"),t("li","evade","释与不释，皆有其势。","先轸曰：「武夫力而拘诸原。」")),r("既释而复追，可乎？",t("shi","hit","可。君命有所不受，况既悟其失？","先轸曰：「此吾之所以追也。」"),t("yi","reason","不可。君命已出，追之是二命也。","先轸曰：「不顾而唾。」"),t("ming","evade","追与不追，皆一时。","先轸曰：「兵者，诡道也。」")),r("将之怒，可施于君乎？",t("shi","hit","不可施于君，然可形于色。形于色者，冀君之悟也。","先轸曰：「此吾之所以唾也。」"),t("yi","reason","不可。臣之于君，当以礼自持。","先轸曰：「不顾而唾。」"),t("li","evade","怒之形否，皆外也。","先轸曰：「武夫力而拘诸原。」"))],null,{success:"先轸曰：「君可与言谏矣。」",compromise:"先轸曰：「君之言，可采。」",fail:"先轸曰：「君未察将士之心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Eu={theme:"将在军",intro:"将在军，君命有所不受。",debates:[f("v_rangju_jia","斩庄贾","military","shi",!0,"司马穰苴","齐之大司马","齐景公使庄贾监军。穰苴与贾约曰：「旦日日中会于军门。」贾素骄贵，夕时乃至。",[r("监军后期，当如何处之？",t("shi","hit","斩之。期而后至，是慢军令也。不斩则令不行。","穰苴曰：「此吾之所以斩贾也。」"),t("li","reason","当责而勿斩。监军者君之亲信，斩之伤君。","穰苴曰：「将在军，君命有所不受。」"),t("yi","evade","期而后至，各处其罚。","穰苴曰：「旦日日中会于军门。」")),r("君遣使持节赦之，君何以拒？",t("shi","hit","将在军，君命有所不受。令既出，不可中变。","穰苴曰：「此吾之所以拒也。」"),t("yi","reason","当受君命。君命大于军令。","穰苴曰：「将在军，君命有所不受。」"),t("li","evade","受与不受，皆有其时。","穰苴曰：「庄贾后期。」")),r("斩监军以立威，君以为过乎？",t("shi","hit","不过。威不立则令不行，令不行则兵不用。","穰苴曰：「此吾之所以用兵也。」"),t("yi","reason","过矣。立威于亲信，伤君之心。","穰苴曰：「将在军。」"),t("ming","evade","过与不过，后人自评。","穰苴曰：「斩庄贾。」"))],k("军门期图",1,"你呈上军门期图：日中立表，贾夕时乃至。"),{success:"穰苴曰：「君可与言军令矣。」",compromise:"穰苴曰：「君之言，可采。」",fail:"穰苴曰：「君之说，未达军中之法。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_rangju_jun","君命不受","military","shi",!0,"司马穰苴","齐之大司马","或问：「将在军，君命有所不受。其说如何？」",[r("君命与军令，孰为重？",t("shi","hit","在军则军令为重。战场瞬息，君命远至则失机。","穰苴曰：「此吾之所以言也。」"),t("yi","reason","君命为重。将者，君之臣也。","穰苴曰：「将在军，君命有所不受。」"),t("li","evade","择其利者而从之。","穰苴曰：「将受命之日则忘其家。」")),r("不受君命，其界限安在？",t("shi","hit","在军机。若涉国本、涉君身，则不可不受。","穰苴曰：「善哉！君知权之界矣。」"),t("yi","reason","当一切受命。将不可自专。","穰苴曰：「将在军。」"),t("ming","evade","界限之事，临事乃见。","穰苴曰：「斩庄贾。」")),r("将受命之日则忘其家，君以为然乎？",t("shi","hit","然。忘家然后能死国。","穰苴曰：「此吾之所谓将也。」"),t("yi","reason","不然。家且不能顾，何能顾国？","穰苴曰：「将受命之日则忘其家。」"),t("li","evade","忘与不忘，皆在一心。","穰苴曰：「将在军，君命有所不受。」"))],null,{success:"穰苴曰：「君可与言将道矣。」",compromise:"穰苴曰：「君之言，半是。」",fail:"穰苴曰：「君犹以君命为重。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_rangju_si","司马法","military","shi",!1,"司马穰苴","齐之大司马","穰苴曰：「以战止战，虽战可也。」",[r("以战止战，其说如何？",t("shi","hit","战者，不得已也。以一战而止百战，则战为仁。","穰苴曰：「此吾之所谓司马法也。」"),t("yi","reason","战不能止战，徒益其乱。","穰苴曰：「以战止战，虽战可也。」"),t("li","evade","止与不止，皆视其势。","穰苴曰：「将在军。」")),r("兵者，以仁为本乎？以利为本乎？",t("shi","hit","以仁为本。利者，仁之末也。","穰苴曰：「善哉！君知兵之本矣。」"),t("li","reason","以利为本。无利则兵不动。","穰苴曰：「以战止战。」"),t("ming","evade","仁利之间，临事乃见。","穰苴曰：「将受命之日则忘其家。」")),r("杀人安人，君以为可乎？",t("shi","hit","可。杀人所以安人，非好杀也。","穰苴曰：「此吾之所以言战也。」"),t("yi","reason","不可。以杀止杀，杀终不止。","穰苴曰：「杀人安人。」"),t("li","evade","安与不安，皆有其数。","穰苴曰：「以战止战，虽战可也。」"))],null,{success:"穰苴曰：「君可与言兵之本矣。」",compromise:"穰苴曰：「君之言，可采。」",fail:"穰苴曰：「君犹以战为常。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Su={theme:"一剑之任",intro:"齐强鲁弱，君其图之。",debates:[f("v_caomo_jie","劫盟","diplomacy","shi",!0,"曹沫","鲁之将","齐桓公与鲁庄公会于柯。曹沫执匕首劫齐桓公曰：「反鲁之侵地。」",[r("以匕首劫盟主，君以为可乎？",t("shi","hit","可。三战三北，鲁之社稷危，唯有此一途。","曹沫曰：「此吾之所以劫也。」"),t("yi","reason","不可。劫盟者失信于天下。","曹沫曰：「齐强鲁弱。」"),t("li","evade","可与否，皆成者之论。","曹沫曰：「反鲁之侵地。」")),r("桓公既许而欲背之，管仲谏而止。君以为何如？",t("shi","hit","仲之言是也。许而不背，则信立；信立则伯成。","曹沫曰：「此吾之所以得地也。」"),t("yi","reason","不当许。劫盟之约，何信之有？","曹沫曰：「齐强鲁弱，君其图之。」"),t("ming","evade","背与不背，皆在齐。","曹沫曰：「执匕首劫齐桓公。」")),r("既得地，君何故投其匕首，北面就群臣之位？",t("shi","hit","事已济矣。久挟则变生，退则全其身。","曹沫曰：「此吾之所以退也。」"),t("yi","reason","当持之，待齐尽返其地。","曹沫曰：「反鲁之侵地。」"),t("li","evade","退与不退，皆一时。","曹沫曰：「齐强鲁弱。」"))],k("柯之盟图",1,"你呈上柯之盟图：曹沫执匕首，齐侯失色。"),{success:"曹沫曰：「君可与言勇矣。」",compromise:"曹沫曰：「君之言，可采。」",fail:"曹沫曰：「君之说，非死士之言。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_caomo_bai","三战三北","military","shi",!1,"曹沫","鲁之将","曹沫为鲁将，与齐战，三战三北。鲁庄公惧，乃献遂邑以和。",[r("三战三北，君以为将之罪乎？",t("shi","hit","罪在我。兵不利，非士之过。","曹沫曰：「此吾之所以耻也。」"),t("yi","reason","非将之罪。齐强鲁弱，势所必然。","曹沫曰：「齐强鲁弱。」"),t("li","evade","罪之所在，后人自论。","曹沫曰：「三战三北。」")),r("败将而复用，君以为可乎？",t("shi","hit","可。败而知耻者，可用。耻者，勇之源也。","曹沫曰：「此吾之所以劫盟也。」"),t("yi","reason","不可。败将不可再用，士气不振。","曹沫曰：「三战三北。」"),t("ming","evade","用与不用，皆在君。","曹沫曰：「齐强鲁弱，君其图之。」")),r("败而劫盟以复地，君以为功乎？",t("shi","hit","功在鲁，耻在我。以耻易功，吾不为荣。","曹沫曰：「此吾之所以不言功也。」"),t("yi","reason","大功。复地者，将之责也。","曹沫曰：「反鲁之侵地。」"),t("li","evade","功与耻，皆外也。","曹沫曰：「三战三北。」"))],null,{success:"曹沫曰：「君可与言耻矣。」",compromise:"曹沫曰：「君之言，半是。」",fail:"曹沫曰：「君未察败者之心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_caomo_yong","一剑之任","military","shi",!1,"曹沫","鲁之将","或问：「一剑之任，可当百万之师乎？」",[r("一剑与百万之师，孰重？",t("shi","hit","在时。当百万之师不能救，则一剑为重。","曹沫曰：「此吾之所以用剑也。」"),t("yi","reason","百万之师为重。一剑者，匹夫之勇。","曹沫曰：「齐强鲁弱。」"),t("li","evade","二者各有时。","曹沫曰：「反鲁之侵地。」")),r("匹夫之勇与将帅之勇，何以别？",t("shi","hit","匹夫之勇，逞于一时；将帅之勇，谋定而后动。","曹沫曰：「善哉！君知勇矣。」"),t("yi","reason","无异。勇者不畏死而已。","曹沫曰：「执匕首劫齐桓公。」"),t("ming","evade","勇之类，不必细分。","曹沫曰：「一剑之任。」")),r("以死士之行而位列群臣，君自安乎？",t("shi","hit","不安。然所行之事，非得已也。","曹沫曰：「此吾之所以自处也。」"),t("yi","reason","安之。功成而位列，何不安？","曹沫曰：「反鲁之侵地。」"),t("li","evade","安与不安，皆在一心。","曹沫曰：「齐强鲁弱。」"))],null,{success:"曹沫曰：「君可与言勇矣。」",compromise:"曹沫曰：「君之言，可采。」",fail:"曹沫曰：「君犹以勇为匹夫之事。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Mu={theme:"百步穿杨",intro:"去柳叶者百步而射之，百发而百中。",debates:[f("v_youji_she","百步穿杨","military","shi",!0,"养由基","楚之将军","养由基去柳叶者百步而射之，百发而百中。左右皆曰善。",[r("百发百中，其道何在？",t("shi","hit","在习。手熟则心不摇，心不摇则矢无虚发。","养由基曰：「此吾之所以能也。」"),t("yi","reason","在天资。非人力所能强。","养由基曰：「百发而百中。」"),t("li","evade","熟与天资，皆有其分。","养由基曰：「去柳叶者百步。」")),r("有谓「善射者不可以尽射」，君以为然乎？",t("shi","hit","然。力有尽时，射亦有尽时。善藏其力者久。","养由基曰：「此吾之所以戒也。」"),t("yi","reason","不然。能射则射，何必藏？","养由基曰：「百发百中。」"),t("ming","evade","藏与不藏，各在其时。","养由基曰：「此吾之所以能也。」")),r("射之术与战之道，孰难？",t("shi","hit","战难。射者一人之技，战者万众之命。","养由基曰：「善哉！君知射之小矣。」"),t("yi","reason","射难。百发百中者，天下无几人。","养由基曰：「百发而百中。」"),t("li","evade","二者各有所难。","养由基曰：「去柳叶者百步而射之。」"))],k("柳叶图",1,"你呈上柳叶图：百步之外，叶叶可数。"),{success:"养由基曰：「君可与言射矣。」",compromise:"养由基曰：「君之言，可采。」",fail:"养由基曰：「君之说，未达射之髓。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youji_lu","射吕锜","military","shi",!0,"养由基","楚之将军","鄢陵之战，吕锜射楚共王中目。王召养由基，与之两矢，使射吕锜。",[r("王与两矢，君何故一矢而中还？",t("shi","hit","一矢足矣。留一矢以报王，示不虚其赐。","养由基曰：「此吾之所以还一矢也。」"),t("yi","reason","当尽用其矢，以备不虞。","养由基曰：「与之两矢。」"),t("li","evade","一矢两矢，皆可中。","养由基曰：「射吕锜。」")),r("一矢而中，君以为幸乎？技乎？",t("shi","hit","技也。幸不常至，技可常恃。","养由基曰：「此吾之所以能也。」"),t("yi","reason","幸也。战阵之间，中与不中，皆有其数。","养由基曰：「去柳叶者百步。」"),t("ming","evade","幸与技，不必分。","养由基曰：「百发百中。」")),r("善射者，可恃以胜敌乎？",t("shi","hit","不可。一人之射，不能当万众。恃技者必败。","养由基曰：「善哉！君知兵矣。」"),t("yi","reason","可。一箭中其将，则万众夺气。","养由基曰：「与之两矢。」"),t("li","evade","恃与不恃，皆视其势。","养由基曰：「射吕锜。」"))],null,{success:"养由基曰：「君可与言技矣。」",compromise:"养由基曰：「君之言，半是。」",fail:"养由基曰：「君犹以射为至。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youji_jie","善射之戒","military","shi",!1,"养由基","楚之将军","或谓养由基曰：「子善射，然不闻善射者之戒乎？」",[r("善射者之戒，何谓也？",t("shi","hit","戒在恃。恃其能则骄，骄则败。","养由基曰：「此吾之所以自戒也。」"),t("yi","reason","戒在惰。不习则手生。","养由基曰：「去柳叶者百步。」"),t("li","evade","戒与不戒，皆在一心。","养由基曰：「百发百中。」")),r("技之极处，何以自处？",t("shi","hit","以不足自处。自以为足，则技止矣。","养由基曰：「善哉！君知技之难守矣。」"),t("yi","reason","以有余自处。技既极，则当显之。","养由基曰：「百发而百中。」"),t("ming","evade","自处之道，各随其人。","养由基曰：「此吾之所以能也。」")),r("以技事君，与以道事君，孰久？",t("shi","hit","以道久。技有时而穷，道无时而尽。","养由基曰：「此吾之所以自愧也。」"),t("yi","reason","以技久。君之所用，正在其技。","养由基曰：「射吕锜。」"),t("li","evade","二者各有所宜。","养由基曰：「与之两矢。」"))],null,{success:"养由基曰：「君可与言守矣。」",compromise:"养由基曰：「君之言，可采。」",fail:"养由基曰：「君犹以技为至。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Au={theme:"力托悬门",intro:"有力如虎。",debates:[f("v_shuliang_men","偪阳托门","military","shi",!0,"叔梁纥","鲁之陬邑大夫","诸侯之师围偪阳。偪阳人启门，诸侯之士门焉。县门发，郰人纥抉之以出门者。",[r("悬门既下，君何故以手抉之？",t("shi","hit","门下有士，不尽出则尽死。吾手可断，士不可弃。","叔梁纥曰：「此吾之所以抉也。」"),t("yi","reason","当自保。一人之身，胜于数士。","叔梁纥曰：「县门发。」"),t("li","evade","抉与不抉，皆一时之决。","叔梁纥曰：「有力如虎。」")),r("以力救士，君以为将之道乎？",t("shi","hit","力者，将之余事。然当此之时，无力则无将。","叔梁纥曰：「此吾之所以为也。」"),t("yi","reason","非将之道。将者谋，不斗力。","叔梁纥曰：「有力如虎。」"),t("ming","evade","力与谋，各有时。","叔梁纥曰：「县门发。」")),r("力能托门，而终不能大用。君自谓如何？",t("shi","hit","力不足恃。吾以力闻，亦以力止。","叔梁纥曰：「此吾之所以自叹也。」"),t("yi","reason","时命耳。有勇如此，何患不用？","叔梁纥曰：「有力如虎。」"),t("li","evade","用与不用，皆有其数。","叔梁纥曰：「县门发，抉之以出门者。」"))],k("偪阳门图",1,"你呈上偪阳门图：悬门垂发，一士抉之。"),{success:"叔梁纥曰：「君可与言勇矣。」",compromise:"叔梁纥曰：「君之言，可采。」",fail:"叔梁纥曰：「君之说，非力者之言。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shuliang_li","力与德","court","yi",!1,"叔梁纥","鲁之陬邑大夫","或问：「力与德，孰重？」叔梁纥曰：「力不若德。」",[r("力与德，孰重？",t("yi","hit","德重。力者胜一人，德者服一国。","叔梁纥曰：「此吾之所以言也。」"),t("shi","reason","力重。无force则德无所施。","叔梁纥曰：「有力如虎。」"),t("li","evade","二者各有所用。","叔梁纥曰：「县门发。」")),r("以力闻者，何以自处？",t("yi","hit","以德济之。力而不德，则人畏而不亲。","叔梁纥曰：「此吾之所以教子也。」"),t("shi","reason","以力自处。有force则人莫敢犯。","叔梁纥曰：「有力如虎。」"),t("ming","evade","自处之道，各随其人。","叔梁纥曰：「力不若德。」")),r("君子之勇与匹夫之勇，何以别？",t("yi","hit","在义。义之所在则勇，不义则不为。","叔梁纥曰：「善哉！君知勇之本矣。」"),t("shi","reason","在胜。能胜人者，即为勇。","叔梁纥曰：「有力如虎。」"),t("li","evade","勇之类，不必细分。","叔梁纥曰：「县门发。」"))],null,{success:"叔梁纥曰：「君可与言德矣。」",compromise:"叔梁纥曰：「君之言，半是。」",fail:"叔梁纥曰：「君犹以力为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_shuliang_zi","教子","court","yi",!1,"叔梁纥","鲁之陬邑大夫","叔梁纥老而求嗣，祷于尼丘，得孔子。",[r("以力闻者，其子当以何教？",t("yi","hit","教之以学。力有时而穷，学无时而穷。","叔梁纥曰：「此吾之所以教仲尼也。」"),t("shi","reason","教之以力。父子相承，其业不坠。","叔梁纥曰：「有力如虎。」"),t("li","evade","各因其材而教。","叔梁纥曰：「祷于尼丘。」")),r("老而得子，君以为幸乎？",t("yi","hit","幸也，亦惧也。老不能教，则子无成。","叔梁纥曰：「此吾之所以及早教之也。」"),t("shi","reason","幸也。有子则业有所托。","叔梁纥曰：「祷于尼丘，得孔子。」"),t("ming","evade","幸与不幸，皆有其数。","叔梁纥曰：「力不若德。」")),r("力者之业，可以传乎？",t("yi","hit","力不可传，德与学可传。故当以学易力。","叔梁纥曰：「善哉！君知传家之道矣。」"),t("shi","reason","可传。习之则力亦渐长。","叔梁纥曰：「有力如虎。」"),t("li","evade","传与不传，皆有其势。","叔梁纥曰：「祷于尼丘。」"))],null,{success:"叔梁纥曰：「君可与言教矣。」",compromise:"叔梁纥曰：「君之言，可采。」",fail:"叔梁纥曰：「君犹以力为业。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ou={theme:"毁车为行",intro:"毁车为行，何如？",debates:[f("v_weishu_che","毁车为行","military","shi",!0,"魏舒","晋之正卿","晋荀吴伐无终及群狄于大原。魏舒曰：「彼徒我车，所遇又阨，请皆卒。」",[r("毁车为行，君何以决之？",t("shi","hit","地阨而敌徒。车不得行，则车为累。改车为卒，乃可战。","魏舒曰：「此吾之所以毁车也。」"),t("yi","reason","车者国之长技，不可轻废。","魏舒曰：「彼徒我车，所遇又阨。」"),t("li","evade","车与徒，各随其地。","魏舒曰：「请皆卒。」")),r("旧法既废，众心不安。君何以处之？",t("shi","hit","先自犯之，然后众从。吾为将，当先立于法中。","魏舒曰：「此吾之所以先自毁其车也。」"),t("yi","reason","当徐谕之，不可卒变。","魏舒曰：「毁车为行。」"),t("ming","evade","变法之事，各随其时。","魏舒曰：「请皆卒。」")),r("车战与步战，孰利于中国？",t("shi","hit","各随其地。平原用车，险阨用步，此兵之常。","魏舒曰：「善哉！君知兵之变矣。」"),t("yi","reason","车战利。车者，中国之长技。","魏舒曰：「彼徒我车。」"),t("li","evade","利与不利，皆视其敌。","魏舒曰：「毁车为行。」"))],k("大原战图",1,"你呈上大原战图：晋师弃车为步，五阵相属。"),{success:"魏舒曰：「君可与言变矣。」",compromise:"魏舒曰：「君之言，可采。」",fail:"魏舒曰：「君犹守旧法。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_weishu_fa","变法","military","shi",!1,"魏舒","晋之正卿","或问：「旧法可废乎？」魏舒曰：「法者，因时而立。」",[r("旧法可废乎？",t("shi","hit","可废，然不可骤废。先立其新，后去其旧。","魏舒曰：「此吾之所以变也。」"),t("yi","reason","不可。旧法者，先王所立，轻废则乱。","魏舒曰：「法者，因时而立。」"),t("li","evade","废与不废，皆视其势。","魏舒曰：「毁车为行。」")),r("变法者，何以服众？",t("shi","hit","以效服之。变法而胜，则众自服。","魏舒曰：「此吾之所以能变也。」"),t("yi","reason","以德服之。先正其身，然后变之。","魏舒曰：「法者，因时而立。」"),t("ming","evade","服与不服，皆有其时。","魏舒曰：「请皆卒。」")),r("法之立，在君乎？在将乎？",t("shi","hit","大法在君，临阵之法则在将。","魏舒曰：「善哉！君知法之分矣。」"),t("yi","reason","皆在君。将者，奉法而行者也。","魏舒曰：「毁车为行。」"),t("li","evade","二者各有所主。","魏舒曰：「彼徒我车。」"))],null,{success:"魏舒曰：「君可与言法矣。」",compromise:"魏舒曰：「君之言，半是。」",fail:"魏舒曰：「君犹守旧章。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_weishu_zu","五阵","military","shi",!1,"魏舒","晋之正卿","魏舒为五阵以相离，两于前，五于后，专为右角，参为左角，偏为前拒。",[r("五阵之设，其意安在？",t("shi","hit","在相离而相救。阵分则敌不能并击，阵联则一隅受敌而众救之。","魏舒曰：「此吾之所以为五阵也。」"),t("yi","reason","在合。阵合则力厚。","魏舒曰：「为五阵以相离。」"),t("li","evade","分合之间，各随其地。","魏舒曰：「毁车为行。」")),r("阵分之弊，在易为敌所各个击破。君何以处之？",t("shi","hit","以相属处之。阵虽分而令相通，则分而不散。","魏舒曰：「此吾之所以相离也。」"),t("yi","reason","当合而不分。分则力散。","魏舒曰：「两于前，五于后。」"),t("ming","evade","分合之弊，临阵乃见。","魏舒曰：「为五阵。」")),r("阵法与将令，孰为要？",t("shi","hit","将令为要。阵者形也，令者神也。","魏舒曰：「善哉！君知阵之本矣。」"),t("yi","reason","阵法为要。阵正则兵自用。","魏舒曰：「五阵以相离。」"),t("li","evade","二者相须。","魏舒曰：「请皆卒。」"))],null,{success:"魏舒曰：「君可与言阵矣。」",compromise:"魏舒曰：「君之言，可采。」",fail:"魏舒曰：「君犹以形论阵。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Tu={theme:"所不此报，无能涉河",intro:"所不此报，无能涉河。",debates:[f("v_xibo_an","鞍之战","military","shi",!0,"郤克","晋之上卿","郤克使于齐，齐顷公使妇人观而笑之。克怒，归而请伐齐。",[r("一笑之辱，君何以必报？",t("shi","hit","非为一身。辱使者，是辱晋也。不报则晋轻于诸侯。","郤克曰：「此吾之所以请伐也。」"),t("yi","reason","不必报。一笑之微，何至兴师？","郤克曰：「所不此报，无能涉河。」"),t("li","evade","报与不报，皆视其势。","郤克曰：「齐顷公使妇人观而笑之。」")),r("君之跛眇，人皆知之。为人所笑，君以为耻乎？",t("shi","hit","耻不在身，在国。身为使者，即国之面目。","郤克曰：「此吾之所以必报也。」"),t("yi","reason","耻在身。身之辱，不当以国报之。","郤克曰：「所不此报。」"),t("ming","evade","耻与不耻，皆外人之见。","郤克曰：「请伐齐。」")),r("鞍之战，齐师大败。君以为辱已雪乎？",t("shi","hit","雪矣，而未足。辱使者者，非独齐侯。","郤克曰：「此吾之所以逐之也。」"),t("yi","reason","雪矣。胜其师，足以报之。","郤克曰：「所不此报，无能涉河。」"),t("li","evade","雪与不雪，皆在一心。","郤克曰：「一笑之辱。」"))],k("鞍之战图",1,"你呈上鞍之战图：晋师逐齐侯，三周华不注。"),{success:"郤克曰：「君可与言耻矣。」",compromise:"郤克曰：「君之言，可采。」",fail:"郤克曰：「君之说，非使者之言。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_xibo_shi","使者之辱","diplomacy","shi",!1,"郤克","晋之上卿","或问：「使者受辱，当何以处之？」郤克曰：「使者之辱，国之辱也。」",[r("使者之辱，即国之辱乎？",t("shi","hit","然。使者衔君命而出，其面目即君之面目。","郤克曰：「此吾之所以必报也。」"),t("yi","reason","不然。一人之失，何关一国？","郤克曰：「使者之辱，国之辱也。」"),t("li","evade","关乎国与否，视其轻重。","郤克曰：「所不此报。」")),r("受辱于邻国，当以兵报之乎？以辞报之乎？",t("shi","hit","先以辞，辞不达则以兵。兵者，辞之后也。","郤克曰：「此吾之所以先请而后伐也。」"),t("yi","reason","当以辞。兵者国之大事，不可以怒兴。","郤克曰：「请伐齐。」"),t("li","evade","兵与辞，各视其势。","郤克曰：「一笑之辱。」")),r("怒而兴师，君以为可乎？",t("shi","hit","不可。怒者可暂，师出不可复。故必待其可胜。","郤克曰：「善哉！君知兵之难矣。」"),t("yi","reason","可。君之怒，即三军之怒。","郤克曰：「所不此报，无能涉河。」"),t("ming","evade","怒与不怒，皆在一心。","郤克曰：「请伐齐。」"))],null,{success:"郤克曰：「君可与言使矣。」",compromise:"郤克曰：「君之言，半是。」",fail:"郤克曰：「君犹以怒为兵。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_xibo_quan","专权","court","shi",!1,"郤克","晋之上卿","郤克为政，晋国多怨。或谓：「郤氏专，其祸将及。」",[r("权臣专国，其祸安在？",t("shi","hit","在身死而族灭。权不去则君疑，君疑则祸至。","郤克曰：「此吾之所以自警也。」"),t("yi","reason","在国弱。权在私家，则公室空。","郤克曰：「郤氏专。」"),t("li","evade","祸福相倚，非一言可尽。","郤克曰：「所不此报。」")),r("既知有祸，何以不去？",t("shi","hit","去则国无柱。留而任怨，犹胜于去。","郤克曰：「此吾之所以不去也。」"),t("yi","reason","当去。全身以图后效。","郤克曰：「郤氏专，其祸将及。」"),t("ming","evade","去与不去，皆有其数。","郤克曰：「请伐齐。」")),r("功高者与权重者，孰危？",t("shi","hit","权重者危。功可赏，权不可假。","郤克曰：「善哉！君知权之危矣。」"),t("yi","reason","功高者危。震主者不祥。","郤克曰：「所不此报，无能涉河。」"),t("li","evade","二者皆有其危。","郤克曰：「郤氏专。」"))],null,{success:"郤克曰：「君可与言权矣。」",compromise:"郤克曰：「君之言，可采。」",fail:"郤克曰：「君犹以功为恃。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Zn={cao_gui:$u,xian_zhen:ju,si_ma_rang_ju:Eu,lu_cao_mo:Su,yang_youji:Mu,lu_shu_liang_he:Au,jin_wei_shu:Ou,jin_xi_bo:Tu}});var Xn,eo=O(()=>{Xn={kong_zi:{v_kongzi_ren:{qs:["用德政来治国，就像北极星安居其位，群星都环绕着它。您能做到吗？","用政令引导、用刑罚整肃，百姓即使不敢犯法，却没有羞耻心。您怎么看？","君子的德行像风，小人的德行像草。您自认为，是风，还是草？"],opts:[["所谓德，不只是心地好。在上的与在下的人想的是同一件事，百姓不必强迫就会跟从。","先立好赏罚制度，让人知道什么受鼓励、什么受惩戒，德政才能推行。","关键在选对人。用对了人，事情就没有办不成的。"],["犯法而不觉羞耻，这不是小事。羞耻心是人自我约束的底线，刑罚管不到这里。","百姓只是不明事理；先立刑罚，然后才谈得上教化。","夏商周三代的政事，都是先刑罚后教化，您没听说过吗？"],["在上位的人一句说错，四方都会传开。自己德行不修，草就倒向他处。","我既不是风也不是草，我是夹在风与草之间的那个人。","人在什么位置，就尽什么本分，何必问谁是风谁是草？"]]},v_kongzi_li:{qs:["礼啊礼啊，难道只是指玉帛这些礼器吗？","如今的所谓孝，只说能养活父母。可是连狗和马都有人养活；不存敬心，拿什么区别？","您想让鲁国的百姓都懂得礼，该从哪里开始？"],opts:[["玉帛只是礼的外在形式。没有诚心却用礼器，那叫虚礼。","礼器既已失序，礼就没有寄托之处。先把礼器摆正，人心自然会跟上。","礼是先王定下的成法，照着做就是了，何必追问内心？"],["敬不在于脸色言辞。要看父母的心愿在哪里，顺着去成全。","让父母吃得饱、过得安，这就够了。","孝是天下通行的道理，不必教也会。"],["从士人开始。士人懂礼，百姓看着就会受感化。","从朝廷开始。上面喜欢什么，下面必定更厉害。","礼这东西，百姓自己会受感化，不必去催赶。"]]},v_kongzi_xue:{qs:["学了又能按时温习，不是很愉快吗？您觉得，学习的乐趣在哪里？","懂得它的人不如喜爱它的人，喜爱它的人不如以它为乐的人。您自居哪一等？","我曾经整天不吃、整夜不睡去空想，没有益处，不如学习。您认为对吗？"],opts:[["在弄明白道理。温习久了，忽然贯通，这种快乐不是外物能比的。","学成了就有俸禄，这个快乐最实在。","学习不必求快乐，求它有用就行。"],["我正在「喜爱」这一层，还达不到「以它为乐」。愿跟夫子学习。","先求懂得，喜爱和乐趣可以慢慢达到。","懂得就够了。喜爱与乐趣，不是治世必需的。"],["只空想不学习就会危险。我曾经困在这里，所以知道夫子的话不假。","独立思考才是自得的正路，何必什么都听别人的？","学与思都是求道的办法，不必分先后。"]]}},lao_zi:{v_laozi_wuwei:{qs:["硬要去做的会失败，硬要抓在手里的会失去。您还想有所作为吗？","百姓饥饿，是因为在上位的人收税太多。您若在高位，还收税吗？","柔弱能胜过刚强。您认为，治国的人应该柔弱吗？"],opts:[["做了不居功，成了不占位。用「不强求」的方式去做，就不会败。","什么都不做事情就全废了。国家一天也不能没有事做。","做与不做，都听其自然就是。"],["税太重百姓就饿。一层层减下去，减到无所强求，就接近无为。","没有税国家就没法养活自己。税应该轻，但不能废。","税轻税重，都不是根本问题。"],["天下没有比水更柔弱的，但攻坚克强的东西没有胜过水的。","用柔来守，用刚来断，两者都不能偏废。","柔弱的名声，只会被敌国轻视。"]]},v_laozi_fan:{qs:["循环是道的运动，柔弱是道的运用。您打算怎么用它？","功成了、名声到了就退位，这是天道。您退得了吗？","上等士人听了道努力去做，中等士人听了道将信将疑。您属于哪一等？"],opts:[["在强盛时想到衰败，在太平时想到动乱。想让它满上加满，不如适可而止。","强盛时应当进取，衰败时才想到退守。这是人之常情。","功成名就就退隐，这是天道。"],["退不是逃避。事业成了不占为己有，名声就丢不了。","功成了就该继续干下去，退了就前功尽弃。","退身是为自己的打算，不是为天下。"],["我不敢自居上士，但愿意努力去做。","道本来就难以理解，保持中等程度也足以自保。","道既然难懂，不如守着手艺、干好实事。"]]},v_laozi_zhi:{qs:["懂的人不说，说的人不懂。您既然来问，是懂，还是不懂？","不出门就知道天下事；不望窗外就能看见天道。这可能吗？","抛弃圣明和智慧，百姓反而得利百倍。您若执政，天下能治理好吗？"],opts:[["我来问，正是因为不懂。知道就是知道，不知道就是不知道，这才是真懂。","什么都不说，下面的实情就传不到上面，这不是治世的办法。","懂与不懂，都不必计较。做就是了。"],["走得越远，知道的反而越少。我曾走遍各国，还不如静坐一天想得明白。","不亲身经历，怎么知道事情难在哪里？","想知道天下，就该多派探子，怎么能闭门不出？"],["一旦立起圣贤的名目，争名声的人就多。抛开它，百姓就回归纯朴。","百姓什么都不知道就容易愚昧，愚昧就容易作乱。要教化才行。","弃智的政治，正好被强邻钻空子。"]]}},mo_zi:{v_mozi_jianai:{qs:["天下人都互不相爱，强的抢弱的，多的欺少的。您认为，治乱该从哪里下手？","我听说为政的人必须先立威。您觉得对吗？","如果天下人人兼爱，那君上和匹夫就平等了，岂不是乱的开端？"],opts:[["人人相爱就安定，互相憎恨就混乱。让每个人都把别国当自己的国、别家当自己的家看待。","先严明赏罚，让不爱人的人有所畏惧，爱就能慢慢培养起来。","亲疏本来就该有区别，爱有远近之分，这是天经地义。"],["威是末节。在上位的人不能爱护下面的人，威立得再大也长久不了。","不立威命令就没人执行，命令没人执行就乱。","威与爱并行不悖，何必偏向哪一边？"],["兼爱不是取消贵贱，而是让人不因为地位高就去伤害别人。","上下没有等级，政令就无从施行。","兼爱的主张太迂阔，根本行不通。"]]},v_mozi_feigong:{qs:["杀一个人叫不义，如今攻一个国家杀更多人，人们却称之为义。您说，这是为什么？","如今强国攻打小国，小国守不住。您会去救吗？","公输般为楚国造云梯，九次进攻，您九次守住。如今器械用尽，城的防御还在。楚王该怎么办？"],opts:[["把小的说成错、把大的说成对，这是名与实的混乱。","攻打国家是为了国家的利益，这和杀一个人不同。","用兵是国家大事，不能用小道理去约束。"],["救。不为小国，而是为天下的利益。","救小国而结怨强国，对国家不利。","两国相争，我何必掺和？"],["我知道您用什么办法对付我，我也知道您对付我的办法。但我的弟子禽滑厘等三百人，已经拿着守城器械在宋城上等楚国来犯了。","器械用完，楚国的军队还在，宋终究守不住。","守城的办法真能以一当十吗？"]]},v_mozi_jieyong:{qs:["宫室的标准：墙能挡风寒，屋顶能挡雪霜，里面能分男女之别。您觉得这过分吗？","国家要富强，应该以什么为先？","人人都说墨者自苦太过，不能作为天下的法度。您觉得对吗？"],opts:[["做到这些就该停手。不多花钱，不劳民。","天子的宫室应该有威仪，用来昭示天下。","宫室的制度都是先王定的法，岂能随便议论？"],["去掉没用的开销。没用的开销去了，用在百姓身上的就厚了。","充实府库，防备灾荒。","富国靠通商，不靠节俭。"],["自苦正是为了天下得利。如果人人都自苦而利天下，天下就安定了。","人伦的快乐不能废。自苦的主张违背人情。","苦和乐各随其志，不必强求别人。"]]}}}});var io,to=O(()=>{io={yan_ying:{v_yanying_ju:{qs:["齐国人本来就擅长偷盗吗？","楚国和齐国关系恶化，使者还有什么脸面站在这里？","天下即将合纵对抗强秦，齐国该跟随哪边？"],opts:[["我听说，橘树种在淮南就是橘，种到淮北就变成枳，叶子相似，果实的味道却完全不同。为什么？水土不一样。如今百姓生在齐国不偷盗，到了楚国就偷盗，莫非是楚国的水土让人善于偷盗？","那个齐人偷盗，自有他自己的罪。这是一个人的行为，不代表齐国的风气。","齐楚两国交好，不该因为一个人的罪名就互相猜疑。"],["出使四方，不辜负君主的使命，这是臣子的本分。如果楚国容不下我，我也不推辞。","两国交战，不斩来使。这是自古通行的道理。","楚国强而齐国弱，是福是祸还说不定。"],["合纵则彼此的信用难以长久，连横则容易孤立。齐国应该守住边境、观望局势。","不用信用维系，合纵就会散伙；只靠利益结合，连横也不牢固。齐国应该先讲信、后谈利。","齐国的事，齐君自己决定，使者不该越权。"]]},v_yanying_tao:{qs:["三位武士对君主无礼，您认为该杀吗？","如果杀了他们，恐怕会失去人心。您有什么办法？","三人已死，齐国失去了三位勇士。您不担心吗？"],opts:[["勇猛却不懂礼的人，是国家的祸患。不杀，群臣都会跟着学。","三人对齐国有功，不能因为失礼就杀。","等他们自己败亡就行，何必由君主动手？"],["拿两个桃子赏给三个人，让他们自己论功领赏。一争就乱，一让就死。","当众斥责他们失礼，让他们自己知道羞耻。知道羞耻就会自己退让，不必动刀。","用实力制服他们，公开定罪，何必顾虑人心？"],["失去三个勇士，换来众人的心。勇士可以再找，不懂礼的勇士不能留。","三位武士一死，齐国没有良将，邻国必然起觊觎之心。","死者已矣，不必再议。"]]},v_yanying_jian:{qs:["臣子不行礼就直言进谏，这样可以吗？","君主沉迷酒宴，臣子屡次进谏都不听。该怎么办？","臣子侍奉君主，忠心和智慧哪个更重要？"],opts:[["我之所以不行礼，是因为君主七天不上朝，我没有地方行礼。","朝廷的礼节不能废。先行礼再进谏，才算得体。","礼是小节，纠正君主的过失才是大事。"],["君主有过错就劝谏，不听就离开。我没有离开，是为了全国的百姓。","顺着他的喜好，慢慢引导，可以渐入佳境。","君主的过失，不是臣子能纠正的。听他自己醒悟吧。"],["没有智慧的忠心，恰恰会害了君主。智慧，正是用来践行忠心的。","忠是根本。智是为忠服务的，不能本末倒置。","两者不能兼得的话，宁可舍智取忠。"]]}},guan_zhong:{v_guanzhong_canglin:{qs:["百姓贫穷的时候，就教他们礼，可行吗？","想让国家富强，应该以什么为先？","士农工商四种人分开聚居、各守本业。您觉得怎么样？"],opts:[["不行。肚子吃不饱的人不懂礼，身上不暖的人不顾体面。先让他们吃饱，礼自然兴起。","礼是人自我约束的东西。贫穷却知礼的人，自古就有。","贫富和礼义，互不相干。"],["先流通货物、积累财富。物价的权柄握在官府手里，府库充实，百姓也不困乏。","减轻赋税、放宽徭役，让百姓自己富起来，国家自然富足。","富国靠开疆拓土。夺取别国的利益，胜过自己苦干。"],["各安本业，手艺就精。士人的儿子一直是士，工匠的儿子一直是工匠，事情就不会荒废。","人的才能各不相同，强行划分行业，才能就被埋没了。","让百姓自己选职业，何必分区居住？"]]},v_guanzhong_zunwang:{qs:["周王室衰微，诸侯不来朝见。您凭什么尊奉它？","戎狄侵犯燕国，邢国卫国相继告急。齐国该救吗？","霸业既成，您的名位该怎么摆？"],opts:[["尊它的名号，借它的号令。诸侯朝拜齐国如同朝拜周天子，齐国就有了霸主之名，却没有篡位之实。","用实力吞并诸侯就行，何必借周王室的名号？","周室衰微是天意，与齐国何干？"],["救。攘除夷狄是诸侯共同的期望。救了，名望就归齐国。","远路救燕，劳师费财，得不偿失。","各国自守边境，何必齐国去救？"],["恪守臣子的本分，不越礼制。名分一旦破坏，天下人都可以用实力抢夺。","功高的人就该受上赏，即使用天子的礼节也可以。","名位是虚的，不必计较。"]]},v_guanzhong_penqiu:{qs:["治理国家，应当频繁更改法度吗？还是守住不动？","如果大臣专权，君主该怎么处置？","君主好奢华而百姓贫困，您觉得可以吗？"],opts:[["法不能频繁更改。改多了百姓就糊涂，百姓糊涂奸诈就生。","时代变了法度就要跟着变。守着旧法的人，必被新情况困住。","法度能不能行，全在用人。用人得当，法自然完善。"],["分散他的权力，但不夺他的职位。权分了就无法独揽，位子留着也不致生怨。","专权的人该杀。不杀，君权就旁落。","以礼相待，他自己会感恩。"],["在上的欲望必须有度。君主多占一分，百姓就要困苦十分。","君主的威仪不能损，百姓的贫富自有定数。","君与民各尽本分而已。"]]}},zi_chan:{v_zichan_xing:{qs:["叔向说「百姓知道条文，就不会再敬畏上位」。您怎么看？","百姓知道了争执的依据，诉讼必然增多。诉讼一多国家就乱，您怕吗？","君主使唤臣子、臣子侍奉君主，靠礼，还是靠法？"],opts:[["法律明文公布，百姓就知道什么能做什么不能做。上位的人不能再凭喜怒定轻重，这是治国的根本。","礼能在事情发生之前禁止，法只能在事情发生之后制裁。丢礼用法，是舍本逐末。","刑书已经铸了，收不回来，何必多说？"],["诉讼多，正因为是非有了标准。没有条文，官吏才能任意妄为，那才是大害。","最好是没有诉讼。用礼引导百姓不去争，胜过给他们评理。","诉讼的多少，看官吏的贤能与否，不在刑书。"],["以法为辅助，以礼为根本。两者不能偏废。","礼能感动人，法能约束人。治世应当先感动人。","上下名分清楚，礼法都用不上。"]]},v_zichan_xiangxiao:{qs:["百姓聚在乡校议论朝政的得失，您认为该毁掉它吗？","百姓的怨气积累起来，是堵住好，还是疏导好？","为政宽厚，还是严厉？"],opts:[["为什么要毁掉？他们赞成的，我就去做；他们反对的，我就改掉。乡校是我的老师，为什么要毁掉它？","平民议论朝政，上位者就没有威严，政令无法推行。该毁。","听他们说说而已。议论久了，自然会停。"],["疏导。就像治水，堵住河道一旦决口，伤人必定很多。不如开个小口让水流走。","堵住，怨气藏在下面，爆发时无法收拾。应该早断源头。","百姓的怨气，跟国家无关。听它自己消散吧。"],["宽仁难做。只有有德的人才能用宽服众，其次不如用猛。火猛烈，人看着就怕，所以很少有人被烧死。","宽厚才能得民心。百姓感激恩德，自然不做坏事。","宽严随时势而定，不必死守一种。"]]},v_zichan_xin:{qs:["晋国弱了、楚国强了，背弃晋国投靠楚国，您觉得行吗？","小国的存亡，靠信义，还是靠实力？","有百姓却没有信义，还算有国家吗？"],opts:[["盟约靠信义维持。一旦背弃，天下就再没有国家愿意跟郑国结盟。强邻压境固然可怕，信义更不能丢。","小国夹在两强之间，应该跟强者走。信义敌不过形势。","两边都不得罪，自己守好自己的地盘，信义和形势都不必管。"],["靠信义。有信义，别国才会来支援；没信义，众人都会抛弃你。","小国没信义就孤立，但没军队也得亡。两边都要修。","小国的存亡，看邻国的意思，不由自己。"],["没有信义，百姓就无法互相依靠。就算有城墙有军队，也守不住。","百姓跟着君主是为了利益。信义靠不住，有利就行。","信义是虚名，国力才是根本。"]]}},sun_wu:{v_sunwu_guidao:{qs:["用兵之道在于诡诈。能打却装作不能打，要打却装作不打。您怎么看？","「不经交战就让敌人屈服」和「百战百胜」，哪个更好？","了解敌人也了解自己，百战都不会有危险。如果两边都不了解，该怎么办？"],opts:[["近处装作在远处，远处装作在近处。用小利引诱，趁乱攻取。这些是兵家的诀窍，事先定死了教条就不管用。","诡诈是欺骗敌人。但失信于天下，最终会损害自己。","用兵贵在实力。向敌人示弱，恐怕先挫了自己的士气。"],["不经交战就让敌人屈服，才是最好的。百战百胜，还不是最高明的。","不战而胜，敌人并没有心服，日后必会再来。","「保全敌国而取胜」是上策，「攻破敌国」是次一等的。"],["不了解敌人也不了解自己，每战必有危险。所以要先创造不被战胜的条件，再等敌人露出破绽。","既然不了解，就不能开战。应该赶紧退兵保全军队。","不了解就该用间谍。间谍是用兵的要务。"]]},v_sunwu_zhong:{qs:["君王的命令和军中的将令相冲突时，将军该听谁的？","久战而百姓疲惫，君主想退兵，将军不肯。您怎么看？","吴军攻入郢都，五战全胜。如今楚人重新聚集，您打算怎么办？"],opts:[["听将令。战场上瞬息万变，等君王的命令传到，时机早就没了。","听君王的命令。君是国的主宰，将军不能独断。","哪个有利听哪个。"],["用兵贵在速胜，不在持久。如果胜利在望，不该退；如果打不赢，就该早退。","百姓是立国之本。百姓疲惫还要打仗，就算胜了也危险。","打仗的利弊，只有将军清楚。君主不必过问百姓。"],["想打赢仗，先要让自己立于不败之地。现在应当整军防守，不能贪功冒进。","应当乘胜追击，一举灭掉楚国。","既然已经进了郢都，就该收拢楚国的民心，兵事可以缓一缓。"]]},v_sunwu_shi:{qs:["湍急的水流能冲走石头，靠的是「势」。势要怎么造成？","以正面迎敌、以奇兵取胜。奇与正的变化，有没有穷尽？","用兵没有固定的态势，水流没有固定的形状。您把什么当作「不变」？"],opts:[["拉满的弩弓蓄势，扣动的弩机发机。积蓄得越久，发得越猛。","势是众人合力。兵多就能成势。","势是天定的，人力造不出来。"],["奇与正互相转化，像圆环一样没有起点和终点，谁能穷尽它？","正是常规，奇是变化。守着常规等变化就够了。","人人都知道我取胜的形状，却不知道我是怎么形成那个形状的。"],["「能随敌人变化而取胜」就是不变的常道，这叫做神。","只有「义」是不变的。兵虽诡诈，终究不能行不义之事。","只有「利」是不变的。用兵的方向，就在利益。"]]}},fan_li:{v_fanli_gongcheng:{qs:["功业已成便抽身而退，您认为这是明智吗？","如果不走，真的会有祸患吗？","文种没有走，最后被赐剑而死。是他的智慧不如您吗？"],opts:[["飞鸟打尽了，良弓就被收起来；狡兔死光了，猎狗就被烹杀。越王的脖颈细长、嘴像鸟喙，能共患难，不能共安乐。","君臣的名分，应当有始有终。功成而走，算不上忠。","走与不走都有定数，何必计较明智不明智？"],["一定有。名声太高的人危险，功劳太大的人被猜忌。","越王曾卧薪尝胆，必定不会亏待功臣。","祸福没有门路，全是人自己招来的，何必提前担忧？"],["不是智慧不如我，是他放不下。他自恃有功，不肯走罢了。","文种死于忠心，不是愚笨。忠臣本就不该避死。","死生有命，不是人能左右的。"]]},v_fanli_zhisheng:{qs:["干旱时备船，水涝时备车。您觉得对吗？","三次赚到千金，又三次全部散掉。您怎么看？","囤积货物等涨价，和快速周转获利，哪个更好？"],opts:[["反着来。别人抛弃的我买入，别人争抢的我卖出。这是经营的根本。","提前防备是对的。但囤积居奇，不是仁者该做的。","市价有它的规律，随行就市买卖就行，何必反着算？"],["财富是天下的公物。聚而不散会招祸，散而不聚就没法帮人。","散财是义举。但得先富起来，才有得散。","聚散都有定数，不必刻意为之。"],["周转为上。钱财要像流水一样流动，囤着不动就死了。","囤积是等待时机。时机一到，利就翻倍。","两者都是生意经，看时候选。"]]},v_fanli_chiyying:{qs:["国家危难，该怎么稳定局面？","委屈自己侍奉仇敌，您觉得可耻吗？","吴国既然赦免了越国，越国当务之急是什么？"],opts:[["「持满」要靠天时，「定倾」要靠人事。用谦卑的言辞、丰厚的礼物去侍奉对方，顺着他的欲望，然后再图谋恢复。","危难之际只有死战。","用诚信感动人，再强的敌人也会服。"],["耻辱只在一时，保住社稷才是一世。为逞一时之快而亡了宗庙，不值。","君主受辱，臣子当死。委屈事仇，不是人臣能忍的。","屈与不屈，都是亡国之道，何必选择？"],["先让百姓富起来。民富兵就强，兵强才能图谋复仇。","先练兵。兵没练强就动手，是第二次失败。","先修德。德修了民心就归附，兵不用练也能用。"]]}}}});var ao,so=O(()=>{ao={wu_zixu:{v_zixu_chou:{qs:["以臣子的身份向君主复仇，可以吗？","挖开坟墓鞭打尸体，您觉得过分吗？","如果仇人已经死了，而仇人的后代还在朝中，您还要复仇吗？"],opts:[["君主杀了我的父兄，是君主先断了这层恩情。恩情断了，道义也就断了，为什么不能报？","君主即使无道，臣子也不能向君主复仇。这是根本的伦常。","仇可以报，但要用正当的方式，不该借别国的兵力。"],["伤害不到他本人，所以只能鞭他的尸体。我要的，是让他偿还罪行。","人死了就过去了。鞭尸只是发泄愤怒，不是义举。","尸体没有知觉，鞭打没有任何用处。"],["仇恨不除根，必定会再生。应该趁他还没壮大就动手。","灾祸不牵连后代。仇人已死，仇就算报了。","复仇要量力而行。做不到，就先放一放。"]]},v_zixu_jian:{qs:["越国和齐国，哪个才是吴国的祸患？","忠言进谏而不被听从，您打算怎么办？","君王赐下属镂之剑，命您自杀。您打算怎么办？"],opts:[["越国是心腹大患，齐国只是皮癣。打齐国而把越国留在外头，必成后患。","齐国又大又富，拿下它能让吴国更强。越国偏远弱小，不值得担心。","应该用德行降服他们，重点不在挑哪个敌人。"],["进谏不被听，就慢慢再来。不能走——我走了，就没人再进谏了。","不听就走。留下来没有用处，只会招来灾祸。","进谏是尽我的心，听不听在君主。"],["接剑而死。死前留言：把梓树种在我坟上，让它长成做棺材的材料；再把我的眼睛挖出来挂在吴国东门上，亲眼看越军进城灭吴。","不该接剑。既然知道吴国要亡，就该离开，等待时机。","死生有命。接与不接，吴国都要亡。"]]},v_zixu_ben:{qs:["父兄被杀，您该一起赴死，还是逃亡？","借别国的兵去打自己的祖国，您不怕被天下人非议吗？","昭关的官吏抓您抓得很紧。您打算怎么脱身？"],opts:[["白白死了没有用处，不如逃出去以后再想办法。我不是怕死，是怕死了也没用。","父兄死了做儿子的却逃走，是不孝。应该一起死。","走和留都没有用，何必计较？"],["我要追究的是一个人的罪，不是要攻打楚国，是要除掉那个贼。","祖国不可以攻打。就算仇在某人身上，楚国本身无罪。","是非的评判，留给后世去说。"],["一夜白了头，改换容貌逃出去。急到极点，智慧就生出来了。","用钱财贿赂关吏，可以脱身。","天不会绝人的路，自然会有办法。"]]}},zhu_zhiwu:{v_zhuzhiwu_pei:{qs:["郑国灭亡而秦国得到好处，您觉得有利吗？","晋国和秦国一向交好，您却和郑国结盟，不怕晋国吗？","郑国保住了，往后该怎么侍奉秦国？"],opts:[["越过别的国家去占领远方的土地，您知道这有多难。灭了郑国只是让邻国得利——邻国强了，就是您弱了。","灭郑合乎道义。既然已经结盟，就不能背弃。","兵已经到了城下，说什么都没用了。"],["晋国曾经答应给您焦、瑕两座城，早上渡河回国，晚上就修墙设防。晋国的贪欲哪有满足的时候？它既然在东边把郑国当边界，又想往西边扩张。","晋秦两国的交情不是一天两天了。您背弃它，天下人会怎么说您？","晋国的野心，您自己清楚，不必我说。"],["郑国愿意做东方道路上的主人，秦国使者往来经过，郑国供应他们的食宿不足。","郑国应当坚守自己的道义，不只依附一个国家。","侍奉秦国也好、晋国也好，都不是长久的办法。"]]},v_zhuzhiwu_ci:{qs:["您年纪大了，还能为国出使吗？","郑伯说「我不能早点重用您，如今危急了才来求您，这是我的过错」。您怎么回答？","游说的关键在哪里？"],opts:[["人老了，见识还在，为什么不能出使？我推辞是谦让，不是不能。","老人就该安享晚年。国家大事，交给年轻人。","能不能行，试了才知道。"],["君主既然明白了自己的错，就不必再推辞。国家危险了，怎么能不去？","君主既然道了歉，臣子就该尽忠。年纪再大也不推辞。","再三推让，好保全君主的脸面。"],["在讲清利害，不在争辩是非。敌国的人未必听道义，但一定听利益。","在打动人心。人心一动，事情就成了。","在显示威势。没有威势，说什么都不听。"]]},v_zhuzhiwu_li:{qs:["用利益去说服别人，可以吗？","郑国既侍奉秦国又侍奉晋国，您觉得能长久吗？","郑国最终被晋国吞并。您的谋划，算是成功了吗？"],opts:[["小国没有资格谈义，只有利益可以依靠。讲道义太迂远，讲利益才能打动人。","不可以。人人讲利益，就没有人再讲道义了。","利和义并行，看时候用。"],["两头依附，就两头都不亲。但小国夹在中间，不两头依附就没法自保。","应该选定一个跟到底，忠信不二。","能不能长久，不是人能谋划的。"],["谋划救的是一时的危难。郑国的灭亡是几百年后的事，不是我的谋划失了效。","谋划没有善终，就算不上成功。","国家的存亡有定数，不是一个使者能改变的。"]]}},zhuang_zi:{v_zhuangzi_xiaoyao:{qs:["神龟死了三千年，楚王用锦缎包着、竹箱装着，供奉在庙堂上。这只龟，是宁愿死了留下骨头显贵呢？","大鹏飞往南海，翅膀拍起三千里水花。蜩和学鸠讥笑它。您觉得谁对？","夫子您的主张，天下没有人能容纳。您不担心吗？"],opts:[["宁愿活着，在泥里摇尾巴。我就要做那只拖着尾巴在泥里爬的龟。","死了显贵，胜过活着卑贱。庙堂的显赫，人人都想要。","生与贵各有各的好，何必挑选？"],["它们都依赖着什么。鹏依赖风，鸠依赖树枝，都不算真正的逍遥。","鹏志在千里，鸠安于一枝，鹏是对的。","大小各适其性，无所谓对错。"],["不能容纳又有什么关系？正因为不能容纳，才见得是正道。再说天地这么大，何止一个容身之处？","主张行不通，就先修养自己，等待时机。","道本来就不求被人容纳，容纳了反而失去本真。"]]},v_zhuangzi_qiwu:{qs:["你不是鱼，怎么知道鱼的快乐？","天下没有比秋毫的末梢更大的，而泰山反而算小。您觉得对吗？","从前庄周梦见自己变成蝴蝶，翩翩飞舞。不知是庄周做梦变成蝴蝶，还是蝴蝶做梦变成庄周？"],opts:[["你不是我，怎么知道我不知道鱼的快乐？","鱼的快乐本来就无从知晓。你的话没有根据。","快乐是人自己知道的，不必争辩。"],["从道的高度看，万物没有贵贱之分。大小的区别，只是外形上的。","泰山当然比秋毫大，人人都看得见。这个说法讲不通。","大小之辩，对治国没有益处。"],["这叫「物化」。庄周和蝴蝶必定有分别，但这个分别无从知晓。","醒来就分清了，有什么可怀疑的？周是周，蝶是蝶。","做梦和醒来，跟治国没有关系。"]]},v_zhuangzi_wuyong:{qs:["没有用的树，为什么反而长寿？","人人都追求有用，唯独您主张无用，为什么？","处在「有用与没用之间」，您觉得怎么样？"],opts:[["正因为它不成材，才能活这么久。这就是「没有用的用处」。","没用就会被抛弃，被抛弃就活不成。","成材不成材，都不是道。"],["有用的人被人役使，没用的人保全自己的天性。","没用就没功劳，没功劳就没地位。","有用没用只是个名目，何必计较？"],["还不够。材与不材之间，看起来合适，其实还是免不了受牵累。","这是中庸之道，可以了。","两者之间可以自保，何必再求别的？"]]}},meng_zi:{v_mengzi_yili:{qs:["何必开口就说利益？只要有仁义就够了。您觉得对吗？","如今强国的军队压在边境，讲仁义退不了敌。您打算怎么办？","人人都有不忍心伤害别人的心思。您觉得对吗？"],opts:[["上面讲利、下面讲利，全国上下争着逐利，国家就危险了。万乘之国里，杀掉君主的必然是千乘之家。","国家没有利益就无法存在。仁义只是装饰。","义和利并行，不必偏向哪一边。"],["用仁义稳固自己的百姓，百姓拼死也不肯离开，再强的敌人也打不进来。","敌人来了就用兵抵挡。在战场上讲仁义没有用。","战还是和，看形势，不必打着仁义的旗号。"],["突然看见小孩要掉进井里，人人都会惊惧怜惜。这不是为了交情，也不是为了名声。","人心本来就是自私的。所谓不忍心，都有所企图。","心的善恶不必讨论。行为善良就够了。"]]},v_mengzi_rensheng:{qs:["生命和道义不能兼得的时候，您选哪个？","推行正道却被驱逐，您觉得义吗？","你从前不接受优厚的馈赠，如今却接受了较薄的。为什么？"],opts:[["取义。我想要的还有比生命更重要的，所以不能苟且偷生。","取生。人死了，道义靠谁去践行？","要看当时的情况，不能一概而论。"],["义在我做的事里，不在我做得成做不成。道行不通，不是我的罪。","被驱逐就该改弦更张，好让主张行得通。","行与不行，都有天命。"],["有原因的才接受。按正道来的，可以收；来路不正的，不能收。","金子都一样，还挑什么？收下就是。","接受与不接受，都是小事，不必讲究。"]]},v_mengzi_wangdao:{qs:["想施行王政，该从哪里开始？","百姓有固定的产业才有安定的心，没有产业就没有安定的心。您觉得对吗？","王道成功，拿什么来验证？"],opts:[["先给百姓固定的产业。百姓没有稳定收入，就没有安定的心思。","先立制度、严明赏罚。","先修军备。没有兵，再好的政令也守不住。"],["没有固定产业却有安定之心的，只有读书人能做到。普通百姓没有产业，就没有安定的心。","百姓作乱不全是因为穷。教化也能让人安定。","治乱有天数，不是人力能完全决定的。"],["老人穿丝吃肉，百姓不冷不饿，这样还不能称王的，从来没有过。","府库充实、兵器锋利，王道就成了。","验证有什么用？去做就是了。"]]}},xun_zi:{v_xunzi_xing_e:{qs:["人的本性是恶的吗？还是善的？","既然说性恶，那礼义是从哪里来的？","性恶的说法，天下人必然非议。您不怕吗？"],opts:[["性恶。眼睛贪看美色，耳朵贪听音乐，嘴贪吃美味，心贪图利益，都出自本性。必须靠师法和教化才能纠正。","本性是善的。怜悯之心，人人都有。","性的善恶不必争论。教育可以让人为善。"],["出自圣人的「人为努力」。圣人改造本性、建立人为规范，所以立下礼义来纠正人。","礼义本来就出自人心，不是外加的。","礼义是先王的成法，照着做就行。"],["不怕。我讲的是道理，不是人情。知道人性恶，才能去改造它。","就算讲的是实情，也伤人心。不能不怕。","是非留待后人，何必争一时？"]]},v_xunzi_tian:{qs:["天象变异，可怕吗？","人应当听天由命，还是掌握自然的规律来运用它？","既然不相信鬼神，为什么还要举行祭祀？"],opts:[["觉得奇怪可以，害怕就不必了。自然运行有常轨，不因为尧才存在，不因为桀就消失。","天变就是上天的警示。君主应当修养德行来回应。","天变的事无法预知，不必讨论可怕不可怕。"],["掌握它、运用它。天有时令，地有物产，人有治理——这叫能与天地相配。","人应当顺应天。违逆天必败。","天与人各行其道，不必相干。"],["君子把祭祀当文饰，百姓把它当神事。行礼是为了表达敬意，不是为了求福。","祭祀寄托人心，不能废除。","既然不信，废掉就是了。"]]},v_xunzi_li:{qs:["治国，礼在先还是法在先？","「路上的普通人都能成为大禹」，您觉得对吗？","君主和老师，哪个更重要？"],opts:[["礼是法的总纲、条例的准绳。没有礼，法就没有依据。","法令明确，百姓才知道躲避什么。礼太缓，不够切用。","两者相互依存，不必分先后。"],["对。普通人有可以理解的资质、可以做到的能力，只等师法教化。","人有上下智愚之分，路上的普通人怎么可能成为圣人？","能不能成为，在于自己努力，何必下定论？"],["国家要兴盛，必先尊师重教。老师，是人的楷模。","君主是一国之主，老师不过是一个人。","两者各有各的名分，不能相比。"]]}},han_fei:{v_hanfei_fa:{qs:["治国以法为主，您觉得对吗？","「术」和「法」，哪个更关键？","君臣之间，靠什么确立君主的威势？"],opts:[["法明确了，国内就公平；法不明确，奸臣就窃取权柄。","光靠法不够。人主治国，还要以德感人。","法与德并行，何必偏执一端？"],["法是公开的，术是隐藏的。法公布给大众，术在宫内驾驭群臣。两者缺一不可。","法公布于众，人人看得见，君主不必用术。","有威势就够了。有势，法自然能推行。"],["权势不能交给别人。剪除他的私党、拒绝他的私请，威势自然在君主手里。","信任臣子如同信任自己，何须防备？","威势的有无，看国势强弱，不在术的得失。"]]},v_hanfei_wudu:{qs:["儒生和游侠，是国家的蛀虫吗？","时代变了，事情就变了；事情变了，措施就要跟着变。您觉得对吗？","君主的祸患，在于轻信别人吗？"],opts:[["都是蛀虫。儒生用文章扰乱法度，游侠用武力违犯禁令，而君主还礼遇他们，这就是乱的根源。","儒侠都是贤者，哪里是蛀虫？","是不是蛀虫，要看他们的行为，不能一概而论。"],["守株待兔的人不是蠢，而是不知道变通。今天还想用先王的政策治理当今的百姓，都是守株待兔一类。","先王之道，万世不变。怎么可以轻改？","变与不变，看形势而定。"],["在轻信。信任了别人就被别人控制。信任人，就必须有办法验证他。","不信任臣下，就没人可用。","信与不信，看那个人贤不贤。"]]},v_hanfei_maodun:{qs:["「用你的矛刺你的盾」会怎样？","现在有人说「贤者不必任用，任用的不必贤」。您怎么看？","主张法术的人，为什么往往不被当世的君主容纳？"],opts:[["那个人答不上来。无坚不摧的矛和什么都能挡的盾，不可能同时成立。","这是玩笑话，跟治国有什么关系？","一个人的夸口，不必深究。"],["这同样自相矛盾。既然看重他的贤能，就不该再怀疑他不贤。","贤与用本来是两回事。任用看才能，贤能看修养。","言语的得失，不必句句争辩。"],["法术之臣，必定触犯君主的私利。君主想徇私，所以厌恶法。","法术严酷，失了民心，所以不被容纳。","时机不好，不是法术的错。"]]}}}});var no,oo=O(()=>{no={zi_gong:{v_zigong_cunlu:{qs:["齐国攻打鲁国，鲁国弱小撑不住。您怎么救它？","劝齐国去打吴国，是把祸水引给邻居。您不怕天下人非议吗？","鲁国保住了，齐吴晋越四国都动了起来。您的计策，好处到底在哪里？"],opts:[["不救鲁国才是救鲁国。去劝齐国把兵力转向吴国，鲁国自然就安全了。","应当联合诸侯一起救鲁国，向天下表明大义。","不如侍奉齐国以求自保。"],["我的目标是救鲁国。齐吴之间的战祸不是我挑起的，是他们自己好战。","把灾祸转嫁给别人，不是君子该做的。","是非的名声，留给后世去说。"],["一次出使就让四国全部动起来，鲁国保住了，我的名声也成了。这就是一个使者的力量。","只保住一个鲁国却搅乱四个国家，得到的抵不上失去的。","事情的成败，本来就无法预料。"]]},v_zigong_huozhi:{qs:["君子本该安于贫困，你为什么喜欢做买卖？","你猜行情总能猜中，是怎么做到的？","「富而不骄」和「贫而不谄」，哪个更好？"],opts:[["我不安于本分去经商，但判断行情常能猜中。富了却不骄横，对德行有什么损害？","求学问的人应当以道为重，经商不合适。","富有和道行，互不妨碍。"],["观察市场的供求变化，体察人们的需要。价钱贵时卖出像扔粪土，价钱贱时买进像收珠玉。","那只是运气，不是人力。","生意经的东西，说不完。"],["两者都不如「穷也快乐、富也好礼」。","不骄不谄，已经很难得了。何必再进一步？","贫富的处境不同，各安本分就好。"]]},v_zigong_yanyu:{qs:["言辞的要领在哪里？","花言巧语、满脸堆笑，是圣人所不齿的。你们「言语」这一科，不就等于巧言吗？","夫子您老师的道，能听得到吗？"],opts:[["在了解对方的心。他想要的，先给他；他害怕的，先替他解除。","在讲清利益。利益所在，人自然会听。","在守住道义。道义站得住，言辞自然有力量。"],["巧言是没有实际内容却修饰说辞；言语是有实际内容又善于表达。两条路。","但终究接近巧言。不如说话谨慎、做事勤快。","言辞之间的事，很难说清。"],["老师关于文献的学问，能听得到；老师谈人性和天道的言论，就听不到了。","道就在日常之间，何必追求高远？","道说不出来，说出来就不是道了。"]]}},yan_yuan:{v_yanhui_le:{qs:["别人都受不了那种穷苦，颜回却不改变他的快乐。这个快乐在哪里？","学了道却受穷，您觉得值得吗？","如果让您治理一座城，会以什么为先？"],opts:[["快乐在道，不在物质。得了道，穷也快乐；失了道，富了也忧愁。","穷还乐呵呵的，不过是装出来的。谁不想富？","快乐是自个儿的事，不必问它在哪里。"],["道不因贫富而改变。如果拿贫富来衡量它，道就成了商品。","学道本是为了派用场。穷得没用处，学它干什么？","值不值，各人有各人的答案。"],["先端正自己。自己正了，百姓自然正，用不着刑罚。","先立制度，严明赏罚。","先看清时势，遇事随机应变。"]]},v_yanhui_sheng:{qs:["整天听讲从不提反对意见，像个笨人。您觉得对吗？","君子的学习，是为了给别人看，还是为了自己？","不把怒气发泄到别人头上，不犯同样的错误。您做得到吗？"],opts:[["回去之后私下反省，也能有所发挥。回并不笨。","只会唯唯诺诺，毫无见解，接近笨了。","笨与不笨，各人自己看得见。"],["为自己。学习是为了修养自己，不是为了向人炫耀。","只为自己学，就没有办法济世。","为人为己，都可以学。"],["我还没做到。但知道它难，所以每天反省。","怒气可以转移，错误可以改正。不必为难自己。","这是小节，何必计较？"]]},v_yanhui_ren:{qs:["「约束自己、回归礼制」就是仁。具体做法是什么？","「约束自己」和「顺应本性」，哪个算仁？","「天下都会归向仁」，这效果是怎样的？"],opts:[["不合礼的不看，不合礼的不听，不合礼的不说，不合礼的不做。","约束自己，只是节制欲望而已。礼，不过是顺应习俗。","仁是本心，哪需要什么条目？"],["先约束自己，本性才能端正。本性想要的，未必就是仁。","顺应本性自然。刻意约束自己，反而接近虚伪。","两者都行，看时候。"],["实行仁全靠自己，不靠别人。自己端正了，天下自然归向，不用去求。","让人归仁，得靠政令去推动。","见效的快慢，不是人能保证的。"]]}},wu_ji_zha:{v_jizha_yue:{qs:["听音乐就能知道政治，真有这种事吗？","郑国的音乐过于细琐，您觉得怎么样？","「这就是极点了。再有别的音乐，我也不敢再请求听了」——这话什么意思？"],opts:[["有。音乐是政治的映像。政事平稳声音就和谐，政事混乱声音就哀伤。","音乐是声音，政治是事务，两者没有关系。","音乐直接打动人心，不必借助于政事。"],["美啊！但它太细琐了，百姓受不了。这个国家会先灭亡吧！","声音细琐，不是大雅之音。应当废止。","音的粗细各随其俗，何必多虑？"],["乐到了顶点，就没有再高的了。《韶》乐尽美，又尽善。","尽善要靠德行，光靠音乐达不到。","音乐的极处，能说的都在这里了。"]]},v_jizha_rang:{qs:["父兄之命，您为什么不受？","抛下家室去耕田，您不后悔吗？","吴国后来有阖闾之乱。您的让国，算得上明智吗？"],opts:[["我虽然不才，但愿意效法子臧的节义。礼有旧制，不能乱。","兄终弟及，是先君之命。推辞了，吴国就乱了。","受与不受都可以，何必自苦？"],["不悔。我守的是义，不是君位。","丢下君位去耕田，等于丢下吴国。","悔不悔，都只是一时的心思。"],["祸在后人，不是我的让国招来的。要是贪位，祸就落在今天。","要是受了君位，就不会有阖闾之乱。让位并不明智。","后来的事，人本来就无法预料。"]]},v_jizha_jian:{qs:["心里应许了却没有说出口，这算数吗？","徐君已经死了，您把剑挂在墓树上。有必要吗？","这么小的信义，您不觉得迂腐吗？"],opts:[["心里应了就是许诺。虽然没说出口，我心已经许下了。","没说出口就不算承诺。何必自己捆住自己？","许与不许，在心不在言。"],["有必要。我守的是自己的心，不是做给别人看。","死人没有知觉，挂剑没有用处，只是图个虚名。","做了心里才安，不必问它有什么用。"],["小的信义尚且守住，大的就更不必说了。这不叫迂腐。","对。信的大处在国家，不在一把剑。","迂与不迂，人各有见。"]]}},wei_shi_que:{v_shique_mieqin:{qs:["儿子帮着乱臣，做父亲的该怎么办？","「大义灭亲」，您觉得这是仁，还是狠？","若是为了儿子就废弃国法，天下会怎么样？"],opts:[["抓起来杀掉。父子之情，不能压过君臣之义。","父子天性。应当先责备再教育，不能立刻杀。","儿子的罪由儿子自己承担。父亲不必插手。"],["不是狠，是义不容辞。杀一个儿子来安社稷，这才是最大的仁。","终究近于狠。虎毒尚且不食子。","仁与狠，都是外人的评价。"],["国法一废，乱臣就接踵而来。一个人的私情，不能毁掉全国的纲纪。","法有轻重之分。父子之亲，本是法该宽宥的。","执法的人自有权衡，不必问天下。"]]},v_shique_jian:{qs:["被宠爱的孩子喜好兵器，您觉得可以吗？","「六逆」「六顺」是什么？","君主不听劝谏，您打算怎么办？"],opts:[["不行。受宠而不骄横、骄横而能屈居人下、屈居人下而不怨恨、怨恨而能克制的人，太少了。","爱孩子就该顺着他。喜好兵器，也许是将才。","宠不宠，在君主的心意。"],["贱的妨碍贵的、少的欺凌长的、疏远的离间亲近的、新人排挤旧人、小的压过大的、邪的破坏正的，这是六逆。君仁、臣忠、父慈、子孝、兄爱、弟敬，这是六顺。","这些都是旧礼。今天的形势已经不同了。","名目再多，还要看人怎么做。"],["告老还乡而已。不走，祸就要落到自己身上。","应当守在位子上，从长计议。","去留有时候，不必固执。"]]},v_shique_chunchen:{qs:["什么叫「纯臣」？","为国忘家，那家里怎么安顿？","纯臣的祸患，往往落到自己身上。您不害怕吗？"],opts:[["国而忘家，公而忘私。不因亲情损害道义，不因私事损害公事。","忠而不愚，才算纯臣。","纯臣之名是后人加的。当时哪里顾得上想这个？"],["国家不安，家就没有依托。所以先国后家。","家是国的根本。家不安，国也治不好。","国与家，各有各的时候。"],["义之所在，祸不足避。","避祸是人之常情。纯臣也该自保。","祸福有命，不必预先忧虑。"]]}},zhou_wang_sun:{v_wangsunman_ding:{qs:["鼎的大小轻重，可以告诉我吗？","周室德行已经衰败，鼎还凭什么贵重？","楚王问鼎，您用什么话既能挡回去又不激怒他？"],opts:[["关键在德，不在鼎。当年夏朝正有德的时候，远方各国画来物象，九州进贡铜铁，铸成鼎并刻上万物。","鼎是重器，它的分量应当有个定数。明说给楚国听，以示顺服。","这是周室的器物，不是使者该问的。"],["德行美好光明，鼎虽小也重；奸邪昏乱，鼎虽大也轻。","德衰鼎就轻。不如趁早迁到楚国去。","轻重的定数，人哪里知道？"],["搬出天命来挡他，不指斥他的僭越。他再强，也不敢逆天。","应当以兵威相拒。言辞靠不住。","顺他的意思，慢慢再想办法。"]]},v_wangsunman_tianming:{qs:["天命可以改变吗？","周室微弱，诸侯不来朝见。您怎么自处？","德与力，哪个能长久？"],opts:[["可以改，但不是人力能强行做到的。德行到了天命就归，德行败了天命就离开。","强者承受天命。楚这么强，天命在楚。","天命的事，无法知晓。"],["守住礼，不坠名号。名号还在，天下诸侯就还有个归属。","守着虚名不如自强。","时势如此，姑且自安而已。"],["德长久。力只在一时，德能到百世。","力长久。没德但有力气的，照样能生存。","长久与否，谁也预料不到。"]]},v_wangsunman_li:{qs:["礼与名，真能让国家不亡吗？","如果诸侯都抛弃礼，那该怎么办？","您的职责，在守礼，还是在强国？"],opts:[["名号还在，诸侯就还有顾忌。礼在，上下就还有章法。","空名挡不住刀兵。不如务实。","存亡有定数，不是一种礼能撑住的。"],["那天下就大乱了。但抛弃礼的先亡，守礼的后亡。","那就用兵威来纠正它。","天下大势，人力拉不回来。"],["守礼。周室的职责在礼，不在强。强不是它所长，礼才是它所有。","应当先强国。连国都没有了，礼往哪儿施行？","两者都该做。"]]}}}});var ro,lo=O(()=>{ro={shu_xiang:{v_shuxiang_xingshu:{qs:["从前先王凭事理裁量罪犯，不预先制定刑法条文。您怎么看？","百姓知道了争执的依据，就会抛弃礼、只认条文。您怕吗？","刑书已经铸成，您认为后世会怎样？"],opts:[["是怕百姓起争抢之心。用道义约束他们，用政令纠正他们，用礼来推行，用信来守护。","凭事理裁量，官吏就能任意妄为。不如明定法律。","法与礼都是治理的办法，不必偏废。"],["怕。为了一点小利都要争到底，诉讼案件越来越密，贿赂横行。","诉讼再多，是非有定论，总胜过没有条文。","诉讼的多少，看官吏贤不贤。"],["后世必定有人拿法律来争。但乱不在法，在于没有用礼去引导在先。","后世有法可循，胜过无法。","后世的事，今天管不到。"]]},v_shuxiang_pin:{qs:["贫穷可以祝贺吗？","担心德行与担心贫穷，哪个更要紧？","如今有位卿却很穷，您祝贺他，还是吊唁他？"],opts:[["可贺。从前栾武子没有一卒之田，家里连祭器都凑不齐，但德行昭著、行为正直。","穷有什么可贺的？富了才谈得上施德。","贫富都是身外之物，不必贺也不必忧。"],["忧德。德行没建立而钱财充足，祸患必定找上门。","忧贫。没有钱财，就没有办法立德。","两者都忧，才不会有过失。"],["祝贺。穷而有德，胜过富而无德。","吊唁。当卿却穷，是国家的失政。","贺与吊都是虚文，不必计较。"]]}},shen_shu_shi:{v_shenshushi_shang:{qs:["奖赏失当与刑罚过滥，哪个害处更大？","「宁可赏错、不可滥罚」，这不是放纵恶人吗？","赏罚的权柄，应当握在谁手里？"],opts:[["赏错了，怕的是错到坏人身上；滥罚了，怕的是罚到好人身上。如果不幸必须错一头，宁可赏错，不可滥罚。","赏滥了人就侥幸，刑轻了人就无畏。两种害处一样大。","赏与刑的尺度，各有各的分寸。"],["不是纵恶。与其错杀无辜，宁可放过不合常规的。这是古人的教训。","纵容恶人，奸邪就无所畏惧，这是乱的开端。","过与不及都是失当，应当持平。"],["握在君主手里，不能交给臣下。交出去，赏和刑都成了私货。","交给主管的官署。君主只把总关。","握在谁手里都行，只要用对人。"]]},v_shenshushi_chen:{qs:["讨伐了弑君之贼，却把陈国收作自己的县，可以吗？","「踩了别人的田，就抢走他的牛」这个比喻，您觉得恰当吗？","收了陈国做县又重新封立它，您怎么看？"],opts:[["不可以。夏徵舒弑君，讨伐他是义；把陈国据为己县，是贪。以义开始、以贪收场，这不是霸主的作为。","陈已经攻破了，收作县可以强国。","已经到手了，何必多说？"],["对。牵牛去踩田的，确实有罪；把牛抢走，惩罚就太重了。","比喻不能拿来断案。定罪要看轻重。","比喻的话，听个意思就行。"],["重新封立，道义就保全了。讨伐他的罪而不贪他的地，诸侯自然归服。","已经拿到了再放弃，不是好主意。","封与不封，都是楚国的利益。"]]}},liu_xiahui:{v_liuxiahui_sanchu:{qs:["三次被罢免都不离开，为什么？","按正道行事却屡遭罢免，和歪门邪道却飞黄腾达，您选哪个？","父母之邦不能离开，可您又不被重用。打算就这样终老吗？"],opts:[["按正道侍奉人，到哪儿去不会被罢免三次？歪门邪道地侍奉人，又何必离开父母之邦？","被罢三次说明容不下你，应当离开去求用武之地。","走和留都可以，何必执着？"],["取正道。靠歪门邪道得来的显达，不算显达。","先显达，才能推行志向。委屈一时，伸展百世。","直与枉，看时候。"],["就这样终老。道在我身上，用不用在别人。","应当去别的国家求用。道推行了，才谈得上守。","去留都可以，看时候定。"]]},v_liuxiahui_zuohuai:{qs:["「坐怀不乱」这件事，您信吗？","处在招人嫌疑的境地，应当避开吗？","君子的操守，是要让人看见，还是在人看不见的地方？"],opts:[["信。心正的人，就算处在嫌疑之地也不失操守。","人情做不到。这种说法近于夸大。","信与不信，各在人心。"],["该避就避，避不开就守住本心。避和守，都是为了保全德行。","该避。君子不处于嫌疑之中。","嫌疑的痕迹，不必一一躲避。"],["在人看不见的地方。让人看见才守的，未必是真守。","应当让人看见。让人知道有操守，风俗自然端正。","见与不见，都是外在的。"]]}},shi_kuang:{v_shikuang_yin:{qs:["众乐工都说钟声准，唯独您说不准，为什么？","音乐准不准，和政治有什么关系？","君主有过失，乐师该用什么方式进谏？"],opts:[["钟声与人心不合。心不合，声音就不合。我用耳朵听出来的。","众乐工听得比一个人细。应当听从多数。","准与不准是小节，何必相争？"],["关系很大。乐是政的映象。钟声不和谐，政事就不和谐。","乐是用来愉悦耳朵的，政是用来治理人民的，两者没有关系。","准不准自有乐师管，您不必过问。"],["寄托在音乐里。声音不和谐，君主自己会察觉，不必明说。","应当直言。借音乐进谏，近于戏弄。","该挑能谏的时候谏，不必什么都讲。"]]},v_shikuang_guang:{qs:["眼睛看不见，却能通晓政事，门道在哪里？","君主有过失，该直谏，还是婉转地讽劝？","盲人听政，弊端在哪里？"],opts:[["眼盲了耳朵就灵，耳朵灵就能从言语里察见人心。话的诚伪，无不显露。","眼睛看事，耳朵听话。丢开眼睛只靠耳朵，还不够。","知政在于德行，不在于耳目。"],["直谏君主要发怒，婉讽君主能醒悟。我取婉讽。","应当直谏。婉讽则话说不透。","两者都是谏，看君主的性情选。"],["弊在偏听。所以必须多听各方，不能凭一只耳朵下结论。","弊在看不见实情，只听到言辞。","弊在过于自信。"]]}},yi_he:{v_yihe_gu:{qs:["「不是鬼、不是吃坏东西，而是被欲望迷了心志」——您说这是什么病？","有良臣却不任用，这又是什么病？","病已入骨髓，良医又能怎样？"],opts:[["是贪欲的病。被迷惑而毫无节制，不是针药能治的。","鬼和吃食都有原因。应当先查清病从何来。","病的形成都有定数，何必深究？"],["也是同样的病。被私欲迷住而不觉悟，有良臣也不会用。","病在身上，不在政事。两者不能混为一谈。","医师只管看病，不必议论政事。"],["医师治的是未病。病入骨髓就不是医师的过错了，是病人的过错。","应当尽力施治。医师不能先说不治。","生死有命，医师听天由命。"]]},v_yihe_yi:{qs:["「上等的医师医国，其次医人」——这个说法怎么讲？","「六气」过度会成病。政事过度了，拿什么治？","医国与医人，两者的道理相通吗？"],opts:[["国家的政令，就像人身的血脉。血脉堵了就生病，政令堵了就乱。","医师医的是身体，政事治的是国家。方法不同，不能混谈。","「医国」的名声，近于吹嘘。"],["节制。阴气过度生寒病，阳气过度生热病，风过度生四肢病。政事过度也一样，用礼来节制。","政事的过度用法度来纠正，不必比附什么六气。","政事的得失，不是医师能懂的。"],["相通。都在于找到病根、调理偏颇。","不通。国与身，道理不同。","名相同理不同，不必硬凑。"]]}},gongshu_ban:{v_gongshu_yunti:{qs:["造器械用来攻打别人的国家，您觉得合乎道义吗？","您的巧手可以造车造船方便民众，何必造攻城的器械？","九次进攻九次被挡，您的器械已用尽。现在怎么办？"],opts:[["匠人的职责在造器，不在用器。器械用来行义还是行恶，取决于君主。","器械既然造成又用于攻伐，匠人也有责任。","拿人家的俸禄，办人家的事，不必问义。"],["巧手没有善恶，用处才有善恶。您能把巧用在民生上，功劳就是百世的。","攻城器械也是国家需要的，不是专为了打仗害人。","巧在哪儿，就用在哪儿，随人而施。"],["器械用尽而攻城不下，就该罢手。器械胜不过防御，硬攻只是白白死人多。","应当再想新器械，一定要破城。","战争的成败，不是匠人做主的。"]]},v_gongshu_qiao:{qs:["用竹木削成的鹊能飞三天不落，算得上巧吗？","巧匠和圣人，哪个更重要？","巧而有用，与巧而无用，取哪个？"],opts:[["可以算巧，但算不上有功用。不如造一辆车辕，能载重致远。","巧到这个地步，人已经比不上了，还谈什么功用？","无用的巧，费时费财。"],["巧匠造器物，圣人立风俗。器物能利一时，风俗能化百世。","巧匠的功劳看得见，圣人的功劳难以验证。所以匠人重要。","两者各有各的长处，不必比较。"],["取有用的。巧而无用，再奇又有什么益处？","取无用的，因为巧之所以为巧，正在于「无用」。","两者都取。有用的养民，无用的见道。"]]}},you_meng:{v_youmeng_yiguan:{qs:["以优伶的身份，穿戴相国的衣冠，您不怕吗？","孙叔敖当相国尽忠，他的后人却穷困。您怎么看？","优伶的话为什么能进得了君王的耳朵？"],opts:[["优伶说话不算罪，听的人却足以引以为戒。这就是我敢做的原因。","冒充大臣，按罪当死。","不过是演戏，有什么罪？"],["相国清廉，所以家里穷。这话正该讲给君王听。","忠臣的后人应当抚恤，这是国家的道义。","身后的事，相国生前也顾不上。"],["因为是戏言。戏言不构成冒犯，听的人却能受教。","因为忠。话虽像戏，心意是正的。","因为君主正高兴。趁他高兴说话，容易入耳。"]]},v_youmeng_xiao:{qs:["用大夫的礼节葬一匹马，您觉得过分吗？","直谏和讽谏，哪个好？","君主的过错，谁能够纠正？"],opts:[["过分了。这是我的错，优孟的话是对的。","不过分。我心爱的马，厚葬也是人之常情。","葬得厚薄，都是小事。"],["受他的讽。讽谏不逆耳，我自己就醒悟了。","应当斥责他戏弄君主。君主的威仪不可以戏弄。","是戏不是戏，看那个人。"],["能讽谏的人。直言的人可能死，讽谏的人能留下来。","能进谏的人。忠臣不避死。","君主自己纠正，何须靠人？"]]}},bo_ya:{v_boya_zhixin:{qs:["琴声怎么能达到高山流水？","知音已经死了，还弹琴做什么？","知音难遇，您觉得可以求来吗？"],opts:[["声音是心的痕迹。心里想着高山，声音自然巍峨。","声音是物理现象，山是自然形态，两者不相关。","心里寄托着什么，声音就表现出什么。"],["摔琴断弦，终身不再弹。没有知音，声音就没有归宿。","琴是弹给自己听的，何必等人来懂？","懂与不懂，对琴声没有损害。"],["求不来。遇上就是遇上了，刻意去求反而会失去。","可以求。多结交朋友，自然有懂的人。","遇与不遇，都有定数。"]]},v_boya_ting:{qs:["琴艺的极致，在技，还是在心？","「移情于海，就成了绝技」——这种说法可信吗？","技术练成了心却没跟上，怎么办？"],opts:[["在心。技术可以学，心教不了。","没有技术，心就没有寄托。应当先把技术练精。","技和心，都不能偏废。"],["可信。听了海水的震荡、山林的幽深，心就跟着化了。","技术长在手指上，不在山水里。这说法近于虚妄。","成不成，都有它的定数。"],["放下技术去养心。心到了，技术自然就到了。","应当把技术练得更精。技术精了，心自然跟上来。","两者交替修养就行。"]]}},chang_hong:{v_changhong_qi:{qs:["天地之气，能够推算出来吗？","阳气伏在地下不能出、阴气压迫阳气不能升，于是发生地震。您觉得对吗？","气机失常，能预先知道会有灾祸吗？"],opts:[["能。气有它的常数，过了常轨就成为灾。查它的失常之处，提前做防备。","气是虚的，怎么推算？","能知晓气序的，只有圣人。"],["对。这是阴阳的常态，不是妖异。明白的人不害怕，只做防备。","地震是上天的警示。应当修养德行来回应。","震与不震，都有定数。"],["能。观察气序的失常，就知道灾祸从哪里来。","不能。天意难测，只有修养德行来等待。","不必知道。防备了，灾就不来。"]]},v_changhong_bi:{qs:["血化为碧玉的说法，可信吗？","忠于职守却被杀，您觉得值得吗？","忠诚而死的人，他的名声能长久吗？"],opts:[["碧玉，是忠心的凝结。说法虽有附会，那份志向值得敬重。","血化为玉，物理上不存在。这是记事的人夸大。","信与不信，对他本人没有损害。"],["值得。忠是尽自己的本分，不是为了回报。","不值。保全性命以图后效，不是更好？","值不值，都是后人的议论。"],["能长久。血化碧的说法虽然虚，那份志向不会消亡。","名是虚的。死了的人不能复生。","久不久，都交给后世去说。"]]}}}});var co,uo=O(()=>{co={shi_mo:{v_shimo_sheji:{qs:["季氏把国君赶出国，凭什么算无罪？","百姓归服季氏而不归服国君，您说为什么？","鲁君死在国外，没有人追究。史书该怎么写？"],opts:[["社稷没有永远的奉事者，君臣没有固定的名位，自古以来就是这样。季氏世代勤勉，百姓早忘了还有国君。","国君即使无道，臣子也不能把他赶走。这是根本的伦常。","国君被赶走，不是一个人的罪。"],["国君失去德行，百姓心里就没有国君了。不是百姓背叛，是国君自己放弃的。","百姓只是被季氏蒙蔽罢了。","民心向背，都有它的定数。"],["如实书写，不隐瞒不粉饰。史书是天下公用的器具。","应当为君主避讳。避讳，名分才保得住。","记事详略，随时代而不同。"]]},v_shimo_shi:{qs:["史官的职责，是记事，还是记道义？","君主不喜欢听自己的过错，史官该曲笔吗？","史书作为公器，它的权力在哪里？"],opts:[["记道义。事情有真有假，道义不能歪曲。","只记事而已。道义是后人的评价。","事和义都该记。"],["不能。董狐写「赵盾弑其君」，孔子称他为良史。","应当曲笔保全自己，留身把后史修完。","曲与直，随时代而定。"],["在史笔。笔还在，善恶就掩盖不了，这胜过刀锯。","史官没有权，权在君主。史官不过是记事。","权有无，不是史官考虑的。"]]}},deng_xi:{v_dengxi_liangke:{qs:["一件事两种说法都说得通，您觉得是辩论，还是诡辩？","把对的说成错的，天下岂不大乱？","驷歂杀了你，却采用你的竹刑。您怎么看？"],opts:[["是辩。事有理有势，从理看是一面，从势看是两面。两可，是辨清形势。","是诡辩。是非自有定论，两可就乱了名实。","是辩是诡，看怎么用。"],["不乱。让人知道是非没有绝对定论，就不敢轻易下判断，官吏也不能凭私意断案。","必乱。百姓没了遵循，诉讼就越来越多。","乱不乱，看怎么用。"],["可以。人可以杀，法可以存。好的刑法，不因人废法。","不可以。用他的法又杀他的人，不合道义。","身后的事，不在考虑之内。"]]},v_dengxi_zhuxing:{qs:["刑书已经铸在鼎上了，你又另作竹刑，为什么？","教百姓打官司，你从中收费，可以吗？","法律越细密，能让人不打官司吗？"],opts:[["鼎上的文字太简略，百姓没法用。竹刑细密，让百姓自己知道犯了什么罪。","国法只能有一种。再作私刑，就是扰乱国政。","刑的详略，各有各的用处。"],["可以。百姓懂打官司，官吏就欺压不了人。收点酬劳，是他们的谢意。","不可以。引导百姓打官司，风俗一天天败坏。","诉讼的繁简，自有它的形势。"],["不能。法越细，争得越细。但细有细的好处——官吏没法欺人。","能。法明确，百姓知道躲避什么。","讼的有无，不是法能决定的。"]]}},lie_yu_kou:{v_lieyukou_yufeng:{qs:["乘风飞行，那是什么境界？","乘风还是要凭借风。那么什么才是最高的境界？","学乘风十五年没学成，您怎么看？"],opts:[["乘着天地的正气，驾驭六气的变化。这靠的不是力气，是顺应。","风是乘不了的。这都是寓言。","乘风之术，够不上道。"],["无所待。乘天地正气遨游无穷的人，还需要凭借什么呢？","有所凭借才能行动，这是世间的常态。何必追求无所待？","有待无待，都不实用。"],["没成，不是技法不行，是心还不够虚。心一虚，风自然就来了。","应当再精研技法。技术成了，事情就成了。","成与不成，都有它的时候。"]]},v_lieyukou_ju:{qs:["相国送来的粟米，您为什么辞掉？","面有饥色还辞掉别人的粮食，您觉得这是做作吗？","子阳死后，他的党羽都被诛杀，唯独您没事。为什么？"],opts:[["他并不是了解我才送我粮食，是听别人说才送的；将来要治我的罪，也会因为别人的话。这就是我不接受的原因。","收下也没什么。饿着还辞粮，不是明智。","收与不收，都是小事。"],["不假。收了不该收的，一辈子都被人拿捏。","假了。饿死还谈什么操守？","假与不假，只有自己知道。"],["因为我没接受他的粟。收了就是他的党羽，没收就不是。","只是偶然，跟辞粮没关系。","免与不免，都有定数。"]]}},yang_zhu:{v_yangzhu_weiwo:{qs:["拔一根毫毛就能利于天下，您为什么不干？","人人都只顾自己，那天下谁来治理？","孟子说「杨朱墨翟的言论满天下」，您怎么看？"],opts:[["天下不是一根毫毛能救的。今天拔一根毫毛，明天砍一条胳膊，最后必然危及性命。","一根毫毛微不足道，天下却重。何必吝惜一根毫毛？","为与不为，各随其志。"],["人人不损一根毫毛，人人不利天下，天下就治好了。各安本分，互不侵犯。","人人都为自己，公义就没了，天下必乱。","治与乱，不是「为我」之说能决定的。"],["天下的言论各有主张。我讲为我，他讲兼爱，都是要救世。","言论满天下，天下就乱了。应当驳斥它。","言论的多寡，不必计较。"]]},v_yangzhu_gui:{qs:["什么叫「贵己」？","名利来了，该接受还是拒绝？","人生百年，什么才是真的？"],opts:[["贵己不是自私。保全本性、保存本真，不被外物拖累。","贵己就轻贱他人，这跟禽兽有什么两样？","己与人，各有各的本分。"],["看它累不累形。不累就收，累就拒。","该接受。名声是人看重的东西。","收拒都是身外事，不必计较。"],["身体和本性是真的。名位财货都是身外物，可以舍去。","德行是真的。身死了名还在。","真不真，只有自己知道。"]]}},hui_shi:{v_huishi_hetongyi:{qs:["万物全都相同又全都相异，这个说法怎么讲？","在濠水桥上，你和庄周辩论鱼的快乐。那场辩论谁赢了？","「历物十事」，要旨在哪里？"],opts:[["从相同的一面看，万物都是一；从相异的一面看，肝胆之间也像楚国和越国那样远。","同异自有定分，怎么能说全同全异？","同异的辩论，对治国没有益处。"],["庄子赢了。他用「回到话的本源」把我的话头接走了，我接不上。","我赢了。你不是鱼，怎么知道鱼的快乐？","辩论没有胜负，各得其意而已。"],["在「一」。大到没有外部叫大一，小到没有内部叫小一。","十事各不相同，何必归于一？","十事的说法，近于诡辩。"]]},v_huishi_xiang:{qs:["有人说庄子要来取代你的相位，你打算怎么办？","相位和道，哪个更重要？","庄子用鹓鶵和腐鼠打比方，你怎么回应？"],opts:[["应当自省。如果我做魏相对百姓没有好处，他来取代也可以。","应当驱逐他。相位是国之重器，不能假手于人。","听着就是了。谣言自会平息。"],["道重要。相位可以丢，道一刻也离不开。","相位重要。没有位子，道就没法推行。","两者有时是相辅相成的。"],["我不把相位当腐鼠，但也不能拿相位把自己框住。","应当以相位自重。那是他自己说的。","比喻的话，不必深究。"]]}},gong_sun_long:{v_gongsunlong_baima:{qs:["「白马不是马」，这个说法怎么讲？","要马而得到白马，可以吗？","孔穿和你辩论输了，你觉得为什么？"],opts:[["「马」是称呼形体的，「白」是称呼颜色的。称呼颜色的不是称呼形体的，所以说白马不是马。","白马本来就是马的一种，怎么能说不是马？","名实的辩论，跟治国无关。"],["可以。求马求的是形，得到白马是形和色都有了。","白马就是马，求马得白马，理所当然。","名和实，各有所指。"],["孔穿执着于常理，我用名辩。常理能服人心，名辩能屈人口。","孔穿本就不该跟他辩。一辩就落进他的套路。","胜负都是一时的说法。"]]},v_gongsunlong_jianbai:{qs:["「又坚又白的石头」，为什么说是两种属性？","名实的辩论，对治理有什么用？","平原君厚待你却不让你做官，你怎么看？"],opts:[["看，看不出它的坚硬、只看得到白色，就没有「坚」；摸，摸不出它的白色、只摸得到坚硬，就没有「白」。","坚和白都在石头里，怎么会是二？","离与合，都是名目上的分辨。"],["名正了事情才能成。名不正则言不顺，言不顺则事不成。","没用。只会扰乱人心，无补于政。","有没有用，不是辩者计较的。"],["辩者的职责在辩，不在做官。厚待就够了。","应当自己请求任事，来证明有用。","遇与不遇，都有本分。"]]}},zou_yan:{v_zouyan_wude:{qs:["五德终始的说法，有依据吗？","水德将兴，取代周朝的会是谁？","拿德运游说诸侯，你不怕成为谶纬的开端吗？"],opts:[["有。天有五行，朝代有更替。看德属于哪一行，就知道运归于谁。","国家的兴亡在人事，不在德运。","运数的说法，不必深究。"],["火德已衰，水德当王。至于是谁，还无法预知。","强者居之。德运之说，是因人而显的。","兴替有时，人测不到。"],["德运是理，谶纬是妄。以理示人，不是拿妖言惑众。","近于谶纬。君主信了，就会怠慢人事。","理与妄，后人自会分辨。"]]},v_zouyan_dajiuzhou:{qs:["中国不过是天下的八十一分之一，这话可信吗？","既然说天地这么广，那该怎么自处？","燕昭王拿扫帚清路、走在前面来迎你，你觉得如何？"],opts:[["天地之广，不是耳目能穷尽的。只占着一角就怀疑天地的广大，不值得跟他谈论。","这都是臆测。没有凭据就谈天地，不是学者该做的。","天下之大，不该乱说。"],["知道天地的广大，就不敢自满；知道自己渺小，也不必自卑。这样才能容人。","知道天大地大也没用。应当先做眼前的事。","大与小，都不必计较。"],["他敬重的是我的言论，不是我这个人。我也拿言论回报他。","应当接受。士人受到礼遇，是国家的盛事。","礼的厚薄，不必计较。"]]}},chunyu_kun:{v_chunyu_yiming:{qs:["三年不飞不叫，这只鸟算什么鸟？","用隐语劝谏，比起直谏怎么样？","王说了「好」就停止通宵宴饮。你觉得这是隐语的功劳吗？"],opts:[["这只鸟不飞则已，一飞冲天；不叫则已，一鸣惊人。","这鸟没本事，应当除掉，另找贤者。","鸟飞不飞，都有它的时候。"],["隐语容易入耳，直谏容易触怒。王一旦醒悟，改起来也快。","直谏才是忠。隐语近于儿戏。","看君主的性子来选。"],["是。隐语顺着他的乐子去引导，所以容易听进去。","只是碰巧，王自己醒悟的。","功劳在哪里，说不清楚。"]]},v_chunyu_jiuji:{qs:["喝一斗也醉，喝一石也醉，为什么？","君主沉迷酒宴，臣子该怎么进言？","滑稽之士，对国家有用吗？"],opts:[["酒到了极点就乱，乐到了极点就悲。凡事都一样。","酒量有定数，怎么会两种说法？","醉与不醉，都在自己心里。"],["乘他高兴的时候讽劝。高兴时说的话，容易进也忘不掉。","应当正色进谏。趁人高兴讽劝，近于谄媚。","君主的喜好，不是臣子能改变的。"],["有用。话不逆耳，君主自己就改了。这就是滑稽不可废的原因。","没用。优伶之类，对政事有什么帮助？","有没有用，看遇上什么样的君主。"]]}},lao_lai_zi:{v_laolaizi_yin:{qs:["楚王召你为相，你为什么推辞？","隐居不出仕，对天下有什么益处？","你的妻子也劝你别出仕，你觉得对吗？"],opts:[["隐者不能受人的俸禄。受了禄就受人管，受人管就失去本真。","可以受。做了相就能推行主张，何必隐居？","隐与仕，各随其志。"],["隐者并非无用。上面不夺百姓的利，下面不争别人的位，这也是益处。","没有益处。贤者应当出山济世。","有没有益，不是隐者考虑的。"],["对。夫妻同心，才能长久。一个人独行，容易动摇。","妇人懂什么？应当自己决断。","她的话，也算一种道理。"]]},v_laolaizi_caiyi:{qs:["七十岁了还扮成婴儿嬉戏，你觉得怎么样？","孝的极致，在养父母的身体，还是娱他们的心？","故意摔倒在地、学婴儿啼哭来哄父母开心，你觉得过分吗？"],opts:[["是孝的极致。父母老了就担心他们衰败，所以扮成婴儿逗他们开心。","近于儿戏。老人应当自重。","逗父母开心的法子，各随其宜。"],["在娱其心。养身体容易，让父母心里高兴难。","在养其身。吃穿不足，哪来的乐？","两者都做到，才算孝。"],["不过分。父母想要的是一笑，摔一下没妨碍。","过分了。老人摔倒，恐怕会伤到自己。","过不过分，只有父母知道。"]]}},zi_si:{v_zisi_zhongyong:{qs:["「中和」的说法，怎么能用来治天下？","中庸和乡愿，怎么区分？","孔夫子的道，凭什么能传下来？"],opts:[["达到了中和，天地就各安其位，万物就生长发育。上面的情正了，下面自然安。","情感的发作有节制，做事就不过分也无不及。这是治国的要领。","中和是修养的事，不是政事的要领。"],["中庸是择善而固执；乡愿是随波逐流讨好所有人。看起来像，心完全不同。","两者都不偏不倚，有什么区别？","名异实同，不必细辨。"],["靠「诚」传下来。诚就不会止息，不止息就能长久。","靠文字传下来。写在竹帛上，道就不会失传。","传与不传，都有定数。"]]},v_zisi_cheng:{qs:["「诚」能作为天下的根本吗？","「至诚可以预知」，这怎么讲？","诚与明，哪个在先？"],opts:[["可以。不诚就没有万物。上不诚则下不信，下不信则事不成。","诚是一个人的德行，跟天下有什么关系？","诚与不诚，只有自己知道。"],["至诚之道可以预知。国家将兴，必有祥瑞；将亡，必有妖孽。","预知是术数的事，不是诚能达到的。","知与不知，都在诚之外。"],["诚了自然明，明了自然诚。两者相生，没有先后。","先明。明白了才知道该诚什么。","先后的说法，不必执着。"]]}},you_yu:{v_youyu_shishu:{qs:["中原用诗书礼乐法度治国，还是时常动乱；戎狄没有这些，凭什么治理？","把女乐送给戎王，让他荒怠政事。这个办法可以吗？","戎王沉迷女乐后，你就离开了他。你觉得可以吗？"],opts:[["中原的乱，正是上面失德、下面争位造成的。礼乐是装饰，没有德就是虚饰。","戎狄的治理简陋，称不上治。","治乱各随其俗，不必比较。"],["可以。用兵讲究出奇，不靠奇计就很难取胜。","不可以。用女乐乱别国，不是仁者所为。","术正当与否，看成败。"],["可以。劝了不听就走。留下来没有用处。","不可以。既然事奉了国君，就该死在他的难里。","去留都有它的时候。"]]},v_youyu_rong:{qs:["离开戎狄投奔秦国，你觉得可以吗？","把戎狄的虚实告诉秦国，你不觉得背弃了故主吗？","秦国用你的谋略称霸西戎，你算是立功了吗？"],opts:[["可以。劝了不听就走。留着没用，只是自困。","不可以。既然事奉了国君，就该死在他的难里。","去留都有它的时候。"],["不算背弃。我已经离开了戎，戎就不再是我的君主。","算背弃。戎王虽然不听话，终究是故主。","背不背，留给后人评价。"],["功在秦国，不在我。出谋是臣子的本分，用不用是君主的权柄。","功在我。没有我的谋略，秦称不了霸。","功归谁，不必计较。"]]}},qu_wan:{v_quwan_zhaoling:{qs:["齐侯拿兵众威胁，你怎么回答？","齐以「包茅没有进贡」为借口，你觉得有理吗？","会盟达成后，你和齐侯同乘一车检阅。你把这当荣耀吗？"],opts:[["君若用德安抚诸侯，谁敢不服？若要用兵，楚国拿方城山当城墙、拿汉水当护城河，兵再多也用不上。","应当示弱求和。齐强楚弱，不能硬顶。","强弱之势，说了也没用。"],["包茅没进贡，是寡君的罪。但齐国拿这个当借口，其实是怕楚国强。","没理。齐国要打楚国，拿这个作由头罢了。","名与实，不必细辨。"],["不是荣耀。盟约成了，兵事就停了，我因此才答应。","是荣耀。跟霸主同乘，是楚国的光彩。","荣与不荣，都是身外事。"]]},v_quwan_ci:{qs:["不卑不亢，具体怎么做？","强国用兵威相胁迫，你打算怎么应对？","出使而不辱使命，关键在哪里？"],opts:[["卑了就被轻视，亢了就被激怒。守住本分、不失辞令，就可以了。","应当卑辞求存。小国没有亢的道理。","辞令的卑亢，看形势。"],["让他知道楚国打不下来。他知道难就会退，不用打就能保住国。","应当答应他的要求。兵威之下，没有辞令可讲。","威与德，都是外在的。"],["在于让对方知道这
