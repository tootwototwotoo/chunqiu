plo",quote:"齐与鲁，甥舅之国也。",desc:"齐襄公之妹，嫁鲁桓公。与兄通，桓公知之而怒，齐襄公遂杀桓公于车中。"},{id:"ai_jiang",name:"哀姜",title:"鲁庄公夫人",state:"lu",city:"qufu",birth:-700,death:-659,role:"noble",stats:{wu:30,zhi:70,zheng:56,mei:88},skills:{quanmou:5},bias:"li",pref:"yu",teach:["quanmou"],insight:"court",quote:"吾自齐来，岂知鲁事。",desc:"齐女，嫁鲁庄公。与庆父通，庄公卒后谋立庆父，事败，齐人杀之于夷。"},{id:"xu_mu_furen",name:"许穆夫人",title:"许侯夫人",state:"xu",city:"xu",birth:-690,death:-630,role:"noble",stats:{wu:34,zhi:84,zheng:62,mei:86},skills:{xuewen:9,biancai:7},bias:"yi",pref:"si",teach:["xuewen","biancai"],insight:"diplo",quote:"载驰载驱，归唁卫侯。",desc:"卫宣公之女，嫁于许。狄灭卫，夫人欲归唁其兄，许人不许，乃赋《载驰》。中国最早有名字的女诗人。"},{id:"li_ji",name:"骊姬",title:"晋献公夫人",state:"jin",city:"jiang",birth:-700,death:-650,role:"noble",stats:{wu:28,zhi:88,zheng:60,mei:90},skills:{quanmou:9,biancai:7},bias:"li",pref:"yu",teach:["quanmou"],insight:"court",quote:"吾欲立奚齐。",desc:"骊戎之女，晋献公伐骊戎所得。谮杀太子申生，逐重耳、夷吾，晋乱二十年。"},{id:"nan_zi",name:"南子",title:"卫灵公夫人",state:"wei",city:"diqiu",birth:-560,death:-480,role:"noble",stats:{wu:30,zhi:80,zheng:58,mei:92},skills:{xuewen:7,biancai:8},bias:"ming",pref:"yu",teach:["biancai"],insight:"diplo",quote:"四方之君子不辱欲与寡君为兄弟者，必见寡小君。",desc:"宋女，卫灵公夫人。孔子适卫，南子请见，孔子见之，子路不悦。"},{id:"huai_ying",name:"怀嬴",title:"秦穆公之女",state:"qin",city:"yong",birth:-640,death:-580,role:"noble",stats:{wu:32,zhi:78,zheng:64,mei:88},skills:{biancai:6,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],insight:"diplo",quote:"秦晋，匹也，何以卑我？",desc:"秦穆公之女，先嫁晋怀公，后嫁晋文公。文公初慢之，怀嬴怒曰「秦晋匹也」。"},{id:"mu_ji",name:"穆姬",title:"秦穆公夫人",state:"qin",city:"yong",birth:-680,death:-620,role:"noble",stats:{wu:30,zhi:80,zheng:66,mei:84},skills:{xuewen:6,biancai:7},bias:"yi",pref:"si",teach:["biancai"],insight:"army",quote:"吾兄弟之故，敢以死请。",desc:"晋献公之女，嫁秦穆公。晋惠公韩原之败为秦所虏，穆姬登台履薪以死请，乃归惠公。"},{id:"deng_man",name:"邓曼",title:"楚武王夫人",state:"chu",city:"ying",birth:-730,death:-680,role:"noble",stats:{wu:28,zhi:90,zheng:68,mei:82},skills:{xuewen:8,quanmou:8},bias:"yi",pref:"si",teach:["xuewen","quanmou"],insight:"army",quote:"王禄尽矣。盈而荡，天之道也。",desc:"楚武王夫人。武王将伐随，邓曼知其必死，果薨于樠木之下。"},{id:"ding_jiang",name:"定姜",title:"卫定公夫人",state:"wei",city:"diqiu",birth:-600,death:-540,role:"noble",stats:{wu:28,zhi:86,zheng:70,mei:80},skills:{xuewen:8,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],insight:"court",quote:"是先君宗卿之嗣也，大国又以为请。",desc:"卫定公夫人。定公卒，其子衎不哀，定姜曰「是夫也，将不唯卫国之败」。后衎果出奔。"},{id:"jing_jiang",name:"敬姜",title:"鲁之寡妇",state:"lu",city:"qufu",birth:-600,death:-520,role:"noble",stats:{wu:34,zhi:88,zheng:72,mei:78},skills:{xuewen:10,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],insight:"people",quote:"民劳则思，思则善心生。",desc:"鲁大夫公父穆伯之妻。夫死子幼，犹纺绩不辍。孔子称其「不淫」。"},{id:"shu_kui",name:"叔隗",title:"狄人之女",state:"jin",city:"jiang",birth:-690,death:-630,role:"noble",stats:{wu:44,zhi:74,zheng:58,mei:84},skills:{jianshu:4,quanmou:5},bias:"shi",pref:"ma",teach:["quanmou"],insight:"people",quote:"狄土虽陋，亦有礼义。",desc:"晋文公流亡至狄，狄人伐廧咎如，得二女，长曰叔隗，以妻重耳。"},{id:"cai_ji",name:"蔡姬",title:"齐桓公夫人",state:"qi",city:"linzi",birth:-710,death:-650,role:"noble",stats:{wu:32,zhi:68,zheng:54,mei:88},skills:{quanmou:4},bias:"ming",pref:"yu",teach:["quanmou"],insight:"people",quote:"荡舟何惧，君试观之。",desc:"蔡穆公之女，齐桓公夫人。与桓公荡舟，荡而公惧，怒而归之蔡。蔡人另嫁之，桓公遂伐蔡。"},{id:"sheng_ji",name:"声姬",title:"齐灵公夫人",state:"qi",city:"linzi",birth:-590,death:-530,role:"noble",stats:{wu:28,zhi:72,zheng:60,mei:84},skills:{quanmou:5},bias:"li",pref:"yu",teach:["quanmou"],insight:"court",quote:"吾子牙，当立。",desc:"鲁女，齐灵公夫人。生子牙，谋立之，废太子光。后光复位为庄公。"},{id:"shi_kuang",name:"师旷",title:"晋之乐师",state:"jin",city:"jiang",birth:-600,death:-532,role:"artisan",stats:{wu:30,zhi:92,zheng:80,mei:74},skills:{xuewen:10,biancai:7,quanmou:7},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"君，民之望也。",desc:"晋之乐师，目盲而善听。闻钟声而知楚师之衰，以琴音察人心之邪正，屡以乐谏平公。"},{id:"yi_he",name:"医和",title:"秦之良医",state:"qin",city:"yong",birth:-580,death:-520,role:"artisan",stats:{wu:36,zhi:90,zheng:60,mei:68},skills:{xuewen:9,quanmou:4},bias:"yi",pref:"qi",teach:["xuewen"],quote:"疾不可为也。是谓近女室，疾如蛊。",desc:"秦之良医。晋平公疾，求医于秦，医和视之，曰「疾不可为也，是谓近女室」，遂以「蛊」喻其政。"},{id:"yi_huan",name:"医缓",title:"秦之良医",state:"qin",city:"yong",birth:-610,death:-550,role:"artisan",stats:{wu:34,zhi:88,zheng:58,mei:66},skills:{xuewen:9},bias:"yi",pref:"su",teach:["xuewen"],quote:"疾在肓之上、膏之下，攻之不可，达之不及，药不至焉。",desc:"秦之良医。晋景公病，求医于秦，医缓至，曰「在肓之上、膏之下」，不可为也。「病入膏肓」出于此。"},{id:"gongshu_ban",name:"公输般",title:"鲁之巧匠",state:"lu",city:"qufu",birth:-507,death:-444,role:"artisan",stats:{wu:62,zhi:88,zheng:50,mei:62},skills:{bingfa:6,quanmou:6,sheshu:5},bias:"li",pref:"tie",teach:["bingfa","quanmou"],quote:"吾知所以距子矣，吾不言。",desc:"鲁之巧匠，即鲁班。为楚造云梯钩拒以攻宋，墨子九距之，遂罢。"},{id:"bo_ya",name:"伯牙",title:"善琴者",state:"jin",city:"handan",birth:-600,death:-540,role:"artisan",stats:{wu:32,zhi:84,zheng:54,mei:88},skills:{xuewen:9,biancai:6},bias:"ming",pref:"yu",teach:["xuewen"],quote:"巍巍乎志在高山，汤汤乎志在流水。",desc:"善鼓琴者。钟子期听其琴，知其志在高山流水。子期死，伯牙破琴绝弦，终身不复鼓。"},{id:"you_meng",name:"优孟",title:"楚之优人",state:"chu",city:"ying",birth:-620,death:-560,role:"artisan",stats:{wu:28,zhi:86,zheng:62,mei:84},skills:{biancai:9,quanmou:7},bias:"ming",pref:"yu",teach:["biancai","quanmou"],quote:"请为大王言孙叔敖。",desc:"楚之优人，善谑谏。孙叔敖死后其子穷困，优孟着其衣冠见庄王，王以为叔敖复生，遂封其子。"},{id:"zi_qing",name:"梓庆",title:"鲁之木工",state:"lu",city:"qufu",birth:-560,death:-500,role:"artisan",stats:{wu:52,zhi:82,zheng:48,mei:60},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"tie",teach:["quanmou"],quote:"臣将为鐻，未尝敢以耗气也，必齐以静心。",desc:"鲁之木工，削木为鐻，见者惊犹鬼神。自言「斋三日而不敢怀庆赏爵禄」，故能合天。"},{id:"lun_bian",name:"轮扁",title:"齐之斫轮者",state:"qi",city:"linzi",birth:-590,death:-530,role:"artisan",stats:{wu:48,zhi:84,zheng:46,mei:58},skills:{xuewen:6,quanmou:6},bias:"yi",pref:"tie",teach:["xuewen"],quote:"君之所读者，古人之糟魄已夫。",desc:"齐之斫轮匠。见桓公读书于堂上，曰「君之所读者，古人之糟魄已夫」，以斫轮之技不可言传为喻。"},{id:"bo_zi_qi",name:"钟子期",title:"知音者",state:"chu",city:"ying",birth:-600,death:-540,role:"artisan",stats:{wu:30,zhi:82,zheng:52,mei:80},skills:{xuewen:8,biancai:5},bias:"yi",pref:"yu",teach:["xuewen"],quote:"善哉！峨峨兮若泰山。",desc:"伯牙之知音。听琴而知高山流水之志，死而伯牙绝弦。"},{id:"qi_mu",name:"匠石",title:"楚之巧匠",state:"chu",city:"ying",birth:-550,death:-490,role:"artisan",stats:{wu:56,zhi:80,zheng:46,mei:56},skills:{quanmou:6,jianshu:4},bias:"shi",pref:"tie",teach:["quanmou"],quote:"匠石运斤成风，听而斫之。",desc:"楚之巧匠。有郢人以白垩涂鼻端如蝇翼，匠石运斤成风而斫之，尽垩而鼻不伤。"},{id:"zhou_gong",name:"周公黑肩",title:"周之卿士",state:"zhou",city:"luoyi",birth:-760,death:-694,role:"minister",stats:{wu:42,zhi:76,zheng:80,mei:62},skills:{xuewen:7,quanmou:6},bias:"yi",pref:"yu",teach:["xuewen","quanmou"],quote:"王纲虽替，礼不可废。",desc:"周桓公，周之卿士。欲弑王而立王子克，事败见杀。"},{id:"zhou_wang_sun",name:"王孙满",title:"周之大夫",state:"zhou",city:"luoyi",birth:-630,death:-570,role:"minister",stats:{wu:34,zhi:88,zheng:82,mei:70},skills:{xuewen:9,biancai:8},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"在德不在鼎。",desc:"周定王时大夫。楚庄王问鼎轻重，对曰「在德不在鼎」，楚子乃退。"},{id:"zhou_dan_mu",name:"单穆公",title:"周之卿士",state:"zhou",city:"luoyi",birth:-570,death:-510,role:"minister",stats:{wu:36,zhi:84,zheng:82,mei:66},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"绝民用以实王府，犹塞川原而为潢污也。",desc:"周景王时将铸大钱，单穆公谏以「绝民用以实王府」之害。"},{id:"qi_bao",name:"齐鲍叔牙",title:"齐之大夫",state:"qi",city:"linzi",birth:-716,death:-644,role:"minister",stats:{wu:44,zhi:82,zheng:84,mei:70},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"君若欲霸王，非管夷吾不可。",desc:"与管仲友善，荐之为相。管仲曰「生我者父母，知我者鲍子也」。"},{id:"qi_yan_ruo",name:"齐晏弱",title:"齐之大夫",state:"qi",city:"linzi",birth:-620,death:-556,role:"minister",stats:{wu:40,zhi:78,zheng:76,mei:66},skills:{quanmou:6,biancai:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"晏氏世为齐卿。",desc:"晏婴之父，齐之世卿。"},{id:"qi_cui_wu",name:"齐崔杼",title:"齐之大夫",state:"qi",city:"linzi",birth:-620,death:-546,role:"minister",stats:{wu:56,zhi:74,zheng:66,mei:58},skills:{quanmou:8,bingfa:5},bias:"li",pref:"ma",teach:["quanmou"],quote:"吾弑其君，太史书之。",desc:"弑齐庄公，太史书「崔杼弑其君」，杀之；其弟继书，乃止。"},{id:"qi_chen_qi",name:"齐陈乞",title:"齐之大夫",state:"qi",city:"linzi",birth:-560,death:-485,role:"minister",stats:{wu:42,zhi:82,zheng:72,mei:60},skills:{quanmou:9},bias:"li",pref:"yu",teach:["quanmou"],quote:"陈氏厚施，民归之矣。",desc:"陈僖子，以大斗贷、小斗收，收齐国之民心，陈氏自此专齐。"},{id:"jin_zhao_dun",name:"赵盾",title:"晋之正卿",state:"jin",city:"jiang",birth:-650,death:-601,role:"minister",stats:{wu:50,zhi:86,zheng:84,mei:66},skills:{quanmou:8,bingfa:6},bias:"yi",pref:"si",teach:["quanmou","bingfa"],quote:"冬日之日，夏日之日。",desc:"晋之正卿，专国政二十年。太史书「赵盾弑其君」，孔子曰「越竟乃免」。"},{id:"jin_shi_hui",name:"士会",title:"晋之大夫",state:"jin",city:"jiang",birth:-640,death:-580,role:"minister",stats:{wu:48,zhi:86,zheng:82,mei:64},skills:{quanmou:8,biancai:7},bias:"yi",pref:"si",teach:["quanmou","biancai"],quote:"民之多幸，国之不幸也。",desc:"晋之贤大夫，随武子。历事四君，为政宽而有法。"},{id:"jin_han_xuan",name:"韩宣子",title:"晋之正卿",state:"jin",city:"jiang",birth:-600,death:-541,role:"minister",stats:{wu:40,zhi:82,zheng:84,mei:68},skills:{quanmou:7,xuewen:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"周礼尽在鲁矣。",desc:"韩起，晋之正卿。聘于鲁，观《易象》与《鲁春秋》，叹「周礼尽在鲁矣」。"},{id:"jin_wei_shu",name:"魏舒",title:"晋之正卿",state:"jin",city:"jiang",birth:-580,death:-509,role:"general",stats:{wu:66,zhi:78,zheng:70,mei:58},skills:{bingfa:8,quanmou:6},bias:"shi",pref:"ma",teach:["bingfa"],quote:"毁车为行。",desc:"魏献子。大原之役毁车为行，以步兵胜狄，开中国步兵之先。"},{id:"chu_zhi_wei",name:"薳子冯",title:"楚之令尹",state:"chu",city:"ying",birth:-600,death:-545,role:"minister",stats:{wu:44,zhi:80,zheng:78,mei:62},skills:{quanmou:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾闻之，君子不以其所能者病人。",desc:"楚之令尹，以病辞位。"},{id:"chu_shen_wu",name:"申无宇",title:"楚之大夫",state:"chu",city:"shen",birth:-600,death:-540,role:"minister",stats:{wu:42,zhi:82,zheng:76,mei:62},skills:{quanmou:6,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"国有大城，未有利也。",desc:"楚之大夫，谏灵王城陈蔡不羹，以「末大必折，尾大不掉」为喻。"},{id:"chu_wu_she",name:"伍奢",title:"楚之太子太傅",state:"chu",city:"ying",birth:-620,death:-522,role:"minister",stats:{wu:46,zhi:84,zheng:80,mei:66},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"王独奈何以谗贼小臣疏骨肉之亲乎？",desc:"伍子胥之父，楚平王杀之，子胥奔吴。"},{id:"qin_you_yu2",name:"秦子车",title:"秦之大夫",state:"qin",city:"yong",birth:-650,death:-600,role:"minister",stats:{wu:44,zhi:78,zheng:74,mei:66},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"三良殉葬，国人哀之。",desc:"子车氏三良之一，秦穆公卒而从死，国人赋《黄鸟》。"},{id:"qin_gu_rui",name:"秦庶长鼌",title:"秦之庶长",state:"qin",city:"yong",birth:-540,death:-480,role:"minister",stats:{wu:56,zhi:70,zheng:66,mei:56},skills:{bingfa:6,quanmou:5},bias:"shi",pref:"tie",teach:["bingfa"],quote:"庶长专秦政。",desc:"秦之庶长，逼怀公自杀，专秦国之政。"},{id:"lu_zang_wen",name:"臧哀伯",title:"鲁之大夫",state:"lu",city:"qufu",birth:-730,death:-680,role:"minister",stats:{wu:36,zhi:82,zheng:80,mei:68},skills:{xuewen:8,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"君人者，将昭德塞违。",desc:"臧哀伯，鲁之大夫。桓公取郜大鼎于宋，哀伯谏以「昭德塞违」。"},{id:"lu_shu_sun",name:"叔孙豹",title:"鲁之卿",state:"lu",city:"qufu",birth:-600,death:-537,role:"minister",stats:{wu:40,zhi:84,zheng:82,mei:70},skills:{xuewen:8,biancai:8},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"太上立德，其次立功，其次立言。",desc:"叔孙穆子，鲁之三桓之一。聘于晋，论「三不朽」。"},{id:"lu_ji_wu_zi",name:"季武子",title:"鲁之正卿",state:"lu",city:"qufu",birth:-620,death:-535,role:"minister",stats:{wu:38,zhi:80,zheng:84,mei:64},skills:{quanmou:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"三分公室，而各有其一。",desc:"季孙宿，鲁之正卿。三分公室而季氏取其二，公室自此卑弱。"},{id:"song_yu_shi",name:"鱼石",title:"宋之大夫",state:"song",city:"shangqiu",birth:-620,death:-560,role:"minister",stats:{wu:42,zhi:74,zheng:70,mei:58},skills:{quanmou:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾出奔楚，终归于宋。",desc:"宋之大夫，出奔楚，后借楚力入于彭城。"},{id:"song_le_xi",name:"乐喜",title:"宋之司城",state:"song",city:"shangqiu",birth:-600,death:-540,role:"minister",stats:{wu:38,zhi:84,zheng:86,mei:70},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"天生五材，民并用之，废一不可。",desc:"宋之司城子罕。宋饥，请出粟以贷，而以门之左为师。"},{id:"zheng_gao_ke",name:"高克",title:"郑之大夫",state:"zheng",city:"xinzheng",birth:-730,death:-670,role:"minister",stats:{wu:48,zhi:70,zheng:66,mei:58},skills:{bingfa:5},bias:"shi",pref:"ma",teach:["bingfa"],quote:"郑伯使我将兵，久而不召。",desc:"郑之大夫，帅师久而不召，师溃而奔陈。"},{id:"zheng_zi_zhan",name:"子展",title:"郑之上卿",state:"zheng",city:"xinzheng",birth:-600,death:-544,role:"minister",stats:{wu:40,zhi:82,zheng:84,mei:66},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"郑之七穆，罕氏为长。",desc:"罕虎之祖，郑之上卿，与子产同秉国政。"},{id:"zheng_ran_ming",name:"然明",title:"郑之大夫",state:"zheng",city:"xinzheng",birth:-580,death:-520,role:"minister",stats:{wu:36,zhi:84,zheng:78,mei:64},skills:{biancai:7,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"视民如伤。",desc:"郑之大夫鬷蔑。子产问政，对曰「视民如伤，岂敢慢之」。"},{id:"wei_shi_que",name:"石碏",title:"卫之大夫",state:"wei",city:"chaoge",birth:-750,death:-700,role:"minister",stats:{wu:44,zhi:80,zheng:84,mei:68},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"大义灭亲。",desc:"卫之老臣。子石厚助州吁弑君，石碏设计诛之，《春秋》称「大义灭亲」。"},{id:"wei_ning_wu",name:"宁武子",title:"卫之大夫",state:"wei",city:"diqiu",birth:-660,death:-600,role:"minister",stats:{wu:38,zhi:84,zheng:82,mei:68},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"邦有道则知，邦无道则愚。",desc:"宁俞，卫之大夫。孔子曰「其知可及也，其愚不可及也」。"},{id:"wei_shi_yu",name:"史鱼",title:"卫之大夫",state:"wei",city:"diqiu",birth:-540,death:-490,role:"minister",stats:{wu:34,zhi:82,zheng:80,mei:66},skills:{biancai:7,xuewen:6},bias:"yi",pref:"si",teach:["biancai"],quote:"尸谏。",desc:"史鰌，卫之大夫。将死，命其子以尸谏灵公用蘧伯玉。孔子称其「直」。"},{id:"wei_qu_bo_yu",name:"蘧伯玉",title:"卫之贤大夫",state:"wei",city:"diqiu",birth:-570,death:-490,role:"minister",stats:{wu:34,zhi:86,zheng:84,mei:72},skills:{xuewen:8,quanmou:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"欲寡其过而未能也。",desc:"蘧瑗，卫之贤大夫。孔子称「君子哉蘧伯玉，邦有道则仕，邦无道则可卷而怀之」。"},{id:"yan_zhao_gong",name:"燕召公",title:"燕之卿",state:"yan",city:"ji",birth:-720,death:-660,role:"minister",stats:{wu:40,zhi:78,zheng:78,mei:64},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"燕僻北隅，守其宗庙。",desc:"燕之世卿，守宗庙于北隅。"},{id:"yan_guo_wei",name:"郭隗",title:"燕之大夫",state:"yan",city:"ji",birth:-350,death:-280,role:"minister",stats:{wu:34,zhi:84,zheng:82,mei:70},skills:{biancai:8,quanmou:7},bias:"ming",pref:"yu",teach:["biancai"],quote:"王必欲致士，先从隗始。",desc:"燕昭王欲招贤，郭隗曰「先从隗始」，于是乐毅、邹衍皆至。"},{id:"wu_ji_zha",name:"季札",title:"吴之公子",state:"wu",city:"gusu",birth:-580,death:-507,role:"minister",stats:{wu:42,zhi:90,zheng:86,mei:82},skills:{xuewen:10,biancai:9},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"观止矣。若有他乐，吾不敢请已。",desc:"吴之公子，寿梦少子。屡让国而不受，聘于鲁观周乐，叹「观止」。"},{id:"wu_bei_li",name:"被离",title:"吴之大夫",state:"wu",city:"gusu",birth:-540,death:-490,role:"minister",stats:{wu:40,zhi:78,zheng:72,mei:62},skills:{quanmou:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾观员之为人，不可亲也。",desc:"吴之大夫，伍子胥之友，后为伯嚭所谗。"},{id:"wu_sun_luo",name:"孙骆",title:"吴之行人",state:"wu",city:"gusu",birth:-520,death:-470,role:"minister",stats:{wu:38,zhi:80,zheng:76,mei:70},skills:{biancai:8},bias:"ming",pref:"si",teach:["biancai"],quote:"吴之行人，通使于晋。",desc:"吴之行人，黄池之会时为吴王通款于晋。"},{id:"yue_ji_ni",name:"计倪",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-470,role:"minister",stats:{wu:36,zhi:84,zheng:80,mei:64},skills:{shanggu:7,suanshu:8},bias:"li",pref:"su",teach:["shanggu","suanshu"],quote:"知斗则修备，时用则知物。",desc:"越大夫计然，善治生。范蠡用其术，十年国富。"},{id:"chen_yuan_tao",name:"辕涛涂",title:"陈之大夫",state:"chen",city:"wanqiu",birth:-680,death:-630,role:"minister",stats:{wu:40,zhi:76,zheng:74,mei:62},skills:{quanmou:6,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"师出于陈郑之间，国必甚病。",desc:"陈之大夫。齐桓公伐楚还，欲道于陈郑，涛涂诱之东归，致齐师陷于沛泽。"},{id:"chen_kong_ning",name:"孔宁",title:"陈之大夫",state:"chen",city:"wanqiu",birth:-640,death:-590,role:"minister",stats:{wu:38,zhi:66,zheng:60,mei:58},skills:{quanmou:4},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾与夏姬，戏于朝。",desc:"陈之大夫，与仪行父同通于夏姬，后奔楚。"},{id:"cai_sheng_zi",name:"蔡声子",title:"蔡之大夫",state:"cai",city:"shangcai",birth:-620,death:-560,role:"minister",stats:{wu:36,zhi:82,zheng:76,mei:66},skills:{biancai:8,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"楚多淫刑，其大夫逃死于四方。",desc:"蔡之声子，与伍举善。使晋还楚，为伍举游说，复其位。"},{id:"cao_xi_fu",name:"僖负羁",title:"曹之大夫",state:"cao",city:"tao",birth:-690,death:-630,role:"minister",stats:{wu:40,zhi:78,zheng:74,mei:66},skills:{quanmou:6,biancai:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"晋公子贤，而穷于外，从者皆国器。",desc:"曹之大夫。晋文公过曹，曹共公观其骈胁，僖负羁独馈盘飧置璧。后晋伐曹，免其族。"},{id:"ju_wan",name:"莒仆",title:"莒之大夫",state:"ju",city:"ju",birth:-600,death:-550,role:"minister",stats:{wu:42,zhi:72,zheng:66,mei:58},skills:{quanmou:5},bias:"shi",pref:"ma",teach:["quanmou"],quote:"莒虽小，可持其政。",desc:"莒之大夫，为政于莒。"},{id:"zhu_mao",name:"茅地",title:"邾之大夫",state:"zhu",city:"zhu",birth:-580,death:-530,role:"minister",stats:{wu:38,zhi:72,zheng:68,mei:58},skills:{quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"邾事鲁，不敢违。",desc:"邾之大夫，从政于鲁邾之间。"},{id:"xu_bai_feng",name:"许伯",title:"许之大夫",state:"xu",city:"xu",birth:-660,death:-610,role:"minister",stats:{wu:40,zhi:74,zheng:70,mei:60},skills:{quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"许事楚，不敢有二。",desc:"许之大夫，从君迁于楚。"},{id:"qi_tian_rang_ju2",name:"田穰苴",title:"齐之大司马",state:"qi",city:"linzi",birth:-590,death:-520,role:"general",stats:{wu:88,zhi:82,zheng:68,mei:60},skills:{bingfa:10,jianshu:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"将受命之日则忘其家。",desc:"即司马穰苴，田完之后。斩监军庄贾以立威，晋燕之师闻风而退。"},{id:"qi_guan_zhi_fu",name:"管至父",title:"齐之大夫",state:"qi",city:"linzi",birth:-720,death:-685,role:"general",stats:{wu:60,zhi:68,zheng:62,mei:56},skills:{bingfa:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"及瓜而代。",desc:"齐之大夫，与连称戍葵丘，瓜时而往，曰「及瓜而代」。期至而不代，遂弑襄公。"},{id:"jin_xian_zhen2",name:"荀林父",title:"晋之中军元帅",state:"jin",city:"jiang",birth:-620,death:-593,role:"general",stats:{wu:74,zhi:82,zheng:74,mei:60},skills:{bingfa:8,quanmou:6},bias:"yi",pref:"ma",teach:["bingfa"],quote:"吾为元帅，师不用命，是吾罪也。",desc:"荀伯，晋之中军元帅。邲之战败于楚，请死，晋侯不许。"},{id:"jin_xi_bo",name:"郤克",title:"晋之上卿",state:"jin",city:"jiang",birth:-600,death:-583,role:"general",stats:{wu:76,zhi:78,zheng:72,mei:52},skills:{bingfa:8},bias:"shi",pref:"tie",teach:["bingfa"],quote:"所不此报，无能涉河。",desc:"郤献子，跛而眇。使齐受辱，后帅师败齐于鞍。"},{id:"jin_luan_shu2",name:"荀罃",title:"晋之武子",state:"jin",city:"jiang",birth:-600,death:-560,role:"general",stats:{wu:70,zhi:86,zheng:78,mei:62},skills:{bingfa:9,quanmou:7},bias:"yi",pref:"si",teach:["bingfa"],quote:"吾不难以身易国。",desc:"荀罃，晋之智将。邲之战为楚所俘，九年后归，后主晋国之政。"},{id:"chu_pan_dang",name:"潘党",title:"楚之将军",state:"chu",city:"ying",birth:-620,death:-580,role:"general",stats:{wu:78,zhi:70,zheng:60,mei:56},skills:{bingfa:7,jianshu:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"臣闻克敌必示子孙。",desc:"楚之将军，邲之战后请筑京观，庄王不许。"},{id:"chu_zi_fan2",name:"子反",title:"楚之大司马",state:"chu",city:"ying",birth:-620,death:-575,role:"general",stats:{wu:76,zhi:72,zheng:62,mei:58},skills:{bingfa:8},bias:"li",pref:"yu",teach:["bingfa"],quote:"吾不能以见先君。",desc:"公子侧，楚之大司马。鄢陵之败，因醉误军，自杀。"},{id:"chu_tang_mei",name:"唐昧",title:"楚之将",state:"chu",city:"ying",birth:-560,death:-500,role:"general",stats:{wu:74,zhi:68,zheng:58,mei:54},skills:{bingfa:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"楚师虽众，将不一也。",desc:"楚之将，与吴争于江淮。"},{id:"qin_meng_ming",name:"孟明视",title:"秦之将军",state:"qin",city:"yong",birth:-660,death:-600,role:"general",stats:{wu:80,zhi:74,zheng:64,mei:58},skills:{bingfa:8,jianshu:6},bias:"shi",pref:"ma",teach:["bingfa"],quote:"吾未获一军，敢不自勉。",desc:"百里视，百里奚之子。殽之败而后修政，终败晋师于王官，秦霸西戎。"},{id:"qin_xi_qi_shu",name:"西乞术",title:"秦之将军",state:"qin",city:"yong",birth:-660,death:-600,role:"general",stats:{wu:74,zhi:70,zheng:62,mei:56},skills:{bingfa:7},bias:"shi",pref:"tie",teach:["bingfa"],quote:"三将俱没，幸得归国。",desc:"蹇叔之子，与孟明视同败于殽。"},{id:"lu_cao_mo",name:"曹沫",title:"鲁之将",state:"lu",city:"qufu",birth:-700,death:-660,role:"general",stats:{wu:82,zhi:64,zheng:56,mei:60},skills:{jianshu:9,bingfa:5},bias:"yi",pref:"tie",teach:["jianshu"],quote:"齐强鲁弱，君其图之。",desc:"即曹刿。长勺之战以「一鼓作气」败齐。一说齐桓公会鲁，曹沫执匕首劫之，尽返鲁地。"},{id:"lu_shu_liang_he",name:"叔梁纥",title:"鲁之陬邑大夫",state:"lu",city:"qufu",birth:-622,death:-549,role:"general",stats:{wu:90,zhi:62,zheng:58,mei:62},skills:{jianshu:8,sheshu:7,bingfa:5},bias:"shi",pref:"tie",teach:["jianshu","sheshu"],quote:"有力如虎。",desc:"孔子之父。偪阳之战以双手托悬门，救出诸侯之师。"},{id:"wu_fu_gai",name:"夫概",title:"吴之将军",state:"wu",city:"gusu",birth:-540,death:-490,role:"general",stats:{wu:78,zhi:68,zheng:58,mei:56},skills:{bingfa:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"吾兄在楚，吾当归国。",desc:"阖闾之弟。吴入郢，夫概先归自立，为阖闾所败，奔楚。"},{id:"yue_zhu_ji",name:"诸稽郢",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-480,role:"general",stats:{wu:70,zhi:80,zheng:70,mei:64},skills:{bingfa:7,biancai:7},bias:"yi",pref:"si",teach:["bingfa"],quote:"请为吴王前马。",desc:"越大夫，善辞令。夫椒之败后为使于吴，卑辞厚礼以存越。"},{id:"yue_ling_gu",name:"灵姑浮",title:"越之将军",state:"yue",city:"kuaiji",birth:-560,death:-500,role:"general",stats:{wu:82,zhi:66,zheng:56,mei:58},skills:{jianshu:8,bingfa:6},bias:"shi",pref:"tie",teach:["jianshu"],quote:"伤吴王趾。",desc:"越之将军。檇李之战，以戈击吴王阖闾，伤其趾，阖闾遂死。"},{id:"song_hua_ou",name:"华耦",title:"宋之司马",state:"song",city:"shangqiu",birth:-620,death:-580,role:"general",stats:{wu:70,zhi:72,zheng:64,mei:58},skills:{bingfa:7},bias:"yi",pref:"ma",teach:["bingfa"],quote:"宋之司马，帅师从晋。",desc:"宋之司马，屡从晋师。"},{id:"song_xiang_dai",name:"向带",title:"宋之大夫",state:"song",city:"shangqiu",birth:-620,death:-575,role:"general",stats:{wu:66,zhi:70,zheng:62,mei:56},skills:{bingfa:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"宋虽小，亦有死士。",desc:"宋之大夫，帅师御楚。"},{id:"wei_sun_liang",name:"孙良夫",title:"卫之大夫",state:"wei",city:"diqiu",birth:-620,death:-570,role:"general",stats:{wu:68,zhi:74,zheng:66,mei:58},skills:{bingfa:7,quanmou:5},bias:"yi",pref:"ma",teach:["bingfa"],quote:"卫之社稷，赖君是赖。",desc:"孙桓子，卫之大夫。新筑之败后如晋乞师，败齐于鞍。"},{id:"wei_bei_gong",name:"北宫括",title:"卫之大夫",state:"wei",city:"diqiu",birth:-600,death:-550,role:"general",stats:{wu:66,zhi:70,zheng:62,mei:56},skills:{bingfa:6},bias:"yi",pref:"tie",teach:["bingfa"],quote:"卫之世卿，帅师从晋。",desc:"北宫懿子，卫之世卿。"},{id:"zheng_gao_qu_mi",name:"高渠弥",title:"郑之大夫",state:"zheng",city:"xinzheng",birth:-720,death:-694,role:"general",stats:{wu:74,zhi:66,zheng:60,mei:56},skills:{bingfa:7,jianshu:5},bias:"shi",pref:"ma",teach:["bingfa"],quote:"吾弑昭公，立子亹。",desc:"郑之大夫。繻葛之战为郑庄公车右，后弑昭公。"},{id:"zheng_zhu_dan",name:"祝聃",title:"郑之将军",state:"zheng",city:"xinzheng",birth:-740,death:-690,role:"general",stats:{wu:80,zhi:66,zheng:58,mei:54},skills:{sheshu:8,bingfa:6},bias:"shi",pref:"ma",teach:["sheshu","bingfa"],quote:"射王中肩。",desc:"郑之将军。繻葛之战射周桓王中肩，天子之威自此尽失。"},{id:"chen_xia_zheng_shu2",name:"夏徵舒",title:"陈之大夫",state:"chen",city:"wanqiu",birth:-625,death:-598,role:"general",stats:{wu:76,zhi:64,zheng:56,mei:62},skills:{jianshu:7,sheshu:6},bias:"shi",pref:"ma",teach:["sheshu"],quote:"吾不忍其辱。",desc:"陈之大夫，夏姬之子。弑陈灵公，楚庄王讨而诛之。"},{id:"cai_gong_zi_xie",name:"蔡公子燮",title:"蔡之司马",state:"cai",city:"shangcai",birth:-620,death:-553,role:"general",stats:{wu:68,zhi:72,zheng:64,mei:58},skills:{bingfa:6,quanmou:5},bias:"yi",pref:"si",teach:["bingfa"],quote:"蔡之存亡，在此一举。",desc:"蔡之司马，谋从晋而见杀。"},{id:"cao_xin_shi",name:"辛巳",title:"曹之大夫",state:"cao",city:"tao",birth:-640,death:-590,role:"general",stats:{wu:66,zhi:68,zheng:60,mei:54},skills:{bingfa:6},bias:"yi",pref:"tie",teach:["bingfa"],quote:"曹小，勉从大国之役。",desc:"曹之大夫，从晋楚之役。"},{id:"ju_zi_zhu",name:"莒拏",title:"莒之大夫",state:"ju",city:"ju",birth:-600,death:-550,role:"general",stats:{wu:70,zhi:64,zheng:58,mei:54},skills:{bingfa:6,jianshu:5},bias:"shi",pref:"ma",teach:["jianshu"],quote:"莒人好武。",desc:"莒之大夫，以勇闻于鲁莒之间。"},{id:"zhu_shu_liang",name:"邾庶其",title:"邾之大夫",state:"zhu",city:"zhu",birth:-600,death:-550,role:"general",stats:{wu:64,zhi:68,zheng:60,mei:56},skills:{bingfa:5},bias:"li",pref:"su",teach:["bingfa"],quote:"以邑奔鲁。",desc:"邾之大夫，以漆闾丘奔鲁，鲁侯厚待之。"},{id:"sui_shao_shi",name:"少师",title:"随之大夫",state:"sui",city:"sui",birth:-720,death:-690,role:"general",stats:{wu:60,zhi:54,zheng:50,mei:52},skills:{bingfa:5},bias:"shi",pref:"ma",teach:["bingfa"],quote:"速战而不设备。",desc:"随之少师，宠于随侯。楚武王侵随，少师请追之，随师败于速杞。"},{id:"xu_gong_sun",name:"许公孙获",title:"许之大夫",state:"xu",city:"xu",birth:-720,death:-680,role:"general",stats:{wu:66,zhi:66,zheng:58,mei:54},skills:{bingfa:5},bias:"yi",pref:"si",teach:["bingfa"],quote:"许之事楚，非本心也。",desc:"许之大夫，郑庄公使居许西偏。"},{id:"chang_hong",name:"苌弘",title:"周之史官",state:"zhou",city:"luoyi",birth:-580,death:-492,role:"scholar",stats:{wu:34,zhi:88,zheng:80,mei:72},skills:{xuewen:9,biancai:7,quanmou:6},bias:"ming",pref:"yu",teach:["xuewen","biancai"],quote:"天地之气，不失其序。",desc:"周之史官，通天地之气。晋范吉射、中行寅败，弘与之善，赵鞅以为讨，周人杀之。后世传其血化碧玉。"},{id:"nan_rong_chu",name:"南荣趎",title:"老聃弟子",state:"zhou",city:"luoyi",birth:-500,death:-430,role:"scholar",stats:{wu:32,zhi:84,zheng:66,mei:68},skills:{xuewen:8},bias:"yi",pref:"su",teach:["xuewen"],quote:"吾见老子，茫然自失。",desc:"老子弟子。尝携粮见老子，七日七夜至，问道之要。"},{id:"zuo_qiu_ming",name:"左丘明",title:"鲁之史官",state:"lu",city:"qufu",birth:-540,death:-452,role:"scholar",stats:{wu:30,zhi:92,zheng:82,mei:74},skills:{xuewen:10,biancai:8},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"与其为善，不如为善之察也。",desc:"鲁之太史。孔子称「巧言令色足恭，左丘明耻之」。相传作《左传》，述春秋之微言。"},{id:"yan_yuan",name:"颜回",title:"孔门之首",state:"lu",city:"qufu",birth:-521,death:-481,role:"scholar",stats:{wu:28,zhi:90,zheng:76,mei:80},skills:{xuewen:9},bias:"yi",pref:"si",teach:["xuewen"],quote:"一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。",desc:"字子渊，孔门德行第一。年二十九发白，四十一岁卒，孔子哭之恸。"},{id:"zi_lu",name:"子路",title:"孔门政事",state:"lu",city:"qufu",birth:-542,death:-480,role:"scholar",stats:{wu:78,zhi:70,zheng:74,mei:66},skills:{jianshu:7,biancai:6,xuewen:5},bias:"shi",pref:"tie",teach:["jianshu","xuewen"],quote:"君子死，冠不免。",desc:"仲由，字子路，孔门政事科。仕卫，蒯聩之乱，结缨而死。"},{id:"zeng_shen",name:"曾参",title:"孔门传道",state:"lu",city:"qufu",birth:-505,death:-435,role:"scholar",stats:{wu:30,zhi:86,zheng:78,mei:72},skills:{xuewen:9,quanmou:5},bias:"yi",pref:"si",teach:["xuewen"],quote:"吾日三省吾身。",desc:"字子舆，孔子晚年弟子。作《孝经》，传孔子之道于子思、孟子一系。"},{id:"zi_gong",name:"子贡",title:"孔门言语",state:"lu",city:"qufu",birth:-520,death:-456,role:"scholar",stats:{wu:40,zhi:88,zheng:84,mei:82},skills:{biancai:9,shanggu:8},bias:"ming",pref:"mingzhu",teach:["biancai","shanggu"],quote:"夫子之文章，可得而闻也。",desc:"端木赐，字子贡，孔门言语科。一出存鲁、乱齐、破吴、强晋而霸越，善货殖，家累千金。"},{id:"you_zi",name:"有子",title:"孔门之徒",state:"lu",city:"qufu",birth:-518,death:-458,role:"scholar",stats:{wu:30,zhi:84,zheng:76,mei:70},skills:{xuewen:8},bias:"yi",pref:"si",teach:["xuewen"],quote:"礼之用，和为贵。",desc:"有若，孔子弟子。孔子既殁，门人以其貌似孔子，尝奉为师。"},{id:"mo_zi",name:"墨子",title:"墨家巨子",state:"lu",city:"qufu",birth:-470,death:-391,role:"scholar",stats:{wu:62,zhi:92,zheng:84,mei:72},skills:{xuewen:9,biancai:9,bingfa:8},bias:"yi",pref:"si",teach:["xuewen","biancai","bingfa"],quote:"兼相爱，交相利。",desc:"名翟，墨家之祖。倡兼爱、非攻、尚贤、节用。闻楚欲攻宋，裂裳裹足十日十夜至郢，九距公输般之攻。"},{id:"chang_ju",name:"长沮",title:"隐者",state:"lu",city:"qufu",birth:-520,death:-450,role:"scholar",stats:{wu:44,zhi:78,zheng:60,mei:66},skills:{xuewen:7},bias:"ming",pref:"su",teach:["xuewen"],quote:"是知津矣。",desc:"隐者，与桀溺耦耕。孔子使子路问津，长沮讥曰「是知津矣」。"},{id:"jie_ni",name:"桀溺",title:"隐者",state:"lu",city:"qufu",birth:-520,death:-450,role:"scholar",stats:{wu:46,zhi:76,zheng:58,mei:64},skills:{xuewen:6},bias:"ming",pref:"su",teach:["xuewen"],quote:"滔滔者天下皆是也，而谁以易之？",desc:"隐者，与长沮耦耕。谓子路「与其从辟人之士，岂若从辟世之士哉」。"},{id:"chunyu_kun",name:"淳于髡",title:"齐之稷下",state:"qi",city:"linzi",birth:-386,death:-310,role:"scholar",stats:{wu:38,zhi:88,zheng:80,mei:84},skills:{biancai:10,quanmou:7},bias:"ming",pref:"yu",teach:["biancai"],quote:"酒极则乱，乐极则悲。",desc:"齐之赘婿，稷下先生。滑稽多辩，数使诸侯未尝屈辱。以「一鸣惊人」讽齐威王。"},{id:"zou_yan",name:"邹衍",title:"阴阳家",state:"qi",city:"linzi",birth:-324,death:-250,role:"scholar",stats:{wu:32,zhi:90,zheng:76,mei:74},skills:{xuewen:10,biancai:8},bias:"ming",pref:"yu",teach:["xuewen","biancai"],quote:"五德终始，各有宜也。",desc:"齐之阴阳家。倡五德终始、大九州之说。适燕，昭王拥彗先驱。"},{id:"gan_de",name:"甘德",title:"齐之天官",state:"qi",city:"linzi",birth:-400,death:-340,role:"scholar",stats:{wu:30,zhi:90,zheng:60,mei:66},skills:{xuewen:8,suanshu:9},bias:"yi",pref:"su",teach:["suanshu","xuewen"],quote:"岁星所在，其国不可伐。",desc:"齐之天官。与魏人石申同测天象，著《天文星占》，为后世甘石星经。"},{id:"bian_que",name:"扁鹊",title:"齐之名医",state:"qi",city:"linzi",birth:-407,death:-310,role:"artisan",stats:{wu:40,zhi:88,zheng:60,mei:70},skills:{xuewen:8,suanshu:6},bias:"yi",pref:"su",teach:["xuewen"],quote:"疾在骨髓，司命之所属，无奈何也。",desc:"姓秦名越人，渤海郡人。见蔡桓公，望其色而知病在腠理，三见而退。"},{id:"shi_mo",name:"史墨",title:"晋之史官",state:"jin",city:"jiang",birth:-520,death:-450,role:"scholar",stats:{wu:32,zhi:88,zheng:82,mei:70},skills:{xuewen:9,quanmou:7},bias:"yi",pref:"si",teach:["xuewen","quanmou"],quote:"社稷无常奉，君臣无常位。",desc:"晋之史官蔡墨。赵简子问季氏出其君，对曰「社稷无常奉，君臣无常位，自古以然」。"},{id:"duan_gan_mu",name:"段干木",title:"晋之隐士",state:"jin",city:"jiang",birth:-475,death:-395,role:"scholar",stats:{wu:36,zhi:86,zheng:78,mei:72},skills:{xuewen:8,quanmou:6},bias:"ming",pref:"si",teach:["xuewen"],quote:"不为臣，不见诸侯。",desc:"晋之隐士，学于子夏。魏文侯过其闾而式之，欲见则逾墙避之。"},{id:"tian_zi_fang",name:"田子方",title:"魏之师",state:"jin",city:"jiang",birth:-470,death:-390,role:"scholar",stats:{wu:34,zhi:86,zheng:80,mei:74},skills:{xuewen:8,biancai:7},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"君明乐官，不明乐音。",desc:"魏文侯之师，学于子夏。文侯听乐而称善，子方曰「君明乐官，不明乐音」。"},{id:"yang_zhu",name:"杨朱",title:"杨朱学派",state:"jin",city:"jiang",birth:-450,death:-370,role:"scholar",stats:{wu:30,zhi:86,zheng:64,mei:70},skills:{xuewen:9,biancai:8},bias:"li",pref:"su",teach:["xuewen","biancai"],quote:"拔一毛而利天下，不为也。",desc:"魏人，倡「为我」「贵己」。孟子曰「杨朱、墨翟之言盈天下」。"},{id:"shi_shen",name:"石申",title:"魏之天官",state:"jin",city:"jiang",birth:-400,death:-340,role:"scholar",stats:{wu:30,zhi:88,zheng:58,mei:64},skills:{suanshu:9,xuewen:7},bias:"yi",pref:"su",teach:["suanshu"],quote:"星有常度，可以推步。",desc:"魏之天官。与齐人甘德同测恒星，著《天文》，后世合称甘石星经。"},{id:"hui_shi",name:"惠施",title:"魏之相",state:"jin",city:"jiang",birth:-370,death:-310,role:"scholar",stats:{wu:32,zhi:90,zheng:82,mei:78},skills:{biancai:10,quanmou:7},bias:"ming",pref:"yu",teach:["biancai"],quote:"至大无外，谓之大一；至小无内，谓之小一。",desc:"宋人，为魏惠王相。倡「合同异」，与庄子为友，濠梁之辩即出其口。"},{id:"lie_yu_kou",name:"列御寇",title:"郑之隐者",state:"zheng",city:"xinzheng",birth:-450,death:-375,role:"scholar",stats:{wu:40,zhi:88,zheng:62,mei:72},skills:{xuewen:9},bias:"ming",pref:"si",teach:["xuewen"],quote:"御风而行，泠然善也。",desc:"郑人，号列子。家贫，容貌有饥色，而拒郑相子阳之粟。著书二十篇。"},{id:"deng_xi",name:"邓析",title:"郑之辩者",state:"zheng",city:"xinzheng",birth:-545,death:-501,role:"scholar",stats:{wu:34,zhi:86,zheng:70,mei:76},skills:{biancai:10},bias:"li",pref:"su",teach:["biancai"],quote:"两可之说，可不可。",desc:"郑之辩者。操两可之说，设无穷之辞，作竹刑。后为驷歂所杀。"},{id:"lao_lai_zi",name:"老莱子",title:"楚之隐者",state:"chu",city:"ying",birth:-560,death:-480,role:"scholar",stats:{wu:32,zhi:86,zheng:66,mei:74},skills:{xuewen:9},bias:"ming",pref:"su",teach:["xuewen"],quote:"鸟兽之毛，可织而衣。",desc:"楚之隐者，著书十五篇。年七十，着五色斑斓之衣，为婴儿戏于亲侧，世传戏彩娱亲。"},{id:"yu_zi",name:"鬻子",title:"楚之先师",state:"chu",city:"ying",birth:-700,death:-620,role:"scholar",stats:{wu:34,zhi:86,zheng:82,mei:68},skills:{xuewen:8,quanmou:6},bias:"yi",pref:"si",teach:["xuewen","quanmou"],quote:"君子不以其所能者病人。",desc:"名熊，楚之先祖。年九十见文王，文王曰「老矣」，对曰「使臣捕兽逐麋则老矣，使臣坐策国事尚少」。"},{id:"zhuang_zi",name:"庄周",title:"蒙之漆园吏",state:"song",city:"shangqiu",birth:-369,death:-286,role:"scholar",stats:{wu:34,zhi:94,zheng:62,mei:84},skills:{xuewen:10,biancai:9},bias:"ming",pref:"su",teach:["xuewen","biancai"],quote:"吾生也有涯，而知也无涯。",desc:"宋之蒙人，尝为漆园吏。楚威王聘为相，辞不就。著《庄子》，寓言十九，汪洋恣肆。"},{id:"hui_ang",name:"惠盎",title:"宋之辩者",state:"song",city:"shangqiu",birth:-380,death:-310,role:"scholar",stats:{wu:34,zhi:84,zheng:70,mei:76},skills:{biancai:9},bias:"ming",pref:"yu",teach:["biancai"],quote:"臣有道于此，使人虽勇，刺之不入。",desc:"宋之辩者。康王曰「寡人所悦者勇有力」，惠盎以「孔墨之勇」对。"},{id:"zi_si",name:"子思",title:"孔门之孙",state:"wei",city:"diqiu",birth:-483,death:-402,role:"scholar",stats:{wu:30,zhi:90,zheng:82,mei:76},skills:{xuewen:10},bias:"yi",pref:"si",teach:["xuewen"],quote:"诚者，天之道也；诚之者，人之道也。",desc:"孔伋，孔子之孙，曾参弟子。作《中庸》，传道于孟子。"},{id:"gong_sun_long",name:"公孙龙",title:"赵之辩者",state:"jin",city:"jiang",birth:-320,death:-250,role:"scholar",stats:{wu:30,zhi:88,zheng:70,mei:78},skills:{biancai:10},bias:"li",pref:"yu",teach:["biancai"],quote:"白马非马。",desc:"赵之辩者，平原君客。倡「离坚白」「白马非马」，为名家之极致。"},{id:"ju_xin",name:"剧辛",title:"燕之谋臣",state:"yan",city:"ji",birth:-360,death:-290,role:"scholar",stats:{wu:48,zhi:84,zheng:78,mei:68},skills:{quanmou:8,bingfa:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"赵不可伐。",desc:"赵人，入燕为将。燕王喜伐赵，剧辛谏不听，果败死于胡卢。"},{id:"zhuang_jiang",name:"庄姜",title:"卫之夫人",state:"wei",city:"chaoge",birth:-750,death:-690,role:"noble",stats:{wu:30,zhi:82,zheng:78,mei:96},skills:{xuewen:8,biancai:7},bias:"yi",pref:"yu",teach:["xuewen"],insight:"people",quote:"巧笑倩兮，美目盼兮。",desc:"齐庄公之女，嫁卫庄公。美而无子，卫人赋《硕人》。"},{id:"xuan_jiang",name:"宣姜",title:"卫之夫人",state:"wei",city:"chaoge",birth:-720,death:-660,role:"noble",stats:{wu:32,zhi:74,zheng:72,mei:88},skills:{quanmou:6},bias:"li",pref:"su",teach:["quanmou"],insight:"court",quote:"齐与卫，甥舅之国。",desc:"齐僖公之女。本为卫急子所娶，宣公夺之，卫遂有杀子之祸。"},{id:"zhao_ji",name:"赵姬",title:"晋之夫人",state:"jin",city:"jiang",birth:-700,death:-640,role:"noble",stats:{wu:30,zhi:78,zheng:74,mei:82},skills:{quanmou:6},bias:"yi",pref:"si",teach:["quanmou"],insight:"people",quote:"吾子，赵氏之宗也。",desc:"晋文公之女，嫁赵衰。生赵盾，赵氏遂世为晋卿。"},{id:"zhao_zhuang_ji",name:"赵庄姬",title:"晋之夫人",state:"jin",city:"jiang",birth:-620,death:-560,role:"noble",stats:{wu:28,zhi:76,zheng:68,mei:84},skills:{quanmou:7},bias:"li",pref:"su",teach:["quanmou"],insight:"court",quote:"赵氏将亡，吾子安在？",desc:"晋成公之女，嫁赵朔。赵氏被灭，怀赵武匿于公宫，即赵氏孤儿之母。"},{id:"qi_jiang",name:"齐姜",title:"晋之夫人",state:"jin",city:"jiang",birth:-700,death:-640,role:"noble",stats:{wu:34,zhi:84,zheng:78,mei:86},skills:{quanmou:7,biancai:6},bias:"shi",pref:"si",teach:["quanmou"],insight:"diplo",quote:"行也，怀与安，实败名。",desc:"齐桓公之女，嫁晋公子重耳。重耳安于齐，姜与子犯谋醉而遣之，遂成霸业。"},{id:"chen_ying",name:"辰嬴",title:"秦之女",state:"qin",city:"yong",birth:-660,death:-600,role:"noble",stats:{wu:28,zhi:74,zheng:70,mei:82},skills:{quanmou:5},bias:"li",pref:"su",teach:["quanmou"],insight:"diplo",quote:"秦晋之好，系于婚姻。",desc:"秦穆公之女，先嫁晋怀公，后嫁晋文公。"},{id:"meng_ying",name:"孟嬴",title:"楚之夫人",state:"chu",city:"ying",birth:-530,death:-470,role:"noble",stats:{wu:28,zhi:80,zheng:74,mei:90},skills:{quanmou:6},bias:"yi",pref:"yu",teach:["quanmou"],insight:"court",quote:"妾自秦来，为楚夫人。",desc:"秦哀公之女。楚平王本为太子建娶之，见其美而自取，遂致伍子胥奔吴、楚国几亡。"},{id:"jiang_mi",name:"江芈",title:"楚之女",state:"chu",city:"ying",birth:-620,death:-560,role:"noble",stats:{wu:30,zhi:78,zheng:72,mei:80},skills:{quanmou:6},bias:"li",pref:"su",teach:["quanmou"],insight:"people",quote:"呼，役夫！宜君王之欲杀女而立职也。",desc:"楚成王之妹，嫁江。知其兄欲杀太子商臣，商臣遂弑父自立。"},{id:"song_gong_ji",name:"宋共姬",title:"宋之夫人",state:"song",city:"shangqiu",birth:-620,death:-543,role:"noble",stats:{wu:28,zhi:80,zheng:76,mei:80},skills:{xuewen:7},bias:"yi",pref:"si",teach:["xuewen"],insight:"people",quote:"妇人夜出，不见傅母不下堂。",desc:"鲁宣公之女，嫁宋共公。宋宫火，以礼不夜出，遂焚死。《春秋》书「宋灾，伯姬卒」。"},{id:"yong_ji",name:"雍姬",title:"郑之女",state:"zheng",city:"xinzheng",birth:-700,death:-660,role:"noble",stats:{wu:28,zhi:80,zheng:72,mei:82},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"si",teach:["quanmou"],insight:"people",quote:"人尽夫也，父一而已。",desc:"郑国雍纠之妻，祭仲之女。知其夫欲杀其父，告于母，祭仲遂杀雍纠。"},{id:"wu_yan",name:"钟离春",title:"齐之无盐女",state:"qi",city:"linzi",birth:-350,death:-280,role:"noble",stats:{wu:44,zhi:88,zheng:84,mei:20},skills:{quanmou:8,biancai:8},bias:"yi",pref:"si",teach:["quanmou","biancai"],insight:"court",quote:"殆哉！殆哉！",desc:"齐无盐邑之女，貌极丑而心有远虑。见齐宣王，举目、衔齿、举手、拊膝，四谏而王纳之，遂立为王后。"},{id:"xi_shi",name:"西施",title:"越之女",state:"yue",city:"kuaiji",birth:-510,death:-450,role:"noble",stats:{wu:34,zhi:74,zheng:66,mei:98},skills:{biancai:5},bias:"ming",pref:"yu",teach:[],insight:"people",quote:"妾本苎萝山卖薪女。",desc:"越之苎萝山人。范蠡进于吴王夫差，吴亡后不知所终。"},{id:"zheng_xiu",name:"郑袖",title:"楚之夫人",state:"chu",city:"ying",birth:-360,death:-300,role:"noble",stats:{wu:28,zhi:82,zheng:70,mei:90},skills:{quanmou:8},bias:"li",pref:"su",teach:["quanmou"],insight:"court",quote:"王爱妾，妾何敢言。",desc:"楚怀王夫人。以「掩鼻」之计谗魏美人，怀王怒而劓之。"},{id:"ji_kui",name:"季隗",title:"晋之夫人",state:"jin",city:"jiang",birth:-688,death:-628,role:"noble",stats:{wu:36,zhi:78,zheng:70,mei:82},skills:{quanmou:5},bias:"yi",pref:"su",teach:["quanmou"],insight:"people",quote:"我二十五年矣，又如是而嫁，则就木焉。请待子。",desc:"赤狄廧咎如之女，嫁晋公子重耳。重耳去狄，命之曰「待我二十五年」，对曰「就木焉」。"},{id:"kong_ji",name:"孔姞",title:"晋之女",state:"jin",city:"jiang",birth:-600,death:-540,role:"noble",stats:{wu:28,zhi:76,zheng:70,mei:80},skills:{quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],insight:"court",quote:"吾家世为晋卿。",desc:"郑穆公之女，嫁晋大夫孔氏。"},{id:"qi_gui",name:"齐归",title:"鲁之夫人",state:"lu",city:"qufu",birth:-560,dea ：「利都被关卡吃了，谁还来？」"}]},{id:"p_famine_trade",topic:"grain",q:"岁歉谷贵，邻国禁粜，君欲得粮，将以何术？",options:[{tag:"li",level:"hit",text:"以重价私下籴之，商人趋利，禁亦不禁。",reply:"国君眼中一亮：「利之所在，禁令挡不住。」"},{tag:"yi",level:"reason",text:"遣使请籴于邻，许以他日相偿。",reply:"国君沉吟：「邻国肯不肯，要看交情。」"},{tag:"ming",level:"evade",text:"禁粜便禁粜，我另寻他路。",reply:"国君摇头：「路在哪里？你倒是说。」"}]},{id:"p_army_feed",topic:"grain",q:"师行在道，粮道为敌所断，君将何以济之？",options:[{tag:"li",level:"hit",text:"募商贾转输，许以军功之赏，重赏之下必有勇夫。",reply:"国君点头：「商人图利也图名，这法子可行。」"},{tag:"shi",level:"reason",text:"就近取粮于属邑，先解燃眉。",reply:"国君叹道：「就近取粮，属邑也要饿肚子。」"},{tag:"yi",level:"evade",text:"粮道既断，唯有退兵。",reply:"国君面色一沉：「退兵？那这一仗白打了。」"}]},{id:"p_storage",topic:"grain",q:"仓廪不修，粟朽于廪，君将何以处之？",options:[{tag:"li",level:"hit",text:"岁检仓廪，陈粟先出，新粟后入，使无朽坏。",reply:"国君抚掌：「先出陈后入新，一句话省了无数粟。」"},{tag:"yi",level:"reason",text:"命老成者司仓，岁终核其数。",reply:"国君点头：「用人比立法更要紧。」"},{tag:"shi",level:"evade",text:"粟朽则朽，来年再种便是。",reply:"国君反问：「那今年冬天吃什么？」"}]},{id:"p_caravan",topic:"passage",q:"商队屡遭劫掠，君之境内道路不宁，何以处之？",options:[{tag:"shi",level:"hit",text:"设亭障、遣戍卒巡道，商旅纳少许道税以养之。",reply:"国君目光一振：「取之于商，用之于商，可行。」"},{tag:"li",level:"reason",text:"许商队自募壮士，官给符信免其盘查。",reply:"国君沉吟：「省钱是好，就怕壮士成了新的盗。」"},{tag:"yi",level:"evade",text:"盗贼古今皆有，非君之过。",reply:"国君冷笑：「那商旅也可以古今都不来。」"}]},{id:"p_river",topic:"passage",q:"舟楫不通，货物皆从陆运，费重而迟，君欲开之乎？",options:[{tag:"li",level:"hit",text:"疏浚故道、设津渡之吏，舟通则运费大减。",reply:"国君颔首：「一水之利，胜过千乘。」"},{tag:"yi",level:"reason",text:"募民开渠，以工代赈，兼济贫弱。",reply:"国君点头：「开渠还能养民，一举两得。」"},{tag:"ming",level:"evade",text:"陆运虽贵，倒也无妨。",reply:"国君反问：「无妨？那你的货为何卖不动？」"}]},{id:"p_neighbor_market",topic:"passage",q:"邻国市盛而我市衰，商旅皆往，君将何以招之？",options:[{tag:"li",level:"hit",text:"我市减税一岁，又设客舍以居远商，商自归之。",reply:"国君抚掌：「减税加客舍，这是实在的招法。」"},{tag:"ming",level:"reason",text:"请诸侯会盟，约两市互通，各不设限。",reply:"国君沉吟：「会盟要有人肯来才成。」"},{tag:"yi",level:"evade",text:"商旅去留，听其自便。",reply:"国君反问：「那要你这个当国的做什么？」"}]},{id:"p_hostel",topic:"passage",q:"远商至而无宿处，露宿于市，君可为之计乎？",options:[{tag:"yi",level:"hit",text:"于市侧设客舍，官定其价，禁其苛索。",reply:"国君点头：「客舍一立，远商自安。」"},{tag:"li",level:"reason",text:"许民家自开逆旅，官取其税 命从者记下你的名字。"},{label:"观望齐国之变",hint:"",effects:[],text:"齐国内乱方定，你且看这新君如何行事。"}]},{id:"changshao",year:-684,month:6,title:"长勺之战",where:{state:"lu"},body:"齐师伐鲁，鲁庄公御之。曹刿请见，与公同乘，待齐人三鼓而后进，齐师败绩。",effects:[{t:"power",s:"lu",v:4},{t:"power",s:"qi",v:-3}],choices:[{label:"随鲁军听曹刿论战",hint:"兵法之试",check:{k:"bingfa",dc:40},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:3},{t:"rel",id:"cao_gui",v:8}],fail:[{t:"fame",v:1}],text:"曹刿按剑立于车右，曰「未可」，你屏息听着鼓声，第一次明白「气」字的分量。"},{label:"远远避兵",hint:"",effects:[{t:"stamina",v:-3}],text:"你避兵于山阜，看齐师车辙乱、旗靡，方知鲁人胜了。"}]},{id:"beixing",year:-681,month:4,title:"北杏之会",where:{state:"qi"},body:"齐桓公会宋、陈、蔡、邾于北杏，以平宋乱。诸侯始服齐，管仲之谋也。",effects:[{t:"power",s:"qi",v:4}],choices:[{label:"携礼往会",hint:"花费三十金，或得声名",effects:[{t:"money",v:-30},{t:"fame",v:5},{t:"rel",id:"bao_shuya",v:6}],text:"会盟之坛上，诸侯歃血为盟。你立于末席，看见齐侯的旌旗在风里招展。"},{label:"不入会是非",hint:"",effects:[],text:"诸侯会盟，与你一个布衣何干。"}]},{id:"qi_ba",year:-679,month:3,title:"齐桓公始霸",where:{state:"qi"},body:"齐桓公会诸侯于鄄，宋、陈、卫、郑皆至。齐遂为诸侯长，天下翕然宗之。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"献书于齐侯",hint:"学问或辩才",check:{k:"xuewen",dc:40},success:[{t:"fame",v:6},{t:"rel",id:"qi_huan",v:8}],fail:[{t:"fame",v:1}],text:"你陈说「尊王攘夷」之义，齐侯抚掌，命人将你的书简收于府中。"},{label:"不往",hint:"",effects:[],text:"霸主之名，起于会盟。"}]},{id:"shanrong",year:-664,month:5,title:"齐救燕",where:{state:"yan"},body:"山戎伐燕，燕告急于齐。齐桓公救燕，遂伐山戎，至于孤竹而还。燕君送齐侯出境，齐侯割燕君所至之地与燕。",effects:[{t:"power",s:"yan",v:3},{t:"power",s:"qi",v:2}],choices:[{label:"从齐师北伐山戎",hint:"武艺与胆略",check:{k:"sheshu",dc:46},success:[{t:"fame",v:5},{t:"merit",v:12},{t:"skill",k:"sheshu",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:1}],text:"北地苦寒，你随齐师穿过山谷，冻裂的手指终于拉开了一次弓。"},{label:"送燕侯一程",hint:"",effects:[{t:"rel",id:"yan_zhuang",v:8},{t:"fame",v:2}],text:"燕侯的车驾向北而去，你立于道旁，听他说「燕人不忘齐侯之德」。"}]},{id:"zhaoling",year:-656,month:7,title:"召陵之盟",where:{state:"chu"},body:"齐桓公率诸侯伐楚，责包茅不入。楚使屈完如师，齐侯陈诸侯之师与之观，屈完曰：「君若以德绥诸侯，谁敢不服？」遂盟于召陵。",effects:[{t:"power",s:"qi",v:4},{t:"power",s:"chu",v:-2}],choices:[{label:"为诸侯执笔盟辞",hint:"学问与辩才",check:{k:"xuewen",dc:48},success:[{t:"fame",v:8},{t:"skill",k:"biancai",v:1},{t:"money",v:60}],fail:[{t:"fame",v:2}],text:"盟辞一字之差，诸侯半日不决。你据《周礼》改定三字，遂定盟。"},{label:"旁观诸侯之师",hint:"",effects:[{t:"skill",k:"bingfa",v:1}],text:"八国之师阵列于召陵，你第一次见识何为「诸侯之师」。"}]},{id:"kuaiqiu",year:-651,month:8,title:"葵丘之会",where:{state:"song"},body:"齐桓公会诸侯于葵丘，周天子使宰孔赐胙，命齐侯无拜。齐侯下拜受赐，诸侯皆服。盟曰：毋雍泉，毋讫籴，毋易树子，毋以妾为妻。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"与会观礼",hint:"声名之会",effects:[{t:"money",v:-40},{t:"fame",v:8},{t:"rel",id:"qi_huan",v:6}],text:"坛上诸侯束牲载书，你听见齐侯一字一句念出盟辞。天下秩序，似乎就系于这几句话上。"},{label:"不入会",hint:"",effects:[],text:"霸主之会，往来皆卿相，与你无涉。"}]},{id:"hanyuan",year:-645,month:9,title:"韩原之战",where:{state:"qin"},body:"晋惠公背秦赂，秦穆公伐晋，战于韩原。晋惠公马陷泥中，为秦所俘。秦人欲杀之，穆公夫人以死请，乃归晋侯。",effects:[{t:"power",s:"qin",v:5},{t:"power",s:"jin",v:-4}],choices:[{label:"从秦军观战",hint:"兵法之试",check:{k:"bingfa",dc:50},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:4}],fail:[{t:"health",v:-8}],text:"你看见晋侯的战车陷在泥里，秦人的甲士一拥而上。战阵之间，胜负只在一瞬。"},{label:"劝秦伯勿杀晋侯",hint:"辩才之试",check:{k:"biancai",dc:52},success:[{t:"rel",id:"qin_mu",v:10},{t:"fame",v:6}],fail:[{t:"fame",v:1}],text:"你言「杀之则天下以秦为暴」，秦伯默然，最终归晋侯于绛。"}]},{id:"huan_gong_si",year:-643,month:10,title:"齐桓公卒",where:{state:"qi"},body:"管仲已卒，竖刁、易牙、开方用事。桓公病，五公子争立，宫中空虚，尸在床上六十七日，虫流出户。",effects:[{t:"power",s:"qi",v:-12},{t:"flag",k:"hegemon",v:""}],choices:[{label:"入宫收敛桓公",hint:"重义之举",effects:[{t:"fame",v:10},{t:"money",v:-50},{t:"rel",id:"bao_shuya",v:6}],text:"你与数名老臣入宫，掩上那扇久无人开的大门。一代霸主，终究不过一具尸骸。"},{label:"叹息而去",hint:"",effects:[{t:"fame",v:1}],text:"盛极而衰，你在临淄的市上听见这个消息，只觉得风吹得冷。"}]},{id:"hongshui",year:-638,month:11,title:"泓水之战",where:{state:"song"},body:"宋襄公伐郑，楚救之，战于泓。宋人既成列，楚人未济，目夷请击之，公曰不可。楚人济而未成列，又请击，公曰不可。既成列而后击之，宋师大败，公伤股。",effects:[{t:"power",s:"song",v:-6},{t:"power",s:"chu",v:3}],choices:[{label:"谏宋公半渡而击",hint:"兵法之试",check:{k:"bingfa",dc:44},success:[{t:"rel",id:"song_xiang",v:4},{t:"fame",v:5},{t:"skill",k:"bingfa",v:1}],fail:[{t:"fame",v:1}],text:"你引《军志》「先人有夺人之心」，宋公摇头不语，仍待楚人成列。"},{label:"预避于岸",hint:"",effects:[],text:"你在岸上看着宋军溃散，泓水被血染成暗红。"}]},{id:"chengpu",year:-632,month:4,title:"城濮之战",where:{state:"jin"},body:"晋文公伐曹卫以救宋，楚子玉帅师来战。晋师退避三舍，战于城濮。晋下军蒙马以虎皮先犯陈蔡，楚右师溃；狐毛设二旆而退，楚左师溃。楚师败绩。",effects:[{t:"power",s:"jin",v:8},{t:"power",s:"chu",v:-6},{t:"flag",k:"hegemon",v:"jin"},{t:"power",s:"song",v:2}],choices:[{label:"从晋中军，献策破楚",hint:"兵法之试，晋地可入",req:{state:"jin"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:60},{t:"fame",v:14},{t:"rel",id:"xian_zhen",v:12},{t:"skill",k:"bingfa",v:1}],fail:[{t:"health",v:-18},{t:"fame",v:3}],text:"你随先轸登车，望见楚右师阵脚已乱。战后清点军功，你的名字被记在竹简上。"},{label:"以辩才说楚子玉退兵",hint:"辩才之试，极难",check:{k:"biancai",dc:64},success:[{t:"fame",v:20},{t:"power",s:"jin",v:2},{t:"skill",k:"biancai",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:4}],text:"你单车入楚营，陈说利害。子玉怒而不听，你退出营门时，听见身后甲叶作响。"},{label:"避于他国",hint:"",effects:[{t:"stamina",v:-5}],text:"中原大战，你避于他国，只从行人口中听闻战况。"}]},{id:"xiao_zhi_zhan",year:-627,month:4,title:"殽之战",where:{state:"qin"},body:"秦穆公不听蹇叔之谏，遣孟明视等袭郑。郑商人弦高以牛十二犒师，秦师以为郑有备，灭滑而还。晋先轸伏兵于殽，秦师覆没。",effects:[{t:"power",s:"qin",v:-6},{t:"power",s:"jin",v:3},{t:"rel",id:"xian_gao",v:6}],choices:[{label:"随弦高犒秦师",hint:"在郑地，重义",req:{state:"zheng"},effects:[{t:"fame",v:12},{t:"rel",id:"xian_gao",v:14},{t:"money",v:-40},{t:"skill",k:"shanggu",v:1}],text:"你与弦高一同驱牛入秦营，自称郑君所遣。秦人按兵，郑国得免一劫。"},{label:"赴殽山吊唁秦师",hint:"",effects:[{t:"fame",v:3}],text:"殽山之间尸骨相枕，你与乡人掩埋了数十具尸骸。"}]},{id:"bi_zhi_zhan",year:-597,month:6,title:"邲之战",where:{state:"chu"},body:"楚庄王围郑，晋师救之，战于邲。晋中军先济，士卒争舟，舟中之指可掬。楚师大胜，饮马于河，遂霸中原。",effects:[{t:"power",s:"chu",v:8},{t:"power",s:"jin",v:-6},{t:"flag",k:"hegemon",v:"chu"}],choices:[{label:"从楚军，观其用兵",hint:"兵法之试，楚地",req:{state:"chu"},check:{k:"bingfa",dc:56},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:8},{t:"rel",id:"chu_zhuang",v:10}],fail:[{t:"health",v:-12}],text:"你立于楚王战车之侧，看他旌旗一动，三军如臂使指。"},{label:"救晋军溃卒",hint:"重义，可增名声",effects:[{t:"fame",v:8},{t:"health",v:-6},{t:"stamina",v:-10}],text:"你在河岸拉起十几个晋国溃卒，他们的手指都被舟楫削断。"}]},{id:"an_zhi_zhan",year:-589,month:6,title:"鞌之战",where:{state:"qi"},body:"齐顷公伐鲁卫，晋郤克帅师救之，战于鞌。齐侯轻敌，不介马而驰，为晋所败。齐侯几为俘，逢丑父易位以免之。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"qi",v:-4}],choices:[{label:"随晋军为御",hint:"御术与胆气",check:{k:"jianshu",dc:48},success:[{t:"merit",v:30},{t:"fame",v:6},{t:"skill",k:"jianshu",v:1}],fail:[{t:"health",v:-14}],text:"战车在泥泞里打着旋，你死死拉住缰绳，听见身后箭矢破空。"},{label:"不预其事",hint:"",effects:[],text:"齐晋之战，与你无涉。"}]},{id:"yanling",year:-575,month:6,title:"鄢陵之战",where:{state:"zheng"},body:"晋厉公伐郑，楚共王救之，战于鄢陵。晋将魏锜射中楚王目，楚师夜遁。养由基善射，一箭穿杨，然终不能挽楚之败。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"chu",v:-3}],choices:[{label:"与养由基比射",hint:"射术之试",check:{k:"sheshu",dc:58},success:[{t:"rel",id:"yang_youji",v:14},{t:"fame",v:10},{t:"skill",k:"sheshu",v:1}],fail:[{t:"fame",v:2},{t:"health",v:-4}],text:"百步之外的柳叶在风里颤。你射中了，养由基大笑，说「可教也」。"},{label:"救护伤卒",hint:"",effects:[{t:"fame",v:4},{t:"health",v:-3}],text:"你在战场上奔走，把伤卒一个一个拖到车下。"}]},{id:"mibing",year:-546,month:5,title:"弭兵之会",where:{state:"song"},body:"宋左师向戌奔走晋楚之间，合诸侯之大夫盟于宋。晋楚之从交相见，天下息兵。向戌辞邑，曰：「以靖小国，请免之。」",effects:[{t:"power",s:"song",v:5},{t:"flag",k:"mibing",v:!0}],choices:[{label:"为向戌执笔记盟",hint:"学问或辩才",check:{k:"xuewen",dc:52},success:[{t:"fame",v:14},{t:"rel",id:"xiang_xu",v:12},{t:"money",v:80}],fail:[{t:"fame",v:2}],text:"盟书凡七国，字字斟酌。向戌拍你的肩说：「天下自此少死许多人。」"},{label:"往观盟礼",hint:"",effects:[{t:"fame",v:4}],text:"诸侯之大夫会于宋，歃血之后，各自归国。"}]},{id:"zi_chan_si",year:-522,month:12,title:"子产卒",where:{state:"zheng"},body:"郑子产卒。孔子闻之，出涕曰：「古之遗爱也。」郑人相与哭于巷，三月不闻竽瑟之声。",effects:[{t:"power",s:"zheng",v:-5}],choices:[{label:"往新郑吊之",hint:"重义",effects:[{t:"fame",v:6},{t:"money",v:-20}],text:"你在子产之丧上，听见郑人哭声不绝。"},{label:"读其刑书而叹",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1}],text:"铸于鼎上的刑书，第一次让庶民知法之所在。"}]},{id:"baiju",year:-506,month:11,title:"柏举之战",where:{state:"wu"},body:"吴王阖闾用伍子胥、孙武之谋，五战入郢。楚昭王出奔，吴人入楚王宫。伍子胥掘楚平王墓，鞭尸三百。",effects:[{t:"power",s:"wu",v:10},{t:"power",s:"chu",v:-10}],choices:[{label:"从吴军入郢",hint:"在吴地，武艺或兵法",req:{state:"wu"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:50},{t:"fame",v:14},{t:"money",v:150},{t:"rel",id:"wu_zixu",v:10}],fail:[{t:"health",v:-16}],text:"五战五捷，吴师入郢。你站在楚王宫阶前，看伍子胥一言不发地走向平王墓。"},{label:"随楚人奔随",hint:"重义",effects:[{t:"fame",v:6},{t:"health",v:-8}],text:"你随楚昭王奔随，山路崎岖，王的车驾在身后只剩一点尘。"}]},{id:"zui_li",year:-496,month:5,title:"槜李之战",where:{state:"wu"},body:"越王允常卒，勾践立。吴王阖闾伐越，越人使死士三行，属剑于颈而自刭，吴师属目，越人因而袭之。阖闾伤指，还卒于陉。",effects:[{t:"power",s:"yue",v:6},{t:"power",s:"wu",v:-5}],choices:[{label:"救吴王于阵中",hint:"武艺之试",check:{k:"jianshu",dc:54},success:[{t:"fame",v:12},{t:"rel",id:"fu_cha",v:14},{t:"health",v:-10}],fail:[{t:"health",v:-20},{t:"fame",v:3}],text:"你扛起阖闾的时候，他的手指已经断了，血顺着甲叶往下滴。"},{label:"避于会稽山中",hint:"",effects:[{t:"stamina",v:5}],text:"山雨欲来，你在会稽山中听樵夫说起吴越之事。"}]},{id:"fujiao",year:-494,month:3,title:"夫椒之战",where:{state:"yue"},body:"吴王夫差悉发精兵伐越，败越于夫椒。勾践以甲楯五千栖于会稽，使大夫种行成于吴。",effects:[{t:"power",s:"yue",v:-8},{t:"power",s:"wu",v:6}],choices:[{label:"随文种入吴营请成",hint:"辩才之试",check:{k:"biancai",dc:56},success:[{t:"rel",id:"wen_zhong",v:12},{t:"fame",v:10},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:2}],text:"你与文种跪于吴营之前，说尽卑辞厚礼。夫差终于点头，越国得以不亡。"},{label:"入山吊越之遗民",hint:"",effects:[{t:"fame",v:4},{t:"rel",id:"gou_jian",v:8}],text:"会稽山下，越人扶老携幼。你分了些粟米给他们。"}]},{id:"huangchi",year:-482,month:7,title:"黄池之会",where:{state:"wu"},body:"吴王夫差会晋定公于黄池，争长。吴人曰「于周室我为长」，晋人曰「于姬姓我为伯」。夫差以兵威胁晋，终先歃。然越已入吴，吴都告急。",effects:[{t:"power",s:"wu",v:3},{t:"power",s:"yue",v:6}],choices:[{label:"劝吴王速归",hint:"智略之试",check:{k:"quanmou",dc:54},success:[{t:"fame",v:8},{t:"rel",id:"fu_cha",v:6}],fail:[{t:"fame",v:1}],text:"你言「国本已危，争长何为」。夫差沉默良久，连夜拔营。"},{label:"不与",hint:"",effects:[],text:"黄池之会，诸侯争一席之位，而越人已入吴都。"}]},{id:"chu_cheng_pu",year:-632,month:4,title:"晋楚城濮之战",where:{state:"jin"},body:"楚师围宋，宋告急于晋。晋文公伐曹卫以救宋，楚子玉怒而北上。晋侯退避三舍以报楚惠，楚师不退，战于城濮。晋以虎皮蒙马先犯陈蔡，陈蔡奔，楚师溃。",effects:[{t:"war",a:"jin",b:"chu"},{t:"power",s:"jin",v:12},{t:"power",s:"chu",v:-8},{t:"flag",k:"hegemon",v:"jin"}],choices:[{label:"观晋侯退避三舍",hint:"重义",check:{k:"xuewen",dc:32},success:[{t:"fame",v:5},{t:"skill",k:"xuewen",v:1}],fail:[{t:"fame",v:2}],text:"你见晋师一退再退，士卒无怨言。旁人道：「此所谓君之信也。」"},{label:"往楚军观阵",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:1},{t:"money",v:40}],fail:[{t:"health",v:-6}],text:"你混入楚营，见子玉刚愎，知其必败。"}]},{id:"jin_li_ji",year:-656,month:8,title:"骊姬之乱",where:{state:"jin"},body:"晋献公宠骊姬，姬欲立其子奚齐，谮太子申生。申生自缢于新城，重耳、夷吾出奔。晋国自此内乱二十年。",effects:[{t:"power",s:"jin",v:-8}],choices:[{label:"护送公子出奔",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"hu_yan",v:10}],text:"你为公子重耳驾车出蒲，一路风尘。公子握你的手道：「他日得国，不忘此日。」"},{label:"留事献公",hint:"",check:{k:"biancai",dc:38},success:[{t:"money",v:60},{t:"fame",v:2}],fail:[{t:"fame",v:-4}],text:"你留在绛都，见朝中人人自危。"}]},{id:"song_xiang_hong",year:-638,month:11,title:"宋襄公泓水之败",where:{state:"song"},body:"宋襄公与楚人战于泓。楚人未济，司马请击之，公曰不可。既济而陈未成，又请击之，公曰不可。既陈而后击之，宋师大败，公伤股。",effects:[{t:"power",s:"song",v:-10},{t:"power",s:"chu",v:5}],choices:[{label:"谏公半渡而击",hint:"兵法",check:{k:"bingfa",dc:34},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:4}],fail:[{t:"fame",v:-3}],text:"你言「兵者诡道」，襄公摇头：「寡人不能以诈取胜。」"},{label:"救护宋伤卒",hint:"重义",effects:[{t:"fame",v:6},{t:"health",v:-4}],text:"你扶襄公上车，血染其股。公叹道：「君子不重伤，不禽二毛。」"}]},{id:"qin_mu_youyu",year:-627,month:4,title:"秦晋殽之战",where:{state:"qin"},body:"秦穆公不听蹇叔之谏，使孟明视等袭郑。郑商人弦高遇之于滑，以牛十二犒师，且遽告于郑。秦师知郑有备，灭滑而还，归途为晋所邀于殽，秦师尽没。",effects:[{t:"war",a:"jin",b:"qin"},{t:"power",s:"qin",v:-10},{t:"power",s:"jin",v:6}],choices:[{label:"从弦高犒师",hint:"重义",effects:[{t:"fame",v:8},{t:"rel",id:"xian_gao",v:12}],text:"你随弦高驱牛十二头迎秦师，诈称郑伯之命。秦师驻足，郑国得以戒备。"},{label:"往殽山观战",hint:"兵法",check:{k:"bingfa",dc:38},success:[{t:"skill",k:"bingfa",v:1},{t:"merit",v:10}],fail:[{t:"health",v:-8}],text:"殽山二陵之间，秦师辎重尽弃。"}]},{id:"wu_ru_ying",year:-506,month:11,title:"吴入郢都",where:{state:"wu"},body:"吴王阖闾用伍子胥、孙武之谋，五战及郢。楚昭王出奔，吴人入郢，处其宫室。伍子胥掘楚平王墓，鞭尸三百。",effects:[{t:"war",a:"wu",b:"chu"},{t:"power",s:"wu",v:14},{t:"power",s:"chu",v:-14}],choices:[{label:"观孙武用兵",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:2},{t:"rel",id:"sun_wu",v:8}],fail:[{t:"fame",v:1}],text:"你见吴师五战五捷，迂回千里而不乱。孙武言：「兵之情主速。」"},{label:"随伍子胥入郢",hint:"慕强",effects:[{t:"fame",v:4},{t:"rel",id:"wu_zixu",v:10}],text:"伍子胥立于楚王宫前，鞭尸三百，声如裂帛。"}]},{id:"kongzi_xiang_lu",year:-500,month:6,title:"夹谷之会",where:{state:"lu"},body:"鲁定公与齐侯会于夹谷。孔子摄相事，以礼折齐。齐人使莱人以兵劫公，孔子历阶而进，以公退，曰：「士兵之！两君合好，而裔夷之俘以兵乱之，非齐君所以命诸侯也。」齐侯惭，归鲁之侵地。",effects:[{t:"power",s:"lu",v:6},{t:"power",s:"qi",v:-3}],choices:[{label:"从孔子观礼",hint:"学问",check:{k:"xuewen",dc:34},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:6},{t:"rel",id:"kong_zi",v:10}],fail:[{t:"fame",v:2}],text:"孔子历阶而上，言辞不疾不徐，齐侯竟不能答。"},{label:"护鲁君退避",hint:"武艺",check:{k:"jianshu",dc:32},success:[{t:"fame",v:4},{t:"money",v:30}],fail:[{t:"health",v:-6}],text:"莱兵持械而前，你以身遮鲁君，退至坛下。"}]},{id:"zhuan_zhu",year:-515,month:4,title:"专诸刺王僚",where:{state:"wu"},body:"公子光欲弑吴王僚，伍子胥进专诸。光具酒请王僚，僚陈兵自宫至光之家。专诸置匕首于炙鱼之中，进至王前，抽匕首刺僚，僚立死。专诸亦为僚之徒所杀。",effects:[{t:"power",s:"wu",v:6}],choices:[{label:"观鱼肠之刺",hint:"声名",effects:[{t:"fame",v:5},{t:"rel",id:"wu_zixu",v:6}],text:"专诸擘鱼，匕首出，王僚倒于席上。堂中大乱。"},{label:"劝阻公子光",hint:"重义",check:{k:"biancai",dc:40},success:[{t:"fame",v:8},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:-4}],text:"你言「弑君之名，千载不洗」，公子光拂袖：「孺子之言。」"}]},{id:"goujian_ji_xin",year:-494,month:3,title:"夫椒之败",where:{state:"yue"},body:"吴王夫差败越于夫椒，报檇李之仇。越王勾践以甲楯五千保于会稽，使大夫种行成于吴。吴王许之，勾践入吴为臣，执养马之役。",effects:[{t:"war",a:"wu",b:"yue"},{t:"power",s:"wu",v:10},{t:"power",s:"yue",v:-12}],choices:[{label:"随勾践入吴",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"wen_zhong",v:8},{t:"stamina",v:-10}],text:"你随越王入吴，见其执鞭立于马厩之外，面无愠色。"},{label:"说吴王灭越",hint:"慕强",check:{k:"quanmou",dc:38},success:[{t:"merit",v:12},{t:"rel",id:"wu_zixu",v:10}],fail:[{t:"fame",v:-3}],text:"你言「今不灭越，后必悔之」。伍子胥以为然，夫差不听。"}]},{id:"quwo_dai_yi",year:-679,month:9,title:"曲沃代翼",where:{state:"jin"},body:"曲沃武公伐晋侯缗，灭之，尽以其宝器赂周釐王。王命武公以一军为晋侯，曲沃自此代翼。小宗篡大宗，周礼之坏自此始。",effects:[{t:"power",s:"jin",v:8}],choices:[{label:"观曲沃之赂",hint:"权谋",check:{k:"quanmou",dc:34},success:[{t:"skill",k:"quanmou",v:1},{t:"money",v:40}],fail:[{t:"fame",v:-2}],text:"宝器满载入洛邑，天子受之，遂命曲沃为诸侯。"},{label:"叹礼之崩",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:3}],text:"你叹道：「陪臣执国命，自此始矣。」"}]},{id:"guan_zhong_xiang",year:-685,month:4,title:"管仲相齐",where:{state:"qi"},body:"齐桓公不计射钩之仇，用鲍叔牙之荐，相管仲。管仲作内政而寄军令，通货积财，设轻重九府，齐国大治。",effects:[{t:"power",s:"qi",v:10}],choices:[{label:"往齐观政",hint:"政略",check:{k:"xuewen",dc:33},success:[{t:"skill",k:"xuewen",v:1},{t:"rel",id:"guan_zhong",v:10},{t:"fame",v:4}],fail:[{t:"fame",v:1}],text:"你见临淄市列珠玑，四民分业而居。管仲言：「仓廪实而知礼节。」"},{label:"献通商之策",hint:"商贾",check:{k:"shanggu",dc:34},success:[{t:"money",v:80},{t:"rel",id:"guan_zhong",v:8}],fail:[{t:"fame",v:-2}],text:"你陈「轻重敛散」之术，管仲抚掌：「可与言利矣。」"}]},{id:"zhu_zhiwu_tui_qin",year:-630,month:9,title:"烛之武退秦师",where:{state:"zheng"},body:"晋秦围郑，郑伯使烛之武夜缒而出，见秦伯曰：「越国以鄙远，君知其难也。焉用亡郑以陪邻？邻之厚，君之薄也。」秦伯悦，与郑人盟，戍之而还。",effects:[{t:"power",s:"zheng",v:6},{t:"power",s:"qin",v:2},{t:"power",s:"jin",v:-4}],choices:[{label:"从烛之武夜出",hint:"说辞",check:{k:"biancai",dc:38},success:[{t:"skill",k:"biancai",v:2},{t:"fame",v:6},{t:"rel",id:"zhu_zhiwu",v:12}],fail:[{t:"health",v:-8},{t:"fame",v:2}],text:"缒城而下，夜见秦伯。一番利害陈说，秦师竟退。"},{label:"守城御敌",hint:"武艺",check:{k:"jianshu",dc:34},success:[{t:"merit",v:10},{t:"fame",v:3}],fail:[{t:"health",v:-10}],text:"秦晋之师围城三面，你守女墙七昼夜。"}]},{id:"wu_ju_shen_gong",year:-522,month:5,title:"伍子胥奔吴",where:{state:"wu"},body:"楚平王听费无极之谮，杀伍奢及其子伍尚。伍员出奔，过昭关，一夜白头。至吴，说吴王僚伐楚。",effects:[{t:"power",s:"wu",v:4},{t:"power",s:"chu",v:-3}],choices:[{label:"助其过昭关",hint:"重义",effects:[{t:"fame",v:8},{t:"rel",id:"wu_zixu",v:14},{t:"money",v:-30}],text:"你以舟渡其过江，伍员解剑相赠：「此剑值百金，聊以为谢。」"},{label:"闻其一夜白头",hint:"",effects:[{t:"skill",k:"quanmou",v:1}],text:"昭关之下，伍员须发尽白，守者竟不能识。"}]},{id:"sunzi_bingfa",year:-512,month:3,title:"孙武献兵法",where:{state:"wu"},body:"孙武以兵法见吴王阖闾，王曰：「可试以妇人乎？」于是出宫中美女百八十人。孙子三令五申，妇人皆大笑。孙子斩队长二人，妇人乃定。",effects:[{t:"power",s:"wu",v:6}],choices:[{label:"观孙武教战",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:2},{t:"rel",id:"sun_wu",v:10}],fail:[{t:"fame",v:1}],text:"鼓之左，妇人皆左；鼓之右，妇人皆右。孙子曰：「兵者，国之大事。」"},{label:"请录其书",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1},{t:"money",v:-20},{t:"fame",v:3}],text:"十三篇在手，你读到「兵者诡道」一句，掩卷良久。"}]},{id:"ji_zha_guan_yue",year:-544,month:7,title:"季札观乐",where:{state:"wu"},body:"吴公子季札聘于鲁，请观周乐。使工为之歌《周南》《召南》，曰：「美哉！始基之矣。」歌《郑》，曰：「其细已甚，民弗堪也。」至《韶箾》，曰：「德至矣哉！观止矣。」",effects:[{t:"power",s:"wu",v:3},{t:"power",s:"lu",v:2}],choices:[{label:"从季札观乐",hint:"学问",check:{k:"xuewen",dc:34},success:[{t:"skill",k:"xuewen",v:2},{t:"fame",v:6}],fail:[{t:"skill",k:"xuewen",v:1}],text:"乐工歌《韶》，季札叹曰「观止」。你虽不能尽解，亦觉胸中豁然。"},{label:"问其聘问之礼",hint:"重义",effects:[{t:"skill",k:"biancai",v:1},{t:"fame",v:4}],text:"季札曰：「聘礼者，所以通两国之好也。」"}]},{id:"yan_ying_shi_chu",year:-546,month:10,title:"向戌弭兵",where:{state:"song"},body:"宋向戌合晋楚之成，会诸侯于宋。晋楚之从交相见，齐秦为敌。自此弭兵四十余年，列国得以休息。",effects:[{t:"power",s:"song",v:6},{t:"power",s:"jin",v:3},{t:"power",s:"chu",v:3}],choices:[{label:"会于宋以观礼",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"xiang_xu",v:10}],text:"诸侯会于宋，晋楚分伯，献血为盟。向戌之力也。"},{label:"为两国通款",hint:"说辞",check:{k:"biancai",dc:36},success:[{t:"skill",k:"biancai",v:1},{t:"fame",v:4}],fail:[{t:"fame",v:-2}],text:"你往来晋楚之间，传其辞令，两军竟不交兵。"}]},{id:"zi_chan_zhu_xing",year:-536,month:3,title:"子产铸刑书",where:{state:"zheng"},body:"郑子产铸刑书于鼎，以为国之常法。叔向使诒书曰：「民知有辟，则不忌于上，并有争心。」子产复曰：「吾以救世也。」",effects:[{t:"power",s:"zheng",v:6}],choices:[{label:"观刑书于市",hint:"学问",check:{k:"xuewen",dc:32},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:4},{t:"rel",id:"zi_chan",v:8}],fail:[{t:"fame",v:1}],text:"刑书列于鼎，民皆聚观。有人说：「此三代未有之事。」"},{label:"问子产治郑之术",hint:"政略",effects:[{t:"skill",k:"quanmou",v:1},{t:"fame",v:3}],text:"子产曰：「唯有德者能以宽服民，其次莫如猛。」"}]},{id:"yue_mie_wu",year:-473,month:11,title:"越灭吴",where:{state:"yue"},body:"越王勾践围吴三年，吴师溃。夫差使公孙雄肉袒膝行请成，勾践不许，曰：「昔天以越赐吴，吴不受；今天以吴赐越，孤敢不听？」夫差自刭。",effects:[{t:"peace",a:"wu",b:"yue"},{t:"power",s:"yue",v:10},{t:"power",s:"wu",v:-14},{t:"flag",k:"hegemon",v:"yue"}],choices:[{label:"往吊吴王",hint:"重义",effects:[{t:"fame",v:10},{t:"rel",id:"fan_li",v:8}],text:"你看着夫差以布蒙面自刭，说「吾无面目以见子胥也」。"},{label:"贺越王于姑苏台",hint:"声名",effects:[{t:"money",v:50},{t:"fame",v:6},{t:"rel",id:"gou_jian",v:8}],text:"姑苏台上，越王勾践受诸侯之贺，而范蠡已泛舟五湖。"}]}],Ra=[{id:"bandit",w:10,when:e=>e.player.money>60,title:"道遇劫匪",body:"你行至荒僻处，忽有数人持刃拦路，喝令留下财货。",choices:[{label:"拔剑相斗",hint:"以武艺退敌",check:{k:"jianshu",dc:40},success:[{t:"fame",v:3},{t:"money",v:40}],fail:[{t:"money",v:-60},{t:"health",v:-8}],text:"刀光一闪，匪徒见你不是易与之辈，弃刃而走，地上还落了些散钱。"},{label:"舍财免祸",hint:"破财",effects:[{t:"money",v:-50}],text:"你把钱袋丢过去，匪徒掂了掂，笑着让开一条路。"}]},{id:"sage",w:8,when:e=>e.time.year<-540,title:"途遇隐者",body:"林间有一老者，负薪而行，歌曰：「沧浪之水清兮，可以濯吾缨。」",choices:[{label:"上前请教",hint:"或有所得",check:{k:"xuewen",dc:38},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:2}],fail:[{t:"fame",v:1}],text:"老者与你说了半日「无为」之理，你似懂非懂，却记了一辈子。"},{label:"致意而去",hint:"",effects:[],text:"你拱手作别，老者的歌声渐远。"}]},{id:"harvest",w:12,when:()=>!0,title:"岁丰",body:"今年风调雨顺，粟麦大熟。市上粮价应声而落。",effects:[{t:"goods",g:"su",v:-.18}]},{id:"famine",w:8,when:()=>!0,title:"饥荒",body:"某地大旱，赤地千里，流民载道。粟价腾贵，诸国闭关禁籴。",effects:[{t:"goods",g:"su",v:.28},{t:"goods",g:"ge",v:.1}]},{id:"war_rumor",w:10,when:()=>!0,title:"兵戈之讯",body:"道听途说，某国正聚兵于境上，市井之间人心惶惶。",effects:[{t:"goods",g:"tie",v:.16},{t:"goods",g:"ma",v:.14}]},{id:"plague",w:5,when:()=>!0,title:"疫病",body:"城中疫气流行，巷陌多闭户，医者奔走不暇。",effects:[{t:"health",v:-6},{t:"goods",g:"su",v:.12}]},{id:"summon",w:7,when:e=>e.player.fame>=25&&e.player.state,title:"国君相召",body:"有使者至，言国君闻君之名，欲一见。",choices:[{label:"应召入宫",hint:"或有封赏",effects:[{t:"merit",v:20},{t:"money",v:50},{t:"fame",v:2}],text:"国君问以国事，你应对得体，赐金五十。"},{label:"称病不往",hint:"清高之名",effects:[{t:"fame",v:2}],text:"你推说抱恙，使者怫然而去。"}]},{id:"scholar_lecture",w:7,when:()=>!0,title:"学宫讲席",body:"学宫之中，诸子论辩，听者盈庭。有人邀你也说几句。",choices:[{label:"登席陈说",hint:"学问或辩才",check:{k:"xuewen",dc:44},success:[{t:"fame",v:5},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:1},{t:"stamina",v:-4}],text:"你引经据典，条分缕析，座中数人点头称善。"},{label:"默坐听讲",hint:"",effects:[{t:"skill",k:"xuewen",v:1}],text:"你听了一整日，回去的路上还在想那句「君子和而不同」。"}]},{id:"merchant_offer",w:8,when:e=>e.player.money>150,title:"行商之邀",body:"一位行商愿以低价赊你一批货，言明三月之内还本即可。",choices:[{label:"应下这笔生意",hint:"风险与利",check:{k:"shanggu",dc:38},success:[{t:"money",v:120},{t:"skill",k:"shanggu",v:1}],fail:[{t:"money",v:-80}],text:"你转手将货卖往邻邑，赚了一笔差价。"},{label:"婉言谢绝",hint:"",effects:[],text:"你笑着摇头，说「买卖不在急上」。"}]},{id:"duel_challenge",w:6,when:e=>e.player.fame>15,title:"剑客挑战",body:"一名游侠拦路，自称闻你之名，欲以剑会友。",choices:[{label:"应战",hint:"决斗",effects:[{t:"duel",who:"wanderer"}],text:"围观者让出一片空地，剑已出鞘。"},{label:"抱拳谢过",hint:"",effects:[{t:"fame",v:-1}],text:"你抱拳道「不敢」，那剑客冷哼一声走了。"}]},{id:"mentor",w:6,when:e=>Object.values(e.npc).some(i=>i.city===e.player.cityId&&i.alive&&i.role==="scholar"),title:"贤者讲学",body:"城中有贤者开讲，士人毕集。你若往听，或可请益。",choices:[{label:"前往受教",hint:"需束脩",effects:[{t:"money",v:-20},{t:"skillxp",k:"xuewen",v:12}],text:"你奉上束脩，贤者为你讲了一卷书。"},{label:"不往",hint:"",effects:[],text:"学在人心，不必在讲堂。"}]},{id:"ferry",w:8,title:"津渡无舟",body:"你赶到渡口，天色已暮，舟子收了跳板，说今日不再开船。",choices:[{label:"多给船资，请他破例",hint:"破费",effects:[{t:"money",v:-30}],text:"舟子收了钱，骂骂咧咧地又撑开跳板。"},{label:"露宿一夜，明日再渡",hint:"耗日",effects:[{t:"stamina",v:-4},{t:"health",v:2}],text:"你在渡口草棚里歇了一夜，听了一夜水声。"},{label:"另寻浅滩涉水",hint:"武艺",check:{k:"jianshu",dc:34},success:[{t:"fame",v:2},{t:"stamina",v:-6}],fail:[{t:"health",v:-8},{t:"goods",g:"su",v:-2}],text:"水没及腰，你扶石而过，行囊却湿了半边。"}]},{id:"smith",w:7,title:"铁匠求售",body:"路旁铁铺的匠人拦住你，说新打的一把剑，愿贱价卖与识货之人。",choices:[{label:"看剑",hint:"身法",check:{k:"jianshu",dc:32},success:[{t:"money",v:-60},{t:"skillxp",k:"jianshu",v:15}],fail:[{t:"money",v:-60}],text:"剑是好剑，只是与你手不合。匠人说：「用久了自会合。」"},{label:"不买",hint:"",effects:[],text:"剑在匣中，你不缺剑，也不缺这一把。"}]},{id:"old_text",w:6,title:"破肆残简",body:"旧书肆清仓，角落里堆着一捆竹简，积尘寸许，无人问价。",choices:[{label:"买下细读",hint:"破费",check:{k:"xuewen",dc:34},success:[{t:"money",v:-40},{t:"skillxp",k:"xuewen",v:18},{t:"fame",v:2}],fail:[{t:"money",v:-40}],text:"简是残的，读来费力，但其中有几句前人未发之论。"},{label:"弃之",hint:"",effects:[],text:"残简 志",effects:[{t:"fame",v:2}],text:"你听说了伍员过昭关一夜白头之事，心为之动。"},{label:"不闻不问",effects:[],text:"亡人之臣，避之则吉。"}]},{npc:"wu_zixu",year:-518,city:"gusu",title:"伍员事吴",body:"伍员至于吴，公子光纳之。员荐专诸于光，退耕于野以待时。",choices:[{label:"往投其门",effects:[{t:"fame",v:3}],text:"你投于伍员门下，他对你颇为赏识。"},{label:"但闻其名",effects:[{t:"fame",v:1}],text:"伍员之名，渐闻于诸侯。"}]},{npc:"fan_li",year:-473,city:"tao",title:"范蠡去越",body:"范蠡浮海出齐，变姓名为鸱夷子皮。居于陶，为朱公。十九年之中三致千金，再分散与贫交疏昆弟。",choices:[{label:"执弟子礼求教",effects:[{t:"skillxp",k:"shanggu",v:40}],text:"你从陶朱公学治生之术，深有所得。"},{label:"慕其名而往观",effects:[{t:"fame",v:3}],text:"你专程到陶地一睹朱公风范。"}]},{npc:"sun_wu",year:-512,city:"gusu",title:"孙子见吴王",body:"孙武以兵法见于吴王阖闾。阖闾曰：「子之十三篇，吾尽观之矣。」宫女试兵，斩二姬，遂以为将。",choices:[{label:"拜读兵法",effects:[{t:"skillxp",k:"bingfa",v:30}],text:"你购得《孙子》十三篇抄本，日夜研读。"},{label:"闻其斩姬事",effects:[{t:"fame",v:2}],text:"军法如山，自此吴人知之。"}]},{npc:"bai_li_xi",year:-655,city:"yong",title:"五羖大夫",body:"秦穆公以五羖羊皮赎百里奚于楚，授之国政。奚年七十余，谋无不当，举必有功。",choices:[{label:"往观其政",effects:[{t:"skillxp",k:"quanmou",v:30}],text:"你在雍地考察秦政，见五羖大夫施政有序。"},{label:"叹其遇",effects:[{t:"fame",v:2}],text:"七十岁遇明主，亦未为晚。"}]},{npc:"wu_ji_zha",year:-544,city:"qufu",title:"季札聘鲁",body:"吴公子季札聘于鲁，请观周乐。使工为之歌《周南》《召南》，札曰：「美哉！始基之矣。」",choices:[{label:"与观周乐",effects:[{t:"skillxp",k:"xuewen",v:30}],text:"你有幸与季札同观周乐，知乐可以知政。"},{label:"闻其让国",effects:[{t:"fame",v:3}],text:"季札让国之义，传遍诸侯。"}]},{npc:"wu_ji_zha",year:-541,city:"jiang",title:"季札聘晋",body:"季札适晋，说赵文子、韩宣子、魏献子曰：「晋国其萃于三族乎！」悦叔向，将行，谓叔向曰：「吾子好直，必思自免于难。」",choices:[{label:"记其预言",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"「三家分晋」之谶，你记在了心里。"},{label:"与叔向同论",effects:[{t:"fame",v:2}],text:"你与叔向论及晋之将来，各有所忧。"}]},{npc:"xian_zhen",year:-636,city:"jiang",title:"重耳返晋",body:"重耳返晋，是为文公。从亡者狐偃、赵衰、先轸辈皆居要职。文公修政，施惠百姓。",choices:[{label:"往观新政",effects:[{t:"fame",v:2}],text:"晋国新政井然，诸侯侧目。"},{label:"投于麾下",effects:[{t:"merit",v:5}],text:"你入晋军效力，与先轸相识。"}]},{npc:"mo_zi",year:-440,city:"ying",title:"墨子止楚攻宋",body:"墨子闻楚将攻宋，自鲁往，裂裳裹足，十日十夜至郢。见公输般，九攻九距之，楚王乃止。",choices:[{label:"助其守御",effects:[{t:"skillxp",k:"bingfa",v:30}],text:"你在郢都见过墨者的守城之器，叹为观止。"},{label:"录其言",effects:[{t:"fame",v:3}],text:"「非攻」之说，由你传于一方。"}]},{npc:"bian_que",year:-400,city:"ji",title:"扁鹊至赵",body:"扁鹊至赵，为带下医。过雒阳，为耳目痹医；入咸阳，为小儿医。随俗为变，名闻天下。",choices:[{label:"求诊",effects:[{t:"health",v:30}],text:"扁鹊为你诊脉，沉疴顿去。"},{label:"求教医道",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"「随俗为变」四字，你记了很久。"}]},{npc:"gongshu_ban",year:-445,city:"ying",title:"公输般为楚",body:"公输般自鲁至楚，为楚造云梯之械成，将以攻宋。",choices:[{label:"观其器械",effects:[{t:"skillxp",k:"sheshu",v:20}],text:"云梯钩援之巧，你开了眼界。"},{label:"忧宋之祸",effects:[{t:"fame",v:2}],text:"你忧心宋国将罹兵祸，先做了防备。"}]},{npc:"zi_lu",year:-497,city:"diqiu",title:"子路仕卫",body:"子路随孔子适卫，为卫大夫孔悝之邑宰。后蒲邑治水，孔子过之，三称其善。",choices:[{label:"与之论政",effects:[{t:"skillxp",k:"zhengzhi",v:0}],text:"子路言政直而切，你深受触动。"},{label:"结其勇",effects:[{t:"rel",k:"zi_lu",v:10}],text:"你与子路结为好友。"}]},{npc:"zi_gong",year:-488,city:"tao",title:"子贡货殖",body:"子贡废著鬻财于曹鲁之间，废举贮鬻。与时转货赀，家累千金。夫所至之处，国君无不分庭与之抗礼。",choices:[{label:"与之论市",effects:[{t:"skillxp",k:"shanggu",v:35}],text:"「贵出如粪土，贱取如珠玉」，你受教了。"},{label:"结其谊",effects:[{t:"rel",k:"zi_gong",v:10}],text:"你与子贡结交，往来于曹鲁之间。"}]},{npc:"yan_ying",year:-539,city:"jiang",title:"晏婴聘晋",body:"晏婴聘于晋，叔向问齐政。婴曰：「此季世也，吾弗知。齐其为陈氏矣！民归之如流水，公弃其民而归于陈氏。」",choices:[{label:"记其言",effects:[{t:"skillxp",k:"quanmou",v:30}],text:"「齐政卒归田氏」之谶，你深记于心。"},{label:"与论礼",effects:[{t:"fame",v:3}],text:"你与晏婴论礼政，受益良多。"}]},{npc:"ning_qi",year:-685,city:"linzi",title:"宁戚饭牛",body:"宁戚卫人，饭牛车下，击牛角而疾商歌。桓公闻之曰：「异哉，非常人也！」举以为大夫。",choices:[{label:"闻其歌",effects:[{t:"fame",v:2}],text:"「南山灿，白石烂」，歌辞传开。"},{label:"与其结交",effects:[{t:"rel",k:"ning_qi",v:10}],text:"你与宁戚结为朋友。"}]},{npc:"xian_gao",year:-627,city:"luoyi",title:"弦高犒师",body:"秦师袭郑，道周北门。郑商人弦高遇之，以乘韦先牛十二犒师曰：「寡君闻吾子将步师出于敝邑，敢犒从者。」秦师以为有备，遂灭滑而还。",choices:[{label:"赞其智",effects:[{t:"fame",v:3}],text:"商人救国，传为美谈。"},{label:"学其术",effects:[{t:"skillxp",k:"shanggu",v:20}],text:"矫命犒师而退秦兵，你深味其中的胆识。"}]},{npc:"qin_meng_ming",year:-625,city:"jiang",title:"孟明伐晋",body:"秦伯伐晋，济河焚舟，取王官及郊。晋人不出。封殽尸而还。遂霸西戎。",choices:[{label:"闻其事",effects:[{t:"fame",v:2}],text:"败而不馁，济河焚舟——秦伯以此立威。"},{label:"录其战法",effects:[{t:"skillxp",k:"bingfa",v:20}],text:"「济河焚舟」的破釜之志，你记下了。"}]},{npc:"zou_yan",year:-290,city:"ji",title:"邹衍至燕",body:"邹衍适燕，昭王拥彗先驱，请列弟子之座而受业。筑碣石宫，身亲往师之。",choices:[{label:"列座受业",effects:[{t:"skillxp",k:"xuewen",v:35}],text:"你入碣石宫听邹衍讲五德终始。"},{label:"叹王之礼贤",effects:[{t:"fame",v:2}],text:"拥彗先驱——燕昭王礼贤下士至此。"}]},{npc:"ju_xin",year:-310,city:"ji",title:"剧辛入燕",body:"燕昭王卑身厚币以招贤者，剧辛自赵往，与乐毅、邹衍俱见重于燕。",choices:[{label:"同往投燕",effects:[{t:"fame",v:3}],text:"你也随贤者之流入燕。"},{label:"闻其贤",effects:[{t:"fame",v:1}],text:"剧辛之名，渐播于诸侯。"}]},{npc:"hui_shi",year:-350,city:"jiang",title:"惠施相魏",body:"惠施多方，其书五车。为魏惠王立法，倡导「合同异」之说。庄子尝谓：「以惠子之言为大观。」",choices:[{label:"与之辩",effects:[{t:"skillxp",k:"biancai",v:35}],text:"你与惠施辩「大一小一」，辞穷而思开。"},{label:"录其历物",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"「历物十事」，你抄录一份。"}]},{npc:"zi_si",year:-457,city:"shangqiu",title:"子思适宋",body:"子思居卫，尝适宋。宋大夫乐朔与之言学，不悦，围子思。子思曰：「文王拘于羑里，作《周易》；吾于宋，亦将有所述。」",choices:[{label:"往受教",effects:[{t:"skillxp",k:"xuewen",v:30}],text:"你向孔伋求教，得闻中庸之旨。"},{label:"闻其困而著书",effects:[{t:"fame",v:2}],text:"圣贤困厄而有所述，你深受激励。"}]},{npc:"shu_xiang",year:-538,city:"luoyi",title:"叔向聘周",body:"晋籍谈如周葬穆后，叔向责之：「数典而忘其祖。」又谓韩宣子：「政在家门，民无所依。」",choices:[{label:"闻其论",effects:[{t:"skillxp",k:"biancai",v:25}],text:"「数典忘祖」之讥，你记下了。"},{label:"与之论礼",effects:[{t:"fame",v:2}],text:"你与叔向论礼乐，他称你有识。"}]},{npc:"zi_chan",year:-542,city:"jiang",title:"子产相郑伯如晋",body:"子产相郑伯如晋，晋侯以鲁丧未之见。子产尽坏其馆之垣而纳车马焉。文伯复命，赵文子曰：「信，晋国之上卿也。」",choices:[{label:"闻其辞令",effects:[{t:"skillxp",k:"biancai",v:30}],text:"「坏馆垣」之争，辞令之典范。"},{label:"叹其贤",effects:[{t:"fame",v:3}],text:"古之遗爱也——孔子后来如此评子产。"}]},{npc:"si_ma_rang_ju",year:-530,city:"jiang",title:"穰苴将兵",body:"晏婴荐穰苴于景公：「文能附众，武能威敌。」公以为将军，将兵扞燕晋之师。斩监军庄贾，晋燕之师闻之，皆罢兵。",choices:[{label:"观其治军",effects:[{t:"skillxp",k:"bingfa",v:25}],text:"「将在军，君命有所不受」，你亲见其行。"},{label:"闻其名",effects:[{t:"fame",v:2}],text:"不战而屈人之兵——穰苴做到了。"}]},{npc:"yang_youji",year:-575,city:"jiang",title:"养由基随军",body:"晋楚战于鄢陵。吕锜射楚共王中目。王召养由基，与之两矢，使射吕锜。中项，伏弢。以一矢复命。",choices:[{label:"观其射",effects:[{t:"skillxp",k:"sheshu",v:30}],text:"「百步穿杨」，你亲眼见了。"},{label:"录其事",effects:[{t:"fame",v:2}],text:"一矢复命——养叔之名如日中天。"}]}];Pt.push({npc:"kong_zi",year:-489,city:"shangcai",title:"孔子在蔡",body:"孔子自陈适蔡。陈蔡大夫相与发徒役围孔子于野，不得行，绝粮。从者病，莫能兴。孔子讲诵弦歌不衰。",choices:[{label:"馈以粟粮",effects:[{t:"fame",v:3}],text:"你在绝粮之时送去粟米，夫子谢而不受其名。"},{label:"闻弦歌之声",effects:[{t:"skillxp",k:"xuewen",v:30}],text:"困厄之中弦歌不辍——你记住了这一课。"}]},{npc:"wu_zixu",year:-521,city:"xinzheng",title:"伍员过郑",body:"伍员自宋奔郑。太子建适郑，郑人善之。建又适晋，与晋谋袭郑，郑人知之，乃杀建。员惧，携建子胜奔吴。",choices:[{label:"闻其险途",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"避祸如避火——伍员的路线本身就是一部求生之书。"},{label:"不闻不问",effects:[],text:"亡人之行，不可与闻。"}]},{npc:"wen_zhong",year:-496,city:"kuaiji",title:"文种入越",body:"文种自楚入越，与范蠡同佐勾践。种曰：「贾人夏则资皮，冬则资絺，旱则资舟，水则资车，以待乏也。」",choices:[{label:"录其言",effects:[{t:"skillxp",k:"shanggu",v:25}],text:"「旱则资舟」四字，你记下了。"},{label:"与其结交",effects:[{t:"rel",k:"wen_zhong",v:10}],text:"你与文种相识于越。"}]},{npc:"bo_pi",year:-506,city:"gusu",title:"伯嚭奔吴",body:"楚郤宛之难，伯州犁之孙嚭出奔吴。吴王以为大夫。后为太宰，与伍员同朝而异志。",choices:[{label:"观其为人",effects:[{t:"skillxp",k:"quanmou",v:15}],text:"被离谓子胥：「嚭为人鹰视而狼顾，不可亲也。」"},{label:"与之往来",effects:[{t:"rel",k:"bo_pi",v:8}],text:"你与太宰嚭有了往来。"}]},{npc:"yue_ji_ni",year:-496,city:"kuaiji",title:"计倪佐越",body:"计倪自晋入越。勾践问策，倪曰：「知斗则修备，时用则知物。二者形，则万货之情可得而观已。」",choices:[{label:"求教计然之术",effects:[{t:"skillxp",k:"shanggu",v:30}],text:"「万货之情可得而观」，你入迷了。"},{label:"录其策",effects:[{t:"skillxp",k:"suanshu",v:20}],text:"计然七策，你抄录了数条。"}]},{npc:"you_yu",year:-626,city:"yong",title:"由余入秦",body:"由余自戎使秦。穆公示以宫室积聚，由余曰：「使鬼为之，则劳神矣；使人为之，亦苦民矣。」穆公患其贤，用内史廖之谋，以女乐间之，由余遂降。",choices:[{label:"与论治道",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"「苦民矣」三字，你回味良久。"},{label:"观秦之谋",effects:[{t:"fame",v:2}],text:"一队女乐胜过千军——你见识了秦国的手段。"}]},{npc:"shen_bao_xu",year:-506,city:"yong",title:"申包胥哭秦庭",body:"吴师入郢。申包胥如秦乞师，立依于庭墙而哭，日夜不绝声，勺饮不入口，七日。秦哀公为之赋《无衣》，遂出师。",choices:[{label:"助其哭庭",effects:[{t:"fame",v:5}],text:"你陪他立了三日，理解了什么叫「必存之」。"},{label:"录其事",effects:[{t:"skillxp",k:"biancai",v:25}],text:"七日之哭换一国之师——你记下这则外交奇局。"}]},{npc:"shen_bao_xu",year:-505,city:"ying",title:"申包胥归楚",body:"秦师救楚，吴师败退。申包胥返郢。昭王赏之，包胥曰：「吾为君也，非为身也。」遂逃赏。",choices:[{label:"叹其义",effects:[{t:"fame",v:4}],text:"哭庭求师，功成逃赏——你以此自勉。"},{label:"与之论国",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"你与申包胥论复国之道。"}]},{npc:"mo_zi",year:-435,city:"qufu",title:"墨子归鲁",body:"墨子止楚攻宋后归鲁。弟子问：「胜楚何以为功？」墨子曰：「善为守者，不知攻者之巧也。宋之社稷可保，而吾道行矣。」",choices:[{label:"入其门",effects:[{t:"skillxp",k:"bingfa",v:25}],text:"你随墨者习守御之法。"},{label:"闻其道",effects:[{t:"fame",v:2}],text:"兼爱与非攻，你听了整日。"}]},{npc:"jin_luan_shu2",year:-597,city:"ying",title:"荀罃囚楚",body:"邲之战，荀罃为楚所俘。郑贾人将出之，罃曰：「吾不信也。」贾人如晋，罃实归之。",choices:[{label:"闻其守",effects:[{t:"fame",v:2}],text:"被俘而不失其节，你深以为敬。"},{label:"记其事",effects:[{t:"skillxp",k:"quanmou",v:15}],text:"郑贾人之谋与荀罃之拒，皆是一课。"}]},{npc:"jin_luan_shu2",year:-588,city:"jiang",title:"荀罃归晋",body:"晋归楚俘，楚亦归荀罃。罃归而佐晋，后为中军元帅，修甲兵，通好戎狄，晋悼公复霸，罃之力也。",choices:[{label:"拜见",effects:[{t:"rel",k:"jin_luan_shu2",v:10}],text:"你拜见荀罃，相谈甚欢。"},{label:"录其谋",effects:[{t:"skillxp",k:"bingfa",v:20}],text:"「三驾疲楚」之策，你听他亲述。"}]},{npc:"yi_he",year:-541,city:"jiang",title:"医和视晋平公疾",body:"晋平公病。秦伯使医和视之，曰：「疾不可为也。是谓近女室，疾如蛊。非鬼非食，惑以丧志。」",choices:[{label:"求诊",effects:[{t:"health",v:25}],text:"医和顺带为你诊了脉。"},{label:"闻「六气」",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"「阴淫寒疾，阳淫热疾」，你录下了六气之说。"}]},{npc:"yi_huan",year:-581,city:"jiang",title:"医缓视晋景公疾",body:"晋景公梦疾为二竖子。秦伯使医缓为之。二竖子曰：「彼良医也，惧伤我，焉逃之？」其一曰：「居肓之上、膏之下，若我何？」",choices:[{label:"观其诊",effects:[{t:"skillxp",k:"xuewen",v:20}],text:"「病入膏肓」之典，你亲见其事。"},{label:"求方",effects:[{t:"health",v:20}],text:"医缓为你开了一剂汤药。"}]},{npc:"bian_que",year:-370,city:"luoyi",title:"扁鹊过雒阳",body:"扁鹊过雒阳，闻周人爱老人，即为耳目痹医。随俗为变，名闻天下。",choices:[{label:"求诊",effects:[{t:"health",v:30}],text:"扁鹊诊你耳目之疾，手到病除。"},{label:"观其术",effects:[{t:"skillxp",k:"xuewen",v:20}],text:"「随俗为变」——你观其行医如观政。"}]},{npc:"bian_que",year:-340,city:"yong",title:"扁鹊入秦",body:"扁鹊入咸阳，为小儿医。秦太医令李醯自知伎不如，使人刺杀之。",choices:[{label:"叹其亡",effects:[{t:"fame",v:3}],text:"技高而见妒——扁鹊之死你叹了很久。"},{label:"求其遗方",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"你重金购得扁鹊遗方数卷。"}]},{npc:"zi_lu",year:-480,city:"diqiu",title:"子路治蒲",body:"子路为蒲大夫，孔子过之，入其境曰：「善哉！由恭敬以信矣。」入其邑曰：「善哉！由忠信以宽矣。」",choices:[{label:"观其政",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"「恭敬以信、忠信以宽」，你亲见子路治绩。"},{label:"劝其慎",effects:[{t:"rel",k:"zi_lu",v:12}],text:"你劝子路避卫国内乱，他笑而不答。"}]},{npc:"wei_sun_liang",year:-589,city:"jiang",title:"孙良夫乞师",body:"卫侯使孙良夫如晋乞师。新筑之败，良夫仲叔于奚救之。良夫与臧宣叔如晋，晋师为之出。",choices:[{label:"闻其谋",effects:[{t:"skillxp",k:"quanmou",v:15}],text:"败军之将如何借力复国，你学了一课。"},{label:"随军观战",effects:[{t:"skillxp",k:"bingfa",v:20}],text:"你随晋师观鞍之战。"}]},{npc:"cai_sheng_zi",year:-562,city:"jiang",title:"蔡声子聘晋",body:"蔡声子聘于晋。归楚后谓令尹子木曰：「楚多淫刑，其大夫逃死于四方，而资之以谋楚。」遂进「楚材晋用」之论。",choices:[{label:"记其论",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"「楚材晋用」——四字千钧。"},{label:"与之论刑",effects:[{t:"skillxp",k:"biancai",v:20}],text:"你与声子论楚国刑罚之失。"}]},{npc:"yu_zi",year:-700,city:"luoyi",title:"鬻子佐周",body:"鬻熊年九十见文王。文王曰：「老矣。」对曰：「使臣捕兽逐麋则老矣，使臣坐策国事尚少。」遂为文王师。",choices:[{label:"执弟子礼",effects:[{t:"skillxp",k:"xuewen",v:30}],text:"你从鬻子学政论，深知「老而可用」。"},{label:"叹其辩",effects:[{t:"fame",v:2}],text:"九十岁的策士——你记下了这个先例。"}]},{npc:"wu_ji_zha",year:-543,city:"linzi",title:"季札聘齐",body:"季札适齐，说晏平仲曰：「子速纳邑与政。无邑无政，乃免于难。齐国之政，将有所归；未得所归，难未歇也。」",choices:[{label:"记其言",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"晏婴因此免于栾高之难——季札的眼光你见识了。"},{label:"与观齐政",effects:[{t:"fame",v:2}],text:"你在临淄与季札同论齐政。"}]},{npc:"wu_ji_zha",year:-542,city:"xinzheng",title:"季札聘郑",body:"季札适郑，见子产，如旧相识。与之缟带，子产献纻衣焉。谓子产曰：「郑之执政侈，难将至矣，政必及子。子为政，慎之以礼。」",choices:[{label:"闻「慎之以礼」",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"缟带纻衣之交，你亲见其礼。"},{label:"与同游",effects:[{t:"rel",k:"wu_ji_zha",v:10}],text:"你随季札游于郑市。"}]},{npc:"wu_ji_zha",year:-538,city:"gusu",title:"季札归吴",body:"季札遍聘上国而归。徐君已死，于是解其宝剑，系于徐君冢树而去。从者曰：「徐君已死，尚谁予乎？」季子曰：「不然。始吾心已许之，岂以死倍吾心哉！」",choices:[{label:"观挂剑",effects:[{t:"fame",v:4}],text:"「始吾心已许之」——你亲眼见了季札挂剑。"},{label:"录其事",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"心诺重于千金——你把这则故事讲给很多人听。"}]},{npc:"xian_gao",year:-626,city:"xinzheng",title:"弦高归郑",body:"秦师既退，郑穆公以存国之赏赏弦高。弦高辞曰：「诈而得赏，则郑国之政废矣。」遂徙其商队而东。",choices:[{label:"闻其辞赏",effects:[{t:"fame",v:3}],text:"「诈而得赏则政废」——商人风骨，你记下了。"},{label:"与之同商",effects:[{t:"skillxp",k:"shanggu",v:20}],text:"你与弦高的商队同行了一段。"}]},{npc:"lu_cao_mo",year:-681,city:"linzi",title:"曹沫劫盟",body:"鲁庄公与齐桓公会于柯。曹沫执匕首劫桓公，桓公左右莫敢动。管仲曰：「君何反其侵地？」桓公许之。",choices:[{label:"观其勇",effects:[{t:"skillxp",k:"jianshu",v:25}],text:"劫盟于万军之中——你见了曹沫的胆。"},{label:"记其事",effects:[{t:"fame",v:3}],text:"一剑而复三败之地，你记下这则奇闻。"}]},{npc:"qu_wan",year:-656,city:"tao",title:"屈完使齐",body:"齐侯陈诸侯之师，与屈完乘而观之。齐侯曰：「以此众战，谁能御之？」屈完对曰：「君若以德绥诸侯，谁敢不服？」",choices:[{label:"闻其辞令",effects:[{t:"skillxp",k:"biancai",v:30}],text:"「方城为城，汉水为池」，你记下了这段外交辞令。"},{label:"随观会盟",effects:[{t:"fame",v:2}],text:"召陵之盟，你在现场。"}]},{npc:"wu_ju",year:-552,city:"xinzheng",title:"伍举奔郑",body:"椒举将奔晋。声子遇之于郑郊，班荆相与食，而言复故。",choices:[{label:"闻「班荆道故」",effects:[{t:"fame",v:3}],text:"班荆道故——这个典故你亲见了。"},{label:"闻其怨",effects:[{t:"skillxp",k:"quanmou",v:15}],text:"楚国的内耗，你从伍举的抱怨里听得分明。"}]},{npc:"shen_shu_shi",year:-598,city:"linzi",title:"申叔时使齐",body:"申叔时使于齐，反，复命而退。楚子使让之曰：「夏徵舒弑其君，诸侯县陈，尔独不庆。」对曰：「牵牛以蹊人之田，而夺之牛。蹊者有罪矣，而夺之牛，罚已重矣。」",choices:[{label:"闻「蹊田夺牛」",effects:[{t:"skillxp",k:"biancai",v:25}],text:"这个比喻的分量，你当场掂量了。"},{label:"与之论义",effects:[{t:"fame",v:2}],text:"讨罪而不贪地，义之所在。"}]},{npc:"chen_yuan_tao",year:-656,city:"shangqiu",title:"辕涛涂谋齐",body:"齐侯还师，将道陈郑之间。辕涛涂谓郑申侯曰：「师出于陈郑之间，国必甚病。若出于东方，观兵于东夷，循海而归，可也。」",choices:[{label:"记其谋",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"小国在大国夹缝中的自保术，你见识了。"},{label:"叹其反受其祸",effects:[{t:"fame",v:1}],text:"涛涂终以此得罪于齐——谋身者反自谋。"}]},{npc:"cao_xi_fu",year:-637,city:"jiang",title:"重耳过曹",body:"晋公子重耳过曹，曹共公闻其骈胁，欲观其裸。僖负羁之妻曰：「晋公子从者皆足以相国。」负羁乃馈盘飧，置璧焉。公子受飧反璧。",choices:[{label:"闻「受飧反璧」",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"识人于落难之时——僖负羁之妻的眼光，你叹服。"},{label:"闻其祸",effects:[{t:"fame",v:2}],text:"曹共公因无礼而致国灭，你记下这个教训。"}]},{npc:"xian_zhen",year:-655,city:"diqiu",title:"重耳奔狄",body:"骊姬之乱，重耳奔狄，从者狐偃、赵衰、颠颉、魏武子、司空季子。居狄十二年。",choices:[{label:"随行观士",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"流亡队伍里全是将相之才——你识得了。"},{label:"录其居狄",effects:[{t:"fame",v:2}],text:"「居狄十二年」，一段传奇的开头。"}]},{npc:"hu_yan",year:-636,city:"jiang",title:"狐偃归晋",body:"重耳返晋即位。至河，子犯以璧授公子曰：「臣负羁绁从君巡于天下，罪甚多矣。」公子曰：「所不与舅氏同心者，有如白水！」投其璧于河。",choices:[{label:"观河盟",effects:[{t:"fame",v:3}],text:"「有如白水」——你亲见投璧之誓。"},{label:"与之论政",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"狐偃论晋政，字字切要。"}]},{npc:"yue_zhu_ji",year:-494,city:"gusu",title:"诸稽郢使吴",body:"吴师入越，勾践使诸稽郢行成于吴。郢曰：「句践请盟，愿春秋朝聘，委质为臣。」吴王许之。伍员谏曰：「不可！吴越邻邦，此天以越赐吴。」吴王弗听。",choices:[{label:"观其辞令",effects:[{t:"skillxp",k:"biancai",v:25}],text:"「请为前马」之辞，卑而不可犯。"},{label:"闻伍员之谏",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"「不可」二字，伍员说了，没人听。"}]},{npc:"chunyu_kun",year:-350,city:"jiang",title:"淳于髡使诸侯",body:"淳于髡数使诸侯，未尝屈辱。齐王赐之金，髡曰：「臣饮一斗亦醉，一石亦醉。酒极则乱，乐极则悲。」",choices:[{label:"与共饮",effects:[{t:"stamina",v:30}],text:"与髡同醉，乐极而知其谏。"},{label:"闻其讽",effects:[{t:"skillxp",k:"biancai",v:30}],text:"「一鸣惊人」之后的又一场滑稽谏——你在场。"}]},{npc:"zi_si",year:-455,city:"diqiu",title:"子思归卫",body:"子思自宋归卫。卫侯言计非是，而群臣和者如出一口。子思曰：「君出言自以为是，而卿大夫莫敢矫其非。君臣既自贤矣，而群下同声贤之。」",choices:[{label:"闻其论",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"「自以为是而群下同声」——你记下这句判词。"},{label:"执弟子礼",effects:[{t:"skillxp",k:"xuewen",v:25}],text:"你从子思学中庸之道。"}]},{npc:"shu_xiang",year:-537,city:"jiang",title:"叔向论季世",body:"叔向谓韩宣子曰：「虽吾公室，今亦季世也。戎马不驾，卿无军行，公乘无人，卒列无长。庶民罢敝，而宫室滋侈。」",choices:[{label:"记其论",effects:[{t:"skillxp",k:"quanmou",v:25}],text:"「公室之季世」，你抄录了这段话。"},{label:"与之同忧",effects:[{t:"rel",k:"shu_xiang",v:10}],text:"你与叔向论晋之将乱，相谈至夜。"}]},{npc:"zi_chan",year:-536,city:"jiang",title:"子产再聘晋",body:"子产再如晋。赵景子问政。子产曰：「君子长国家者，非无贿之患，而无令名之难。」",choices:[{label:"闻「令名」之论",effects:[{t:"skillxp",k:"biancai",v:25}],text:"「无令名之难」——子产论名实之要。"},{label:"闻其刑书",effects:[{t:"skillxp",k:"xuewen",v:20}],text:"你向子产问起铸刑书之事。"}]},{npc:"zi_chan",year:-522,city:"xinzheng",title:"子产卒",body:"子产卒，仲尼闻之，出涕曰：「古之遗爱也。」郑人皆哭泣，悲之如亡亲戚。",choices:[{label:"往吊",effects:[{t:"fame",v:4}],text:"你赴郑吊唁，见郑人哭之如亲。"},{label:"录其政",effects:[{t:"skillxp",k:"quanmou",v:30}],text:"你整理子产为政之迹，成一篇传述。"}]},{npc:"ji_wen_zi",year:-610,city:"jiang",title:"季文子如晋",body:"季文子相宣成，无衣帛之妾，无食粟之马。仲孙它谏之，文子曰：「吾观国人，其父兄之食粗而衣恶者犹多矣。吾是以不敢。」",choices:[{label:"闻其俭",effects:[{t:"fame",v:3}],text:"「妾不衣帛，马不食粟」，你亲见其居。"},{label:"与之论俭",effects:[{t:"rel",k:"ji_wen_zi",v:10}],text:"你与季文子论「独居荣华」之辩。"}]},{npc:"zang_wen_zhong",year:-629,city:"jiang",title:"臧文仲如晋",body:"臧文仲如晋，与韩宣子论「居官者当事不避难，在位者恤民之患」。其言录于鲁史。",choices:[{label:"闻其言",effects:[{t:"skillxp",k:"quanmou",v:20}],text:"「当事不避难」，你记下这句官箴。"},{label:"与之论礼",effects:[{t:"rel",k:"zang_wen_zhong",v:10}],text:"你与臧文仲论祭祀与民本。"}]})});function Tn(e){let i=[],a=e.time.year;if(e.time.month!==1)return i;e.flags.arrivalFired=e.flags.arrivalFired??[];for(let n of Pt){if(n.year!==a)continue;let o=`${n.npc}@${n.year}`;if(e.flags.arrivalFired.includes(o))continue;let l=C[n.npc];if(!l)continue;e.flags.arrivalFired.push(o);let c={id:"arr_"+o,title:n.title,body:n.body,choices:n.choices.map(u=>({label:u.label,effects:u.effects??[],text:u.text})),effects:[]};i.push(Ni(e,"arrival",c)),$(e,`${l.name}至${n.title.replace(/^.+?于|^.+?至|^.+?适/,"")}。`,"war")}return i}var kf,Cn=O(()=>{On();ie();Ri();R();kf=new Map(Pt.map(e=>[`${e.npc}@${e.year}`,e]))});var t,r,k,f,Ae=O(()=>{t=(e,i,a,s)=>({tag:e,level:i,text:a,reply:s}),r=(e,...i)=>({q:e,options:i}),k=(e,i,a)=>({name:e,concern:i,text:a}),f=(e,i,a,s,n,o,l,c,u,m,h,d,y=null,p=null)=>({id:e,title:i,category:a,heart:s,authority:n,opponent:{name:o,title:l},desc:c,concerns:u,evidence:m&&{...m,topic:m.topic??p},outcomes:h,effects:d,followup:y,topic:p})});var In,Nn=O(()=>{Ae();In=[f("relief","开仓赈灾","domestic","li",!0,"县令","县宰","县中大旱，流民塞道，府库却只够支应军粮。县令既怕民变，也怕军中断粮。",[r("开仓能解眼前之急，但下月驻军的口粮又该如何？",t("li","hit","先拨三成救急，再向邻县借粮，可保军粮不断。","县令沉吟：「若真能借到粮，倒也可行。」"),t("yi","reason","百姓也是朝廷子民，岂能见死不救？","他叹道：「话虽如此，军粮断了，谁来担责？」"),t("ming","evade","前任县令也曾开仓，大人照办便是。","他皱眉：「彼时与今日，岂可同日而语。」")),r("邻县若是不肯借呢？",t("shi","hit","以盐铁之利相换，邻县不会不动心。","县令点头：「有来有往，这倒说得通。」"),t("li","reason","可先许他们来年减税，总能谈成。","他摇头 cess:"新田制推行，赋税渐均。",compromise:"执政同意丈量，但要你先带人实测一乡。",fail:"丈量半途而废，豪强更加隐匿田亩。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-4}},{title:"丈量田亩",desc:"执政命你带人实测一乡田亩，厘清旧册之误。",mode:"check",checkSkill:"suanshu",dc:46,days:18,reward:{money:70,fame:3,merit:10}}),f("prices","平抑粮价","domestic","li",!0,"司徒","掌财赋","粮价飞涨，粮商囤积居奇，司徒既怕民怨，又怕官粮不足。",[r("粮商囤积不卖，官仓存粮又不多，怎么压价？",t("li","hit","每日少量平价售官粮，粮商怕砸手里，自会跟价。","司徒点头：「以小搏大，可以一试。」"),t("shi","reason","查抄几家囤粮大户，杀一儆百。","他说：「查抄容易，善后难。」"),t("ming","evade","从前李悝平籴，也是官府出粮。","他反问：「李悝有粮，我有吗？」")),r("若把官粮卖光了，来年青黄不接时怎么办？",t("li","hit","只卖三成，余粮留作种子与赈济，同时向邻国籴粮。","司徒道：「留有余地，才算稳妥。」"),t("yi","reason","百姓眼下就要饿死，顾不得来年了。","他叹：「顾了眼下，来年还是要死人。」"),t("ming","evade","按旧例，官仓本就该在此时出粮。","他摇头：「旧例也没说卖光。」")),r("邻国若趁机禁籴、抬价，又该如何？",t("li","hit","用盐铁与他们对换，绕过粮禁。","司徒目光一亮：「以货易粮，他们未必不肯。」"),t("shi","reason","陈兵边境，逼他们开籴。","他皱眉：「为一石粮动兵，未免太险。」"),t("yi","evade","天下总有仁义之国，不会见死不救。","他苦笑：「仁义之国，也得先顾自己。」"))],k("粮商账目",0,"你出示粮商账目：三家大户囤粮逾万石，足够城中两月。"),{success:"粮价渐平，民心稍安。",compromise:"司徒同意平价售粮，但要你负责向邻国籴粮。",fail:"粮价继续飞涨，城中出现抢粮。"},{success:{fame:5,rel:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"调运官粮",desc:"司徒命你前往邻邑，调运官粮入城。",mode:"travel",targetCity:"pengcheng",days:16,reward:{money:80,fame:3,merit:6}})]});var Rn,Ln=O(()=>{Ae();Rn=[f("alliance","齐楚结盟","diplomacy","shi",!0,"楚使","大夫","齐楚连年对峙，楚国遣使试探结盟。楚使老练，句句不离利害与兵力。",[r("结盟可以，但楚国凭什么相信齐国不会背后捅刀？",t("shi","hit","两国各遣一支质子军驻于边境，互相牵制。","楚使点头：「彼此都有人质在手，倒公平。」"),t("yi","reason","既已歃血为盟，便当以信义相待。","他淡笑：「信义若能挡兵，天下早太平了。」"),t("ming","evade","当年齐桓公与楚成王也曾会盟。","他反问：「那一次，最后是谁先退的兵？」")),r("晋国若从中作梗，齐国扛得住吗？",t("shi","hit","齐楚先约定互不攻伐，晋国便不敢轻动。","楚使道：「先稳住背后，才谈得上联手。」"),t("li","reason","可许晋国一些边邑，换他中立。","他皱眉：「割地求和，晋国会更贪。」"),t("yi","evade","晋国若兴不义之兵，天下共讨之。","他哂笑：「天下共讨？谁来讨？」")),r("盟约总要有个凭信，空口白话可不行。",t("shi","hit","以两国边邑互换为质，再加盟书与质子。","楚使道：「有地有质，才算真盟。」"),t("ming","reason","可仿照葵丘之会，束牲载书，昭告诸侯。","他说：「仪式虽好，终究不如实利。」"),t("yi","evade","君子一言，驷马难追，何须多此一举。","他大笑：「君子？你我都是替国君办事的人。」"))],k("边境舆图",2,"你展开舆图，指出两国可互换的两处边邑，轻重相当。"),{success:"齐楚盟成，晋国
