",s:"lu",v:-4}],choices:[{label:"暗中查访此事",hint:"权谋之试",check:{k:"quanmou",dc:46},success:[{t:"fame",v:4},{t:"skill",k:"quanmou",v:1}],fail:[{t:"health",v:-4}],text:"你在市井间探得蛛丝马迹，却也因此触了忌讳。"},{label:"不论国事",hint:"",effects:[],text:"鲁国之乱，非布衣所能置喙。"}]},{id:"xu_ge",year:-707,month:8,title:"繻葛之战",where:{state:"zheng"},body:"周桓王夺郑伯政，郑不朝。王以诸侯伐郑，战于繻葛。郑祝聃射王中肩，王师败绩。",effects:[{t:"power",s:"zhou",v:-6},{t:"power",s:"zheng",v:5}],choices:[{label:"从郑军观战",hint:"箭术与胆气",check:{k:"sheshu",dc:44},success:[{t:"fame",v:5},{t:"merit",v:10},{t:"skill",k:"sheshu",v:1}],fail:[{t:"health",v:-8}],text:"你随郑军左拒，见王师中军动摇，一箭之机，终身难忘。"},{label:"避于乡野",hint:"",effects:[{t:"health",v:2}],text:"兵锋之下，你避入乡野，听远处鼓声渐息。"}]},{id:"qi_huan_li",year:-685,month:1,title:"齐桓公即位",where:{state:"qi"},body:"公孙无知被杀，公子小白自莒先入齐，是为桓公。桓公不计射钩之仇，用鲍叔牙之荐，相管仲。",effects:[{t:"power",s:"qi",v:6},{t:"flag",k:"guan_zhong_相齐",v:!0}],choices:[{label:"赴临淄求见管仲",hint:"需在齐地，或有晋身之阶",effects:[{t:"rel",id:"guan_zhong",v:10},{t:"fame",v:2}],text:"你于相府门外候了半日，管仲乘车而出，瞥你一眼，命从者记下你的名字。"},{label:"观望齐国之变",hint:"",effects:[],text:"齐国内乱方定，你且看这新君如何行事。"}]},{id:"changshao",year:-684,month:6,title:"长勺之战",where:{state:"lu"},body:"齐师伐鲁，鲁庄公御之。曹刿请见，与公同乘，待齐人三鼓而后进，齐师败绩。",effects:[{t:"power",s:"lu",v:4},{t:"power",s:"qi",v:-3}],choices:[{label:"随鲁军听曹刿论战",hint:"兵法之试",check:{k:"bingfa",dc:40},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:3},{t:"rel",id:"cao_gui",v:8}],fail:[{t:"fame",v:1}],text:"曹刿按剑立于车右，曰「未可」，你屏息听着鼓声，第一次明白「气」字的分量。"},{label:"远远避兵",hint:"",effects:[{t:"stamina",v:-3}],text:"你避兵于山阜，看齐师车辙乱、旗靡，方知鲁人胜了。"}]},{id:"beixing",year:-681,month:4,title:"北杏之会",where:{state:"qi"},body:"齐桓公会宋、陈、蔡、邾于北杏，以平宋乱。诸侯始服齐，管仲之谋也。",effects:[{t:"power",s:"qi",v:4}],choices:[{label:"携礼往会",hint:"花费三十金，或得声名",effects:[{t:"money",v:-30},{t:"fame",v:5},{t:"rel",id:"bao_shuya",v:6}],text:"会盟之坛上，诸侯歃血为盟。你立于末席，看见齐侯的旌旗在风里招展。"},{label:"不入会是非",hint:"",effects:[],text:"诸侯会盟，与你一个布衣何干。"}]},{id:"qi_ba",year:-679,month:3,title:"齐桓公始霸",where:{state:"qi"},body:"齐桓公会诸侯于鄄，宋、陈、卫、郑皆至。齐遂为诸侯长，天下翕然宗之。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"献书于齐侯",hint:"学问或辩才",check:{k:"xuewen",dc:40},success:[{t:"fame",v:6},{t:"rel",id:"qi_huan",v:8}],fail:[{t:"fame",v:1}],text:"你陈说「尊王攘夷」之义，齐侯抚掌，命人将你的书简收于府中。"},{label:"不往",hint:"",effects:[],text:"霸主之名，起于会盟。"}]},{id:"shanrong",year:-664,month:5,title:"齐救燕",where:{state:"yan"},body:"山戎伐燕，燕告急于齐。齐桓公救燕，遂伐山戎，至于孤竹而还。燕君送齐侯出境，齐侯割燕君所至之地与燕。",effects:[{t:"power",s:"yan",v:3},{t:"power",s:"qi",v:2}],choices:[{label:"从齐师北伐山戎",hint:"武艺与胆略",check:{k:"sheshu",dc:46},success:[{t:"fame",v:5},{t:"merit",v:12},{t:"skill",k:"sheshu",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:1}],text:"北地苦寒，你随齐师穿过山谷，冻裂的手指终于拉开了一次弓。"},{label:"送燕侯一程",hint:"",effects:[{t:"rel",id:"yan_zhuang",v:8},{t:"fame",v:2}],text:"燕侯的车驾向北而去，你立于道旁，听他说「燕人不忘齐侯之德」。"}]},{id:"zhaoling",year:-656,month:7,title:"召陵之盟",where:{state:"chu"},body:"齐桓公率诸侯伐楚，责包茅不入。楚使屈完如师，齐侯陈诸侯之师与之观，屈完曰：「君若以德绥诸侯，谁敢不服？」遂盟于召陵。",effects:[{t:"power",s:"qi",v:4},{t:"power",s:"chu",v:-2}],choices:[{label:"为诸侯执笔盟辞",hint:"学问与辩才",check:{k:"xuewen",dc:48},success:[{t:"fame",v:8},{t:"skill",k:"biancai",v:1},{t:"money",v:60}],fail:[{t:"fame",v:2}],text:"盟辞一字之差，诸侯半日不决。你据《周礼》改定三字，遂定盟。"},{label:"旁观诸侯之师",hint:"",effects:[{t:"skill",k:"bingfa",v:1}],text:"八国之师阵列于召陵，你第一次见识何为「诸侯之师」。"}]},{id:"kuaiqiu",year:-651,month:8,title:"葵丘之会",where:{state:"song"},body:"齐桓公会诸侯于葵丘，周天子使宰孔赐胙，命齐侯无拜。齐侯下拜受赐，诸侯皆服。盟曰：毋雍泉，毋讫籴，毋易树子，毋以妾为妻。",effects:[{t:"power",s:"qi",v:5},{t:"flag",k:"hegemon",v:"qi"}],choices:[{label:"与会观礼",hint:"声名之会",effects:[{t:"money",v:-40},{t:"fame",v:8},{t:"rel",id:"qi_huan",v:6}],text:"坛上诸侯束牲载书，你听见齐侯一字一句念出盟辞。天下秩序，似乎就系于这几句话上。"},{label:"不入会",hint:"",effects:[],text:"霸主之会，往来皆卿相，与你无涉。"}]},{id:"hanyuan",year:-645,month:9,title:"韩原之战",where:{state:"qin"},body:"晋惠公背秦赂，秦穆公伐晋，战于韩原。晋惠公马陷泥中，为秦所俘。秦人欲杀之，穆公夫人以死请，乃归晋侯。",effects:[{t:"power",s:"qin",v:5},{t:"power",s:"jin",v:-4}],choices:[{label:"从秦军观战",hint:"兵法之试",check:{k:"bingfa",dc:50},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:4}],fail:[{t:"health",v:-8}],text:"你看见晋侯的战车陷在泥里，秦人的甲士一拥而上。战阵之间，胜负只在一瞬。"},{label:"劝秦伯勿杀晋侯",hint:"辩才之试",check:{k:"biancai",dc:52},success:[{t:"rel",id:"qin_mu",v:10},{t:"fame",v:6}],fail:[{t:"fame",v:1}],text:"你言「杀之则天下以秦为暴」，秦伯默然，最终归晋侯于绛。"}]},{id:"huan_gong_si",year:-643,month:10,title:"齐桓公卒",where:{state:"qi"},body:"管仲已卒，竖刁、易牙、开方用事。桓公病，五公子争立，宫中空虚，尸在床上六十七日，虫流出户。",effects:[{t:"power",s:"qi",v:-12},{t:"flag",k:"hegemon",v:""}],choices:[{label:"入宫收敛桓公",hint:"重义之举",effects:[{t:"fame",v:10},{t:"money",v:-50},{t:"rel",id:"bao_shuya",v:6}],text:"你与数名老臣入宫，掩上那扇久无人开的大门。一代霸主，终究不过一具尸骸。"},{label:"叹息而去",hint:"",effects:[{t:"fame",v:1}],text:"盛极而衰，你在临淄的市上听见这个消息，只觉得风吹得冷。"}]},{id:"hongshui",year:-638,month:11,title:"泓水之战",where:{state:"song"},body:"宋襄公伐郑，楚救之，战于泓。宋人既成列，楚人未济，目夷请击之，公曰不可。楚人济而未成列，又请击，公曰不可。既成列而后击之，宋师大败，公伤股。",effects:[{t:"power",s:"song",v:-6},{t:"power",s:"chu",v:3}],choices:[{label:"谏宋公半渡而击",hint:"兵法之试",check:{k:"bingfa",dc:44},success:[{t:"rel",id:"song_xiang",v:4},{t:"fame",v:5},{t:"skill",k:"bingfa",v:1}],fail:[{t:"fame",v:1}],text:"你引《军志》「先人有夺人之心」，宋公摇头不语，仍待楚人成列。"},{label:"预避于岸",hint:"",effects:[],text:"你在岸上看着宋军溃散，泓水被血染成暗红。"}]},{id:"chengpu",year:-632,month:4,title:"城濮之战",where:{state:"jin"},body:"晋文公伐曹卫以救宋，楚子玉帅师来战。晋师退避三舍，战于城濮。晋下军蒙马以虎皮先犯陈蔡，楚右师溃；狐毛设二旆而退，楚左师溃。楚师败绩。",effects:[{t:"power",s:"jin",v:8},{t:"power",s:"chu",v:-6},{t:"flag",k:"hegemon",v:"jin"},{t:"power",s:"song",v:2}],choices:[{label:"从晋中军，献策破楚",hint:"兵法之试，晋地可入",req:{state:"jin"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:60},{t:"fame",v:14},{t:"rel",id:"xian_zhen",v:12},{t:"skill",k:"bingfa",v:1}],fail:[{t:"health",v:-18},{t:"fame",v:3}],text:"你随先轸登车，望见楚右师阵脚已乱。战后清点军功，你的名字被记在竹简上。"},{label:"以辩才说楚子玉退兵",hint:"辩才之试，极难",check:{k:"biancai",dc:64},success:[{t:"fame",v:20},{t:"power",s:"jin",v:2},{t:"skill",k:"biancai",v:1}],fail:[{t:"health",v:-10},{t:"fame",v:4}],text:"你单车入楚营，陈说利害。子玉怒而不听，你退出营门时，听见身后甲叶作响。"},{label:"避于他国",hint:"",effects:[{t:"stamina",v:-5}],text:"中原大战，你避于他国，只从行人口中听闻战况。"}]},{id:"xiao_zhi_zhan",year:-627,month:4,title:"殽之战",where:{state:"qin"},body:"秦穆公不听蹇叔之谏，遣孟明视等袭郑。郑商人弦高以牛十二犒师，秦师以为郑有备，灭滑而还。晋先轸伏兵于殽，秦师覆没。",effects:[{t:"power",s:"qin",v:-6},{t:"power",s:"jin",v:3},{t:"rel",id:"xian_gao",v:6}],choices:[{label:"随弦高犒秦师",hint:"在郑地，重义",req:{state:"zheng"},effects:[{t:"fame",v:12},{t:"rel",id:"xian_gao",v:14},{t:"money",v:-40},{t:"skill",k:"shanggu",v:1}],text:"你与弦高一同驱牛入秦营，自称郑君所遣。秦人按兵，郑国得免一劫。"},{label:"赴殽山吊唁秦师",hint:"",effects:[{t:"fame",v:3}],text:"殽山之间尸骨相枕，你与乡人掩埋了数十具尸骸。"}]},{id:"bi_zhi_zhan",year:-597,month:6,title:"邲之战",where:{state:"chu"},body:"楚庄王围郑，晋师救之，战于邲。晋中军先济，士卒争舟，舟中之指可掬。楚师大胜，饮马于河，遂霸中原。",effects:[{t:"power",s:"chu",v:8},{t:"power",s:"jin",v:-6},{t:"flag",k:"hegemon",v:"chu"}],choices:[{label:"从楚军，观其用兵",hint:"兵法之试，楚地",req:{state:"chu"},check:{k:"bingfa",dc:56},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:8},{t:"rel",id:"chu_zhuang",v:10}],fail:[{t:"health",v:-12}],text:"你立于楚王战车之侧，看他旌旗一动，三军如臂使指。"},{label:"救晋军溃卒",hint:"重义，可增名声",effects:[{t:"fame",v:8},{t:"health",v:-6},{t:"stamina",v:-10}],text:"你在河岸拉起十几个晋国溃卒，他们的手指都被舟楫削断。"}]},{id:"an_zhi_zhan",year:-589,month:6,title:"鞌之战",where:{state:"qi"},body:"齐顷公伐鲁卫，晋郤克帅师救之，战于鞌。齐侯轻敌，不介马而驰，为晋所败。齐侯几为俘，逢丑父易位以免之。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"qi",v:-4}],choices:[{label:"随晋军为御",hint:"御术与胆气",check:{k:"jianshu",dc:48},success:[{t:"merit",v:30},{t:"fame",v:6},{t:"skill",k:"jianshu",v:1}],fail:[{t:"health",v:-14}],text:"战车在泥泞里打着旋，你死死拉住缰绳，听见身后箭矢破空。"},{label:"不预其事",hint:"",effects:[],text:"齐晋之战，与你无涉。"}]},{id:"yanling",year:-575,month:6,title:"鄢陵之战",where:{state:"zheng"},body:"晋厉公伐郑，楚共王救之，战于鄢陵。晋将魏锜射中楚王目，楚师夜遁。养由基善射，一箭穿杨，然终不能挽楚之败。",effects:[{t:"power",s:"jin",v:4},{t:"power",s:"chu",v:-3}],choices:[{label:"与养由基比射",hint:"射术之试",check:{k:"sheshu",dc:58},success:[{t:"rel",id:"yang_youji",v:14},{t:"fame",v:10},{t:"skill",k:"sheshu",v:1}],fail:[{t:"fame",v:2},{t:"health",v:-4}],text:"百步之外的柳叶在风里颤。你射中了，养由基大笑，说「可教也」。"},{label:"救护伤卒",hint:"",effects:[{t:"fame",v:4},{t:"health",v:-3}],text:"你在战场上奔走，把伤卒一个一个拖到车下。"}]},{id:"mibing",year:-546,month:5,title:"弭兵之会",where:{state:"song"},body:"宋左师向戌奔走晋楚之间，合诸侯之大夫盟于宋。晋楚之从交相见，天下息兵。向戌辞邑，曰：「以靖小国，请免之。」",effects:[{t:"power",s:"song",v:5},{t:"flag",k:"mibing",v:!0}],choices:[{label:"为向戌执笔记盟",hint:"学问或辩才",check:{k:"xuewen",dc:52},success:[{t:"fame",v:14},{t:"rel",id:"xiang_xu",v:12},{t:"money",v:80}],fail:[{t:"fame",v:2}],text:"盟书凡七国，字字斟酌。向戌拍你的肩说：「天下自此少死许多人。」"},{label:"往观盟礼",hint:"",effects:[{t:"fame",v:4}],text:"诸侯之大夫会于宋，歃血之后，各自归国。"}]},{id:"zi_chan_si",year:-522,month:12,title:"子产卒",where:{state:"zheng"},body:"郑子产卒。孔子闻之，出涕曰：「古之遗爱也。」郑人相与哭于巷，三月不闻竽瑟之声。",effects:[{t:"power",s:"zheng",v:-5}],choices:[{label:"往新郑吊之",hint:"重义",effects:[{t:"fame",v:6},{t:"money",v:-20}],text:"你在子产之丧上，听见郑人哭声不绝。"},{label:"读其刑书而叹",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1}],text:"铸于鼎上的刑书，第一次让庶民知法之所在。"}]},{id:"baiju",year:-506,month:11,title:"柏举之战",where:{state:"wu"},body:"吴王阖闾用伍子胥、孙武之谋，五战入郢。楚昭王出奔，吴人入楚王宫。伍子胥掘楚平王墓，鞭尸三百。",effects:[{t:"power",s:"wu",v:10},{t:"power",s:"chu",v:-10}],choices:[{label:"从吴军入郢",hint:"在吴地，武艺或兵法",req:{state:"wu"},check:{k:"bingfa",dc:56},success:[{t:"merit",v:50},{t:"fame",v:14},{t:"money",v:150},{t:"rel",id:"wu_zixu",v:10}],fail:[{t:"health",v:-16}],text:"五战五捷，吴师入郢。你站在楚王宫阶前，看伍子胥一言不发地走向平王墓。"},{label:"随楚人奔随",hint:"重义",effects:[{t:"fame",v:6},{t:"health",v:-8}],text:"你随楚昭王奔随，山路崎岖，王的车驾在身后只剩一点尘。"}]},{id:"zui_li",year:-496,month:5,title:"槜李之战",where:{state:"wu"},body:"越王允常卒，勾践立。吴王阖闾伐越，越人使死士三行，属剑于颈而自刭，吴师属目，越人因而袭之。阖闾伤指，还卒于陉。",effects:[{t:"power",s:"yue",v:6},{t:"power",s:"wu",v:-5}],choices:[{label:"救吴王于阵中",hint:"武艺之试",check:{k:"jianshu",dc:54},success:[{t:"fame",v:12},{t:"rel",id:"fu_cha",v:14},{t:"health",v:-10}],fail:[{t:"health",v:-20},{t:"fame",v:3}],text:"你扛起阖闾的时候，他的手指已经断了，血顺着甲叶往下滴。"},{label:"避于会稽山中",hint:"",effects:[{t:"stamina",v:5}],text:"山雨欲来，你在会稽山中听樵夫说起吴越之事。"}]},{id:"fujiao",year:-494,month:3,title:"夫椒之战",where:{state:"yue"},body:"吴王夫差悉发精兵伐越，败越于夫椒。勾践以甲楯五千栖于会稽，使大夫种行成于吴。",effects:[{t:"power",s:"yue",v:-8},{t:"power",s:"wu",v:6}],choices:[{label:"随文种入吴营请成",hint:"辩才之试",check:{k:"biancai",dc:56},success:[{t:"rel",id:"wen_zhong",v:12},{t:"fame",v:10},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:2}],text:"你与文种跪于吴营之前，说尽卑辞厚礼。夫差终于点头，越国得以不亡。"},{label:"入山吊越之遗民",hint:"",effects:[{t:"fame",v:4},{t:"rel",id:"gou_jian",v:8}],text:"会稽山下，越人扶老携幼。你分了些粟米给他们。"}]},{id:"huangchi",year:-482,month:7,title:"黄池之会",where:{state:"wu"},body:"吴王夫差会晋定公于黄池，争长。吴人曰「于周室我为长」，晋人曰「于姬姓我为伯」。夫差以兵威胁晋，终先歃。然越已入吴，吴都告急。",effects:[{t:"power",s:"wu",v:3},{t:"power",s:"yue",v:6}],choices:[{label:"劝吴王速归",hint:"智略之试",check:{k:"quanmou",dc:54},success:[{t:"fame",v:8},{t:"rel",id:"fu_cha",v:6}],fail:[{t:"fame",v:1}],text:"你言「国本已危，争长何为」。夫差沉默良久，连夜拔营。"},{label:"不与",hint:"",effects:[],text:"黄池之会，诸侯争一席之位，而越人已入吴都。"}]},{id:"chu_cheng_pu",year:-632,month:4,title:"晋楚城濮之战",where:{state:"jin"},body:"楚师围宋，宋告急于晋。晋文公伐曹卫以救宋，楚子玉怒而北上。晋侯退避三舍以报楚惠，楚师不退，战于城濮。晋以虎皮蒙马先犯陈蔡，陈蔡奔，楚师溃。",effects:[{t:"war",a:"jin",b:"chu"},{t:"power",s:"jin",v:12},{t:"power",s:"chu",v:-8},{t:"flag",k:"hegemon",v:"jin"}],choices:[{label:"观晋侯退避三舍",hint:"重义",check:{k:"xuewen",dc:32},success:[{t:"fame",v:5},{t:"skill",k:"xuewen",v:1}],fail:[{t:"fame",v:2}],text:"你见晋师一退再退，士卒无怨言。旁人道：「此所谓君之信也。」"},{label:"往楚军观阵",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:1},{t:"money",v:40}],fail:[{t:"health",v:-6}],text:"你混入楚营，见子玉刚愎，知其必败。"}]},{id:"jin_li_ji",year:-656,month:8,title:"骊姬之乱",where:{state:"jin"},body:"晋献公宠骊姬，姬欲立其子奚齐，谮太子申生。申生自缢于新城，重耳、夷吾出奔。晋国自此内乱二十年。",effects:[{t:"power",s:"jin",v:-8}],choices:[{label:"护送公子出奔",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"hu_yan",v:10}],text:"你为公子重耳驾车出蒲，一路风尘。公子握你的手道：「他日得国，不忘此日。」"},{label:"留事献公",hint:"",check:{k:"biancai",dc:38},success:[{t:"money",v:60},{t:"fame",v:2}],fail:[{t:"fame",v:-4}],text:"你留在绛都，见朝中人人自危。"}]},{id:"song_xiang_hong",year:-638,month:11,title:"宋襄公泓水之败",where:{state:"song"},body:"宋襄公与楚人战于泓。楚人未济，司马请击之，公曰不可。既济而陈未成，又请击之，公曰不可。既陈而后击之，宋师大败，公伤股。",effects:[{t:"power",s:"song",v:-10},{t:"power",s:"chu",v:5}],choices:[{label:"谏公半渡而击",hint:"兵法",check:{k:"bingfa",dc:34},success:[{t:"skill",k:"bingfa",v:1},{t:"fame",v:4}],fail:[{t:"fame",v:-3}],text:"你言「兵者诡道」，襄公摇头：「寡人不能以诈取胜。」"},{label:"救护宋伤卒",hint:"重义",effects:[{t:"fame",v:6},{t:"health",v:-4}],text:"你扶襄公上车，血染其股。公叹道：「君子不重伤，不禽二毛。」"}]},{id:"qin_mu_youyu",year:-627,month:4,title:"秦晋殽之战",where:{state:"qin"},body:"秦穆公不听蹇叔之谏，使孟明视等袭郑。郑商人弦高遇之于滑，以牛十二犒师，且遽告于郑。秦师知郑有备，灭滑而还，归途为晋所邀于殽，秦师尽没。",effects:[{t:"war",a:"jin",b:"qin"},{t:"power",s:"qin",v:-10},{t:"power",s:"jin",v:6}],choices:[{label:"从弦高犒师",hint:"重义",effects:[{t:"fame",v:8},{t:"rel",id:"xian_gao",v:12}],text:"你随弦高驱牛十二头迎秦师，诈称郑伯之命。秦师驻足，郑国得以戒备。"},{label:"往殽山观战",hint:"兵法",check:{k:"bingfa",dc:38},success:[{t:"skill",k:"bingfa",v:1},{t:"merit",v:10}],fail:[{t:"health",v:-8}],text:"殽山二陵之间，秦师辎重尽弃。"}]},{id:"wu_ru_ying",year:-506,month:11,title:"吴入郢都",where:{state:"wu"},body:"吴王阖闾用伍子胥、孙武之谋，五战及郢。楚昭王出奔，吴人入郢，处其宫室。伍子胥掘楚平王墓，鞭尸三百。",effects:[{t:"war",a:"wu",b:"chu"},{t:"power",s:"wu",v:14},{t:"power",s:"chu",v:-14}],choices:[{label:"观孙武用兵",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:2},{t:"rel",id:"sun_wu",v:8}],fail:[{t:"fame",v:1}],text:"你见吴师五战五捷，迂回千里而不乱。孙武言：「兵之情主速。」"},{label:"随伍子胥入郢",hint:"慕强",effects:[{t:"fame",v:4},{t:"rel",id:"wu_zixu",v:10}],text:"伍子胥立于楚王宫前，鞭尸三百，声如裂帛。"}]},{id:"kongzi_xiang_lu",year:-500,month:6,title:"夹谷之会",where:{state:"lu"},body:"鲁定公与齐侯会于夹谷。孔子摄相事，以礼折齐。齐人使莱人以兵劫公，孔子历阶而进，以公退，曰：「士兵之！两君合好，而裔夷之俘以兵乱之，非齐君所以命诸侯也。」齐侯惭，归鲁之侵地。",effects:[{t:"power",s:"lu",v:6},{t:"power",s:"qi",v:-3}],choices:[{label:"从孔子观礼",hint:"学问",check:{k:"xuewen",dc:34},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:6},{t:"rel",id:"kong_zi",v:10}],fail:[{t:"fame",v:2}],text:"孔子历阶而上，言辞不疾不徐，齐侯竟不能答。"},{label:"护鲁君退避",hint:"武艺",check:{k:"jianshu",dc:32},success:[{t:"fame",v:4},{t:"money",v:30}],fail:[{t:"health",v:-6}],text:"莱兵持械而前，你以身遮鲁君，退至坛下。"}]},{id:"zhuan_zhu",year:-515,month:4,title:"专诸刺王僚",where:{state:"wu"},body:"公子光欲弑吴王僚，伍子胥进专诸。光具酒请王僚，僚陈兵自宫至光之家。专诸置匕首于炙鱼之中，进至王前，抽匕首刺僚，僚立死。专诸亦为僚之徒所杀。",effects:[{t:"power",s:"wu",v:6}],choices:[{label:"观鱼肠之刺",hint:"声名",effects:[{t:"fame",v:5},{t:"rel",id:"wu_zixu",v:6}],text:"专诸擘鱼，匕首出，王僚倒于席上。堂中大乱。"},{label:"劝阻公子光",hint:"重义",check:{k:"biancai",dc:40},success:[{t:"fame",v:8},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:-4}],text:"你言「弑君之名，千载不洗」，公子光拂袖：「孺子之言。」"}]},{id:"goujian_ji_xin",year:-494,month:3,title:"夫椒之败",where:{state:"yue"},body:"吴王夫差败越于夫椒，报檇李之仇。越王勾践以甲楯五千保于会稽，使大夫种行成于吴。吴王许之，勾践入吴为臣，执养马之役。",effects:[{t:"war",a:"wu",b:"yue"},{t:"power",s:"wu",v:10},{t:"power",s:"yue",v:-12}],choices:[{label:"随勾践入吴",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"wen_zhong",v:8},{t:"stamina",v:-10}],text:"你随越王入吴，见其执鞭立于马厩之外，面无愠色。"},{label:"说吴王灭越",hint:"慕强",check:{k:"quanmou",dc:38},success:[{t:"merit",v:12},{t:"rel",id:"wu_zixu",v:10}],fail:[{t:"fame",v:-3}],text:"你言「今不灭越，后必悔之」。伍子胥以为然，夫差不听。"}]},{id:"quwo_dai_yi",year:-679,month:9,title:"曲沃代翼",where:{state:"jin"},body:"曲沃武公伐晋侯缗，灭之，尽以其宝器赂周釐王。王命武公以一军为晋侯，曲沃自此代翼。小宗篡大宗，周礼之坏自此始。",effects:[{t:"power",s:"jin",v:8}],choices:[{label:"观曲沃之赂",hint:"权谋",check:{k:"quanmou",dc:34},success:[{t:"skill",k:"quanmou",v:1},{t:"money",v:40}],fail:[{t:"fame",v:-2}],text:"宝器满载入洛邑，天子受之，遂命曲沃为诸侯。"},{label:"叹礼之崩",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:3}],text:"你叹道：「陪臣执国命，自此始矣。」"}]},{id:"guan_zhong_xiang",year:-685,month:4,title:"管仲相齐",where:{state:"qi"},body:"齐桓公不计射钩之仇，用鲍叔牙之荐，相管仲。管仲作内政而寄军令，通货积财，设轻重九府，齐国大治。",effects:[{t:"power",s:"qi",v:10}],choices:[{label:"往齐观政",hint:"政略",check:{k:"xuewen",dc:33},success:[{t:"skill",k:"xuewen",v:1},{t:"rel",id:"guan_zhong",v:10},{t:"fame",v:4}],fail:[{t:"fame",v:1}],text:"你见临淄市列珠玑，四民分业而居。管仲言：「仓廪实而知礼节。」"},{label:"献通商之策",hint:"商贾",check:{k:"shanggu",dc:34},success:[{t:"money",v:80},{t:"rel",id:"guan_zhong",v:8}],fail:[{t:"fame",v:-2}],text:"你陈「轻重敛散」之术，管仲抚掌：「可与言利矣。」"}]},{id:"zhu_zhiwu_tui_qin",year:-630,month:9,title:"烛之武退秦师",where:{state:"zheng"},body:"晋秦围郑，郑伯使烛之武夜缒而出，见秦伯曰：「越国以鄙远，君知其难也。焉用亡郑以陪邻？邻之厚，君之薄也。」秦伯悦，与郑人盟，戍之而还。",effects:[{t:"power",s:"zheng",v:6},{t:"power",s:"qin",v:2},{t:"power",s:"jin",v:-4}],choices:[{label:"从烛之武夜出",hint:"说辞",check:{k:"biancai",dc:38},success:[{t:"skill",k:"biancai",v:2},{t:"fame",v:6},{t:"rel",id:"zhu_zhiwu",v:12}],fail:[{t:"health",v:-8},{t:"fame",v:2}],text:"缒城而下，夜见秦伯。一番利害陈说，秦师竟退。"},{label:"守城御敌",hint:"武艺",check:{k:"jianshu",dc:34},success:[{t:"merit",v:10},{t:"fame",v:3}],fail:[{t:"health",v:-10}],text:"秦晋之师围城三面，你守女墙七昼夜。"}]},{id:"wu_ju_shen_gong",year:-522,month:5,title:"伍子胥奔吴",where:{state:"wu"},body:"楚平王听费无极之谮，杀伍奢及其子伍尚。伍员出奔，过昭关，一夜白头。至吴，说吴王僚伐楚。",effects:[{t:"power",s:"wu",v:4},{t:"power",s:"chu",v:-3}],choices:[{label:"助其过昭关",hint:"重义",effects:[{t:"fame",v:8},{t:"rel",id:"wu_zixu",v:14},{t:"money",v:-30}],text:"你以舟渡其过江，伍员解剑相赠：「此剑值百金，聊以为谢。」"},{label:"闻其一夜白头",hint:"",effects:[{t:"skill",k:"quanmou",v:1}],text:"昭关之下，伍员须发尽白，守者竟不能识。"}]},{id:"sunzi_bingfa",year:-512,month:3,title:"孙武献兵法",where:{state:"wu"},body:"孙武以兵法见吴王阖闾，王曰：「可试以妇人乎？」于是出宫中美女百八十人。孙子三令五申，妇人皆大笑。孙子斩队长二人，妇人乃定。",effects:[{t:"power",s:"wu",v:6}],choices:[{label:"观孙武教战",hint:"兵法",check:{k:"bingfa",dc:36},success:[{t:"skill",k:"bingfa",v:2},{t:"rel",id:"sun_wu",v:10}],fail:[{t:"fame",v:1}],text:"鼓之左，妇人皆左；鼓之右，妇人皆右。孙子曰：「兵者，国之大事。」"},{label:"请录其书",hint:"学问",effects:[{t:"skill",k:"xuewen",v:1},{t:"money",v:-20},{t:"fame",v:3}],text:"十三篇在手，你读到「兵者诡道」一句，掩卷良久。"}]},{id:"ji_zha_guan_yue",year:-544,month:7,title:"季札观乐",where:{state:"wu"},body:"吴公子季札聘于鲁，请观周乐。使工为之歌《周南》《召南》，曰：「美哉！始基之矣。」歌《郑》，曰：「其细已甚，民弗堪也。」至《韶箾》，曰：「德至矣哉！观止矣。」",effects:[{t:"power",s:"wu",v:3},{t:"power",s:"lu",v:2}],choices:[{label:"从季札观乐",hint:"学问",check:{k:"xuewen",dc:34},success:[{t:"skill",k:"xuewen",v:2},{t:"fame",v:6}],fail:[{t:"skill",k:"xuewen",v:1}],text:"乐工歌《韶》，季札叹曰「观止」。你虽不能尽解，亦觉胸中豁然。"},{label:"问其聘问之礼",hint:"重义",effects:[{t:"skill",k:"biancai",v:1},{t:"fame",v:4}],text:"季札曰：「聘礼者，所以通两国之好也。」"}]},{id:"yan_ying_shi_chu",year:-546,month:10,title:"向戌弭兵",where:{state:"song"},body:"宋向戌合晋楚之成，会诸侯于宋。晋楚之从交相见，齐秦为敌。自此弭兵四十余年，列国得以休息。",effects:[{t:"power",s:"song",v:6},{t:"power",s:"jin",v:3},{t:"power",s:"chu",v:3}],choices:[{label:"会于宋以观礼",hint:"重义",effects:[{t:"fame",v:6},{t:"rel",id:"xiang_xu",v:10}],text:"诸侯会于宋，晋楚分伯，献血为盟。向戌之力也。"},{label:"为两国通款",hint:"说辞",check:{k:"biancai",dc:36},success:[{t:"skill",k:"biancai",v:1},{t:"fame",v:4}],fail:[{t:"fame",v:-2}],text:"你往来晋楚之间，传其辞令，两军竟不交兵。"}]},{id:"zi_chan_zhu_xing",year:-536,month:3,title:"子产铸刑书",where:{state:"zheng"},body:"郑子产铸刑书于鼎，以为国之常法。叔向使诒书曰：「民知有辟，则不忌于上，并有争心。」子产复曰：「吾以救世也。」",effects:[{t:"power",s:"zheng",v:6}],choices:[{label:"观刑书于市",hint:"学问",check:{k:"xuewen",dc:32},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:4},{t:"rel",id:"zi_chan",v:8}],fail:[{t:"fame",v:1}],text:"刑书列于鼎，民皆聚观。有人说：「此三代未有之事。」"},{label:"问子产治郑之术",hint:"政略",effects:[{t:"skill",k:"quanmou",v:1},{t:"fame",v:3}],text:"子产曰：「唯有德者能以宽服民，其次莫如猛。」"}]},{id:"yue_mie_wu",year:-473,month:11,title:"越灭吴",where:{state:"yue"},body:"越王勾践围吴三年，吴师溃。夫差使公孙雄肉袒膝行请成，勾践不许，曰：「昔天以越赐吴，吴不受；今天以吴赐越，孤敢不听？」夫差自刭。",effects:[{t:"peace",a:"wu",b:"yue"},{t:"power",s:"yue",v:10},{t:"power",s:"wu",v:-14},{t:"flag",k:"hegemon",v:"yue"}],choices:[{label:"往吊吴王",hint:"重义",effects:[{t:"fame",v:10},{t:"rel",id:"fan_li",v:8}],text:"你看着夫差以布蒙面自刭，说「吾无面目以见子胥也」。"},{label:"贺越王于姑苏台",hint:"声名",effects:[{t:"money",v:50},{t:"fame",v:6},{t:"rel",id:"gou_jian",v:8}],text:"姑苏台上，越王勾践受诸侯之贺，而范蠡已泛舟五湖。"}]}],Oa=[{id:"bandit",w:10,when:e=>e.player.money>60,title:"道遇劫匪",body:"你行至荒僻处，忽有数人持刃拦路，喝令留下财货。",choices:[{label:"拔剑相斗",hint:"以武艺退敌",check:{k:"jianshu",dc:40},success:[{t:"fame",v:3},{t:"money",v:40}],fail:[{t:"money",v:-60},{t:"health",v:-8}],text:"刀光一闪，匪徒见你不是易与之辈，弃刃而走，地上还落了些散钱。"},{label:"舍财免祸",hint:"破财",effects:[{t:"money",v:-50}],text:"你把钱袋丢过去，匪徒掂了掂，笑着让开一条路。"}]},{id:"sage",w:8,when:e=>e.time.year<-540,title:"途遇隐者",body:"林间有一老者，负薪而行，歌曰：「沧浪之水清兮，可以濯吾缨。」",choices:[{label:"上前请教",hint:"或有所得",check:{k:"xuewen",dc:38},success:[{t:"skill",k:"xuewen",v:1},{t:"fame",v:2}],fail:[{t:"fame",v:1}],text:"老者与你说了半日「无为」之理，你似懂非懂，却记了一辈子。"},{label:"致意而去",hint:"",effects:[],text:"你拱手作别，老者的歌声渐远。"}]},{id:"harvest",w:12,when:()=>!0,title:"岁丰",body:"今年风调雨顺，粟麦大熟。市上粮价应声而落。",effects:[{t:"goods",g:"su",v:-.18}]},{id:"famine",w:8,when:()=>!0,title:"饥荒",body:"某地大旱，赤地千里，流民载道。粟价腾贵，诸国闭关禁籴。",effects:[{t:"goods",g:"su",v:.28},{t:"goods",g:"ge",v:.1}]},{id:"war_rumor",w:10,when:()=>!0,title:"兵戈之讯",body:"道听途说，某国正聚兵于境上，市井之间人心惶惶。",effects:[{t:"goods",g:"tie",v:.16},{t:"goods",g:"ma",v:.14}]},{id:"plague",w:5,when:()=>!0,title:"疫病",body:"城中疫气流行，巷陌多闭户，医者奔走不暇。",effects:[{t:"health",v:-6},{t:"goods",g:"su",v:.12}]},{id:"summon",w:7,when:e=>e.player.fame>=25&&e.player.state,title:"国君相召",body:"有使者至，言国君闻君之名，欲一见。",choices:[{label:"应召入宫",hint:"或有封赏",effects:[{t:"merit",v:20},{t:"money",v:50},{t:"fame",v:2}],text:"国君问以国事，你应对得体，赐金五十。"},{label:"称病不往",hint:"清高之名",effects:[{t:"fame",v:2}],text:"你推说抱恙，使者怫然而去。"}]},{id:"scholar_lecture",w:7,when:()=>!0,title:"学宫讲席",body:"学宫之中，诸子论辩，听者盈庭。有人邀你也说几句。",choices:[{label:"登席陈说",hint:"学问或辩才",check:{k:"xuewen",dc:44},success:[{t:"fame",v:5},{t:"skill",k:"biancai",v:1}],fail:[{t:"fame",v:1},{t:"stamina",v:-4}],text:"你引经据典，条分缕析，座中数人点头称善。"},{label:"默坐听讲",hint:"",effects:[{t:"skill",k:"xuewen",v:1}],text:"你听了一整日，回去的路上还在想那句「君子和而不同」。"}]},{id:"merchant_offer",w:8,when:e=>e.player.money>150,title:"行商之邀",body:"一位行商愿以低价赊你一批货，言明三月之内还本即可。",choices:[{label:"应下这笔生意",hint:"风险与利",check:{k:"shanggu",dc:38},success:[{t:"money",v:120},{t:"skill",k:"shanggu",v:1}],fail:[{t:"money",v:-80}],text:"你转手将货卖往邻邑，赚了一笔差价。"},{label:"婉言谢绝",hint:"",effects:[],text:"你笑着摇头，说「买卖不在急上」。"}]},{id:"duel_challenge",w:6,when:e=>e.player.fame>15,title:"剑客挑战",body:"一名游侠拦路，自称闻你之名，欲以剑会友。",choices:[{label:"应战",hint:"决斗",effects:[{t:"duel",who:"wanderer"}],text:"围观者让出一片空地，剑已出鞘。"},{label:"抱拳谢过",hint:"",effects:[{t:"fame",v:-1}],text:"你抱拳道「不敢」，那剑客冷哼一声走了。"}]},{id:"mentor",w:6,when:e=>Object.values(e.npc).some(t=>t.city===e.player.cityId&&t.alive&&t.role==="scholar"),title:"贤者讲学",body:"城中有贤者开讲，士人毕集。你若往听，或可请益。",choices:[{label:"前往受教",hint:"需束脩",effects:[{t:"money",v:-20},{t:"skillxp",k:"xuewen",v:12}],text:"你奉上束脩，贤者为你讲了一卷书。"},{label:"不往",hint:"",effects:[],text:"学在人心，不必在讲堂。"}]},{id:"ferry",w:8,title:"津渡无舟 ，逼邻国输粮，以战养战。",reply:"国君皱眉：「以战养战，胜了还好，败了呢？」"},{tag:"yi",level:"evade",text:"加赋于民，令百姓节衣缩食以奉军。",reply:"国君叹道：「军粮有了，民心却要散了。」"}]},{id:"scholars",q:"士人非议朝政，清议汹汹，君将何以处之？",options:[{tag:"ming",level:"hit",text:"开言路、纳谏诤，择其善者而行，清议自平。",reply:"国君笑道：「让他们说，说得对的寡人照办。」"},{tag:"yi",level:"reason",text:"兴学宫、养士人，以教化导之。",reply:"国君点头：「教化是根本，只是见效慢些。」"},{tag:"shi",level:"evade",text:"禁止聚议，为首者治罪。",reply:"国君冷声道：「堵得住嘴，堵得住人心吗？」"}]},{id:"flood",q:"秋汛将至，河堤年久失修，君将何以处之？",options:[{tag:"li",level:"hit",text:"分段修堤，以工代赈，既固河防又安流民。",reply:"国君目光一亮：「以工代赈，一举两得。」"},{tag:"yi",level:"reason",text:"迁低地之民于高处，先保人命，再议修堤。",reply:"国君叹道：「迁民也是难事，但总比死人强。」"},{tag:"ming",level:"evade",text:"祭河祈安，上天自会护佑。",reply:"国君反问：「若上天不佑，谁来担这个责？」"}]},{id:"talent",q:"朝中乏才，政事壅滞，君将何以取士？",options:[{tag:"yi",level:"hit",text:"举寒门、试以事，不问出身，唯才是举。",reply:"国君抚掌：「英雄不问出处，正合寡人之意。」"},{tag:"ming",level:"reason",text:"依乡里清议与旧制荐举，稳重为上。",reply:"国君沉吟：「旧制稳妥，却怕漏了真才。」"},{tag:"li",level:"evade",text:"任用亲族，至少忠心可保。",reply:"国君冷笑：「忠心而无才，只会误事。」"}]},{id:"diplomacy",q:"诸侯会盟在即，君欲争一时之先，当以何策？",options:[{tag:"shi",level:"hit",text:"先联近邻、陈兵于会，以势压诸侯，再定盟约。",reply:"国君点头：「有势可恃，盟辞才有人听。」"},{tag:"yi",level:"reason",text:"以信义相召，让诸侯自愿推我为长。",reply:"国君叹道：「信义虽好，会盟场上还是看实力。」"},{tag:"ming",level:"evade",text:"多送礼物，买通各国大夫。",reply:"国君皱眉：「买来的盟，明日就能被别人买走。」"}]},{id:"oath",q:"诸侯背弃旧盟，边邑已起争端，君将何以处之？",options:[{tag:"ming",level:"hit",text:"会诸侯于旧盟之地，重订盟书，使背盟者无所遁形。",reply:"国君点头：「先把道理摆在诸侯面前。」"},{tag:"yi",level:"reason",text:"先遣使责以大义，彼若知愧，兵戈可免。",reply:"国君叹道：「义责要有兵威作后盾才管用。」"},{tag:"li",level:"evade",text:"许以边市之利，换他退兵。",reply:"国君反问：「今日许利，明日他再进一步呢？」"}]},{id:"plague",q:"灾后疫气流行，医者不足，君将何以处之？",options:[{tag:"yi",level:"hit",text:"征召良医、设隔离之所，官给汤药，先救疫区。",reply:"国君颔首：「先救人，再谈其余。」"},{tag:"li",level:"reason",text:"拨款购药，命各乡上报病户。",reply:"国君道：「钱要花，可谁来管这些药？」"},{tag:"shi",level:"evade",text:"封锁疫区，禁止出入。",reply:"国君皱眉：「封得住人，封不住疫气。」"}]},{id:"saltiron",q:"盐铁之利尽归豪商，府库日虚，君将何以处之？",options:[{tag:"li",level:"hit",text:"官营盐铁，设官榷税，余利仍许商人经营。",reply:"国君目光一亮：「官商分利，倒不至于竭泽。」"},{tag:"shi",level:"reason",text:"派兵查封私盐，杀一儆百。",reply:"国君沉吟：「查得了一时，查不了天下。」"},{tag:"yi",level:"evade",text:"与民争利非仁政，不如听其自然。",reply:"国君反问：「府库空了，仁政拿什么行？」"}]},{id:"luxury",q:"宗室竞相奢靡，用度逾制，君将何以处之？",options:[{tag:"ming",level:"hit",text:"申明礼制，按爵定用，逾制者夺其封邑。",reply:"国君点头：「先立规矩，再谈罚。」"},{tag:"yi",level:"reason",text:"以俭德示范，劝其自省。",reply:"国君苦笑：「寡人节俭，他们照旧。」"},{tag:"li",level:"evade",text:"削减宗室俸禄，充作军费。",reply:"国君摇头：「削俸只会逼他们另寻财路。」"}]},{id:"warlord",q:"边将拥兵自重，诏令不行，君将何以处之？",options:[{tag:"shi",level:"hit",text:"调其部曲、换其防区，以粮饷节制其兵。",reply:"国君低声道：「不动刀兵而削其权，最好。」"},{tag:"ming",level:"reason",text:"召其入朝，加官进爵，留在身边。",reply:"国君沉吟：「他若不肯来呢？」"},{tag:"yi",level:"evade",text:"以忠义相责，令其自请解兵。",reply:"国君反问：「他若有忠义，就不会拥兵了。」"}]},{id:"waterfight",q:"两邑争水，械斗将起，君将何以处之？",options:[{tag:"ming",level:"hit",text:"查旧渠碑与纳赋册，按田亩定水，立石为界。",reply:"国君点头：「有碑有册，才好断。」"},{tag:"li",level:"reason",text:"令两邑共修新渠，按出工分水。",reply:"国君道：「修渠是好事，可远水难救近火。」"},{tag:"yi",level:"evade",text:"令乡老自行调解，官府不必插手。",reply:"国君叹道：「调得成，就不会打到县衙来了。」"}]},{id:"clan_talent",q:"世族把持朝位，寒士无由进身，君将何以处之？",options:[{tag:"yi",level:"hit",text:"设策问、试以事，寒士与世族同场比试。",reply:"国君目光一亮：「同场比试，世族也无话可说。」"},{tag:"shi",level:"reason",text:"另立新军、新府，绕开世族旧衙门。",reply:"国君沉吟：「另起炉灶，也需钱粮。」"},{tag:"ming",level:"evade",text:"依乡里清议荐举，自然会有贤才。",reply:"国君反问：「清议还不是世族说了算？」"}]},{id:"punishment",q:"刑罚过滥，狱中多冤，君将何以处之？",options:[{tag:"ming",level:"hit",text:"亲录囚徒，疑罪从轻，择贤者为司寇。",reply:"国君颔首：「亲录囚徒，至少能少几桩冤案。」"},{tag:"yi",level:"reason",text:"修订刑律，明定轻重，使民知所避就。",reply:"国君道：「律要修，可眼下牢里已经满了。」"},{tag:"shi",level:"evade",text:"严刑峻法，使奸人不敢犯。",reply:"国君反问：「严到百姓不敢申冤，也算治世？」"}]},{id:"granary",q:"官仓账实不符，仓吏称损耗，君将何以处之？",options:[{tag:"li",level:"hit",text:"突击盘仓、对账，亏空者连坐赔偿。",reply:"国君点头：「对账连坐，仓吏才不敢伸手。」"},{tag:"ming",level:"reason",text:"遣御史巡查，公开账目于市。",reply:"国君沉吟：「公开是好事，御史肯不肯得罪人？」"},{tag:"yi",level:"evade",text:"申饬仓吏，令其自行补足。",reply:"国君冷笑：「自己补？那还是从仓里拿。」"}]},{id:"monopoly",q:"大商垄断市货，小贩无以为生，君将何以处之？",options:[{tag:"li",level:"hit",text:"设官市平价、限大户囤积，小贩可入市。",reply:"国君点头：「给小人一条活路，市面才稳。」"},{tag:"shi",level:"reason",text:"派兵查抄囤货，罚其重金。",reply:"国君皱眉：「抄了这家，别家还会囤。」"},{tag:"ming",level:"evade",text:"表彰义商，劝其让利。",reply:"国君反问：「义商有几个？」"}]},{id:"military_award",q:"军功赏罚不明，将士离心，君将何以处之？",options:[{tag:"ming",level:"hit",text:"当众核验军功簿，按功行赏，虚报者治罪。",reply:"国君颔首：「公开核功，才服众。」"},{tag:"yi",level:"reason",text:"厚待阵亡者家属，以慰军心。",reply:"国君叹道：「抚恤要做，可活着的功劳也不能含糊。」"},{tag:"shi",level:"evade",text:"加重军法，退缩者斩。",reply:"国君反问：「只罚不赏，谁还肯向前？」"}]},{id:"heir",q:"太子失教，近臣阿谀，君将何以处之？",options:[{tag:"yi",level:"hit",text:"择端方之士为傅，令太子习礼知民。",reply:"国君点头：「师傅选对了，比什么都强。」"},{tag:"ming",level:"reason",text:"令太子参与朝会，使知政事。",reply:"国君沉吟：「旁听容易，肯不肯听进去？」"},{tag:"li",level:"evade",text:"多给俸邑，使其安享富贵。",reply:"国君反问：「安享富贵，就能当好国君吗？」"}]},{id:"famine_neighbor",q:"邻国大饥，遣使求籴，君将何以处之？",options:[{tag:"yi",level:"hit",text:"平价粜粮，并附盟书，使邻国记此恩义。",reply:"国君颔首：「既救人，也结一份情义。」"},{tag:"li",level:"reason",text:"按市价加价出售，府库可获厚利。",reply:"国君叹道：「利是得了，邻国却要记恨。」"},{tag:"shi",level:"evade",text:"闭关禁籴，先保本国。",reply:"国君反问：「邻国饿死的人，就不会往我们这边跑？」"}]},{id:"tribute_king",q:"天子遣使索贡，礼数甚重，君将何以处之？",options:[{tag:"ming",level:"hit",text:"依礼朝贡，但贡物从简，附陈情表说明民力。",reply:"国君点头：「礼数到了，也不至于掏空府库。」"},{tag:"yi",level:"reason",text:"天子虽微，名义尚在，不可失礼。",reply:"国君沉吟：「礼要守，可使者未必体谅。」"},{tag:"shi",level:"evade",text:"托辞不贡，看天子能奈我何。",reply:"国君皱眉：「今日不贡，明日诸侯就会拿这做文章。」"}]}],La=[{id:"fu_grain",follow:!0,q:"君复问：粮价若再涨，百姓买不起，又当如何？",options:[{tag:"li",level:"hit",text:"官仓限量平粜，同时严查囤积，双管齐下。",reply:"国君点头：「有粮可买，价才压得住。」"},{tag:"yi",level:"reason",text:"先赈最贫者，余者听其自便。",reply:"国君叹道：「赈得了一时，赈不了一世。」"},{tag:"shi",level:"evade",text:"派兵封市，禁止涨价。",reply:"国君反问：「封了市，粮从何处来？」"}]},{id:"fu_army",follow:!0,q:"君复问：军粮只够一月，援军却要三月才到，如何撑住？",options:[{tag:"shi",level:"hit",text:"收缩防线、集中兵力，先守要害，再图反击。",reply:"国君点头：「舍小保大，才有得守。」"},{tag:"li",level:"reason",text:"就地征粮，许以战后减免赋税。",reply:"国君沉吟：「就地征粮，怕要激起民怨。」"},{tag:"yi",level:"evade",text:"令将士以忠义自励，死守待援。",reply:"国君反问：「空言忠义，能当军粮吗？」"}]},{id:"fu_clans",follow:!0,q:"君复问：若卿族先发制人，君当如何自处？",options:[{tag:"shi",level:"hit",text:"先调外兵入卫，再以君命分其党羽。",reply:"国君低声道：「先保君位，再论其他。」"},{tag:"yi",level:"reason",text:"召诸卿共誓，以宗庙之盟约束彼此。",reply:"国君叹道：「盟誓对无信之人，没有多少用。」"},{tag:"ming",level:"evade",text:"下罪己诏，平息其怨。",reply:"国君摇头：「罪己可以，退让却不行。」"}]},{id:"fu_justice",follow:!0,q:"君复问：若翻案牵出先君旧臣，君敢动吗？",options:[{tag:"ming",level:"hit",text:"只论案情，不问身份，公开审理。",reply:"国君目光一凝：「公开审，才没人能暗中插手。」"},{tag:"yi",level:"reason",text:"为其保留体面，令其自请致仕。",reply:"国君沉吟：「留体面可以，冤案还是要平。」"},{tag:"shi",level:"evade",text:"到此为止，不再深究。",reply:"国君反问：「冤者不服，这案子算结了吗？」"}]},{id:"fu_oath",follow:!0,q:"君复问：若诸侯会盟时公然辱我，君将何以应之？",options:[{tag:"ming",level:"hit",text:"当场援引盟辞，令史官记其失礼，再议后图。",reply:"国君点头：「先占住礼字，他便理亏。」"},{tag:"yi",level:"reason",text:"以大局为重，暂忍一时。",reply:"国君叹道：「忍可以，但不能白忍。」"},{tag:"li",level:"evade",text:"送他厚礼，求他改口。",reply:"国君冷声道：「送得越多，他越轻我。」"}]},{id:"fu_river",follow:!0,q:"君复问：修堤之费，府库只能出一半，余数何来？",options:[{tag:"li",level:"hit",text:"以工代赈、富户摊派，再向邻县借料。",reply:"国君点头：「三处凑一凑，或可成事。」"},{tag:"yi",level:"reason",text:"劝富户捐输，许其立碑记名。",reply:"国君沉吟：「捐输要有名分，他们才肯。」"},{tag:"ming",level:"evade",text:"先动工再说，钱不够再想办法。",reply:"国君反问：「动工到一半没钱，堤怎么办？」"}]},{id:"fu_talent",follow:!0,q:"君复问：所举之人若行事乖张，君当如何？",options:[{tag:"yi",level:"hit",text:"举者连坐，用人不察者同罚。",reply:"国君点头：「有连坐，举荐才不敢乱来。」"},{tag:"ming",level:"reason",text:"先试以小任，观其行事再定。",reply:"国君沉吟：「试任可以，只怕耽误了正事。」"},{tag:"li",level:"evade",text:"既然举了，便护到底。",reply:"国君反问：「护他，谁护国事？」"}]},{id:"fu_meeting",follow:!0,q:"君复问：会盟之上，晋楚争长，君欲站在哪一边？",options:[{tag:"shi",level:"hit",text:"不急于站队，先联小国自成一势，待两强相争再定。",reply:"国君目光一亮：「先有自重之势，才谈得上取舍。」"},{tag:"yi",level:"reason",text:"依周礼尊卑定席次，不偏不倚。",reply:"国君叹道：「礼若能定，就不会争了。」"},{tag:"ming",level:"evade",text:"谁给的好处多，就站谁那边。",reply:"国君冷笑：「今日贪利，明日两边都轻你。」"}]},{id:"fu_trade",follow:!0,q:"君复问：若商旅来时课以轻税，府库入不敷出，君当如何？",options:[{tag:"li",level:"hit",text:"先养商三年，再渐增其税；商既成群，税自重。",reply:"国君点头：「先养后取，才取得到。」"},{tag:"yi",level:"reason",text:"省去冗费，胜于加税。",reply:"国君沉吟：「省费也是难事，冗员都是人情。」"},{tag:"shi",level:"evade",text:"商既愿来，多取一些无妨。",reply:"国君反问：「多取一些，他们还来第二回吗？」"}]},{id:"fu_scholars",follow:!0,q:"君复问：士人既议朝政，其言又多迂阔，君尚纳之乎？",options:[{tag:"ming",level:"hit",text:"纳其言之可行者，迂阔者不罪，自无怨望。",reply:"国君笑道：「只取可用的，不必与他争辩。」"},{tag:"yi",level:"reason",text:"设学宫养其才，使有为而不为乱。",reply:"       每月初按功勋升一级，并按官阶领取月俸。</p>
      <p><b>爵位</b>是另一套五等爵：男 → 子 → 伯 → 侯 → 公，由周天子册命。官阶至卿、执政且功勋与名声达标后，
      可往洛邑领受「<b>册命之试</b>」：每级爵位有三道专属试炼（围捕/折冲/治邑/军略/定礼），
      完成后方可请封。请封按试炼评价计算成算，未准则名声小损、贽礼退半，并另命新试；
      累计五次未准后，第六次必得册命。受封后另有食邑月入，并计入结局评价。列国国君亦各有其爵：宋公、齐侯、郑伯、楚子、许男等。</p>
      <p style="color:#6d6052;font-size:13px">按史实，五等爵本为诸侯之封，卿大夫多以采邑为食；本作把「周室衰微、以功册命」作为演绎，
      让玩家也能由男爵累进至公爵。官阶（士→执政）则对应卿、大夫、士的官职体系。</p>

      <div class="section-title">操作</div>
      <p>顶栏切换舆图、城中、人物、差事、交游、名鉴、存档。舆图上点击城邑可见路程与国势，再点「启程前往」。
      修习时可按 <kbd>空格</kbd> 代替「止」，<kbd>Esc</kbd> 关闭弹窗。存档可导出为文本备份。</p>
