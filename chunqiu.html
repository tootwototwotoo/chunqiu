<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春秋·列国志</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%239c2b26'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f6e8c9' font-family='KaiTi,serif'%3E%E6%98%A5%3C/text%3E%3C/svg%3E">
<style>
/* ============ 春秋·列国志 —— 水墨样式 ============ */
:root{
  --paper:#efe3c8;
  --paper-2:#e6d7b6;
  --paper-3:#dcc9a2;
  --ink:#1f1b17;
  --ink-2:#42392f;
  --ink-3:#6d6052;
  --seal:#9c2b26;
  --seal-2:#b8443a;
  --gold:#a67c34;
  --jade:#4d6f56;
  --azure:#3c5e78;
  --line:#b9a37e;
  --shadow:rgba(40,28,16,.28);
  --serif:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:var(--serif);color:var(--ink);
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.5), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(160,130,80,.18), transparent 50%),
    repeating-linear-gradient(32deg, rgba(120,95,60,.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-58deg, rgba(120,95,60,.03) 0 2px, transparent 2px 6px),
    linear-gradient(150deg,#f4ead4,#e7d8b8 55%,#e2cfa9);
  overflow:hidden;
}
#app{
  display:grid;height:100vh;
  grid-template-columns:1fr 268px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"hud hud" "screen log";
}
button{font-family:var(--serif);cursor:pointer;}
::selection{background:rgba(156,43,38,.22);}

/* ---------- 顶栏 ---------- */
#hud{
  grid-area:hud;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:8px 16px;border-bottom:2px solid var(--line);
  background:linear-gradient(180deg,rgba(246,238,220,.96),rgba(233,219,190,.92));
  box-shadow:0 3px 14px rgba(90,70,40,.14);position:relative;z-index:5;
}
#hud:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:rgba(120,95,60,.25);}
.hud-brand{display:flex;align-items:center;gap:8px;}
.brand-seal{
  width:34px;height:34px;display:grid;place-items:center;border-radius:3px;
  background:linear-gradient(160deg,var(--seal),#7d1f1c);color:#f6e8c9;
  font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,225,190,.28),0 2px 6px var(--shadow);
}
.brand-text{font-size:19px;letter-spacing:4px;color:var(--ink);}
.hud-player{display:flex;align-items:baseline;gap:8px;padding-left:6px;border-left:1px solid var(--line);padding-right:4px;}
.hud-name{font-size:17px;letter-spacing:2px;}
.hud-prof{font-size:12px;color:var(--seal);border:1px solid rgba(156,43,38,.4);padding:1px 6px;border-radius:2px;}
.hud-rank{font-size:12px;color:var(--jade);}
.hud-stats{display:flex;gap:12px;margin-left:auto;}
.hud-stats .stat{display:flex;align-items:center;gap:4px;font-size:14px;}
.hud-stats .stat i{font-style:normal;font-size:11px;color:#f3e7cc;background:var(--ink-3);border-radius:2px;padding:1px 4px;}
.hud-stats .stat b{font-weight:600;letter-spacing:.5px;}
.hud-time{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 10px;border:1px solid var(--line);border-radius:2px;background:rgba(255,250,235,.5);}
.hud-time .season{color:var(--seal);font-size:12px;}
.hud-nav{display:flex;gap:4px;flex-wrap:wrap;}
.hud-nav button{
  border:1px solid transparent;background:transparent;padding:5px 10px;font-size:14px;color:var(--ink-2);
  border-radius:2px;letter-spacing:2px;transition:.16s;
}
.hud-nav button:hover{background:rgba(166,124,52,.14);border-color:rgba(166,124,52,.35);}
.hud-nav button.active{background:var(--ink);color:#f3e6cb;border-color:var(--ink);box-shadow:0 2px 8px rgba(30,20,10,.28);}

/* ---------- 主区域 ---------- */
.screen{grid-area:screen;overflow:auto;padding:18px 22px 32px;position:relative;}
.screen::-webkit-scrollbar,aside::-webkit-scrollbar{width:9px;}
.screen::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:rgba(120,95,60,.35);border-radius:5px;}

/* 通用面板 */
.panel{
  background:linear-gradient(175deg,rgba(251,245,229,.92),rgba(240,229,203,.88));
  border:1px solid var(--line);box-shadow:0 4px 18px rgba(90,70,40,.12);
  padding:16px 18px;position:relative;
}
.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--line);}
.panel:before{left:3px;top:3px;border-right:0;border-bottom:0;}
.panel:after{right:3px;bottom:3px;border-left:0;border-top:0;}
.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:4px;font-weight:500;display:flex;align-items:center;gap:10px;}
.panel h2 .sub{font-size:12px;letter-spacing:1px;color:var(--ink-3);font-weight:400;}
.panel .desc{color:var(--ink-3);font-size:13px;line-height:1.75;margin:6px 0 14px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0;}

/* ---------- 舆图 ---------- */
.map-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;height:100%;min-height:0;}
.map-panel{padding:10px;display:flex;flex-direction:column;min-height:0;}
.map-svg-box{flex:1;min-height:0;position:relative;border:1px solid rgba(120,95,60,.25);background:
  radial-gradient(circle at 60% 40%,rgba(255,252,240,.55),transparent 60%),
  linear-gradient(160deg,#f2e8d0,#e4d4b0);overflow:hidden;}
#map-svg{width:100%;height:100%;display:block;position:relative;z-index:2;}
#map-territory{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.9;}
.map-city{cursor:pointer;}
.map-city circle.hit{fill:transparent;}
.map-city .dot{transition:.18s;}
.map-city:hover .dot{r:9;}
.map-city text{font-family:var(--serif);font-size:15px;fill:#33291f;paint-order:stroke;stroke:rgba(246,238,220,.85);stroke-width:3.5px;pointer-events:none;letter-spacing:1px;}
.map-city .star{fill:var(--seal);}
.here-ring,.here-ring2{pointer-events:none;}
@media (prefers-reduced-motion: reduce){
  .here-ring animate,.here-ring2 animate{display:none;}
}
.map-road{stroke:#b39d78;stroke-width:1.6;stroke-dasharray:5 4;opacity:.75;}
.map-road.sea{stroke:var(--azure);stroke-dasharray:2 6;}
.map-river{fill:none;stroke:#7d97a6;stroke-width:6;opacity:.55;stroke-linecap:round;}
.map-river.thin{stroke-width:3;opacity:.4;}
.map-state-label{font-family:var(--serif);font-size:26px;fill:rgba(80,60,40,.22);letter-spacing:8px;pointer-events:none;}
#player-token{transition:transform .8s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding:8px 4px 0;}

/* ---- 地图标记：差事旗与商号 ---- */
.map-quest-flag{color:#9c2b26;pointer-events:none;}
.map-quest-flag.urgent{color:#d4553f;}
.map-quest-flag.urgent polygon{stroke:#f7efdc;stroke-width:.8;}
.map-shop-mark{color:#a67c34;pointer-events:none;}
.map-shop-mark.permit{color:#a67c34;}
.map-shop-mark.shop2{color:#8d6a2c;}
.map-shop-mark.shop3{color:#6f5320;}
.map-legend .lg-flag{color:#9c2b26;}
.map-legend .lg-shop{color:#a67c34;}
.city-mark-rows{margin-top:6px;}

/* ---- 标记开关下拉 ---- */
.map-panel{position:relative;}
.map-mark-bar{position:absolute;top:8px;right:10px;z-index:5;}
.map-haul{color:#a67c34;pointer-events:none;}
.map-event-ring{color:#8d6a2c;pointer-events:none;}
.map-war-ring{color:#8f2f22;pointer-events:none;}
.map-legend .lg-war{color:#8f2f22;}
.map-legend .lg-event{color:#8d6a2c;}
@media (prefers-reduced-motion: reduce){
  .map-event-ring animate{display:none;}
  .map-event-ring circle{opacity:.75;}
}
.map-legend .lg-haul{color:#a67c34;}
@media (prefers-reduced-motion: reduce){
  .map-haul animate{display:none;}
  .map-haul line{stroke-dasharray:none;}
}
.map-mark-menu{
  position:absolute;right:0;top:calc(100% + 4px);min-width:150px;
  background:#faf5e9;border:1px solid rgba(120,95,60,.35);border-radius:6px;
  box-shadow:0 6px 18px rgba(60,45,30,.18);padding:6px;
}
.map-mark-menu[hidden]{display:none;}
.map-mark-title{font-size:11.5px;color:var(--ink-3);padding:2px 6px 6px;letter-spacing:1px;}
.map-mark-item{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:0;cursor:pointer;padding:5px 6px;border-radius:4px;
  font-family:inherit;font-size:13px;color:var(--ink-1);text-align:left;
}
.map-mark-item:hover{background:rgba(166,124,52,.12);}
.map-mark-item .mk-box{
  width:15px;height:15px;flex:0 0 15px;display:grid;place-items:center;
  border:1px solid rgba(120,95,60,.5);border-radius:3px;font-size:11px;line-height:1;
  color:#4d6f56;background:#fffdf7;
}

@media (prefers-reduced-motion: reduce){
  .map-quest-flag.urgent animateTransform{display:none;}
  .map-quest-flag.urgent polygon{stroke-width:1.4;}
}
.map-legend span{display:flex;align-items:center;gap:5px;}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

.map-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px;}
.city-card .city-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.city-card h3{margin:0;font-size:20px;letter-spacing:3px;}
.city-card .state-tag{font-size:12px;padding:1px 7px;border-radius:2px;color:#f6ecd6;}
.city-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 0;font-size:13px;color:var(--ink-2);}
.city-meta b{font-weight:600;color:var(--ink);}
.route-line{font-size:13px;line-height:1.7;color:var(--ink-2);border-top:1px dashed rgba(120,95,60,.3);padding-top:8px;}
.route-line em{color:var(--seal);font-style:normal;}

/* ---------- 按钮 ---------- */
.btn{
  font-family:var(--serif);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,251,240,.95),rgba(238,227,203,.9));
  color:var(--ink);padding:8px 14px;font-size:14px;letter-spacing:1.5px;border-radius:2px;transition:.15s;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 6px rgba(90,70,40,.12);
}
.btn:hover{border-color:var(--seal);color:var(--seal);transform:translateY(-1px);box-shadow:0 4px 12px rgba(90,70,40,.18);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(180deg,#a83a33,var(--seal));color:#f8eed7;border-color:#7d1f1c;text-shadow:0 1px 0 rgba(0,0,0,.25);}
.btn.primary:hover{color:#fff;filter:brightness(1.07);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.sm{padding:4px 10px;font-size:12.5px;letter-spacing:.5px;}
.btn.block{display:block;width:100%;text-align:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- 城中 ---------- */
.city-hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:14px 18px;border:1px solid var(--line);margin-bottom:14px;
  background:
    radial-gradient(circle at 88% 10%,rgba(166,124,52,.16),transparent 55%),
    linear-gradient(170deg,rgba(252,246,231,.94),rgba(236,224,198,.9));
  box-shadow:0 4px 18px rgba(90,70,40,.12);
}
.city-hero h1{margin:0;font-size:30px;letter-spacing:6px;font-weight:500;}
.city-hero .hero-sub{color:var(--ink-3);font-size:13px;margin-top:6px;line-height:1.7;max-width:640px;}
.city-hero .hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.tag{font-size:11.5px;border:1px solid rgba(77,111,86,.45);color:var(--jade);padding:1px 7px;border-radius:2px;letter-spacing:1px;}
.tag.war{border-color:rgba(156,43,38,.45);color:var(--seal);}
.tag.gray{border-color:rgba(109,96,82,.4);color:var(--ink-3);}

.cols{display:grid;grid-template-columns:1.25fr .95fr;gap:14px;align-items:start;}
@media (max-width:1080px){.cols{grid-template-columns:1fr;}}
.section-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;letter-spacing:3px;color:var(--ink-2);}
.section-title:before{content:"";width:4px;height:14px;background:var(--seal);}
.section-title .hint{font-size:11.5px;color:var(--ink-3);letter-spacing:0;}

.action-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;}
.action{
  text-align:left;border:1px solid var(--line);background:rgba(255,251,240,.72);padding:11px 13px;border-radius:2px;
  transition:.16s;position:relative;overflow:hidden;
}
.action:hover{background:#fffaf0;border-color:var(--gold);box-shadow:0 4px 14px rgba(90,70,40,.16);transform:translateY(-1px);}
.action .a-name{font-size:15px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.action .a-desc{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.6;}
.action .a-cost{position:absolute;right:10px;top:10px;font-size:11px;color:var(--seal);}
.action:disabled{opacity:.45;}

.npc-list{display:flex;flex-direction:column;gap:8px;}
.npc-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid rgba(185,163,126,.65);
  background:rgba(255,250,238,.6);transition:.15s;cursor:pointer;
}
.npc-row:hover{background:#fffaf0;border-color:var(--gold);}
.avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:2px;display:grid;place-items:center;
  font-size:17px;color:#f7edd8;background:linear-gradient(160deg,var(--ink-3),var(--ink-2));
  box-shadow:inset 0 0 0 1px rgba(255,235,200,.25);
}
.npc-row .n-main{flex:1;min-width:0;}
.npc-row .n-name{font-size:15px;letter-spacing:1px;}
.npc-row .n-title{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.npc-row .n-rel{font-size:11.5px;color:var(--seal);white-space:nowrap;}

/* 数值条 */
.bar{height:7px;background:rgba(120,95,60,.18);border-radius:4px;overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#c9a45b);border-radius:4px;transition:width .4s;}
.bar.red>i{background:linear-gradient(90deg,var(--seal),#c4695f);}
.bar.green>i{background:linear-gradient(90deg,var(--jade),#7fa387);}
.bar.blue>i{background:linear-gradient(90deg,var(--azure),#7d9db8);}

/* 人物面板 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.stat-line{font-size:13px;}
.stat-line .sl-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.stat-line .sl-top b{font-weight:600;}
.stat-line .sl-top span{color:var(--ink-3);font-size:11.5px;}
.skill-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.skill-table td{padding:6px 4px;border-bottom:1px dashed rgba(120,95,60,.22);}
.skill-table td.lv{text-align:center;width:64px;color:var(--seal);letter-spacing:1px;}
.skill-table td.act{text-align:right;width:92px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;}
.kv dt{color:var(--ink-3);}
.kv dd{margin:0;}

/* 差事 */
.quest{border:1px solid rgba(185,163,126,.7);background:rgba(255,251,241,.66);padding:12px 14px;margin-bottom:10px;position:relative;}
.quest .q-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.quest h4{margin:0;font-size:15.5px;letter-spacing:1.5px;font-weight:600;}
.quest .q-from{font-size:11.5px;color:var(--ink-3);}
.quest .q-desc{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:6px 0;}
.quest .q-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);}
.quest .q-meta b{color:var(--seal);font-weight:600;}
.quest.done{opacity:.55;}
.quest.urgent{border-color:rgba(156,43,38,.55);box-shadow:0 0 0 1px rgba(156,43,38,.12) inset;}
.empty{color:var(--ink-3);font-size:13px;padding:18px;text-align:center;border:1px dashed rgba(120,95,60,.35);}

/* 名鉴 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.npc-card{
  border:1px solid var(--line);background:linear-gradient(170deg,rgba(255,250,238,.92),rgba(238,226,200,.9));
  padding:12px;text-align:center;position:relative;transition:.16s;cursor:pointer;
}
.npc-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(90,70,40,.2);border-color:var(--gold);}
.npc-card .avatar{width:56px;height:56px;font-size:24px;margin:0 auto 8px;}
.npc-card .c-name{font-size:15px;letter-spacing:1px;}
.npc-card .c-title{font-size:11px;color:var(--ink-3);margin-top:3px;min-height:15px;}
.npc-card .c-state{position:absolute;left:6px;top:6px;font-size:10px;color:#fff;padding:0 4px;border-radius:2px;}
.npc-card.locked{filter:grayscale(1);opacity:.45;}
.npc-card.locked .avatar{background:#8d8478;}

/* 交游 */
.rel-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px dashed rgba(120,95,60,.25);}
.rel-row .rel-mid{flex:1;min-width:0;}
.rel-row .rel-name{font-size:14.5px;display:flex;align-items:center;gap:8px;}
.rel-row .rel-sub{font-size:11.5px;color:var(--ink-3);margin:3px 0 5px;}
.rel-tier{font-size:11px;color:var(--seal);border:1px solid rgba(156,43,38,.35);padding:0 5px;border-radius:2px;}

/* ---------- 右侧纪事 ---------- */
#log-panel{grid-area:log;border-left:2px solid var(--line);background:linear-gradient(180deg,rgba(240,230,208,.9),rgba(232,219,192,.86));display:flex;flex-direction:column;min-height:0;}
#log-panel h3{margin:0;padding:12px 16px 8px;font-size:14px;letter-spacing:6px;color:var(--ink-2);border-bottom:1px solid rgba(120,95,60,.25);font-weight:500;}
#log-list{list-style:none;margin:0;padding:8px 12px 20px;overflow:auto;flex:1;font-size:12.5px;line-height:1.7;}
#log-list li{padding:5px 0;border-bottom:1px dotted rgba(120,95,60,.2);color:var(--ink-2);animation:fadeUp .35s;}
#log-list li .l-date{color:var(--ink-3);font-size:10.5px;margin-right:6px;}
#log-list li.war{color:var(--seal);}
#log-list li.gain{color:var(--jade);}
#log-list li.big{color:var(--gold);font-weight:600;}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- 弹窗 ---------- */
#modal-root{position:fixed;inset:0;display:none;z-index:60;}
#modal-root.on{display:block;}
.modal-back{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(30,22,14,.42),rgba(20,14,8,.62));backdrop-filter:blur(2px);animation:fade .2s;}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 90% 0,rgba(166,124,52,.14),transparent 55%),
    linear-gradient(175deg,#faf4e4,#ecdfc1);
  border:1px solid #8f7c5c;box-shadow:0 22px 60px rgba(20,12,6,.5),inset 0 0 0 3px rgba(255,255,255,.35);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide{width:min(980px,96vw);}
.modal.narrow{width:min(520px,94vw);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid rgba(143,124,92,.5);background:rgba(255,250,236,.55);}
.modal-head h3{margin:0;font-size:19px;letter-spacing:3px;font-weight:500;}
.modal-head .m-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:1px;}
.modal-close{border:0;background:transparent;font-size:20px;color:var(--ink-3);line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--seal);}
.modal-body{padding:16px 18px;overflow:auto;font-size:14px;line-height:1.85;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid rgba(143,124,92,.4);background:rgba(255,250,236,.45);flex-wrap:wrap;}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}

.dialog-line{display:flex;gap:12px;margin-bottom:14px;}
.dialog-line .avatar{width:46px;height:46px;flex:0 0 46px;font-size:20px;}
.dialog-line .dl-body{flex:1;min-width:0;}
.dialog-line .dl-name{font-size:12.5px;color:var(--ink-3);letter-spacing:1px;margin-bottom:3px;}
.dialog-line .dl-text{background:rgba(255,252,242,.85);border:1px solid rgba(185,163,126,.6);padding:10px 13px;font-size:14px;line-height:1.8;position:relative;}
.dialog-line.me .dl-text{background:rgba(244,236,216,.9);}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.choice-btn{
  text-align:left;border:1px solid var(--line);background:rgba(255,251,240,.8);padding:9px 13px;font-size:14px;
  transition:.15s;letter-spacing:.5px;
}
.choice-btn:hover{border-color:var(--seal);background:#fffaf0;padding-left:18px;}
.choice-btn small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px;letter-spacing:0;}

/* ---------- 小游戏 ---------- */
.mg-stage{display:flex;flex-direction:column;gap:12px;}
.mg-hint{font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.7;}
.mg-bar-wrap{position:relative;height:52px;border:1px solid var(--line);background:linear-gradient(180deg,#efe4cb,#e3d3ae);overflow:hidden;}
.mg-zone{position:absolute;top:0;bottom:0;}
.mg-zone.good{background:rgba(77,111,86,.22);}
.mg-zone.perfect{background:rgba(166,124,52,.45);}
.mg-marker{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--seal);box-shadow:0 0 10px rgba(156,43,38,.8);}
.mg-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);}
.mg-result{text-align:center;font-size:16px;letter-spacing:2px;min-height:26px;}
.combat-hp{display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:13px;}
.combat-hp .side{flex:1;}
.combat-hp .side.right{text-align:right;}
.combat-hp .hpbar{height:10px;background:rgba(120,95,60,.2);margin-top:4px;border-radius:5px;overflow:hidden;}
.combat-hp .hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#7f9a6a,#b4674f);transition:width .35s;}
.combat-arena{
  height:120px;border:1px solid rgba(185,163,126,.6);margin:10px 0;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 120%,rgba(120,95,60,.22),transparent 60%),
    repeating-linear-gradient(90deg,rgba(120,95,60,.05) 0 1px,transparent 1px 26px),
    linear-gradient(180deg,#f3e9d3,#e2d0ab);
  display:flex;align-items:center;justify-content:center;gap:60px;
}
.fighter{font-size:46px;letter-spacing:0;transition:.2s;}
.fighter.hit{animation:shake .3s;}
.fighter.p{color:var(--ink);}
.fighter.e{color:var(--seal);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px) rotate(-3deg);}75%{transform:translateX(7px) rotate(3deg);}}
.move-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.move-btn{padding:10px 4px;text-align:center;border:1px solid var(--line);background:rgba(255,251,240,.85);transition:.14s;}
.move-btn:hover{border-color:var(--seal);background:#fffaf0;transform:translateY(-1px);}
.move-btn b{display:block;font-size:17px;letter-spacing:2px;}
.move-btn small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;}
.move-btn.dim{opacity:.4;}
.combat-log{height:112px;overflow:auto;font-size:12.5px;line-height:1.7;border-top:1px dashed rgba(120,95,60,.3);padding-top:8px;color:var(--ink-2);}
.combat-log p{margin:0 0 3px;}
.combat-log p.hit{color:var(--seal);}
.debate-meter{height:14px;background:rgba(120,95,60,.18);border-radius:7px;overflow:hidden;margin:6px 0 2px;}
.debate-meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),#7fa3bd);transition:width .4s;}
.debate-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.debate-opt{padding:10px 12px;border:1px solid var(--line);background:rgba(255,251,240,.82);text-align:left;transition:.14s;}
.debate-opt:hover{border-color:var(--azure);background:#fdf9ee;transform:translateY(-1px);}
.debate-opt b{letter-spacing:2px;font-size:15px;}
.debate-opt small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px;}

/* 表格 */
.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(120,95,60,.35);}
.table td{padding:7px 8px;border-bottom:1px dashed rgba(120,95,60,.22);}
.table tr:hover td{background:rgba(255,250,235,.6);}
.table .num{text-align:right;font-variant-numeric:tabular-nums;}
.price-up{color:var(--seal);}
.price-down{color:var(--jade);}
.badge{display:inline-block;font-size:11px;padding:0 5px;border-radius:2px;background:rgba(166,124,52,.16);color:var(--gold);}

/* ---------- Toast / 时间条 ---------- */
#toast-root{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:90;pointer-events:none;}
.toast{
  background:rgba(31,27,23,.92);color:#f4e9d3;padding:8px 18px;font-size:13.5px;letter-spacing:1px;
  border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastIn .25s,toastOut .3s 2.2s forwards;
  border-left:3px solid var(--gold);
}
.toast.gain{border-left-color:var(--jade);}
.toast.war{border-left-color:var(--seal);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}
#tick-bar{position:fixed;left:0;right:0;bottom:0;height:2px;background:transparent;z-index:80;pointer-events:none;}
#tick-fill{height:100%;width:0;background:var(--seal);transition:width .2s;}

/* ---------- 标题 / 结局 ---------- */
.title-screen{display:grid;place-items:center;height:100%;}
.title-inner{text-align:center;max-width:760px;padding:30px;}
.title-big{font-size:64px;letter-spacing:22px;margin:0 0 6px;text-indent:22px;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4);}
.title-sub{font-size:14px;letter-spacing:10px;color:var(--ink-3);margin-bottom:26px;}
.title-quote{font-size:14px;color:var(--ink-2);line-height:2.2;margin:0 auto 30px;max-width:520px;border-top:1px solid rgba(120,95,60,.3);border-bottom:1px solid rgba(120,95,60,.3);padding:16px 0;}
.creation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:14px 0;}
.prof-card{border:1px solid var(--line);background:rgba(255,251,240,.75);padding:12px 14px;text-align:left;transition:.16s;}
.prof-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 16px rgba(90,70,40,.16);}
.prof-card.sel{border-color:var(--seal);background:#fff8e9;box-shadow:0 0 0 1px var(--seal) inset;}
.prof-card b{font-size:16px;letter-spacing:2px;}
.prof-card small{display:block;color:var(--ink-3);font-size:12px;line-height:1.65;margin-top:5px;}
.field{display:flex;align-items:center;gap:10px;margin:10px 0;}
.field label{font-size:13px;color:var(--ink-3);width:72px;}
.field input[type=text]{
  flex:1;border:1px solid var(--line);background:rgba(255,252,242,.9);padding:8px 10px;font-family:var(--serif);
  font-size:15px;letter-spacing:2px;color:var(--ink);border-radius:2px;outline:none;
}
.field input[type=text]:focus{border-color:var(--seal);}
.field .seg{display:flex;gap:6px;}
.field .seg button{border:1px solid var(--line);background:rgba(255,251,240,.7);padding:6px 14px;font-size:13px;}
.field .seg button.sel{background:var(--ink);color:#f3e6cb;border-color:var(--ink);}
.end-rank{font-size:34px;letter-spacing:8px;color:var(--seal);margin:6px 0 2px;}
.end-quote{font-size:14px;color:var(--ink-2);line-height:2;border-left:3px solid var(--gold);padding-left:14px;margin:16px 0;}
.ending-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;}
.ending-stats .es{border:1px solid var(--line);padding:9px;text-align:center;background:rgba(255,251,240,.6);}
.ending-stats .es b{display:block;font-size:19px;color:var(--seal);}
.ending-stats .es small{font-size:11px;color:var(--ink-3);}

/* 存档 */
.save-grid{display:flex;flex-direction:column;gap:10px;}
textarea.save-area{width:100%;height:110px;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);background:rgba(255,252,242,.9);padding:8px;resize:vertical;}
.mono{font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;color:var(--ink-3);}
.news-item{border-left:3px solid var(--seal);padding:4px 0 4px 12px;margin-bottom:10px;}
.news-item .n-y{font-size:11.5px;color:var(--ink-3);letter-spacing:1px;}
.news-item .n-t{font-size:15px;letter-spacing:2px;margin:2px 0 3px;}
.news-item .n-b{font-size:12.5px;color:var(--ink-2);line-height:1.7;}
.footnote{font-size:11.5px;color:var(--ink-3);line-height:1.7;margin-top:10px;}
kbd{font-family:var(--serif);border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:2px;background:rgba(255,251,240,.8);font-size:12px;}

/* ---------- 标题模式（隐藏 HUD 与纪事） ---------- */
body.title-mode #hud, body.title-mode #log-panel { display: none; }
body.title-mode #app { grid-template-columns: 1fr; grid-template-rows: 1fr; grid-template-areas: "screen"; }
body.title-mode .screen { display: flex; align-items: center; justify-content: center; padding: 24px; }
body.title-mode .screen > * { width: 100%; }

/* ---------- 册命试炼 ---------- */
.trial-grid{display:grid;gap:6px;margin:10px 0}
.trial-cell{
  aspect-ratio:1/1;border:1px solid var(--line);background:rgba(255,251,240,.8);font-family:var(--serif);
  font-size:15px;color:var(--ink-3);transition:.15s;border-radius:2px;
}
.trial-cell:hover:not(:disabled){border-color:var(--gold);background:#fffaf0;transform:translateY(-1px)}
.trial-cell:disabled{cursor:default;opacity:.85}
.trial-cell.near{background:rgba(166,124,52,.22);color:#7a5a1e;border-color:rgba(166,124,52,.5)}
.trial-cell.far{background:rgba(120,95,60,.08);color:#8d8478}
.trial-cell.hit{background:rgba(156,43,38,.85);color:#f8eed7;border-color:#7d1f1c;font-weight:600}
.rite-clues{font-size:13px;line-height:1.9;color:var(--ink-2);background:rgba(255,251,240,.6);border:1px dashed rgba(120,95,60,.3);padding:8px 12px;margin:8px 0}
.rite-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;min-height:38px}
.rite-chip{display:inline-block;padding:5px 10px;border:1px solid var(--line);background:rgba(255,251,240,.9);font-size:13.5px;border-radius:2px}
.rite-chip.done{background:rgba(77,111,86,.16);border-color:rgba(77,111,86,.55);color:var(--jade)}
.rite-arrow{color:var(--ink-3);font-size:12px}


/* ---------- 修习：射靶与配对 ---------- */
.target-track{position:relative;height:54px;margin:12px 0;border:1px solid var(--line);background:linear-gradient(180deg,#efe4cb,#e3d3ae);overflow:hidden}
.target-center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(156,43,38,.55);transform:translateX(-1px)}
.target-center:before{content:"靶心";position:absolute;top:2px;left:4px;font-size:10px;color:#9c2b26;letter-spacing:1px}
.target-dot{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c9554b,#8a2621);box-shadow:0 2px 8px rgba(90,30,20,.4);transition:left .05s linear}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.match-btn{display:block;width:100%;text-align:center;border:1px solid var(--line);background:rgba(255,251,240,.85);
  padding:9px 8px;font-family:var(--serif);font-size:13.5px;margin-bottom:7px;border-radius:2px;transition:.14s}
.match-btn:hover:not(:disabled){border-color:var(--gold);background:#fffaf0}
.match-btn.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset;background:#fff7e8}
.match-btn.done{opacity:.45;border-color:rgba(77,111,86,.55);color:var(--jade);cursor:default}


/* ---------- 论辩：对症/相悖标记 ---------- */
.debate-opt .opt-text{display:block;font-size:13.5px;line-height:1.7;color:var(--ink);text-align:left}


/* ---------- 三回合论辩 ---------- */
.debate-speech{
  margin:12px 0;padding:12px 15px;border-left:3px solid var(--seal);
  background:rgba(255,251,240,.75);font-size:15px;line-height:1.9;
}
.debate-speech:before{content:"对方：";color:var(--ink-3);font-size:12px;margin-right:6px}
.debate-meter{height:16px;margin:18px 0 10px;background:rgba(120,95,60,.18);border-radius:8px;overflow:visible;position:relative}
.debate-meter .bar{height:10px;margin-top:3px;background:rgba(120,95,60,.18);border-radius:5px;overflow:hidden}
.debate-meter .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),#7fa3bd);transition:width .4s}
.debate-mark{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(60,94,120,.7)}
.debate-mark-label{position:absolute;top:-15px;transform:translateX(-50%);font-size:10px;color:var(--ink-3)}

.evidence-row{padding:7px 0;border-bottom:1px dashed rgba(120,95,60,.22)}
.evidence-row:last-child{border-bottom:0}

</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-brand">
      <span class="brand-seal">春</span>
      <span class="brand-text">列国志</span>
    </div>
    <div class="hud-player">
      <span id="hud-name" class="hud-name">—</span>
      <span id="hud-prof" class="hud-prof">—</span>
      <span id="hud-rank" class="hud-rank"></span>
    </div>
    <div class="hud-stats">
      <span class="stat" title="金钱"><i>金</i><b id="hud-money">0</b></span>
      <span class="stat" title="名声"><i>名</i><b id="hud-fame">0</b></span>
      <span class="stat" title="体力"><i>力</i><b id="hud-stamina">0/0</b></span>
      <span class="stat" title="健康"><i>康</i><b id="hud-health">0</b></span>
    </div>
    <div class="hud-time">
      <span id="hud-date">—</span>
      <span id="hud-season" class="season">春</span>
    </div>
    <nav class="hud-nav" id="hud-nav">
      <button data-screen="map">舆图</button>
      <button data-screen="city">城中</button>
      <button data-screen="character">人物</button>
      <button data-screen="quests">差事</button>
      <button data-screen="relations">交游</button>
      <button data-screen="cards">名鉴</button>
      <button data-screen="save">存档</button>
    </nav>
  </header>

  <main id="screen" class="screen"></main>

  <aside id="log-panel">
    <h3>纪 事</h3>
    <ul id="log-list"></ul>
  </aside>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="tick-bar"><div id="tick-fill"></div></div>
</div>
<div id="boot-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#f6efe0;color:#3a2a1c;padding:36px;font-family:'KaiTi','SimSun',serif;overflow:auto">
  <h2 style="margin:0 0 12px;color:#9c2b26;font-size:22px;letter-spacing:2px">春秋·列国志 · 启动失败</h2>
  <p id="boot-error-msg" style="line-height:1.9;font-size:15px"></p>
  <pre id="boot-error-detail" style="font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#eee0c4;padding:14px;border:1px solid #b9a37e;line-height:1.7"></pre>
  <p style="line-height:2;font-size:14px">
    常见原因：<br>
    1. 直接双击 index.html（file://）打开 —— 浏览器会拦截 ES Module。请用 <b>npm start</b> 后访问 http://localhost:5173，或直接打开单文件版 <b>chunqiu.html</b>。<br>
    2. 浏览器禁用本地存储 —— 请关闭隐私模式/允许站点存储。<br>
    3. 端口未启动或访问了错误地址。
  </p>
</div>
<script>
(function () {
  var shown = false;
  function show(msg, detail) {
    if (shown) return; shown = true;
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    document.getElementById('boot-error-msg').textContent = msg || '脚本未能启动。';
    document.getElementById('boot-error-detail').textContent = detail || '';
  }
  window.addEventListener('error', function (e) {
    var where = (e.filename || '') + (e.lineno ? ':' + e.lineno : '');
    var stack = e.error && e.error.stack ? e.error.stack : '';
    show('页面脚本出错：' + (e.message || '未知错误'), where + '  ' + stack);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    show('页面脚本出错（Promise）：' + (r.message || String(e.reason)), r.stack || '');
  });
  setTimeout(function () {
    var screen = document.getElementById('screen');
    if (screen && screen.children.length === 0 && !shown) {
      var hint = location.protocol === 'file:'
        ? '当前是以 file:// 直接打开，浏览器会拦截 ES Module。'
        : '脚本尚未渲染任何内容，请打开浏览器控制台（F12）查看报错。';
      show(hint, 'URL: ' + location.href + ' ｜ 可运行 npm start 后访问 http://localhost:5173，或直接打开单文件版 chunqiu.html。');
    }
  }, 2500);
})();

食，析骸以爨，虽然，城下之盟，有以国毙，不能从也。",desc:"宋国执政，登床劫盟，后又倡弭兵之会，以纾宋难。"},{id:"xiang_xu",name:"向戌",title:"宋之左师",state:"song",city:"shangqiu",birth:-600,death:-530,role:"minister",stats:{wu:40,zhi:82,zheng:86,mei:88},skills:{biancai:9,quanmou:7},bias:"ming",pref:"si",teach:["biancai"],quote:"弭兵之会，天下息肩。",desc:"宋国左师，奔走列国，合晋楚之成，为春秋一大盛事。"},{id:"wei_wen",name:"卫文公",title:"卫侯",state:"wei",city:"chaoge",reign:[-635,-635],role:"ruler",stats:{wu:48,zhi:66,zheng:72,mei:62},skills:{shanggu:5,xuewen:4},bias:"yi",pref:"si",teach:["shanggu"],quote:"卫之遗民，革车三十乘，今已三百乘矣。",desc:"卫国之君，国破之后励精图治，轻赋平罪，卫以复兴。"},{id:"yan_zhuang",name:"燕庄公",title:"燕侯",state:"yan",city:"ji",reign:[-730,-729],role:"ruler",stats:{wu:44,zhi:56,zheng:58,mei:60},skills:{bingfa:3,xuewen:3},bias:"yi",pref:"ge",teach:["xuewen"],quote:"燕处北鄙，赖齐侯以安。",desc:"燕国之君，山戎侵伐，赖齐桓公救而存国。"},{id:"chen_xuan",name:"陈宣公",title:"陈侯",state:"chen",city:"wanqiu",reign:[-692,-648],role:"ruler",stats:{wu:40,zhi:54,zheng:56,mei:58},skills:{xuewen:3},bias:"ming",pref:"qi",teach:["xuewen"],quote:"陈，小国也，事大国以自安。",desc:"陈国之君，国小势微，周旋于晋楚之间。"},{id:"cai_ai",name:"蔡哀公",title:"蔡侯",state:"cai",city:"shangcai",reign:[-730,-715],role:"ruler",stats:{wu:42,zhi:46,zheng:50,mei:54},skills:{jianshu:2},bias:"ming",pref:"mingzhu",teach:["jianshu"],quote:"蔡人亦自有志。",desc:"蔡国之君，地薄兵弱，为楚所窥。"},{id:"cao_gong",name:"曹共公",title:"曹伯",state:"cao",city:"tao",reign:[-701,-618],role:"ruler",stats:{wu:38,zhi:44,zheng:48,mei:50},skills:{shanggu:3},bias:"li",pref:"su",teach:["shanggu"],quote:"陶为天下之中，商旅辐辏，寡人亦有以自养。",desc:"曹国之君，据陶之利，国小而富。"},{id:"chu_zhuang",name:"楚庄王",title:"楚王",state:"chu",city:"ying",birth:-640,death:-591,reign:[-613,-591],role:"ruler",stats:{wu:72,zhi:88,zheng:88,mei:80},skills:{bingfa:7,quanmou:8,biancai:4},bias:"shi",pref:"qi",teach:["bingfa","quanmou"],quote:"三年不蜚，蜚将冲天；三年不鸣，鸣将惊人。",desc:"楚国之主，问鼎中原，邲之战大败晋师，遂霸诸侯。"},{id:"yan_ying",name:"晏婴",title:"齐之相国",state:"qi",city:"linzi",birth:-578,death:-500,role:"minister",stats:{wu:35,zhi:92,zheng:94,mei:86},skills:{biancai:10,quanmou:8,xuewen:8},bias:"yi",pref:"si",teach:["biancai","xuewen"],quote:"橘生淮南则为橘，生于淮北则为枳。",desc:"齐之贤相，历事三君，节俭力行，折冲樽俎之间。"},{id:"shu_xiang",name:"叔向",title:"晋之太傅",state:"jin",city:"jiang",birth:-620,death:-528,role:"minister",stats:{wu:42,zhi:86,zheng:90,mei:74},skills:{xuewen:9,biancai:8,quanmou:6},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"国将亡，必多制。",desc:"晋国贤大夫，博闻强识，以礼法持国论。"},{id:"zi_chan",name:"子产",title:"郑之执政",state:"zheng",city:"xinzheng",birth:-600,death:-522,role:"minister",stats:{wu:40,zhi:92,zheng:96,mei:82},skills:{xuewen:9,quanmou:8,biancai:7,shanggu:5},bias:"yi",pref:"yu",teach:["xuewen","quanmou"],quote:"苟利社稷，死生以之。",desc:"郑国执政，铸刑书，不毁乡校，小国而能自立于晋楚之间。"},{id:"lao_zi",name:"老子",title:"周之守藏史",state:"zhou",city:"luoyi",birth:-571,death:-471,role:"scholar",stats:{wu:26,zhi:96,zheng:72,mei:80},skills:{xuewen:10,biancai:7,quanmou:8},bias:"yi",pref:"bi",teach:["xuewen","quanmou"],quote:"上善若水，水善利万物而不争。",desc:"周室守藏室之史，博古知今，其学以自隐无名为务。"},{id:"kong_zi",name:"孔子",title:"鲁之学者",state:"lu",city:"qufu",birth:-551,death:-479,role:"scholar",stats:{wu:52,zhi:94,zheng:86,mei:90},skills:{xuewen:10,biancai:8,bingfa:4,suanshu:5},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"学而时习之，不亦说乎？",desc:"鲁国陬邑人，少而好学，设教阙里，弟子三千，贤者七十。"},{id:"sun_wu",name:"孙武",title:"吴之将军",state:"wu",city:"gusu",birth:-545,death:-470,role:"general",stats:{wu:78,zhi:96,zheng:70,mei:66},skills:{bingfa:10,quanmou:8,jianshu:6,xuewen:7},bias:"shi",pref:"ma",teach:["bingfa","jianshu"],quote:"兵者，国之大事，死生之地，存亡之道，不可不察也。",desc:"齐人而仕于吴，以兵法十三篇见阖闾，西破强楚，北威齐晋。"},{id:"wu_zixu",name:"伍子胥",title:"吴之相国",state:"wu",city:"gusu",birth:-559,death:-484,role:"minister",stats:{wu:82,zhi:88,zheng:80,mei:60},skills:{quanmou:8,bingfa:7,jianshu:6},bias:"yi",pref:"ma",teach:["quanmou","bingfa"],quote:"日暮途远，吾故倒行而逆施之。",desc:"楚之亡臣，父兄被戮，奔吴以谋复仇，终以吴师入郢。"},{id:"he_lu",name:"阖闾",title:"吴王",state:"wu",city:"gusu",birth:-537,death:-496,reign:[-514,-496],role:"ruler",stats:{wu:74,zhi:78,zheng:76,mei:70},skills:{bingfa:6,quanmou:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"吴虽僻远，愿与上图一争高下。",desc:"吴国之主，任伍胥、孙武，西破楚而入郢，东南之势成。"},{id:"fu_cha",name:"夫差",title:"吴王",state:"wu",city:"gusu",birth:-528,death:-473,reign:[-495,-473],role:"ruler",stats:{wu:80,zhi:62,zheng:58,mei:70},skills:{bingfa:6,jianshu:7},bias:"ming",pref:"xiang",teach:["jianshu"],quote:"寡人岂敢忘越王之杀吾父耶！",desc:"吴国之主，夫椒胜越，黄池会盟，然矜功自伐，终为越所灭。"},{id:"gou_jian",name:"勾践",title:"越王",state:"yue",city:"kuaiji",birth:-520,death:-465,reign:[-496,-465],role:"ruler",stats:{wu:70,zhi:86,zheng:80,mei:66},skills:{quanmou:8,bingfa:5},bias:"shi",pref:"tie",teach:["quanmou"],quote:"卧薪尝胆，十年生聚，十年教训。",desc:"越国之主，败于夫椒而不屈，忍辱负重，终以三千越甲吞吴。"},{id:"fan_li",name:"范蠡",title:"越之上将军",state:"yue",city:"kuaiji",birth:-536,death:-448,role:"merchant",stats:{wu:56,zhi:94,zheng:88,mei:84},skills:{shanggu:10,quanmou:8,biancai:7,suanshu:8},bias:"li",pref:"mingzhu",teach:["shanggu","suanshu","quanmou"],quote:"飞鸟尽，良弓藏；狡兔死，走狗烹。",desc:"越国谋臣，佐勾践灭吴，功成身退，浮海至陶，三致千金，号陶朱公。"},{id:"wen_zhong",name:"文种",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-472,role:"minister",stats:{wu:40,zhi:86,zheng:88,mei:72},skills:{quanmou:7,xuewen:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou","xuewen"],quote:"伐吴七术，越王用其三而吴灭。",desc:"越国大夫，与范蠡共佐勾践，灭吴之后不能去，终赐剑而死。"},{id:"ji_liang",name:"季梁",title:"随之贤大夫",state:"sui",city:"sui",birth:-720,death:-660,role:"minister",stats:{wu:38,zhi:88,zheng:84,mei:72},skills:{xuewen:7,quanmou:6,biancai:5},bias:"yi",pref:"xijiao",teach:["quanmou","xuewen"],quote:"夫民，神之主也。是以圣王先成民而后致力于神。",desc:"随国贤臣，谏随侯修政亲邻，以民为本，汉东赖之。"},{id:"liu_xiahui",name:"展获",title:"鲁之柳下惠",state:"lu",city:"fei",birth:-720,death:-621,role:"scholar",stats:{wu:40,zhi:84,zheng:80,mei:90},skills:{xuewen:8,biancai:6,quanmou:4},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"直道而事人，焉往而不三黜？",desc:"鲁之贤大夫，食邑柳下。坐怀不乱，三黜而不去，士人称其和。"},{id:"qu_wan",name:"屈完",title:"楚之大夫",state:"chu",city:"shen",birth:-700,death:-640,role:"minister",stats:{wu:54,zhi:84,zheng:78,mei:86},skills:{biancai:8,quanmou:5,bingfa:4},bias:"shi",pref:"ma",teach:["biancai","quanmou"],quote:"君若以德绥诸侯，谁敢不服？",desc:"楚之辩士，召陵之盟单车入齐师，以一言折诸侯之兵。"},{id:"yang_youji",name:"养由基",title:"楚之射师",state:"chu",city:"ying",birth:-640,death:-570,role:"general",stats:{wu:86,zhi:60,zheng:42,mei:58},skills:{sheshu:10,jianshu:6,bingfa:4},bias:"ming",pref:"ma",teach:["sheshu","jianshu"],quote:"去柳叶者百步而射之，百发而百中。",desc:"楚之善射者，百步穿杨，鄢陵之战中箭而死。"},{id:"you_yu",name:"由余",title:"戎王之使",state:"qin",city:"yong",birth:-700,death:-623,role:"minister",stats:{wu:48,zhi:84,zheng:78,mei:60},skills:{bingfa:7,quanmou:6},bias:"shi",pref:"ma",teach:["bingfa"],quote:"诗书礼乐，中国之所以乱也。",desc:"本西戎之臣，秦穆公以女乐间之，遂降秦，为秦谋伐戎。"},{id:"zi_fan",name:"子犯",title:"晋之谋臣",state:"jin",city:"jiang",birth:-715,death:-629,role:"minister",stats:{wu:46,zhi:86,zheng:80,mei:66},skills:{quanmou:8,biancai:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"战也。战而捷，必得诸侯。",desc:"狐偃，从重耳流亡十九年，城濮之战主谋。"},{id:"wei_wu_zi",name:"魏武子",title:"晋之大夫",state:"jin",city:"quwo",birth:-700,death:-640,role:"general",stats:{wu:76,zhi:70,zheng:62,mei:56},skills:{bingfa:6,jianshu:6},bias:"shi",pref:"tie",teach:["jianshu"],quote:"从君于难，不敢有二。",desc:"从重耳出亡，后为晋之良将。"},{id:"wu_ju",name:"伍举",title:"楚之大夫",state:"chu",city:"ying",birth:-620,death:-550,role:"minister",stats:{wu:44,zhi:86,zheng:80,mei:68},skills:{biancai:8,quanmou:7},bias:"ming",pref:"qi",teach:["biancai"],quote:"愿得归骨于楚。",desc:"伍子胥之祖，以直谏知名于楚。"},{id:"shen_shu_shi",name:"申叔时",title:"楚之贤大夫",state:"chu",city:"shen",birth:-620,death:-560,role:"scholar",stats:{wu:32,zhi:88,zheng:84,mei:70},skills:{xuewen:9,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"善为国者，赏不僭而刑不滥。",desc:"楚之老成，多所匡正，庄王亦敬惮之。"},{id:"ji_wen_zi",name:"季文子",title:"鲁之上卿",state:"lu",city:"qufu",birth:-660,death:-568,role:"minister",stats:{wu:38,zhi:84,zheng:88,mei:74},skills:{xuewen:8,quanmou:7},bias:"yi",pref:"si",teach:["xuewen","quanmou"],quote:"妾不衣帛，马不食粟。",desc:"鲁之执政，以俭著称，三思而后行。"},{id:"zang_wen_zhong",name:"臧文仲",title:"鲁之大夫",state:"lu",city:"qufu",birth:-700,death:-617,role:"minister",stats:{wu:36,zhi:86,zheng:82,mei:70},skills:{xuewen:9,biancai:6},bias:"yi",pref:"yu",teach:["xuewen"],quote:"居官者当事不避难。",desc:"鲁之老臣，历事四君，以博学多闻称。"},{id:"si_ma_rang_ju",name:"司马穰苴",title:"齐之大司马",state:"qi",city:"linzi",birth:-590,death:-520,role:"general",stats:{wu:86,zhi:84,zheng:70,mei:62},skills:{bingfa:10,jianshu:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"将在军，君命有所不受。",desc:"斩庄贾以立威，晋燕之师闻之而退。"},{id:"fan_wen_zi",name:"范文子",title:"晋之卿",state:"jin",city:"jiang",birth:-620,death:-574,role:"minister",stats:{wu:40,zhi:88,zheng:84,mei:68},skills:{quanmou:8,xuewen:7},bias:"yi",pref:"si",teach:["quanmou"],quote:"外宁必有内忧。",desc:"鄢陵之战后忧晋之必乱，果如其言。"},{id:"luan_shu",name:"栾书",title:"晋之中军将",state:"jin",city:"jiang",birth:-620,death:-573,role:"general",stats:{wu:78,zhi:82,zheng:76,mei:60},skills:{bingfa:8,quanmou:7},bias:"shi",pref:"tie",teach:["bingfa"],quote:"师直为壮，曲为老。",desc:"晋之执政，鄢陵之战主帅，后弑厉公。"},{id:"shen_bao_xu",name:"申包胥",title:"楚之大夫",state:"chu",city:"ying",birth:-560,death:-490,role:"minister",stats:{wu:42,zhi:84,zheng:80,mei:74},skills:{biancai:9,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"子能复之，我必能兴之。",desc:"伍子胥之友，哭秦庭七日七夜，秦师乃出。"},{id:"bo_pi",name:"伯嚭",title:"吴之太宰",state:"wu",city:"gusu",birth:-560,death:-473,role:"minister",stats:{wu:40,zhi:80,zheng:70,mei:66},skills:{quanmou:8,biancai:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"越既服矣，何求焉？",desc:"吴之佞臣，受越之赂，谮杀伍子胥，吴遂亡。"},{id:"gao_xi",name:"高傒",title:"齐之上卿",state:"qi",city:"linzi",birth:-730,death:-637,role:"minister",stats:{wu:60,zhi:78,zheng:84,mei:68},skills:{quanmou:7,biancai:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"国有长君，社稷之福。",desc:"齐之世卿，与管仲同定桓公之位。"},{id:"ning_qi",name:"宁戚",title:"齐之大夫",state:"qi",city:"linzi",birth:-720,death:-660,role:"merchant",stats:{wu:42,zhi:84,zheng:82,mei:70},skills:{shanggu:9,suanshu:7,biancai:6},bias:"li",pref:"su",teach:["shanggu","suanshu"],quote:"浩浩乎白水！",desc:"饭牛车下，扣角而歌，桓公闻而异之，举为大夫。"},{id:"qi_xiang",name:"齐襄公",title:"齐侯",state:"qi",city:"linzi",birth:-720,death:-686,reign:[-697,-686],role:"ruler",stats:{wu:64,zhi:58,zheng:52,mei:60},skills:{jianshu:5,bingfa:4},bias:"shi",pref:"ma",teach:["jianshu"],quote:"及瓜而代。",desc:"齐僖公之子，通于文姜，杀鲁桓公。后为公孙无知所弑。"},{id:"qi_xiao",name:"齐孝公",title:"齐侯",state:"qi",city:"linzi",reign:[-642,-633],role:"ruler",stats:{wu:50,zhi:60,zheng:56,mei:58},skills:{quanmou:4},bias:"yi",pref:"si",teach:["quanmou"],quote:"寡人赖先君之灵。",desc:"桓公之子，奔宋，宋襄公率诸侯伐齐而立之。"},{id:"qi_zhao",name:"齐昭公",title:"齐侯",state:"qi",city:"linzi",reign:[-632,-613],role:"ruler",stats:{wu:46,zhi:62,zheng:58,mei:56},skills:{quanmou:5},bias:"li",pref:"yan",teach:["quanmou"],quote:"晋方强，不可与之争。",desc:"孝公之弟，在位时晋楚争雄，齐事晋。"},{id:"qi_qing",name:"齐顷公",title:"齐侯",state:"qi",city:"linzi",reign:[-598,-582],role:"ruler",stats:{wu:58,zhi:56,zheng:54,mei:62},skills:{jianshu:4,quanmou:3},bias:"shi",pref:"ma",teach:["jianshu"],quote:"余姑翦灭此而朝食。",desc:"鞍之战为晋所败，几被擒。后归而与晋盟。"},{id:"qi_ling",name:"齐灵公",title:"齐侯",state:"qi",city:"linzi",reign:[-581,-554],role:"ruler",stats:{wu:54,zhi:58,zheng:60,mei:58},skills:{bingfa:5},bias:"shi",pref:"tie",teach:["bingfa"],quote:"诸侯皆叛，寡人独守。",desc:"屡与晋争，平阴之役为晋所败。"},{id:"qi_jing",name:"齐景公",title:"齐侯",state:"qi",city:"linzi",reign:[-547,-490],role:"ruler",stats:{wu:50,zhi:68,zheng:66,mei:66},skills:{quanmou:6,biancai:4},bias:"ming",pref:"yu",teach:["quanmou"],quote:"君若欲之，何患无有？",desc:"在位五十八年，晏婴佐之，齐国稍安。"},{id:"jin_xian",name:"晋献公",title:"晋侯",state:"jin",city:"jiang",birth:-710,death:-651,reign:[-676,-651],role:"ruler",stats:{wu:60,zhi:66,zheng:60,mei:54},skills:{bingfa:6,quanmou:5},bias:"shi",pref:"ma",teach:["bingfa"],quote:"假道于虞以伐虢。",desc:"并国十七，服国三十八。然宠骊姬，杀太子申生，晋乱自此始。"},{id:"jin_hui",name:"晋惠公",title:"晋侯",state:"jin",city:"jiang",reign:[-650,-637],role:"ruler",stats:{wu:48,zhi:58,zheng:52,mei:50},skills:{quanmou:5},bias:"li",pref:"su",teach:["quanmou"],quote:"吾争国于外，奈何以信？",desc:"背秦赂，韩原之败为秦所虏。"},{id:"jin_xiang",name:"晋襄公",title:"晋侯",state:"jin",city:"jiang",reign:[-627,-621],role:"ruler",stats:{wu:66,zhi:70,zheng:68,mei:60},skills:{bingfa:7,quanmou:5},bias:"shi",p ng:40,mei:44},skills:{},bias:"yi",pref:"su",teach:[],quote:"",desc:"在位十六年。"},{id:"sui_hou3",name:"随文侯",title:"随侯",state:"sui",city:"sui",reign:[-638,-570],role:"ruler",birth:-670,death:-570,stats:{wu:40,zhi:48,zheng:44,mei:46},skills:{quanmou:4},bias:"yi",pref:"si",teach:["quanmou"],quote:"随事楚，不敢叛。",desc:"随既为楚之与国。"},{id:"sui_hou4",name:"随穆侯",title:"随侯",state:"sui",city:"sui",reign:[-569,-500],role:"ruler",birth:-600,death:-500,stats:{wu:38,zhi:48,zheng:44,mei:46},skills:{quanmou:4},bias:"yi",pref:"si",teach:["quanmou"],quote:"",desc:"在位七十年。"},{id:"sui_hou5",name:"随后侯",title:"随侯",state:"sui",city:"sui",reign:[-499,-473],role:"ruler",birth:-530,death:-473,stats:{wu:36,zhi:46,zheng:42,mei:44},skills:{},bias:"yi",pref:"su",teach:[],quote:"",desc:"在位二十七年。"},{id:"xu_huan",name:"许桓公",title:"许男",state:"xu",city:"xu",reign:[-721,-699],role:"ruler",birth:-750,death:-699,stats:{wu:38,zhi:46,zheng:44,mei:48},skills:{quanmou:3},bias:"yi",pref:"si",teach:["quanmou"],quote:"",desc:"在位二十三年。"},{id:"xu_dao2",name:"许灵公",title:"许男",state:"xu",city:"xu",reign:[-657,-592],role:"ruler",birth:-690,death:-592,stats:{wu:36,zhi:48,zheng:44,mei:46},skills:{quanmou:4},bias:"yi",pref:"si",teach:["quanmou"],quote:"许迁于叶，又迁于夷。",desc:"许屡迁以避楚。"},{id:"xu_yuan",name:"许元公",title:"许男",state:"xu",city:"xu",reign:[-591,-523],role:"ruler",birth:-620,death:-523,stats:{wu:36,zhi:46,zheng:42,mei:46},skills:{quanmou:4},bias:"yi",pref:"si",teach:["quanmou"],quote:"",desc:"在位六十九年。"},{id:"xu_jie",name:"许结",title:"许男",state:"xu",city:"xu",reign:[-522,-521],role:"ruler",birth:-550,death:-502,stats:{wu:34,zhi:44,zheng:40,mei:44},skills:{},bias:"yi",pref:"su",teach:[],quote:"",desc:"在位二十一年。"},{id:"xu_si",name:"许斯",title:"许男",state:"xu",city:"xu",reign:[-501,-481],role:"ruler",birth:-530,death:-481,stats:{wu:32,zhi:44,zheng:40,mei:44},skills:{},bias:"li",pref:"yu",teach:[],quote:"",desc:"在位二十一年。"},{id:"xi_gui",name:"息妫",title:"息侯夫人",state:"chu",city:"xi",birth:-710,death:-640,role:"noble",stats:{wu:30,zhi:82,zheng:66,mei:96},skills:{xuewen:7,biancai:8},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"吾一妇人而事二夫，纵弗能死，其又奚言？",desc:"息侯之夫人，蔡哀公戏之，息侯怒而引楚伐蔡，楚文王遂灭息，纳之。入楚后不言者数年。"},{id:"xia_ji",name:"夏姬",title:"陈之寡居",state:"chen",city:"wanqiu",birth:-640,death:-580,role:"noble",stats:{wu:34,zhi:76,zheng:58,mei:98},skills:{quanmou:7,biancai:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"妾之不幸，至于此乎。",desc:"郑穆公之女，嫁于陈之夏御叔。三为王后、七为夫人，公侯争之，死者数人，亡国数国。"},{id:"wen_jiang",name:"文姜",title:"鲁桓公夫人",state:"lu",city:"qufu",birth:-735,death:-673,role:"noble",stats:{wu:32,zhi:78,zheng:64,mei:92},skills:{xuewen:8,biancai:6},bias:"ming",pref:"si",teach:["xuewen"],quote:"齐与鲁，甥舅之国也。",desc:"齐襄公之妹，嫁鲁桓公。与兄通，桓公知之而怒，齐襄公遂杀桓公于车中。"},{id:"ai_jiang",name:"哀姜",title:"鲁庄公夫人",state:"lu",city:"qufu",birth:-700,death:-659,role:"noble",stats:{wu:30,zhi:70,zheng:56,mei:88},skills:{quanmou:5},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾自齐来，岂知鲁事。",desc:"齐女，嫁鲁庄公。与庆父通，庄公卒后谋立庆父，事败，齐人杀之于夷。"},{id:"xu_mu_furen",name:"许穆夫人",title:"许侯夫人",state:"xu",city:"xu",birth:-690,death:-630,role:"noble",stats:{wu:34,zhi:84,zheng:62,mei:86},skills:{xuewen:9,biancai:7},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"载驰载驱，归唁卫侯。",desc:"卫宣公之女，嫁于许。狄灭卫，夫人欲归唁其兄，许人不许，乃赋《载驰》。中国最早有名字的女诗人。"},{id:"li_ji",name:"骊姬",title:"晋献公夫人",state:"jin",city:"jiang",birth:-700,death:-650,role:"noble",stats:{wu:28,zhi:88,zheng:60,mei:90},skills:{quanmou:9,biancai:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾欲立奚齐。",desc:"骊戎之女，晋献公伐骊戎所得。谮杀太子申生，逐重耳、夷吾，晋乱二十年。"},{id:"nan_zi",name:"南子",title:"卫灵公夫人",state:"wei",city:"diqiu",birth:-560,death:-480,role:"noble",stats:{wu:30,zhi:80,zheng:58,mei:92},skills:{xuewen:7,biancai:8},bias:"ming",pref:"yu",teach:["biancai"],quote:"四方之君子不辱欲与寡君为兄弟者，必见寡小君。",desc:"宋女，卫灵公夫人。孔子适卫，南子请见，孔子见之，子路不悦。"},{id:"huai_ying",name:"怀嬴",title:"秦穆公之女",state:"qin",city:"yong",birth:-640,death:-580,role:"noble",stats:{wu:32,zhi:78,zheng:64,mei:88},skills:{biancai:6,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"秦晋，匹也，何以卑我？",desc:"秦穆公之女，先嫁晋怀公，后嫁晋文公。文公初慢之，怀嬴怒曰「秦晋匹也」。"},{id:"mu_ji",name:"穆姬",title:"秦穆公夫人",state:"qin",city:"yong",birth:-680,death:-620,role:"noble",stats:{wu:30,zhi:80,zheng:66,mei:84},skills:{xuewen:6,biancai:7},bias:"yi",pref:"si",teach:["biancai"],quote:"吾兄弟之故，敢以死请。",desc:"晋献公之女，嫁秦穆公。晋惠公韩原之败为秦所虏，穆姬登台履薪以死请，乃归惠公。"},{id:"deng_man",name:"邓曼",title:"楚武王夫人",state:"chu",city:"ying",birth:-730,death:-680,role:"noble",stats:{wu:28,zhi:90,zheng:68,mei:82},skills:{xuewen:8,quanmou:8},bias:"yi",pref:"si",teach:["xuewen","quanmou"],quote:"王禄尽矣。盈而荡，天之道也。",desc:"楚武王夫人。武王将伐随，邓曼知其必死，果薨于樠木之下。"},{id:"ding_jiang",name:"定姜",title:"卫定公夫人",state:"wei",city:"diqiu",birth:-600,death:-540,role:"noble",stats:{wu:28,zhi:86,zheng:70,mei:80},skills:{xuewen:8,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"是先君宗卿之嗣也，大国又以为请。",desc:"卫定公夫人。定公卒，其子衎不哀，定姜曰「是夫也，将不唯卫国之败」。后衎果出奔。"},{id:"jing_jiang",name:"敬姜",title:"鲁之寡妇",state:"lu",city:"qufu",birth:-600,death:-520,role:"noble",stats:{wu:34,zhi:88,zheng:72,mei:78},skills:{xuewen:10,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"民劳则思，思则善心生。",desc:"鲁大夫公父穆伯之妻。夫死子幼，犹纺绩不辍。孔子称其「不淫」。"},{id:"shu_kui",name:"叔隗",title:"狄人之女",state:"jin",city:"jiang",birth:-690,death:-630,role:"noble",stats:{wu:44,zhi:74,zheng:58,mei:84},skills:{jianshu:4,quanmou:5},bias:"shi",pref:"ma",teach:["quanmou"],quote:"狄土虽陋，亦有礼义。",desc:"晋文公流亡至狄，狄人伐廧咎如，得二女，长曰叔隗，以妻重耳。"},{id:"ji_kui",name:"季隗",title:"狄人之女",state:"jin",city:"jiang",birth:-688,death:-628,role:"noble",stats:{wu:40,zhi:76,zheng:56,mei:86},skills:{xuewen:5,quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"我二十五年矣，又如是而嫁，则就木焉。请待子。",desc:"叔隗之妹，嫁晋文公。文公将去狄，嘱其待己，季隗以「就木」对，后终得团聚。"},{id:"cai_ji",name:"蔡姬",title:"齐桓公夫人",state:"qi",city:"linzi",birth:-710,death:-650,role:"noble",stats:{wu:32,zhi:68,zheng:54,mei:88},skills:{quanmou:4},bias:"ming",pref:"yu",teach:["quanmou"],quote:"荡舟何惧，君试观之。",desc:"蔡穆公之女，齐桓公夫人。与桓公荡舟，荡而公惧，怒而归之蔡。蔡人另嫁之，桓公遂伐蔡。"},{id:"sheng_ji",name:"声姬",title:"齐灵公夫人",state:"qi",city:"linzi",birth:-590,death:-530,role:"noble",stats:{wu:28,zhi:72,zheng:60,mei:84},skills:{quanmou:5},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾子牙，当立。",desc:"鲁女，齐灵公夫人。生子牙，谋立之，废太子光。后光复位为庄公。"},{id:"shi_kuang",name:"师旷",title:"晋之乐师",state:"jin",city:"jiang",birth:-600,death:-532,role:"artisan",stats:{wu:30,zhi:92,zheng:80,mei:74},skills:{xuewen:10,biancai:7,quanmou:7},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"君，民之望也。",desc:"晋之乐师，目盲而善听。闻钟声而知楚师之衰，以琴音察人心之邪正，屡以乐谏平公。"},{id:"yi_he",name:"医和",title:"秦之良医",state:"qin",city:"yong",birth:-580,death:-520,role:"artisan",stats:{wu:36,zhi:90,zheng:60,mei:68},skills:{xuewen:9,quanmou:4},bias:"yi",pref:"qi",teach:["xuewen"],quote:"疾不可为也。是谓近女室，疾如蛊。",desc:"秦之良医。晋平公疾，求医于秦，医和视之，曰「疾不可为也，是谓近女室」，遂以「蛊」喻其政。"},{id:"yi_huan",name:"医缓",title:"秦之良医",state:"qin",city:"yong",birth:-610,death:-550,role:"artisan",stats:{wu:34,zhi:88,zheng:58,mei:66},skills:{xuewen:9},bias:"yi",pref:"su",teach:["xuewen"],quote:"疾在肓之上、膏之下，攻之不可，达之不及，药不至焉。",desc:"秦之良医。晋景公病，求医于秦，医缓至，曰「在肓之上、膏之下」，不可为也。「病入膏肓」出于此。"},{id:"gongshu_ban",name:"公输般",title:"鲁之巧匠",state:"lu",city:"qufu",birth:-507,death:-444,role:"artisan",stats:{wu:62,zhi:88,zheng:50,mei:62},skills:{bingfa:6,quanmou:6,sheshu:5},bias:"li",pref:"tie",teach:["bingfa","quanmou"],quote:"吾知所以距子矣，吾不言。",desc:"鲁之巧匠，即鲁班。为楚造云梯钩拒以攻宋，墨子九距之，遂罢。"},{id:"bo_ya",name:"伯牙",title:"善琴者",state:"jin",city:"handan",birth:-600,death:-540,role:"artisan",stats:{wu:32,zhi:84,zheng:54,mei:88},skills:{xuewen:9,biancai:6},bias:"ming",pref:"yu",teach:["xuewen"],quote:"巍巍乎志在高山，汤汤乎志在流水。",desc:"善鼓琴者。钟子期听其琴，知其志在高山流水。子期死，伯牙破琴绝弦，终身不复鼓。"},{id:"you_meng",name:"优孟",title:"楚之优人",state:"chu",city:"ying",birth:-620,death:-560,role:"artisan",stats:{wu:28,zhi:86,zheng:62,mei:84},skills:{biancai:9,quanmou:7},bias:"ming",pref:"yu",teach:["biancai","quanmou"],quote:"请为大王言孙叔敖。",desc:"楚之优人，善谑谏。孙叔敖死后其子穷困，优孟着其衣冠见庄王，王以为叔敖复生，遂封其子。"},{id:"zi_qing",name:"梓庆",title:"鲁之木工",state:"lu",city:"qufu",birth:-560,death:-500,role:"artisan",stats:{wu:52,zhi:82,zheng:48,mei:60},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"tie",teach:["quanmou"],quote:"臣将为鐻，未尝敢以耗气也，必齐以静心。",desc:"鲁之木工，削木为鐻，见者惊犹鬼神。自言「斋三日而不敢怀庆赏爵禄」，故能合天。"},{id:"lun_bian",name:"轮扁",title:"齐之斫轮者",state:"qi",city:"linzi",birth:-590,death:-530,role:"artisan",stats:{wu:48,zhi:84,zheng:46,mei:58},skills:{xuewen:6,quanmou:6},bias:"yi",pref:"tie",teach:["xuewen"],quote:"君之所读者，古人之糟魄已夫。",desc:"齐之斫轮匠。见桓公读书于堂上，曰「君之所读者，古人之糟魄已夫」，以斫轮之技不可言传为喻。"},{id:"bo_zi_qi",name:"钟子期",title:"知音者",state:"chu",city:"ying",birth:-600,death:-540,role:"artisan",stats:{wu:30,zhi:82,zheng:52,mei:80},skills:{xuewen:8,biancai:5},bias:"yi",pref:"yu",teach:["xuewen"],quote:"善哉！峨峨兮若泰山。",desc:"伯牙之知音。听琴而知高山流水之志，死而伯牙绝弦。"},{id:"qi_mu",name:"匠石",title:"楚之巧匠",state:"chu",city:"ying",birth:-550,death:-490,role:"artisan",stats:{wu:56,zhi:80,zheng:46,mei:56},skills:{quanmou:6,jianshu:4},bias:"shi",pref:"tie",teach:["quanmou"],quote:"匠石运斤成风，听而斫之。",desc:"楚之巧匠。有郢人以白垩涂鼻端如蝇翼，匠石运斤成风而斫之，尽垩而鼻不伤。"},{id:"zhou_gong",name:"周公黑肩",title:"周之卿士",state:"zhou",city:"luoyi",birth:-760,death:-694,role:"minister",stats:{wu:42,zhi:76,zheng:80,mei:62},skills:{xuewen:7,quanmou:6},bias:"yi",pref:"yu",teach:["xuewen","quanmou"],quote:"王纲虽替，礼不可废。",desc:"周桓公，周之卿士。欲弑王而立王子克，事败见杀。"},{id:"zhou_wang_sun",name:"王孙满",title:"周之大夫",state:"zhou",city:"luoyi",birth:-630,death:-570,role:"minister",stats:{wu:34,zhi:88,zheng:82,mei:70},skills:{xuewen:9,biancai:8},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"在德不在鼎。",desc:"周定王时大夫。楚庄王问鼎轻重，对曰「在德不在鼎」，楚子乃退。"},{id:"zhou_dan_mu",name:"单穆公",title:"周之卿士",state:"zhou",city:"luoyi",birth:-570,death:-510,role:"minister",stats:{wu:36,zhi:84,zheng:82,mei:66},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"绝民用以实王府，犹塞川原而为潢污也。",desc:"周景王时将铸大钱，单穆公谏以「绝民用以实王府」之害。"},{id:"qi_bao",name:"齐鲍叔牙",title:"齐之大夫",state:"qi",city:"linzi",birth:-716,death:-644,role:"minister",stats:{wu:44,zhi:82,zheng:84,mei:70},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"君若欲霸王，非管夷吾不可。",desc:"与管仲友善，荐之为相。管仲曰「生我者父母，知我者鲍子也」。"},{id:"qi_yan_ruo",name:"齐晏弱",title:"齐之大夫",state:"qi",city:"linzi",birth:-620,death:-556,role:"minister",stats:{wu:40,zhi:78,zheng:76,mei:66},skills:{quanmou:6,biancai:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"晏氏世为齐卿。",desc:"晏婴之父，齐之世卿。"},{id:"qi_cui_wu",name:"齐崔杼",title:"齐之大夫",state:"qi",city:"linzi",birth:-620,death:-546,role:"minister",stats:{wu:56,zhi:74,zheng:66,mei:58},skills:{quanmou:8,bingfa:5},bias:"li",pref:"ma",teach:["quanmou"],quote:"吾弑其君，太史书之。",desc:"弑齐庄公，太史书「崔杼弑其君」，杀之；其弟继书，乃止。"},{id:"qi_chen_qi",name:"齐陈乞",title:"齐之大夫",state:"qi",city:"linzi",birth:-560,death:-485,role:"minister",stats:{wu:42,zhi:82,zheng:72,mei:60},skills:{quanmou:9},bias:"li",pref:"yu",teach:["quanmou"],quote:"陈氏厚施，民归之矣。",desc:"陈僖子，以大斗贷、小斗收，收齐国之民心，陈氏自此专齐。"},{id:"jin_zhao_dun",name:"赵盾",title:"晋之正卿",state:"jin",city:"jiang",birth:-650,death:-601,role:"minister",stats:{wu:50,zhi:86,zheng:84,mei:66},skills:{quanmou:8,bingfa:6},bias:"yi",pref:"si",teach:["quanmou","bingfa"],quote:"冬日之日，夏日之日。",desc:"晋之正卿，专国政二十年。太史书「赵盾弑其君」，孔子曰「越竟乃免」。"},{id:"jin_shi_hui",name:"士会",title:"晋之大夫",state:"jin",city:"jiang",birth:-640,death:-580,role:"minister",stats:{wu:48,zhi:86,zheng:82,mei:64},skills:{quanmou:8,biancai:7},bias:"yi",pref:"si",teach:["quanmou","biancai"],quote:"民之多幸，国之不幸也。",desc:"晋之贤大夫，随武子。历事四君，为政宽而有法。"},{id:"jin_han_xuan",name:"韩宣子",title:"晋之正卿",state:"jin",city:"jiang",birth:-600,death:-541,role:"minister",stats:{wu:40,zhi:82,zheng:84,mei:68},skills:{quanmou:7,xuewen:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"周礼尽在鲁矣。",desc:"韩起，晋之正卿。聘于鲁，观《易象》与《鲁春秋》，叹「周礼尽在鲁矣」。"},{id:"jin_wei_shu",name:"魏舒",title:"晋之正卿",state:"jin",city:"jiang",birth:-580,death:-509,role:"general",stats:{wu:66,zhi:78,zheng:70,mei:58},skills:{bingfa:8,quanmou:6},bias:"shi",pref:"ma",teach:["bingfa"],quote:"毁车为行。",desc:"魏献子。大原之役毁车为行，以步兵胜狄，开中国步兵之先。"},{id:"chu_zhi_wei",name:"薳子冯",title:"楚之令尹",state:"chu",city:"ying",birth:-600,death:-545,role:"minister",stats:{wu:44,zhi:80,zheng:78,mei:62},skills:{quanmou:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾闻之，君子不以其所能者病人。",desc:"楚之令尹，以病辞位。"},{id:"chu_shen_wu",name:"申无宇",title:"楚之大夫",state:"chu",city:"shen",birth:-600,death:-540,role:"minister",stats:{wu:42,zhi:82,zheng:76,mei:62},skills:{quanmou:6,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"国有大城，未有利也。",desc:"楚之大夫，谏灵王城陈蔡不羹，以「末大必折，尾大不掉」为喻。"},{id:"chu_wu_she",name:"伍奢",title:"楚之太子太傅",state:"chu",city:"ying",birth:-620,death:-522,role:"minister",stats:{wu:46,zhi:84,zheng:80,mei:66},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"王独奈何以谗贼小臣疏骨肉之亲乎？",desc:"伍子胥之父，楚平王杀之，子胥奔吴。"},{id:"qin_you_yu2",name:"秦子车",title:"秦之大夫",state:"qin",city:"yong",birth:-650,death:-600,role:"minister",stats:{wu:44,zhi:78,zheng:74,mei:66},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"三良殉葬，国人哀之。",desc:"子车氏三良之一，秦穆公卒而从死，国人赋《黄鸟》。"},{id:"qin_gu_rui",name:"秦庶长鼌",title:"秦之庶长",state:"qin",city:"yong",birth:-540,death:-480,role:"minister",stats:{wu:56,zhi:70,zheng:66,mei:56},skills:{bingfa:6,quanmou:5},bias:"shi",pref:"tie",teach:["bingfa"],quote:"庶长专秦政。",desc:"秦之庶长，逼怀公自杀，专秦国之政。"},{id:"lu_zang_wen",name:"臧哀伯",title:"鲁之大夫",state:"lu",city:"qufu",birth:-730,death:-680,role:"minister",stats:{wu:36,zhi:82,zheng:80,mei:68},skills:{xuewen:8,biancai:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"君人者，将昭德塞违。",desc:"臧哀伯，鲁之大夫。桓公取郜大鼎于宋，哀伯谏以「昭德塞违」。"},{id:"lu_shu_sun",name:"叔孙豹",title:"鲁之卿",state:"lu",city:"qufu",birth:-600,death:-537,role:"minister",stats:{wu:40,zhi:84,zheng:82,mei:70},skills:{xuewen:8,biancai:8},bias:"yi",pref:"si",teach:["xuewen","biancai"],quote:"太上立德，其次立功，其次立言。",desc:"叔孙穆子，鲁之三桓之一。聘于晋，论「三不朽」。"},{id:"lu_ji_wu_zi",name:"季武子",title:"鲁之正卿",state:"lu",city:"qufu",birth:-620,death:-535,role:"minister",stats:{wu:38,zhi:80,zheng:84,mei:64},skills:{quanmou:7},bias:"li",pref:"yu",teach:["quanmou"],quote:"三分公室，而各有其一。",desc:"季孙宿，鲁之正卿。三分公室而季氏取其二，公室自此卑弱。"},{id:"song_yu_shi",name:"鱼石",title:"宋之大夫",state:"song",city:"shangqiu",birth:-620,death:-560,role:"minister",stats:{wu:42,zhi:74,zheng:70,mei:58},skills:{quanmou:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾出奔楚，终归于宋。",desc:"宋之大夫，出奔楚，后借楚力入于彭城。"},{id:"song_le_xi",name:"乐喜",title:"宋之司城",state:"song",city:"shangqiu",birth:-600,death:-540,role:"minister",stats:{wu:38,zhi:84,zheng:86,mei:70},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"天生五材，民并用之，废一不可。",desc:"宋之司城子罕。宋饥，请出粟以贷，而以门之左为师。"},{id:"zheng_gao_ke",name:"高克",title:"郑之大夫",state:"zheng",city:"xinzheng",birth:-730,death:-670,role:"minister",stats:{wu:48,zhi:70,zheng:66,mei:58},skills:{bingfa:5},bias:"shi",pref:"ma",teach:["bingfa"],quote:"郑伯使我将兵，久而不召。",desc:"郑之大夫，帅师久而不召，师溃而奔陈。"},{id:"zheng_zi_zhan",name:"子展",title:"郑之上卿",state:"zheng",city:"xinzheng",birth:-600,death:-544,role:"minister",stats:{wu:40,zhi:82,zheng:84,mei:66},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"郑之七穆，罕氏为长。",desc:"罕虎之祖，郑之上卿，与子产同秉国政。"},{id:"zheng_ran_ming",name:"然明",title:"郑之大夫",state:"zheng",city:"xinzheng",birth:-580,death:-520,role:"minister",stats:{wu:36,zhi:84,zheng:78,mei:64},skills:{biancai:7,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"视民如伤。",desc:"郑之大夫鬷蔑。子产问政，对曰「视民如伤，岂敢慢之」。"},{id:"wei_shi_que",name:"石碏",title:"卫之大夫",state:"wei",city:"chaoge",birth:-750,death:-700,role:"minister",stats:{wu:44,zhi:80,zheng:84,mei:68},skills:{quanmou:7,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"大义灭亲。",desc:"卫之老臣。子石厚助州吁弑君，石碏设计诛之，《春秋》称「大义灭亲」。"},{id:"wei_ning_wu",name:"宁武子",title:"卫之大夫",state:"wei",city:"diqiu",birth:-660,death:-600,role:"minister",stats:{wu:38,zhi:84,zheng:82,mei:68},skills:{quanmou:7,xuewen:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"邦有道则知，邦无道则愚。",desc:"宁俞，卫之大夫。孔子曰「其知可及也，其愚不可及也」。"},{id:"wei_shi_yu",name:"史鱼",title:"卫之大夫",state:"wei",city:"diqiu",birth:-540,death:-490,role:"minister",stats:{wu:34,zhi:82,zheng:80,mei:66},skills:{biancai:7,xuewen:6},bias:"yi",pref:"si",teach:["biancai"],quote:"尸谏。",desc:"史鰌，卫之大夫。将死，命其子以尸谏灵公用蘧伯玉。孔子称其「直」。"},{id:"wei_qu_bo_yu",name:"蘧伯玉",title:"卫之贤大夫",state:"wei",city:"diqiu",birth:-570,death:-490,role:"minister",stats:{wu:34,zhi:86,zheng:84,mei:72},skills:{xuewen:8,quanmou:7},bias:"yi",pref:"si",teach:["xuewen"],quote:"欲寡其过而未能也。",desc:"蘧瑗，卫之贤大夫。孔子称「君子哉蘧伯玉，邦有道则仕，邦无道则可卷而怀之」。"},{id:"yan_zhao_gong",name:"燕召公",title:"燕之卿",state:"yan",city:"ji",birth:-720,death:-660,role:"minister",stats:{wu:40,zhi:78,zheng:78,mei:64},skills:{quanmou:6,xuewen:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"燕僻北隅，守其宗庙。",desc:"燕之世卿，守宗庙于北隅。"},{id:"yan_guo_wei",name:"郭隗",title:"燕之大夫",state:"yan",city:"ji",birth:-350,death:-280,role:"minister",stats:{wu:34,zhi:84,zheng:82,mei:70},skills:{biancai:8,quanmou:7},bias:"ming",pref:"yu",teach:["biancai"],quote:"王必欲致士，先从隗始。",desc:"燕昭王欲招贤，郭隗曰「先从隗始」，于是乐毅、邹衍皆至。"},{id:"wu_ji_zha",name:"季札",title:"吴之公子",state:"wu",city:"gusu",birth:-580,death:-507,role:"minister",stats:{wu:42,zhi:90,zheng:86,mei:82},skills:{xuewen:10,biancai:9},bias:"yi",pref:"yu",teach:["xuewen","biancai"],quote:"观止矣。若有他乐，吾不敢请已。",desc:"吴之公子，寿梦少子。屡让国而不受，聘于鲁观周乐，叹「观止」。"},{id:"wu_bei_li",name:"被离",title:"吴之大夫",state:"wu",city:"gusu",birth:-540,death:-490,role:"minister",stats:{wu:40,zhi:78,zheng:72,mei:62},skills:{quanmou:6},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾观员之为人，不可亲也。",desc:"吴之大夫，伍子胥之友，后为伯嚭所谗。"},{id:"wu_sun_luo",name:"孙骆",title:"吴之行人",state:"wu",city:"gusu",birth:-520,death:-470,role:"minister",stats:{wu:38,zhi:80,zheng:76,mei:70},skills:{biancai:8},bias:"ming",pref:"si",teach:["biancai"],quote:"吴之行人，通使于晋。",desc:"吴之行人，黄池之会时为吴王通款于晋。"},{id:"yue_ji_ni",name:"计倪",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-470,role:"minister",stats:{wu:36,zhi:84,zheng:80,mei:64},skills:{shanggu:7,suanshu:8},bias:"li",pref:"su",teach:["shanggu","suanshu"],quote:"知斗则修备，时用则知物。",desc:"越大夫计然，善治生。范蠡用其术，十年国富。"},{id:"chen_yuan_tao",name:"辕涛涂",title:"陈之大夫",state:"chen",city:"wanqiu",birth:-680,death:-630,role:"minister",stats:{wu:40,zhi:76,zheng:74,mei:62},skills:{quanmou:6,biancai:6},bias:"yi",pref:"si",teach:["quanmou"],quote:"师出于陈郑之间，国必甚病。",desc:"陈之大夫。齐桓公伐楚还，欲道于陈郑，涛涂诱之东归，致齐师陷于沛泽。"},{id:"chen_kong_ning",name:"孔宁",title:"陈之大夫",state:"chen",city:"wanqiu",birth:-640,death:-590,role:"minister",stats:{wu:38,zhi:66,zheng:60,mei:58},skills:{quanmou:4},bias:"li",pref:"yu",teach:["quanmou"],quote:"吾与夏姬，戏于朝。",desc:"陈之大夫，与仪行父同通于夏姬，后奔楚。"},{id:"cai_sheng_zi",name:"蔡声子",title:"蔡之大夫",state:"cai",city:"shangcai",birth:-620,death:-560,role:"minister",stats:{wu:36,zhi:82,zheng:76,mei:66},skills:{biancai:8,quanmou:6},bias:"yi",pref:"si",teach:["biancai"],quote:"楚多淫刑，其大夫逃死于四方。",desc:"蔡之声子，与伍举善。使晋还楚，为伍举游说，复其位。"},{id:"cao_xi_fu",name:"僖负羁",title:"曹之大夫",state:"cao",city:"tao",birth:-690,death:-630,role:"minister",stats:{wu:40,zhi:78,zheng:74,mei:66},skills:{quanmou:6,biancai:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"晋公子贤，而穷于外，从者皆国器。",desc:"曹之大夫。晋文公过曹，曹共公观其骈胁，僖负羁独馈盘飧置璧。后晋伐曹，免其族。"},{id:"ju_wan",name:"莒仆",title:"莒之大夫",state:"ju",city:"ju",birth:-600,death:-550,role:"minister",stats:{wu:42,zhi:72,zheng:66,mei:58},skills:{quanmou:5},bias:"shi",pref:"ma",teach:["quanmou"],quote:"莒虽小，可持其政。",desc:"莒之大夫，为政于莒。"},{id:"zhu_mao",name:"茅地",title:"邾之大夫",state:"zhu",city:"zhu",birth:-580,death:-530,role:"minister",stats:{wu:38,zhi:72,zheng:68,mei:58},skills:{quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"邾事鲁，不敢违。",desc:"邾之大夫，从政于鲁邾之间。"},{id:"xu_bai_feng",name:"许伯",title:"许之大夫",state:"xu",city:"xu",birth:-660,death:-610,role:"minister",stats:{wu:40,zhi:74,zheng:70,mei:60},skills:{quanmou:5},bias:"yi",pref:"si",teach:["quanmou"],quote:"许事楚，不敢有二。",desc:"许之大夫，从君迁于楚。"},{id:"qi_tian_rang_ju2",name:"田穰苴",title:"齐之大司马",state:"qi",city:"linzi",birth:-590,death:-520,role:"general",stats:{wu:88,zhi:82,zheng:68,mei:60},skills:{bingfa:10,jianshu:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"将受命之日则忘其家。",desc:"即司马穰苴，田完之后。斩监军庄贾以立威，晋燕之师闻风而退。"},{id:"qi_guan_zhi_fu",name:"管至父",title:"齐之大夫",state:"qi",city:"linzi",birth:-720,death:-685,role:"general",stats:{wu:60,zhi:68,zheng:62,mei:56},skills:{bingfa:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"及瓜而代。",desc:"齐之大夫，与连称戍葵丘，瓜时而往，曰「及瓜而代」。期至而不代，遂弑襄公。"},{id:"jin_xian_zhen2",name:"荀林父",title:"晋之中军元帅",state:"jin",city:"jiang",birth:-620,death:-593,role:"general",stats:{wu:74,zhi:82,zheng:74,mei:60},skills:{bingfa:8,quanmou:6},bias:"yi",pref:"ma",teach:["bingfa"],quote:"吾为元帅，师不用命，是吾罪也。",desc:"荀伯，晋之中军元帅。邲之战败于楚，请死，晋侯不许。"},{id:"jin_xi_bo",name:"郤克",title:"晋之上卿",state:"jin",city:"jiang",birth:-600,death:-583,role:"general",stats:{wu:76,zhi:78,zheng:72,mei:52},skills:{bingfa:8},bias:"shi",pref:"tie",teach:["bingfa"],quote:"所不此报，无能涉河。",desc:"郤献子，跛而眇。使齐受辱，后帅师败齐于鞍。"},{id:"jin_luan_shu2",name:"荀罃",title:"晋之武子",state:"jin",city:"jiang",birth:-600,death:-560,role:"general",stats:{wu:70,zhi:86,zheng:78,mei:62},skills:{bingfa:9,quanmou:7},bias:"yi",pref:"si",teach:["bingfa"],quote:"吾不难以身易国。",desc:"荀罃，晋之智将。邲之战为楚所俘，九年后归，后主晋国之政。"},{id:"chu_pan_dang",name:"潘党",title:"楚之将军",state:"chu",city:"ying",birth:-620,death:-580,role:"general",stats:{wu:78,zhi:70,zheng:60,mei:56},skills:{bingfa:7,jianshu:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"臣闻克敌必示子孙。",desc:"楚之将军，邲之战后请筑京观，庄王不许。"},{id:"chu_zi_fan2",name:"子反",title:"楚之大司马",state:"chu",city:"ying",birth:-620,death:-575,role:"general",stats:{wu:76,zhi:72,zheng:62,mei:58},skills:{bingfa:8},bias:"li",pref:"yu",teach:["bingfa"],quote:"吾不能以见先君。",desc:"公子侧，楚之大司马。鄢陵之败，因醉误军，自杀。"},{id:"chu_tang_mei",name:"唐昧",title:"楚之将",state:"chu",city:"ying",birth:-560,death:-500,role:"general",stats:{wu:74,zhi:68,zheng:58,mei:54},skills:{bingfa:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"楚师虽众，将不一也。",desc:"楚之将，与吴争于江淮。"},{id:"qin_meng_ming",name:"孟明视",title:"秦之将军",state:"qin",city:"yong",birth:-660,death:-600,role:"general",stats:{wu:80,zhi:74,zheng:64,mei:58},skills:{bingfa:8,jianshu:6},bias:"shi",pref:"ma",teach:["bingfa"],quote:"吾未获一军，敢不自勉。",desc:"百里视，百里奚之子。殽之败而后修政，终败晋师于王官，秦霸西戎。"},{id:"qin_xi_qi_shu",name:"西乞术",title:"秦之将军",state:"qin",city:"yong",birth:-660,death:-600,role:"general",stats:{wu:74,zhi:70,zheng:62,mei:56},skills:{bingfa:7},bias:"shi",pref:"tie",teach:["bingfa"],quote:"三将俱没，幸得归国。",desc:"蹇叔之子，与孟明视同败于殽。"},{id:"lu_cao_mo",name:"曹沫",title:"鲁之将",state:"lu",city:"qufu",birth:-700,death:-660,role:"general",stats:{wu:82,zhi:64,zheng:56,mei:60},skills:{jianshu:9,bingfa:5},bias:"yi",pref:"tie",teach:["jianshu"],quote:"齐强鲁弱，君其图之。",desc:"即曹刿。长勺之战以「一鼓作气」败齐。一说齐桓公会鲁，曹沫执匕首劫之，尽返鲁地。"},{id:"lu_shu_liang_he",name:"叔梁纥",title:"鲁之陬邑大夫",state:"lu",city:"qufu",birth:-622,death:-549,role:"general",stats:{wu:90,zhi:62,zheng:58,mei:62},skills:{jianshu:8,sheshu:7,bingfa:5},bias:"shi",pref:"tie",teach:["jianshu","sheshu"],quote:"有力如虎。",desc:"孔子之父。偪阳之战以双手托悬门，救出诸侯之师。"},{id:"wu_fu_gai",name:"夫概",title:"吴之将军",state:"wu",city:"gusu",birth:-540,death:-490,role:"general",stats:{wu:78,zhi:68,zheng:58,mei:56},skills:{bingfa:7},bias:"shi",pref:"ma",teach:["bingfa"],quote:"吾兄在楚，吾当归国。",desc:"阖闾之弟。吴入郢，夫概先归自立，为阖闾所败，奔楚。"},{id:"yue_zhu_ji",name:"诸稽郢",title:"越之大夫",state:"yue",city:"kuaiji",birth:-540,death:-480,role:"general",stats:{wu:70,zhi:80,zheng:70,mei:64},skills:{bingfa:7,biancai:7},bias:"yi",pref:"si",teach:["bingfa"],quote:"请为吴王前马。",desc:"越大夫，善辞令。夫椒之败后为使于吴，卑辞厚礼以存越。"},{id:"yue_ling_gu",name:"灵姑浮",title:"越之将军",state:"yue",city:"kuaiji",birth:-560,death:-500,role:"general",stats:{wu:82,zhi:66,zheng:56,mei:58},skills:{jianshu:8,bingfa:6},bias:"shi",pref:"tie",teach:["jianshu"],quote:"伤吴王趾。",desc:"越之将军。檇李之战，以戈击吴王阖闾，伤其趾，阖闾遂死。"},{id:"song_hua_ou",name:"华耦",title:"宋之司马",state:"song",city:"shangqiu",birth:-620,death:-580,role:"general",stats:{wu:70,zhi:72,zheng:64,mei:58},skills:{bingfa:7},bias:"yi",pref:"ma",teach:["bingfa"],quote:"宋之司马，帅师从晋。",desc:"宋之司马，屡从晋师。"},{id:"song_xiang_dai",name:"向带",title:"宋之大夫",state:"song",city:"shangqiu",birth:-620,death:-575,role:"general",stats:{wu:66,zhi:70,zheng:62,mei:56},skills:{bingfa:6},bias:"shi",pref:"tie",teach:["bingfa"],quote:"宋虽小，亦有死士。",desc:"宋之大夫，帅师御楚。"},{id:"wei_sun_liang",name:"孙良夫",title:"卫之大夫",state:"wei",city:"diqiu",birth:-620,death:-570,role:"general",stats:{wu:68,zhi:74,zheng:66,mei:58},skills:{bingfa:7,quanmou
