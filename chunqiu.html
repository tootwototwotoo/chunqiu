e:-1,rel:-2}},{title:"延请名师",desc:"大夫命你前往曲阜，延请一位老儒来学宫讲学。",mode:"travel",targetCity:"qufu",days:20,reward:{money:60,fame:4,merit:6}}),T("refugees","招抚流民","domestic","yi",!0,"大夫","掌民政","邻县战乱，流民涌入。大夫既想安置，又怕粮食与治安。",[p("流民越来越多，城中粮食撑得住吗？",r("yi","hit","先授荒田与粮种，让他们自食其力，不靠施粥。","大夫点头：「授人以田，比施粥长久。」"),r("li","reason","可向邻县买粮，先撑过这两个月。","他说：「买粮要钱，钱又从哪里来？」"),r("ming","evade","从前齐国也收留过大批流民。","他反问：「齐国有管仲，我们有什么？」")),p("流民中若混入盗匪与间谍，治安怎么办？",r("yi","hit","编户互保，选出流民中的长者管事，官只监督。","大夫道：「以流民治流民，倒省力。」"),r("shi","reason","派兵驻在流民营外，先震慑住。","他皱眉：「兵一多，流民又该逃了。」"),r("ming","evade","严查路引，来历不明者一概驱逐。","他叹：「赶走了，他们还是会在别处生乱。」")),p("本地百姓怕流民抢田抢水，怨言很大，怎么安抚？",r("yi","hit","只授无主荒田，不减本地人水权，两边都交代得过去。","大夫颔首：「不夺本地之利，这话在理。」"),r("li","reason","让流民给本地富户做工，各取所需。","他想了想：「这倒能少些冲突。」"),r("shi","evade","谁敢闹事就抓谁，不必多费口舌。","他反问：「抓得完吗？」"))],A("荒田清册",0,"你出示清册：城西有三百顷无主荒田，可供安置。"),{success:"流民渐安，荒田得到开垦。",compromise:"大夫同意安置，但要你负责编户与巡查。",fail:"流民被逐，城外哭声不绝。"},{success:{fame:6,rel:7},compromise:{fame:2,rel:4},fail:{fame:-3,rel:-4}},{title:"安置流民",desc:"大夫命你前往城西，编户授田，安置流民。",mode:"check",checkSkill:"quanmou",dc:42,days:16,reward:{money:50,fame:4,merit:6}}),T("clans","严惩豪强","domestic","shi",!0,"司寇","掌刑狱","豪强兼并田产、隐匿人口，司寇想办，却怕其朝中靠山。",[p("豪强在朝中有靠山，动他会不会引火烧身？",r("shi","hit","先把他与靠山的书信坐实，再一并上奏君上。","司寇目光一凝：「有凭有据，才动得了。」"),r("li","reason","可用重金买通其门客，先摸清虚实。","他点头：「这法子稳妥些。」"),r("yi","evade","王子犯法与庶民同罪，何惧靠山。","他低声道：「话是这么说，刀却未必落得下去。」")),p("查抄需要兵丁，城中的兵肯不肯为你所用？",r("shi","hit","借君上亲兵一用，既快又不敢走漏风声。","司寇道：「有亲兵压阵，事可成。」"),r("li","reason","重赏之下必有勇夫，多给些赏钱便是。","他摇头：「怕的是赏钱买不来胆。」"),r("ming","evade","按旧制，刑狱之事本就该由司寇调兵。","他苦笑：「旧制管用，我就不用坐在这里发愁了。」")),p("豪强的田产查抄之后，如何处置才不会落入另一批人手里？",r("shi","hit","田产充公，分授无地贫民，堵住旁人觊觎。","司寇点头：「散之于民，最干净。」"),r("li","reason","公开发卖，所得入府库。","他说：「公开发卖，总有人能低价吃下。」"),r("yi","evade","归还被侵占的原主便是。","他反问：「原主早被逼死了，还给谁？」"))],A("往来密信",0,"你呈上豪强与朝中权贵的往来密信，罪证确凿。"),{success:"豪强伏法，田产分授贫民。",compromise:"司寇同意查办，但要你带人查抄其庄院。",fail:"查办反被参倒，豪强更加骄横。"},{success:{fame:7,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-5}},{title:"查抄豪强",desc:"司寇命你率人查抄豪强庄院，缉拿首恶。",mode:"combat",enemy:{name:"豪强家将",wu:58,skill:3,hp:95},days:12,reward:{money:90,fame:5,merit:12}}),T("fields","推行新田制","domestic","li",!0,"执政","当国","旧田制下隐匿田亩甚多，执政想重新丈量，触动豪强与农民两头。",[p("豪强隐匿田亩，丈量时必会百般阻挠，怎么下手？",r("li","hit","先丈量无主与公田，做出样子，再查私田。","执政道：「先易后难，阻力小些。」"),r("shi","reason","收买几个小吏做内应，摸清底册。","他沉吟：「用间可以，但要防他们反咬。」"),r("yi","evade","只要出于公心，他们总不敢公然抗命。","他反问：「公然抗命的事，你见得还少吗？」")),p("农民怕重新丈量后赋税更重，不肯配合怎么办？",r("li","hit","明令丈量后按新亩减一成赋，让他们得实惠。","执政点头：「先予后取，农民才会配合。」"),r("yi","reason","丈量是为了均平，对他们也是好事。","他叹：「他们没见过均平，只见过加赋。」"),r("ming","evade","从前商君变法，也是先难后易。","他淡淡道：「商君最后是什么下场？」")),p("丈量需要大量人手，还要防人做假账，怎么办？",r("li","hit","三组人交叉丈量，互相对账，做假必露。","执政道：「交叉复核，倒是个办法。」"),r("shi","reason","派兵监督，量错者重罚。","他说：「罚得重，也未必量得准。」"),r("ming","evade","按旧册略作修补，不必大动干戈。","他摇头：「旧册若准，我何必重丈？」"))],A("旧田底册",1,"你出示旧底册：其中三十余处田界与实地方位不符。"),{success:"新田制推行，赋税渐均。",compromise:"执政同意丈量，但要你先带人实测一乡。",fail:"丈量半途而废，豪强更加隐匿田亩。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-4}},{title:"丈量田亩",desc:"执政命你带人实测一乡田亩，厘清旧册之误。",mode:"check",checkSkill:"suanshu",dc:46,days:18,reward:{money:70,fame:3,merit:10}}),T("prices","平抑粮价","domestic","li",!0,"司徒","掌财赋","粮价飞涨，粮商囤积居奇，司徒既怕民怨，又怕官粮不足。",[p("粮商囤积不卖，官仓存粮又不多，怎么压价？",r("li","hit","每日少量平价售官粮，粮商怕砸手里，自会跟价。","司徒点头：「以小搏大，可以一试。」"),r("shi","reason","查抄几家囤粮大户，杀一儆百。","他说：「查抄容易，善后难。」"),r("ming","evade","从前李悝平籴，也是官府出粮。","他反问：「李悝有粮，我有吗？」")),p("若把官粮卖光了，来年青黄不接时怎么办？",r("li","hit","只卖三成，余粮留作种子与赈济，同时向邻国籴粮。","司徒道：「留有余地，才算稳妥。」"),r("yi","reason","百姓眼下就要饿死，顾不得来年了。","他叹：「顾了眼下，来年还是要死人。」"),r("ming","evade","按旧例，官仓本就该在此时出粮。","他摇头：「旧例也没说卖光。」")),p("邻国若趁机禁籴、抬价，又该如何？",r("li","hit","用盐铁与他们对换，绕过粮禁。","司徒目光一亮：「以货易粮，他们未必不肯。」"),r("shi","reason","陈兵边境，逼他们开籴。","他皱眉：「为一石粮动兵，未免太险。」"),r("yi","evade","天下总有仁义之国，不会见死不救。","他苦笑：「仁义之国，也得先顾自己。」"))],A("粮商账目",0,"你出示粮商账目：三家大户囤粮逾万石，足够城中两月。"),{success:"粮价渐平，民心稍安。",compromise:"司徒同意平价售粮，但要你负责向邻国籴粮。",fail:"粮价继续飞涨，城中出现抢粮。"},{success:{fame:5,rel:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"调运官粮",desc:"司徒命你前往邻邑，调运官粮入城。",mode:"travel",targetCity:"pengcheng",days:16,reward:{money:80,fame:3,merit:6}})];var vs=[T("alliance","齐楚结盟","diplomacy","shi",!0,"楚使","大夫","齐楚连年对峙，楚国遣使试探结盟。楚使老练，句句不离利害与兵力。",[p("结盟可以，但楚国凭什么相信齐国不会背后捅刀？",r("shi","hit","两国各遣一支质子军驻于边境，互相牵制。","楚使点头：「彼此都有人质在手，倒公平。」"),r("yi","reason","既已歃血为盟，便当以信义相待。","他淡笑：「信义若能挡兵，天下早太平了。」"),r("ming","evade","当年齐桓公与楚成王也曾会盟。","他反问：「那一次，最后是谁先退的兵？」")),p("晋国若从中作梗，齐国扛得住吗？",r("shi","hit","齐楚先约定互不攻伐，晋国便不敢轻动。","楚使道：「先稳住背后，才谈得上联手。」"),r("li","reason","可许晋国一些边邑，换他中立。","他皱眉：「割地求和，晋国会更贪。」"),r("yi","evade","晋国若兴不义之兵，天下共讨之。","他哂笑：「天下共讨？谁来讨？」")),p("盟约总要有个凭信，空口白话可不行。",r("shi","hit","以两国边邑互换为质，再加盟书与质子。","楚使道：「有地有质，才算真盟。」"),r("ming","reason","可仿照葵丘之会，束牲载书，昭告诸侯。","他说：「仪式虽好，终究不如实利。」"),r("yi","evade","君子一言，驷马难追，何须多此一举。","他大笑：「君子？你我都是替国君办事的人。」"))],A("边境舆图",2,"你展开舆图，指出两国可互换的两处边邑，轻重相当。"),{success:"齐楚盟成，晋国暂时按兵不动。",compromise:"楚使同意结盟，但要你亲赴郢都送盟书。",fail:"盟议破裂，两国边境再度紧张。"},{success:{fame:7,rel:8,merit:8},compromise:{fame:3,rel:4},fail:{fame:-3,rel:-4}},{title:"送盟书",desc:"楚使请你亲赴郢都，将盟书呈交楚王。",mode:"travel",targetCity:"ying",days:22,reward:{money:90,fame:5,merit:10}}),T("passage","借道伐虢","diplomacy","li",!0,"虞公","虞国国君","晋国欲借虞道伐虢，虞公贪图晋国献礼，又怕引狼入室。",[p("晋国借道，说是只伐虢国，可谁能保证他不顺手灭虞？",r("li","hit","可要求晋军过境时不得入城，并由虞军沿途监军。","虞公点头：「有兵跟着，总比空口许诺强。」"),r("yi","reason","晋国既以礼来借，想必不会背信。","他犹豫：「礼数归礼数，兵在他手里。」"),r("ming","evade","从前晋文公也借过道，并未失信。","他反问：「晋文公是晋文公，如今这位是吗？」")),p("晋国送来的宝玉良马，收下会不会烫手？",r("li","hit","可以收，但先要晋国写下过境不入城的盟书。","虞公笑道：「礼照收，规矩也照立。」"),r("shi","reason","收下便是，虞国据险而守，晋军未必敢动。","他沉吟：「据险而守，也要守得住才行。」"),r("yi","evade","无功受禄，终究不妥，还是退回去吧。","他脸一沉：「退回去？你让寡人如何下台。」")),p("虢国若来报复，虞国挡得住吗？",r("li","hit","与晋约定，虢国来犯时晋军须回师相助。","虞公道：「拉晋国一起担着，才算稳妥。」"),r("shi","reason","虢国小国，未必敢来。","他摇头：「小国背后，未必没有大国。」"),r("yi","evade","虞虢同姓，本应互相扶持，不该兵戎相见。","他冷笑：「同姓？同姓才更要提防。」"))],A("晋使密简",1,"你出示截获的晋使密简：晋军粮道只备了单程。"),{success:"晋军借道而去，虞国暂时无恙。",compromise:"虞公同意借道，但要你负责操办过境礼。",fail:"虞公收礼借道，晋军回师时顺手灭了虞国。"},{success:{fame:4,rel:6,merit:6},compromise:{fame:2,rel:3},fail:{fame:-5,rel:-8}},{title:"筹措过境礼",desc:"虞公命你筹措借道所需的过境礼。",mode:"check",checkSkill:"shanggu",dc:44,days:14,reward:{money:60,fame:2,merit:6}}),T("marriage","联姻结好","diplomacy","ming",!0,"国君","国君","国君欲与强国联姻，以固邦交，但宗室与大臣各有顾虑。",[p("宗室反对与蛮夷联姻，说是有辱宗庙，你怎么看？",r("ming","hit","可请天子赐婚，有了王命，宗室便无话可说。","国君点头：「借天子之名，倒是个办法。」"),r("li","reason","联姻能换来边市与盟约，实利在手。","他叹：「实利虽好，宗室却只谈名分。」"),r("yi","evade","婚姻本就该以两国之好为重。","他反问：「两国之好，能管几代？」")),p("嫁妆若给得太薄，对方会不会觉得我们没有诚意？",r("ming","hit","礼数做足，但陪嫁只给器物与工匠，不给土地。","国君道：「有面子，也不伤根本。」"),r("li","reason","多给些财货，反正联姻之后还能通商。","他摇头：「财货一给出去，就回不来了。」"),r("shi","evade","强国若真在意嫁妆，那这盟约也不牢靠。","他苦笑：「话虽如此，寡人还是怕。」")),p("对方若只是假意联姻，转头又与他人结盟呢？",r("ming","hit","盟书中写明：若背盟，则天下共讨之。","国君道：「先把大义占住，他不敢太放肆。」"),r("shi","reason","在边境屯一支兵，对方自然会掂量。","他说：「屯兵要钱，国库吃紧。」"),r("yi","evade","既结秦晋之好，便当以诚相待。","他叹：「寡人倒是想诚，只怕对方不诚。」"))],A("宗室谱牒",0,"你出示宗室谱牒：远支女子仍可算作公族，礼数上说得过去。"),{success:"婚姻既定，两国交好。",compromise:"国君同意联姻，但要你亲自送聘礼。",fail:"联姻之议被宗室否决，邦交转冷。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"送聘礼",desc:"国君命你护送聘礼前往临淄。",mode:"travel",targetCity:"linzi",days:20,reward:{money:80,fame:4,merit:5}}),T("hostage","交换质子","diplomacy","yi",!0,"大夫","掌邦交","两国互不信任，约定交换质子。大夫既怕质子受苦，又怕对方毁约。",[p("质子到了对方手里，若对方翻脸，质子的性命如何保障？",r("yi","hit","以礼相待、以师友相托，让对方不忍加害。","大夫点头：「以礼结之，比刀兵更稳。」"),r("shi","reason","也在边境屯兵，对方不敢轻举妄动。","他说：「兵能逼他不敢杀，却不能逼他善待。」"),r("ming","evade","从前晋惠公在秦为质，最后也平安归国。","他反问：「晋惠公归国后，又做了什么？」")),p("大臣们说质子是奇耻大辱，不愿送自己的儿子，怎么办？",r("yi","hit","既是为国，公族子弟当先，群臣便无话可说。","大夫叹道：「公族先送，才算公道。」"),r("ming","reason","可选旁支子弟，厚加封赏，以安其心。","他点头：「旁支子弟，总是好说话些。」"),r("shi","evade","谁敢不从，便以军法从事。","他摇头：「逼出来的质子，到了敌国也未必可靠。」")),p("对方若收下质子却不肯交换，我们怎么办？",r("yi","hit","先送质子，但换回之人须先到边境，双方同时放人。","大夫道：「同时放人，谁也别想赖账。」"),r("shi","reason","可扣下对方在边境的商队作押。","他皱眉：「商队无辜，传出去不好听。」"),r("ming","evade","天下诸侯都在看着，对方不敢如此无信。","他苦笑：「他们若怕人看，就不会打仗了。」"))],A("质子仪注",0,"你出示旧仪注：同时放人、互派师保，可保质子平安。"),{success:"质子交换顺利，两国暂时相安。",compromise:"大夫同意交换，但要你亲自护送质子。",fail:"交换失败，两国互相指责。"},{success:{fame:5,rel:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"护送质子",desc:"大夫命你护送质子前往新郑，换回本国公子。",mode:"travel",targetCity:"xinzheng",days:18,reward:{money:70,fame:4,merit:6}}),T("meeting","会盟争长","diplomacy","ming",!0,"大夫","掌礼","诸侯会盟，谁先歃血谁为长。大夫想争，又怕得罪晋楚。",[p("晋楚都比我们强，争这个盟主之位，值得吗？",r("ming","hit","不求盟主，只求史册记明我国未曾屈从。","大夫点头：「留名而不争实，倒也体面。」"),r("shi","reason","可联合几个小国，先造成既成事实。","他说：「小国靠得住吗？风一吹就散。」"),r("yi","evade","盟主之位，本就该由天子册命。","他叹：「天子若管用，就不会有这会盟了。」")),p("小国们都在观望，怎样才能让他们站到我们这边？",r("ming","hit","许他们在盟书中列名，共享盟约之利。","大夫道：「有名有利，他们自然会来。」"),r("li","reason","给些粮布，先把人请来再说。","他摇头：「给得越多，他们越觉得我们心虚。」"),r("yi","evade","以诚待人，他们总能看见。","他苦笑：「会盟场上，诚字最不值钱。」")),p("若晋楚联手施压，要我们放弃争长，怎么下台？",r("ming","hit","可退一步，但要求由我们执笔记盟，掌盟书之权。","大夫目光一亮：「执笔之人，往往比盟主更要紧。」"),r("shi","reason","先答应，回头再在盟辞上做文章。","他皱眉：「做文章也要有人撑腰。」"),r("yi","evade","大不了一走了之，不与他们同流合污。","他反问：「走了之后呢？他们照样盟。」"))],A("会盟旧档",1,"你出示旧档：某次会盟，执笔者认为盟辞有误，迫诸侯重议。"),{success:"会盟之上，我国不亢不卑，声名大振。",compromise:"大夫同意争长，但要你先行筹备会盟事宜。",fail:"争长失败，诸侯轻视我国。"},{success:{fame:8,rel:5},compromise:{fame:3,rel:2},fail:{fame:-4,rel:-3}},{title:"筹备会盟",desc:"大夫命你前往洛邑，筹备会盟的礼仪与盟书。",mode:"travel",targetCity:"luoyi",days:24,reward:{money:80,fame:5,merit:8}}),T("tribute","朝贡天子","diplomacy","yi",!0,"国君","国君","天子虽微，朝贡之礼不可废。国君既怕贡物不足，又怕路上被盗。",[p("府库不丰，贡物拿不出手，天子会不会怪罪？",r("yi","hit","贡物不在厚薄，而在诚敬，可附一封陈情表。","国君点头：「礼轻情重，天子或能体谅。」"),r("li","reason","向富商借一批珍货，回来自会还上。","他叹：「借来的贡物，终究是债。」"),r("ming","evade","从前齐侯朝周，也只献了几车鱼盐。","他反问：「齐侯有几车鱼盐，我们有什么？」")),p("路上盗匪横行，贡物被劫，颜面何存？",r("yi","hit","轻车简从，贡物分装，纵被劫也不至全失。","国君道：「分装而行，是个办法。」"),r("shi","reason","派一队甲士护送，寻常盗匪不敢动手。","他说：「甲士一动，沿途诸侯便知道贡物贵重。」"),r("ming","evade","打着天子旗号，盗匪总不敢冒犯。","他苦笑：「盗匪若怕天子，就不做盗匪了。」")),p("天子若收下贡物却不给好脸色，这趟岂不是白跑？",r("yi","hit","朝贡本为守礼，不为邀宠，天子如何，是天子的事。","国君肃然：「这话说得好，寡人受教。」"),r("ming","reason","可请随行史官将朝贡之事记入史册。","他点头：「史册一记，便不白走。」"),r("li","evade","天子总要给些回赐，不会让我们吃亏。","他叹：「回赐？如今天子比我们还穷。」"))],A("贡道图",1,"你出示贡道图：绕行南阳可避开盗匪最盛的一段。"),{success:"朝贡成礼，天子嘉许，诸侯侧目。",compromise:"国君同意朝贡，但要你负责押运贡物。",fail:"贡物被劫，天子震怒，国君蒙羞。"},{success:{fame:6,rel:5},compromise:{fame:2,rel:3},fail:{fame:-4,rel:-4}},{title:"押运贡物",desc:"国君命你押运贡物前往洛邑，绕行南阳。",mode:"travel",targetCity:"luoyi",days:22,reward:{money:60,fame:5,merit:8}}),T("mediator","调停两国","diplomacy","yi",!0,"大夫","掌邦交","宋卫交兵，大夫奉命调停。两国各有条件，大国又在背后使力。",[p("宋国要卫国割地，卫国不肯，怎么调停？",r("yi","hit","先让双方停兵，把割地之事交诸侯共议，不使一方独吞。","大夫点头：「先止血，再论是非。」"),r("li","reason","可许宋国一些边市之利，换他放弃割地。","他说：「宋国若贪，边市也填不满。」"),r("shi","evade","谁强就听谁的，我们不必多事。","他正色：「那我们又何必来调停？」")),p("大国在背后支持一方，调停会不会得罪大国？",r("yi","hit","调停以息兵为名，大国若反对，便是好战。","大夫道：「把大义摆在明处，他们不好明着反对。」"),r("ming","reason","可请天子下诏调停，大国总要给天子面子。","他苦笑：「天子的面子，还剩多少？」"),r("shi","evade","先看看大国什么意思，再决定站哪边。","他皱眉：「调停之人若先站队，还调什么？」")),p("两国若表面答应，回头又打起来，谁担保？",r("yi","hit","请几位中立诸侯共同作保，谁先动手便共讨之。","大夫道：「有人作保，他们才会收敛。」"),r("shi","reason","在两国边境驻一支调停之师。","他说：「驻兵要粮，谁出？」"),r("ming","evade","他们既已歃血，总不好意思立刻背盟。","他叹：「背盟的事，史书上还少吗？」"))],A("两国界约",0,"你出示旧界约：争议之地本为两国共有，可先设缓冲区。"),{success:"两国罢兵，边境暂安。",compromise:"大夫同意调停，但要你往来两国传信。",fail:"调停失败，战事再起。"},{success:{fame:7,rel:6},compromise:{fame:3,rel:3},fail:{fame:-3,rel:-4}},{title:"往来传信",desc:"大夫命你往返宋卫两国，传递停兵条件。",mode:"travel",targetCity:"shangqiu",days:18,reward:{money:70,fame:5,merit:8}}),T("fugitive","讨要逃犯","diplomacy","shi",!0,"大夫","掌刑","本国逃犯藏身邻国，邻国收留不交。大夫想强硬，又怕闹成兵祸。",[p("邻国说逃犯是政治避难，不肯交人，怎么反驳？",r("shi","hit","把逃犯所犯的杀人劫财之罪列明，政治避难便站不住。","大夫点头：「先把罪名坐实，他们就没话说了。」"),r("ming","reason","引诸侯盟约：杀人者不得庇护。","他说：「盟约是好，可他们未必认。」"),r("yi","evade","人命关天，邻国总该讲点天理。","他冷笑：「天理？他们只看利益。」")),p("邻国要我们拿三座边邑换人，值不值？",r("shi","hit","不换地，改以商路与粮道作交换，地不可轻割。","大夫道：「以利换人，不动根本。」"),r("li","reason","三座边邑换一个逃犯，也可显我国决心。","他摇头：「决心有了，边患也来了。」"),r("ming","evade","逃犯终究是小事，不必为此大动干戈。","他反问：「他杀的是我国的人，怎么会是小事？」")),p("若邻国始终不交，动不动兵？",r("shi","hit","先陈兵边境，再遣使谈，以兵威逼其交人。","大夫道：「兵临而不战，才是上策。」"),r("yi","reason","为一逃犯兴兵，伤的是两国百姓。","他叹：「这个道理，我也明白。」"),r("ming","evade","可请诸侯共议，以公论压他。","他苦笑：「诸侯共议，议上三年也未必有结果。」"))],A("通缉简",0,"你出示通缉简与苦主血书，逃犯罪行确凿。"),{success:"邻国交人，逃犯伏法。",compromise:"邻国同意交人，但要你跨境缉拿。",fail:"邻国拒绝交人，两国关系恶化。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-4}},{title:"跨境缉拿",desc:"邻国允许你入境，但须自行缉拿逃犯。",mode:"combat",enemy:{name:"亡命逃犯",wu:56,skill:3,hp:90},days:15,reward:{money:80,fame:5,merit:10}}),T("border","边境划界","diplomacy","li",!0,"大夫","掌疆理","两国边境犬牙交错，边民常因田界械斗。大夫想重划边界，却牵动守将与豪族。",[p("旧界早已模糊，按什么标准重划才服人？",r("li","hit","以旧界碑与纳赋册为准，两样都对得上才算数。","大夫点头：「有碑有册，谁也没话说。」"),r("ming","reason","照周室旧制，以山川自然为界。","他说：「山川会改道，旧制未必合用。」"),r("yi","evade","让边民自己协商，官府不必插手。","他反问：「协商得成，还会械斗吗？」")),p("边民已在争议地上耕种多年，重划之后他们怎么办？",r("li","hit","已耕之田不追夺，只约定此后不得再越界开垦。","大夫道：「不翻旧账，才谈得下去。」"),r("yi","reason","都是两国子民，总得给他们一条活路。","他叹：「活路要给，界也要划。」"),r("shi","evade","越界者一律驱逐，不必留情。","他皱眉：「驱了人，边患更深。」")),p("守将说边界一动，防务便要重排，他不肯配合怎办？",r("li","hit","划界之后防务由两国共守，守将的担子反而轻了。","大夫点头：「让他得利，他自然会配合。」"),r("shi","reason","请他一同勘界，给他留足面子。","他说：「面子给足，事才好办。」"),r("ming","evade","守将只管守土，划界是朝廷的事。","他苦笑：「朝廷的令，到了边关未必好使。」"))],A("旧界碑拓",0,"你出示旧界碑拓片，碑文与纳赋册完全吻合。"),{success:"边界重划，边民械斗渐止。",compromise:"大夫同意划界，但要你带人实地勘界。",fail:"划界搁浅，边民继续械斗。"},{success:{fame:4,rel:5,merit:6},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"勘界",desc:"大夫命你带人实地勘界，核定新界碑位置。",mode:"check",checkSkill:"suanshu",dc:44,days:18,reward:{money:60,fame:3,merit:8}}),T("market","通商互市","diplomacy","li",!0,"大夫","掌市","两国欲开边市，大夫既想收关税，又怕走私与间谍混入。",[p("边市一开，走私与间谍混进来怎么办？",r("li","hit","商人入市须验符传，货物登记，市门只开一处。","大夫点头：「一处进出一处查，好管。」"),r("shi","reason","派兵驻市，见疑便搜。","他说：「搜得多了，商人就不来了。」"),r("ming","evade","从前的边市也没有出什么大乱子。","他反问：「从前有现在这么多间谍吗？」")),p("关税定高了商人不来，定低了府库吃亏，怎么定？",r("li","hit","先按邻国市税减半试行一年，看货量再调。","大夫道：「先轻后重，商人跑不了。」"),r("ming","reason","照旧制收取，不偏不倚。","他说：「旧制若合用，边市早开了。」"),r("yi","evade","轻徭薄赋，商人自然云集。","他叹：「薄到府库见底，你又该来劝我加税了。」")),p("边市若成了敌国探子的据点，防务怎么交代？",r("li","hit","市中所售军械与盐铁另立专簿，买卖双方都要具名。","大夫目光一亮：「抓住军械，就抓住要害。」"),r("shi","reason","在市外设卡，可疑者不得入城。","他说：「卡得住人，卡不住消息。」"),r("ming","evade","敌国要探，不设边市也照样探得到。","他苦笑：「话虽如此，我总要给君上一个交代。」"))],A("邻国市税册",1,"你出示邻国市税册：其税率约为我国旧制的六成。"),{success:"边市开张，两国商旅往来。",compromise:"大夫同意互市，但要你先拟定市约。",fail:"互市之议搁置，走私反而更盛。"},{success:{fame:4,rel:5},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"立市约",desc:"大夫命你拟定互市市约，厘定税则与查验之法。",mode:"check",checkSkill:"shanggu",dc:44,days:16,reward:{money:70,fame:3,merit:8}})];var gs=[T("surrender","招降敌将","military","yi",!1,"降将","敌国裨将","敌将兵败被围，愿降却顾虑旧主、部曲与自身待遇。",[p("我旧主待我不薄，如今降你，岂非不义？",r("yi","hit","将军若肯降，我可保你旧主家小周全，不使受害。","降将默然良久：「若能保他家小，我无话可说。」"),r("li","reason","良禽择木而栖，将军何必拘泥旧主。","他冷笑：「良禽？我若卖主，新主敢信我吗？」"),r("shi","evade","你已兵败被围，不降便死。","他昂首：「死便死，何必多言。」")),p("我麾下数百部曲，降后会不会被拆散、清算？",r("ming","hit","部曲仍归将军统领，只换旗号，不散其众。","降将目光一动：「若能保住弟兄们，我愿听命。」"),r("yi","reason","既已归降，便是一家人，我自当一视同仁。","他说：「一视同仁，说来容易。」"),r("li","evade","每人发些钱粮，他们自然会安心。","他反问：「钱花完了呢？」")),p("我若降，能得什么待遇？",r("li","hit","授你田宅，仍领旧部，俸禄比照本国都尉。","降将点头：「有田有兵，才算真心招降。」"),r("yi","reason","待你以客礼，不把你当降虏看待。","他叹：「客礼虽好，终究是客。」"),r("ming","evade","我可保你名节，史册上写你为弃暗投明。","他苦笑：「史册？我只想活着。」"))],A("旧主家书",0,"你出示旧主写给他的家书：旧主已弃他不顾，甚至扣其家小。"),{success:"敌将归降，其部曲尽数为我所用。",compromise:"敌将答应暂不与我为敌，但不肯正式归降。",fail:"敌将拒绝归降，突围而去。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:2},fail:{fame:-1,rel:-3}},null),T("truce","罢兵休战","military","yi",!0,"将军","本国上将军","连年征战，将军想休战，又怕士气受挫、朝廷主战派发难。",[p("将士们刚打了胜仗，此时休战，会不会泄了士气？",r("yi","hit","正因打了胜仗，才该让将士们回家看看，士气反而更稳。","将军点头：「胜后恤兵，才有人肯再战。」"),r("shi","reason","可留一支前锋监视敌境，其余轮休。","他说：「轮休虽好，前锋也苦。」"),r("ming","evade","从前晋文公也是胜后即退。","他反问：「晋文公退了，可晋国还在。」")),p("敌国若趁我们休战重整旗鼓，怎么办？",r("ming","hit","休战盟书写明互不增兵，违者天下共讨。","将军道：「先把大义占住，他才不敢妄动。」"),r("yi","reason","既已答应休战，便当以信义相待。","他叹：「信义是好，可敌国未必讲。」"),r("li","evade","花些钱买通敌国重臣，让他们也主和。","他皱眉：「用钱买来的和，能撑多久？」")),p("朝廷里的主战派说你怯战，你打算怎么应对？",r("yi","hit","我愿上书陈明士卒疲敝、府库空虚，请君上亲裁。","将军道：「把实情说透，君上自会权衡。」"),r("shi","reason","可先与主战派私下沟通，许他们一些军功。","他说：「军功若可私许，军法何在？」"),r("ming","evade","让他们自己去边关看看，就知道仗不好打。","他苦笑：「他们若肯去，就不会主战了。」"))],A("士卒名册",1,"你出示士卒名册：三年未归者过半，逃亡者日增。"),{success:"两国休战，边境得以喘息。",compromise:"将军同意休战，但要你主持交换俘虏。",fail:"休战之议被主战派压下，战事继续。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"交换俘虏",desc:"将军命你前往商丘，主持两国交换俘虏之事。",mode:"travel",targetCity:"shangqiu",days:18,reward:{money:70,fame:4,merit:8}}),T("pursuit","追击残敌","military","shi",!0,"将军","本国将军","敌军溃退，将军想追，又怕伏兵、粮道与俘虏处置。",[p("敌军溃退得太快，会不会是诱敌之计？",r("shi","hit","先派轻骑探路，主力缓进，遇伏可退。","将军点头：「探路而进，稳当。」"),r("ming","reason","败军之将不敢回头，古来如此。","他摇头：「古来也有回头的。」"),r("yi","evade","为将者当以仁心待败军，不必穷追。","他正色：「仁心？他们回头就会杀我们。」")),p("追得太远，粮道拉长，若被截断怎么办？",r("li","hit","只追一日之程，沿途留兵护粮，不贪全功。","将军道：「留兵护粮，才不会前功尽弃。」"),r("shi","reason","速战速决，抢在敌军聚拢之前打完。","他说：「速战虽好，粮草跟不上也是死。」"),r("ming","evade","兵法云穷寇勿追，不如见好就收。","他反问：「你到底是追还是不追？」")),p("俘虏越来越多，杀不得也放不得，怎么处置？",r("yi","hit","愿降者收编，不愿者释归，只扣其甲兵。","将军道：「收其兵而不杀其人，或可收心。」"),r("shi","reason","全部押回后方做苦役，既省粮又防变。","他皱眉：「苦役易生怨，怨极易哗变。」"),r("li","evade","让他们家里拿钱来赎，也算一笔军费。","他冷笑：「拿不出钱的呢？」"))],A("降卒供词",0,"你出示降卒供词：敌军主力已在三十里外设伏。"),{success:"追击败军，俘获甚众，己方损失不大。",compromise:"将军同意追击，但要你带兵清剿余部。",fail:"追击中伏，损兵折将。"},{success:{fame:6,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-3}},{title:"清剿余部",desc:"将军命你率部清剿山中残敌。",mode:"combat",enemy:{name:"残敌渠帅",wu:62,skill:4,hp:100},days:14,reward:{money:90,fame:5,merit:12}}),T("siege","坚守孤城","military","shi",!0,"守将","孤城守将","孤城被围，粮草将尽，援军未至，守将面临粮、援、民心三难。",[p("城中粮草只够半月，是突围还是死守？",r("li","hit","先按人配给，杀马充粮，再撑十日等援军。","守将道：「配给而食，或能撑到援军。」"),r("yi","reason","将士与百姓同食，人心不散，城就不会破。","他叹：「同食容易，同饿难。」"),r("ming","evade","从前即墨守了五年，我们才半月。","他苦笑：「即墨有田单，我们有吗？」")),p("援军迟迟不到，会不会根本不会来了？",r("shi","hit","再派死士突围送信，若十日内无回音，便焚城突围。","守将点头：「先把最坏的打算定下。」"),r("yi","reason","朝廷不会弃孤城于不顾。","他反问：「朝廷若顾，援军为何还不来？」"),r("li","evade","可许突围送信者重赏，总有人肯去。","他说：「重赏之下，未必有敢死之人。」")),p("城中百姓恐慌，有人想开城投降，怎么稳住？",r("yi","hit","把仅有的粮食先分给百姓，让他们知道守将没有弃城。","守将道：「先安民心，城才守得住。」"),r("shi","reason","派兵守住城门，禁止聚众议论。","他皱眉：「压得住一时，压不住一世。」"),r("ming","evade","告诉大家援军明日就到。","他叹：「明日复明日，谁还信？」"))],A("援军回书",1,"你出示援军回书：七日内必至，命守将务必守住。"),{success:"孤城守住，援军至时敌军已退。",compromise:"守将同意死守，但要你出城筹运守城物资。",fail:"城破，守将自刎。"},{success:{fame:8,rel:6,merit:15},compromise:{fame:3,rel:3},fail:{fame:-5,rel:-5}},{title:"筹运守城物资",desc:"守将命你突围筹运箭矢与粮草回城。",mode:"check",checkSkill:"bingfa",dc:48,days:10,reward:{money:70,fame:4,merit:12}}),T("recruit","征募新军","military","li",!0,"将军","本国将军","大战在即，将军要募新军，却缺钱、缺丁、缺训练。",[p("募兵要钱要粮，府库拿得出多少？",r("li","hit","先募千人为限，按现有粮饷定额，不够再募。","将军点头：「量力而募，才不会养不起。」"),r("ming","reason","可向富户募捐，许其子弟为军官。","他说：「富户子弟做军官，士卒未必服。」"),r("yi","evade","保家卫国，有钱人总该出一点。","他冷笑：「有钱人最会算这笔账。」")),p("壮丁都被豪强藏起来了，怎么募得到人？",r("shi","hit","按户籍强征，藏丁者连坐，豪强才不敢藏。","将军道：「连坐之法，倒是能逼出人来。」"),r("li","reason","提高安家钱，壮丁自己就会来。","他说：「钱给多了，府库又撑不住。」"),r("ming","evade","发一道告示，晓以大义便是。","他反问：「大义能当饭吃吗？」")),p("新军未经训练就上阵，等于送死，训练要多久？",r("ming","hit","只教三件事：听鼓、列阵、不逃，一月可成。","将军道：「只教三件事，倒还来得及。」"),r("li","reason","多给军饷，让他们肯卖命就行。","他摇头：「不会列阵，给再多钱也是白死。」"),r("shi","evade","边打边练，打几仗自然就会了。","他叹：「拿命去练，练出来也没几个人了。」"))],A("藏丁名册",1,"你出示名册：城中豪强隐匿壮丁逾两千。"),{success:"新军募成，军容初具。",compromise:"将军同意募兵，但要你负责操练新军。",fail:"募兵不足，将军被迫推迟出兵。"},{success:{fame:4,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"操练新军",desc:"将军命你操练新募之兵，使其能列阵听令。",mode:"check",checkSkill:"bingfa",dc:44,days:20,reward:{money:70,fame:3,merit:10}}),T("grain","军粮筹措","military","li",!0,"司徒","掌粮","大军将发，军粮还差一半。司徒要在府库、运输与豪强之间找粮。",[p("府库拿不出这么多粮，先从哪里想办法？",r("li","hit","先买豪强囤粮，再向邻县借调，双管齐下。","司徒点头：「两条路一起走，才凑得齐。」"),r("shi","reason","强征豪强存粮，谁敢不从？","他说：「强征容易，战后算账难。」"),r("yi","evade","百姓深明大义，自会踊跃输粮。","他苦笑：「大义不能当军粮。」")),p("粮道漫长，若被敌军截断，前线就要断炊。",r("shi","hit","分三路运粮，每路都有兵护，断一路还有两路。","司徒道：「分路而运，稳当。」"),r("li","reason","多给运夫工钱，让他们昼夜兼程。","他说：「人疲了，给钱也走不快。」"),r("ming","evade","可打着王师旗号，敌军不敢截。","他反问：「敌军连王师都敢打，还怕旗号？」")),p("豪强囤粮不卖，等着战后涨价，怎么撬开他们的仓？",r("ming","hit","以爵位相换：输粮千石者赐爵一级。","司徒目光一亮：「以爵换粮，他们求之不得。」"),r("li","reason","按市价加两成收购，总有肯卖的。","他摇头：「他们等的就是更高的价。」"),r("yi","evade","国难当头，他们总该有点良心。","他叹：「良心若有用，我就不用愁了。」"))],A("豪强粮仓册",2,"你出示粮仓册：三家豪强存粮合计逾三万石。"),{success:"军粮筹足，大军如期开拔。",compromise:"司徒同意筹粮，但要你前往陶邑籴粮。",fail:"军粮不足，出兵延期。"},{success:{fame:4,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"籴粮",desc:"司徒命你前往陶邑，向粮商籴买军粮。",mode:"travel",targetCity:"tao",days:16,reward:{money:80,fame:3,merit:10}}),T("deserters","处置逃兵","military","ming",!0,"将军","本国将军","营中逃兵日增，将军要整肃军法，又怕激起哗变。",[p("逃兵按军法当斩，可一下杀太多，营中会不会炸营？",r("ming","hit","只斩首恶与带队者，余者罚役，明告全军。","将军道：「只诛首恶，才不至于人人自危。」"),r("yi","reason","逃兵也有父母妻儿，总该给他们一条生路。","他叹：「生路要给，军法也不能废。」"),r("shi","evade","把逃兵家属抓起来，看谁还敢逃。","他皱眉：「这样做，只会逼更多人逃。」")),p("逃兵说是因为粮饷不发才逃，军中确实有克扣，怎么办？",r("yi","hit","先查克扣军饷之人，当众正法，再论逃兵之罪。","将军肃然：「先正军需，才服众心。」"),r("li","reason","补发欠饷，逃兵自会回来。","他说：「补饷容易，逃了的未必肯回。」"),r("ming","evade","军法就是军法，不能因粮饷而废。","他反问：「军法若只罚小兵，还算军法吗？」")),p("首恶抓到了，可他是老将军的旧部，动不动？",r("shi","hit","把案子公开审，让老将军自己避嫌。","将军点头：「公开审，谁也不好插手。」"),r("ming","reason","先禀明君上，请君上定夺。","他说：「君上若护着他呢？」"),r("yi","evade","念其旧功，免死流放便是。","他叹：「免死流放，别人也照着学。」"))],A("克扣账目",1,"你出示账目：军需官连续三月克扣粮饷，有据可查。"),{success:"军纪整肃，逃兵渐少。",compromise:"将军同意整肃，但要你巡查各营，清查克扣。",fail:"处置失当，营中哗变。"},{success:{fame:5,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"巡查营伍",desc:"将军命你巡查各营，清查克扣粮饷之事。",mode:"check",checkSkill:"bingfa",dc:44,days:15,reward:{money:60,fame:3,merit:10}}),T("exchange","交换战俘","military","yi",!0,"将军","本国将军","两国交换战俘，人数、诚信与战俘意愿都成问题。",[p("对方要多换少，说他们抓的人更值钱，怎么应对？",r("li","hit","按人头与官职折算，列出名册，一人对一人。","将军点头：「有名册，就不能随口开价。」"),r("yi","reason","都是父母生养，何必分贵贱。","他叹：「道理是道理，对方未必认。」"),r("ming","evade","从前交换战俘都是对等的，照旧例便是。","他反问：「旧例能管住眼前这位吗？」")),p("对方若在交换时突然变卦，我们的人岂不是白放？",r("ming","hit","双方同时放人，由中立之国派吏监交。","将军道：「有监交，谁也别想赖。」"),r("yi","reason","既已说定，便当以信义相待。","他摇头：「战场上的信义，最靠不住。」"),r("shi","evade","扣下他们几个贵族，看他们敢不敢变卦。","他皱眉：「这样我们也失了信。」")),p("有些战俘在敌国已成了家，不愿回来，怎么办？",r("yi","hit","愿归者归，愿留者听之，不强迫。","将军沉默片刻：「人各有志，勉强不得。」"),r("ming","reason","按律，战俘须归国，否则除籍。","他说：「除籍容易，人心难收。」"),r("li","evade","给他们一笔安家钱，自然愿意回来。","他反问：「钱花完了，他们还会留吗？」"))],A("战俘名册",0,"你出示名册：双方可交换者各一百二十七人，数目相当。"),{success:"战俘各归其国，两国关系稍缓。",compromise:"将军同意交换，但要你护送战俘回国。",fail:"交换中途破裂，战俘仍陷敌国。"},{success:{fame:5,rel:6,merit:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"护送战俘",desc:"将军命你护送战俘前往朝歌，交还本国。",mode:"travel",targetCity:"chaoge",days:18,reward:{money:60,fame:4,merit:8}}),T("reward","犒赏三军","military","ming",!0,"将军","本国将军","大军凯旋，将军要犒赏，却怕赏额不当、分配不公、财源不足。",[p("府库只够发一半赏钱，怎么安抚将士？",r("li","hit","先发一半现钱，余下以田宅与免役折算。","将军点头：「有钱有田，将士才觉得没白打。」"),r("ming","reason","可先记功，待来年府库宽裕再补。","他摇头：「来年？来年他们还记得吗？」"),r("yi","evade","将士为国而战，不会计较这些。","他苦笑：「不计较？那要看家里有没有米。」")),p("有人杀敌多却官职低，有人靠关系领厚赏，怎么服众？",r("ming","hit","当众核验军功，按首级与战功定赏，关系一概不论。","将军道：「公开核功，谁也说不出话。」"),r("yi","reason","都是为国流血，多分一些给普通士卒。","他叹：「普通士卒要顾，功臣也不能寒心。」"),r("shi","evade","谁敢闹，就按军法处置。","他反问：「闹的人多了，你处置得完吗？」")),p("犒赏之后府库空虚，来年军费从哪里出？",r("li","hit","只赏有功者，裁掉冗员，把军费留给来年。","将军道：「裁冗赏功，倒还撑得住。」"),r("shi","reason","来年再向富户加征，总能补上。","他说：「加征多了，富户也会跑。」"),r("ming","evade","来年的事来年再说，先稳住眼前。","他叹：「眼前稳了，来年就难了。」"))],A("军功簿",1,"你出示军功簿：真正斩首立功者不足三成，余多虚报。"),{success:"赏罚分明，三军欢腾。",compromise:"将军同意犒赏，但要你先核实军功。",fail:"赏赐不公，军中怨言四起。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-4}},{title:"核实军功",desc:"将军命你核实各营军功，剔除虚报。",mode:"check",checkSkill:"suanshu",dc:44,days:14,reward:{money:60,fame:3,merit:10}}),T("captives","处置降卒","military","ming",!1,"降卒","敌国降卒","数千降卒待处置，收编怕哗变，放归怕再战，杀降又不忍。",[p("收编降卒，万一他们阵前倒戈怎么办？",r("ming","hit","打散编入各营，使其无法结党，再以军法约束。","降卒头目沉默：「打散了，我们也没法抱团。」"),r("yi","reason","既已归降，便当一视同仁，以诚相待。","他苦笑：「诚？我们连明天都不知道。」"),r("li","evade","多给粮饷，他们自然肯卖命。","他反问：「粮饷从哪里来？」")),p("降卒听说要被活埋，夜里鼓噪，怎么稳住？",r("shi","hit","当众宣布不杀降，先发一日口粮，乱自会平。","降卒们面面相觑，鼓噪声渐止。"),r("ming","reason","派人进去宣谕军令，只罚首恶，不及其余。","头目道：「只罚首恶，这话我们信不过。」"),r("yi","evade","杀降不祥，将军若开恩，他们必感念。","他叹：「感念？我们只想活着。」")),p("这些降卒的父兄多死在我军手里，旧怨怎么化解？",r("yi","hit","让降卒中的长者出来管事，许他们为死者立冢。","降卒们低声议论，神色稍缓。"),r("ming","reason","把他们调到后方屯田，远离旧战场。","他说：「离得远，怨未必就消。」"),r("li","evade","发一笔抚恤，旧怨总能揭过去。","他冷笑：「死人的命，值几个钱？」"))],A("降卒名册",0,"你出示名册：降卒中大半是被强征的农夫，并非死党。"),{success:"降卒归心，愿为我用。",compromise:"降卒答应不闹事，但要求放归老弱。",fail:"降卒夜叛，营中大乱。"},{success:{fame:4,rel:5,merit:6},compromise:{fame:1,rel:2},fail:{fame:-4,rel:-5}},null)];var bs=[T("landcase","断争田案","court","ming",!0,"司寇","掌刑狱","两户争一亩水田，地契模糊，证人各执一词，其中一方还有豪强撑腰。",[p("地契上年月模糊，怎么断定这田归谁？",r("ming","hit","以旧界碑与历年纳赋记录互证，二者吻合者为真。","司寇点头：「有碑有册，才算铁证。」"),r("yi","reason","让两户各让一步，平分这块田。","他说：「平分看似公道，实则两家都不服。」"),r("shi","evade","谁家势大就判给谁，省得麻烦。","他正色：「那还要司寇做什么？」")),p("证人都被一方收买了，证词能信吗？",r("ming","hit","分开问话，互对细节，假证必露破绽。","司寇道：「分开问，才问得出真话。」"),r("yi","reason","证人若敢作伪证，重罚便是。","他叹：「罚得了一个，罚不了所有。」"),r("li","evade","谁给的钱多，谁的话就更可信。","他冷笑：「照你这么说，案子不必审了。」")),p("另一方背后有豪强施压，你敢不敢判？",r("ming","hit","把案卷公开，判词写明依据，豪强也不好公然插手。","司寇点头：「公开审，才堵得住人情。」"),r("shi","reason","先禀明君上，有君命撑腰再判。","他说：「君上若不肯出头呢？」"),r("yi","evade","王子犯法与庶民同罪，何惧豪强。","他苦笑：「话是这么说，刀笔却在我手里。」"))],A("旧界碑拓",0,"你出示旧界碑拓片：碑文所记与其中一家的纳赋册完全吻合。"),{success:"田界判明，两家无话可说。",compromise:"司寇同意判案，但要你下乡复勘田界。",fail:"判案被豪强压下，田界依旧不清。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"复勘田界",desc:"司寇命你下乡复勘田界，取得实证。",mode:"check",checkSkill:"quanmou",dc:44,days:15,reward:{money:60,fame:3,merit:8}}),T("injustice","平反冤狱","court","yi",!0,"司寇","掌刑狱","一桩旧案已定谳多年，苦主喊冤，司寇想翻案，却牵动原审官与真凶。",[p("案子已定多年，翻案就是打原审官的脸，值得吗？",r("yi","hit","若冤情属实，便该翻；错案不纠，法将不法。","司寇肃然：「这话，我记下了。」"),r("ming","reason","可先私下知会原审官，让他自己请罪。","他点头：「给他留个体面，阻力会小些。」"),r("shi","evade","原审官若敢阻挠，就连他一起办。","他皱眉：「无凭无据，怎么连他一起办？」")),p("真凶早已逃匿，拿不到人，怎么证明是冤案？",r("yi","hit","先找当年证人重问，哪怕只证明一处伪证，也可立案。","司寇道：「先撕开一个口子。」"),r("ming","reason","可发通缉，等真凶落网再翻案。","他叹：「苦主等得到那一天吗？」"),r("shi","evade","把苦主关起来，案子就不会再闹大。","他拍案：「那我还审什么案！」")),p("苦主已家破人亡，翻案之后如何补偿？",r("yi","hit","归还田产，减免赋役，再请君上赐一面旌表。","司寇点头：「有实有礼，才算补偿。」"),r("li","reason","从罚没的赃款里拨一笔给他。","他说：「赃款未必还在。」"),r("ming","evade","给他一个清白名声，也就够了。","他反问：「名声能当饭吃吗？」"))],A("旧案卷宗",1,"你出示旧案卷宗：关键证人的证词前后矛盾，且与现场勘验不符。"),{success:"冤案得雪，真凶伏法。",compromise:"司寇同意重审，但要你先寻访当年证人。",fail:"翻案受阻，苦主含恨而终。"},{success:{fame:7,rel:6},compromise:{fame:3,rel:3},fail:{fame:-4,rel:-4}},{title:"寻访证人",desc:"司寇命你寻访当年证人，重取证词。",mode:"check",checkSkill:"quanmou",dc:46,days:18,reward:{money:60,fame:4,merit:8}}),T("impeach","弹劾权臣","court","shi",!0,"大夫","本国大夫","权臣专权，大夫想弹劾，却苦于证据不足、君意不明、党羽众多。",[p("权臣党羽遍布朝堂，弹劾不成反遭其害，怎么起手？",r("shi","hit","先剪其羽翼，逐个查办其党羽的贪墨，再动首恶。","大夫点头：「先断其爪牙，才动得了根本。」"),r("li","reason","可先放出风声，试探君上与群臣的态度。","他说：「风声一放，他就有了防备。」"),r("yi","evade","只要出于公心，君上总会明白。","他苦笑：「公心？君上先看到的是你的奏章。」")),p("君上倚重权臣，未必肯动他，怎么办？",r("shi","hit","把权臣私通外敌的证据摆出，君上便不能再装看不见。","大夫目光一凛：「有通敌之证，他必死。」"),r("ming","reason","联合几位老臣一同上奏，以众议压君上。","他说：「老臣们未必肯出头。」"),r("yi","evade","君上若执意庇护，我便辞官不做。","他叹：「辞官容易，国事怎么办？」")),p("弹劾成功之后，朝堂空缺由谁填补？",r("ming","hit","举荐寒门贤才，既补空缺，也断权臣旧党复起之路。","大夫点头：「换血要换得干净。」"),r("li","reason","让副手暂代，等局势稳了再选人。","他说：「副手往往也是他的人。」"),r("shi","evade","先把位子空着，看看谁跳出来。","他反问：「空着位子，国事谁管？」"))],A("通敌密信",2,"你出示密信：权臣与敌国使臣往来，约定里应外合。"),{success:"权臣伏法，朝堂为之一清。",compromise:"大夫同意弹劾，但要你先搜集其党羽罪证。",fail:"弹劾失败，大夫被贬。"},{success:{fame:8,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-5,rel:-6}},{title:"搜集罪证",desc:"大夫命你暗中搜集权臣党羽的罪证。",mode:"check",checkSkill:"quanmou",dc:48,days:20,reward:{money:80,fame:4,merit:12}}),T("succession","立储之争","court","ming",!0,"国君","国君","国君年迈，诸子争立。长幼、母族与大臣各执一词。",[p("长子仁弱，幼子聪慧，到底该立谁？",r("ming","hit","立长以安宗庙，再择贤者为辅，名分与才具两全。","国君缓缓点头：「立长而辅以贤，或可两全。」"),r("yi","reason","择贤而立，社稷为重，何必拘泥长幼。","他叹：「择贤？谁来说谁贤？」"),r("shi","evade","谁背后的兵多，就立谁。","他脸色一沉：「那寡人还不如早点退位。」")),p("幼子母族势大，若立长子，他们会不会生乱？",r("ming","hit","立长子的同时，厚封幼子于外邑，使其母族无话可说。","国君目光一动：「分封而安，倒是个法子。」"),r("shi","reason","先夺其母族兵权，再立长子。","他说：「夺兵权容易，结怨也容易。」"),r("yi","evade","都是寡人之子，他们总不至于兵戎相见。","他苦笑：「寡人当年也是这么想的。」")),p("大臣们各有拥立之功的盘算，怎么不让他们结党？",r("ming","hit","立储之事由国君独断，不让大臣预闻，事后再论功。","国君点头：「不给他们机会，才不会有党。」"),r("li","reason","许他们拥立之后各有封赏，他们便不会闹。","他摇头：「封赏越多，胃口越大。」"),r("shi","evade","谁敢结党，就杀谁。","他反问：「杀得完吗？」"))],A("宗室谱牒",0,"你出示宗室谱牒：长子为嫡出，幼子母族虽强，却非正室。"),{success:"储位既定，朝局渐稳。",compromise:"国君同意立储，但要你先联络朝中重臣。",fail:"储位久悬，诸子相争。"},{success:{fame:6,rel:6,merit:8},compromise:{fame:3,rel:3},fail:{fame:-4,rel:-5}},{title:"联络朝臣",desc:"国君命你私下联络朝中重臣，探明立储风向。",mode:"check",checkSkill:"quanmou",dc:46,days:18,reward:{money:70,fame:4,merit:10}}),T("corruption","处置贪墨","court","li",!0,"执政","当国","地方官贪墨赈粮，民怨沸腾。执政要追赃、要牵连、还要平民愤。",[p("贪墨的官把钱花光了，赃款追不回来，怎么办？",r("li","hit","查抄其家产与田宅，不足之数由其上司分赔。","执政道：「上司分赔，才会真的管住下属。」"),r("shi","reason","把他贬为庶人，流放边地，也算惩罚。","他说：「流放了他，百姓的粮还是没回来。」"),r("yi","evade","只要他认罪悔过，便给他一条生路。","他冷笑：「百姓饿死时，谁给他们生路？」")),p("查下去牵连甚广，连执政你的旧部也在其中，怎么办？",r("li","hit","不论亲疏，一律按律查办，我先自请回避。","执政沉默良久：「回避，才能查得下去。」"),r("ming","reason","让御史台独立查案，我不插手。","他点头：「交给御史，倒还公道。」"),r("shi","evade","到此为止，再查下去朝局就乱了。","他反问：「朝局稳了，民心呢？」")),p("民怨已起，百姓要一个交代，怎么安抚？",r("yi","hit","把贪墨所得悉数发还灾民，当众宣读判词。","执政道：「当众发还，民心才服。」"),r("li","reason","再拨一批粮，先把眼前的饥荒压下去。","他说：「拨粮能救急，却救不了心。」"),r("ming","evade","发一道罪己诏，把责任揽到朝廷身上。","他叹：「罪己诏发多了，就没人信了。」"))],A("贪墨账册",0,"你出示账册：赈粮被层层克扣，经手官吏多达十余人。"),{success:"贪官伏法，赃款发还灾民。",compromise:"执政同意查办，但要你负责追缴赃款。",fail:"查办草草收场，民怨更盛。"},{success:{fame:6,rel:6},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"追缴赃款",desc:"执政命你追缴赃款，清点发还。",mode:"check",checkSkill:"suanshu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),T("ritual","宗庙祭祀","court","yi",!0,"国君","国君","宗庙大祭将行，礼制、费用与吉日都有争议。",[p("礼制该照旧典，还是从简？府库并不宽裕。",r("yi","hit","礼贵诚敬，牺牲可减，仪节不可废。","国君点头：「减物不减礼，说得通。」"),r("li","reason","一切从简，省下的钱用于军费。","他皱眉：「祭礼从简，宗室怕要说话。」"),r("ming","evade","照旧典办，免得被人说不敬祖宗。","他叹：「旧典办下来，府库就见底了。」")),p("宗室坚持要用天子规格，可我们只是诸侯，怎么办？",r("yi","hit","按本国爵位行礼，多献一篇颂辞以表敬意。","国君道：「守礼而不僭越，才合本分。」"),r("shi","reason","天子衰微，诸侯用天子礼的也不止我们一家。","他摇头：「别人僭越，我们不能跟着。」"),r("ming","evade","让宗人府去争，寡人不置可否。","他苦笑：「不置可否，最后还是要寡人担名。」")),p("占卜说吉日与农时冲突，百姓要下田，怎么选？",r("yi","hit","祭礼提前一日，既合吉时，也不误农时。","国君点头：「两全其美，就这么办。」"),r("ming","reason","农时可以等，祭礼不能误。","他反问：「误了农时，明年吃什么？」"),r("li","evade","多雇些人来行礼，百姓照常下田。","他说：「雇来的人，行礼能诚吗？」"))],A("旧礼图",1,"你出示旧礼图：诸侯之祭本有减等之礼，并非僭越。"),{success:"祭礼成，宗室与百姓皆无怨言。",compromise:"国君同意从简，但要你主持筹备祭礼。",fail:"祭礼失序，诸侯讥笑。"},{success:{fame:4,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"筹备祭礼",desc:"国君命你筹备宗庙祭礼，核定仪节与用度。",mode:"check",checkSkill:"xuewen",dc:44,days:14,reward:{money:50,fame:3,merit:6}}),T("law","制定刑律","court","ming",!0,"执政","当国","旧刑律已不合时宜，执政要修律，旧族反对、轻重难定、执行更难。",[p("旧族说祖宗之法不可改，怎么回应？",r("ming","hit","刑律随世而变，但可保留旧律中的礼教条款，以示不忘本。","执政点头：「存其礼，改其刑，旧族便无话可说。」"),r("yi","reason","法为治民，不为守旧，该改就得改。","他叹：「道理都对，旧族不会听。」"),r("shi","evade","谁反对就贬谁，看谁还敢说话。","他皱眉：「律未成，先失人心。」")),p("刑轻则奸人不怕，刑重则百姓受苦，怎么定？",r("ming","hit","按罪行轻重分等，赃多者重，过失者轻。","执政道：「分等定罪，才算公允。」"),r("li","reason","重刑之下必有畏服，先镇住再说。","他摇头：「镇得了一时，镇不了一世。」"),r("yi","evade","以德化民，刑罚只是不得已而用。","他反问：「德化得了盗跖吗？」")),p("律令定了，地方官不肯照办，怎么办？",r("ming","hit","把刑律铸于鼎上，公示于市，百姓可据律申冤。","执政目光一亮：「公示于民，官吏便瞒不住。」"),r("shi","reason","派御史巡查，违律者免官。","他说：「御史只有几个人，管不了天下。」"),r("li","evade","把律令与考绩挂钩，办得好的升官。","他叹：「考绩也能造假。」"))],A("旧律残卷",1,"你出示旧律残卷：其中已有按赃论罪的分等之法。"),{success:"新律颁行，吏民有所遵循。",compromise:"执政同意修律，但要你先征询旧臣意见。",fail:"修律受阻，旧律继续沿用。"},{success:{fame:6,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"征询旧臣",desc:"执政命你走访旧臣，征询修律意见。",mode:"check",checkSkill:"xuewen",dc:46,days:18,reward:{money:60,fame:3,merit:8}}),T("merits","朝堂论功","court","ming",!0,"国君","国君","战事方歇，朝堂论功行赏。标准、派系与赏赐都争执不下。",[p("有人斩首多，有人守城有功，谁该居首功？",r("ming","hit","斩首者赏金，守城者授爵，各按其功，不分高下。","国君点头：「各赏其功，便不用争了。」"),r("li","reason","按军功簿上的首级数来定，最简单。","他说：「守城之人，哪来的首级？」"),r("yi","evade","都是为国尽忠，何必分那么清。","他反问：「不分清，谁还肯拼命？」")),p("两派将领各拥其功，互相攻讦，怎么平息？",r("ming","hit","当众宣读军功簿，逐条核对，让两派都无话可说。","国君道：「公开核对，最服人。」"),r("shi","reason","各打五十大板，两边都压一压。","他叹：「压下去，心里还是不服。」"),r("yi","evade","让他们以国事为重，不要再争。","他苦笑：「以国事为重，说来轻巧。」")),p("府库赏赐不够，是先赏功臣还是先补军需？",r("li","hit","先赏战功最著者，其余记功待补，军需另筹。","国君点头：「先赏首功，余者记功，可行。」"),r("ming","reason","先补军需，来年再论功行赏。","他摇头：「将士等不到来年。」"),r("yi","evade","功臣深明大义，会体谅朝廷的难处。","他叹：「体谅一次可以，次次都体谅就寒心了。」"))],A("军功簿",0,"你出示军功簿：守城之功与斩首之功分列，互不掩没。"),{success:"论功得当，朝堂归心。",compromise:"国君同意论功，但要你先核实军功簿。",fail:"论功不公，两派将领离心。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"核实军功",desc:"国君命你核实军功簿，剔除虚报。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:60,fame:3,merit:8}}),T("hunt","劝谏游猎","court","yi",!0,"国君","国君","国君沉迷游猎，荒废朝政。大夫想劝，又怕扫了君兴、触怒近臣。",[p("君上正玩得高兴，此时进谏，会不会扫兴获罪？",r("yi","hit","等君上猎罢歇息时，以农时与边患为切入，缓缓进言。","国君沉默片刻：「你倒是会挑时候。」"),r("ming","reason","可引前代贤君故事，让君上自己醒悟。","他说：「故事好听，君上未必往心里去。」"),r("shi","evade","君上若再游猎，就把猎场封了。","他反问：「你有几个脑袋敢封猎场？」")),p("近臣靠陪君上游猎得宠，他们会在君上耳边说你坏话。",r("yi","hit","进谏时只谈国事，不指责任何人，近臣便无从挑拨。","国君点头：「不点名，他们也不好说什么。」"),r("ming","reason","可先结交其中一二，让他们替你说话。","他叹：「与近臣结交，久了也成党。」"),r("li","evade","给他们些好处，让他们闭嘴。","他冷笑：「今天给好处，明天他们就要更多。」")),p("君上说游猎是为了练武备边，怎么反驳？",r("yi","hit","练武可在校场，何必践踏农田、劳烦百姓。","国君面色微变：「你这话，说得太重了。」"),r("ming","reason","可按古礼定下猎期，不误农时即可。","他点头：「定个规矩，倒还可行。」"),r("shi","evade","把猎场周围的百姓迁走，就没人说话了。","他反问：「迁走百姓，谁去种田？」"))],A("农时历",1,"你出示农时历：君上游猎的时日，正与播种、收割相冲。"),{success:"国君减猎，朝政渐理。",compromise:"国君同意节制游猎，但要你先安排农事。",fail:"劝谏触怒国君，大夫被疏远。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"安排农事",desc:"国君命你安排猎场周边农事，不得误期。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:50,fame:3,merit:6}}),T("recommend","举荐贤才","court","yi",!0,"执政","当国","执政要举荐一位寒门贤才，却怕资历浅、同僚非议、君上不用。",[p("此人出身寒微，骤然举荐，群臣会不会说你结党？",r("yi","hit","举荐时陈明其才德与实绩，不称门生，不结私谊。","执政点头：「只论才，不认门生，便无话可说。」"),r("ming","reason","可先让他做个小吏，做出政绩再举荐。","他说：「这法子稳，只是慢。」"),r("shi","evade","谁敢非议，就让他拿出更好的人来。","他苦笑：「他们拿不出人，却拿得出闲话。」")),p("君上嫌他资历浅，不肯用，怎么办？",r("yi","hit","请君上先试之以一事，成则用，不成则退。","执政目光一亮：「试而后用，君上多半肯。」"),r("li","reason","许君上此人只做副手，不会专权。","他说：「副手做久了，也未必能转正。」"),r("ming","evade","把此人的文章呈给君上，君上自会赏识。","他反问：「君上若只看文章，还要政绩做什么？」")),p("此人若上任后与你政见不合，你会不会后悔？",r("yi","hit","举贤不避异己，他若有更好的主张，我自当让贤。","执政大笑：「这话，我记下了。」"),r("shi","reason","先用其才，若真不合，再调他处。","他点头：「用人所长，也算务实。」"),r("li","evade","先与他约定，大事必须听我的。","他叹：「这样的贤才，来了也施展不开。」"))],A("策论简",0,"你出示此人的策论简：论农田水利，条理分明，切中时弊。"),{success:"贤才得用，朝政为之一新。",compromise:"执政同意举荐，但要你亲自前往征辟。",fail:"举荐被驳回，贤才另投他国。"},{success:{fame:6,rel:5,merit:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"征辟贤者",desc:"执政命你前往曲阜，征辟这位寒门贤才。",mode:"travel",targetCity:"qufu",days:18,reward:{money:60,fame:4,merit:8}})];var $s=[T("seedloan","借贷粮种","trade","li",!1,"老农","乡里农夫","春耕在即，老农无种下田，想向富户借粮种，又怕利息与天灾。",[p("借粮种要还三成利，若秋收不好，我拿什么还？",r("li","hit","可先还一半，余下延到明年，利钱不再滚。","老农松了口气：「不滚利，倒还能喘口气。」"),r("yi","reason","乡里乡亲，总该互相帮衬，哪能见死不救。","他叹气：「帮衬是好，可债主也要吃饭。」"),r("shi","evade","不借便罢，我另想办法。","他苦笑：「你若有办法，就不会站在这儿了。」")),p("富户要我用田契作抵押，田没了，一家老小怎么办？",r("li","hit","只押一季收成，不押田契，白纸黑字写清楚。","老农点头：「只押收成，田还在，行。」"),r("ming","reason","可请乡老作保，不必押田契。","他说：「乡老肯保吗？富户未必认。」"),r("yi","evade","人无信不立，既然借了，就该拿田契作押。","他急道：「田没了，我们一家喝西北风？」")),p("若秋收前遭了天灾，官府又不赈济，这债怎么算？",r("li","hit","借约写明：遇灾则减半，官府有赈则先还官。","老农目光一亮：「有这一条，我才敢借。」"),r("yi","reason","天灾非人力可抗，债主总该讲点良心。","他叹：「良心？债主的良心也是粮养的。」"),r("ming","evade","官府总会赈济，不必杞人忧天。","他反问：「去年官府赈了吗？」"))],A("乡约旧例",0,"你出示乡约旧例：灾年借种，利钱减半，不得夺田。"),{success:"老农借到粮种，春耕如期。",compromise:"老农愿意借种，但要求你替他向富户说情。",fail:"老农借不到种，田地荒废。"},{success:{fame:3,rel:5},compromise:{fame:1,rel:2},fail:{fame:-1,rel:-2}},null),T("saltiron","盐铁专营","trade","li",!0,"大夫","掌财赋","官府欲行盐铁专营，以充府库，却触动私盐商人与百姓生计。",[p("私盐贩子遍地，官府一专营，他们必会闹事，怎么处置？",r("li","hit","先收编大商，给小贩发引票，让他们在官价下营生。","大夫点头：「给条活路，才不会逼反。」"),r("shi","reason","派兵查禁，见私盐就没收。","他说：「查得了一时，查不了遍地。」"),r("yi","evade","百姓吃不起盐，专营也该顾及民生。","他皱眉：「顾及民生，府库就空了。」")),p("盐价一涨，百姓怨声载道，怎么平？",r("li","hit","官盐分三等，最次一等平价卖给贫户。","大夫道：「分等而售，贫户也吃得起。」"),r("ming","reason","可贴告示说明专营是为了军费，百姓应当体谅。","他叹：「体谅归体谅，盐还是要吃。」"),r("yi","evade","宁可府库少收，也不能让百姓吃不起盐。","他反问：「府库空了，军饷谁来出？」")),p("大商巨贾会勾结官吏走私，怎么防？",r("li","hit","盐引编号、账目对查，官商勾结必留痕迹。","大夫目光一凝：「编号对账，倒能查出内鬼。」"),r("shi","reason","派亲信去盐场盯着，不经过地方官。","他说：「亲信也会被收买。」"),r("ming","evade","严刑峻法，走私者抄家灭族。","他叹：「法太酷，反而没人敢报官。」"))],A("私盐账册",0,"你出示私盐账册：本地私盐多经三名吏员放行。"),{success:"盐铁专营推行，府库渐充。",compromise:"大夫同意专营，但要你先查清私盐渠道。",fail:"专营受阻，私盐更加猖獗。"},{success:{fame:4,rel:4,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"查私盐",desc:"大夫命你查禁私盐，揪出放行的吏员。",mode:"check",checkSkill:"quanmou",dc:44,days:16,reward:{money:80,fame:3,merit:8}}),T("inflation","物价飞涨","trade","li",!0,"司徒","掌财赋","城中物价飞涨，粮布皆贵。司徒要压价，却怕伤商、怕无粮、怕民怨。",[p("商家说进价就高，压价他们就关门，怎么办？",r("li","hit","官府先平价售一部分粮布，商家怕货砸手里，自会跟价。","司徒点头：「以小搏大，可以一试。」"),r("shi","reason","定最高价，违者罚没。","他说：「罚没了几家，别家就藏货不卖。」"),r("yi","evade","商人总要讲点良心，不该发国难财。","他冷笑：「良心要是能压价，我就不用愁了。」")),p("官仓存粮不多，平价售粮能撑多久？",r("li","hit","只售到秋收，同时向邻县调运，撑过青黄不接。","司徒道：「算着日子售，才不至于见底。」"),r("shi","reason","强征豪商存粮，先压住局面。","他说：「强征容易，商路断了更难。」"),r("ming","evade","可请君上下诏，令豪商平价出售。","他反问：「诏书下了，他们照办吗？」")),p("百姓买不到粮，已经开始抢粮，怎么稳住？",r("li","hit","按户发粮牌，凭牌限量购买，杜绝囤积。","司徒目光一亮：「凭牌限购，倒能稳住。」"),r("yi","reason","开仓赈济，先让最穷的人有饭吃。","他叹：「开仓容易，后续难以为继。」"),r("shi","evade","派兵弹压，抢粮者就地正法。","他皱眉：「杀得了一时，杀不了一世。」"))],A("商路图",1,"你出示商路图：邻县粮价尚低，运程只需五日。"),{success:"物价渐平，民心稍安。",compromise:"司徒同意平价售粮，但要你主持平售之事。",fail:"物价失控，城中大乱。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"平价售粮",desc:"司徒命你主持平价售粮，按户发票、限量供应。",mode:"check",checkSkill:"shanggu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),T("caravan","商队通行","trade","shi",!0,"关吏","边关守吏","一支大商队要过关，关吏既想收税，又怕盗匪与间谍混在其中。",[p("商队货物繁多，一件件查验，商队等得起吗？",r("shi","hit","分货类抽验，贵重与军械全查，其余放行。","关吏点头：「抽验加重点，倒还快。」"),r("li","reason","按货值收税，多收些钱，商队自然愿意等。","他说：「收得多了，商队下次就绕道。」"),r("ming","evade","按旧例查验，不必多事。","他反问：「旧例查得出间谍吗？」")),p("关外盗匪横行，商队若在关外被劫，会不会怪我们？",r("shi","hit","派一队关卒护送出界，既保商队，也显国威。","关吏道：「护送一程，商队才会再来。」"),r("li","reason","收一笔护送费，由商队自己出人。","他皱眉：「商队自己出人，还要我们做什么？」"),r("yi","evade","盗匪劫财，与我们无关，不必多管。","他叹：「商队被劫一次，就再也不来了。」")),p("商队里若有敌国探子，放过去就是大罪，怎么查？",r("shi","hit","查符传与货主名籍，军中工匠与地图匠重点盘问。","关吏目光一凛：「查工匠与地图匠，倒是要害。」"),r("ming","reason","让商队互保，一人犯事，全队连坐。","他说：「连坐能逼他们自己查。」"),r("li","evade","多收些保证金，出了事就扣钱。","他反问：「探子会在乎那点钱吗？」"))],A("商队符传",1,"你出示商队符传：其中三名工匠的名籍与货单不符。"),{success:"商队顺利过关，关税与安全两全。",compromise:"关吏同意放行，但要你护送商队出界。",fail:"商队被劫，边关声誉受损。"},{success:{fame:4,rel:4,merit:6},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"护送商队",desc:"关吏命你护送商队出界，防备盗匪。",mode:"combat",enemy:{name:"关外盗匪",wu:54,skill:3,hp:88},days:12,reward:{money:80,fame:4,merit:8}}),T("strike","工匠罢工","trade","li",!1,"工匠","城中匠户","官府催造军械，工匠却因工钱拖欠而罢作，双方僵持。",[p("工钱拖欠了三个月，让我们怎么干活？",r("li","hit","先发一个月工钱，余下按半月一结，绝不拖欠。","工匠头目点头：「先发一个月，兄弟们才肯动。」"),r("yi","reason","朝廷也有难处，大家该共渡难关。","他冷笑：「难关都让我们渡，官老爷吃什么？」"),r("shi","evade","再不复工，就抓几个带头的。","他怒道：「抓吧，抓完了看谁给你造兵器。」")),p("军械催得急，工期赶不上，谁担这个责任？",r("li","hit","加派人手、分班昼夜赶工，工钱按件另计。","工匠们低声商议，神色稍缓。"),r("ming","reason","请上官宽限几日，先赶最急的一批。","他说：「宽限？上官会听我们的？」"),r("yi","evade","为将者当体恤匠人，不可一味催逼。","他叹：「体恤？兵器造不出来，先掉脑袋的是我们。」")),p("带头罢工的几个人，官府要办他们，你怎么看？",r("li","hit","只要复工，往罪不究，工钱照补。","头目沉默半晌：「不究往罪，我们就复工。」"),r("yi","reason","他们也是被逼无奈，罚些钱便算了。","他反问：「罚钱？我们连饭都吃不上。」"),r("shi","evade","带头的必须办，不然以后人人效仿。","他冷声道：「那就没人给你干活了。」"))],A("工钱簿",0,"你出示工钱簿：拖欠工钱属实，经手官吏还克扣了一成。"),{success:"工匠复工，军械如期交付。",compromise:"工匠同意复工，但要你督办补发工钱。",fail:"罢工扩大，军械停工。"},{success:{fame:3,rel:4,merit:6},compromise:{fame:1,rel:2},fail:{fame:-3,rel:-3}},null),T("manumit","奴婢赎身","trade","yi",!0,"主人","城中富户","一名奴婢想赎身，主人要价甚高，又怕开了先例，家中奴婢都思走。",[p("赎金要得高，她拿不出来，你让我白放人？",r("yi","hit","赎金可分期，先付三成，余下以工抵，不误你家用度。","主人沉吟：「分期以工抵，倒不吃亏。」"),r("li","reason","按市价折算，我另补你一笔钱。","他说：「钱我要，人也不能白放。」"),r("shi","evade","奴婢赎身本就不合规矩，不必再谈。","他冷下脸：「那就没什么好说的了。」")),p("放她走了，家中其他奴婢也要赎身，怎么办？",r("yi","hit","立个规矩：年满四十、无家累者许赎，幼者仍留。","主人点头：「立规矩，总比乱放人好。」"),r("ming","reason","可让她写下自愿留居的字据，压住旁人。","他皱眉：「字据压得住人，压不住心。」"),r("li","evade","谁要赎身，赎金加倍便是。","他反问：「加到你出不起，你还会来求我吗？」")),p("放奴婢出门，她无依无靠，出了事谁担？",r("yi","hit","许她在你家中再做一年，攒些盘缠，也算全了主仆之义。","主人叹道：「主仆一场，这话还算有人情。」"),r("li","reason","给她一笔安家钱，往后各不相干。","他说：「钱给了，出了事可别来找我。」"),r("ming","evade","给她找个好人家嫁了，也算仁至义尽。","他反问：「她自己愿意吗？」"))],A("卖身契",0,"你出示卖身契：契上写明二十年为期，如今已满十八年。"),{success:"奴婢赎身，主仆两安。",compromise:"主人同意放人，但要你先替她筹措赎金。",fail:"赎身不成，奴婢继续为奴。"},{success:{fame:4,rel:4},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"筹赎金",desc:"主人命你替她筹措赎金，限期十日。",mode:"check",checkSkill:"shanggu",dc:42,days:12,reward:{money:40,fame:3,merit:4}}),T("water","水利争水","trade","ming",!1,"里正","乡里里正","两村争一条水渠，旧约模糊，械斗一触即发。",[p("上游村说水是他们先开的，下游村说自古共用，谁有理？",r("ming","hit","查旧渠碑与两村纳赋记录，按出工与用水旧例分水。","里正点头：「有碑有册，才好说话。」"),r("yi","reason","都是乡里，各让一步，轮流用水便是。","他叹：「轮流？旱起来谁肯让？」"),r("shi","evade","谁家丁多就多分水，省得吵闹。","他怒道：「那还要里正做什么！」")),p("旧约只写了“共用水源”，没写怎么分，怎么办？",r("ming","hit","按田亩多少定水时，田多者多用水，也多重修渠之责。","里正目光一亮：「按田分水，倒也公道。」"),r("li","reason","让两村出钱修渠，谁出得多谁用得多。","他说：「穷村出不起钱，只能少用水？」"),r("yi","evade","让他们自己商量，商量不成就报官。","他苦笑：「报官？官府管得过来吗？」")),p("两村已经动了手，有人受伤，怎么压住场面？",r("yi","hit","先让两村各出人照料伤者，再坐下来谈水。","里正点头：「先治伤，再谈水，才有人味。」"),r("shi","reason","把两村的头面人物叫来，先各打一顿板子。","他皱眉：「打完了，仇更深。」"),r("li","evade","谁先动手就罚谁的钱，用罚款修渠。","他说：「罚了钱，水还是不够用。」"))],A("旧渠碑",1,"你出示旧渠碑拓：碑文写明两村按田亩出工、按田亩分水。"),{success:"两村按旧例分水，械斗渐止。",compromise:"两村愿意停斗，但要你主持重新立约。",fail:"争水再起，两村结下深仇。"},{success:{fame:4,rel:4},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-2}},null),T("fraud","市场欺诈 ly:"国君点头：「教化是根本，只是见效慢些。」"},{tag:"shi",level:"evade",text:"禁止聚议，为首者治罪。",reply:"国君冷声道：「堵得住嘴，堵得住人心吗？」"}]},{id:"flood",q:"秋汛将至，河堤年久失修，君将何以处之？",options:[{tag:"li",level:"hit",text:"分段修堤，以工代赈，既固河防又安流民。",reply:"国君目光一亮：「以工代赈，一举两得。」"},{tag:"yi",level:"reason",text:"迁低地之民于高处，先保人命，再议修堤。",reply:"国君叹道：「迁民也是难事，但总比死人强。」"},{tag:"ming",level:"evade",text:"祭河祈安，上天自会护佑。",reply:"国君反问：「若上天不佑，谁来担这个责？」"}]},{id:"talent",q:"朝中乏才，政事壅滞，君将何以取士？",options:[{tag:"yi",level:"hit",text:"举寒门、试以事，不问出身，唯才是举。",reply:"国君抚掌：「英雄不问出处，正合寡人之意。」"},{tag:"ming",level:"reason",text:"依乡里清议与旧制荐举，稳重为上。",reply:"国君沉吟：「旧制稳妥，却怕漏了真才。」"},{tag:"li",level:"evade",text:"任用亲族，至少忠心可保。",reply:"国君冷笑：「忠心而无才，只会误事。」"}]},{id:"diplomacy",q:"诸侯会盟在即，君欲争一时之先，当以何策？",options:[{tag:"shi",level:"hit",text:"先联近邻、陈兵于会，以势压诸侯，再定盟约。",reply:"国君点头：「有势可恃，盟辞才有人听。」"},{tag:"yi",level:"reason",text:"以信义相召，让诸侯自愿推我为长。",reply:"国君叹道：「信义虽好，会盟场上还是看实力。」"},{tag:"ming",level:"evade",text:"多送礼物，买通各国大夫。",reply:"国君皱眉：「买来的盟，明日就能被别人买走。」"}]},{id:"oath",q:"诸侯背弃旧盟，边邑已起争端，君将何以处之？",options:[{tag:"ming",level:"hit",text:"会诸侯于旧盟之地，重订盟书，使背盟者无所遁形。",reply:"国君点头：「先把道理摆在诸侯面前。」"},{tag:"yi",level:"reason",text:"先遣使责以大义，彼若知愧，兵戈可免。",reply:"国君叹道：「义责要有兵威作后盾才管用。」"},{tag:"li",level:"evade",text:"许以边市之利，换他退兵。",reply:"国君反问：「今日许利，明日他再进一步呢？」"}]},{id:"plague",q:"灾后疫气流行，医者不足，君将何以处之？",options:[{tag:"yi",level:"hit",text:"征召良医、设隔离之所，官给汤药，先救疫区。",reply:"国君颔首：「先救人，再谈其余。」"},{tag:"li",level:"reason",text:"拨款购药，命各乡上报病户。",reply:"国君道：「钱要花，可谁来管这些药？」"},{tag:"shi",level:"evade",text:"封锁疫区，禁止出入。",reply:"国君皱眉：「封得住人，封不住疫气。」"}]},{id:"saltiron",q:"盐铁之利尽归豪商，府库日虚，君将何以处之？",options:[{tag:"li",level:"hit",text:"官营盐铁，设官榷税，余利仍许商人经营。",reply:"国君目光一亮：「官商分利，倒不至于竭泽。」"},{tag:"shi",level:"reason",text:"派兵查封私盐，杀一儆百。",reply:"国君沉吟：「查得了一时，查不了天下。」"},{tag:"yi",level:"evade",text:"与民争利非仁政，不如听其自然。",reply:"国君反问：「府库空了，仁政拿什么行？」"}]},{id:"luxury",q:"宗室竞相奢靡，用度逾制，君将何以处之？",options:[{tag:"ming",level:"hit",text:"申明礼制，按爵定用，逾制者夺其封邑。",reply:"国君点头：「先立规矩，再谈罚。」"},{tag:"yi",level:"reason",text:"以俭德示范，劝其自省。",reply:"国君苦笑：「寡人节俭，他们照旧。」"},{tag:"li",l
