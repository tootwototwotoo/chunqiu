暂时按兵不动。",compromise:"楚使同意结盟，但要你亲赴郢都送盟书。",fail:"盟议破裂，两国边境再度紧张。"},{success:{fame:7,rel:8,merit:8},compromise:{fame:3,rel:4},fail:{fame:-3,rel:-4}},{title:"送盟书",desc:"楚使请你亲赴郢都，将盟书呈交楚王。",mode:"travel",targetCity:"ying",days:22,reward:{money:90,fame:5,merit:10}}),f("passage","借道伐虢","diplomacy","li",!0,"虞公","虞国国君","晋国欲借虞道伐虢，虞公贪图晋国献礼，又怕引狼入室。",[r("晋国借道，说是只伐虢国，可谁能保证他不顺手灭虞？",t("li","hit","可要求晋军过境时不得入城，并由虞军沿途监军。","虞公点头：「有兵跟着，总比空口许诺强。」"),t("yi","reason","晋国既以礼来借，想必不会背信。","他犹豫：「礼数归礼数，兵在他手里。」"),t("ming","evade","从前晋文公也借过道，并未失信。","他反问：「晋文公是晋文公，如今这位是吗？」")),r("晋国送来的宝玉良马，收下会不会烫手？",t("li","hit","可以收，但先要晋国写下过境不入城的盟书。","虞公笑道：「礼照收，规矩也照立。」"),t("shi","reason","收下便是，虞国据险而守，晋军未必敢动。","他沉吟：「据险而守，也要守得住才行。」"),t("yi","evade","无功受禄，终究不妥，还是退回去吧。","他脸一沉：「退回去？你让寡人如何下台。」")),r("虢国若来报复，虞国挡得住吗？",t("li","hit","与晋约定，虢国来犯时晋军须回师相助。","虞公道：「拉晋国一起担着，才算稳妥。」"),t("shi","reason","虢国小国，未必敢来。","他摇头：「小国背后，未必没有大国。」"),t("yi","evade","虞虢同姓，本应互相扶持，不该兵戎相见。","他冷笑：「同姓？同姓才更要提防。」"))],k("晋使密简",1,"你出示截获的晋使密简：晋军粮道只备了单程。"),{success:"晋军借道而去，虞国暂时无恙。",compromise:"虞公同意借道，但要你负责操办过境礼。",fail:"虞公收礼借道，晋军回师时顺手灭了虞国。"},{success:{fame:4,rel:6,merit:6},compromise:{fame:2,rel:3},fail:{fame:-5,rel:-8}},{title:"筹措过境礼",desc:"虞公命你筹措借道所需的过境礼。",mode:"check",checkSkill:"shanggu",dc:44,days:14,reward:{money:60,fame:2,merit:6}}),f("marriage","联姻结好","diplomacy","ming",!0,"国君","国君","国君欲与强国联姻，以固邦交，但宗室与大臣各有顾虑。",[r("宗室反对与蛮夷联姻，说是有辱宗庙，你怎么看？",t("ming","hit","可请天子赐婚，有了王命，宗室便无话可说。","国君点头：「借天子之名，倒是个办法。」"),t("li","reason","联姻能换来边市与盟约，实利在手。","他叹：「实利虽好，宗室却只谈名分。」"),t("yi","evade","婚姻本就该以两国之好为重。","他反问：「两国之好，能管几代？」")),r("嫁妆若给得太薄，对方会不会觉得我们没有诚意？",t("ming","hit","礼数做足，但陪嫁只给器物与工匠，不给土地。","国君道：「有面子，也不伤根本。」"),t("li","reason","多给些财货，反正联姻之后还能通商。","他摇头：「财货一给出去，就回不来了。」"),t("shi","evade","强国若真在意嫁妆，那这盟约也不牢靠。","他苦笑：「话虽如此，寡人还是怕。」")),r("对方若只是假意联姻，转头又与他人结盟呢？",t("ming","hit","盟书中写明：若背盟，则天下共讨之。","国君道：「先把大义占住，他不敢太放肆。」"),t("shi","reason","在边境屯一支兵，对方自然会掂量。","他说：「屯兵要钱，国库吃紧。」"),t("yi","evade","既结秦晋之好，便当以诚相待。","他叹：「寡人倒是想诚，只怕对方不诚。」"))],k("宗室谱牒",0,"你出示宗室谱牒：远支女子仍可算作公族，礼数上说得过去。"),{success:"婚姻既定，两国交好。",compromise:"国君同意联姻，但要你亲自送聘礼。",fail:"联姻之议被宗室否决，邦交转冷。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"送聘礼",desc:"国君命你护送聘礼前往临淄。",mode:"travel",targetCity:"linzi",days:20,reward:{money:80,fame:4,merit:5}}),f("hostage","交换质子","diplomacy","yi",!0,"大夫","掌邦交","两国互不信任，约定交换质子。大夫既怕质子受苦，又怕对方毁约。",[r("质子到了对方手里，若对方翻脸，质子的性命如何保障？",t("yi","hit","以礼相待、以师友相托，让对方不忍加害。","大夫点头：「以礼结之，比刀兵更稳。」"),t("shi","reason","也在边境屯兵，对方不敢轻举妄动。","他说：「兵能逼他不敢杀，却不能逼他善待。」"),t("ming","evade","从前晋惠公在秦为质，最后也平安归国。","他反问：「晋惠公归国后，又做了什么？」")),r("大臣们说质子是奇耻大辱，不愿送自己的儿子，怎么办？",t("yi","hit","既是为国，公族子弟当先，群臣便无话可说。","大夫叹道：「公族先送，才算公道。」"),t("ming","reason","可选旁支子弟，厚加封赏，以安其心。","他点头：「旁支子弟，总是好说话些。」"),t("shi","evade","谁敢不从，便以军法从事。","他摇头：「逼出来的质子，到了敌国也未必可靠。」")),r("对方若收下质子却不肯交换，我们怎么办？",t("yi","hit","先送质子，但换回之人须先到边境，双方同时放人。","大夫道：「同时放人，谁也别想赖账。」"),t("shi","reason","可扣下对方在边境的商队作押。","他皱眉：「商队无辜，传出去不好听。」"),t("ming","evade","天下诸侯都在看着，对方不敢如此无信。","他苦笑：「他们若怕人看，就不会打仗了。」"))],k("质子仪注",0,"你出示旧仪注：同时放人、互派师保，可保质子平安。"),{success:"质子交换顺利，两国暂时相安。",compromise:"大夫同意交换，但要你亲自护送质子。",fail:"交换失败，两国互相指责。"},{success:{fame:5,rel:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"护送质子",desc:"大夫命你护送质子前往新郑，换回本国公子。",mode:"travel",targetCity:"xinzheng",days:18,reward:{money:70,fame:4,merit:6}}),f("meeting","会盟争长","diplomacy","ming",!0,"大夫","掌礼","诸侯会盟，谁先歃血谁为长。大夫想争，又怕得罪晋楚。",[r("晋楚都比我们强，争这个盟主之位，值得吗？",t("ming","hit","不求盟主，只求史册记明我国未曾屈从。","大夫点头：「留名而不争实，倒也体面。」"),t("shi","reason","可联合几个小国，先造成既成事实。","他说：「小国靠得住吗？风一吹就散。」"),t("yi","evade","盟主之位，本就该由天子册命。","他叹：「天子若管用，就不会有这会盟了。」")),r("小国们都在观望，怎样才能让他们站到我们这边？",t("ming","hit","许他们在盟书中列名，共享盟约之利。","大夫道：「有名有利，他们自然会来。」"),t("li","reason","给些粮布，先把人请来再说。","他摇头：「给得越多，他们越觉得我们心虚。」"),t("yi","evade","以诚待人，他们总能看见。","他苦笑：「会盟场上，诚字最不值钱。」")),r("若晋楚联手施压，要我们放弃争长，怎么下台？",t("ming","hit","可退一步，但要求由我们执笔记盟，掌盟书之权。","大夫目光一亮：「执笔之人，往往比盟主更要紧。」"),t("shi","reason","先答应，回头再在盟辞上做文章。","他皱眉：「做文章也要有人撑腰。」"),t("yi","evade","大不了一走了之，不与他们同流合污。","他反问：「走了之后呢？他们照样盟。」"))],k("会盟旧档",1,"你出示旧档：某次会盟，执笔者认为盟辞有误，迫诸侯重议。"),{success:"会盟之上，我国不亢不卑，声名大振。",compromise:"大夫同意争长，但要你先行筹备会盟事宜。",fail:"争长失败，诸侯轻视我国。"},{success:{fame:8,rel:5},compromise:{fame:3,rel:2},fail:{fame:-4,rel:-3}},{title:"筹备会盟",desc:"大夫命你前往洛邑，筹备会盟的礼仪与盟书。",mode:"travel",targetCity:"luoyi",days:24,reward:{money:80,fame:5,merit:8}}),f("tribute","朝贡天子","diplomacy","yi",!0,"国君","国君","天子虽微，朝贡之礼不可废。国君既怕贡物不足，又怕路上被盗。",[r("府库不丰，贡物拿不出手，天子会不会怪罪？",t("yi","hit","贡物不在厚薄，而在诚敬，可附一封陈情表。","国君点头：「礼轻情重，天子或能体谅。」"),t("li","reason","向富商借一批珍货，回来自会还上。","他叹：「借来的贡物，终究是债。」"),t("ming","evade","从前齐侯朝周，也只献了几车鱼盐。","他反问：「齐侯有几车鱼盐，我们有什么？」")),r("路上盗匪横行，贡物被劫，颜面何存？",t("yi","hit","轻车简从，贡物分装，纵被劫也不至全失。","国君道：「分装而行，是个办法。」"),t("shi","reason","派一队甲士护送，寻常盗匪不敢动手。","他说：「甲士一动，沿途诸侯便知道贡物贵重。」"),t("ming","evade","打着天子旗号，盗匪总不敢冒犯。","他苦笑：「盗匪若怕天子，就不做盗匪了。」")),r("天子若收下贡物却不给好脸色，这趟岂不是白跑？",t("yi","hit","朝贡本为守礼，不为邀宠，天子如何，是天子的事。","国君肃然：「这话说得好，寡人受教。」"),t("ming","reason","可请随行史官将朝贡之事记入史册。","他点头：「史册一记，便不白走。」"),t("li","evade","天子总要给些回赐，不会让我们吃亏。","他叹：「回赐？如今天子比我们还穷。」"))],k("贡道图",1,"你出示贡道图：绕行南阳可避开盗匪最盛的一段。"),{success:"朝贡成礼，天子嘉许，诸侯侧目。",compromise:"国君同意朝贡，但要你负责押运贡物。",fail:"贡物被劫，天子震怒，国君蒙羞。"},{success:{fame:6,rel:5},compromise:{fame:2,rel:3},fail:{fame:-4,rel:-4}},{title:"押运贡物",desc:"国君命你押运贡物前往洛邑，绕行南阳。",mode:"travel",targetCity:"luoyi",days:22,reward:{money:60,fame:5,merit:8}}),f("mediator","调停两国","diplomacy","yi",!0,"大夫","掌邦交","宋卫交兵，大夫奉命调停。两国各有条件，大国又在背后使力。",[r("宋国要卫国割地，卫国不肯，怎么调停？",t("yi","hit","先让双方停兵，把割地之事交诸侯共议，不使一方独吞。","大夫点头：「先止血，再论是非。」"),t("li","reason","可许宋国一些边市之利，换他放弃割地。","他说：「宋国若贪，边市也填不满。」"),t("shi","evade","谁强就听谁的，我们不必多事。","他正色：「那我们又何必来调停？」")),r("大国在背后支持一方，调停会不会得罪大国？",t("yi","hit","调停以息兵为名，大国若反对，便是好战。","大夫道：「把大义摆在明处，他们不好明着反对。」"),t("ming","reason","可请天子下诏调停，大国总要给天子面子。","他苦笑：「天子的面子，还剩多少？」"),t("shi","evade","先看看大国什么意思，再决定站哪边。","他皱眉：「调停之人若先站队，还调什么？」")),r("两国若表面答应，回头又打起来，谁担保？",t("yi","hit","请几位中立诸侯共同作保，谁先动手便共讨之。","大夫道：「有人作保，他们才会收敛。」"),t("shi","reason","在两国边境驻一支调停之师。","他说：「驻兵要粮，谁出？」"),t("ming","evade","他们既已歃血，总不好意思立刻背盟。","他叹：「背盟的事，史书上还少吗？」"))],k("两国界约",0,"你出示旧界约：争议之地本为两国共有，可先设缓冲区。"),{success:"两国罢兵，边境暂安。",compromise:"大夫同意调停，但要你往来两国传信。",fail:"调停失败，战事再起。"},{success:{fame:7,rel:6},compromise:{fame:3,rel:3},fail:{fame:-3,rel:-4}},{title:"往来传信",desc:"大夫命你往返宋卫两国，传递停兵条件。",mode:"travel",targetCity:"shangqiu",days:18,reward:{money:70,fame:5,merit:8}}),f("fugitive","讨要逃犯","diplomacy","shi",!0,"大夫","掌刑","本国逃犯藏身邻国，邻国收留不交。大夫想强硬，又怕闹成兵祸。",[r("邻国说逃犯是政治避难，不肯交人，怎么反驳？",t("shi","hit","把逃犯所犯的杀人劫财之罪列明，政治避难便站不住。","大夫点头：「先把罪名坐实，他们就没话说了。」"),t("ming","reason","引诸侯盟约：杀人者不得庇护。","他说：「盟约是好，可他们未必认。」"),t("yi","evade","人命关天，邻国总该讲点天理。","他冷笑：「天理？他们只看利益。」")),r("邻国要我们拿三座边邑换人，值不值？",t("shi","hit","不换地，改以商路与粮道作交换，地不可轻割。","大夫道：「以利换人，不动根本。」"),t("li","reason","三座边邑换一个逃犯，也可显我国决心。","他摇头：「决心有了，边患也来了。」"),t("ming","evade","逃犯终究是小事，不必为此大动干戈。","他反问：「他杀的是我国的人，怎么会是小事？」")),r("若邻国始终不交，动不动兵？",t("shi","hit","先陈兵边境，再遣使谈，以兵威逼其交人。","大夫道：「兵临而不战，才是上策。」"),t("yi","reason","为一逃犯兴兵，伤的是两国百姓。","他叹：「这个道理，我也明白。」"),t("ming","evade","可请诸侯共议，以公论压他。","他苦笑：「诸侯共议，议上三年也未必有结果。」"))],k("通缉简",0,"你出示通缉简与苦主血书，逃犯罪行确凿。"),{success:"邻国交人，逃犯伏法。",compromise:"邻国同意交人，但要你跨境缉拿。",fail:"邻国拒绝交人，两国关系恶化。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-4}},{title:"跨境缉拿",desc:"邻国允许你入境，但须自行缉拿逃犯。",mode:"combat",enemy:{name:"亡命逃犯",wu:56,skill:3,hp:90},days:15,reward:{money:80,fame:5,merit:10}}),f("border","边境划界","diplomacy","li",!0,"大夫","掌疆理","两国边境犬牙交错，边民常因田界械斗。大夫想重划边界，却牵动守将与豪族。",[r("旧界早已模糊，按什么标准重划才服人？",t("li","hit","以旧界碑与纳赋册为准，两样都对得上才算数。","大夫点头：「有碑有册，谁也没话说。」"),t("ming","reason","照周室旧制，以山川自然为界。","他说：「山川会改道，旧制未必合用。」"),t("yi","evade","让边民自己协商，官府不必插手。","他反问：「协商得成，还会械斗吗？」")),r("边民已在争议地上耕种多年，重划之后他们怎么办？",t("li","hit","已耕之田不追夺，只约定此后不得再越界开垦。","大夫道：「不翻旧账，才谈得下去。」"),t("yi","reason","都是两国子民，总得给他们一条活路。","他叹：「活路要给，界也要划。」"),t("shi","evade","越界者一律驱逐，不必留情。","他皱眉：「驱了人，边患更深。」")),r("守将说边界一动，防务便要重排，他不肯配合怎办？",t("li","hit","划界之后防务由两国共守，守将的担子反而轻了。","大夫点头：「让他得利，他自然会配合。」"),t("shi","reason","请他一同勘界，给他留足面子。","他说：「面子给足，事才好办。」"),t("ming","evade","守将只管守土，划界是朝廷的事。","他苦笑：「朝廷的令，到了边关未必好使。」"))],k("旧界碑拓",0,"你出示旧界碑拓片，碑文与纳赋册完全吻合。"),{success:"边界重划，边民械斗渐止。",compromise:"大夫同意划界，但要你带人实地勘界。",fail:"划界搁浅，边民继续械斗。"},{success:{fame:4,rel:5,merit:6},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"勘界",desc:"大夫命你带人实地勘界，核定新界碑位置。",mode:"check",checkSkill:"suanshu",dc:44,days:18,reward:{money:60,fame:3,merit:8}}),f("market","通商互市","diplomacy","li",!0,"大夫","掌市","两国欲开边市，大夫既想收关税，又怕走私与间谍混入。",[r("边市一开，走私与间谍混进来怎么办？",t("li","hit","商人入市须验符传，货物登记，市门只开一处。","大夫点头：「一处进出一处查，好管。」"),t("shi","reason","派兵驻市，见疑便搜。","他说：「搜得多了，商人就不来了。」"),t("ming","evade","从前的边市也没有出什么大乱子。","他反问：「从前有现在这么多间谍吗？」")),r("关税定高了商人不来，定低了府库吃亏，怎么定？",t("li","hit","先按邻国市税减半试行一年，看货量再调。","大夫道：「先轻后重，商人跑不了。」"),t("ming","reason","照旧制收取，不偏不倚。","他说：「旧制若合用，边市早开了。」"),t("yi","evade","轻徭薄赋，商人自然云集。","他叹：「薄到府库见底，你又该来劝我加税了。」")),r("边市若成了敌国探子的据点，防务怎么交代？",t("li","hit","市中所售军械与盐铁另立专簿，买卖双方都要具名。","大夫目光一亮：「抓住军械，就抓住要害。」"),t("shi","reason","在市外设卡，可疑者不得入城。","他说：「卡得住人，卡不住消息。」"),t("ming","evade","敌国要探，不设边市也照样探得到。","他苦笑：「话虽如此，我总要给君上一个交代。」"))],k("邻国市税册",1,"你出示邻国市税册：其税率约为我国旧制的六成。"),{success:"边市开张，两国商旅往来。",compromise:"大夫同意互市，但要你先拟定市约。",fail:"互市之议搁置，走私反而更盛。"},{success:{fame:4,rel:5},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"立市约",desc:"大夫命你拟定互市市约，厘定税则与查验之法。",mode:"check",checkSkill:"shanggu",dc:44,days:16,reward:{money:70,fame:3,merit:8}})]});var Hn,Pn=O(()=>{Ae();Hn=[f("surrender","招降敌将","military","yi",!1,"降将","敌国裨将","敌将兵败被围，愿降却顾虑旧主、部曲与自身待遇。",[r("我旧主待我不薄，如今降你，岂非不义？",t("yi","hit","将军若肯降，我可保你旧主家小周全，不使受害。","降将默然良久：「若能保他家小，我无话可说。」"),t("li","reason","良禽择木而栖，将军何必拘泥旧主。","他冷笑：「良禽？我若卖主，新主敢信我吗？」"),t("shi","evade","你已兵败被围，不降便死。","他昂首：「死便死，何必多言。」")),r("我麾下数百部曲，降后会不会被拆散、清算？",t("ming","hit","部曲仍归将军统领，只换旗号，不散其众。","降将目光一动：「若能保住弟兄们，我愿听命。」"),t("yi","reason","既已归降，便是一家人，我自当一视同仁。","他说：「一视同仁，说来容易。」"),t("li","evade","每人发些钱粮，他们自然会安心。","他反问：「钱花完了呢？」")),r("我若降，能得什么待遇？",t("li","hit","授你田宅，仍领旧部，俸禄比照本国都尉。","降将点头：「有田有兵，才算真心招降。」"),t("yi","reason","待你以客礼，不把你当降虏看待。","他叹：「客礼虽好，终究是客。」"),t("ming","evade","我可保你名节，史册上写你为弃暗投明。","他苦笑：「史册？我只想活着。」"))],k("旧主家书",0,"你出示旧主写给他的家书：旧主已弃他不顾，甚至扣其家小。"),{success:"敌将归降，其部曲尽数为我所用。",compromise:"敌将答应暂不与我为敌，但不肯正式归降。",fail:"敌将拒绝归降，突围而去。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:2},fail:{fame:-1,rel:-3}},null),f("truce","罢兵休战","military","yi",!0,"将军","本国上将军","连年征战，将军想休战，又怕士气受挫、朝廷主战派发难。",[r("将士们刚打了胜仗，此时休战，会不会泄了士气？",t("yi","hit","正因打了胜仗，才该让将士们回家看看，士气反而更稳。","将军点头：「胜后恤兵，才有人肯再战。」"),t("shi","reason","可留一支前锋监视敌境，其余轮休。","他说：「轮休虽好，前锋也苦。」"),t("ming","evade","从前晋文公也是胜后即退。","他反问：「晋文公退了，可晋国还在。」")),r("敌国若趁我们休战重整旗鼓，怎么办？",t("ming","hit","休战盟书写明互不增兵，违者天下共讨。","将军道：「先把大义占住，他才不敢妄动。」"),t("yi","reason","既已答应休战，便当以信义相待。","他叹：「信义是好，可敌国未必讲。」"),t("li","evade","花些钱买通敌国重臣，让他们也主和。","他皱眉：「用钱买来的和，能撑多久？」")),r("朝廷里的主战派说你怯战，你打算怎么应对？",t("yi","hit","我愿上书陈明士卒疲敝、府库空虚，请君上亲裁。","将军道：「把实情说透，君上自会权衡。」"),t("shi","reason","可先与主战派私下沟通，许他们一些军功。","他说：「军功若可私许，军法何在？」"),t("ming","evade","让他们自己去边关看看，就知道仗不好打。","他苦笑：「他们若肯去，就不会主战了。」"))],k("士卒名册",1,"你出示士卒名册：三年未归者过半，逃亡者日增。"),{success:"两国休战，边境得以喘息。",compromise:"将军同意休战，但要你主持交换俘虏。",fail:"休战之议被主战派压下，战事继续。"},{success:{fame:5,rel:6,merit:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}},{title:"交换俘虏",desc:"将军命你前往商丘，主持两国交换俘虏之事。",mode:"travel",targetCity:"shangqiu",days:18,reward:{money:70,fame:4,merit:8}}),f("pursuit","追击残敌","military","shi",!0,"将军","本国将军","敌军溃退，将军想追，又怕伏兵、粮道与俘虏处置。",[r("敌军溃退得太快，会不会是诱敌之计？",t("shi","hit","先派轻骑探路，主力缓进，遇伏可退。","将军点头：「探路而进，稳当。」"),t("ming","reason","败军之将不敢回头，古来如此。","他摇头：「古来也有回头的。」"),t("yi","evade","为将者当以仁心待败军，不必穷追。","他正色：「仁心？他们回头就会杀我们。」")),r("追得太远，粮道拉长，若被截断怎么办？",t("li","hit","只追一日之程，沿途留兵护粮，不贪全功。","将军道：「留兵护粮，才不会前功尽弃。」"),t("shi","reason","速战速决，抢在敌军聚拢之前打完。","他说：「速战虽好，粮草跟不上也是死。」"),t("ming","evade","兵法云穷寇勿追，不如见好就收。","他反问：「你到底是追还是不追？」")),r("俘虏越来越多，杀不得也放不得，怎么处置？",t("yi","hit","愿降者收编，不愿者释归，只扣其甲兵。","将军道：「收其兵而不杀其人，或可收心。」"),t("shi","reason","全部押回后方做苦役，既省粮又防变。","他皱眉：「苦役易生怨，怨极易哗变。」"),t("li","evade","让他们家里拿钱来赎，也算一笔军费。","他冷笑：「拿不出钱的呢？」"))],k("降卒供词",0,"你出示降卒供词：敌军主力已在三十里外设伏。"),{success:"追击败军，俘获甚众，己方损失不大。",compromise:"将军同意追击，但要你带兵清剿余部。",fail:"追击中伏，损兵折将。"},{success:{fame:6,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-3}},{title:"清剿余部",desc:"将军命你率部清剿山中残敌。",mode:"combat",enemy:{name:"残敌渠帅",wu:62,skill:4,hp:100},days:14,reward:{money:90,fame:5,merit:12}}),f("siege","坚守孤城","military","shi",!0,"守将","孤城守将","孤城被围，粮草将尽，援军未至，守将面临粮、援、民心三难。",[r("城中粮草只够半月，是突围还是死守？",t("li","hit","先按人配给，杀马充粮，再撑十日等援军。","守将道：「配给而食，或能撑到援军。」"),t("yi","reason","将士与百姓同食，人心不散，城就不会破。","他叹：「同食容易，同饿难。」"),t("ming","evade","从前即墨守了五年，我们才半月。","他苦笑：「即墨有田单，我们有吗？」")),r("援军迟迟不到，会不会根本不会来了？",t("shi","hit","再派死士突围送信，若十日内无回音，便焚城突围。","守将点头：「先把最坏的打算定下。」"),t("yi","reason","朝廷不会弃孤城于不顾。","他反问：「朝廷若顾，援军为何还不来？」"),t("li","evade","可许突围送信者重赏，总有人肯去。","他说：「重赏之下，未必有敢死之人。」")),r("城中百姓恐慌，有人想开城投降，怎么稳住？",t("yi","hit","把仅有的粮食先分给百姓，让他们知道守将没有弃城。","守将道：「先安民心，城才守得住。」"),t("shi","reason","派兵守住城门，禁止聚众议论。","他皱眉：「压得住一时，压不住一世。」"),t("ming","evade","告诉大家援军明日就到。","他叹：「明日复明日，谁还信？」"))],k("援军回书",1,"你出示援军回书：七日内必至，命守将务必守住。"),{success:"孤城守住，援军至时敌军已退。",compromise:"守将同意死守，但要你出城筹运守城物资。",fail:"城破，守将自刎。"},{success:{fame:8,rel:6,merit:15},compromise:{fame:3,rel:3},fail:{fame:-5,rel:-5}},{title:"筹运守城物资",desc:"守将命你突围筹运箭矢与粮草回城。",mode:"check",checkSkill:"bingfa",dc:48,days:10,reward:{money:70,fame:4,merit:12}}),f("recruit","征募新军","military","li",!0,"将军","本国将军","大战在即，将军要募新军，却缺钱、缺丁、缺训练。",[r("募兵要钱要粮，府库拿得出多少？",t("li","hit","先募千人为限，按现有粮饷定额，不够再募。","将军点头：「量力而募，才不会养不起。」"),t("ming","reason","可向富户募捐，许其子弟为军官。","他说：「富户子弟做军官，士卒未必服。」"),t("yi","evade","保家卫国，有钱人总该出一点。","他冷笑：「有钱人最会算这笔账。」")),r("壮丁都被豪强藏起来了，怎么募得到人？",t("shi","hit","按户籍强征，藏丁者连坐，豪强才不敢藏。","将军道：「连坐之法，倒是能逼出人来。」"),t("li","reason","提高安家钱，壮丁自己就会来。","他说：「钱给多了，府库又撑不住。」"),t("ming","evade","发一道告示，晓以大义便是。","他反问：「大义能当饭吃吗？」")),r("新军未经训练就上阵，等于送死，训练要多久？",t("ming","hit","只教三件事：听鼓、列阵、不逃，一月可成。","将军道：「只教三件事，倒还来得及。」"),t("li","reason","多给军饷，让他们肯卖命就行。","他摇头：「不会列阵，给再多钱也是白死。」"),t("shi","evade","边打边练，打几仗自然就会了。","他叹：「拿命去练，练出来也没几个人了。」"))],k("藏丁名册",1,"你出示名册：城中豪强隐匿壮丁逾两千。"),{success:"新军募成，军容初具。",compromise:"将军同意募兵，但要你负责操练新军。",fail:"募兵不足，将军被迫推迟出兵。"},{success:{fame:4,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"操练新军",desc:"将军命你操练新募之兵，使其能列阵听令。",mode:"check",checkSkill:"bingfa",dc:44,days:20,reward:{money:70,fame:3,merit:10}}),f("grain","军粮筹措","military","li",!0,"司徒","掌粮","大军将发，军粮还差一半。司徒要在府库、运输与豪强之间找粮。",[r("府库拿不出这么多粮，先从哪里想办法？",t("li","hit","先买豪强囤粮，再向邻县借调，双管齐下。","司徒点头：「两条路一起走，才凑得齐。」"),t("shi","reason","强征豪强存粮，谁敢不从？","他说：「强征容易，战后算账难。」"),t("yi","evade","百姓深明大义，自会踊跃输粮。","他苦笑：「大义不能当军粮。」")),r("粮道漫长，若被敌军截断，前线就要断炊。",t("shi","hit","分三路运粮，每路都有兵护，断一路还有两路。","司徒道：「分路而运，稳当。」"),t("li","reason","多给运夫工钱，让他们昼夜兼程。","他说：「人疲了，给钱也走不快。」"),t("ming","evade","可打着王师旗号，敌军不敢截。","他反问：「敌军连王师都敢打，还怕旗号？」")),r("豪强囤粮不卖，等着战后涨价，怎么撬开他们的仓？",t("ming","hit","以爵位相换：输粮千石者赐爵一级。","司徒目光一亮：「以爵换粮，他们求之不得。」"),t("li","reason","按市价加两成收购，总有肯卖的。","他摇头：「他们等的就是更高的价。」"),t("yi","evade","国难当头，他们总该有点良心。","他叹：「良心若有用，我就不用愁了。」"))],k("豪强粮仓册",2,"你出示粮仓册：三家豪强存粮合计逾三万石。"),{success:"军粮筹足，大军如期开拔。",compromise:"司徒同意筹粮，但要你前往陶邑籴粮。",fail:"军粮不足，出兵延期。"},{success:{fame:4,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"籴粮",desc:"司徒命你前往陶邑，向粮商籴买军粮。",mode:"travel",targetCity:"tao",days:16,reward:{money:80,fame:3,merit:10}}),f("deserters","处置逃兵","military","ming",!0,"将军","本国将军","营中逃兵日增，将军要整肃军法，又怕激起哗变。",[r("逃兵按军法当斩，可一下杀太多，营中会不会炸营？",t("ming","hit","只斩首恶与带队者，余者罚役，明告全军。","将军道：「只诛首恶，才不至于人人自危。」"),t("yi","reason","逃兵也有父母妻儿，总该给他们一条生路。","他叹：「生路要给，军法也不能废。」"),t("shi","evade","把逃兵家属抓起来，看谁还敢逃。","他皱眉：「这样做，只会逼更多人逃。」")),r("逃兵说是因为粮饷不发才逃，军中确实有克扣，怎么办？",t("yi","hit","先查克扣军饷之人，当众正法，再论逃兵之罪。","将军肃然：「先正军需，才服众心。」"),t("li","reason","补发欠饷，逃兵自会回来。","他说：「补饷容易，逃了的未必肯回。」"),t("ming","evade","军法就是军法，不能因粮饷而废。","他反问：「军法若只罚小兵，还算军法吗？」")),r("首恶抓到了，可他是老将军的旧部，动不动？",t("shi","hit","把案子公开审，让老将军自己避嫌。","将军点头：「公开审，谁也不好插手。」"),t("ming","reason","先禀明君上，请君上定夺。","他说：「君上若护着他呢？」"),t("yi","evade","念其旧功，免死流放便是。","他叹：「免死流放，别人也照着学。」"))],k("克扣账目",1,"你出示账目：军需官连续三月克扣粮饷，有据可查。"),{success:"军纪整肃，逃兵渐少。",compromise:"将军同意整肃，但要你巡查各营，清查克扣。",fail:"处置失当，营中哗变。"},{success:{fame:5,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"巡查营伍",desc:"将军命你巡查各营，清查克扣粮饷之事。",mode:"check",checkSkill:"bingfa",dc:44,days:15,reward:{money:60,fame:3,merit:10}}),f("exchange","交换战俘","military","yi",!0,"将军","本国将军","两国交换战俘，人数、诚信与战俘意愿都成问题。",[r("对方要多换少，说他们抓的人更值钱，怎么应对？",t("li","hit","按人头与官职折算，列出名册，一人对一人。","将军点头：「有名册，就不能随口开价。」"),t("yi","reason","都是父母生养，何必分贵贱。","他叹：「道理是道理，对方未必认。」"),t("ming","evade","从前交换战俘都是对等的，照旧例便是。","他反问：「旧例能管住眼前这位吗？」")),r("对方若在交换时突然变卦，我们的人岂不是白放？",t("ming","hit","双方同时放人，由中立之国派吏监交。","将军道：「有监交，谁也别想赖。」"),t("yi","reason","既已说定，便当以信义相待。","他摇头：「战场上的信义，最靠不住。」"),t("shi","evade","扣下他们几个贵族，看他们敢不敢变卦。","他皱眉：「这样我们也失了信。」")),r("有些战俘在敌国已成了家，不愿回来，怎么办？",t("yi","hit","愿归者归，愿留者听之，不强迫。","将军沉默片刻：「人各有志，勉强不得。」"),t("ming","reason","按律，战俘须归国，否则除籍。","他说：「除籍容易，人心难收。」"),t("li","evade","给他们一笔安家钱，自然愿意回来。","他反问：「钱花完了，他们还会留吗？」"))],k("战俘名册",0,"你出示名册：双方可交换者各一百二十七人，数目相当。"),{success:"战俘各归其国，两国关系稍缓。",compromise:"将军同意交换，但要你护送战俘回国。",fail:"交换中途破裂，战俘仍陷敌国。"},{success:{fame:5,rel:6,merit:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"护送战俘",desc:"将军命你护送战俘前往朝歌，交还本国。",mode:"travel",targetCity:"chaoge",days:18,reward:{money:60,fame:4,merit:8}}),f("reward","犒赏三军","military","ming",!0,"将军","本国将军","大军凯旋，将军要犒赏，却怕赏额不当、分配不公、财源不足。",[r("府库只够发一半赏钱，怎么安抚将士？",t("li","hit","先发一半现钱，余下以田宅与免役折算。","将军点头：「有钱有田，将士才觉得没白打。」"),t("ming","reason","可先记功，待来年府库宽裕再补。","他摇头：「来年？来年他们还记得吗？」"),t("yi","evade","将士为国而战，不会计较这些。","他苦笑：「不计较？那要看家里有没有米。」")),r("有人杀敌多却官职低，有人靠关系领厚赏，怎么服众？",t("ming","hit","当众核验军功，按首级与战功定赏，关系一概不论。","将军道：「公开核功，谁也说不出话。」"),t("yi","reason","都是为国流血，多分一些给普通士卒。","他叹：「普通士卒要顾，功臣也不能寒心。」"),t("shi","evade","谁敢闹，就按军法处置。","他反问：「闹的人多了，你处置得完吗？」")),r("犒赏之后府库空虚，来年军费从哪里出？",t("li","hit","只赏有功者，裁掉冗员，把军费留给来年。","将军道：「裁冗赏功，倒还撑得住。」"),t("shi","reason","来年再向富户加征，总能补上。","他说：「加征多了，富户也会跑。」"),t("ming","evade","来年的事来年再说，先稳住眼前。","他叹：「眼前稳了，来年就难了。」"))],k("军功簿",1,"你出示军功簿：真正斩首立功者不足三成，余多虚报。"),{success:"赏罚分明，三军欢腾。",compromise:"将军同意犒赏，但要你先核实军功。",fail:"赏赐不公，军中怨言四起。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-4}},{title:"核实军功",desc:"将军命你核实各营军功，剔除虚报。",mode:"check",checkSkill:"suanshu",dc:44,days:14,reward:{money:60,fame:3,merit:10}}),f("captives","处置降卒","military","ming",!1,"降卒","敌国降卒","数千降卒待处置，收编怕哗变，放归怕再战，杀降又不忍。",[r("收编降卒，万一他们阵前倒戈怎么办？",t("ming","hit","打散编入各营，使其无法结党，再以军法约束。","降卒头目沉默：「打散了，我们也没法抱团。」"),t("yi","reason","既已归降，便当一视同仁，以诚相待。","他苦笑：「诚？我们连明天都不知道。」"),t("li","evade","多给粮饷，他们自然肯卖命。","他反问：「粮饷从哪里来？」")),r("降卒听说要被活埋，夜里鼓噪，怎么稳住？",t("shi","hit","当众宣布不杀降，先发一日口粮，乱自会平。","降卒们面面相觑，鼓噪声渐止。"),t("ming","reason","派人进去宣谕军令，只罚首恶，不及其余。","头目道：「只罚首恶，这话我们信不过。」"),t("yi","evade","杀降不祥，将军若开恩，他们必感念。","他叹：「感念？我们只想活着。」")),r("这些降卒的父兄多死在我军手里，旧怨怎么化解？",t("yi","hit","让降卒中的长者出来管事，许他们为死者立冢。","降卒们低声议论，神色稍缓。"),t("ming","reason","把他们调到后方屯田，远离旧战场。","他说：「离得远，怨未必就消。」"),t("li","evade","发一笔抚恤，旧怨总能揭过去。","他冷笑：「死人的命，值几个钱？」"))],k("降卒名册",0,"你出示名册：降卒中大半是被强征的农夫，并非死党。"),{success:"降卒归心，愿为我用。",compromise:"降卒答应不闹事，但要求放归老弱。",fail:"降卒夜叛，营中大乱。"},{success:{fame:4,rel:5,merit:6},compromise:{fame:1,rel:2},fail:{fame:-4,rel:-5}},null)]});var Dn,Fn=O(()=>{Ae();Dn=[f("landcase","断争田案","court","ming",!0,"司寇","掌刑狱","两户争一亩水田，地契模糊，证人各执一词，其中一方还有豪强撑腰。",[r("地契上年月模糊，怎么断定这田归谁？",t("ming","hit","以旧界碑与历年纳赋记录互证，二者吻合者为真。","司寇点头：「有碑有册，才算铁证。」"),t("yi","reason","让两户各让一步，平分这块田。","他说：「平分看似公道，实则两家都不服。」"),t("shi","evade","谁家势大就判给谁，省得麻烦。","他正色：「那还要司寇做什么？」")),r("证人都被一方收买了，证词能信吗？",t("ming","hit","分开问话，互对细节，假证必露破绽。","司寇道：「分开问，才问得出真话。」"),t("yi","reason","证人若敢作伪证，重罚便是。","他叹：「罚得了一个，罚不了所有。」"),t("li","evade","谁给的钱多，谁的话就更可信。","他冷笑：「照你这么说，案子不必审了。」")),r("另一方背后有豪强施压，你敢不敢判？",t("ming","hit","把案卷公开，判词写明依据，豪强也不好公然插手。","司寇点头：「公开审，才堵得住人情。」"),t("shi","reason","先禀明君上，有君命撑腰再判。","他说：「君上若不肯出头呢？」"),t("yi","evade","王子犯法与庶民同罪，何惧豪强。","他苦笑：「话是这么说，刀笔却在我手里。」"))],k("旧界碑拓",0,"你出示旧界碑拓片：碑文所记与其中一家的纳赋册完全吻合。"),{success:"田界判明，两家无话可说。",compromise:"司寇同意判案，但要你下乡复勘田界。",fail:"判案被豪强压下，田界依旧不清。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"复勘田界",desc:"司寇命你下乡复勘田界，取得实证。",mode:"check",checkSkill:"quanmou",dc:44,days:15,reward:{money:60,fame:3,merit:8}}),f("injustice","平反冤狱","court","yi",!0,"司寇","掌刑狱","一桩旧案已定谳多年，苦主喊冤，司寇想翻案，却牵动原审官与真凶。",[r("案子已定多年，翻案就是打原审官的脸，值得吗？",t("yi","hit","若冤情属实，便该翻；错案不纠，法将不法。","司寇肃然：「这话，我记下了。」"),t("ming","reason","可先私下知会原审官，让他自己请罪。","他点头：「给他留个体面，阻力会小些。」"),t("shi","evade","原审官若敢阻挠，就连他一起办。","他皱眉：「无凭无据，怎么连他一起办？」")),r("真凶早已逃匿，拿不到人，怎么证明是冤案？",t("yi","hit","先找当年证人重问，哪怕只证明一处伪证，也可立案。","司寇道：「先撕开一个口子。」"),t("ming","reason","可发通缉，等真凶落网再翻案。","他叹：「苦主等得到那一天吗？」"),t("shi","evade","把苦主关起来，案子就不会再闹大。","他拍案：「那我还审什么案！」")),r("苦主已家破人亡，翻案之后如何补偿？",t("yi","hit","归还田产，减免赋役，再请君上赐一面旌表。","司寇点头：「有实有礼，才算补偿。」"),t("li","reason","从罚没的赃款里拨一笔给他。","他说：「赃款未必还在。」"),t("ming","evade","给他一个清白名声，也就够了。","他反问：「名声能当饭吃吗？」"))],k("旧案卷宗",1,"你出示旧案卷宗：关键证人的证词前后矛盾，且与现场勘验不符。"),{success:"冤案得雪，真凶伏法。",compromise:"司寇同意重审，但要你先寻访当年证人。",fail:"翻案受阻，苦主含恨而终。"},{success:{fame:7,rel:6},compromise:{fame:3,rel:3},fail:{fame:-4,rel:-4}},{title:"寻访证人",desc:"司寇命你寻访当年证人，重取证词。",mode:"check",checkSkill:"quanmou",dc:46,days:18,reward:{money:60,fame:4,merit:8}}),f("impeach","弹劾权臣","court","shi",!0,"大夫","本国大夫","权臣专权，大夫想弹劾，却苦于证据不足、君意不明、党羽众多。",[r("权臣党羽遍布朝堂，弹劾不成反遭其害，怎么起手？",t("shi","hit","先剪其羽翼，逐个查办其党羽的贪墨，再动首恶。","大夫点头：「先断其爪牙，才动得了根本。」"),t("li","reason","可先放出风声，试探君上与群臣的态度。","他说：「风声一放，他就有了防备。」"),t("yi","evade","只要出于公心，君上总会明白。","他苦笑：「公心？君上先看到的是你的奏章。」")),r("君上倚重权臣，未必肯动他，怎么办？",t("shi","hit","把权臣私通外敌的证据摆出，君上便不能再装看不见。","大夫目光一凛：「有通敌之证，他必死。」"),t("ming","reason","联合几位老臣一同上奏，以众议压君上。","他说：「老臣们未必肯出头。」"),t("yi","evade","君上若执意庇护，我便辞官不做。","他叹：「辞官容易，国事怎么办？」")),r("弹劾成功之后，朝堂空缺由谁填补？",t("ming","hit","举荐寒门贤才，既补空缺，也断权臣旧党复起之路。","大夫点头：「换血要换得干净。」"),t("li","reason","让副手暂代，等局势稳了再选人。","他说：「副手往往也是他的人。」"),t("shi","evade","先把位子空着，看看谁跳出来。","他反问：「空着位子，国事谁管？」"))],k("通敌密信",2,"你出示密信：权臣与敌国使臣往来，约定里应外合。"),{success:"权臣伏法，朝堂为之一清。",compromise:"大夫同意弹劾，但要你先搜集其党羽罪证。",fail:"弹劾失败，大夫被贬。"},{success:{fame:8,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-5,rel:-6}},{title:"搜集罪证",desc:"大夫命你暗中搜集权臣党羽的罪证。",mode:"check",checkSkill:"quanmou",dc:48,days:20,reward:{money:80,fame:4,merit:12}}),f("succession","立储之争","court","ming",!0,"国君","国君","国君年迈，诸子争立。长幼、母族与大臣各执一词。",[r("长子仁弱，幼子聪慧，到底该立谁？",t("ming","hit","立长以安宗庙，再择贤者为辅，名分与才具两全。","国君缓缓点头：「立长而辅以贤，或可两全。」"),t("yi","reason","择贤而立，社稷为重，何必拘泥长幼。","他叹：「择贤？谁来说谁贤？」"),t("shi","evade","谁背后的兵多，就立谁。","他脸色一沉：「那寡人还不如早点退位。」")),r("幼子母族势大，若立长子，他们会不会生乱？",t("ming","hit","立长子的同时，厚封幼子于外邑，使其母族无话可说。","国君目光一动：「分封而安，倒是个法子。」"),t("shi","reason","先夺其母族兵权，再立长子。","他说：「夺兵权容易，结怨也容易。」"),t("yi","evade","都是寡人之子，他们总不至于兵戎相见。","他苦笑：「寡人当年也是这么想的。」")),r("大臣们各有拥立之功的盘算，怎么不让他们结党？",t("ming","hit","立储之事由国君独断，不让大臣预闻，事后再论功。","国君点头：「不给他们机会，才不会有党。」"),t("li","reason","许他们拥立之后各有封赏，他们便不会闹。","他摇头：「封赏越多，胃口越大。」"),t("shi","evade","谁敢结党，就杀谁。","他反问：「杀得完吗？」"))],k("宗室谱牒",0,"你出示宗室谱牒：长子为嫡出，幼子母族虽强，却非正室。"),{success:"储位既定，朝局渐稳。",compromise:"国君同意立储，但要你先联络朝中重臣。",fail:"储位久悬，诸子相争。"},{success:{fame:6,rel:6,merit:8},compromise:{fame:3,rel:3},fail:{fame:-4,rel:-5}},{title:"联络朝臣",desc:"国君命你私下联络朝中重臣，探明立储风向。",mode:"check",checkSkill:"quanmou",dc:46,days:18,reward:{money:70,fame:4,merit:10}}),f("corruption","处置贪墨","court","li",!0,"执政","当国","地方官贪墨赈粮，民怨沸腾。执政要追赃、要牵连、还要平民愤。",[r("贪墨的官把钱花光了，赃款追不回来，怎么办？",t("li","hit","查抄其家产与田宅，不足之数由其上司分赔。","执政道：「上司分赔，才会真的管住下属。」"),t("shi","reason","把他贬为庶人，流放边地，也算惩罚。","他说：「流放了他，百姓的粮还是没回来。」"),t("yi","evade","只要他认罪悔过，便给他一条生路。","他冷笑：「百姓饿死时，谁给他们生路？」")),r("查下去牵连甚广，连执政你的旧部也在其中，怎么办？",t("li","hit","不论亲疏，一律按律查办，我先自请回避。","执政沉默良久：「回避，才能查得下去。」"),t("ming","reason","让御史台独立查案，我不插手。","他点头：「交给御史，倒还公道。」"),t("shi","evade","到此为止，再查下去朝局就乱了。","他反问：「朝局稳了，民心呢？」")),r("民怨已起，百姓要一个交代，怎么安抚？",t("yi","hit","把贪墨所得悉数发还灾民，当众宣读判词。","执政道：「当众发还，民心才服。」"),t("li","reason","再拨一批粮，先把眼前的饥荒压下去。","他说：「拨粮能救急，却救不了心。」"),t("ming","evade","发一道罪己诏，把责任揽到朝廷身上。","他叹：「罪己诏发多了，就没人信了。」"))],k("贪墨账册",0,"你出示账册：赈粮被层层克扣，经手官吏多达十余人。"),{success:"贪官伏法，赃款发还灾民。",compromise:"执政同意查办，但要你负责追缴赃款。",fail:"查办草草收场，民怨更盛。"},{success:{fame:6,rel:6},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"追缴赃款",desc:"执政命你追缴赃款，清点发还。",mode:"check",checkSkill:"suanshu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),f("ritual","宗庙祭祀","court","yi",!0,"国君","国君","宗庙大祭将行，礼制、费用与吉日都有争议。",[r("礼制该照旧典，还是从简？府库并不宽裕。",t("yi","hit","礼贵诚敬，牺牲可减，仪节不可废。","国君点头：「减物不减礼，说得通。」"),t("li","reason","一切从简，省下的钱用于军费。","他皱眉：「祭礼从简，宗室怕要说话。」"),t("ming","evade","照旧典办，免得被人说不敬祖宗。","他叹：「旧典办下来，府库就见底了。」")),r("宗室坚持要用天子规格，可我们只是诸侯，怎么办？",t("yi","hit","按本国爵位行礼，多献一篇颂辞以表敬意。","国君道：「守礼而不僭越，才合本分。」"),t("shi","reason","天子衰微，诸侯用天子礼的也不止我们一家。","他摇头：「别人僭越，我们不能跟着。」"),t("ming","evade","让宗人府去争，寡人不置可否。","他苦笑：「不置可否，最后还是要寡人担名。」")),r("占卜说吉日与农时冲突，百姓要下田，怎么选？",t("yi","hit","祭礼提前一日，既合吉时，也不误农时。","国君点头：「两全其美，就这么办。」"),t("ming","reason","农时可以等，祭礼不能误。","他反问：「误了农时，明年吃什么？」"),t("li","evade","多雇些人来行礼，百姓照常下田。","他说：「雇来的人，行礼能诚吗？」"))],k("旧礼图",1,"你出示旧礼图：诸侯之祭本有减等之礼，并非僭越。"),{success:"祭礼成，宗室与百姓皆无怨言。",compromise:"国君同意从简，但要你主持筹备祭礼。",fail:"祭礼失序，诸侯讥笑。"},{success:{fame:4,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"筹备祭礼",desc:"国君命你筹备宗庙祭礼，核定仪节与用度。",mode:"check",checkSkill:"xuewen",dc:44,days:14,reward:{money:50,fame:3,merit:6}}),f("law","制定刑律","court","ming",!0,"执政","当国","旧刑律已不合时宜，执政要修律，旧族反对、轻重难定、执行更难。",[r("旧族说祖宗之法不可改，怎么回应？",t("ming","hit","刑律随世而变，但可保留旧律中的礼教条款，以示不忘本。","执政点头：「存其礼，改其刑，旧族便无话可说。」"),t("yi","reason","法为治民，不为守旧，该改就得改。","他叹：「道理都对，旧族不会听。」"),t("shi","evade","谁反对就贬谁，看谁还敢说话。","他皱眉：「律未成，先失人心。」")),r("刑轻则奸人不怕，刑重则百姓受苦，怎么定？",t("ming","hit","按罪行轻重分等，赃多者重，过失者轻。","执政道：「分等定罪，才算公允。」"),t("li","reason","重刑之下必有畏服，先镇住再说。","他摇头：「镇得了一时，镇不了一世。」"),t("yi","evade","以德化民，刑罚只是不得已而用。","他反问：「德化得了盗跖吗？」")),r("律令定了，地方官不肯照办，怎么办？",t("ming","hit","把刑律铸于鼎上，公示于市，百姓可据律申冤。","执政目光一亮：「公示于民，官吏便瞒不住。」"),t("shi","reason","派御史巡查，违律者免官。","他说：「御史只有几个人，管不了天下。」"),t("li","evade","把律令与考绩挂钩，办得好的升官。","他叹：「考绩也能造假。」"))],k("旧律残卷",1,"你出示旧律残卷：其中已有按赃论罪的分等之法。"),{success:"新律颁行，吏民有所遵循。",compromise:"执政同意修律，但要你先征询旧臣意见。",fail:"修律受阻，旧律继续沿用。"},{success:{fame:6,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"征询旧臣",desc:"执政命你走访旧臣，征询修律意见。",mode:"check",checkSkill:"xuewen",dc:46,days:18,reward:{money:60,fame:3,merit:8}}),f("merits","朝堂论功","court","ming",!0,"国君","国君","战事方歇，朝堂论功行赏。标准、派系与赏赐都争执不下。",[r("有人斩首多，有人守城有功，谁该居首功？",t("ming","hit","斩首者赏金，守城者授爵，各按其功，不分高下。","国君点头：「各赏其功，便不用争了。」"),t("li","reason","按军功簿上的首级数来定，最简单。","他说：「守城之人，哪来的首级？」"),t("yi","evade","都是为国尽忠，何必分那么清。","他反问：「不分清，谁还肯拼命？」")),r("两派将领各拥其功，互相攻讦，怎么平息？",t("ming","hit","当众宣读军功簿，逐条核对，让两派都无话可说。","国君道：「公开核对，最服人。」"),t("shi","reason","各打五十大板，两边都压一压。","他叹：「压下去，心里还是不服。」"),t("yi","evade","让他们以国事为重，不要再争。","他苦笑：「以国事为重，说来轻巧。」")),r("府库赏赐不够，是先赏功臣还是先补军需？",t("li","hit","先赏战功最著者，其余记功待补，军需另筹。","国君点头：「先赏首功，余者记功，可行。」"),t("ming","reason","先补军需，来年再论功行赏。","他摇头：「将士等不到来年。」"),t("yi","evade","功臣深明大义，会体谅朝廷的难处。","他叹：「体谅一次可以，次次都体谅就寒心了。」"))],k("军功簿",0,"你出示军功簿：守城之功与斩首之功分列，互不掩没。"),{success:"论功得当，朝堂归心。",compromise:"国君同意论功，但要你先核实军功簿。",fail:"论功不公，两派将领离心。"},{success:{fame:5,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"核实军功",desc:"国君命你核实军功簿，剔除虚报。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:60,fame:3,merit:8}}),f("hunt","劝谏游猎","court","yi",!0,"国君","国君","国君沉迷游猎，荒废朝政。大夫想劝，又怕扫了君兴、触怒近臣。",[r("君上正玩得高兴，此时进谏，会不会扫兴获罪？",t("yi","hit","等君上猎罢歇息时，以农时与边患为切入，缓缓进言。","国君沉默片刻：「你倒是会挑时候。」"),t("ming","reason","可引前代贤君故事，让君上自己醒悟。","他说：「故事好听，君上未必往心里去。」"),t("shi","evade","君上若再游猎，就把猎场封了。","他反问：「你有几个脑袋敢封猎场？」")),r("近臣靠陪君上游猎得宠，他们会在君上耳边说你坏话。",t("yi","hit","进谏时只谈国事，不指责任何人，近臣便无从挑拨。","国君点头：「不点名，他们也不好说什么。」"),t("ming","reason","可先结交其中一二，让他们替你说话。","他叹：「与近臣结交，久了也成党。」"),t("li","evade","给他们些好处，让他们闭嘴。","他冷笑：「今天给好处，明天他们就要更多。」")),r("君上说游猎是为了练武备边，怎么反驳？",t("yi","hit","练武可在校场，何必践踏农田、劳烦百姓。","国君面色微变：「你这话，说得太重了。」"),t("ming","reason","可按古礼定下猎期，不误农时即可。","他点头：「定个规矩，倒还可行。」"),t("shi","evade","把猎场周围的百姓迁走，就没人说话了。","他反问：「迁走百姓，谁去种田？」"))],k("农时历",1,"你出示农时历：君上游猎的时日，正与播种、收割相冲。"),{success:"国君减猎，朝政渐理。",compromise:"国君同意节制游猎，但要你先安排农事。",fail:"劝谏触怒国君，大夫被疏远。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-4}},{title:"安排农事",desc:"国君命你安排猎场周边农事，不得误期。",mode:"check",checkSkill:"suanshu",dc:42,days:14,reward:{money:50,fame:3,merit:6}}),f("recommend","举荐贤才","court","yi",!0,"执政","当国","执政要举荐一位寒门贤才，却怕资历浅、同僚非议、君上不用。",[r("此人出身寒微，骤然举荐，群臣会不会说你结党？",t("yi","hit","举荐时陈明其才德与实绩，不称门生，不结私谊。","执政点头：「只论才，不认门生，便无话可说。」"),t("ming","reason","可先让他做个小吏，做出政绩再举荐。","他说：「这法子稳，只是慢。」"),t("shi","evade","谁敢非议，就让他拿出更好的人来。","他苦笑：「他们拿不出人，却拿得出闲话。」")),r("君上嫌他资历浅，不肯用，怎么办？",t("yi","hit","请君上先试之以一事，成则用，不成则退。","执政目光一亮：「试而后用，君上多半肯。」"),t("li","reason","许君上此人只做副手，不会专权。","他说：「副手做久了，也未必能转正。」"),t("ming","evade","把此人的文章呈给君上，君上自会赏识。","他反问：「君上若只看文章，还要政绩做什么？」")),r("此人若上任后与你政见不合，你会不会后悔？",t("yi","hit","举贤不避异己，他若有更好的主张，我自当让贤。","执政大笑：「这话，我记下了。」"),t("shi","reason","先用其才，若真不合，再调他处。","他点头：「用人所长，也算务实。」"),t("li","evade","先与他约定，大事必须听我的。","他叹：「这样的贤才，来了也施展不开。」"))],k("策论简",0,"你出示此人的策论简：论农田水利，条理分明，切中时弊。"),{success:"贤才得用，朝政为之一新。",compromise:"执政同意举荐，但要你亲自前往征辟。",fail:"举荐被驳回，贤才另投他国。"},{success:{fame:6,rel:5,merit:6},compromise:{fame:2,rel:3},fail:{fame:-3,rel:-3}},{title:"征辟贤者",desc:"执政命你前往曲阜，征辟这位寒门贤才。",mode:"travel",targetCity:"qufu",days:18,reward:{money:60,fame:4,merit:8}})]});var Bn,Gn=O(()=>{Ae();Bn=[f("seedloan","借贷粮种","trade","li",!1,"老农","乡里农夫","春耕在即，老农无种下田，想向富户借粮种，又怕利息与天灾。",[r("借粮种要还三成利，若秋收不好，我拿什么还？",t("li","hit","可先还一半，余下延到明年，利钱不再滚。","老农松了口气：「不滚利，倒还能喘口气。」"),t("yi","reason","乡里乡亲，总该互相帮衬，哪能见死不救。","他叹气：「帮衬是好，可债主也要吃饭。」"),t("shi","evade","不借便罢，我另想办法。","他苦笑：「你若有办法，就不会站在这儿了。」")),r("富户要我用田契作抵押，田没了，一家老小怎么办？",t("li","hit","只押一季收成，不押田契，白纸黑字写清楚。","老农点头：「只押收成，田还在，行。」"),t("ming","reason","可请乡老作保，不必押田契。","他说：「乡老肯保吗？富户未必认。」"),t("yi","evade","人无信不立，既然借了，就该拿田契作押。","他急道：「田没了，我们一家喝西北风？」")),r("若秋收前遭了天灾，官府又不赈济，这债怎么算？",t("li","hit","借约写明：遇灾则减半，官府有赈则先还官。","老农目光一亮：「有这一条，我才敢借。」"),t("yi","reason","天灾非人力可抗，债主总该讲点良心。","他叹：「良心？债主的良心也是粮养的。」"),t("ming","evade","官府总会赈济，不必杞人忧天。","他反问：「去年官府赈了吗？」"))],k("乡约旧例",0,"你出示乡约旧例：灾年借种，利钱减半，不得夺田。"),{success:"老农借到粮种，春耕如期。",compromise:"老农愿意借种，但要求你替他向富户说情。",fail:"老农借不到种，田地荒废。"},{success:{fame:3,rel:5},compromise:{fame:1,rel:2},fail:{fame:-1,rel:-2}},null),f("saltiron","盐铁专营","trade","li",!0,"大夫","掌财赋","官府欲行盐铁专营，以充府库，却触动私盐商人与百姓生计。",[r("私盐贩子遍地，官府一专营，他们必会闹事，怎么处置？",t("li","hit","先收编大商，给小贩发引票，让他们在官价下营生。","大夫点头：「给条活路，才不会逼反。」"),t("shi","reason","派兵查禁，见私盐就没收。","他说：「查得了一时，查不了遍地。」"),t("yi","evade","百姓吃不起盐，专营也该顾及民生。","他皱眉：「顾及民生，府库就空了。」")),r("盐价一涨，百姓怨声载道，怎么平？",t("li","hit","官盐分三等，最次一等平价卖给贫户。","大夫道：「分等而售，贫户也吃得起。」"),t("ming","reason","可贴告示说明专营是为了军费，百姓应当体谅。","他叹：「体谅归体谅，盐还是要吃。」"),t("yi","evade","宁可府库少收，也不能让百姓吃不起盐。","他反问：「府库空了，军饷谁来出？」")),r("大商巨贾会勾结官吏走私，怎么防？",t("li","hit","盐引编号、账目对查，官商勾结必留痕迹。","大夫目光一凝：「编号对账，倒能查出内鬼。」"),t("shi","reason","派亲信去盐场盯着，不经过地方官。","他说：「亲信也会被收买。」"),t("ming","evade","严刑峻法，走私者抄家灭族。","他叹：「法太酷，反而没人敢报官。」"))],k("私盐账册",0,"你出示私盐账册：本地私盐多经三名吏员放行。"),{success:"盐铁专营推行，府库渐充。",compromise:"大夫同意专营，但要你先查清私盐渠道。",fail:"专营受阻，私盐更加猖獗。"},{success:{fame:4,rel:4,merit:8},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"查私盐",desc:"大夫命你查禁私盐，揪出放行的吏员。",mode:"check",checkSkill:"quanmou",dc:44,days:16,reward:{money:80,fame:3,merit:8}}),f("inflation","物价飞涨","trade","li",!0,"司徒","掌财赋","城中物价飞涨，粮布皆贵。司徒要压价，却怕伤商、怕无粮、怕民怨。",[r("商家说进价就高，压价他们就关门，怎么办？",t("li","hit","官府先平价售一部分粮布，商家怕货砸手里，自会跟价。","司徒点头：「以小搏大，可以一试。」"),t("shi","reason","定最高价，违者罚没。","他说：「罚没了几家，别家就藏货不卖。」"),t("yi","evade","商人总要讲点良心，不该发国难财。","他冷笑：「良心要是能压价，我就不用愁了。」")),r("官仓存粮不多，平价售粮能撑多久？",t("li","hit","只售到秋收，同时向邻县调运，撑过青黄不接。","司徒道：「算着日子售，才不至于见底。」"),t("shi","reason","强征豪商存粮，先压住局面。","他说：「强征容易，商路断了更难。」"),t("ming","evade","可请君上下诏，令豪商平价出售。","他反问：「诏书下了，他们照办吗？」")),r("百姓买不到粮，已经开始抢粮，怎么稳住？",t("li","hit","按户发粮牌，凭牌限量购买，杜绝囤积。","司徒目光一亮：「凭牌限购，倒能稳住。」"),t("yi","reason","开仓赈济，先让最穷的人有饭吃。","他叹：「开仓容易，后续难以为继。」"),t("shi","evade","派兵弹压，抢粮者就地正法。","他皱眉：「杀得了一时，杀不了一世。」"))],k("商路图",1,"你出示商路图：邻县粮价尚低，运程只需五日。"),{success:"物价渐平，民心稍安。",compromise:"司徒同意平价售粮，但要你主持平售之事。",fail:"物价失控，城中大乱。"},{success:{fame:5,rel:5},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"平价售粮",desc:"司徒命你主持平价售粮，按户发票、限量供应。",mode:"check",checkSkill:"shanggu",dc:44,days:16,reward:{money:70,fame:3,merit:8}}),f("caravan","商队通行","trade","shi",!0,"关吏","边关守吏","一支大商队要过关，关吏既想收税，又怕盗匪与间谍混在其中。",[r("商队货物繁多，一件件查验，商队等得起吗？",t("shi","hit","分货类抽验，贵重与军械全查，其余放行。","关吏点头：「抽验加重点，倒还快。」"),t("li","reason","按货值收税，多收些钱，商队自然愿意等。","他说：「收得多了，商队下次就绕道。」"),t("ming","evade","按旧例查验，不必多事。","他反问：「旧例查得出间谍吗？」")),r("关外盗匪横行，商队若在关外被劫，会不会怪我们？",t("shi","hit","派一队关卒护送出界，既保商队，也显国威。","关吏道：「护送一程，商队才会再来。」"),t("li","reason","收一笔护送费，由商队自己出人。","他皱眉：「商队自己出人，还要我们做什么？」"),t("yi","evade","盗匪劫财，与我们无关，不必多管。","他叹：「商队被劫一次，就再也不来了。」")),r("商队里若有敌国探子，放过去就是大罪，怎么查？",t("shi","hit","查符传与货主名籍，军中工匠与地图匠重点盘问。","关吏目光一凛：「查工匠与地图匠，倒是要害。」"),t("ming","reason","让商队互保，一人犯事，全队连坐。","他说：「连坐能逼他们自己查。」"),t("li","evade","多收些保证金，出了事就扣钱。","他反问：「探子会在乎那点钱吗？」"))],k("商队符传",1,"你出示商队符传：其中三名工匠的名籍与货单不符。"),{success:"商队顺利过关，关税与安全两全。",compromise:"关吏同意放行，但要你护送商队出界。",fail:"商队被劫，边关声誉受损。"},{success:{fame:4,rel:4,merit:6},compromise:{fame:2,rel:2},fail:{fame:-3,rel:-3}},{title:"护送商队",desc:"关吏命你护送商队出界，防备盗匪。",mode:"combat",enemy:{name:"关外盗匪",wu:54,skill:3,hp:88},days:12,reward:{money:80,fame:4,merit:8}}),f("strike","工匠罢工","trade","li",!1,"工匠","城中匠户","官府催造军械，工匠却因工钱拖欠而罢作，双方僵持。",[r("工钱拖欠了三个月，让我们怎么干活？",t("li","hit","先发一个月工钱，余下按半月一结，绝不拖欠。","工匠头目点头：「先发一个月，兄弟们才肯动。」"),t("yi","reason","朝廷也有难处，大家该共渡难关。","他冷笑：「难关都让我们渡，官老爷吃什么？」"),t("shi","evade","再不复工，就抓几个带头的。","他怒道：「抓吧，抓完了看谁给你造兵器。」")),r("军械催得急，工期赶不上，谁担这个责任？",t("li","hit","加派人手、分班昼夜赶工，工钱按件另计。","工匠们低声商议，神色稍缓。"),t("ming","reason","请上官宽限几日，先赶最急的一批。","他说：「宽限？上官会听我们的？」"),t("yi","evade","为将者当体恤匠人，不可一味催逼。","他叹：「体恤？兵器造不出来，先掉脑袋的是我们。」")),r("带头罢工的几个人，官府要办他们，你怎么看？",t("li","hit","只要复工，往罪不究，工钱照补。","头目沉默半晌：「不究往罪，我们就复工。」"),t("yi","reason","他们也是被逼无奈，罚些钱便算了。","他反问：「罚钱？我们连饭都吃不上。」"),t("shi","evade","带头的必须办，不然以后人人效仿。","他冷声道：「那就没人给你干活了。」"))],k("工钱簿",0,"你出示工钱簿：拖欠工钱属实，经手官吏还克扣了一成。"),{success:"工匠复工，军械如期交付。",compromise:"工匠同意复工，但要你督办补发工钱。",fail:"罢工扩大，军械停工。"},{success:{fame:3,rel:4,merit:6},compromise:{fame:1,rel:2},fail:{fame:-3,rel:-3}},null),f("manumit","奴婢赎身","trade","yi",!0,"主人","城中富户","一名奴婢想赎身，主人要价甚高，又怕开了先例，家中奴婢都思走。",[r("赎金要得高，她拿不出来，你让我白放人？",t("yi","hit","赎金可分期，先付三成，余下以工抵，不误你家用度。","主人沉吟：「分期以工抵，倒不吃亏。」"),t("li","reason","按市价折算，我另补你一笔钱。","他说：「钱我要，人也不能白放。」"),t("shi","evade","奴婢赎身本就不合规矩，不必再谈。","他冷下脸：「那就没什么好说的了。」")),r("放她走了，家中其他奴婢也要赎身，怎么办？",t("yi","hit","立个规矩：年满四十、无家累者许赎，幼者仍留。","主人点头：「立规矩，总比乱放人好。」"),t("ming","reason","可让她写下自愿留居的字据，压住旁人。","他皱眉：「字据压得住人，压不住心。」"),t("li","evade","谁要赎身，赎金加倍便是。","他反问：「加到你出不起，你还会来求我吗？」")),r("放奴婢出门，她无依无靠，出了事谁担？",t("yi","hit","许她在你家中再做一年，攒些盘缠，也算全了主仆之义。","主人叹道：「主仆一场，这话还算有人情。」"),t("li","reason","给她一笔安家钱，往后各不相干。","他说：「钱给了，出了事可别来找我。」"),t("ming","evade","给她找个好人家嫁了，也算仁至义尽。","他反问：「她自己愿意吗？」"))],k("卖身契",0,"你出示卖身契：契上写明二十年为期，如今已满十八年。"),{success:"奴婢赎身，主仆两安。",compromise:"主人同意放人，但要你先替她筹措赎金。",fail:"赎身不成，奴婢继续为奴。"},{success:{fame:4,rel:4},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"筹赎金",desc:"主人命你替她筹措赎金，限期十日。",mode:"check",checkSkill:"shanggu",dc:42,days:12,reward:{money:40,fame:3,merit:4}}),f("water","水利争水","trade","ming",!1,"里正","乡里里正","两村争一条水渠，旧约模糊，械斗一触即发。",[r("上游村说水是他们先开的，下游村说自古共用，谁有理？",t("ming","hit","查旧渠碑与两村纳赋记录，按出工与用水旧例分水。","里正点头：「有碑有册，才好说话。」"),t("yi","reason","都是乡里，各让一步，轮流用水便是。","他叹：「轮流？旱起来谁肯让？」"),t("shi","evade","谁家丁多就多分水，省得吵闹。","他怒道：「那还要里正做什么！」")),r("旧约只写了“共用水源”，没写怎么分，怎么办？",t("ming","hit","按田亩多少定水时，田多者多用水，也多重修渠之责。","里正目光一亮：「按田分水，倒也公道。」"),t("li","reason","让两村出钱修渠，谁出得多谁用得多。","他说：「穷村出不起钱，只能少用水？」"),t("yi","evade","让他们自己商量，商量不成就报官。","他苦笑：「报官？官府管得过来吗？」")),r("两村已经动了手，有人受伤，怎么压住场面？",t("yi","hit","先让两村各出人照料伤者，再坐下来谈水。","里正点头：「先治伤，再谈水，才有人味。」"),t("shi","reason","把两村的头面人物叫来，先各打一顿板子。","他皱眉：「打完了，仇更深。」"),t("li","evade","谁先动手就罚谁的钱，用罚款修渠。","他说：「罚了钱，水还是不够用。」"))],k("旧渠碑",1,"你出示旧渠碑拓：碑文写明两村按田亩出工、按田亩分水。"),{success:"两村按旧例分水，械斗渐止。",compromise:"两村愿意停斗，但要你主持重新立约。",fail:"争水再起，两村结下深仇。"},{success:{fame:4,rel:4},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-2}},null),f("fraud","市场欺诈","trade","ming",!0,"市吏","市井小吏","市中有商贩以次充好，坑骗百姓。市吏要查，却怕商贩抱团、证据不足。",[r("商贩抱团，查一个其余就藏货，怎么查？",t("ming","hit","先暗访取证，抓一个典型当众处罚，其余自会收敛。","市吏点头：「抓典型，比撒网有用。」"),t("li","reason","设举报赏钱，让买主自己来告。","他说：「赏钱一开，诬告也跟着来。」"),t("shi","evade","派兵封市，逐个搜查。","他反问：「封了市，百姓吃什么？」")),r("百姓吃了亏，却不敢来告，怎么办？",t("ming","hit","允许匿名投书，市吏亲自核验，不透露告发者。","市吏道：「匿名投书，倒能让人敢说话。」"),t("yi","reason","为商者当以诚信为本，先教化他们。","他叹：「教化？他们只认钱。」"),t("li","evade","查到假货就重罚，罚到他们不敢再犯。","他说：「罚得重，也得先查得到。」")),r("查出来的假货怎么处置？退钱还是没收？",t("ming","hit","假货当众销毁，钱退买主，罚金入官。","市吏点头：「当众销毁，最有震慑。」"),t("li","reason","没收假货，转卖充公，多少补些府库。","他皱眉：「转卖假货，岂不是官府也骗人？」"),t("yi","evade","让商贩自己退钱赔礼，给他一个改过的机会。","他反问：「他若不肯呢？」"))],k("买主证词",0,"你出示三位买主的证词：所购丝帛掺假，分量不足。"),{success:"市风一清，百姓称快。",compromise:"市吏同意查办，但要你先暗访取证。",fail:"查办无果，假货依旧横行。"},{success:{fame:4,rel:4},compromise:{fame:2,rel:2},fail:{fame:-2,rel:-3}},{title:"查市",desc:"市吏命你暗访市中，查取证物与买主证词。",mode:"check",checkSkill:"quanmou",dc:42,days:12,reward:{money:50,fame:3,merit:6}}),f("hoarding","灾年囤粮","trade","shi",!0,"大夫","掌民政","灾年粮贵，豪商囤粮不卖，等着再涨。大夫要开仓、要查抄，又怕商路断绝。",[r("豪商囤粮，官府查抄，会不会吓得商路断绝？",t("shi","hit","只查抄恶意囤积者，守法商人照常营业并张榜保护。","大夫点头：「赏罚分明，商路才不断。」"),t("li","reason","按市价加价收购，让他们有利可图。","他说：「加价收购，粮价只会更高。」"),t("yi","evade","商人趁灾发财，天理难容，尽数查抄。","他皱眉：「全抄了，以后谁还敢运粮来？」")),r("官仓存粮不足，查抄来的粮怎么分？",t("shi","hit","先赈最急的灾区，余粮平粜，钱入官仓再籴。","大夫道：「先救急，再平粜，倒还周全。」"),t("yi","reason","按人头平分，人人有份，最是公道。","他叹：「平分到每户，杯水车薪。」"),t("li","evade","把粮卖了换钱，再拿钱去别处买。","他反问：「灾年谁肯卖粮给你？」")),r("百姓已经围了豪商的粮仓，随时可能抢粮，怎么办？",t("yi","hit","当众开仓平粜，让百姓买到粮，围自会散。","大夫点头：「有粮可买，谁还愿意去抢。」"),t("shi","reason","派兵守住粮仓，先压住乱民。","他说：「压得住今天，压不住明天。」"),t("ming","evade","张贴告示，说三日内开仓，先稳住人心。","他苦笑：「三日之后无粮，闹得更凶。」"))],k("囤粮清册",0,"你出示清册：三家豪商囤粮逾五万石，足够全城三月。"),{success:"粮仓打开，灾民得食。",compromise:"大夫同意查抄，但要你带人查封囤粮。",fail:"抢粮爆发，城中大乱。"},{success:{fame:6,rel:5,merit:8},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-5}},{title:"查抄囤粮",desc:"大夫命你查封豪商粮仓，拘拿为首者。",mode:"combat",enemy:{name:"豪商家丁",wu:52,skill:3,hp:85},days:10,reward:{money:80,fame:4,merit:10}}),f("pirates","海商遇盗","trade","shi",!0,"将军","水师将领","海商在近海遇盗，货物尽失。将军要剿盗，却不知踪迹、兵船不足、商人催逼。",[r("海盗来去如风，踪迹不明，怎么剿？",t("shi","hit","先派快船尾随劫后商船，顺藤摸瓜找其巢穴。","将军目光一亮：「尾随商船，倒能摸到老巢。」"),t("li","reason","悬赏海盗内部人头，重赏之下必有内应。","他说：「赏钱能买内应，也怕买来假消息。」"),t("ming","evade","海盗不过疥癣之疾，守住港口便是。","他反问：「守得住港口，守得住海上商路吗？」")),r("水师兵船不足，出海剿盗会不会反被海盗吃掉？",t("shi","hit","不正面决战，先诱其上岸劫粮，伏兵于岸。","将军点头：「诱敌上岸，以逸待劳。」"),t("li","reason","征用商船充作兵船，先凑够船数。","他摇头：「商船不结实，一撞就散。」"),t("yi","evade","海盗也是被逼为盗，可招抚一部分。","他冷笑：「招抚？他们抢了商船，还肯听招抚？」")),r("商人催着要赔偿，官府赔不起，怎么办？",t("li","hit","不赔现钱，减其三年市税，并派兵护商。","将军道：「减税护商，商人或许肯认。」"),t("yi","reason","朝廷当为商民做主，哪怕借债也要赔。","他叹：「借了债，还不是要百姓还。」"),t("shi","evade","海盗抢的，找海盗要去，官府不管。","他摇头：「这么办，商船以后都不来了。」"))],k("海盗巢图",1,"你出示海图：海盗巢穴在近岛，退潮时只有一条水道可入。"),{success:"海盗巢穴被破，海路复通。",compromise:"将军同意剿盗，但要你随水师出海。",fail:"水师失利，海盗更加猖獗。"},{success:{fame:6,rel:5,merit:10},compromise:{fame:2,rel:2},fail:{fame:-4,rel:-4}},{title:"清剿海盗",desc:"将军命你随水师出海，清剿近岛海盗巢穴。",mode:"combat",enemy:{name:"海盗首领",wu:64,skill:4,hp:105},days:15,reward:{money:100,fame:5,merit:12}})]});var Bc,Gc,Vc,Yc,Uc,Kc,Qc,Wc,Zc,Jc,Xc,eu,iu,tu,au,su,nu,ou,ru,lu,cu,Vn,Yn=O(()=>{Ae();Bc={theme:"社稷无常奉",intro:"史墨，晋之史官。赵简子问季氏出其君。",debates:[f("v_shimo_sheji","社稷无常奉","court","yi",!0,"史墨","晋之史官","赵简子问：「季氏出其君，而民服焉，诸侯与之。君死于外，莫之或罪也。」",[r("季氏出其君，何以为无罪？",t("yi","hit","社稷无常奉，君臣无常位，自古以然。季氏世修其勤，民忘其君久矣。","史墨曰：「此吾所以对也。」"),t("li","reason","君虽无道，臣不可出之。此大伦也。","史墨曰：「鲁君世从其失，季氏世修其勤。」"),t("shi","evade","君之出，非一人之罪。","史墨曰：「民不知君，何以事之？」")),r("民服季氏而不服其君，君以为何故？",t("yi","hit","君失其德，则民不知有君。非民叛也，君自弃之。","史墨曰：「此吾所谓无常也。」"),t("li","reason","民为季氏所愚耳。","史墨曰：「鲁君世从其失。」"),t("ming","evade","民之向背，皆有其数。","史墨曰：「社稷无常奉。」")),r("鲁君死于外，莫之或罪。史当如何书？",t("yi","hit","书其实，不隐不饰。史者，天下之公器也。","史墨曰：「此吾之职也。」"),t("li","reason","当为君讳。讳则名分犹存。","史墨曰：「君死于外，莫之或罪。」"),t("shi","evade","书法之详略，随其时而异。","史墨曰：「社稷无常奉，君臣无常位。」"))],null,{success:"史墨曰：「君可与言史矣。」",compromise:"史墨曰：「君之言，可采。」",fail:"史墨曰：「君犹拘于名。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shimo_shi","史职","court","yi",!1,"史墨","晋之史官","或问：「史者，记事而已乎？」史墨曰：「史者，记天下之义。」",[r("史之职，记事抑或记义？",t("yi","hit","记义。事有虚实，义不可诬。","史墨曰：「此吾之守也。」"),t("li","reason","记事而已。义者，后人之评。","史墨曰：「史者，记天下之义。」"),t("ming","evade","事与义，皆当记。","史墨曰：「社稷无常奉。」")),r("君恶闻其过，史当曲笔乎？",t("yi","hit","不可。董狐书「赵盾弑其君」，孔子称其良史。","史墨曰：「此吾之所以守也。」"),t("li","reason","当曲笔以全身，留身以修后史。","史墨曰：「书法不隐。」"),t("shi","evade","曲与直，随其时而定。","史墨曰：「史者，记天下之义。」")),r("史之为公器，其权安在？",t("yi","hit","在其笔。笔存则善恶不可掩，此胜于刀锯。","史墨曰：「善哉！君知史矣。」"),t("li","reason","史无权，权在君。史不过记事。","史墨曰：「书法不隐。」"),t("ming","evade","权之有无，非史所计。","史墨曰：「社稷无常奉。」"))],null,{success:"史墨曰：「君可与言史职矣。」",compromise:"史墨曰：「君之言，半是。」",fail:"史墨曰：「君犹重身而轻笔。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Gc={theme:"两可之说",intro:"邓析操两可之说，设无穷之辞。",debates:[f("v_dengxi_liangke","两可之说","court","li",!0,"邓析","郑之辩者","郑人有过，邓析操两可之说，以是为非，以非为是。",[r("一事而两可，君以为辩乎？诡乎？",t("li","hit","辩也。事有理有势，从理则一，从势则二。两可者，辨其势也。","邓析曰：「此吾之所以能辩也。」"),t("yi","reason","诡也。是非自有定论，两可则乱名实。","邓析曰：「操两可之说，设无穷之辞。」"),t("shi","evade","辩与诡，视其用。","邓析曰：「以是为非，以非为是。」")),r("以是为非，天下岂不乱？",t("li","hit","不乱。使人知是非之无定，则不敢轻断，吏亦不能以私意断狱。","邓析曰：「此吾之所以为也。」"),t("yi","reason","必乱。民无所守，则讼狱滋丰。","邓析曰：「子产铸刑书，吾作竹刑。」"),t("ming","evade","乱与不乱，在人之用。","邓析曰：「操两可之说。」")),r("驷歂杀君而用其竹刑，君以为何如？",t("li","hit","可。人可杀，刑可存。刑之善者，不以人废。","邓析曰：「此吾之所以不恨也。」"),t("yi","reason","不可。用其法而杀其身，非义。","邓析曰：「驷歂杀我而用吾竹刑。」"),t("shi","evade","身后之事，非所计。","邓析曰：「操两可之说。」"))],null,{success:"邓析曰：「君可与言辩矣。」",compromise:"邓析曰：「君之言，有见。」",fail:"邓析曰：「君之说，一偏之见也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_dengxi_zhuxing","竹刑","domestic","li",!1,"邓析","郑之辩者","子产铸刑书于鼎，邓析作竹刑，民从之，郑国大乱。",[r("刑书既铸，君复作竹刑，何也？",t("li","hit","鼎文简略，民不能用。竹刑细密，使民自知其罪。","邓析曰：「此吾之竹刑也。」"),t("yi","reason","国法一也。复作私刑，是乱国政。","邓析曰：「郑国大乱。」"),t("shi","evade","刑之详略，各有其宜。","邓析曰：「民从之。」")),r("教民讼而取其中，君以为可乎？",t("li","hit","可。民知讼则吏不能欺。取其中者，酬其劳也。","邓析曰：「此吾之所以为也。」"),t("yi","reason","不可。导民以讼，风俗日坏。","邓析曰：「献衣襦袴者不可胜数。」"),t("ming","evade","讼之繁简，自有其势。","邓析曰：「郑国大乱。」")),r("法之详，可使人无讼乎？",t("li","hit","不可。法愈详则争愈细。然细则吏不能欺，此其利也。","邓析曰：「善哉！君知法之两难矣。」"),t("yi","reason","可。法明则民知所避。","邓析曰：「民从之。」"),t("shi","evade","讼之有无，非法所能定。","邓析曰：「操两可之说。」"))],null,{success:"邓析曰：「君可与言法矣。」",compromise:"邓析曰：「君之言，可采。」",fail:"邓析曰：「君之说，未达法之意。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Vc={theme:"御风与贵虚",intro:"列御寇，郑人。其学以虚无为本。",debates:[f("v_lieyukou_yufeng","御风","court","ming",!0,"列御寇","郑之隐者","列子御风而行，泠然善也，旬有五日而后反。",[r("御风而行，其道何如？",t("ming","hit","乘天地之正，御六气之辩。此非力也，顺之而已。","列御寇曰：「此吾之所以能行也。」"),t("li","reason","风不可御。此皆寓言。","列御寇曰：「泠然善也。」"),t("yi","evade","御风之术，不足为道。","列御寇曰：「此虽免乎行，犹有所待者也。」")),r("御风犹有所待，然则何者为至？",t("ming","hit","无待。乘天地之正，以游无穷者，彼且恶乎待哉？","列御寇曰：「此吾所谓至也。」"),t("shi","reason","有所待而后能行，乃天下之常。何必求无待？","列御寇曰：「犹有所待者也。」"),t("li","evade","有待无待，皆非实用。","列御寇曰：「御风而行。」")),r("学御风十五年而不成，君以为何如？",t("ming","hit","不成者，非技之失，乃心未虚也。心虚则风自至。","列御寇曰：「此吾之所以学也。」"),t("li","reason","当更精其技。技成则事成。","列御寇曰：「泠然善也。」"),t("yi","evade","成与不成，皆有其时。","列御寇曰：「犹有所待者也。」"))],null,{success:"列御寇曰：「君可与言虚矣。」",compromise:"列御寇曰：「君之言，可采。」",fail:"列御寇曰：「君犹有所待。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_lieyukou_ju","拒粟","court","ming",!1,"列御寇","郑之隐者","子阳为郑相，使人遗列子粟。列子再拜而辞。",[r("相馈之粟，君何故辞？",t("ming","hit","君非自知我也，以人之言而遗我粟；至其罪我也，又且以人之言。此吾所以不受也。","列御寇曰：「此吾之所以辞也。」"),t("li","reason","受之无伤。饥而辞粟，非智。","列御寇曰：「君非自知我也。」"),t("yi","evade","受与不受，皆小节。","列御寇曰：「再拜而辞。」")),r("民有饥色而辞人之粟，君以为矫乎？",t("ming","hit","不矫。受非其道，则终身受制于人。","列御寇曰：「此吾之所守也。」"),t("li","reason","矫矣。饥而死，何守可言？","列御寇曰：「其妻望之而拊心。」"),t("shi","evade","矫与不矫，唯其自知。","列御寇曰：「君非自知我也。」")),r("子阳既死，其党皆诛，而君独免。何故？",t("ming","hit","以吾不受其粟也。受则为其党，不受则非其党。","列御寇曰：「此吾之所以免也。」"),t("li","reason","偶然耳，非辞粟之功。","列御寇曰：「民有饥色。」"),t("yi","evade","免与不免，皆有其数。","列御寇曰：「再拜而辞。」"))],null,{success:"列御寇曰：「君可与言守矣。」",compromise:"列御寇曰：「君之言，半得。」",fail:"列御寇曰：「君犹重口体。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Yc={theme:"为我贵己",intro:"杨子取为我，拔一毛而利天下，不为也。",debates:[f("v_yangzhu_weiwo","为我","court","li",!0,"杨朱","杨朱学派","杨朱曰：「拔一毛而利天下，不为也。」",[r("拔一毛而利天下，君何故不为？",t("li","hit","天下非一毛所能利。今日拔一毛，明日断一臂，其终必至于身。","杨朱曰：「此吾之所以为我也。」"),t("yi","reason","一毛至轻，天下至重。何惜一毛？","杨朱曰：「拔一毛而利天下，不为也。」"),t("shi","evade","为与不为，各从其志。","杨朱曰：「损一毫利天下，不与也。」")),r("人人为我，则天下谁治？",t("li","hit","人人不损一毫，人人不利天下，天下治矣。各安其分，不相侵也。","杨朱曰：「此吾所谓治也。」"),t("yi","reason","人人为我，则公义不存，天下必乱。","杨朱曰：「悉天下奉一身，不取也。」"),t("ming","evade","治与乱，非为我之说所能致。","杨朱曰：「拔一毛而利天下，不为也。」")),r("孟子曰「杨朱墨翟之言盈天下」，君以为何如？",t("li","hit","天下之论，各有所主。吾言为我，彼言兼爱，皆所以救世。","杨朱曰：「此吾之所以不辩也。」"),t("yi","reason","盈天下则天下乱矣。当辟之。","杨朱曰：「拔一毛而利天下，不为也。」"),t("ming","evade","言之盈虚，非所计。","杨朱曰：「全性保真。」"))],null,{success:"杨朱曰：「君可与言己矣。」",compromise:"杨朱曰：「君之言，有见。」",fail:"杨朱曰：「君之说，墨者之属也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yangzhu_gui","贵己","court","li",!1,"杨朱","杨朱学派","杨朱曰：「全性保真，不以物累形。」",[r("何为贵己？",t("li","hit","贵己者，非自私也。全其性，保其真，不为外物所役。","杨朱曰：「此吾之学也。」"),t("yi","reason","贵己则轻人。此与禽兽何异？","杨朱曰：「全性保真，不以物累形。」"),t("ming","evade","己与人，各有其分。","杨朱曰：「拔一毛而利天下，不为也。」")),r("名利之来，当受乎？当拒乎？",t("li","hit","视其累形与否。不累则受，累则拒。","杨朱曰：「此吾之所以处也。」"),t("yi","reason","当受。名者，人之所贵。","杨朱曰：「不以物累形。」"),t("shi","evade","受拒皆外，不必较。","杨朱曰：「全性保真。」")),r("人生百年，何者为真？",t("li","hit","身与性为真。名位货财，皆外也，可去。","杨朱曰：「此吾所谓贵己也。」"),t("yi","reason","德行为真。身没而名存。","杨朱曰：「全性保真。」"),t("ming","evade","真与不真，唯其自知。","杨朱曰：「不以物累形。」"))],null,{success:"杨朱曰：「君可与言生矣。」",compromise:"杨朱曰：「君之言，可采。」",fail:"杨朱曰：「君犹役于物。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Uc={theme:"合同异",intro:"惠施多方，其书五车。",debates:[f("v_huishi_hetongyi","合同异","court","ming",!0,"惠施","魏之相","惠施曰：「大同而与小同异，此之谓小同异；万物毕同毕异，此之谓大同异。」",[r("万物毕同毕异，其说如何？",t("ming","hit","自其同者视之，万物皆一；自其异者视之，肝胆楚越。","惠施曰：「此吾之学也。」"),t("li","reason","同异自有定分，何得云毕同毕异？","惠施曰：「万物毕同毕异。」"),t("yi","evade","同异之辩，无益于治。","惠施曰：「大同而与小同异。」")),r("濠梁之上，君与庄周辩鱼之乐。其辩孰胜？",t("ming","hit","庄子胜。彼以「请循其本」转我之辞，我无以应。","惠施曰：「此吾之所以服也。」"),t("li","reason","我胜。子非鱼，安知鱼之乐？","惠施曰：「子非鱼，安知鱼之乐？」"),t("shi","evade","辩无胜负，各得其意而已。","惠施曰：「此之谓大同异。」")),r("历物十事，其要安在？",t("ming","hit","要在一。至大无外谓之大一，至小无内谓之小一。","惠施曰：「此吾之枢也。」"),t("li","reason","十事各殊，何须一之？","惠施曰：「万物毕同毕异。」"),t("yi","evade","十事之说，近于诡。","惠施曰：「大同而与小同异。」"))],null,{success:"惠施曰：「君可与言辩矣。」",compromise:"惠施曰：「君之言，可采。」",fail:"惠施曰：「君之说，未入辩门。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_huishi_xiang","为相","court","li",!1,"惠施","魏之相","惠施为魏相，庄子往见之。或谓惠子曰：「庄子来，欲代子相。」",[r("人言庄子欲代君相，君当如何？",t("ming","hit","当自省。若吾相魏无益于民，则代之亦可。","惠施曰：「此吾之所以为之也。」"),t("li","reason","当逐之。相位者，国之重器，不可假人。","惠施曰：「搜于国中三日三夜。」"),t("yi","evade","听之而已。谣言自止。","惠施曰：「庄子来，欲代子相。」")),r("相位与道，孰重？",t("ming","hit","道重。相位可以去，道不可须臾离。","惠施曰：「此吾之所以终为辩者也。」"),t("li","reason","相位重。无位则道不行。","惠施曰：「惠子相梁。」"),t("shi","evade","二者有时而相成。","惠施曰：「庄子来。」")),r("庄子以鹓鶵腐鼠为喻，君何以对？",t("ming","hit","吾不以相为腐鼠，然亦不当以相自囿。","惠施曰：「善哉！君知吾之失矣。」"),t("li","reason","当以相位自重。彼自言之耳。","惠施曰：「庄子来，欲代子相。」"),t("yi","evade","喻言之辞，不必深较。","惠施曰：「搜于国中三日三夜。」"))],null,{success:"惠施曰：「君可与言位矣。」",compromise:"惠施曰：「君之言，半是。」",fail:"惠施曰：「君犹恋于位。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Kc={theme:"白马非马",intro:"公孙龙，赵人，平原君之客。倡离坚白、白马非马。",debates:[f("v_gongsunlong_baima","白马非马","court","li",!0,"公孙龙","赵之辩者","公孙龙曰：「白马非马。」",[r("白马非马，其说如何？",t("li","hit","马者，所以命形也；白者，所以命色也。命色非命形也，故曰白马非马。","公孙龙曰：「此吾之所以辩也。」"),t("yi","reason","白马自是马之一类，何得云非马？","公孙龙曰：「求马，黄黑马皆可致；求白马，黄黑马不可致。」"),t("shi","evade","名实之辩，无关于治。","公孙龙曰：「白马非马。」")),r("求马而得白马，可乎？",t("li","hit","可。求马者，形也；得白马者，形与色俱。","公孙龙曰：「此吾所谓非马也。」"),t("yi","reason","白马即马，求马得白马，理所当然。","公孙龙曰：「求白马，黄黑马不可致。」"),t("ming","evade","名与实，各有所指。","公孙龙曰：「白马非马。」")),r("孔穿与之辩而不胜，君以为何故？",t("li","hit","穿执常理，龙用名辩。常理可服人，名辩可屈人。","公孙龙曰：「此吾之所以能胜也。」"),t("yi","reason","穿本不必与之辩。辩则已落其术中。","公孙龙曰：「白马非马。」"),t("shi","evade","胜败皆一时之论。","公孙龙曰：「离坚白。」"))],null,{success:"公孙龙曰：「君可与言名矣。」",compromise:"公孙龙曰：「君之言，有见。」",fail:"公孙龙曰：「君之说，未离于形。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_gongsunlong_jianbai","离坚白","court","li",!1,"公孙龙","赵之辩者","公孙龙曰：「坚白石三，可乎？曰：不可。二，可乎？曰：可。」",[r("坚白石，何以为二？",t("li","hit","视不得其所坚而得其所白，无坚也；拊不得其所白而得其所坚，无白也。","公孙龙曰：「此吾之所谓离也。」"),t("yi","reason","坚与白俱在石中，何得为二？","公孙龙曰：「坚白石三，可乎？曰：不可。」"),t("ming","evade","离与合，皆名之辨。","公孙龙曰：「二，可乎？曰：可。」")),r("名实之辩，何益于治？",t("li","hit","名正而后事成。名不正则言不顺，言不顺则事不成。","公孙龙曰：「此吾之所谓辩也。」"),t("yi","reason","无益。徒乱人心，无补于政。","公孙龙曰：「坚白石二。」"),t("shi","evade","益与不益，非辩者所计。","公孙龙曰：「离坚白。」")),r("平原君厚遇君而不任以事，何如？",t("li","hit","辩者之职在辩，不在政。厚遇足矣。","公孙龙曰：「此吾之所以安也。」"),t("yi","reason","当自请任事，以见其用。","公孙龙曰：「平原君之客。」"),t("ming","evade","遇与不遇，皆有其分。","公孙龙曰：「白马非马。」"))],null,{success:"公孙龙曰：「君可与言名实矣。」",compromise:"公孙龙曰：「君之言，可采。」",fail:"公孙龙曰：「君之说，未离于物。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Qc={theme:"五德终始",intro:"邹衍，齐之阴阳家。著终始大圣之篇。",debates:[f("v_zouyan_wude","五德终始","court","ming",!0,"邹衍","阴阳家","邹衍曰：「五德从所不胜，虞土、夏木、殷金、周火。」",[r("五德终始，其说可据乎？",t("ming","hit","可。天有五行，代有兴替。观其德之所属，则知运之所归。","邹衍曰：「此吾之所谓终始也。」"),t("li","reason","国之兴亡在人，不在德运。","邹衍曰：「五德从所不胜。」"),t("yi","evade","运数之说，不必深究。","邹衍曰：「五德终始。」")),r("水德将兴，代周者谁也？",t("ming","hit","火德既衰，水德当王。然谁居之，未可预知。","邹衍曰：「此吾之所以言也。」"),t("li","reason","强者居之。德运之说，因人而显。","邹衍曰：「五德从所不胜。」"),t("shi","evade","兴替有时，非人所能测。","邹衍曰：「著终始大圣之篇。」")),r("以德运说诸侯，君不惧为谶纬之始乎？",t("ming","hit","德运者，理也；谶纬者，妄也。以理示人，非以妖惑人。","邹衍曰：「善哉！君知吾之分矣。」"),t("li","reason","近于谶纬。人主信之，必怠于人事。","邹衍曰：「五德终始。」"),t("yi","evade","理与妄，后人自辨。","邹衍曰：「五德从所不胜。」"))],null,{success:"邹衍曰：「君可与言运矣。」",compromise:"邹衍曰：「君之言，有见。」",fail:"邹衍曰：「君之说，非观运之法。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zouyan_dajiuzhou","大九州","court","ming",!1,"邹衍","阴阳家","邹衍曰：「中国名曰赤县神州，乃天下八十一分之一耳。」",[r("中国不过天下八十一分之一，可信乎？",t("ming","hit","天地之广，非耳目所能尽。执一隅而疑其大，不足与观。","邹衍曰：「此吾之所谓大九州也。」"),t("li","reason","此皆臆说。无凭而谈天地，非学者所为。","邹衍曰：「中国名曰赤县神州。」"),t("yi","evade","天下之大，非所宜言。","邹衍曰：「乃天下八十一分之一。」")),r("既言天地之广，则何以自处？",t("ming","hit","知其大则不敢自满，知其小则不吝自守。此所以能容人也。","邹衍曰：「善哉！君知大九州之义矣。」"),t("li","reason","知其大亦无益。当务其近者。","邹衍曰：「中国名曰赤县神州。」"),t("shi","evade","大与小，皆不必较。","邹衍曰：「大九州之数。」")),r("燕昭王拥彗先驱以迎君，何如？",t("ming","hit","彼礼其言，非礼其身。吾亦以言报之。","邹衍曰：「此吾之所以适燕也。」"),t("li","reason","当受之。士之见礼，国之盛事。","邹衍曰：「昭王拥彗先驱。」"),t("yi","evade","礼之厚薄，非所计。","邹衍曰：「五德终始。」"))],null,{success:"邹衍曰：「君可与言天地矣。」",compromise:"邹衍曰：「君之言，半得。」",fail:"邹衍曰：「君犹拘于一隅。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Wc={theme:"滑稽多辩",intro:"淳于髡，齐之赘婿。长不满七尺，滑稽多辩。",debates:[f("v_chunyu_yiming","一鸣惊人","court","ming",!0,"淳于髡","齐之稷下","齐威王好为淫乐，沈湎不治。淳于髡说之以隐曰：「国中有大鸟，止王之庭，三年不飞不鸣。」",[r("三年不飞不鸣，此鸟何名？",t("ming","hit","此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。","威王曰：「善。」乃朝诸县令长。"),t("li","reason","此鸟无能耳。当去之，别求贤者。","淳于髡曰：「国中有大鸟。」"),t("yi","evade","鸟之飞鸣，各有时。","淳于髡曰：「三年不飞不鸣。」")),r("以隐语谏君，何如直谏？",t("ming","hit","隐语入之易，直谏触之难。君既悟，则其改也速。","淳于髡曰：「此吾之所以为滑稽也。」"),t("yi","reason","直谏为忠。隐语近于戏。","淳于髡曰：「一鸣惊人。」"),t("shi","evade","视君之性而择之。","淳于髡曰：「国中有大鸟。」")),r("王曰「善」而罢长夜之饮。君以为隐语之力乎？",t("ming","hit","然。隐语者，因其乐而导之，故易入。","淳于髡曰：「此滑稽之所以有用也。」"),t("li","reason","偶然耳。王自悟之。","淳于髡曰：「酒极则乱。」"),t("yi","evade","力之所在，不可尽言。","淳于髡曰：「一鸣惊人。」"))],null,{success:"淳于髡曰：「君可与言谏矣。」",compromise:"淳于髡曰：「君之言，可采。」",fail:"淳于髡曰：「君未达隐语之妙。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_chunyu_jiuji","酒极则乱","court","ming",!1,"淳于髡","齐之稷下","威王问：「先生能饮几何而醉？」髡曰：「臣饮一斗亦醉，一石亦醉。」",[r("一斗亦醉，一石亦醉，何也？",t("ming","hit","酒极则乱，乐极则悲。凡事皆然。","淳于髡曰：「此吾之所以讽也。」"),t("li","reason","量有定也，何得两说？","淳于髡曰：「臣饮一斗亦醉，一石亦醉。」"),t("yi","evade","醉与不醉，皆在己心。","淳于髡曰：「酒极则乱，乐极则悲。」")),r("君耽于酒，臣当如何进言？",t("ming","hit","乘其乐而讽之。乐时之言，易入而难忘。","淳于髡曰：「此吾之所以为也。」"),t("yi","reason","当正色谏之。乘乐而讽，近于谄。","淳于髡曰：「酒极则乱。」"),t("li","evade","君之好恶，非臣所能移。","淳于髡曰：「一石亦醉。」")),r("滑稽之士，于国有用乎？",t("ming","hit","有用。言不逆耳，而君自改。此滑稽之所以不可废。","淳于髡曰：「此吾之所以自处也。」"),t("yi","reason","无用。优伶之属，何补于政？","淳于髡曰：「一鸣惊人。」"),t("li","evade","有用无用，视其君。","淳于髡曰：「酒极则乱。」"))],null,{success:"淳于髡曰：「君可与言讽矣。」",compromise:"淳于髡曰：「君之言，半是。」",fail:"淳于髡曰：「君犹以酒论酒。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Zc={theme:"隐与孝",intro:"老莱子，楚之隐者。著书十五篇。",debates:[f("v_laolaizi_yin","隐者","court","ming",!0,"老莱子","楚之隐者","楚王欲召老莱子为相。老莱子辞，与其妻逃于江南。",[r("王召为相，君何故辞？",t("ming","hit","隐者不能受人之禄。受禄则受制，受制则失其真。","老莱子曰：「此吾之所以逃也。」"),t("li","reason","可受。为相可以行其道，何必隐？","老莱子曰：「吾不能为人所制。」"),t("yi","evade","隐与仕，各从其志。","老莱子曰：「与其妻逃于江南。」")),r("隐而不仕，于天下何益？",t("ming","hit","隐者非无用。上不夺民之利，下不争人之位，此亦有益。","老莱子曰：「此吾之所守也。」"),t("li","reason","无益。贤者当出而济世。","老莱子曰：「吾不能为人所制。」"),t("shi","evade","益与不益，非隐者所计。","老莱子曰：「著书十五篇。」")),r("妻亦劝君勿仕，君以为然乎？",t("ming","hit","然。夫妇同其志，则可以久。独行则易变。","老莱子曰：「此吾之所以与妻偕隐也。」"),t("li","reason","妇人何知？当自决之。","老莱子曰：「其妻曰：可食以酒肉者，可随以鞭棰。」"),t("yi","evade","妻之言，亦是一说。","老莱子曰：「遂逃于江南。」"))],null,{success:"老莱子曰：「君可与言隐矣。」",compromise:"老莱子曰：「君之言，有见。」",fail:"老莱子曰：「君犹慕于禄。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_laolaizi_caiyi","戏彩娱亲","court","yi",!1,"老莱子","楚之隐者","老莱子年七十，着五色斑斓之衣，为婴儿戏于亲侧。",[r("年七十而作婴儿戏，何如？",t("yi","hit","孝之至也。亲老则忧其衰，故作婴儿之态以娱之。","老莱子曰：「此吾之所以为也。」"),t("li","reason","近于戏。老者当自重。","老莱子曰：「着五色斑斓之衣。」"),t("ming","evade","娱亲之术，各随其宜。","老莱子曰：「为婴儿戏于亲侧。」")),r("孝之至，在养其身乎？在娱其心乎？",t("yi","hit","在娱其心。身之养易，心之乐难。","老莱子曰：「此吾所谓孝也。」"),t("li","reason","在养其身。口体不足，何乐之有？","老莱子曰：「为婴儿戏于亲侧。」"),t("ming","evade","二者兼尽，方为孝。","老莱子曰：「此吾之所以为也。」")),r("诈跌卧地，作婴儿啼，以娱亲意。君以为过乎？",t("yi","hit","不过。亲之心在一笑，则跌亦无伤。","老莱子曰：「此吾之所以为也。」"),t("li","reason","过矣。老者跌仆，恐致伤。","老莱子曰：「诈跌卧地。」"),t("shi","evade","过与不过，唯亲知之。","老莱子曰：「为婴儿戏于亲侧。」"))],null,{success:"老莱子曰：「君可与言孝矣。」",compromise:"老莱子曰：「君之言，半得。」",fail:"老莱子曰：「君犹重体而轻心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Jc={theme:"中庸与诚",intro:"子思作《中庸》，传孔子之道于孟子。",debates:[f("v_zisi_zhongyong","中庸","court","yi",!0,"子思","孔门之孙","子思曰：「喜怒哀乐之未发，谓之中；发而皆中节，谓之和。」",[r("中和之说，何以治天下？",t("yi","hit","致中和，天地位焉，万物育焉。上之情正，则下自安。","子思曰：「此吾之所谓中庸也。」"),t("li","reason","情之发有节，则事无过不及。此治之要。","子思曰：「发而皆中节，谓之和。」"),t("ming","evade","中和者，修养之事，非政之要。","子思曰：「喜怒哀乐之未发。」")),r("中庸与乡愿，何以别？",t("yi","hit","中庸者，择善而固执；乡愿者，同流而合污。貌似而心异。","子思曰：「此吾之所以辨也。」"),t("li","reason","二者皆不偏不倚，何别之有？","子思曰：「发而皆中节。」"),t("shi","evade","名异实同，不必深辨。","子思曰：「喜怒哀乐之未发，谓之中。」")),r("夫子之道，何以能传？",t("yi","hit","以诚传之。诚则不息，不息则久。","子思曰：「此吾之所以作《中庸》也。」"),t("li","reason","以言传之。著之竹帛，则道不亡。","子思曰：「诚者，天之道也。」"),t("ming","evade","传与不传，皆有其数。","子思曰：「喜怒哀乐之未发。」"))],null,{success:"子思曰：「君可与言中矣。」",compromise:"子思曰：「君之言，可采。」",fail:"子思曰：「君之说，近于乡愿。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zisi_cheng","诚","court","yi",!1,"子思","孔门之孙","子思曰：「诚者，天之道也；诚之者，人之道也。」",[r("诚可为天下之本乎？",t("yi","hit","可。不诚无物。上不诚则下不信，下不信则事不成。","子思曰：「此吾之所谓诚也。」"),t("li","reason","诚者一人之德，何关天下？","子思曰：「诚者，天之道也。」"),t("ming","evade","诚与不诚，唯其自知。","子思曰：「诚之者，人之道也。」")),r("至诚可以前知，其说如何？",t("yi","hit","至诚之道，可以前知。国家将兴，必有祯祥；将亡，必有妖孽。","子思曰：「此吾之所以言诚也。」"),t("li","reason","前知者，术数之事，非诚所能致。","子思曰：「至诚如神。」"),t("shi","evade","知与不知，皆在诚之外。","子思曰：「诚者，天之道也。」")),r("诚与明，孰先？",t("yi","hit","诚则明矣，明则诚矣。二者相生，非有先后。","子思曰：「此吾之所谓诚明也。」"),t("li","reason","先明。明而后知所诚。","子思曰：「自诚明，谓之性。」"),t("ming","evade","先后之说，不必执一。","子思曰：「诚则明矣。」"))],null,{success:"子思曰：「君可与言诚矣。」",compromise:"子思曰：「君之言，半是。」",fail:"子思曰：「君犹以诚为虚。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Xc={theme:"戎狄之治",intro:"由余，其先晋人也，亡入戎。秦穆公闻其贤。",debates:[f("v_youyu_shishu","诗书礼乐","court","yi",!0,"由余","秦之上卿","秦穆公问：「中国以诗书礼乐法度为政，然尚时乱。今戎夷无此，何以为治？」",[r("戎夷无法度而治，中国有法度而乱，其故安在？",t("yi","hit","中国之乱，正由上失其德而下争其位。礼乐者，饰也；无德则饰为虚。","由余曰：「此吾之所以对也。」"),t("li","reason","戎夷之治，简陋而已，不足称治。","由余曰：「此中国之所以乱也。」"),t("shi","evade","治乱各因其俗，不必相较。","由余曰：「戎夷无此，何以为治？」")),r("以女乐遗戎王，使其荒怠。此术可乎？",t("li","hit","可。兵者诡道，不以奇取胜，则取之必难。","由余曰：「此吾之所以去戎也。」"),t("yi","reason","以女乐乱人之国，非仁者所为。","由余曰：「秦穆公以女乐遗戎王。」"),t("shi","evade","术之正否，视其成败。","由余曰：「此中国之所以乱也。」")),r("戎王既荒于乐，君遂去之。君以为可乎？",t("li","hit","可。谏而不听，则去。留而无益。","由余曰：「此吾之所以降秦也。」"),t("yi","reason","不可。既事其君，当死其难。","由余曰：「戎王不听。」"),t("ming","evade","去留皆有其时。","由余曰：「遂降秦。」"))],null,{success:"由余曰：「君可与言治矣。」",compromise:"由余曰：「君之言，有见。」",fail:"由余曰：「君之说，犹守虚文。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_youyu_rong","去戎事秦","court","li",!1,"由余","秦之上卿","由余数谏戎王，戎王不听。由余遂降秦。",[r("去戎而降秦，君以为可乎？",t("li","hit","可。谏而不听，则去。留而无益，徒自困耳。","由余曰：「此吾之所以降也。」"),t("yi","reason","不可。既事其君，当死其难。","由余曰：「戎王不听。」"),t("shi","evade","去留皆有其时。","由余曰：「遂降秦。」")),r("以戎之情告秦，君不以为负乎？",t("li","hit","非负也。吾已去戎，则戎非吾君。","由余曰：「此吾之所以为秦谋也。」"),t("yi","reason","负矣。戎王虽不听，犹是故主。","由余曰：「秦用其谋，遂霸西戎。」"),t("ming","evade","负与不负，后人自评。","由余曰：「由余遂降秦。」")),r("秦用君之谋而霸西戎，君以为功乎？",t("li","hit","功在秦，不在我。谋者臣职，用者君权。","由余曰：「此吾之所以自处也。」"),t("yi","reason","功在我。无吾之谋，秦不能霸。","由余曰：「秦用其谋。」"),t("shi","evade","功之所属，不必较。","由余曰：「遂霸西戎。」"))],null,{success:"由余曰：「君可与言去就矣。」",compromise:"由余曰：「君之言，半得。」",fail:"由余曰：「君犹以故主为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},eu={theme:"召陵之盟",intro:"齐桓公伐楚，次于陉。楚子使屈完如师。",debates:[f("v_quwan_zhaoling","召陵之盟","diplomacy","yi",!0,"屈完","楚之大夫","齐侯曰：「以此众战，谁能御之？以此攻城，何城不克？」",[r("齐侯以众威胁，君何以对？",t("yi","hit","君若以德绥诸侯，谁敢不服？若以力，楚国方城以为城，汉水以为池，虽众无所用之。","屈完曰：「此吾之所以对也。」"),t("li","reason","当示弱以求和。齐强楚弱，不可硬抗。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","强弱之势，言之无益。","屈完曰：「以此众战，谁能御之？」")),r("齐以包茅不入为辞，君以为有理乎？",t("yi","hit","包茅不入，寡君之罪也。然齐以此为名，其实畏楚之强。","屈完曰：「贡之不入，寡君之罪也。」"),t("li","reason","无理。齐欲伐楚，假此为由耳。","屈完曰：「昭王之不复，君其问诸水滨。」"),t("ming","evade","名与实，不必深辨。","屈完曰：「君若以德绥诸侯。」")),r("盟成，君与齐侯同乘而观。君以为荣乎？",t("yi","hit","非荣也。盟成则兵息，此吾之所以从也。","屈完曰：「此吾之所以同乘也。」"),t("li","reason","荣矣。与霸主同乘，楚国之光。","屈完曰：「屈完与齐侯同乘。」"),t("shi","evade","荣与不荣，皆外也。","屈完曰：「君若以德绥诸侯。」"))],null,{success:"屈完曰：「君可与言辞矣。」",compromise:"屈完曰：「君之言，可采。」",fail:"屈完曰：「君之说，示弱于敌。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_quwan_ci","辞令","diplomacy","yi",!1,"屈完","楚之大夫","或问：「以弱国使强邻，何以为辞？」屈完曰：「不卑不亢。」",[r("不卑不亢，其道如何？",t("yi","hit","卑则见轻，亢则见怒。守其分而不失其辞，斯可矣。","屈完曰：「此吾之所以为使也。」"),t("li","reason","当卑辞以求存。小国无亢之理。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","辞之卑亢，视其势。","屈完曰：「楚国方城以为城。」")),r("强国以兵威相挟，君将何以处之？",t("yi","hit","示之以不可胜。彼知难而退，则不战而存。","屈完曰：「此吾之所以言方城汉水也。」"),t("li","reason","当许其请。兵威之下，无辞可恃。","屈完曰：「虽众无所用之。」"),t("ming","evade","威与德，皆外也。","屈完曰：「不卑不亢。」")),r("使而不辱命，其要安在？",t("yi","hit","在知其国之不可犯，而不轻言其可犯。","屈完曰：「善哉！君知使矣。」"),t("li","reason","在善辞令，能转人之意。","屈完曰：「君若以德绥诸侯。」"),t("shi","evade","要在得人，非一言可尽。","屈完曰：「不卑不亢。」"))],null,{success:"屈完曰：「君可与言使矣。」",compromise:"屈完曰：「君之言，半是。」",fail:"屈完曰：「君犹失辞。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},iu={theme:"隐谏",intro:"伍举，楚之大夫。以「三年不飞不鸣」之隐谏庄王。",debates:[f("v_wuju_yin","隐谏","court","ming",!0,"伍举","楚之大夫","楚庄王即位三年，不出号令，日夜为乐。伍举入谏曰：「有鸟在于阜，三年不飞不鸣，是何鸟也？」",[r("三年不飞不鸣，此鸟何也？",t("ming","hit","三年不飞，飞将冲天；三年不鸣，鸣将惊人。","庄王曰：「举退矣，吾知之矣。」"),t("li","reason","此鸟无能耳。君当去之。","伍举曰：「有鸟在于阜。」"),t("yi","evade","鸟之飞鸣，自有其时。","伍举曰：「三年不飞不鸣。」")),r("王曰「吾知之矣」而不改，君当如何？",t("ming","hit","再谏。一言未入，则更其辞。","伍举曰：「此吾之所以再谏也。」"),t("li","reason","当去。谏而不改，则无可为。","伍举曰：「有鸟在于阜。」"),t("shi","evade","改与不改，在君。","伍举曰：「三年不鸣。」")),r("苏从继君而谏，王遂听之。君以为何如？",t("ming","hit","谏者非一人之力。吾发其端，苏从成其终。","伍举曰：「此吾之所以与从也。」"),t("li","reason","苏从之谏，胜于吾之隐语。","伍举曰：「有鸟在于阜。」"),t("yi","evade","谁之力，不必较。","伍举曰：「三年不飞不鸣。」"))],null,{success:"伍举曰：「君可与言谏矣。」",compromise:"伍举曰：「君之言，可采。」",fail:"伍举曰：「君未达隐谏之法。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_wuju_zhanghua","章华之台","domestic","ming",!1,"伍举","楚之大夫","楚灵王为章华之台，与伍举升焉。曰：「台美夫！」",[r("台之美，君以为可夸乎？",t("ming","hit","臣闻国君服宠以为美，安民以为乐，听德以为聪，致远以为明。不闻以土木之崇高为美。","伍举曰：「此吾之所以谏也。」"),t("li","reason","台成而美，亦是国之威仪。","伍举曰：「台美夫！」"),t("yi","evade","美与不美，皆外也。","伍举曰：「臣闻国君服宠以为美。」")),r("土木之费，何以为度？",t("ming","hit","不夺民时，不耗民财。台以望氛祥，榭以讲军实，斯可矣。","伍举曰：「此吾之所谓度也。」"),t("li","reason","国力所及，即可为之。","伍举曰：「不闻其以土木之崇高为美。」"),t("shi","evade","度之所在，随其时而异。","伍举曰：「台美夫！」")),r("灵王不听，终有乾溪之祸。君以为何如？",t("ming","hit","谏而不听，则君自受之。非谏者之罪。","伍举曰：「此吾之所以尽言也。」"),t("li","reason","当更强谏。不听则去。","伍举曰：「台美夫！」"),t("yi","evade","祸福有数，非人所能回。","伍举曰：「臣闻国君服宠以为美。」"))],null,{success:"伍举曰：「君可与言奢俭矣。」",compromise:"伍举曰：「君之言，半得。」",fail:"伍举曰：「君犹以土木为美。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},tu={theme:"君明乐官",intro:"田子方，魏文侯之师，学于子夏。",debates:[f("v_tianzifang_yue","君明乐官","court","yi",!0,"田子方","魏之师","魏文侯与田子方饮，文侯曰：「钟声不比乎？左高。」田子方笑。",[r("君知乐音，君以为明乎？",t("yi","hit","臣闻之，君明乐官，不明乐音。今君审于音，臣恐其聋于官也。","田子方曰：「此吾之所以笑也。」"),t("li","reason","知音者近于明。君能审音，亦足见其聪。","田子方曰：「君明乐官，不明乐音。」"),t("ming","evade","音之高低，小节耳。","田子方曰：「钟声不比乎？」")),r("君当务其大者，抑或兼察其细？",t("yi","hit","务其大者。人主之职在任官，不在审音。","田子方曰：「此吾之所以言也。」"),t("li","reason","兼察其细。细不察则大亦废。","田子方曰：「臣恐其聋于官也。」"),t("shi","evade","大细各有所宜。","田子方曰：「君明乐官。」")),r("文侯曰「善」，君以为可教乎？",t("yi","hit","可教。知过而即改，此君之所以为贤。","田子方曰：「此吾之所以事魏也。」"),t("li","reason","一时之顺耳。未必真改。","田子方曰：「君明乐官。」"),t("ming","evade","改与不改，在他日。","田子方曰：「钟声不比乎？」"))],null,{success:"田子方曰：「君可与言君道矣。」",compromise:"田子方曰：「君之言，可采。」",fail:"田子方曰：「君犹务其细。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_tianzifang_pin","贫贱骄人","court","yi",!1,"田子方","魏之师","子击逢田子方于道，下车伏谒。子方不为礼。",[r("富贵者骄人，抑或贫贱者骄人？",t("yi","hit","亦贫贱者骄人耳。诸侯而骄人则失其国，贫贱者行不合则去之楚越，若脱躧然。","田子方曰：「此吾之所以不为礼也。」"),t("li","reason","富贵者骄人。位高则易慢。","田子方曰：「亦贫贱者骄人耳。」"),t("shi","evade","骄与不骄，在人不在位。","田子方曰：「富贵者安敢骄人？」")),r("子方不为礼，君以为倨乎？",t("yi","hit","非倨也。师者不臣于弟子，礼不为屈。","田子方曰：「此吾之所以自处也。」"),t("li","reason","倨矣。子击虽弟子，亦是贵胄。","田子方曰：「贫贱者骄人耳。」"),t("ming","evade","礼之屈伸，各有所宜。","田子方曰：「亦贫贱者骄人耳。」")),r("子击怒而问之，君以何对？",t("yi","hit","以理对，不以位对。位可屈人，理不可以屈。","田子方曰：「善哉！君知吾之意矣。」"),t("li","reason","当谢过。失礼于贵胄，非全身之道。","田子方曰：「亦贫贱者骄人耳。」"),t("shi","evade","对与不对，皆一时之事。","田子方曰：「富贵者安敢骄人？」"))],null,{success:"田子方曰：「君可与言礼矣。」",compromise:"田子方曰：「君之言，半是。」",fail:"田子方曰：「君犹以位论人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},au={theme:"不为臣",intro:"段干木，晋之隐士，学于子夏。魏文侯过其闾而式之。",debates:[f("v_duanganmu_yuqiang","逾墙避之","court","ming",!0,"段干木","晋之隐士","魏文侯欲见段干木，段干木逾墙避之。",[r("君侯求见而逾墙避之，何也？",t("ming","hit","不为臣则不见诸侯。见则有君臣之分，分定则不能守其志。","段干木曰：「此吾之所以避也。」"),t("li","reason","君侯礼贤，何故避之？当就见。","段干木曰：「不为臣不见诸侯。」"),t("yi","evade","见与不见，皆小节。","段干木曰：「逾墙避之。」")),r("文侯过其闾而式之，何如？",t("ming","hit","式其闾者，式其德也。不以其位，而以其道。","段干木曰：「此吾之所以不仕而名也。」"),t("li","reason","过其闾而式，过礼也。君侯太屈。","段干木曰：「文侯过其闾而式之。」"),t("shi","evade","式与不式，皆君侯之意。","段干木曰：「不为臣不见诸侯。」")),r("隐者之名，何以能重于诸侯？",t("ming","hit","以其不入也。不入则无求，无求则其言重。","段干木曰：「此吾之所以能不仕也。」"),t("li","reason","名者人所加。隐者何名之重？","段干木曰：「文侯过其闾而式之。」"),t("shi","evade","轻重之势，非人所能强。","段干木曰：「不为臣不见诸侯。」"))],null,{success:"段干木曰：「君可与言守矣。」",compromise:"段干木曰：「君之言，有见。」",fail:"段干木曰：「君犹慕于见用。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_duanganmu_xian","好贤之效","court","ming",!1,"段干木","晋之隐士","魏文侯谓曰：「寡人何如？」曰：「君好贤矣。」",[r("好贤而不任用，可乎？",t("ming","hit","好之不如用之。好而不举，犹不好也。","段干木曰：「此吾之所以不仕也。」"),t("li","reason","好之已足。贤者不必尽用。","段干木曰：「君好贤矣。」"),t("yi","evade","好与用，各有其分。","段干木曰：「不为臣不见诸侯。」")),r("文侯曰「寡人好贤」，而秦国不敢加兵。君以为何如？",t("ming","hit","好贤之名，亦可以止兵。名之所至，实效随之。","段干木曰：「此吾所谓不仕而有益也。」"),t("li","reason","虚名耳，不能御兵。","段干木曰：「君好贤矣。」"),t("yi","evade","名与实，不必相待。","段干木曰：「文侯过其闾而式之。」")),r("隐而不仕，其功何在？",t("ming","hit","在使人主知有不可屈之士。此风一立，天下之士皆至。","段干木曰：「善哉！君知隐者之功矣。」"),t("li","reason","无功可言。不仕则不任其事。","段干木曰：「君好贤矣。」"),t("shi","evade","功之有无，非所计。","段干木曰：「不为臣不见诸侯。」"))],null,{success:"段干木曰：「君可与言贤矣。」",compromise:"段干木曰：「君之言，半得。」",fail:"段干木曰：「君犹好名而不好实。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},su={theme:"老而可用",intro:"鬻子名熊，楚之先祖。年九十见周文王。",debates:[f("v_yuzi_lao","老而可用","court","yi",!0,"鬻子","楚之先师","鬻子年九十见文王。文王曰：「嘻，老矣。」鬻子曰：「使臣捕兽逐麋，则老矣；使臣坐策国事，则臣尚少也。」",[r("年九十而策国事，可乎？",t("yi","hit","可。谋者在心，不在筋骨。老者谋事，其思虑深。","鬻子曰：「此吾之所以对文王也。」"),t("li","reason","不可。齿衰则思亦衰。当用壮者。","鬻子曰：「坐策国事，臣尚少也。」"),t("ming","evade","老少各有所宜。","鬻子曰：「嘻，老矣。」")),r("老臣与少臣，孰宜于谋？",t("yi","hit","老臣谋其大，少臣任其劳。二者相须。","鬻子曰：「此吾之所以能事周也。」"),t("li","reason","少臣锐进，老臣守旧。用少为宜。","鬻子曰：「坐策国事，臣尚少也。」"),t("shi","evade","视事之难易而择。","鬻子曰：「捕兽逐麋，则老矣。」")),r("文王遂用君，君以为何如？",t("yi","hit","文王之用，非用吾身，用吾言也。此王者之所以兴。","鬻子曰：「此吾之所以事周也。」"),t("li","reason","过矣。九十之人，岂能任事？","鬻子曰：「坐策国事，臣尚少也。」"),t("ming","evade","用与不用，皆有其时。","鬻子曰：「嘻，老矣。」"))],null,{success:"鬻子曰：「君可与言用贤矣。」",compromise:"鬻子曰：「君之言，可采。」",fail:"鬻子曰：「君犹以年论人。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yuzi_jiaohua","教化","court","yi",!1,"鬻子","楚之先师","鬻子曰：「君子不以其所能者病人。」",[r("不以其所能者病人，其说如何？",t("yi","hit","己能之而人不能，则不当以此责人。责之则人不堪。","鬻子曰：「此吾之所以教也。」"),t("li","reason","能者当教不能者。不责则人无所劝。","鬻子曰：「君子不以其所能者病人。」"),t("ming","evade","能与不能，本自不同。","鬻子曰：「老而可用。」")),r("教民之道，当宽乎？当严乎？",t("yi","hit","宽而有节。严则民畏而不亲，宽则民慢而不从。","鬻子曰：「此吾之所谓教也。」"),t("li","reason","当严。民无知，非严不立。","鬻子曰：「君子不以其所能者病人。」"),t("shi","evade","宽严随时，不必执一。","鬻子曰：「坐策国事，臣尚少也。」")),r("楚之兴，君以为在何？",t("yi","hit","在后世能守其教。教存则国存。","鬻子曰：「此吾之所以为楚先也。」"),t("li","reason","在兵力。无兵则虽有教不立。","鬻子曰：「君子不以其所能者病人。」"),t("ming","evade","兴亡有数，非一言可尽。","鬻子曰：「老而可用。」"))],null,{success:"鬻子曰：「君可与言教矣。」",compromise:"鬻子曰：「君之言，半是。」",fail:"鬻子曰：「君犹以己度人。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},nu={theme:"弭兵",intro:"华元，宋之大夫。倡弭兵之会。",debates:[f("v_huayuan_mibing","弭兵","diplomacy","yi",!0,"华元","宋之大夫","华元倡弭兵之会，晋楚既成，各国息兵。",[r("兵可弭乎？",t("yi","hit","可弭一时。弭兵者，弭目前之兵耳。欲弭百世之兵，则须有礼。","华元曰：「此吾之所以为会也。」"),t("li","reason","不可。兵者国之大事，岂能尽弭？","华元曰：「晋楚既成，各国息兵。」"),t("shi","evade","弭与不弭，皆有其时。","华元曰：「兵可弭乎？」")),r("以私交成两国之好，可乎？",t("yi","hit","可。弭兵之会，本由私交而成。然私交易败，故当继之以礼。","华元曰：「此吾之所以成也。」"),t("li","reason","不可。国之大事，不当以私交决之。","华元曰：「吾与晋楚之大夫皆相善。」"),t("ming","evade","公私之界，有时难分。","华元曰：「晋楚既成。」")),r("弭兵之后，诸侯益骄，兵争如故。君以为何如？",t("yi","hit","弭兵者，息一时之肩，非弭百世之患。能息一时，亦足矣。","华元曰：「此吾之所以不悔也。」"),t("li","reason","弭兵无功。徒长诸侯之骄。","华元曰：「晋楚既成。」"),t("shi","evade","功过皆后人论之。","华元曰：「兵可弭乎？」"))],null,{success:"华元曰：「君可与言弭兵矣。」",compromise:"华元曰：「君之言，可采。」",fail:"华元曰：「君之说，未达弭兵之意。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_huayuan_yangzhen","羊斟","military","yi",!1,"华元","宋之大夫","宋华元将战，杀羊食士，其御羊斟不与。",[r("杀羊食士而遗其御，君以为失乎？",t("yi","hit","失矣。一羊之微，而致师败身囚。小不忍则乱大谋。","华元曰：「此吾之所以败也。」"),t("li","reason","无失。御者不当与之。","华元曰：「畴昔之羊，子为政。」"),t("shi","evade","得失皆小，不必论。","华元曰：「羊斟不与。」")),r("小怨而致大祸，当如何防之？",t("yi","hit","凡事当均。均则无怨。","华元曰：「此吾之所以悔也。」"),t("li","reason","当严刑以惩。惩一人则众惧。","华元曰：「今日之事，我为政。」"),t("ming","evade","事之变，非人所豫防。","华元曰：「杀羊食士。」")),r("既败而逃归，君以为可耻乎？",t("yi","hit","可耻。为将而败，当死。吾之不死，为宋国也。","华元曰：「此吾之所以自愧也。」"),t("li","reason","不可耻。留身以图后效。","华元曰：「吾遂逃归。」"),t("shi","evade","耻与不耻，皆外也。","华元曰：「杀羊食士。」"))],null,{success:"华元曰：「君可与言均矣。」",compromise:"华元曰：「君之言，半得。」",fail:"华元曰：「君犹忽于小。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ou={theme:"再弭兵",intro:"向戌，宋之大夫。继华元之后再倡弭兵之会。",debates:[f("v_xiangxu_mibing","再倡弭兵","diplomacy","yi",!0,"向戌","宋之大夫","向戌欲弭兵，告于晋楚，晋楚许之。会于宋，诸侯从之。",[r("弭兵再度举行，其效可久乎？",t("yi","hit","可久一时。然弭兵而不废兵，兵犹在也。","向戌曰：「此吾之所知也。」"),t("li","reason","可久。诸侯既盟，谁敢违约？","向戌曰：「晋楚既许之。」"),t("shi","evade","久暂有数，非人所能料。","向戌曰：「会于宋。」")),r("以弭兵为名求名于诸侯，可乎？",t("yi","hit","弭兵者，为天下息肩，非为名也。若为名，则其会不能久。","向戌曰：「此吾之所守也。」"),t("li","reason","可。名既立，则事自成。","向戌曰：「宋之大夫向戌。」"),t("ming","evade","名实之间，难以尽分。","向戌曰：「诸侯从之。」")),r("会既成，君请免死之邑。君以为当乎？",t("li","hit","不当。弭兵者天下之利，非一身之功。以为功而请邑，则其会为利也。","向戌曰：「此吾之所以见讥也。」"),t("yi","reason","当。有功而不赏，则人无所劝。","向戌曰：「请免死之邑。」"),t("shi","evade","请与不请，各从其意。","向戌曰：「子罕削而与之。」"))],null,{success:"向戌曰：「君可与言弭兵矣。」",compromise:"向戌曰：「君之言，可采。」",fail:"向戌曰：「君犹以名为事。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xiangxu_fengyi","请邑","court","li",!1,"向戌","宋之大夫","弭兵既成，向戌请免死之邑于宋公。司城子罕曰：「凡诸侯小国，晋楚所以兵威之。」",[r("子罕削其邑，君不怨乎？",t("li","hit","不怨。子罕之言，正吾之失。","向戌曰：「此吾之所以服也。」"),t("yi","reason","当怨。功成而赏削，非国之信。","向戌曰：「子罕削而与之。」"),t("ming","evade","怨与不怨，皆私情。","向戌曰：「请免死之邑。」")),r("有功而不受赏，君以为高乎？",t("li","hit","高。功成不居，则人不能以利诱之。","向戌曰：「此吾之所以终服子罕也。」"),t("yi","reason","不高。有功当赏，逃赏则沮来者。","向戌曰：「请免死之邑。」"),t("shi","evade","受与不受，各从其志。","向戌曰：「子罕削而与之。」")),r("弭兵之利，果在诸侯乎？",t("li","hit","在民。兵息则民得耕，此其利也。","向戌曰：「此吾之所以为会也。」"),t("yi","reason","在晋楚。小国仍受其制。","向戌曰：「凡诸侯小国，晋楚所以兵威之。」"),t("ming","evade","利之所在，难以一言尽。","向戌曰：「诸侯从之。」"))],null,{success:"向戌曰：「君可与言功矣。」",compromise:"向戌曰：「君之言，半是。」",fail:"向戌曰：「君犹以功为利。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},ru={theme:"权臣",intro:"祭足，字仲，郑之权臣。",debates:[f("v_jizu_quan","权臣","court","li",!0,"祭足","郑之卿","宋人执祭仲，使立厉公。祭仲许之，遂出昭公而立厉公。",[r("君命与国存，孰重？",t("li","hit","国存为重。身与君命，皆可权。","祭足曰：「此吾之所以许宋也。」"),t("yi","reason","君命为重。背君命以求存，非臣道。","祭足曰：「宋人执我，使我立厉公。」"),t("shi","evade","存亡之际，难以常理论。","祭足曰：「遂出昭公而立厉公。」")),r("出君立君，君不惧后世之讥乎？",t("li","hit","惧。然郑不立君则乱，乱则亡。宁受讥而存国。","祭足曰：「此吾之所以行也。」"),t("yi","reason","当守节而死。死则名存，国亦不亡。","祭足曰：「吾许之。」"),t("ming","evade","讥与不讥，后人之论。","祭足曰：「祭仲立昭公。」")),r("权臣专国，其祸安在？",t("li","hit","在身死而国乱。权不去则君不安，君不安则国不宁。","祭足曰：「此吾之所以自知也。」"),t("yi","reason","在失臣节。专权者终必不忠。","祭足曰：「祭仲专。」"),t("shi","evade","祸福相倚，非一言可尽。","祭足曰：「遂出昭公而立厉公。」"))],null,{success:"祭足曰：「君可与言权矣。」",compromise:"祭足曰：「君之言，有见。」",fail:"祭足曰：「君犹守常而不达变。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jizu_zhuanquan","专权","court","li",!1,"祭足","郑之卿","祭仲专郑国之政，厉公患之，使其婿雍纠杀之。",[r("权臣专国，君当如何处之？",t("li","hit","当徐夺其权，不可骤诛。骤诛则其党必乱。","祭足曰：「此吾之所以能专也。」"),t("yi","reason","当明正其罪而诛之。迟则生变。","祭足曰：「厉公使雍纠杀我。」"),t("shi","evade","专与不专，皆有其势。","祭足曰：「祭仲专。」")),r("雍纠之谋泄，君以为谁之过？",t("li","hit","谋不密则败。雍纠之过，非君之过。","祭足曰：「此吾之所以得免也。」"),t("yi","reason","君之过。用人不当，谋及私人。","祭足曰：「雍纠之妻，吾女也。」"),t("ming","evade","事之成败，非一人之过。","祭足曰：「遂杀雍纠。」")),r("雍姬告其父，君以为可乎？",t("li","hit","可。人尽夫也，父一而已。","祭足曰：「此吾女之所以告我也。」"),t("yi","reason","不可。夫妻之义，亦不可弃。","祭足曰：「雍姬告之。」"),t("shi","evade","告与不告，皆有其难。","祭足曰：「遂杀雍纠。」"))],null,{success:"祭足曰：「君可与言权矣。」",compromise:"祭足曰：「君之言，半是。」",fail:"祭足曰：「君犹昧于机事。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},lu={theme:"夏日之日",intro:"赵盾，晋之正卿。狐偃曰：「赵衰冬日之日也，赵盾夏日之日也。」",debates:[f("v_zhaodun_dongri","夏日之日","court","yi",!0,"赵盾","晋之正卿","或问：「赵衰冬日之日，赵盾夏日之日，何谓也？」",[r("冬日之日与夏日之日，孰为政之道？",t("yi","hit","冬日之日可爱，夏日之日可畏。政宽则人爱，政严则人畏。二者不可偏废。","赵盾曰：「此吾之所以为政也。」"),t("li","reason","冬日者，人之所愿。为政当宽。","赵盾曰：「赵衰冬日之日也。」"),t("shi","evade","爱与畏，皆外也。","赵盾曰：「赵盾夏日之日也。」")),r("政严则人畏，君不惧失民心乎？",t("yi","hit","畏而后可以立政。民不畏法则法不行，法不行则乱。","赵盾曰：「此吾之所以严也。」"),t("li","reason","当宽以得众。严则民离。","赵盾曰：「夏日之日。」"),t("ming","evade","宽严随时，不必执一。","赵盾曰：「赵衰冬日之日也。」")),r("父子异道，君以为何如？",t("yi","hit","时异则道异。衰之时宜宽，盾之时宜严。","赵盾曰：「此吾之所以异于先君也。」"),t("li","reason","当守父之道。改之则失其本。","赵盾曰：「赵衰冬日之日也。」"),t("shi","evade","道之同异，非所计。","赵盾曰：「赵盾夏日之日也。」"))],null,{success:"赵盾曰：「君可与言政矣。」",compromise:"赵盾曰：「君之言，可采。」",fail:"赵盾曰：「君之说，未达宽严之宜。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhaodun_donghu","董狐直笔","court","yi",!1,"赵盾","晋之正卿","晋灵公欲杀赵盾。盾出奔，未出境而赵穿弑灵公。太史书曰：「赵盾弑其君。」",[r("盾未弑君，而史书弑君，君以为冤乎？",t("yi","hit","不冤。吾为正卿，亡不越境，反不讨贼，非我而谁？","赵盾曰：「此吾之所以受之也。」"),t("li","reason","冤矣。弑者赵穿，非盾。","赵盾曰：「董狐，良史也。」"),t("shi","evade","书法之严，后人自明。","赵盾曰：「亡不越境，反不讨贼。」")),r("孔子曰「越竟乃免」，君以为然乎？",t("yi","hit","然。越境则君臣之义绝，义绝则不任其责。","赵盾曰：「此夫子之所以惜我也。」"),t("li","reason","不然。未弑君而书弑，法之过也。","赵盾曰：「惜也，越竟乃免。」"),t("ming","evade","免与不免，皆有其义。","赵盾曰：「赵盾弑其君。」")),r("董狐不改其笔，君以为贤乎？",t("yi","hit","贤。史之职在直笔，不在全身。","赵盾曰：「董狐，古之良史也。」"),t("li","reason","太执。事有可权，何必自苦？","赵盾曰：「书法不隐。」"),t("shi","evade","贤与不贤，后人自评。","赵盾曰：「亡不越境，反不讨贼。」"))],null,{success:"赵盾曰：「君可与言史法矣。」",compromise:"赵盾曰：「君之言，半得。」",fail:"赵盾曰：「君犹以身为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},cu={theme:"三仕三已",intro:"子文，楚之令尹。三仕为令尹，无喜色；三已之，无愠色。",debates:[f("v_ziwen_sanshi","三仕三已","court","yi",!0,"子文","楚之令尹","子文三仕为令尹，无喜色；三已之，无愠色。",[r("三仕无喜，三已无愠，君以为难乎？",t("yi","hit","难。禄位者，人之所争。能不以得失动心者，鲜矣。","子文曰：「此吾之所以自处也。」"),t("li","reason","不难。位有去来，何必动心？","子文曰：「三仕为令尹，无喜色。」"),t("shi","evade","喜愠皆情，何必强抑？","子文曰：「三已之，无愠色。」")),r("旧政必告新令尹，君以为忠乎？",t("yi","hit","忠。政非一人之私，当以国为重。","子文曰：「此吾之所以告也。」"),t("li","reason","不必。新令尹自有其政。","子文曰：「旧令尹之政，必以告新令尹。」"),t("ming","evade","告与不告，皆有其分。","子文曰：「何勤民之惧而告之？」")),r("孔子称其「忠」，君以为何如？",t("yi","hit","忠者，尽己之谓。吾之所行，不过尽己而已。","子文曰：「此夫子之所以称我也。」"),t("li","reason","忠而未智。三已而不去，何益？","子文曰：「三已之，无愠色。」"),t("shi","evade","称与不称，皆外也。","子文曰：「三仕为令尹。」"))],null,{success:"子文曰：「君可与言忠矣。」",compromise:"子文曰：「君之言，可采。」",fail:"子文曰：「君犹动于得失。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_ziwen_hui","毁家纾难","domestic","yi",!1,"子文","楚之令尹","楚有内乱，子文毁其家以纾国难。",[r("毁家纾难，君以为可乎？",t("yi","hit","可。国亡则家无所托。先国而后家。","子文曰：「此吾之所以为也。」"),t("li","reason","不可。家者国之本，家毁则国亦弱。","子文曰：「毁其家以纾国难。」"),t("shi","evade","缓急之势，各有所宜。","子文曰：「国之多难。」")),r("国难既纾，而家已毁。君悔乎？",t("yi","hit","不悔。国存则家可复，国亡则家无从。","子文曰：「此吾之所以不悔也。」"),t("li","reason","悔。当留其家，为后日之计。","子文曰：「毁其家。」"),t("ming","evade","悔与不悔，皆无及矣。","子文曰：「国之多难，吾不敢爱死。」")),r("家与国，孰为本？",t("yi","hit","国为本。国存则家可立，国亡则家无所依。","子文曰：「此吾之所以毁家也。」"),t("li","reason","家为本。家齐而后国治。","子文曰：「毁其家以纾国难。」"),t("shi","evade","本之所在，随其时而异。","子文曰：「国之多难。」"))],null,{success:"子文曰：「君可与言国矣。」",compromise:"子文曰：「君之言，半是。」",fail:"子文曰：「君犹以家为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Vn={shi_mo:Bc,deng_xi:Gc,lie_yu_kou:Vc,yang_zhu:Yc,hui_shi:Uc,gong_sun_long:Kc,zou_yan:Qc,chunyu_kun:Wc,lao_lai_zi:Zc,zi_si:Jc,you_yu:Xc,qu_wan:eu,wu_ju:iu,tian_zi_fang:tu,duan_gan_mu:au,yu_zi:su,hua_yuan:nu,xiang_xu:ou,ji_zu:ru,jin_zhao_dun:lu,zi_wen:cu}});var uu,mu,du,hu,fu,gu,Un,Kn=O(()=>{Ae();uu={theme:"勇与义",intro:"子路性鄙，好勇力，志伉直，冠雄鸡，佩豭豚。",debates:[f("v_zilu_yong","好勇","military","shi",!0,"子路","孔门政事","子路曰：「君子尚勇乎？」子曰：「君子义以为上。君子有勇而无义为乱。」",[r("勇而无义，则为乱。君以为然乎？",t("shi","hit","然。勇者，器也。器无义，则伤人。","子路曰：「此吾之所以受教也。」"),t("yi","reason","勇者天资，不必尽以义绳之。","子路曰：「君子尚勇乎？」"),t("li","evade","勇与义，各行其道，不必相属。","子路曰：「有勇而无义者为乱。」")),r("闻斯行诸？",t("shi","hit","当先禀父兄，然后行之。","子路曰：「有父兄在，如之何其闻斯行之？」"),t("yi","hit","当度其义。义所在则行，不待命。","子路曰：「聞斯行之。」"),t("li","reason","当虑其利害。有利则行。","子路曰：「有父兄在。」")),r("结缨而死，君以为过乎？",t("shi","hit","不过。冠者，君子之服。死不忘其服，义也。","子路曰：「君子死，冠不免。」"),t("li","reason","过矣。留身以图后效，胜于一死。","子路曰：「结缨而死。」"),t("yi","evade","死生之际，非人所能择。","子路曰：「食其食者不避其难。」"))],k("结缨图",1,"你呈上结缨图：蒯聩之乱，子路结缨而死于台下。"),{success:"子路曰：「君可与言勇矣。」",compromise:"子路曰：「君之言，有可取。」",fail:"子路曰：「君之说，非大丈夫之言。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zilu_zheng","政事","court","shi",!1,"子路","孔门政事","子路问政。子曰：「先之，劳之。」请益。曰：「无倦。」",[r("先之劳之，其说如何？",t("shi","hit","上先其劳，则民不惜其力。上劳则下劝，不待令也。","子路曰：「此吾之所谓政也。」"),t("li","reason","在上者当总其成，不必亲劳。","子路曰：「无倦。」"),t("yi","evade","为政之道，因时而异。","子路曰：「先之，劳之。」")),r("夫子曰「无倦」，何以能无倦？",t("shi","hit","以政为志，则不以政为苦。志在其中，故无倦。","子路曰：「请益。」"),t("li","reason","分任群下，则己可以不倦。","子路曰：「无倦。」"),t("ming","evade","倦与不倦，存乎其人。","子路曰：「先之，劳之。」")),r("蒲邑三年而民信，其道何在？",t("shi","hit","先之劳之而已。不欺民，民亦不欺上。","子路曰：「此吾之所以治蒲也。」"),t("li","reason","严刑峻法而已。民畏则信。","子路曰：「三年而民信。」"),t("yi","evade","民自化之，非政所能致。","子路曰：「可使治其赋也。」"))],null,{success:"子路曰：「君可与言政矣。」",compromise:"子路曰：「君之言，可采。」",fail:"子路曰：「君之说，非治邑之道。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zilu_xiao","孝与直","court","yi",!1,"子路","孔门政事","叶公语孔子曰：「吾党有直躬者，其父攘羊，而子证之。」",[r("父攘羊而子证之，可谓直乎？",t("yi","hit","吾党之直者异于是：父为子隐，子为父隐，直在其中矣。","子路曰：「此吾师之言也。」"),t("shi","reason","证之，直也。父子之私，不可蔽国法。","子路曰：「吾党有直躬者。」"),t("li","reason","不证则法废。当使有司自察。","子路曰：「父为子隐。」")),r("孝与忠，相冲突时当如何？",t("yi","hit","先孝。孝者，人之本也。本立而道生。","子路曰：「此吾之所守也。」"),t("shi","reason","先忠。忠者，公义也。私不可胜公。","子路曰：「直在其中矣。」"),t("ming","evade","二者有时而相成，不必相害。","子路曰：「父为子隐。」")),r("负米百里以养亲，其劳可堪乎？",t("yi","hit","可堪。亲在则劳不以为苦，亲亡则欲养而无由。","子路曰：「此吾之所以伤也。」"),t("li","reason","当求禄以养，不必自苦。","子路曰：「伤哉贫也！」"),t("shi","evade","劳与不劳，皆人子之常。","子路曰：「由也事二亲之时。」"))],null,{success:"子路曰：「君可与言孝矣。」",compromise:"子路曰：「君之言，半是。」",fail:"子路曰：「君未知孝之本。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},mu={theme:"孝与三省",intro:"曾子之孝，孔子以为能通孝道，故授之业，作《孝经》。",debates:[f("v_zengshen_sanxing","三省","court","yi",!0,"曾参","孔门传道","曾子曰：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」",[r("三省之中，孰为最难？",t("yi","hit","传不习乎。忠信犹可勉强，习则须日日为之，不能欺己。","曾参曰：「此吾之所以日省也。」"),t("shi","reason","为人谋而忠，最难。利害当前，忠易失。","曾参曰：「吾日三省吾身。」"),t("li","reason","与朋友交而信，最难。信涉财货。","曾参曰：「为人谋而不忠乎？」")),r("日省其身，何益于国？",t("yi","hit","一国之治，自人人自省始。己正则不待上之督。","曾参曰：「此大学之道也。」"),t("shi","reason","省身者私事，治国者公事，二者不相关。","曾参曰：「吾日三省吾身。」"),t("ming","evade","省与不省，皆在一心。","曾参曰：「传不习乎？」")),r("三省而犹有过，当如何？",t("yi","hit","有过则改。改之未已，又省之。此终身之事。","曾参曰：「过则勿惮改。」"),t("shi","reason","三省而犹有过，则省之无益。当求师法。","曾参曰：「吾日三省吾身。」"),t("li","evade","人孰无过？不必自苦。","曾参曰：「君子之过也，如日月之食焉。」"))],k("孝经竹简",1,"你呈上《孝经》竹简：「身体发肤，受之父母。」"),{success:"曾参曰：「君可与言学矣。」",compromise:"曾参曰：「君之言，有可取。」",fail:"曾参曰：「君之说，未及于省。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zengshen_xiao","孝","court","yi",!0,"曾参","孔门传道","曾子耘瓜，误斩其根。曾皙怒，建大杖以击其背。",[r("父怒而杖之，子当受乎？避乎？",t("yi","hit","小杖则受，大杖则走。受大杖而死，是陷父于不义。","曾参曰：「此夫子之所以教我也。」"),t("shi","reason","当受。子不可避父之责。","曾参曰：「参罪大矣。」"),t("li","reason","当避。身者亲之遗体，不可毁伤。","曾参曰：「身体发肤，受之父母。」")),r("孝之至，在养乎？在敬乎？",t("yi","hit","在敬。养而不敬，与犬马之养何异？","曾参曰：「此孝之本也。」"),t("li","reason","在养。口体不给，敬无所施。","曾参曰：「今之孝者，是谓能养。」"),t("ming","evade","养与敬，皆当尽。","曾参曰：「孝子之养老也。」")),r("身体发肤，不敢毁伤。君以为然乎？",t("yi","hit","然。毁伤其体，即毁伤父母之遗。此孝之始也。","曾参曰：「此吾所作《孝经》之首也。」"),t("shi","reason","成仁取义者，岂能尽免毁伤？","曾参曰：「战阵无勇，非孝也。」"),t("li","evade","身之毁伤，有时势所迫。","曾参曰：「身体发肤，受之父母。」"))],null,{success:"曾参曰：「君可与言孝矣。」",compromise:"曾参曰：「君之言，半得。」",fail:"曾参曰：「君未知孝之道。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zengshen_zhongshu","忠恕","court","yi",!1,"曾参","孔门传道","子曰：「参乎！吾道一以贯之。」曾子曰：「唯。」",[r("夫子之道，忠恕而已矣。其说如何？",t("yi","hit","尽己之谓忠，推己之谓恕。一以贯之，无他道也。","曾参曰：「此吾之法也。」"),t("shi","reason","道大，岂忠恕二字所能尽？","曾参曰：「夫子之道，忠恕而已矣。」"),t("li","reason","当有更精之说，忠恕其粗者。","曾参曰：「吾道一以贯之。」")),r("君子之道，何以能一以贯之？",t("yi","hit","以其本在己。本正则万变不离。","曾参曰：「此吾所谓一也。」"),t("shi","reason","事有万端，岂能以一御之？","曾参曰：「忠恕而已矣。」"),t("ming","evade","一以贯之，唯圣人能之。","曾参曰：「夫子之道。」")),r("士不可以不弘毅，任重而道远。其说如何？",t("yi","hit","仁以为己任，不亦重乎？死而后已，不亦远乎？","曾参曰：「此吾之所自勉也。」"),t("li","reason","任重道远者，当量力。不必自苦。","曾参曰：「士不可以不弘毅。」"),t("shi","evade","弘毅之名，后人加之。","曾参曰：「任重而道远。」"))],null,{success:"曾参曰：「君可与言道矣。」",compromise:"曾参曰：「君之言，有见。」",fail:"曾参曰：「君之说，犹在言语。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},du={theme:"哭秦庭",intro:"伍员与申包胥友。员曰：「我必覆楚。」包胥曰：「我必存之。」",debates:[f("v_shenbaoxu_kuting","哭秦庭","diplomacy","yi",!0,"申包胥","楚之大夫","吴入郢。申包胥如秦乞师，立依于庭墙而哭，日夜不绝声，勺饮不入口，七日。",[r("哭七日以求师，君以为效乎？",t("yi","hit","效。秦伯赋《无衣》，为之出师。精诚所至，金石为开。","申包胥曰：「此吾之所以哭也。」"),t("li","reason","哀哭无益于兵。不如陈其利害。","申包胥曰：「寡君越在草莽，未获所伏。」"),t("shi","evade","哭与非哭，事成则已。","申包胥曰：「秦伯为之赋《无衣》。」")),r("吴兵在郢，楚已亡。君何以言存？",t("yi","hit","国者，非独城郭宫室。社稷未绝，则非亡也。","申包胥曰：「吾必存之。」"),t("li","reason","既已亡，当图复兴，不必强言。","申包胥曰：「吴为封豕长蛇。」"),t("ming","evade","存亡有数，非人所能强。","申包胥曰：「若亡，则无以事君。」")),r("友人覆楚，君存楚。朋友之义安在？",t("yi","hit","各尽其忠，不为朋友而废其国。吾告之曰：子能覆之，我必能兴之。","申包胥曰：「此吾所以与伍员言也。」"),t("shi","reason","当先朋友而后国。有约在先。","申包胥曰：「我必存之。」"),t("li","reason","从强者而已。不必拘于旧誓。","申包胥曰：「吾必存之。」"))],k("秦庭墙图",1,"你呈上秦庭图：包胥立依于墙，日夜哭不绝声。"),{success:"申包胥曰：「君可与言忠矣。」",compromise:"申包胥曰：「君之言，可采。」",fail:"申包胥曰：「君之说，非存国之道。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenbaoxu_gong","逃赏","court","yi",!1,"申包胥","楚之大夫","楚昭王入郢，赏申包胥。包胥曰：「吾为君也，非为身也。」遂逃赏。",[r("赏而逃之，何也？",t("yi","hit","吾为君耳，非为身也。受赏则非其本心。","申包胥曰：「此吾之所以逃也。」"),t("li","reason","有功当赏。逃之则沮后来者。","申包胥曰：「吾为君也，非为身也。」"),t("ming","evade","受与不受，各有其意。","申包胥曰：「遂不受。」")),r("有功不受赏，君以为矫乎？",t("yi","hit","非矫也。心之所存惟国，则赏不能动之。","申包胥曰：「此吾之所存也。」"),t("li","reason","近于矫。矫者悖常以取名。","申包胥曰：「吾为君也。」"),t("shi","evade","矫与不矫，唯其自知。","申包胥曰：「逃赏。」")),r("国既复，君将何之？",t("yi","hit","退而耕。功成不居，此吾之志。","申包胥曰：「吾不为身。」"),t("li","reason","当留于朝，以固其功。","申包胥曰：「遂逃赏。」"),t("ming","evade","去留随时，不必固守。","申包胥曰：「吾为君也，非为身也。」"))],null,{success:"申包胥曰：「君可与言义矣。」",compromise:"申包胥曰：「君之言，半是。」",fail:"申包胥曰：「君犹以赏为重。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenbaoxu_you","复国","court","yi",!1,"申包胥","楚之大夫","吴既退，楚国残破。或问：「何以复楚？」",[r("残破之国，当自何始？",t("yi","hit","先安民。民安则国自复，不必急于宫室。","申包胥曰：「此吾之所务也。」"),t("li","reason","先修城郭甲兵。无兵则再亡。","申包胥曰：「若亡，则无以事君。」"),t("shi","evade","复国之事，非一策可尽。","申包胥曰：「吾为君也。」")),r("吴虽退，其势犹强。君将如何？",t("yi","hit","修德以固本，结邻以御外。吴之势不能久。","申包胥曰：「此吾之所以存楚也。」"),t("shi","reason","当先发制人，乘其退而击之。","申包胥曰：「吴为封豕长蛇。」"),t("li","evade","强弱之势，自有其时。","申包胥曰：「吾必存之。」")),r("忠臣复国而不居功，后人何以效之？",t("yi","hit","效其心不效其事。心存于国，则赏亦不必辞；心存于名，则辞亦无所取。","申包胥曰：「善哉！君知本矣。」"),t("li","reason","当居功受赏，使人知所劝。","申包胥曰：「吾为君也，非为身也。」"),t("ming","evade","后人之效，非所豫虑。","申包胥曰：「遂逃赏。」"))],null,{success:"申包胥曰：「君可与谋国矣。」",compromise:"申包胥曰：「君之言，可采。」",fail:"申包胥曰：「君之说，急近功。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},hu={theme:"伐吴七术",intro:"文种事越王勾践，献伐吴七术。",debates:[f("v_wenzhong_qishu","伐吴七术","diplomacy","li",!0,"文种","越之大夫","越王问伐吴之策。文种曰：「臣有七术，请试其一二。」",[r("以七术伐国，君以为正当乎？",t("li","hit","兵者诡道。弱国图强，不能以堂堂之阵。术者，不得已也。","文种曰：「此吾之所以献也。」"),t("yi","reason","术多近于诡。君子当以正取胜。","文种曰：「寡君用其半而败吴。」"),t("shi","evade","术之正当与否，视其成败。","文种曰：「臣有七术。」")),r("遗之巧匠，使起宫室以耗其财。此术可乎？",t("li","hit","可。彼好宫室，则民力疲，府库空。不战而弱之。","文种曰：「此吾之第一术也。」"),t("yi","reason","此术伤彼国之民，非仁者所为。","文种曰：「越王用其半。」"),t("ming","evade","胜负之际，无所不用其术。","文种曰：「臣有七术。」")),r("越既灭吴，君之功最大。将如何自处？",t("li","hit","当早退。范蠡已去，吾犹留此，恐不能免。","文种曰：「此吾之所以不及蠡也。」"),t("yi","reason","当留。功未酬而先去，非忠。","文种曰：「寡君赐剑。」"),t("shi","evade","去留随时，不必豫虑。","文种曰：「吾不用蠡之言。」"))],k("七术竹简",1,"你呈上伐吴七术竹简：捐货币、贵籴粟、遗巧匠…"),{success:"文种曰：「君可与言谋矣。」",compromise:"文种曰：「君之言，有见。」",fail:"文种曰：「君之说，迂阔难行。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_wenzhong_tui","不退之祸","court","li",!1,"文种","越之大夫","范蠡去，遗文种书曰：「蜚鸟尽，良弓藏。子何不去？」",[r("范蠡遗书劝去，君当如何？",t("li","hit","当去。蠡见其机，吾不见，故及于祸。","文种曰：「此吾之所以悔也。」"),t("yi","reason","当留。吾于越有大功，越王岂忍负我？","文种曰：「吾不用蠡之言。」"),t("shi","evade","去留皆有其数。","文种曰：「寡君赐剑。」")),r("功大者危，君以为然乎？",t("li","hit","然。功大则震主，震主则不容。","文种曰：「此吾之所以死也。」"),t("yi","reason","功大者当受赏，何危之有？","文种曰：「寡君赐剑而死。」"),t("ming","evade","危与不危，在君之贤否。","文种曰：「吾不用蠡之言
