个国家不可轻犯，而不轻易说它能被犯。","在于善用辞令，能扭转对方的心意。","关键在得人，不是一句话说尽的。"]]}},wu_ju:{v_wuju_yin:{qs:["三年不飞不叫，这是只什么鸟？","王说「我知道了」却不改，你打算怎么办？","苏从接着又劝谏，王这才听从。你觉得如何？"],opts:[["三年不飞，一飞冲天；三年不叫，一鸣惊人。","这鸟没本事，君主应当除掉它。","鸟飞不飞，有它的时候。"],["再谏。一句话没说进去，就换个说法再说。","该走了。劝了不改，就没有可为的了。","改不改，在君主。"],["进谏不是一个人的事。我开了头，苏从收了尾。","苏从的直谏，比我的隐语管用。","谁的功劳，不必计较。"]]},v_wuju_zhanghua:{qs:["章华台的美，您觉得值得夸耀吗？","土木的费用，以什么为度？","灵王不听，后来有乾溪之祸。你觉得如何？"],opts:[["我听说国君以宠臣有德为美、以安民为乐、以听纳德言为聪、以致远方贤者为明，没听说拿土木的高大来当美的。","台建成了很美，也是国家的威仪。","美与不美，都是身外事。"],["不夺农时，不耗民财。台用来观望灾祥，榭用来讲习军事，这样就可以了。","国力够，就可以建。","度的所在，随时而变。"],["劝而不听，君主自己承受后果。不是谏者的罪。","应当更用力地劝。不听就走。","祸福有定数，人力劝不回来。"]]}},tian_zi_fang:{v_tianzifang_yue:{qs:["君主懂音乐，你觉得这算明察吗？","君主该专注于大事，还是大事小事都察？","文侯说了「善」，你觉得能教得动吗？"],opts:[["我听说，君主明于任用乐官，不必明于辨音。如今君主精于音律，我恐怕他会在任官上昏聩。","懂音律近于明察。君能审音，也算聪慧。","音的高低是小节。"],["专注大事。人主的职责在任用官员，不在审辨音律。","小事也要察。小事不察，大事也废。","大小各有各的适宜。"],["能教。知错就改，这正是君主贤明之处。","一时顺耳罢了，未必真改。","改不改，看他日后。"]]},v_tianzifang_pin:{qs:["富贵的人骄人，还是贫贱的人骄人？","你不行礼，你觉得这是傲慢吗？","子击发怒质问，你怎么回答？"],opts:[["也是贫贱的人骄人。诸侯骄人就失国，大夫骄人就失家。贫贱的人主张不合就走，像脱掉一双鞋。","富贵的人骄人。地位高就容易怠慢。","骄不骄，在人不在位。"],["不是傲慢。老师不对弟子行臣礼，这不叫失礼。","傲慢了。子击虽然是弟子，也是贵族。","礼的屈伸，各有各的适宜。"],["以理对，不以位对。位能屈人，理屈不了人。","应当谢罪。失礼于贵族，不是明哲保身之道。","答与不答，都是一时的事。"]]}},duan_gan_mu:{v_duanganmu_yuqiang:{qs:["君侯求见，你却翻墙躲开，为什么？","文侯经过你的里巷时凭轼行礼，你怎么看？","隐者之名，凭什么能比诸侯还重？"],opts:[["不称臣就不见诸侯。一见面就有了君臣名分，名分一定，就守不住自己的志向了。","君侯礼贤下士，为什么要躲？应当相见。","见与不见，都是小节。"],["在里巷行轼礼，敬的是他的德。不敬他的位，敬他的道。","路过里巷就行礼，太过了。君侯太委屈自己。","行礼与否，是君侯自己的意思。"],["因为他不求。不求就没有欲求，没有欲求，他的话就有分量。","名是人加的。隐者有什么名可重？","轻重的形势，不是人能强求的。"]]},v_duanganmu_xian:{qs:["好贤却不用贤，可以吗？","文侯说「寡人好贤」，秦国就不敢对魏国加兵。你觉得如何？","隐而不仕，功劳在哪里？"],opts:[["好不如用。只喜欢不举用，等于不好。","好就够了。贤者不必全都任用。","好与用，各有各的本分。"],["好贤的名声，也能止息刀兵。名声到了，实效就跟着来。","虚名而已，挡不住兵。","名与实，不必相提并论。"],["在于让君主知道世上有不肯屈从的士。这种风气一立，天下的士就都来了。","没有功劳可说。不出仕就不任事。","功的有无，不必计较。"]]}},yu_zi:{v_yuzi_lao:{qs:["九十岁还参与谋划国事，可以吗？","老臣和少臣，哪个更适合出谋？","文王于是重用你，你觉得如何？"],opts:[["可以。谋略在心不在筋骨。老人谋事，思虑更深。","不行。牙齿衰了思维也衰了。应当用壮年人。","老少各有各的适宜。"],["老臣谋大局，少臣出力气。两者相互依存。","少臣锐意进取，老臣墨守成规。应当用少的。","看事情的难易来选。"],["文王用的不是我的身子，是我的话。这正是王者兴起的原因。","不对。九十岁的人，哪还能任事？","用与不用，都有它的时候。"]]},v_yuzi_jiaohua:{qs:["「君子不以自己能做到的去责难别人」，这怎么讲？","教化百姓，应当宽，还是严？","楚国的兴盛，你觉得靠什么？"],opts:[["自己能做到而别人做不到，就不该拿这个去要求人。要求了，人就吃不消。","能者应当教不能者。不要求，人就没有上进的动力。","能与不能，本来就不相同。"],["宽而有节制。严了百姓畏惧而不亲近，宽了百姓轻慢而不服从。","应当严。百姓无知，不严就立不起来。","宽严随时而变，不必执着一种。"],["在后世能守住教化。教化在，国就在。","在兵力。没有兵，再有教化也立不住。","兴亡有定数，不是一句话能说尽的。"]]}},hua_yuan:{v_huayuan_mibing:{qs:["兵事能平息吗？","靠私交促成两国的和好，可以吗？","弭兵之后，诸侯更骄纵，兵争依旧。你觉得如何？"],opts:[["能平息一时。弭兵弭的是眼前的兵。要弭百世之兵，得靠礼。","不能。用兵是国之大事，怎么能全部平息？","弭与不弭，都有它的时候。"],["可以。弭兵之会本来就是靠私交促成的。但私交容易破裂，所以要接着用礼来巩固。","不可以。国家大事，不能拿私交来定。","公与私的界限，有时很难分。"],["弭兵是让天下人歇一口气，不是要弭百世的患。能歇一时，也就够了。","弭兵无功。只是助长了诸侯的骄纵。","功过都由后人评说。"]]},v_huayuan_yangzhen:{qs:["杀羊犒赏将士却漏了他的驭手，你觉得是失误吗？","小怨酿成大祸，该怎么防？","战败后逃回来，你觉得可耻吗？"],opts:[["失误了。一只羊的小事，害得军队打败、我被俘虏。小处不忍就乱了大谋。","没失误。驭手本来就不该分给。","得失都是小事，不必讨论。"],["凡事要均匀。均匀了就没有怨。","应当严刑惩治。惩一个人，众人就害怕。","事态的突变，不是人能预防的。"],["可耻。为将而败，应当死。我没死，是为了宋国。","不可耻。留下来才能图谋以后。","耻与不耻，都是身外事。"]]}},xiang_xu:{v_xiangxu_mibing:{qs:["弭兵会再度举行，效果能持久吗？","拿弭兵当名义向诸侯求名，可以吗？","会刚开成，你就请求免死的封邑。你觉得该吗？"],opts:[["能久一时。弭兵并没有废除兵，兵还在。","能久。诸侯已经会盟，谁敢违约？","久暂有定数，人料不到。"],["弭兵是为天下人歇担子，不是为求名。要是为了名，这个会就长不了。","可以。名一立，事就成。","名实之间，很难分清。"],["不该。弭兵是天下的利益，不是一人的功劳。当成功劳来请邑，这个会就成了利益场。","该。有功不赏，就没有人再肯出力。","请与不请，各随其意。"]]},v_xiangxu_fengyi:{qs:["子罕削了你的封邑，你不怨恨吗？","有功而不受赏，你觉得清高吗？","弭兵的好处，真的在诸侯吗？"],opts:[["不怨。子罕的话，正指出了我的过失。","该怨。功成而赏削，不是国家该有的信义。","怨与不怨，都是私情。"],["清高。功成不居，别人就没法用利来引诱你。","不清高。有功当赏，逃赏会让后来的人寒心。","受与不受，各随其志。"],["在百姓。兵停了，百姓能耕作，这就是利。","在晋楚。小国依然受它们摆布。","利在哪里，一句话说不完。"]]}},ji_zu:{v_jizu_quan:{qs:["君命和国家存续，哪个更重要？","驱逐国君、另立国君，你不怕后世讥笑吗？","权臣专擅国政，祸害在哪里？"],opts:[["国家存续重要。自己的身命和君命，都可以权衡。","君命重要。背弃君命求存，不合臣道。","存亡之际，很难用常理论断。"],["怕。但郑国不立君就乱，乱就亡。宁可受讥笑也要保住国。","应当守节而死。死了名节还在，国也不会亡。","讥与不讥，是后人的事。"],["在自己身死而国家乱。权不交还，君主不安；君主不安，国家不宁。","在失去臣节。专权的人终归不忠。","祸福相倚，一句话说不完。"]]},v_jizu_zhuanquan:{qs:["权臣专擅国政，该怎么处置？","雍纠的密谋泄露了，你觉得是谁的过错？","雍姬告诉了父亲，你觉得她可以吗？"],opts:[["应当慢慢收回他的权，不能立刻杀。立刻杀，他的党羽就会作乱。","应当公开定罪诛杀。迟了就生变。","专与不专，各有它的形势。"],["谋不密就败。是雍纠的过错，不是君主的过错。","是君主的过错。用人不当，把密谋交给私亲。","事的成败，不是一个人的过错。"],["可以。丈夫可以再选，父亲只有一个。","不可以。夫妻的情义，也不能舍弃。","告与不告，都有为难之处。"]]}},jin_zhao_dun:{v_zhaodun_dongri:{qs:["冬日之日与夏日之日，哪个才是为政之道？","政令严苛让人畏惧，你不怕失去民心吗？","父子为政风格不同，你怎么看？"],opts:[["冬日之日可爱，夏日之日可畏。政宽百姓爱，政严百姓畏。两者不能偏废。","冬日让人愿意亲近。为政应当宽。","爱与畏，都是外在的。"],["有畏才能立政。百姓不怕法，法就推行不了；法推行不了，就乱。","应当宽以待众。太严，民心就散。","宽严随时而定，不必执着一种。"],["时势不同，做法就不同。赵衰那个时代宜宽，如今宜严。","应当继承父亲的做法。改了就失去根本。","道的同异，不必计较。"]]},v_zhaodun_donghu:{qs:["你没杀君主，史官却写「赵盾弑其君」，你冤不冤？","孔子说「逃出国境就能免罪」，你觉得对吗？","董狐坚持不改笔法，你觉得他贤吗？"],opts:[["不冤。我是正卿，逃亡没出晋国境，回来也不讨伐乱贼，不是我还有谁？","冤。弑君的是赵穿，不是我。","书法的严苛，后人自会明白。"],["对。出了国境，君臣之义就断了；义断了，就不承担这个责任。","不对。没杀君主却写弑君，是笔法过苛。","免与不免，各有各的道理。"],["贤。史官的职责在直笔，不在保全自己。","太固执了。事有可以权变的，何必自苦？","贤与不贤，留给后人评价。"]]}},zi_wen:{v_ziwen_sanshi:{qs:["三次上任没有喜色，三次罢免没有怨色，你觉得难吗？","旧政必告知新任令尹，你觉得这算忠吗？","孔子称你「忠」，你怎么看？"],opts:[["难。禄位是人人争夺的东西。能不为得失动心的，很少。","不难。位子有来有去，何必动心？","喜怒都是人之常情，何必强压？"],["忠。政事不是一个人的私产，应当以国为重。","不必。新令尹自有他的做法。","告与不告，各有各的本分。"],["忠就是尽己。我所做的，不过是尽己而已。","忠而不智。三次罢免都不离开，有什么用？","称与不称，都是外物。"]]},v_ziwen_hui:{qs:["毁掉自己的家产来纾解国难，你觉得可以吗？","国难解除了，家却已经毁了。你后悔吗？","家与国，哪个是根本？"],opts:[["可以。国亡了家就没有依托。先国后家。","不可以。家是国的根本，家毁了国也弱。","缓急之势，各有各的适宜。"],["不悔。国在，家可以重建；国亡，家就没有了。","悔。应当留着家产，作日后的打算。","悔与不悔，都来不及了。"],["国是根本。国在家立得住，国亡家无所依。","家是根本。家齐才能国治。","根本在哪，随时候而变。"]]}}}});var mo,ho=O(()=>{mo={zi_lu:{v_zilu_yong:{qs:["有勇却不讲道义，就会作乱。您觉得对吗？","听到了就该马上去做吗？","系好帽缨而死，您觉得过分吗？"],opts:[["对。勇只是一种工具。工具不讲道义，就会伤人。","勇是天生的资质，不必都用道义去约束。","勇和义各走各的路，不必扯在一起。"],["应当先禀告父兄，然后再做。","应当衡量合不合义。义之所在就做，不必等命令。","应当考虑利害。有利就做。"],["不过分。帽子是君子的服饰。死也不忘穿戴整齐，这就是义。","过分了。留下性命图谋以后，胜过白白一死。","生死关头，不是人能挑拣的。"]]},v_zilu_zheng:{qs:["「带头干、带头吃苦」，这说法怎么讲？","老师说「不要懈怠」，怎么才能不懈怠？","治理蒲邑三年，百姓就信服了。门道在哪里？"],opts:[["在上的人先吃苦，百姓就不会吝惜力气。上面肯干，下面自然勤勉，不用下命令。","在上的人应当统筹全局，不必事事亲劳。","为政的方法，因时代而不同。"],["把施政当作志向，就不会觉得施政辛苦。乐趣在其中，所以不懈怠。","把事务分给属下，自己就可以不懈怠。","倦与不倦，因人而异。"],["不过就是带头干、带头吃苦。不欺百姓，百姓也不欺你。","不过是严刑峻法。百姓怕了就「信服」。","百姓自己受了感化，不是政令能做到的。"]]},v_zilu_xiao:{qs:["父亲偷了羊，儿子出面作证，能算正直吗？","孝与忠相冲突的时候，该怎么办？","从百里之外背米回来奉养双亲，那份辛苦受得了吗？"],opts:[["我们的规矩不同：父亲替儿子隐瞒，儿子替父亲隐瞒，正直就藏在其中。","作证才是正直。父子私情，不能遮蔽国法。","不作证法就废了。应当让官府自己去查。"],["先顾孝。孝是做人的根本，根本立住了，道才随之而来。","先顾忠。忠是公义，私情不能压过公义。","两者有时是相成的，不必对立。"],["受得了。双亲在世时，辛苦不觉得苦；双亲去世后，想奉养都没机会了。","应当求俸禄来养亲，不必自己受苦。","辛苦不辛苦，都是人子的本分。"]]}},zeng_shen:{v_zengshen_sanxing:{qs:["「每日反省三件事」中，哪一件最难？","每天反省自己，对国家有什么好处？","天天反省还是有错，该怎么办？"],opts:[["「传授的功课温习了吗」最难。忠与信还能勉强做到，温习却要日日坚持，骗不了自己。","「为人谋事尽心了吗」最难。利害当前，忠最容易失守。","「与朋友交往守信了吗」最难。信一旦牵涉钱财。"],["一国的治理，从每个人自省开始。自己正了，就不用上位者来督促。","反省自己是私事，治国是公事，两者不相干。","省与不省，都在自己一念。"],["有错就改。改完再省，这是终身的事。","天天反省还有错，说明反省没用，应当求教于师法。","人谁能无过？不必为难自己。"]]},v_zengshen_xiao:{qs:["父亲发怒用大杖打你，孩子该承受，还是躲开？","孝的极致，在养，还是在敬？","「身体发肤不敢毁伤」，你觉得对吗？"],opts:[["小杖就受，大杖就跑。被大杖打死，是让父亲背上不义之名。","该承受。儿子不能躲避父亲的责罚。","该躲。身体是父母的遗体，不能毁伤。"],["在敬。只养不敬，跟养狗养马有什么区别？","在养。口体之养都供不上，敬无从谈起。","养与敬都要做到。"],["对。毁伤身体，就是毁伤父母留下的遗体。这是孝的起点。","成仁取义的人，哪能避免毁伤？","身体的毁伤，有时是时势所迫。"]]},v_zengshen_zhongshu:{qs:["夫子的道，就是忠恕二字罢了。这怎么讲？","君子之道，凭什么能「一以贯之」？","「士不可不弘毅，任重而道远」，这怎么讲？"],opts:[["尽自己的心叫忠，推己及人叫恕。一以贯之，没有别的道。","道那么大，哪是忠恕两个字说得尽的？","应当有更精深的道理，忠恕只是粗浅的。"],["因为根本在自己。根本正了，万变不离其宗。","事情千头万绪，哪能用一个道理驾驭？","一以贯之，只有圣人做得到。"],["把仁当作自己的担子，不重吗？到死才放下，不远吗？","任重道远的人，应当量力而行，不必自苦。","弘毅的名目，是后人加的。"]]}},shen_bao_xu:{v_shenbaoxu_kuting:{qs:["在秦庭哭七天七夜求兵，你觉得有用吗？","吴军已经进了郢都，楚国已经亡了。你怎么还说「存」？","朋友要覆灭楚国，你要保存楚国。朋友之间的情义怎么办？"],opts:[["有用。秦哀公为他赋《无衣》，出兵救楚。精诚所至，金石为开。","哭对用兵没有用处。不如摆清利害。","哭也罢不哭也罢，事情成了才算。"],["国家不只是城郭宫室。社稷没有断绝，就不算亡。","既然已经亡了，就该谋划复兴，不必硬说没亡。","存亡有定数，人强求不来。"],["各尽其忠，不因为朋友而废掉自己的国。我对他说过：你能覆灭它，我必定能复兴它。","应当朋友在先、国家在后。有约在先。","跟着强者走就行，不必拘泥旧日的誓言。"]]},v_shenbaoxu_gong:{qs:["楚王要赏你，你却逃赏。为什么？","有功不受赏，你觉得这是做作吗？","国已恢复，你打算去哪儿？"],opts:[["我是为了国君，不是为了自己。受了赏，就违背了本心。","有功就该赏。逃赏会让后来的人寒心。","受与不受，各有各的用意。"],["不是做作。心里只有国家，赏就动不了我。","近于做作。违背常情来博取名声。","做作与否，只有自己知道。"],["退隐去耕田。功成不居，这是我的志向。","应当留在朝中，巩固这份功业。","去留随缘，不必固守。"]]},v_shenbaoxu_you:{qs:["残破的国家，该从哪里恢复？","吴军虽然退了，实力还很强。你打算怎么办？","忠臣复国却不居功，后人该怎么效法？"],opts:[["先安顿百姓。百姓安了，国自然恢复，不必急着修宫室。","先修城墙兵备。没有兵，就要亡第二次。","复国的事，不是一条计策就能说完的。"],["修德来固本，结交邻国来御外。吴的强势撑不了多久。","应当先发制人，趁他退兵时攻击。","强弱的形势，自有它的时候。"],["学他的心，不学他的事。心在国，赏就不必推辞；心在名，推辞也不足取。","应当居功受赏，让人知道有功有赏。","后人的效法，不是能预先考虑的。"]]}},wen_zhong:{v_wenzhong_qishu:{qs:["用七种计谋去对付一个国家，你觉得正当吗？","送去能工巧匠，让他们大兴宫室耗尽财力。这计可以吗？","越国灭了吴国，你的功劳最大。打算怎么自处？"],opts:[["用兵本就讲诡道。弱国图强，摆不出堂堂之阵，用计是不得已。","计谋多了就近于欺诈。君子应当以正取胜。","计谋正不正当，看成败。"],["可以。他好宫室，民力就疲、府库就空。不用打就削弱了他。","这计伤害的是别国的百姓，不是仁者所为。","胜负关头，无所不用其计。"],["应当早退。范蠡已经走了，我还留在这里，怕是躲不过去。","应当留下。功还没报答就走，不是忠。","去留随时而定，不必预先忧虑。"]]},v_wenzhong_tui:{qs:["范蠡留信劝你走，你打算怎么办？","功劳大的人危险，你觉得对吗？","越王赐剑，说「先生教寡人伐吴七术」，你该怎么回答？"],opts:[["该走。范蠡看出了先机，我看不出，所以遭祸。","该留。我对越国有大功，越王怎么忍心负我？","去留都有定数。"],["对。功大就会震主，震主就不能容身。","功大的人该受上赏，哪里危险？","危不危险，看君王贤不贤。"],["无话可答。计是我出的，用却在他。他拿这个定罪，没有道理却足以杀我。","应当谢罪。君王虽然不仁，臣子不能不敬。","死生有命，何必辩解？"]]},v_wenzhong_zhi:{qs:["十年生聚、十年教训，这个次序能颠倒吗？","百姓的可用，在于富，还是在于教？","越国的复兴，你与范蠡谁的功劳大？"],opts:[["不能颠倒。百姓吃不饱就没法教化，教化在先就打不了仗。","应当先教训。百姓懂了义，自己就会奋起，不必先积财。","两者并行，不必分先后。"],["在富，然后才能教。肚子不饱的人不懂道义。","在教。教化行了，穷也能用。","两者兼行，才能致用。"],["范蠡长于谋略，我长于治国。谋略可以取胜，治国可以持久。","范蠡功劳大。谋定而后动，没有范蠡就没有越国。","功劳多少，不必计较。"]]}},bai_li_xi:{v_bailixi_wuyang:{qs:["用五张羊皮赎回一位贤者，你不觉得是屈辱吗？","虞国灭亡了，你却在秦国，这是为什么？","七十岁才被任用，你不觉得太晚吗？"],opts:[["不辱。他拿羊皮赎我，我拿国家回报他。身价低贱，正显出道之可贵。","应当辞谢。用贱价来赎，是轻视我。","身份的贵贱，不在价钱。"],["虞君不听我的话，所以亡国。我不死，是因为有所等待。","应当为虞国殉难。既然食了他的俸禄，就不能抛弃他。","我脱身出来，才得以事奉秦国。"],["不晚。用得其道，一天就够了。","晚了。牙齿都衰了，还能做什么？","早晚都有天意，人挑拣不了。"]]},v_bailixi_baqin:{qs:["用人应当取其长处，还是求其完美？","西戎的地盘，能够占有吗？","秦国地处西陲，中原把它当夷狄看。你怎么自处？"],opts:[["取长。人没有完人。求全责备，天下就没有可用之人。","应当求全。一项品德的亏欠，可能坏大事。","长短各有各的适宜，看放在什么位置。"],["不必占有。得了他们的心，土地就能为我所用；只有地没有心，反而拖累自己。","应当全部拿下。土地广，国家就强。","取与不取，看实力。"],["以礼自处，就等于以中国自居；以力自处，别人也照样拿夷狄看你。","应当先夺取中原之地，然后才谈得上礼。","夷狄这个称呼，对人有什么损害？"]]},v_bailixi_ming:{qs:["推荐贤才又说不如他，你觉得这明智吗？","蹇叔到了之后，你怎么处理政务？","殽之战失败，两位将军都说不该出兵。你拿什么问责？"],opts:[["明智。知道自己不如人而推荐他，国家得了人才，自己也不失名声。","不明智。推荐胜过自己的人，自己的位子就危险。","荐与不荐，各按本分。"],["听他的就是。既然知道他贤，就不要怀疑他的话。","应当分他的权。一个人独揽政务，不是国家之福。","政务的得失，看时势。"],["无从责备。说了不被采纳，不是说话人的罪。","应当责他没有拼死力谏。","我不因一次小过错掩盖他的大德。"]]}},jian_shu:{v_jianshu_yao:{qs:["劳师袭远，你认为不行吗？","你对着出师的队伍哭，说「我只看见军队出发，看不见它回来」。你怎么敢说这话？","既然知道必败，你为什么不死谏？"],opts:[["不行。军队劳顿、士气衰竭，远方的主人早有防备。军队的行动，郑国必定知道。","可以。出其不意，正是取胜之道。","出兵与否，看形势。"],["知道必败所以哭。哭不是诅咒，是痛心。","出师而哭，挫伤军心。应当闭嘴。","成败还说不定，何必先哭？"],["谏了不听，我就把话说尽罢了。君主的意志夺不走，不是我的能力办得到的。","应当拼死力谏。以死相争，也许能挽回。","谏而不听，那就离开。"]]},v_jianshu_zhi:{qs:["凭道理推演事情，能完全知道吗？","既然知道却救不了，知道又有什么用？","世上没人了解你，是百里奚推荐了你。你觉得如何？"],opts:[["不能尽知，但能知其大概。道理所在，形势违逆不了。","道理是虚的。事情千变万化，不是道理能穷尽的。","知与不知，各有各的本分。"],["知道就可以防备。这一仗救不了，却能警醒后来的人。","知道也救不了，不如不知道。","有没有用，不必计较。"],["士人的遇与不遇，系于知己。百里奚了解我，所以我为他所用。","既然没人了解，就该自己显露才干，不必等人推荐。","知与不知，都是外物。"]]},v_jianshu_zi:{qs:["明知儿子必死还让他随军出征，你觉得忍心吗？","父子之情与君臣之义，哪个在先？","儿子死在殽山，你后悔吗？"],opts:[["不是忍心。君命不可违，我不能因私废公。","忍心了。明知会死，就该留下他。","去留的权柄不在父亲，在君主。"],["在朝廷就先君，在家就先父。位置不同，操守也不同。","父子天性，当以父亲在先。","君臣之义关乎国家。应当先君。"],["不悔。我说的那番话，不是为了我的儿子，是为了秦国的军队。","悔。如果留下他，就可以免一死。","悔与不悔，都来不及了。"]]}}}});var fo,go=O(()=>{fo={qi_huan:{v_qihuan_bo:{qs:["要称霸诸侯，该从哪里开始？","周室衰微，你尊奉它有什么好处？","北杏之会上，有诸侯叛盟。你怎么处置？"],opts:[["尊王攘夷。名分正了，诸侯自然跟从，不用动兵。","先把兵力搞强。兵强了，诸侯自然臣服。","应当结盟聚集诸侯。人聚多了，势就成了。"],["周室的名号还在。借它的名号向诸侯发号施令，不用争就有人臣服。","尊奉虚名却没有实利，不如自己取而代之。","名与实，不必计较。"],["以礼相责，不用兵。责备了就服，霸业就成。","应当讨伐。讨伐不服的，众人就怕了。","要叛的随他叛，任其去留。"]]},v_qihuan_guan:{qs:["管仲射中你衣带钩的仇，你忘了吗？","任用仇人为相，怎么让众人服气？","管仲临终说竖刁、易牙不可用。你听了吗？"],opts:[["忘了。那时各为其主，如今各为其国。","不能忘。射过君主的人不能用。","用不用，看才能，不看仇怨。"],["用功劳服人。功成了众人自然服，不用辩解。","应当先治他的罪，再论他的才。","众人服不服，不是一天能办到的。"],["听从。他既然识人，他的话就该听。","不听。这三人侍奉君主已久，哪会有二心？","用人之事，各有各的时机。"]]},v_qihuan_wan:{qs:["管仲去世之后，你为什么还用竖刁、易牙？","五位公子争位，你打算怎么处理？","霸业的成败，在人，还是在制度？"],opts:[["我没听进管仲的话，这是我的过错。","他们侍奉君主已久，未必有二心。","用人的得失，都有定数。"],["早点立定太子，就不会争。这是我失策的地方。","应当用兵威平定。谁强谁就立。","立谁都自有定数，不必强定。"],["在制度。人不在了制度还在，霸业就不会垮。我倚重人却不立制度，所以落到这地步。","在人。得人就兴，失人就亡。","两者都有它的时候。"]]}},jin_wen:{v_jinwen_san:{qs:["两军对阵，你为什么要退避三舍？","守信用却失去战机，你觉得值得吗？","城濮胜了之后，你打算怎么定霸业？"],opts:[["我曾经许下诺言，不能失信。先退让再开战，我就占理而楚国理亏。","战场上讲什么信用。应当先发制人。","退与不退，都看形势。"],["值得。战机可以再有，信用一失，天下就再没有国家肯跟晋国结盟。","不值。打了败仗国家就危险了，还谈什么信用？","信与机，都不是人力能算尽的。"],["在践土会盟诸侯，尊奉周室。名分正了，霸业就成。","应当乘胜夺取楚国土地，扩大晋国疆域。","霸不霸，留给后世说。"]]},v_jinwen_liu:{qs:["流亡十九年，你怎么能做到不失志向？","跟随你流亡的大臣，回国后该怎么对待？","介子推不求俸禄，俸禄也没给他。你觉得怎么样？"],opts:[["有随从们互相劝勉。一个人的志向容易垮，一群人的志向就压不垮。","志在得国，所以不垮。","久困之中心自然坚定，不是人力导致的。"],["赏他们的功，但不把权力交给他们。功劳不能忘，权力不能专。","应当重赏。他们随君主历难，理所应当报答。","赏与不赏，各有各的时候。"],["是我的过失。赏赐漏掉了隐士，士人就不肯出来。","他自己不求，不是君主的过错。","隐者的志向，不是赏赐能打动的。"]]},v_jinwen_cong:{qs:["跟随流亡的大臣居功自傲，你怎么处置？","狐偃请求辞去，你把璧投进河里盟誓。这是什么用意？","霸业已成，跟随流亡的人多居要职。你不怕吗？"],opts:[["记住他的功，但不容他恃功。功可以赏，恃功而骄不能纵容。","应当重赏。他们随君主历难，本该报答。","恃不恃功，看那人的品性。"],["跟他盟誓，表明不背弃。君主疑心臣子，臣子就会离开，所以用盟誓来稳固他。","近乎要挟。君主不该跟臣子盟誓。","盟不盟，都是一时的权宜。"],["怕。所以要分散他们的权力，让他们互相牵制。","不怕。他们随君主历难，必不负君主。","怕不怕，都是身外事。"]]}},chu_zhuang:{v_chuzhuang_ming:{qs:["三年不飞不叫，你心里是怎么打算的？","你沉湎享乐，臣下都在背后议论。这三年撑得住吗？","出手之后，该以什么为先？"],opts:[["不飞则已，一飞冲天；不鸣则已，一鸣惊人。","君王应当早些决断政事，何必等三年？","飞不飞自有它的时候，不必问。"],["撑得住。不看清实情，就不知道人的志向。三年的蓄积，一朝爆发。","撑不住。君主不理政事，国家就要乱。","堪不堪，都是外人的看法。"],["先整顿纲纪。该罚的数百人，该升的数百人。","先施行仁政，安顿民心。","先强兵力，威慑诸侯。"]]},v_chuzhuang_ding:{qs:["问鼎于周室，你是什么用意？","王孙满说「在德不在鼎」，你服吗？","邲之战晋军大败。你怎么处置？"],opts:[["想探探周室的虚实。鼎的轻重，就是天命的去留。","不能问。这是僭越礼制，诸侯会离心。","问不问，与得不得国无关。"],["服他的话，不服他的意思。周德已经衰了，鼎终究会移。","应当服他的言。不修德行却去争鼎，不是霸主的作为。","服不服，都是一时的事。"],["止戈为武。胜而不骄，才能长久。","应当乘胜追击，尽取晋国土地。","应当向诸侯施德，收拢人心。"]]},v_chuzhuang_youmeng:{qs:["用大夫的礼节葬一匹马，你觉得过分吗？","优孟用「人君之礼」来讽你，你怎么受得了？","你的过失，谁能纠正？"],opts:[["过分了。是我的错，优孟说得对。","不过分。我喜爱的马，厚葬是人之常情。","葬的厚薄，都是小节。"],["受他的讽。讽谏不逆耳，我自己就明白了。","应当治他戏弄君主之罪。君主的礼制不可以戏弄。","戏与不戏，看那个人。"],["能讽谏的人。直谏的人可能会死，讽谏的人能留下来。","能进谏的人。忠臣不避死。","君主自己纠正，何须靠人？"]]}},qin_mu:{v_qinmu_yao:{qs:["三位主帅丧师辱国，你为什么不治罪？","不听蹇叔的劝谏，你自己后悔吗？","败了之后怎么重新振作？"],opts:[["我不因一次小过错抹杀他的大德。过错在寡人，不在三帅。","应当治罪。丧师不罚，军法就无法立足。","治罪与否，都是一时的权衡。"],["后悔。我贪图郑国，所以不听老臣的话。","不悔。打仗偶有胜负，悔什么？","悔不悔，都来不及了。"],["修明政治、任用贤才。政修则民归附，民附则兵强。","应当快报殽山之仇，一雪前耻。","振不振兴，都有它的时候。"]]},v_qinmu_rong:{qs:["戎狄没有法度却能治，中原有法度却常乱，原因在哪里？","把女乐送给戎王，让他荒怠政事。这办法可以吗？","秦国地处西边，中原把它当夷狄看。你怎么自处？"],opts:[["中原的乱，正是上面失德、下面争位造成的。礼乐是装饰，没有德就是虚饰。","戎狄的治理简陋，称不上治。","治乱各随其俗，不必比较。"],["可以。用兵讲奇计，不用奇招就很难取胜。","不可以。用女乐乱别国，不是仁者所为。","术正当与否，看成败。"],["以礼自处，就等于以中国自居；以力自处，别人也照样拿夷狄看你。","应当先夺中原之地，然后才谈得上礼。","夷狄这个称呼，对人有什么损害？"]]},v_qinmu_xun:{qs:["拿良臣殉葬，你觉得可以吗？","国人赋《黄鸟》哀悼三良，你听说了吗？","秦国的霸业因为这个失了人心，你觉得值得吗？"],opts:[["不可以。这是我的错。君子不因所爱而害所敬。","可以。君主的爱臣，死生相随。","殉不殉，都是旧制。"],["听到了。百姓的哀痛，就是我的罪。","百姓的哀伤，与国法无关。","哀不哀，都是后人的情感。"],["不值。称霸以得人心为本，失了人心，霸就没有根。","值得。殉葬是旧制，霸业是大功。","值不值，后人自会评说。"]]}},zheng_zhuang:{v_zhengzhuang_duan:{qs:["共叔段日益骄纵，你为什么纵容他？","克段之后，你把母亲安置在城颍，发誓「不及黄泉，无相见」。后悔吗？","「挖地道相见」，你觉得这算孝吗？"],opts:[["不是纵容，是等他自取灭亡。早动手，别人会说我不悌；晚动手，罪在他自己。","应当早定其罪，以保全兄弟之恩。","纵与不纵，都有它的时候。"],["后悔。那句誓言，是一时之气。","不悔。母亲帮着弟弟作乱，应当有所责罚。","悔不悔，都是家事。"],["孝的权变。誓言不能废，母亲又不能绝，所以挖地道相通。","不算孝。誓既然出了口，就该守。","孝与不孝，后人自会评说。"]]},v_zhengzhuang_wang:{qs:["祝聃射中周王肩膀，你为什么叫停？","射了天子，你怎么自处？","郑国的强，靠的是礼，还是力？"],opts:[["不能进攻。欺凌天子，天下人会共同讨伐。","应当乘胜夺取周室，安定天下。","战阵之中，哪来得及挑拣？"],["夜里派祭足去慰问周王，并问候他的左右。表示不敢欺凌，诸侯就找不到借口。","应当向周室谢罪，以全君臣之义。","自处之道，各随其时。"],["靠力，也靠名。有力而无名，诸侯就会共同讨伐。","靠力。有实力，诸侯自然臣服。","靠礼。守礼，诸侯就亲近你。"]]},v_zhengzhuang_xu:{qs:["已经得了许国，你为什么又封立它？","让许叔住在许国东边，你觉得这是仁吗？","君子说郑庄公「在这件事上有礼」，你觉得对吗？"],opts:[["我不是贪他的土地，是讨伐他的罪。罪人走了，就该恢复他的祭祀。","应当全部拿下。得了土地，国家就强。","封与不封，都是一时的权宜。"],["不是仁，是权。许国不能灭，所以分割削弱它。","是仁。不绝人之祀，这是古时的正道。","仁与不仁，后人自会评说。"],["对。礼就是名分。守住名分，别人就不能加害于我。","不对。许国的土地是郑国的利益，何必拿礼来装点？","礼与不礼，都是外人加的。"]]}}}});var po,yo=O(()=>{po={song_xiang:{v_songxiang_hong:{qs:["楚军渡河渡到一半就该出击，你为什么不许？","楚军已经渡河但还没排成阵列，这时可以出击吗？","打了败仗，国人都归咎于你。你自己后悔吗？"],opts:[["君子不趁人危难。楚军还没渡完就出击，胜了也不光彩。","用兵本就讲诡诈。胜了就是君，败了就是俘虏。","打不打，各看时机。"],["不行。没排好阵就打，是趁人之乱。","可以。交战中讲什么礼，胜者为要。","礼与不礼，留给后人评说。"],["不悔。我虽是亡国的后裔，但没有丢掉仁义之名。","该悔。败军亡国，仁义有什么用？","悔与不悔，都来不及了。"]]},v_songxiang_hui:{qs:["小国去争盟主，你觉得可以吗？","会盟时被扣为人质，你觉得是屈辱吗？","仁义与国力，哪个才是宋国的根本？"],opts:[["可以。不争就永远是附庸国，争一争，也许还有希望。","不可以。宋国小、力量薄，争盟必败。","争与不争，都有它的形势。"],["是屈辱。但我是为会合诸侯受的辱，不是为自己。","大辱。身为国君却被扣押，是国家的耻辱。","辱与不辱，都是身外事。"],["仁义。宋国小，不能靠武力争胜，只能靠道义自守。","国力。没有国力，仁义根本无处施展。","两者各有各的适宜。"]]},v_songxiang_ren:{qs:["有人说仁义没有用，你怎么看？","以宋国的弱小，该怎么自处？","后人评论你迂腐，你自己怎么看？"],opts:[["仁义不是为了一时的用处。虽败而名存，名存国就不亡。","确实没用。国已经弱了，名声有什么用？","有用没用，不是一天能看出来的。"],["守义而不争强。事奉大国以礼，自守以信。","应当挑强者依附，以求生存。","自处之道，各随其国。"],["「迂」是别人嘴上的话。我守的是什么，我自己清楚。","确实是迂。兵败身伤，还谈什么守？","迂与不迂，听后世去说。"]]}},he_lu:{v_helu_wu:{qs:["吴国地处东南偏远之地，凭什么讨伐楚国？","孙武用宫女试兵，斩了你宠爱的姬妾。你恼火吗？","五战攻入郢都，你怎么处置？"],opts:[["楚国虽大，政令却出自多门。先拖垮他，然后就能攻入。","应当先修德政，等楚国自己乱起来。","伐不伐，看形势。"],["恼火，但因此知道他能带兵。做将军的，不能因私害法。","应当治罪。斩君王的爱姬，太无礼了。","恼火与否，都是一时的事。"],["进了郢都却不能安定楚国，这是我的失误。应当安抚百姓、收拢人心。","应当尽取楚国土地，扩大吴国疆域。","处置的办法，各随其时。"]]},v_helu_zhuanzhu:{qs:["弑君自立，你觉得可以吗？","专诸刺杀王僚而死，你怎么报答他？","靠刺客得国，你不怕后人也来效仿吗？"],opts:[["能做就该做。王僚本来就不该继位，我取的是我该得的。","不可以。弑君的人，天下共讨之。","可与不可，都是成功者的说法。"],["封他的儿子，让他家世代不绝。死士不能辜负。","厚赏他的家人，就够了。","人已经死了，报答有什么用？"],["怕。所以我立威震慑，让后来的人不敢效仿。","应当以德感化，让他们不起异心。","效仿不效仿，都有定数。"]]},v_helu_fuchai:{qs:["临死嘱咐儿子报仇，你觉得可以吗？","越国之患与楚国之患，哪个更急？","夫差忘了仇恨却去攻打齐国。你地下有知，会怎样？"],opts:[["可以。仇不报，国就被轻视；国被轻视，就要亡。","不可以。结怨相报，永无了局。","嘱咐与否，都是父子之情。"],["越国是心腹之患，楚国是皮癣。先越后楚。","楚国大而且近，应当先对付楚国。","两者都是患，不必挑选。"],["会恨他。我的话，他没有放在心上。","会体谅他。齐也是吴国的敌人。","地下的事，无法知道。"]]}},gou_jian:{v_goujian_huiji:{qs:["国家几乎灭亡还委屈自己去侍奉仇敌，你觉得可以吗？","给吴王当马前卒，你不觉得耻辱吗？","十年生聚、十年教训，这个次序能颠倒吗？"],opts:[["可以。耻在一时，社稷保住了；逞一时之快，宗庙就没了。","不可以。君辱臣死，还有什么脸面去侍奉仇敌？","屈与不屈，都有它的时候。"],["耻辱至极。但耻正是我的本钱。不忘耻，才能复国。","奇耻大辱。宁死不做。","耻与不耻，都是外人的看法。"],["不能颠倒。百姓吃不饱就没法教化，教化在先就打不了仗。","应当先教训。百姓懂了义，自己就会奋起。","两者并行，不必分先后。"]]},v_goujian_wen:{qs:["范蠡走了，你打算怎么处理他？","文种不走，你赐他剑。你觉得可以吗？","功臣与国家，哪个更重要？"],opts:[["随他去。走的人不追，来的人才不害怕。","应当留他。功还没报答完，怎么就走了？","去留各随其志。"],["可以。功高震主的人，不能久留。","不可以。文种对越国有大功，怎么忍心杀？","杀与不杀，都有它的形势。"],["国重。功臣可以再有，国家不能重立。","功臣重。没有功臣就没有国家。","轻重之势，各随其时。"]]},v_goujian_woxin:{qs:["这样苦自己，你觉得有效吗？","尝胆的事，近于自我标榜。你怎么看？","灭了吴国之后，你觉得仇算报了吗？"],opts:[["有效。身子不受苦，志就不坚；志不坚，仇就报不了。","不必这样苦。修明政治、任用贤才，自然见效。","有没有效，都在一念之间。"],["近于标榜，但能让人知道我不忘耻。这也是政治。","确实是标榜。为君者应当务求实际。","标榜与否，外人难以知晓。"],["仇报了，耻还没忘。一忘，国家又要危险。","仇已经报了。应当施行仁政，安定吴国百姓。","报没报，都是一时的说法。"]]}},chu_cheng:{v_chucheng_qi:{qs:["齐国拿「包茅没有进贡」作借口，你觉得有理吗？","屈完和齐侯订了盟，你觉得这是屈服吗？","齐桓公死了之后，楚国该怎么走？"],opts:[["包茅没进贡，是寡君的罪。但齐拿这个当借口，其实是怕楚国强。","没理。齐国要打楚国，拿这个作由头罢了。","名与实，不必细辨。"],["不是屈服。盟约成了，兵事就停了，我因此才答应。","是屈服。跟齐结盟，就是向齐低头。","屈与不屈，都是一时的说法。"],["北上争夺中原。齐国衰了，楚国应当接替它的霸业。","应当守境自安，不去争中原。","争与不争，都有它的时候。"]]},v_chucheng_shangchen:{qs:["已经立了商臣做太子，又想废掉他，你觉得可以吗？","子上说「君王年纪还不大，宠妾又多」，你为什么不听？","商臣弑君，你觉得是谁的过错？"],opts:[["不可以。太子已立又废，必生祸乱。","可以。立贤不立长，对国家有利。","废立之事，都有它的形势。"],["是我的错。老臣的话，多在日后应验。","他说得太早，我说得决断，有什么可悔？","听与不听，都有定数。"],["是我的错。立他立得不正、废他废得不及时，才落到这个地步。","是商臣的罪。弑父是天下大恶。","过在谁身上，留给后人评说。"]]},v_chucheng_zhongyuan:{qs:["治兵整肃而没杀一个人，你觉得这算能干吗？","楚想参与中原的政事，该以什么为先？","中原拿夷狄看楚国，你觉得这个看法能改变吗？"],opts:[["能。刑罚不滥用，百姓就不怨；百姓不怨，兵就能用。","不能。用兵尚威严，不杀人就没有威严。","杀与不杀，各看军情。"],["先修内政。政修了，中原就不能轻视楚。","先强兵力。兵强了才有的争。","先后的次序，各随其时。"],["能改。行中原的礼，中原自然无法把楚当外人。","改不了。夷狄之名由地而来，不是礼能改的。","名能不能改，不必计较。"]]}},jin_dao:{v_jindao_fu:{qs:["刚即位时，该以什么为先？","驱逐七个不肯臣服的大夫，你不怕他们的党羽作乱吗？","悼公的霸业和文公的霸业，哪个更难？"],opts:[["先整顿朝廷。朝廷正了政令才能行，政令行了诸侯才服。","先把兵力搞强。兵强了，诸侯自然臣服。","先后的次序，各随其时。"],["怕。所以只驱逐不诛杀，给他们留体面，党羽就结不起来。","应当全部诛杀，以绝后患。","逐与不逐，都有它的形势。"],["悼公难。文公靠着城濮的胜仗，悼公是在衰微之后起步的。","文公难。流亡十九年才得国。","难易都是后人说的。"]]},v_jindao_wei:{qs:["魏绛杀了君王弟弟的车夫，你觉得可以吗？","你发了怒要杀他，为什么后来又停手？","法与亲情，哪个更重要？"],opts:[["可以。军法不因贵贱而不同。","不可以。羞辱君主的弟弟，就是目无君主。","可与不可，都有它的形势。"],["听了他的话才停的。法既已立，君主也该守法。","应当杀。君主的怒气不能吞下去。","停与不停，都是一瞬间的决断。"],["法重。法能推行，亲情就不能破坏法；亲情一乱，法就亡了。","亲重。亲是君主的骨肉，法是后来才立的制度。","两者各有它的时候。"]]},v_jindao_san:{qs:["三次出兵之后楚就不能争锋了，你怎么做到的？","郑国服晋又服楚，你打算怎么处置？","霸业的要领，在兵力，还是在谋略？"],opts:[["拖垮他而不与他交战。楚远道而来就疲惫，我以逸待劳。","应当决战。一战而定，何必三次出兵？","战与不战，都有它的时候。"],["不责备他两头投靠。郑夹在两强之间，两头投靠是它的处境。","应当讨伐。怀有二心的就该打。","贰与不贰，都是小国的处境。"],["在谋。兵是谋的工具，谋定了兵才可用。","在兵。没有兵，谋就无处施展。","两者相互依存，不可偏废。"]]}}}});var vo,bo=O(()=>{vo={cao_gui:{v_caogui_gu:{qs:["凭什么去打这一仗？","齐军擂了三次鼓，你为什么都不许出击？","得胜之后，你为什么先下车看车辙、又登车远望？"],opts:[["取信于民。大大小小的案件，虽然不能一一明察，但一定按实情处理。","用兵打。兵强的赢。","要打就打，何必事先盘算？"],["打仗靠的是勇气。第一次擂鼓振作士气，第二次就衰减，第三次就耗尽了。他们耗尽我们正饱满，所以能赢。","应当先发制人。等他们击鼓我也击鼓，士气早就泄了。","击鼓的先后，都能作战。"],["大国难以捉摸，怕有埋伏。看到他们的车辙乱了、旗帜倒了，才下令追击。","赢了就该追，何必多疑？","看不看，都是一时的举动。"]]},v_caogui_rou:{qs:["同乡人说「当官的自会谋划，你又何必掺和」，你怎么回答？","做官的真的都鄙陋吗？","平民议论国事，他的话怎么才能传到上面？"],opts:[["不对。国家的安危，匹夫有责。做官的未必有远谋。","对。谋划的人有他的位置，不在其位就不该与闻。","与闻与否，都有它的时候。"],["未必都鄙陋。但在位日久，多半照老规矩办，不去体察实情。","鄙陋。朝中没人有远谋，所以屡打败仗。","鄙陋与否，因人而异。"],["在君主肯不肯听。肯听，平民就能接近；不肯听，做官的说话也没用。","应当由官署转达。平民直谏，不合国体。","传不传得到，都有定数。"]]},v_caogui_qing:{qs:["把狱讼断得合乎实情，为什么就能打仗？","百姓不信任，就算打赢也危险。你觉得对吗？","战的本在民，末在兵。两者可以偏废吗？"],opts:[["百姓信服君主，就会拼死不离开。这才是打仗的根本。","狱讼是内政，用兵是外事，两者不相干。","察不察实情，不是一天能看出来的。"],["对。赢了而民心散了，那是打了胜仗却走向灭亡。","不对。打了胜仗国家就强，百姓自然归附。","信与不信，都是外在的。"],["不可。根本立住了，枝节自然跟上。只修枝节，根本就拔掉了。","可以偏废。兵强就能取胜，百姓自然归服。","本末的次序，各随其时。"]]}},xian_zhen:{v_xianzhen_gui:{qs:["「用兵讲究诡诈」，你觉得对吗？","诡计用多了，诸侯就不再信任晋国。你不怕吗？","战争的胜负，在谋略，还是在勇力？"],opts:[["对。用兵不厌诈。拘泥于礼就败，通晓变化就胜。","不对。靠诡诈取胜，就算胜了也不光彩。","诈与不诈，都看形势。"],["怕。所以打赢了就结盟，用信来补。诈用于交战，信用于会盟。","很怕。信用一失，诸侯就不再与晋国往来。","信与不信，不是一仗能定的。"],["在谋。勇是谋的工具，谋定了勇才有用。","在勇。勇者不惧，就无往不胜。","两者相互依存，不可偏废。"]]},v_xianzhen_mian:{qs:["对君主吐口水，你觉得可以吗？","既然吐了口水，为什么又脱下头盔冲进狄人军中赴死？","死节与成功，哪个更重要？"],opts:[["不可以，但我不得不做。我的话不被采纳，国事就要败坏。","大不可。对君主无礼，罪当死。","可以与否，都是一时的愤激。"],["自己惩罚自己。君主不罚我，我该自罚。以死明志，才不失气节。","不必死。向君主谢罪，可以保全性命。","死与不死，都有定数。"],["死节重要。功可以由后人去成，气节一失就再难挽回。","成功重要。人死了，国家就失去一位大将。","两者各有它的时候。"]]},v_xianzhen_qiu:{qs:["君王放走了秦国的俘虏，你怎么看？","既已释放又要去追，可以吗？","将军的怒气，可以冲着君主发作吗？"],opts:[["失策。将士拼死力抓来的俘虏，一朝全放了，将士的心就寒了。","得策。放俘以结秦国之好，胜过拘押。","放与不放，都看形势。"],["可以。君命有所不受，何况已经明白了自己的失误？","不可以。君命已经发出，再去追就是第二个命令。","追与不追，都是一时之举。"],["不可以冲着君主，但可以显在脸色上。显出来，是盼君主醒悟。","不可以。臣对君，应当以礼自持。","怒显不显，都是外在的。"]]}},si_ma_rang_ju:{v_rangju_jia:{qs:["监军约定时间却迟到，该怎么处置？","君主派使者持节来赦免他，你凭什么拒绝？","斩杀监军来立威，你觉得过分吗？"],opts:[["斩。约定之后不到，就是轻慢军令。不斩，军令就没人执行。","应当斥责而不斩。监军是君主的亲信，斩了伤君主的心。","各按各的罚。"],["将在军中，君命有所不受。军令已出，不能中途更改。","应当接受君命。君命大于军令。","受与不受，各看时机。"],["不过。威不立，令就不行；令不行，兵就不能用。","过了。拿亲信立威，伤了君主的心。","过与不过，后人自会评说。"]]},v_rangju_jun:{qs:["君命与军令，哪个更重要？","「不接受君命」，界限在哪里？","「将军领受命令的那一刻，就忘掉了自己的家」，你觉得对吗？"],opts:[["身在军中就以军令为重。战场瞬息万变，君命远道传来就误了战机。","君命为重。将军是君主的臣子。","挑有利的那条听。"],["在军机。若是涉及国本、涉及君主自身，那就不能不受。","应当一概听命。将军不能自专。","界限的事，临阵才看得清。"],["对。忘了家，然后才能为国而死。","不对。连家都顾不上的人，怎么顾得上国？","忘与不忘，都在自己一心。"]]},v_rangju_si:{qs:["「用战争制止战争」，这怎么讲？","用兵，以仁为本，还是以利为本？","「杀掉少数人来安定多数人」，你觉得可以吗？"],opts:[["战争是不得已的手段。打一仗能止住百仗，这一战就是仁。","战争止不住战争，只会添乱。","止不止得住，看形势。"],["以仁为本。利是仁的末节。","以利为本。无利可图，兵就不会动。","仁与利之间，临阵才见分晓。"],["可以。杀人是为了安人，不是好杀。","不可以。以杀止杀，杀永远止不住。","安与不安，都有定数。"]]}},lu_cao_mo:{v_caomo_jie:{qs:["拿匕首劫持盟主，你觉得可以吗？","齐桓公已经答应又想反悔，管仲劝住了他。你怎么看？","既然拿回了土地，你为什么扔下匕首，退到群臣的位次上？"],opts:[["可以。三战三败，鲁国社稷危在旦夕，只剩这一条路。","不可以。劫盟的人失信于天下。","可与不可，都是成功者的说法。"],["管仲的话对。答应了不背弃，信用就立了；信用立了，霸业就成了。","不该答应。劫盟定下的约定，谈什么信用？","背与不背，在齐国。"],["事情已经办成了。挟持久了会生变，退下来才能保全自己。","应当继续挟持，等齐国把侵占的土地全部归还。","退与不退，都是一时之举。"]]},v_caomo_bai:{qs:["三战三败，你觉得是将领的罪吗？","败军之将再被起用，你觉得可以吗？","打了败仗却靠劫盟收回土地，你觉得这是功吗？"],opts:[["在我。兵器不利，不是士兵的错。","不是将领的罪。齐强鲁弱，形势必然如此。","罪在谁身上，留给后人评说。"],["可以。败了而知道羞耻的人可用。耻，正是勇的来源。","不可以。败将再用，士气就提不起来。","用与不用，都在君主。"],["功在鲁国，耻在我自己。拿耻换功，我不觉得光荣。","是大功。收复失地，正是将领的职责。","功与耻，都是身外事。"]]},v_caomo_yong:{qs:["「一剑之功」能抵得上百万大军吗？","匹夫之勇与将帅之勇，怎么区分？","以死士的手段行事却位列群臣，你自己心安吗？"],opts:[["看时候。百万大军救不了的时候，一剑就是重的。","百万大军重。一剑只是匹夫之勇。","两者各有它的时候。"],["匹夫之勇逞一时之快；将帅之勇谋定而后动。","没有分别。勇就是不怕死罢了。","勇的分类，不必细分。"],["不安。但我做的事，是不得已。","安。功成而位列朝堂，有什么不安？","安与不安，都在自己一心。"]]}},yang_youji:{v_youji_she:{qs:["百步之外射柳叶，箭箭命中，这功夫的诀窍在哪里？","有人说「善射的人不应该把本事用尽」，你觉得对吗？","射箭的技艺和带兵打仗的道，哪个更难？"],opts:[["在勤练。手熟了心就不乱，心不乱箭就没有虚发。","在天资。不是人力能强求的。","熟练与天资，各占一部分。"],["对。力气有穷尽的时候，射也有穷尽的时候。懂得藏力的人走得久。","不对。能射就射，何必藏？","藏与不藏，各看时候。"],["打仗难。射是一人的技艺，战争是万众的性命。","射难。百发百中的人，天下能有几个？","两者各有所难。"]]},v_youji_lu:{qs:["王赐你两支箭，你为什么只射一箭就交回一支？","一箭就射中，你觉得是运气，还是技术？","善射的人，能靠它取胜吗？"],opts:[["一箭就够了。留一支还给王，表示不白受他的赏赐。","应当用完两支，以备万一。","一箭两箭，都能射中。"],["是技术。运气不常有，技术却能常靠得住。","是运气。战场上中与不中，都有定数。","运气还是技术，不必分。"],["不能。一个人的箭，挡不住万军。恃技者必败。","能。一箭射中他们的主将，万众都会丧胆。","恃与不恃，都看形势。"]]},v_youji_jie:{qs:["善射之人的「戒」，指的是什么？","技艺到了极处，该怎么自处？","以技艺事奉君主，和以道义事奉君主，哪个长久？"],opts:[["戒在「自恃」。仗着本事就骄傲，骄傲就败。","戒在「懈怠」。不练习，手就生了。","戒与不戒，都在自己一心。"],["以「不足」自处。自以为够了，技艺就止步了。","以「有余」自处。技艺已到极处，就该彰显它。","自处之道，各随其人。"],["以道长久。技有穷尽的时候，道没有。","以技长久。君主用的，正是他的技。","两者各有各的适宜。"]]}},lu_shu_liang_he:{v_shuliang_men:{qs:["闸门已经放下，你为什么徒手把它撑住？","靠力气救人，你觉得这是为将之道吗？","力气能托起城门，却始终不得重用。你自己怎么看？"],opts:[["门下还有士兵，不全撤出来就全死了。我的手可以断，士兵不能弃。","应当自保。一条命，比几个士兵值钱。","撑与不撑，都是一瞬间的决断。"],["力气是将领的余事。但到了那一刻，没有力气就没有将领。","不是为将之道。为将者靠谋略，不靠斗力。","力与谋，各有它的时候。"],["力不足以自恃。我以力闻名，也因力止步于此。","是时命。有这身勇力，何愁不被重用？","用与不用，都有定数。"]]},v_shuliang_li:{qs:["力与德，哪个更重要？","以力闻名的人，该怎么自处？","君子的勇和匹夫的勇，怎么区分？"],opts:[["德重。力能胜一个人，德能服一个国。","力重。没有力气，德就没有处施展。","两者各有各的用处。"],["以德来辅助。有力而无德，别人怕你却不亲近你。","以力自处。有实力，别人就不敢犯。","自处之道，各随其人。"],["在义。义之所在就勇，不义就不为。","在胜。能胜过人的，就是勇。","勇的分类，不必细究。"]]},v_shuliang_zi:{qs:["以勇力闻名的人，儿子该教他什么？","年老才得子，你觉得是幸事吗？","勇力这份家业，能传给儿子吗？"],opts:[["教他学习。力有时而穷，学无时而穷。","教他武艺。父子相传，家业不坠。","各按他的材质来教。"],["是幸，也是忧。老了教不动，儿子就难成器。","是幸。有儿子，家业就有了寄托。","幸与不幸，都有定数。"],["力传不了，德与学能传。所以应当以学代力。","能传。练下去，力气也会慢慢长。","传与不传，都有它的形势。"]]}},jin_wei_shu:{v_weishu_che:{qs:["「毁掉战车、改编成步兵」，你是怎么决断的？","旧法已废，军心不安。你怎么处置？","车战和步战，哪个对中原更有利？"],opts:[["地形险窄而敌人是步兵。战车施展不开，反而成了累赘。改成步兵才能打。","战车是国家的长技，不可轻易废弃。","用战车还是用步兵，看地形。"],["我先带头毁自己的车，然后众人才跟着改。为将的，要首先站在法度之内。","应当慢慢开导，不能骤然改变。","变法的事，各有它的时候。"],["各看地形。平原用车，险要用步，这是用兵的常理。","车战有利。战车是中原的长技。","利与不利，看敌人是谁。"]]},v_weishu_fa:{qs:["旧法可以废除吗？","推行变法的人，靠什么让众人服气？","法度的制定，在君主，还是在将领？"],opts:[["可以废，但不能骤废。先立新法，再废旧法。","不可以。旧法是先王立的，轻废就乱。","废与不废，看形势。"],["以实效服人。变法打赢了，众人自然服。","以德服人。先端正自己，再推行变法。","服与不服，都有它的时候。"],["大法在君主，临阵的法则在将领。","都在君主。将领是奉法而行的人。","两者各有所主。"]]},v_weishu_zu:{qs:["设置五种阵形相互策应，用意在哪里？","阵形分散的弊病，是容易被敌人各个击破。你怎么处置？","阵法与将令，哪个更关键？"],opts:[["在分散而能相救。阵分开敌人就无法合力进攻，阵相连就能一处受敌、众处来救。","在合。阵合起来力量才厚。","分与合，各看地形。"],["以「相属」来处理。阵虽分而号令相通，就分而不散。","应当合而不分。分则力量分散。","分合的利弊，临阵才看得清。"],["将令更关键。阵是形，令是神。","阵法更关键。阵形摆正了，士兵自然听用。","两者相互依存。"]]}},jin_xi_bo:{v_xibo_an:{qs:["只是被笑了一下，你为什么非要报复？","你腿脚有残疾，人所共知。被人讥笑，你觉得是耻辱吗？","鞍之战齐国大败。你觉得耻辱已经洗清了吗？"],opts:[["不是为了我自己。羞辱使者，就是羞辱晋国。不报复，晋国就被诸侯看轻了。","不必报。一笑之微，何至于兴师动众？","报与不报，都看形势。"],["耻不在我的身体，在国家的脸面。身为使者，就代表着国家的面目。","耻在自身。个人的屈辱，不该动用国家来报复。","耻与不耻，都是外人的看法。"],["清了，但还不够。讥笑使者的，不只齐侯一个人。","清了。打赢他的军队，足以报复了。","雪没雪，都在自己一心。"]]},v_xibo_shi:{qs:["使者受辱，就等于国受辱吗？","在邻国受辱，该用兵报复，还是用言辞交涉？","因为愤怒就兴师动众，你觉得可以吗？"],opts:[["是。使者带着君主的使命出去，他的颜面就是君主的颜面。","不是。一个人的得失，跟一国有什么关系？","关不关国家，看事情轻重。"],["先交涉，交涉不成再用兵。兵是辞的后手。","应当用辞。兵是国之大事，不能因为怒气出兵。","兵与辞，各看形势。"],["不可以。怒气是一时的，出兵却收不回来。所以必须等到有必胜的把握。","可以。君主的怒，就是三军的怒。","怒与不怒，都在自己一心。"]]},v_xibo_quan:{qs:["权臣专擅国政，祸害在哪里？","既然知道有祸，为什么不离开？","功劳高的人和权力大的人，哪个更危险？"],opts:[["在自己身死族灭。权不交还，君主就猜疑；君主猜疑，祸就到了。","在国家变弱。权在私家，公室就空了。","祸福相倚，一句话说不完。"],["走了国家就没了顶梁柱。留下来承受怨责，还是胜过一走了之。","应当离开。保全自己以图后效。","去与不去，都有定数。"],["权大的人危险。功可以赏，权不能假手于人。","功高的人危险。功高震主者不祥。","两者都有危险。"]]}}}});var Cu,Iu,Nu,Ru,Lu,Hu,Pu,Du,Fu,Bu,Gu,Vu,Yu,Uu,Ku,Qu,Wu,Zu,Ju,Xu,em,im,tm,am,sm,nm,om,rm,lm,cm,um,Ha,Dt,Ft=O(()=>{Ae();ie();Yn();Kn();Wn();Jn();eo();to();so();oo();lo();uo();ho();go();yo();bo();Cu={theme:"仁与礼",intro:"子温而厉，威而不猛，恭而安。",debates:[f("v_kongzi_ren","问仁","court","yi",!0,"孔子","鲁之学者","你向孔子请教为政之道。夫子不答，先反问：「君以为政，何者为先？」",[r("为政以德，譬如北辰，居其所而众星共之。君若能之乎？",t("yi","hit","德者，非徒善也。上与下同其欲，则民不令而从。","夫子莞尔：「可与言政矣。」"),t("li","reason","先立赏罚，使人知所劝惩，德乃可施。","夫子点头：「亦有此说。然刑不立乎？」"),t("shi","evade","政在得人，得人则事无不成。","夫子曰：「人存政举，人亡政息。君之言得之，而未尽也。」")),r("道之以政，齐之以刑，民免而无耻。君以为如何？",t("yi","hit","免而无耻，非小患也。耻者，人之所自守，刑之所不能及。","夫子曰：「善哉！此吾所谓『有耻且格』也。」"),t("li","reason","民愚，不知耻；刑立而後可教。","夫子叹曰：「不教而杀，谓之虐。」"),t("ming","evade","三代之政，皆先刑后教，君不闻乎？","夫子曰：「夏殷之礼，吾能言之，杞宋不足征也。」")),r("君子之德风，小人之德草。君自视，风乎？草乎？",t("yi","hit","在上者一言之失，四方传之。德不修，则草偃而不从。","夫子肃然：「君知此，可矣。」"),t("shi","reason","臣非风非草，乃风与草之介也。","夫子曰：「然。上下之间，唯士为难。」"),t("li","evade","人在其位，各尽其分，何问风草？","夫子不答，良久曰：「君未之思也。」"))],k("乡校议政录",1,"你呈上乡校议政的记录：国人议论朝政，未尝壅塞。"),{success:"孔子曰：「善哉！不毁乡校，此子产之所以为贤也。」此后每有政事，必先问你的见解。",compromise:"孔子沉吟：「君之言亦有可取。然礼之失，非一日可复。」",fail:"孔子不语，转身取琴而鼓之，终不复言。"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_kongzi_li","论礼","court","yi",!1,"孔子","鲁之学者","鲁国宗庙祭祀，礼器陈设失序。你问孔子：「礼之为礼，在器乎？在心乎？」",[r("礼云礼云，玉帛云乎哉？",t("yi","hit","玉帛者，礼之文也。无其心而用其器，是谓虚礼。","夫子拊掌：「赐也，始可与言《诗》已矣！」"),t("li","reason","器既失序，则礼无所寄。先正其器，心自随之。","夫子曰：「然。然亦不可徒事其器。」"),t("shi","evade","礼者，先王之成法，遵之而已，何必问心？","夫子曰：「如礼何！如礼何！」")),r("今之孝者，是谓能养。至于犬马，皆能有养。不敬，何以别乎？",t("yi","hit","敬者，不在声色。察其志之所向，顺而导之。","夫子曰：「此之谓敬。」"),t("li","reason","养其身，供其欲，父母安之，斯可矣。","夫子曰：「今之孝者，是谓能养。」"),t("ming","evade","孝者，天下之通义，不待教而能。","夫子曰：「小人皆能养其亲，君子不敬，何以辨？」")),r("君欲使鲁国之民皆知礼，当自何始？",t("yi","hit","自士始。士知礼，则庶人观之而化。","夫子曰：「先有司，赦小过，举贤才。」"),t("li","reason","自朝廷始。上有所好，下必甚焉。","夫子曰：「其身正，不令而行。」"),t("shi","evade","礼者，民自化之，不必驱也。","夫子曰：「民可使由之，不可使知之。」"))],null,{success:"孔子曰：「可与共学矣。」遂以《礼》授你，并留你论学三日。",compromise:"孔子为你陈说礼之本末，你记下了大半。",fail:"孔子曰：「礼者，敬而已矣。君心未敬，何论于礼？」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-3}}),f("v_kongzi_xue","论学","court","ming",!1,"孔子","鲁之学者","有少年问孔子：「学何为？」夫子曰：「女奚不曰：其为人也，发愤忘食，乐以忘忧。」",[r("学而时习之，不亦说乎？君以为，学之乐在何处？",t("ming","hit","在知其所以然。习之既久，豁然贯通，此乐非外物可比。","夫子曰：「可与言学矣。」"),t("li","reason","学成则禄在其中，此乐最实。","夫子曰：「君子谋道不谋食。」"),t("shi","evade","学不必求乐，求其有用耳。","夫子曰：「古之学者为己，今之学者为人。」")),r("知之者不如好之者，好之者不如乐之者。君自居何等？",t("ming","hit","臣方在「好之」，未能「乐之」。愿从夫子学。","夫子曰：「知之为知之，不知为不知，是知也。」"),t("yi","reason","知之为先，好乐可渐致。","夫子曰：「譬如为山，未成一篑。」"),t("li","evade","知足矣。好与乐，非治世所需。","夫子曰：「三年学，不至于谷，不易得也。」")),r("吾尝终日不食，终夜不寝，以思，无益，不如学也。君以为然乎？",t("ming","hit","思而不学则殆。臣尝困于此，故知夫子之言不虚。","夫子曰：「学而不思则罔，思而不学则殆。君兼之矣。」"),t("shi","reason","思者，自得之道，何必尽从人言？","夫子曰：「吾与回言终日，不违如愚。」"),t("yi","evade","学与思，皆所以为道，不必分先后。","夫子曰：「赐也，非尔所及也。」"))],null,{success:"孔子曰：「君可与共学，可与适道矣。」此后你有疑难，皆可来问。",compromise:"孔子为你讲论半日，你记下了数条。",fail:"孔子曰：「吾语女：其为人也，学道不厌。」遂不再言。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Iu={theme:"无为",intro:"老子修道德，其学以自隐无名为务。",debates:[f("v_laozi_wuwei","无为","court","ming",!1,"老子","周之守藏室史","你问老子：「治国者，当有所为乎？」老子曰：「道常无为而无不为。」",[r("为者败之，执者失之。君欲为，其可乎？",t("ming","hit","为而不恃，功成而不居。为之以无为，则无败。","老子颔首：「几于道矣。」"),t("li","reason","不为则事废。国家不可一日无所事。","老子曰：「治大国若烹小鲜。」"),t("shi","evade","为与不为，皆听其自然可也。","老子曰：「莫知其极，可以有国。」")),r("民之饥，以其上食税之多。君若居上位，税之乎？",t("yi","hit","民食过多则饥。损之又损，以至于无为。","老子曰：「此圣人之言也。」"),t("li","reason","无税则国无所养。宜轻，不宜废。","老子曰：「民之难治，以其上之有为。」"),t("ming","evade","税之轻重，皆非道也。","老子曰：「绝圣弃智，民利百倍。」")),r("柔弱胜刚强。君以为，治国者当柔弱乎？",t("ming","hit","天下莫柔弱于水，而攻坚强者莫之能胜。","老子曰：「上善若水。」"),t("shi","reason","柔以守之，刚以断之，二者不可偏废。","老子曰：「是以兵强则灭，木强则折。」"),t("li","evade","柔弱之名，适为敌国所轻。","老子曰：「大巧若拙。」"))],k("守藏室竹简",1,"你呈上守藏室的旧简：往昔之政，以简驭繁者多，以烦致乱者亦多。"),{success:"老子曰：「君可与言道矣。」遂出《道德》二篇示你。",compromise:"老子曰：「君之言，得其一端。」",fail:"老子闭目不言，久之曰：「道不同，不相为谋。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-1,rel:-3}}),f("v_laozi_fan","反者道之动","court","ming",!1,"老子","周之守藏室史","你问老子：「天下之势，盛极而衰，可有以救之？」",[r("反者道之动，弱者道之用。君将何以用之？",t("ming","hit","于盛时思衰，于治时思乱。持而盈之，不如其已。","老子曰：「揣而锐之，不可长保。」"),t("li","reason","盛时宜进取，衰时方思退。此人之常情。","老子曰：「功成名遂身退，天之道。」"),t("shi","evade","盛衰有数，非人力所能移。","老子曰：「天地尚不能久，而况于人乎？」")),r("功成名遂身退，天之道。君能退乎？",t("ming","hit","退非避也。功成而不居，则名不去。","老子曰：「生而不有，为而不恃，长而不宰。」"),t("yi","reason","功成当继其业，退则前功尽弃。","老子曰：「金玉满堂，莫之能守。」"),t("li","evade","退者，为身谋也，非为天下。","老子曰：「贵以身为天下，若可寄天下。」")),r("上士闻道，勤而行之；中士闻道，若存若亡。君居何等？",t("ming","hit","臣不敢自居上士，然愿勤而行之。","老子笑曰：「下士闻道，大笑之。不笑，不足以为道。」"),t("shi","reason","道者难知，中士之守，亦足自全。","老子曰：「明道若昧，进道若退。」"),t("li","evade","道既难知，不如守其器、行其事。","老子曰：「朴散则为器，圣人用之则为官长。」"))],null,{success:"老子曰：「君可与言道之反矣。」遂为你言盛衰往复之数。",compromise:"老子曰：「君姑记之，他日自悟。」",fail:"老子曰：「知者不言，言者不知。」遂不复语。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_laozi_zhi","知与不知","court","ming",!1,"老子","周之守藏室史","你向老子请教：「治国者当博闻强识，抑或守拙而已？」",[r("知者不言，言者不知。君既来问，是有知乎？抑无知乎？",t("ming","hit","臣来问，正为不知。知之为知之，不知为不知，是知也。","老子曰：「善。此可与言矣。」"),t("li","reason","不言则下情不上达，非治世之道。","老子曰：「多言数穷，不如守中。」"),t("shi","evade","知与不知，皆不必较。行之而已。","老子曰：「为学日益，为道日损。」")),r("不出户，知天下；不窥牖，见天道。其可乎？",t("ming","hit","其出弥远，其知弥少。臣尝走遍诸国，反不如静坐一日。","老子曰：「不行而知，不见而名。」"),t("shi","reason","不历其事，何以知其难易？","老子曰：「其出弥远，其知弥少。」"),t("li","evade","欲知天下，当广遣间谍，岂能闭户？","老子曰：「以智治国，国之贼。」")),r("绝圣弃智，民利百倍。君若用之，天下可治乎？",t("ming","hit","圣智之名既立，则争名者众。弃之，则民返其朴。","老子曰：「见素抱朴，少私寡欲。」"),t("yi","reason","民不知则易愚，愚则易乱。教之乃可安。","老子曰：「古之善为道者，非以明民，将以愚之。」"),t("li","evade","弃智之政，适为强邻所乘。","老子曰：「以其不争，故天下莫能与之争。」"))],null,{success:"老子曰：「君可与论道之本矣。」为你言「为学日益，为道日损」之旨。",compromise:"老子曰：「君且思之。」遂不再言。",fail:"老子曰：「知者不言。」闭目端坐，竟日不语。"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Nu={theme:"兼爱非攻",intro:"墨者以裘褐为衣，以跂为服，日夜不休，以自苦为极。",debates:[f("v_mozi_jianai","兼爱","court","yi",!0,"墨子","墨家巨子","你问墨子：「天下大乱，其故安在？」墨子曰：「起不相爱。」",[r("天下之人皆不相爱，强者劫弱，众者暴寡。君以为，治之当自何始？",t("yi","hit","兼相爱则治，交相恶则乱。使人视人之国若其国，视人之家若其家。","墨子喜曰：「善哉！此吾所谓兼爱也。」"),t("li","reason","先明赏罚，使不爱人者有所畏，则爱可渐致。","墨子曰：「刑罚不足以移风。」"),t("shi","evade","亲疏有别，爱有差等，此天理也。","墨子曰：「此儒者之说，吾所不取。」")),r("吾闻为政者必先立威。君以为然乎？",t("yi","hit","威者，末也。上不能兼爱下，则威虽立而不久。","墨子曰：「上之为政，得下之情则治。」"),t("shi","reason","不威则令不行，令不行则乱。","墨子曰：「天下之所以乱者，生于无政长。」"),t("ming","evade","威与爱并行，何须偏废？","墨子曰：「兼者，圣王之道也。」")),r("若天下人人兼爱，则君上与匹夫同等，岂非乱之始乎？",t("yi","hit","兼爱非等贵贱，乃使人不以其位而相害。","墨子曰：「天下兼相爱则治，交相恶则乱。」"),t("li","reason","上下既无等，则政无所施。","墨子曰：「官无常贵，民无终贱。」"),t("shi","evade","兼爱之论，迂阔难行。","墨子曰：「今天下之所同义者，圣王之法也。」"))],k("宋国守御图",1,"你呈上宋城的守御图：城小而守法备，墨者所教也。"),{success:"墨子曰：「君可与言兼爱矣。」遂授你《墨子》数篇。",compromise:"墨子曰：「君之言半得之。」与你论至夜半。",fail:"墨子拂衣而起：「子之言，天下之害也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_mozi_feigong","非攻","military","yi",!1,"墨子","墨家巨子","楚将攻宋。墨子裂裳裹足，十日十夜至郢，劝公输般收兵。",[r("杀一人谓之不义，今攻一国而杀众，人皆称之曰义。君以为，此何故？",t("yi","hit","以小为非，以大为是，此名实之乱也。","墨子曰：「是以知天下之君子，辨义与不义之乱也。」"),t("li","reason","攻国者，为国利也，与杀一人不同。","墨子曰：「苟亏人愈多，其不仁兹甚，罪益厚。」"),t("shi","evade","兵者国之大事，不可以小义绳之。","墨子曰：「今至大为不义攻国，则弗知非。」")),r("今有强国攻小国，小国不能守，君将救之乎？",t("yi","hit","救之，非为小国，为天下之利也。","墨子曰：「禹之征有苗，非以求名。」"),t("li","reason","救小国而结怨强邻，非国之利。","墨子曰：「杀所不足，而争所有余，非仁也。」"),t("ming","evade","两国之争，我何必与焉？","墨子曰：「今有人于此，少见黑曰黑，多见黑曰白。」")),r("公输般为楚造云梯，九攻而君九距之。今其械尽，君之城备。楚王当如何？",t("yi","hit","吾知子之所以距我，我亦知子之所以距我。然臣之弟子禽滑厘等三百人，已持臣守圉之器，在宋城上而待楚寇矣。","墨子言毕，楚王曰：「善哉！吾请无攻宋矣。」"),t("li","reason","器械虽尽，楚甲犹众，宋终不可恃。","墨子曰：「杀臣，宋莫能守，乃可攻也。」"),t("shi","evade","守御之术，可以一当十乎？","墨子曰：「楚王曰：善哉！吾请无攻宋矣。」"))],k("守圉器图",1,"你呈上守城器械图：转射机、连弩车，墨者所造。"),{success:"墨子虽缁衣而笑：「君可与言非攻矣。」",compromise:"墨子曰：「君意未尽合，然肯听言，亦可取。」",fail:"墨子曰：「君之说，便于攻者，非吾徒也。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_mozi_jieyong","节用","domestic","yi",!1,"墨子","墨家巨子","鲁国大造宫室，工匠万人。你与墨子同观，墨子蹙然不悦。",[r("宫室之法：其旁可以圉风寒，上可以御雪霜，中可以为男女之别。君以为过乎？",t("yi","hit","足以为此则止。不加费，不劳民。","墨子曰：「此圣王之道也。」"),t("li","reason","天子之室，当有威仪，以示天下。","墨子曰：「圣王为宫室，足以为之，不加费。」"),t("ming","evade","宫室之制，皆先王成法，何可轻议？","墨子曰：「今之为宫室，必厚作敛于百姓。」")),r("国家之富，当以何为务？",t("yi","hit","去无用之费。无用之费去，则有用于民者厚矣。","墨子曰：「凡足以奉给民用，则止。」"),t("li","reason","厚积府库，以备凶荒。","墨子曰：「府库实而不用，何益于民？」"),t("shi","evade","富国在通商，不在节用。","墨子曰：「今为衣服，冬则轻暖，夏则轻凊，皆已具矣。」")),r("人皆谓墨者自苦太过，不可为天下法。君以为然乎？",t("yi","hit","自苦者为天下之利也。若人皆自苦而利天下，则天下治矣。","墨子曰：「虽不耕而食者众，而吾何辞焉。」"),t("li","reason","人伦之乐不可废。自苦之说，反于人情。","墨子曰：「士虽有学，而行为本焉。」"),t("ming","evade","苦乐各从其志，不必强人。","墨子曰：「嘿则思，言则诲，动则事。」"))],null,{success:"墨子喜曰：「君能节用，天下幸甚。」",compromise:"墨子曰：「君言可采者半。」",fail:"墨子怅然：「君未之思也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ru={theme:"节俭而多智",intro:"晏婴长不满六尺，而相齐三世，以节俭力行重于齐。",debates:[f("v_yanying_ju","橘逾淮为枳","diplomacy","ming",!1,"晏婴","齐之正卿","你奉命使楚。楚王设宴，缚一人过庭，曰：「齐人善盗乎？」晏婴在座。",[r("齐人固善盗乎？",t("ming","hit","婴闻之，橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。今民生长于齐不盗，入楚则盗，得无楚之水土使民善盗耶？","楚王笑曰：「圣人非所与熙也，寡人反取病焉。」"),t("yi","reason","齐人之盗者，自有其罪。此一人之行，非齐国之风。","楚王曰：「然。是寡人之过也。」"),t("li","evade","齐楚之好，不宜以一人之罪相疑。","楚王沉吟：「子之言，近于避。」")),r("楚与齐交恶，使者何颜立于此？",t("ming","hit","使于四方，不辱君命，臣之职也。若楚不容，臣不敢辞。","楚王曰：「善。」遂礼而归之。"),t("yi","reason","两国交兵，不斩来使。此古之通义。","楚王曰：「子可谓知礼。」"),t("shi","evade","楚强而齐弱，祸福未可知。","楚王曰：「子之慎也。」")),r("天下将合纵以抗强秦，齐当何从？",t("li","hit","合纵则信难久，连横则势易孤。齐宜守境而观衅。","晏婴曰：「子之算，可为齐谋矣。」"),t("ming","hit","不以信结，则纵散；不以利合，则横薄。齐宜先信后利。","晏婴曰：「此三王之道也。」"),t("shi","evade","齐之事，齐君自决，使者不必越俎。","晏婴曰：「子之守分，亦佳。」"))],k("楚庭席次图",1,"你取出楚庭席次图：楚王欲以小门纳使，示轻齐也。"),{success:"晏婴后与人曰：「此使可交。」齐楚之好遂成。",compromise:"晏婴曰：「子之辞亦有取。」",fail:"晏婴摇头：「子失辞矣。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yanying_tao","二桃杀三士","court","li",!0,"晏婴","齐之正卿","公孙接、田开疆、古冶子三人，以勇力闻，而无礼于君。晏婴过而趋，三人不起。",[r("三士无礼于君，君以为当诛乎？",t("li","hit","勇而无礼者，国之患也。不诛则群臣效之。","晏婴曰：「此吾所虑也。」"),t("yi","reason","三士有功于齐，不可以无礼杀之。","晏婴曰：「有勇而无义，终必为乱。」"),t("shi","evade","待其后自败可也，何必自君手？","晏婴曰：「养乱而俟其成，非谋也。」")),r("若诛之，恐失人心。君有何策？",t("li","hit","以两桃赐三人，令其自论功而食。争则必乱，让则必死。","晏婴曰：「此吾所以为此也。」"),t("ming","hit","当众责其失礼，使自知耻。耻则自退，不烦刀刃。","晏婴曰：「使士知耻，胜于杀之。然彼不知耻也。」"),t("yi","evade","以力制之，明正其罪，何虑人心？","晏婴曰：「杀有功者，齐人将非之。」")),r("三人既死，齐失三勇。君不惧乎？",t("li","hit","失三勇，得众心。勇者可求，而无礼之勇不可用。","晏婴曰：「国之所贵，不在勇力。」"),t("yi","reason","三士死而国无将，邻国必有窥伺之心。","晏婴曰：「齐之将，不患无人。」"),t("shi","evade","死者已矣，无需再论。","晏婴曰：「不然。谋始者不可不虑其终。」"))],null,{success:"晏婴曰：「子之谋，可与共国矣。」后荐你于齐侯。",compromise:"晏婴曰：「子之见，尚浅。」",fail:"晏婴叹曰：「子之不忍，且不足谋也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_yanying_jian","谏君","court","yi",!1,"晏婴","齐之正卿","齐景公饮酒七日不罢，晏婴入见，不拜而坐。",[r("君不拜而谏，可乎？",t("yi","hit","臣之所以不拜者，君废朝七日，臣无以拜也。","晏婴曰：「子知礼之变矣。」"),t("li","reason","朝廷之礼不可废。先拜而后谏，方为得体。","晏婴曰：「然。然礼有从权者。」"),t("shi","evade","礼者小节，救君之失为大。","晏婴曰：「不然。无礼则上下乱。」")),r("君耽于酒，臣屡谏而不听。当何以处之？",t("yi","hit","君有过则谏，不听则去。臣不去者，为一国之民也。","晏婴曰：「此吾之所以不去也。」"),t("li","reason","顺其所好，徐导之后，可渐入佳境。","晏婴曰：「顺君之欲，非忠也。」"),t("ming","evade","君之失，非臣所能正。听其自悟可也。","晏婴曰：「见义不为，无勇也。」")),r("臣之事君，忠与智孰重？",t("yi","hit","无智之忠，适足以陷君。智者，所以行其忠也。","晏婴曰：「善哉！此可与言事君矣。」"),t("li","reason","忠者本也。智为忠用，不可倒置。","晏婴曰：「君以为本，吾以为末。」"),t("shi","evade","二者不可兼得，则舍智而取忠。","晏婴曰：「有忠而无智，是匹夫之谅也。」"))],null,{success:"晏婴起而拜：「子可谓知臣道矣。」",compromise:"晏婴曰：「子之言，得半。」",fail:"晏婴曰：「子未可与言谏。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Lu={theme:"富国之道",intro:"管仲相齐，通货积财，富国强兵，与俗同好恶。",debates:[f("v_guanzhong_canglin","仓廪实而知礼节","domestic","li",!0,"管仲","齐之相","你问管仲治国之序。仲曰：「仓廪实而知礼节，衣食足而知荣辱。」",[r("民贫而教之以礼，可乎？",t("li","hit","不可。腹不饱者不知礼，身不暖者不恤辱。先足其食，礼自可兴。","管仲曰：「上服度则六亲固。」"),t("yi","reason","礼者，人之所自守。贫而有礼者，自古有之。","管仲曰：「故其称曰：仓廪实而知礼节。」"),t("ming","evade","贫富与礼义，各不相干。","管仲曰：「四维不张，国乃灭亡。」")),r("欲富国，当以何为先？",t("li","hit","先通货积财。轻重之权操于上，则府库实而民不困。","管仲曰：「善哉！此其所长也。」"),t("yi","reason","薄赋敛，宽徭役，使民自富，国自足。","管仲曰：「省刑罚，薄税敛，则民富。」"),t("shi","evade","富国在广地。取他国之利，胜于自谋。","管仲曰：「战而胜，则国危。」")),r("四民分业而居，士农工商各安其处。君以为何如？",t("li","hit","各安其业则艺精。士之子常为士，工之子常为工，则事无废堕。","管仲曰：「此吾之法也。」"),t("yi","reason","人之才不同，强分其业，则才有所屈。","管仲曰：「仓廪实而民知礼，四维张而国不亡。」"),t("ming","evade","民自择业，何须分处？","管仲曰：「令顺民心，则威令行。」"))],k("齐国盐铁簿",1,"你呈上齐国盐铁之簿：官山海之利，岁入倍于往昔。"),{success:"管仲曰：「可与言富国之术矣。」遂授你轻重之法。",compromise:"管仲曰：「君言亦有可取。」",fail:"管仲笑曰：「子之言，书生之见也。」"},{success:{fame:6,rel:8,money:60},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_guanzhong_zunwang","尊王攘夷","diplomacy","yi",!0,"管仲","齐之相","齐桓公会诸侯于葵丘。管仲曰：「君欲霸，必尊周室。」",[r("周室衰微，诸侯不朝。君何以尊之？",t("yi","hit","尊其名而假其令。诸侯朝齐如朝周，则齐有霸之名而无篡之实。","管仲曰：「善哉！此吾之谋也。」"),t("li","reason","以力并诸侯，何须假周室之名？","管仲曰：「以力假仁者霸，以德行仁者王。」"),t("ming","evade","周室之衰，天也。齐何与焉？","管仲曰：「夷狄豺狼，不可厌也。」")),r("戎狄侵燕，邢卫继亡。齐当救乎？",t("yi","hit","救之。攘夷者，诸侯之所共望也。救则名归齐。","管仲曰：「此霸王之举也。」"),t("li","reason","远道救燕，劳师费财，所得不偿所失。","管仲曰：「戎狄豺狼，不可厌也；诸夏亲昵，不可弃也。」"),t("ming","evade","诸国自守其境，何必齐救？","管仲曰：「宴安酖毒，不可怀也。」")),r("霸业既成，君之名位当如何？",t("li","hit","守臣节，不越分。名分一坏，则天下皆可以力取。","管仲曰：「此吾之所以戒也。」"),t("yi","reason","功高者当受上赏，虽用天子之礼亦可。","管仲曰：「名不正则言不顺。」"),t("shi","evade","名位者，虚器也，不必较。","管仲曰：「四维不张，国乃灭亡。」"))],null,{success:"管仲曰：「可与谋霸矣。」为你陈说尊王攘夷之略。",compromise:"管仲曰：「君之谋，可用其半。」",fail:"管仲曰：「君之说，徐偃王之仁也，将亡。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}}),f("v_guanzhong_penqiu","烹小鲜","court","li",!1,"管仲","齐之相","齐桓公欲易相。问管仲：「将何以治齐？」",[r("治国当频更法度乎？抑或守而勿失？",t("li","hit","法不可数变。数变则民惑，民惑则奸生。","管仲曰：「此为政之本也。」"),t("yi","reason","时移则法异。守旧法者，必困于新事。","管仲曰：「变则通，然不可骤。」"),t("ming","evade","法之存废，皆赖得人。得其人则法自善。","管仲曰：「人存政举。」")),r("若大臣专权，君当如何处之？",t("li","hit","分其权而不夺其位。权分则不能独擅，位存则不致生怨。","管仲曰：「制之有道，不在杀也。」"),t("shi","reason","专权者当诛，不诛则君权旁落。","管仲曰：「刑赏之柄，不可假人。」"),t("yi","evade","以礼待之，彼自感其恩。","管仲曰：「恩不足恃。」")),r("君好奢而民贫，君以为可乎？",t("li","hit","上之欲必有度。君敛一分，下必有十分之困。","管仲曰：「君之所好，臣必有甚焉。」"),t("yi","reason","君之威仪不可损，民之贫富自有其数。","管仲曰：「上服度则六亲固。」"),t("ming","evade","君民之间，各尽其分而已。","管仲曰：「政之所兴，在顺民心。」"))],null,{success:"管仲曰：「可与共政矣。」",compromise:"管仲曰：「子之言平。」",fail:"管仲曰：「子之谋，适足以乱国。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Hu={theme:"铸刑书与不毁乡校",intro:"子产相郑，为政以信，国人诵之。",debates:[f("v_zichan_xing","铸刑书","court","li",!0,"子产","郑之正卿","郑国铸刑书于鼎。叔向使诒子产书曰：「民知争端矣，将弃礼而征于书。」",[r("叔向谓「民知有辟，则不忌于上」。君以为如何？",t("li","hit","法既明布，则民知所避就。上不能以喜怒为轻重，此治国之要也。","子产曰：「吾以救世也。」"),t("yi","reason","礼者禁未然之前，法者施已然之后。舍礼用法，是舍本逐末。","子产曰：「若吾子之言，吾不虑矣。」"),t("shi","evade","刑书既铸，不可复收，何必多言？","子产曰：「侨不才，不能及子孙。」")),r("民知争之必以书，则讼必繁。讼繁而国乱，君惧乎？",t("li","hit","讼繁者，正以曲直有定。无书则吏得任意，其害 أكبر。","子产曰：「吾无求于下，下无求于上。」"),t("yi","reason","无讼为上。导民以礼，使不争，胜于定其争。","子产曰：「《诗》曰：『仪式刑文王之德。』」"),t("ming","evade","讼之繁简，在吏之贤否，不在刑书。","子产曰：「吾闻君子长国家者，非无贿之患。」")),r("君使臣，臣事君，以礼乎？以法乎？",t("li","hit","以法为辅，以礼为本。两者不可偏废。","子产曰：「善哉！此吾意也。」"),t("yi","reason","礼可感人，法可制人。治世当先感之。","子产曰：「求逞于人，不可。」"),t("shi","evade","上下之分明，则礼法皆可不用。","子产曰：「举不逾等，则位班也。」"))],k("刑书拓本",1,"你呈上刑书拓本：条文既明，吏无所容其奸。"),{success:"子产曰：「君知法之要矣。」后郑人诵之。",compromise:"子产曰：「君之说，可与共议。」",fail:"子产曰：「子之言，叔向之遗也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zichan_xiangxiao","不毁乡校","domestic","yi",!1,"子产","郑之正卿","郑人游于乡校，以议执政之善否。然明谓子产曰：「毁乡校，如何？」",[r("民聚而议政，君以为当毁乎？",t("yi","hit","胡为不毁？夫其所善者，吾则行之；其所恶者，吾则改之。是吾师也，若之何毁之？","子产曰：「吾闻忠善以损怨，不闻作威以防怨。」"),t("li","reason","庶人议政，则上无威，令不行。当毁之。","子产曰：「防民之口，甚于防川。」"),t("ming","evade","听之而已。议论既久，自当止歇。","子产曰：「我闻学而后入政，未闻以政学者也。」")),r("民怨既积，壅之与导之，孰优？",t("yi","hit","导之。如川之决，若壅而溃，伤人必多。吾不克救也，不如小决使道。","子产曰：「此吾所以不毁也。」"),t("li","reason","壅之则怨伏于下，发则不可制。宜早绝其源。","子产曰：「不如小决使道，不如吾闻而药之也。」"),t("shi","evade","民之怨，无关于国。听其自散可也。","子产曰：「我闻忠善以损怨。」")),r("为政以宽，抑或以猛？",t("li","hit","宽难。唯有德者能以宽服民，其次莫如猛。火烈，民望而畏之，故鲜死焉。","子产曰：「此吾所谓猛也。」"),t("yi","reason","宽则得众。民感其德，自不为非。","子产曰：「唯有德者能以宽服民。」"),t("ming","evade","宽猛随时，不必执一。","子产曰：「尽心力以事君，死生以之。」"))],null,{success:"子产曰：「可与言政矣。」留你论执政之道。",compromise:"子产曰：「君之言，有可取者。」",fail:"子产曰：「子之见，犹未及此。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zichan_xin","为政以信","court","yi",!0,"子产","郑之正卿","郑伯欲背晋盟。子产曰：「盟以信也。背之，无乃不可乎？」",[r("晋弱而楚强，背晋从楚，君以为可乎？",t("yi","hit","盟以信立。一背之，则天下无复与郑盟者。虽强邻压境，不可弃信。","子产曰：「子之言，吾言也。」"),t("li","reason","小国处两强之间，当择强者而从，信不敌势。","子产曰：「国不竞亦陵，何国之为？」"),t("ming","evade","两不相助，自守其境，信与势皆不必计。","子产曰：「凡诸侯小国，晋楚所以兵威之。」")),r("小国之存，在信抑在力？",t("yi","hit","在小在德，不在力。有信则人为之援，无信则众弃之。","子产曰：「善哉！此郑之所以存也。」"),t("li","reason","小国无信则孤，然无兵亦亡。宜并修之。","子产曰：「陈我之自入，以恃其信也。」"),t("shi","evade","小国之存亡，系于邻国之欲，非己所能。","子产曰：「小国无文德而有武功，祸莫大焉。」")),r("有民而无信，犹有国乎？",t("yi","hit","无信则民不相保，虽有城郭甲兵，不可守也。","子产曰：「信，国之宝也，民之所庇也。」"),t("li","reason","民之从君，为利也。信不足恃，利足则可。","子产曰：「信不可弃，弃信而逼，无乃不可乎？」"),t("ming","evade","信者虚名，国实为要。","子产曰：「《诗》曰：『维此文王，小心翼翼。』昭事上帝，聿怀多福。」"))],null,{success:"子产曰：「君可与守信矣。」",compromise:"子产曰：「君之言，可采其半。」",fail:"子产叹曰：「郑将无以自立矣。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Pu={theme:"兵者诡道",intro:"孙子武者，齐人也。以兵法见于吴王阖闾。",debates:[f("v_sunwu_guidao","兵者诡道","military","shi",!0,"孙武","吴之将军","吴王问：「兵者何先？」孙武曰：「兵者，诡道也。」",[r("兵者诡道也。故能而示之不能，用而示之不用。君以为然乎？",t("shi","hit","近而示之远，远而示之近。利而诱之，乱而取之。此兵家之胜，不可先传也。","孙武曰：「可与言兵矣。」"),t("yi","reason","诡道者，欺敌也。然失信于天下，终必自损。","孙武曰：「兵以诈立，以利动。」"),t("li","reason","兵贵实力。示弱于人，恐自堕其气。","孙武曰：「实而备之，强而避之。」")),r("不战而屈人之兵，与百战百胜，孰善？",t("shi","hit","不战而屈人之兵，善之善者也。百战百胜，非善之善者也。","孙武曰：「上兵伐谋，其次伐交。」"),t("li","reason","不战而胜者，敌未服也。后必复起。","孙武曰：「全国为上，破国次之。」"),t("yi","evade","战与不战，视乎义之所在，非以胜负论。","孙武曰：「主不可以怒而兴师。」")),r("知彼知己，百战不殆。若彼己皆不知，当如何？",t("shi","hit","不知彼不知己，每战必殆。故当先为不可胜，以待敌之可胜。","孙武曰：「先为不可胜，以待敌之可胜。」"),t("li","reason","既不知，则不可战。当速退以全军。","孙武曰：「小敌之坚，大敌之擒也。」"),t("ming","evade","不知则问谍。谍者，兵之要也。","孙武曰：「故明君贤将，能以上智为间者，必成大功。」"))],k("吴军阵图",1,"你呈上吴军阵图：五阵相生，奇正相倚。"),{success:"孙武曰：「君可与言兵矣。」遂以十三篇相示。",compromise:"孙武曰：「君之言，得兵之半。」",fail:"孙武曰：「君之说，纸上之兵也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_sunwu_zhong","将在外","military","shi",!1,"孙武","吴之将军","吴王欲伐楚，而朝中多异议。孙武曰：「将在军，君命有所不受。」",[r("君命与军令相左，将当从谁？",t("shi","hit","从军令。战场瞬息，君命远至则失机。","孙武曰：「将者，国之辅也。」"),t("yi","reason","将从君命。君为国之主，将不可专断。","孙武曰：「君之所以患于军者三。」"),t("li","evade","择其利者而从之。","孙武曰：「不知三军之权，而同三军之任，则军士疑矣。」")),r("久战而民疲，君欲罢兵，将不可。君以为何如？",t("shi","hit","兵贵胜，不贵久。若胜在旦夕，不宜罢；若不可胜，则应早退。","孙武曰：「夫兵久而国利者，未之有也。」"),t("yi","reason","民为邦本。民疲而战，虽胜亦危。","孙武曰：「久暴师则国用不足。」"),t("li","evade","战之利害，唯将知之。君不必问民。","孙武曰：「不尽知用兵之害者，则不能尽知用兵之利也。」")),r("吴军入郢，五战而胜。今楚人复聚，君将何以处之？",t("shi","hit","胜而后求战者，先为不可胜也。今当整军而守，不可贪进。","孙武曰：「善用兵者，修道而保法。」"),t("li","reason","乘胜逐北，可一举灭楚。","孙武曰：「穷寇勿迫，此用兵之法也。」"),t("ming","evade","既已入郢，当收其民心，兵事可缓。","孙武曰：「卒善而养之，是谓胜敌而益强。」"))],null,{success:"孙武曰：「子知兵矣。」后与子胥共谋伐楚。",compromise:"孙武曰：「君之言，可用其半。」",fail:"孙武曰：「君未知道也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_sunwu_shi","势与节","military","shi",!1,"孙武","吴之将军","吴王问：「兵之势，何以如转圆石于千仞之山？」",[r("激水之疾，至于漂石者，势也。何以造势？",t("shi","hit","势如彍弩，节如发机。蓄之既久，发之必疾。","孙武曰：「善战者，其势险，其节短。」"),t("li","reason","势者，众力所聚。多其兵则可。","孙武曰：「兵非益多也，惟无武进。」"),t("yi","evade","势者天也，非人力可造。","孙武曰：「故善战者，求之于势，不责于人。」")),r("以正合，以奇胜。奇正之变，何所底止？",t("shi","hit","奇正相生，如循环之无端，孰能穷之？","孙武曰：「此兵家之要也。」"),t("li","reason","正者常也，奇者变也。守常而待变可矣。","孙武曰：「凡战者，以正合，以奇胜。」"),t("ming","evade","奇正之术，因人而异，不可言传。","孙武曰：「人皆知我所以胜之形，而莫知吾所以制胜之形。」")),r("兵无常势，水无常形。君以何者为常？",t("shi","hit","唯变是常。能因敌变化而取胜者，谓之神。","孙武曰：「故五行无常胜，四时无常位。」"),t("yi","reason","唯义是常。兵虽诡，终不可以不义行之。","孙武曰：「兵者，国之大事，死生之地。」"),t("li","evade","唯利是常。兵之所向，在利而已。","孙武曰：「合于利而动，不合于利而止。」"))],null,{success:"孙武曰：「可与论势矣。」",compromise:"孙武曰：「君之见，未尽。」",fail:"孙武曰：「君之说，纸上谈兵。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Du={theme:"持盈定倾节事",intro:"范蠡事越王勾践，深谋二十余年，竟灭吴。",debates:[f("v_fanli_gongcheng","功成身退","diplomacy","li",!0,"范蠡","越之上将军","吴既灭，范蠡辞于勾践。或问之曰：「功成而去，何也？」",[r("功成身退，君以为智乎？",t("li","hit","飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。","范蠡曰：「此吾之所以去也。」"),t("yi","reason","君臣之义，当共始终。功成而去，非忠也。","范蠡曰：「君行令，臣行意。」"),t("ming","evade","去留皆有数，何必较智愚？","范蠡曰：「时不至，不可强生；事不究，不可强成。」")),r("若不去，果有祸乎？",t("li","hit","必有其祸。名高者危，功大者疑。","范蠡曰：「蜚鸟尽，良弓藏。」"),t("yi","reason","越王尝卧薪尝胆，必不负功臣。","范蠡曰：「越王为人长颈鸟喙。」"),t("shi","evade","祸福无门，唯人所召，何必预虑？","范蠡曰：「天道盈而不溢，盛而不骄。」")),r("文种不去，终赐剑而死。君以为其智不及君乎？",t("li","hit","非智不及，系于名。种自恃其功，不肯去耳。","范蠡曰：「种之去，不及吾早。」"),t("yi","reason","种死于忠，非愚也。忠臣不避死。","范蠡曰：「此忠臣之节，然非智也。」"),t("ming","evade","死生有命，非人所能与。","范蠡曰：「持满者与天。」"))],k("越王赐书",1,"你呈上越王赐文种之书：「子教寡人伐吴七术，寡人用其三而败吴。」"),{success:"范蠡曰：「君知进退之机矣。」遂与论治生之道。",compromise:"范蠡曰：「君之言，亦有见。」",fail:"范蠡曰：「君之说，犹恋于功名。」"},{success:{fame:6,rel:8,money:40},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_fanli_zhisheng","治生之术","trade","li",!1,"范蠡","陶朱公","范蠡浮海出齐，变姓名，自谓鸱夷子皮，耕于海畔。",[r("旱则资舟，水则资车。君以为然乎？",t("li","hit","反其道而行之。人弃我取，人取我与。此治生之要也。","范蠡曰：「善哉！可与言治生矣。」"),t("yi","reason","预为备则可。然囤积居奇，非仁者所为。","范蠡曰：「旱则资舟，水则资车，物之理也。」"),t("ming","evade","市价有常，随时而买卖，何须逆计？","范蠡曰：「贵上极则反贱，贱下极则反贵。」")),r("三致千金而三散之，君以为何如？",t("li","hit","财者，天下之公物。聚而不散，则招祸；散而不聚，则无以济人。","范蠡曰：「此吾之所以三散也。」"),t("yi","reason","散财者，义也。然当先富而后能散。","范蠡曰：「富好行其德。」"),t("ming","evade","聚散有数，不必有意为之。","范蠡曰：「知斗则修备，时用则知物。」")),r("积贮待价与周转获利，孰优？",t("li","hit","周转为上。财币欲其行如流水，积而不流则滞。","范蠡曰：「务完物，无息币。」"),t("ming","reason","积贮者，待时也。时至则利倍。","范蠡曰：「无敢居贵。」"),t("shi","evade","二者皆市道，唯视其时而择。","范蠡曰：「论其有余不足，则知贵贱。」"))],null,{success:"范蠡曰：「君可与言治生矣。」授你积贮之理。",compromise:"范蠡曰：「君之言，得半。」",fail:"范蠡笑曰：「君之算，犹未精也。」"},{success:{fame:5,rel:7,money:80},compromise:{fame:2,rel:3,money:20},fail:{fame:-1,rel:-2}}),f("v_fanli_chiyying","持盈定倾","diplomacy","li",!1,"范蠡","越之上将军","越为吴所败，栖于会稽。范蠡曰：「持满者与天，定倾者与人，节事者与地。」",[r("国家倾危，当何以定之？",t("li","hit","定倾者与人。卑辞厚礼以事之，因其所欲，然后图之。","范蠡曰：「此吾之谋也。」"),t("shi","reason","倾危之际，唯有死战。","范蠡曰：「勇者不惧，然不足以定倾。」"),t("yi","reason","以诚信感人，虽强敌亦服。","范蠡曰：「卑辞厚礼，此定倾之道也。」")),r("屈身事仇，君以为耻乎？",t("li","hit","耻在一时而存社稷，胜于快一时而亡宗庙。","范蠡曰：「此勾践之所以能复也。」"),t("yi","reason","君辱臣死。屈身事仇，非人臣所忍。","范蠡曰：「死易，处死难。」"),t("shi","evade","屈与不屈，皆亡国之道，何必择？","范蠡曰：「夫国者，成天之柄也。」")),r("吴既赦越，越当务何者为先？",t("li","hit","先富民。民富则兵强，兵强则可图。","范蠡曰：「善哉！此治国之本也。」"),t("shi","reason","先练兵。兵未强而图之，是再败也。","范蠡曰：「兵者不可先动。」"),t("yi","evade","先修德。德修而民心归，兵不待练而可用矣。","范蠡曰：「天时不作，弗为人客。」"))],null,{success:"范蠡曰：「君可与谋国矣。」",compromise:"范蠡曰：「君之言，可采。」",fail:"范蠡曰：「君未谙危亡之势。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Fu={theme:"复仇与忠谏",intro:"伍子胥父兄为楚平王所杀，奔吴，誓复其仇。",debates:[f("v_zixu_chou","复仇","military","shi",!0,"伍子胥","吴之相","你问伍子胥：「父兄之仇，不当报乎？」子胥曰：「吾日暮途远，吾故倒行而逆施之。」",[r("以臣仇君，可乎？",t("shi","hit","君杀吾父兄，是君先绝其恩。恩绝则义亦绝，何不可报？","子胥曰：「吾之仇，非君也，杀吾父者。」"),t("yi","reason","君虽无道，臣不可以仇君。此大伦也。","子胥曰：「吾不能忍，故为之。」"),t("li","evade","仇可报，当以其道，不宜借兵他国。","子胥曰：「吾借吴之力，以报吾仇。」")),r("掘墓鞭尸，君以为过乎？",t("shi","hit","不及其身，故鞭其尸。吾所求者，偿其罪耳。","子胥曰：「此吾所不及于忠者。」"),t("yi","reason","死者已矣。鞭尸者，逞其愤也，非义。","子胥曰：「吾日暮途远，故倒行而逆施之。」"),t("ming","evade","尸者无知，鞭之无益。","子胥曰：「吾不为此，无以慰死者。」")),r("若仇人已死，而仇人之后在朝，君将复仇乎？",t("shi","hit","仇不除根，必复生。当及其未大而图之。","子胥曰：「此吾所以去也。」"),t("yi","reason","祸不及嗣。仇人既死，则仇已报。","子胥曰：「君命不可违，吾不敢受。」"),t("li","evade","复仇者，当量力。不可量力，则姑置之。","子胥曰：「吾不量力，故至于此。」"))],k("楚平王墓志",1,"你呈上楚平王墓志：其父之死于谗，而平王实杀其子。"),{success:"子胥曰：「君知吾心矣。」遂与论复仇之义。",compromise:"子胥曰：「君之言，未尽吾意。」",fail:"子胥咬牙：「子非吾徒也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zixu_jian","忠谏","court","shi",!1,"伍子胥","吴之相","吴王夫差将伐齐，子胥曰：「未可。越，腹心之疾；齐，疥癣也。」",[r("越与齐，孰为吴之患？",t("shi","hit","越为腹心之疾，齐为疥癣。伐齐而越在外，必为后患。","子胥曰：「此吾所以谏也。」"),t("li","reason","齐大而富，取之可以强国。越僻小，不足虑。","子胥曰：「昔者越之战，几乎亡吴。」"),t("yi","evade","当以德服之，不在择敌。","子胥曰：「今王恃其国之大，欲以亡国之臣为谋。」")),r("忠谏而不听，君将如何？",t("shi","hit","谏而不听，则姑徐之。不可去，去则无人复谏。","子胥曰：「吾不能如蠡之去也。」"),t("li","reason","不听则去。留而无益，徒取祸耳。","子胥曰：「此范蠡之所以能存其身也。」"),t("ming","evade","谏者尽吾心，听不听在君。","子胥曰：「吾故倒行而逆施之。」")),r("君赐属镂之剑，令子自杀。子将如何？",t("shi","hit","受剑而死。死前留言：必树吾墓上以梓，令可以为器；而抉吾眼悬吴东门之上，以观越寇之入灭吴也。","子胥曰：「我死后，吴国必亡。」"),t("yi","reason","不当受剑。既知吴将亡，当去以待其时。","子胥曰：「臣不忠，不如子胥之死。」"),t("li","evade","死生有命。受与不受，皆亡也。","子胥曰：「吾生不能正君，死无以复言。」"))],null,{success:"子胥曰：「君可与言忠矣。」",compromise:"子胥曰：「君之言，有可取。」",fail:"子胥怒曰：「子欲吾负先君乎！」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}}),f("v_zixu_ben","去国","diplomacy","shi",!1,"伍子胥","吴之相","楚平王杀伍奢、伍尚。子胥出奔。过昭关，关吏欲执之。",[r("父兄就戮，君当同死，抑或出奔？",t("shi","hit","死而无益，不若出奔以图后效。吾非惜死，惜其死之无补。","子胥曰：「此吾之所以出奔也。」"),t("yi","reason","父兄死而子遁，非孝。当同死。","子胥曰：「吾死则仇无人报。」"),t("li","evade","去留皆无补，何必较？","子胥曰：「日暮途远，吾故倒行而逆施之。」")),r("借他国之兵以伐母国，君不惧为天下所非乎？",t("shi","hit","吾所求者，一人之罪。非伐楚国，除其贼耳。","子胥曰：「吾非叛国，报父兄之仇也。」"),t("yi","reason","母国不可伐。虽仇在人，楚国无罪。","子胥曰：「吾日暮途远，故倒行而逆施之。」"),t("ming","evade","是非之名，听之后世可也。","子胥曰：「吾不量力，故至于此。」")),r("昭关之吏捕君甚急。君将如何脱身？",t("shi","hit","一夜白头，易容而出。急则智生。","子胥曰：「此吾之所为也。」"),t("li","reason","以财贿吏，可脱。","子胥曰：「吾无财，唯有死耳。」"),t("yi","evade","天不绝人，自会有路。","子胥曰：「天之所助，人也。」"))],null,{success:"子胥曰：「君知吾心之难矣。」",compromise:"子胥曰：「君之言，犹隔一层。」",fail:"子胥曰：「子未见吾之痛。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Bu={theme:"辞令之利",intro:"烛之武年过七十，为郑伯夜缒而出，见秦伯。",debates:[f("v_zhuzhiwu_pei","亡郑以陪邻","diplomacy","li",!0,"烛之武","郑之大夫","秦晋围郑。烛之武夜缒而出，见秦伯曰：「秦晋围郑，郑既知亡矣。」",[r("郑亡而秦得之，君以为利乎？",t("li","hit","越国以鄙远，君知其难也。亡郑以陪邻，邻之厚，君之薄也。","秦伯曰：「然。」遂与郑盟。"),t("yi","reason","灭郑者义也。既与之盟，不可背。","烛之武曰：「夫晋，何厌之有？」"),t("shi","evade","兵已在城下，言之无益。","烛之武曰：「若亡郑而有益于君，敢以烦执事。」")),r("晋与秦素善，君结盟于郑，不惧晋乎？",t("li","hit","晋许君焦、瑕，朝济而夕设版焉。夫晋何厌之有？既东封郑，又欲肆其西封。","秦伯曰：「微夫人之力不及此。」"),t("yi","reason","晋秦之好，非一日矣。君背之，天下其谓君何？","烛之武曰：「邻之厚，君之薄也。」"),t("ming","evade","晋之志，君自知之，不必吾言。","烛之武曰：「若不阙秦，将焉取之？」")),r("郑既存，当何以事秦？",t("li","hit","郑愿为东道主，行李之往来，共其乏困。","烛之武曰：「若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。」"),t("yi","reason","郑当坚守其义，不偏事一国。","烛之武曰：「阙秦以利晋，唯君图之。」"),t("shi","evade","事秦事晋，皆非长久之计。","烛之武曰：「夫晋，何厌之有？」"))],k("秦晋围郑图",1,"你呈上围城形势图：秦军在西，晋军在北，两军不相属。"),{success:"秦伯与郑人盟，使杞子、逢孙、杨孙戍之，乃还。郑以不亡。",compromise:"秦伯沉吟：「子之言，亦有理。」",fail:"秦伯曰：「吾已与晋约矣。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhuzhiwu_ci","辞令","diplomacy","li",!1,"烛之武","郑之大夫","郑伯将盟于晋，择使于朝。或荐烛之武，武辞曰：「臣之壮也，犹不如人。」",[r("君老矣，尚能为国使乎？",t("li","hit","老而智存，何不可使？辞者，让也，非不能也。","烛之武曰：「今老矣，无能为也已。」"),t("yi","reason","老者当安其养。国之大事，付之壮者。","烛之武曰：「臣之壮也，犹不如人。」"),t("ming","evade","能与否，试之而后知。","烛之武曰：「许之。」")),r("郑伯曰「吾不能早用子，今急而求子，是寡人之过也」。君当如何答？",t("li","hit","君既知之，则不必辞。国危矣，若之何不往？","烛之武曰：「然，郑亡，子亦有不利焉。」"),t("yi","reason","君既谢过，臣当尽节。虽老不辞。","烛之武曰：「许之。」"),t("shi","evade","让之再三，以全君之体面。","烛之武曰：「夜缒而出。」")),r("说辞之要，在何？",t("li","hit","在明利害，不在争是非。敌国之人，未必听义，必听利。","烛之武曰：「善哉！此吾之所以能说秦伯也。」"),t("yi","reason","在动其心。人心一感，事自成。","烛之武曰：「若舍郑以为东道主。」"),t("shi","evade","在示其威。无威则言不听。","烛之武曰：「邻之厚，君之薄也。」"))],null,{success:"烛之武曰：「君可与言辞矣。」",compromise:"烛之武曰：「君之言，得辞之半。」",fail:"烛之武摇头：「是说不足以动人也。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zhuzhiwu_li","利与义","diplomacy","li",!1,"烛之武","郑之大夫","或谓烛之武曰：「子之说秦伯，皆言利，不言义。无乃非君子之道乎？」",[r("说人以利，可乎？",t("li","hit","小国无义可言，唯有利可恃。言之于义则迂，言之于利则动。","烛之武曰：「此小国之所以存也。」"),t("yi","reason","不可。言利则人皆趋于利，无复有义。","烛之武曰：「义者，大国之饰也。」"),t("ming","evade","利义并行，视其时而用。","烛之武曰：「君亦无所害。」")),r("郑事秦又事晋，君以为可长久乎？",t("li","hit","两属则两不亲。然小国处其间，非两属无以自存。","烛之武曰：「此郑之所以为郑也。」"),t("yi","reason","当择一而从之，忠信不二。","烛之武曰：「郑亡，子亦有不利焉。」"),t("shi","evade","事之长久，非人所能谋。","烛之武曰：「夫晋，何厌之有？」")),r("郑终为晋所并。君之谋，可谓效乎？",t("li","hit","谋者，救一时之危。郑之亡，在数世之后，非吾谋之失。","烛之武曰：「若舍郑以为东道主，君亦无所害。」"),t("yi","reason","谋而不终，无功可言。","烛之武曰：「许之。」"),t("ming","evade","国之存亡有数，非一使所能移。","烛之武曰：「夜缒而出。」"))],null,{success:"烛之武曰：「君知小国之难矣。」",compromise:"烛之武曰：「君之言，未尽。」",fail:"烛之武曰：「子犹以大国之道责小国也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Gu={theme:"逍遥与齐物",intro:"庄子钓于濮水，楚王使大夫二人往先焉。",debates:[f("v_zhuangzi_xiaoyao","逍遥","court","ming",!1,"庄周","蒙之漆园吏","楚王使二大夫往聘庄子。庄子持竿不顾，曰：「吾闻楚有神龟。」",[r("神龟死已三千岁，王巾笥而藏之庙堂之上。此龟者，宁其死为留骨而贵乎？",t("ming","hit","宁其生而曳尾于涂中。吾将曳尾于涂中。","二大夫曰：「宁生而曳尾涂中。」庄子曰：「往矣！吾将曳尾于涂中。」"),t("li","reason","死而贵，胜于生而贱。庙堂之显，人所愿也。","庄子曰：「往矣！吾将曳尾于涂中。」"),t("shi","evade","生与贵，各有所取，何必择？","庄子曰：「往矣！无以汝为也。」")),r("鹏之徙于南冥也，水击三千里。蜩与学鸠笑之。君以为孰是？",t("ming","hit","二者皆有所待。鹏待风，鸠待枝，皆非逍遥。","庄子曰：「此小大之辩也。」"),t("li","reason","鹏志在千里，鸠安于一枝，鹏是。","庄子曰：「之二虫又何知？」"),t("shi","evade","大小各适其性，无所谓是非。","庄子曰：「小知不及大知，小年不及大年。」")),r("夫子之道，天下莫能容。君不惧乎？",t("ming","hit","不容何病？不容然后见君子。且天地之大，岂独一容身之处？","庄子曰：「独不见狸狌乎？」"),t("yi","reason","道不行于世，则当自修，以待其时。","庄子曰：「小夫之知，不离苞苴竿牍。」"),t("li","evade","道不欲容，容则失其真。","庄子曰：「人皆知有用之用，而莫知无用之用也。」"))],k("濮水钓图",1,"你呈上濮水图：此处水清而鱼肥，远离朝市。"),{success:"庄子曰：「君可与言逍遥矣。」遂与游于濠梁之上。",compromise:"庄子曰：「君之言，犹有所待。」",fail:"庄子曰：「君之见，犹在瓮中。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_zhuangzi_qiwu","齐物","court","ming",!1,"庄周","蒙之漆园吏","你与庄子游于濠梁之上。庄子曰：「鯈鱼出游从容，是鱼之乐也。」",[r("子非鱼，安知鱼之乐？",t("ming","hit","子非我，安知我不知鱼之乐？","庄子曰：「请循其本。」"),t("li","reason","鱼之乐，不可知。子之言，无据。","庄子曰：「既已知吾知之而问我，我知之濠上也。」"),t("yi","evade","乐者，人自知之，不必辩。","庄子曰：「天地与我并生，而万物与我为一。」")),r("天下莫大于秋豪之末，而太山为小。君以为然乎？",t("ming","hit","以道观之，物无贵贱。大小之别，自其形也。","庄子曰：「此齐物之论也。」"),t("li","reason","泰山大于秋毫，人所共见。此说不可通。","庄子曰：「自其异者视之，肝胆楚越也。」"),t("shi","evade","大小之辩，无益于治。","庄子曰：「大辩不言。」")),r("昔者庄周梦为胡蝶，栩栩然胡蝶也。不知周之梦为胡蝶与？胡蝶之梦为周与？",t("ming","hit","此之谓物化。周与蝶，必有分矣，然其分不可得而知。","庄子曰：「此之谓物化。」"),t("yi","reason","梦醒而辨，何疑之有？周自周，蝶自蝶。","庄子曰：「不知周也。」"),t("li","evade","梦觉之事，无关于治国。","庄子曰：「且有大觉而后知此其大梦也。」"))],null,{success:"庄子曰：「君可与言齐物矣。」",compromise:"庄子曰：「君之言，犹隔一尘。」",fail:"庄子曰：「君犹以形求之。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_zhuangzi_wuyong","无用之用","court","ming",!1,"庄周","蒙之漆园吏","匠石之齐，至乎曲辕，见栎社树，其大蔽牛。匠石不顾，曰：「散木也，无所可用。」",[r("无用之木，何以得寿？",t("ming","hit","以其不材，故能若是之寿。此无用之用也。","庄子曰：「此乃神人之所以为大祥也。」"),t("li","reason","无用则见弃，见弃则不能自存。","庄子曰：「且予求无所可用久矣。」"),t("yi","evade","材与不材，皆非道也。","庄子曰：「周将处乎材与不材之间。」")),r("人皆求有用，君独言无用，何也？",t("ming","hit","有用者为人所役，无用者得全其天。","庄子曰：「人皆知有用之用，而莫知无用之用也。」"),t("li","reason","无用则无功，无功则无位。","庄子曰：「此之谓不材之木。」"),t("shi","evade","有用无用，名耳，何必较？","庄子曰：「名者，实之宾也。」")),r("处于材与不材之间，君以为如何？",t("ming","hit","未足。材与不材之间，似是而非，犹未免乎累。","庄子曰：「若夫乘道德而浮游则不然。」"),t("yi","reason","此中庸之道，可矣。","庄子曰：「其唯道德之乡乎！」"),t("li","evade","二者之间，可以自全，何必更求？","庄子曰：「周将处乎材与不材之间。」"))],null,{success:"庄子曰：「君可与言无用矣。」",compromise:"庄子曰：「君之见，犹有所执。」",fail:"庄子曰：「君犹以用求物。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Vu={theme:"义利之辨",intro:"孟子见梁惠王。王曰：「叟不远千里而来，亦将有以利吾国乎？」",debates:[f("v_mengzi_yili","义利之辨","court","yi",!0,"孟子","邹之学者","梁惠王曰：「叟不远千里而来，亦将有以利吾国乎？」孟子对曰：「王何必曰利？」",[r("王何必曰利？亦有仁义而已矣。君以为然乎？",t("yi","hit","上下交征利而国危矣。万乘之国，弑其君者，必千乘之家。","孟子曰：「王亦曰仁义而已矣，何必曰利？」"),t("li","reason","国无利则不能存。仁义者，饰也。","孟子曰：「苟为后义而先利，不夺不餍。」"),t("ming","evade","义利并行，不必偏废。","孟子曰：「未有仁而遗其亲者也。」")),r("今有强国陈兵于境，言仁义则不能退敌。君将如何？",t("yi","hit","以仁义固其民，民效死而弗去，则虽强敌不能攻。","孟子曰：「得道者多助，失道者寡助。」"),t("li","reason","兵来则兵挡。言仁义于战阵，无益。","孟子曰：「城非不高也，池非不深也，兵革非不坚利也，委而去之。」"),t("shi","evade","战与和，视其势，不必以仁义为名。","孟子曰：「天时不如地利，地利不如人和。」")),r("人皆有不忍人之心。君以为然乎？",t("yi","hit","乍见孺子将入于井，皆有怵惕恻隐之心。此非为交情，非为名誉。","孟子曰：「无恻隐之心，非人也。」"),t("li","reason","人心本私。所谓不忍，皆有所为而发。","孟子曰：「仁义礼智，非由外铄我也，我固有之也。」"),t("ming","evade","心之善恶，不必论。行之善即可。","孟子曰：「乃若其情，则可以为善矣。」"))],k("井田旧图",1,"你呈上井田旧图：八家同井，出入相友，守望相助。"),{success:"孟子曰：「善哉！此王道之始也。」遂为王陈王道。",compromise:"孟子曰：「王之言，犹未离于利。」",fail:"孟子曰：「王若曰利，则上下交征利而国危矣。」"},{success:{fame:7,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_mengzi_rensheng","舍生取义","court","yi",!1,"孟子","邹之学者","孟子曰：「生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。」",[r("生与义不可得兼，君取何者？",t("yi","hit","取义。所欲有甚于生者，故不为苟得也。","孟子曰：「此之谓失其本心。」"),t("li","reason","取生。身死则义无所附。","孟子曰：「一箪食，一豆羹，得之则生，弗得则死。」"),t("shi","evade","当视其时，不可执一。","孟子曰：「万钟则不辨礼义而受之。」")),r("行道而见逐，君以为义乎？",t("yi","hit","义在其行，不在其效。道不行，非我之罪。","孟子曰：「穷则独善其身，达则兼善天下。」"),t("li","reason","见逐则当改其道，以求行于世。","孟子曰：「枉道而从彼，何也？」"),t("ming","evade","行与不行，皆有命焉。","孟子曰：「莫非命也，顺受其正。」")),r("王馈兼金一百而不受，或馈七十镒而受。君以为何故？",t("yi","hit","有故而去者，不受；以其道来者，受之。义不在物而在其义。","孟子曰：「若于齐，则未有处也。」"),t("li","reason","金之同也，何择焉？受之可也。","孟子曰：「无处而馈之，是货之也。」"),t("shi","evade","受与不受，皆小节，不必论。","孟子曰：「可以取，可以无取，取伤廉。」"))],null,{success:"孟子曰：「君可与言义矣。」",compromise:"孟子曰：「君之言，近是而未尽。」",fail:"孟子曰：「君犹未离于利也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_mengzi_wangdao","仁政","domestic","yi",!0,"孟子","邹之学者","孟子曰：「五亩之宅，树之以桑，五十者可以衣帛矣。」",[r("欲行王政，当自何始？",t("yi","hit","先制民之产。民无恒产，则无恒心。","孟子曰：「此王道之本也。」"),t("li","reason","先立制度，明赏罚。","孟子曰：「徒法不能以自行。」"),t("shi","evade","先修兵备。无兵则虽有善政，不能守。","孟子曰：「制梃以挞秦楚之坚甲利兵矣。」")),r("民有恒产则治，无恒产则乱。君以为然乎？",t("yi","hit","无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。","孟子曰：「此吾之所谓也。」"),t("li","reason","民之乱，非尽由贫。教之亦可安。","孟子曰：「谨庠序之教，申之以孝悌之义。」"),t("ming","evade","治乱有数，非人力所能尽。","孟子曰：「七十者衣帛食肉，黎民不饥不寒。」")),r("王道之成，当何以验之？",t("yi","hit","老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。","孟子曰：「善哉！此吾所谓王也。」"),t("li","reason","府库充盈，兵甲坚利，则王道成矣。","孟子曰：「然而不王者，未之有也。」"),t("shi","evade","验之何益？行之而已。","孟子曰：「王如善之，则何为不行？」"))],null,{success:"孟子曰：「君可与行王政矣。」",compromise:"孟子曰：「君之言，有可取者。」",fail:"孟子曰：「君之志，在霸不在王。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Yu={theme:"性恶与礼法",intro:"荀卿三为稷下祭酒，倡「人之性恶，其善者伪也」。",debates:[f("v_xunzi_xing_e","性恶","court","li",!0,"荀子","稷下祭酒","荀子曰：「人之性恶，其善者伪也。」",[r("人之性恶乎？善乎？",t("li","hit","性恶。目好色，耳好声，口好味，心好利，皆生于情。必待师法而后正。","荀子曰：「此吾所谓性恶也。」"),t("yi","reason","性本善。恻隐之心，人皆有之。","荀子曰：「然则人之性恶明矣，其善者伪也。」"),t("ming","evade","性之善恶，不必论。教之可使为善。","荀子曰：「人之性恶，必将待师法然后正。」")),r("既言性恶，则礼义从何而生？",t("li","hit","生于圣人之伪。圣人化性而起伪，故立礼义以正之。","荀子曰：「此礼之所由起也。」"),t("yi","reason","礼义本于心，非外铄也。","荀子曰：「凡礼义者，是生于圣人之伪。」"),t("shi","evade","礼义者，先王之成法，遵之可也。","荀子曰：「故必将有师法之化、礼义之道。」")),r("性恶之说，天下必非之。君不惧乎？",t("li","hit","不惧。吾言其理，非言其情。知其恶，方能化之。","荀子曰：「善言古者必有节于今。」"),t("yi","reason","纵言理实，然伤人心。不可不惧。","荀子曰：「赠人以言，重于金石珠玉。」"),t("ming","evade","是非听之后世，何必争于一时？","荀子曰：「不诱于誉，不恐于诽。」"))],k("劝学篇简",1,"你呈上劝学竹简：「学不可以已。」"),{success:"荀子曰：「君可与言性矣。」",compromise:"荀子曰：「君之说，半得之。」",fail:"荀子曰：「君犹惑于孟子之说。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_xunzi_tian","天人之分","domestic","li",!1,"荀子","稷下祭酒","星坠木鸣，国人皆恐。荀子曰：「是天地之变，阴阳之化，物之罕至者也。」",[r("天变可畏乎？",t("li","hit","怪之可也，畏之非也。天行有常，不为尧存，不为桀亡。","荀子曰：「此吾所谓明于天人之分也。」"),t("yi","reason","天变即天示。人君当修德以应之。","荀子曰：「日月食而救之，天旱而雩，卜筮然后决大事。」"),t("ming","evade","天变之事，不可知。不必论其可畏与否。","荀子曰：「唯圣人为不求知天。」")),r("人当听命于天，抑或制天命而用之？",t("li","hit","制天命而用之。天有其时，地有其财，人有其治，夫是之谓能参。","荀子曰：「善哉！此吾之学也。」"),t("yi","reason","人当顺天。逆天者必败。","荀子曰：「应之以治则吉，应之以乱则凶。」"),t("shi","evade","天人各行其道，不必相与。","荀子曰：「明于天人之分，则可谓至人矣。」")),r("祭祀之礼，既不信鬼神，何以为之？",t("li","hit","君子以为文，百姓以为神。文以致敬，非以求福。","荀子曰：「此礼之大凡也。」"),t("yi","reason","祭祀者，人心所寄，不可废也。","荀子曰：「其在君子，以为人道也。」"),t("ming","evade","既不信，则废之可也。","荀子曰：「其在百姓，以为鬼事也。」"))],null,{success:"荀子曰：「君可与言天人之分矣。」",compromise:"荀子曰：「君之言，近道而未达。」",fail:"荀子曰：「君犹蔽于天也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_xunzi_li","隆礼重法","court","li",!0,"荀子","稷下祭酒","荀子曰：「隆礼至法则国有常，尚贤使能则民知方。」",[r("治国礼先乎？法先乎？",t("li","hit","礼者，法之大分，类之纲纪。无礼则法无所依。","荀子曰：「此吾礼法之说也。」"),t("yi","reason","法明则民知所避，礼则缓而不切。","荀子曰：「法而不能，则职废。」"),t("shi","evade","二者相须，不必分先后。","荀子曰：「隆礼至法，而尚有奸邪者，有矣。」")),r("涂之人可以为禹，君以为然乎？",t("li","hit","然。涂之人有可以知之质、可以能之具，惟待师法之教。","荀子曰：「此吾所谓『可以为』也。」"),t("yi","reason","人分上下智愚，涂人岂能为圣？","荀子曰：「涂之人可以为禹，曷谓也？」"),t("ming","evade","可为不可为，在人自勉，何须定论？","荀子曰：「君子生非异也，善假于物也。」")),r("君与师，孰重？",t("li","hit","国将兴，必贵师而重傅。师者，人之模范也。","荀子曰：「此吾之所以重师也。」"),t("yi","reason","君为一国之主，师不过一人。","荀子曰：「君师者，治之本也。」"),t("shi","evade","二者各有其分，不可相较。","荀子曰：「言而不称师谓之畔。」"))],null,{success:"荀子曰：「君可与共治矣。」",compromise:"荀子曰：「君之见，得半。」",fail:"荀子曰：「君之说，未及于礼。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Uu={theme:"法术势",intro:"韩非疾治国不务修明其法制，故作《孤愤》《五蠹》。",debates:[f("v_hanfei_fa","法术势","court","li",!0,"韩非","韩之公子","韩非曰：「法者，编著之图籍，设之于官府而布之于百姓者也。」",[r("治国以法为主，君以为然乎？",t("li","hit","法明则内无怨女，外无旷夫；法不明则奸臣窃柄。","韩非曰：「此吾法之要也。」"),t("yi","reason","徒法不能自足。人主治国，当以德感之。","韩非曰：「释法术而心治，尧不能正一国。」"),t("shi","evade","法与德并行，何须偏执？","韩非曰：「不务修明其法制，执势以御其臣下。」")),r("术之于法，孰为要？",t("li","hit","法者明也，术者幽也。法以布之于众，术以御之于内。二者不可偏废。","韩非曰：「君无术则弊于上，臣无法则乱于下。」"),t("yi","reason","法布之众，人所共见，君不必以术。","韩非曰：「术者，藏之于胸中，以偶众端而潜御群臣者也。」"),t("ming","evade","势足矣。有势则法自行。","韩非曰：「抱法处势则治。」")),r("臣主之间，何以立势？",t("li","hit","权势不可以假人。去其私党，绝其私请，则势自在我。","韩非曰：「此吾所谓势也。」"),t("yi","reason","信臣如信己，何须防之？","韩非曰：「人主之患在于信人，信人则制于人。」"),t("shi","evade","势之存否，在国之大；不在术之得失。","韩非曰：「千钧得船则浮，锱铢失船则沉。」"))],k("孤愤篇简",1,"你呈上《孤愤》竹简：智术之士，必远见而明察，不明察不能烛私。"),{success:"韩非曰：「君可与言法矣。」",compromise:"韩非曰：「君之言，未尽其术。」",fail:"韩非曰：「君之说，儒者之饰也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_hanfei_wudu","五蠹","domestic","li",!1,"韩非","韩之公子","韩非曰：「儒以文乱法，侠以武犯禁。」",[r("儒与侠，国之蠹乎？",t("li","hit","皆蠹也。儒以文乱法，侠以武犯禁，而人主兼礼之，此所以乱也。","韩非曰：「此五蠹之首也。」"),t("yi","reason","儒侠皆贤者，何蠹之有？","韩非曰：「行货赂而袭当涂者则求得。」"),t("ming","evade","蠹与否，视其行，不可一概而论。","韩非曰：「不期修古，不法常可。」")),r("世异则事异，事异则备变。君以为然乎？",t("li","hit","守株待兔者，非愚也，乃不知变也。今欲以先王之政，治当世之民，皆守株之类也。","韩非曰：「此吾所谓不期修古。」"),t("yi","reason","先王之道，万世不易。何可轻变？","韩非曰：「世易时移，变法宜矣。」"),t("shi","evade","变与不变，视势而定。","韩非曰：「事异则备变。」")),r("人主之患，在信人乎？",t("li","hit","在信人。信人则制于人。信人者，必有以验之。","韩非曰：「此人主之患也。」"),t("yi","reason","不信臣下，则无人可用。","韩非曰：「人主之于人也，或疑之，或信之。」"),t("ming","evade","信与不信，在人之贤否。","韩非曰：「不贤而为贤者所欺，乱之始也。」"))],null,{success:"韩非曰：「君可与言治矣。」",compromise:"韩非曰：「君之言，可采者半。」",fail:"韩非曰：「君之说，五蠹之属也。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_hanfei_maodun","自相矛盾","court","li",!1,"韩非","韩之公子","楚人有鬻盾与矛者，誉之曰：「吾盾之坚，物莫能陷也。」",[r("以子之矛陷子之盾，何如？",t("li","hit","其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。","韩非曰：「此吾所谓矛盾之说也。」"),t("yi","reason","此戏言耳，何关于治？","韩非曰：「今尧舜之不可两誉，矛盾之说也。」"),t("ming","evade","一物之誉，不必深究。","韩非曰：「誉所不能立，此言之患也。」")),r("今有言「贤者不必用，用者不必贤」。君以为何如？",t("li","hit","此亦矛盾也。既用其贤，则不当复疑其不贤。","韩非曰：「今两誉而并立，此矛盾之说也。」"),t("yi","reason","贤与用，本非一事。用者量才，贤者修己。","韩非曰：「使天下必待贤而后治，则贤者不足。」"),t("shi","evade","言之得失，不必尽辩。","韩非曰：「不期修古，不法常可。」")),r("法术之士，何以往往不见容于时君？",t("li","hit","法术之臣，必危其主之私。人主欲私，故恶法。","韩非曰：「此《孤愤》之所由作也。」"),t("yi","reason","法术严酷，失民之心，故不见容。","韩非曰：「不仁哉，人主之信人也。」"),t("ming","evade","时运不济，非术之过。","韩非曰：「术士之所以危也。」"))],null,{success:"韩非曰：「君可与言辩矣。」",compromise:"韩非曰：「君之言，未抵于理。」",fail:"韩非曰：「君之说，自相矛盾而不觉。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ku={theme:"纵横与货殖",intro:"子贡一出，存鲁、乱齐、破吴、强晋而霸越。",debates:[f("v_zigong_cunlu","存鲁","diplomacy","ming",!0,"子贡","孔门言语","齐将伐鲁。孔子曰：「夫鲁，坟墓所处，父母之国。」子贡请行。",[r("齐伐鲁，鲁弱不能支。君何以救之？",t("ming","hit","不救鲁而救鲁。说齐移兵伐吴，则鲁自安。","子贡曰：「此吾之所以行也。」"),t("yi","reason","当合诸侯以救鲁，明大义于天下。","子贡曰：「合诸侯者，势散而难成。」"),t("li","reason","不如事齐以求存。","子贡曰：「事齐则鲁亡矣。」")),r("说齐伐吴，是以邻为壑。君不惧为天下所非乎？",t("ming","hit","存鲁者，吾志也。齐吴之祸，非吾所致，彼自好战耳。","子贡曰：「此吾术也。」"),t("yi","reason","嫁祸于人，非君子所为。","子贡曰：「赐也何敢望回，然事有不得已。」"),t("shi","evade","是非之名，听之后世。","子贡曰：「善为之辞，则天下从之。」")),r("鲁既存，齐吴晋越皆动。君之计，其利安在？",t("ming","hit","一举而四国动，鲁存而赐之名成。此所谓一使之力也。","子贡曰：「此吾所以为言语之科也。」"),t("li","reason","徒存一鲁而乱四国，所得不偿所失。","子贡曰：「存鲁者，吾师之志也。」"),t("yi","evade","事之成败，非所逆睹。","子贡曰：「赐也，始可与言《诗》已矣。」"))],k("四国使节录",1,"你呈上四国使节往来之录：齐吴晋越，皆已动。"),{success:"子贡曰：「君可与言纵横矣。」",compromise:"子贡曰：「君之谋，得半。」",fail:"子贡曰：「君之说，不足以动四国。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_zigong_huozhi","货殖","trade","li",!1,"子贡","孔门言语","子贡既学于仲尼，退而仕于卫，废著鬻财于曹鲁之间。",[r("君子固穷，子何为好货殖？",t("li","hit","赐不受命，而货殖焉，亿则屡中。富而无骄，何损于德？","子贡曰：「此吾之所以异于颜回也。」"),t("yi","reason","学者当以道为重，货殖非所宜。","子贡曰：「富而好礼，亦圣人所许。」"),t("ming","evade","富与道，各不相碍。","子贡曰：「贫而无谄，富而无骄，何如？」")),r("亿则屡中，君何以能之？",t("li","hit","观时之盈虚，察人之所需。贵出如粪土，贱取如珠玉。","子贡曰：「此吾之所以屡中也。」"),t("ming","reason","时运耳，非人力也。","子贡曰：「赐也何敢望回。」"),t("shi","evade","市道之术，言不可尽。","子贡曰：「《诗》云：如切如磋，如琢如磨。」")),r("富而无骄，与贫而无谄，孰优？",t("yi","hit","二者皆未若贫而乐、富而好礼。","子贡曰：「《诗》云：如切如磋，如琢如磨。其斯之谓与？」"),t("li","reason","无骄无谄，已是难得。何必更进一步？","子曰：「赐也，始可与言《诗》已矣。」"),t("ming","evade","贫富之境不同，各安其分可也。","子贡曰：「富而好礼者也。」"))],null,{success:"子贡曰：「君可与言货殖矣。」",compromise:"子贡曰：「君之算，犹有未尽。」",fail:"子贡曰：「君之说，非治生之道。」"},{success:{fame:5,rel:7,money:100},compromise:{fame:2,rel:3,money:30},fail:{fame:-1,rel:-2}}),f("v_zigong_yanyu","言语之科","court","ming",!1,"子贡","孔门言语","孔子曰：「言语：宰我、子贡。」",[r("言语之要，在何？",t("ming","hit","在知其心。对方所欲，先与之；所惧，先解之。","子贡曰：「此吾之所以为使也。」"),t("li","reason","在明其利。利之所在，人自听之。","子贡曰：「赐也，始可与言《诗》已矣。」"),t("yi","reason","在守其义。义正，则辞自壮。","子贡曰：「君子一言以为知，一言以为不知。」")),r("巧言令色，圣人所耻。言语之科，岂非巧言？",t("ming","hit","巧言者，无其实而饰其辞。言语者，有其实而善其辞。二者殊途。","子贡曰：「此吾所谓言语也。」"),t("yi","reason","然终近于巧。不如讷于言而敏于行。","子贡曰：「君子欲讷于言而敏于行。」"),t("shi","evade","言辞之间，难以尽辨。","子贡曰：「不患人之不己知，患不知人也。」")),r("夫子之道，可得而闻乎？",t("yi","hit","夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。","子贡曰：「此吾之所以无言也。」"),t("ming","reason","道在日用之间，何必求之高远？","子贡曰：「夫子之墙数仞。」"),t("li","evade","道不可言，言则非道。","子贡曰：「不得其门而入，不见宗庙之美。」"))],null,{success:"子贡曰：「君可与言言语矣。」",compromise:"子贡曰：「君之言，可采。」",fail:"子贡曰：「君之辞，未得要领。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Qu={theme:"安贫乐道",intro:"颜回年二十九，发尽白，蚤死。孔子哭之恸。",debates:[f("v_yanhui_le","安贫乐道","court","yi",!1,"颜回","孔门之首","子曰：「贤哉回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。」",[r("人不堪其忧，回也不改其乐。其乐何在？",t("yi","hit","乐在道，不在物。得道则虽贫亦乐，失道则虽富亦忧。","颜回曰：「此回之所谓乐也。」"),t("li","reason","贫而乐者，强颜耳。人孰不欲富？","颜回曰：「回也不愚。」"),t("ming","evade","乐者自得，不必问其何在。","颜回曰：「愿无伐善，无施劳。」")),r("学道而贫，君以为值得乎？",t("yi","hit","道之所在，贫富不與焉。若以贫富较之，则道为货矣。","颜回曰：「回虽不敏，请事斯语矣。」"),t("li","reason","学道本为致用。贫而无用，学之何益？","颜回曰：「夫子循循然善诱人。」"),t("shi","evade","值与不值，各在其人。","颜回曰：「语之而不惰者，其回也与！」")),r("若使君治一邑，当以何为先？",t("yi","hit","先正己。己正而民自正，不待刑也。","颜回曰：「请问其目。」"),t("li","reason","先立制度，明赏罚。","颜回曰：「愿無伐善，無施勞。」"),t("ming","evade","先观其时，随事而应。","颜回曰：「回也闻一以知十。」"))],k("陋巷图",1,"你呈上陋巷图：一箪食，一瓢饮，弦歌不辍。"),{success:"颜回曰：「君可与言道矣。」",compromise:"颜回曰：「君之言，犹有物在。」",fail:"颜回曰：「君之说，非回所闻。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_yanhui_sheng","三省","court","yi",!1,"颜回","孔门之首","曾子曰：「吾日三省吾身。」颜回曰：「回也，终日不违，如愚。」",[r("终日不违，如愚。君以为然乎？",t("yi","hit","退而省其私，亦足以发。回也不愚。","颜回曰：「此夫子之所以知回也。」"),t("li","reason","唯唯而已，无所发明。近于愚矣。","颜回曰：「于吾言无所不说。」"),t("ming","evade","愚与不愚，在人自见。","颜回曰：「不迁怒，不贰过。」")),r("君子之学，为人乎？为己乎？",t("yi","hit","为己。学以修己，非以炫人。","颜回曰：「古之学者为己。」"),t("li","reason","为己而学，则无以济世。","颜回曰：「君子学道则爱人。」"),t("shi","evade","为人为己，皆可学也。","颜回曰：「回也闻一以知十。」")),r("不迁怒，不贰过。君能之乎？",t("yi","hit","臣未能也。然知其为难，故日省之。","颜回曰：「回也不敏，请事斯语。」"),t("li","reason","怒者可迁，过者可改。不必自苦。","颜回曰：「不迁怒，不贰过。」"),t("ming","evade","此小节也，何必较？","颜回曰：「回也，其心三月不违仁。」"))],null,{success:"颜回曰：「君可与共学矣。」",compromise:"颜回曰：「君之见，得半。」",fail:"颜回曰：「君之说，未及于学。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_yanhui_ren","问仁","court","yi",!0,"颜回","孔门之首","颜渊问仁。子曰：「克己复礼为仁。」颜渊曰：「请问其目。」",[r("克己复礼为仁。其目安在？",t("yi","hit","非礼勿视，非礼勿听，非礼勿言，非礼勿动。","颜回曰：「回虽不敏，请事斯语矣。」"),t("li","reason","克己者，节其欲而已。礼者，顺其俗而已。","颜回曰：「请问其目。」"),t("ming","evade","仁者本心，何待目？","颜回曰：「回也，其心三月不违仁。」")),r("克己与顺性，孰为仁？",t("yi","hit","克己而后性正。性之所欲，未必为仁。","颜回曰：「此回之所事也。」"),t("ming","reason","顺性自然。刻意克己，反近于伪。","颜回曰：「君子成人之美。」"),t("li","evade","二者皆可，视其时。","颜回曰：「为仁由己，而由人乎哉？」")),r("天下归仁焉，其效何如？",t("yi","hit","为仁由己，非由人。己正则天下自归，不在求也。","颜回曰：「此夫子之教也。」"),t("li","reason","归仁者，须有政令驱之。","颜回曰：「天下归仁焉。」"),t("shi","evade","效之迟速，非人所能必。","颜回曰：「愿无伐善，无施劳。」"))],null,{success:"颜回曰：「君可与言仁矣。」",compromise:"颜回曰：「君之言，近是。」",fail:"颜回曰：「君犹未克己。」"},{success:{fame:5,rel:8},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Wu={theme:"观乐与让国",intro:"吴公子季札聘于鲁，请观周乐。",debates:[f("v_jizha_yue","观乐","court","ming",!1,"季札","吴之公子","季札请观周乐。使工为之歌《周南》《召南》。曰：「美哉！始基之矣。」",[r("闻乐而知政，可有此事？",t("ming","hit","有。乐者，政之象也。政平则声和，政乱则声哀。","季札曰：「此吾之所以能观也。」"),t("li","reason","乐者声也，政者事也，二者无涉。","季札曰：「美哉！犹有憾。」"),t("yi","evade","乐之感人，直入其心，不必假政。","季札曰：「德至矣哉！」")),r("《郑》声之细，君以为何如？",t("ming","hit","美哉！其细已甚，民弗堪也。是其先亡乎！","季札曰：「此吾所以叹也。」"),t("li","reason","音细者，非大雅之音。当废之。","季札曰：「美哉！始基之矣。」"),t("yi","evade","音之粗细，各从其俗，何必疑？","季札曰：「其细已甚。」")),r("观止矣。若有他乐，吾不敢请已。何谓也？",t("ming","hit","乐之至者，无复有加。《韶》尽美矣，又尽善也。","季札曰：「观止矣。」"),t("yi","reason","尽善者，德之至也。乐不能独尽之。","季札曰：「德至矣哉！大矣。」"),t("shi","evade","乐之尽处，可言者尽于此。","季札曰：「若有他乐，吾不敢请已。」"))],k("鲁太师乐谱",1,"你呈上鲁太师乐谱：十五国风，次序井然。"),{success:"季札曰：「君可与观乐矣。」",compromise:"季札曰：「君之识，未尽乐之奥。」",fail:"季札曰：「君未知音。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_jizha_rang","让国","court","yi",!0,"季札","吴之公子","吴子诸樊欲立季札，季札辞。诸樊卒，遗命授弟，欲以次致国于札。",[r("父兄之命，君何故不受？",t("yi","hit","札虽不才，愿附于子臧之义。礼有旧制，不可乱也。","季札曰：「此吾之所以去也。」"),t("li","reason","兄终弟及，先君之命也。辞之则乱吴。","季札曰：「君义嗣，谁敢干君？」"),t("ming","evade","受与不受，皆可。何必自苦？","季札曰：「吾愿弃其室而耕。」")),r("弃其室而耕，君不悔乎？",t("yi","hit","不悔。所守者义，非位也。","季札曰：「吾子勉之。」"),t("li","reason","弃位而耕，是弃吴也。","季札曰：「吾不受国，非轻吴也。」"),t("shi","evade","悔与不悔，皆在一时之心。","季札曰：「愿附于子臧之义。」")),r("吴终有阖闾之祸。君之让，可谓智乎？",t("yi","hit","祸在后世，非札之让所能致。若贪位则祸在今日。","季札曰：「吾非之所能及也。」"),t("li","reason","若受国，则无阖闾之乱。让者非智。","季札曰：「吾子勉之。」"),t("ming","evade","事之後来，非人所能料。","季札曰：「虽不能至，然心乡往之。」"))],k("延陵挂剑图",1,"你呈上延陵图：季札解剑挂于徐君墓树而已。"),{success:"季札曰：「君可与言义矣。」",compromise:"季札曰：「君之言，有可取。」",fail:"季札曰：「君之见，犹恋于位。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-3}}),f("v_jizha_jian","挂剑","diplomacy","yi",!1,"季札","吴之公子","季札使于徐。徐君好季札剑，口弗敢言。季札心知之，为使上国，未献。",[r("心许之而未言，可乎？",t("yi","hit","心许即诺。虽未言，吾心已许之矣。","季札曰：「此吾之所以挂剑也。」"),t("li","reason","未出口则不为诺。何必自缚？","季札曰：「始吾心已许之，岂以死倍吾心哉？」"),t("ming","evade","诺与不诺，在心不在言。","季札曰：「心许之矣。」")),r("徐君已死，君挂剑于墓。有此必要乎？",t("yi","hit","必要。所守者心，非为人也。","季札曰：「此吾之所以能自安也。」"),t("li","reason","死者无知，挂剑无益。徒为虚名。","季札曰：「不然。」"),t("shi","evade","为之则安，不必问其益。","季札曰：「吾心已许之。」")),r("小信若此，君不以为迂乎？",t("yi","hit","信之小者尚守之，则大者可知。此不迂也。","季札曰：「善哉！君知信矣。」"),t("li","reason","然。信之大者，在国不在剑。","季札曰：「岂以死倍吾心哉？」"),t("ming","evade","迂与不迂，人各有见。","季札曰：「吾心已许之矣。」"))],null,{success:"季札曰：「君可与言信矣。」",compromise:"季札曰：「君之言，半是。」",fail:"季札曰：「君未知心许之重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Zu={theme:"大义灭亲",intro:"卫石碏，纯臣也。恶州吁而厚与焉。大义灭亲，其是之谓乎！",debates:[f("v_shique_mieqin","大义灭亲","court","yi",!0,"石碏","卫之老臣","州吁弑桓公而立。石碏之子石厚助之。石碏使人诱二人至陈，请陈执之。",[r("子助乱臣，父当如何？",t("yi","hit","执而诛之。父子之情，不能蔽君臣之义。","石碏曰：「此吾之所以为之也。」"),t("li","reason","父子天性。当先责而后教，不可遽诛。","石碏曰：「吾何为不除害？」"),t("ming","evade","子之罪，子自受之。父不必与。","石碏曰：「石碏纯臣也。」")),r("大义灭亲，君以为仁乎？忍乎？",t("yi","hit","非忍也，义不得已。杀一子以安社稷，仁之至也。","石碏曰：「此君子所称也。」"),t("li","reason","终近于忍。虎毒不食子。","石碏曰：「吾不得已。」"),t("shi","evade","仁与忍，皆外人之评。","石碏曰：「大义灭亲，其是之谓乎。」")),r("若因子而废国法，天下将如何？",t("yi","hit","国法废则乱臣接踵。一人之私，不可乱一国之纪。","石碏曰：「善哉！此吾之志也。」"),t("li","reason","法有轻重。父子之亲，法所当宥。","石碏曰：「不可。」"),t("ming","evade","执法者自有其权，不必问天下。","石碏曰：「君子曰：石碏，纯臣也。」"))],k("陈国囚车图",1,"你呈上陈国囚车图：二人既执，石碏使家宰杀之。"),{success:"石碏曰：「君可与言义矣。」",compromise:"石碏曰：「君之言，有见。」",fail:"石碏曰：「君犹蔽于私。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shique_jian","谏宠","court","yi",!1,"石碏","卫之老臣","卫庄公娶于齐，曰庄姜，美而无子。又娶于陈，生桓公。公子州吁，嬖人之子也，有宠而好兵。",[r("宠子好兵，君以为可乎？",t("yi","hit","不可。夫宠而不骄，骄而能降，降而不憾，憾而能眕者，鲜矣。","石碏曰：「此吾所以谏也。」"),t("li","reason","爱子者，当顺其性。好兵者，或为将才。","石碏曰：「将立州吁，乃定之矣。」"),t("ming","evade","宠与不宠，在君之心。","石碏曰：「爱子，教之以义方，弗纳于邪。」")),r("「六逆」「六顺」，何谓也？",t("yi","hit","贱妨贵、少陵长、远间亲、新间旧、小加大、淫破义，此六逆也。君义、臣行、父慈、子孝、兄爱、弟敬，此六顺也。","石碏曰：「去顺效逆，所以速祸也。」"),t("li","reason","此皆旧礼，今日之势已异。","石碏曰：「君人者，将祸是务去。」"),t("shi","evade","名目虽多，行之在人。","石碏曰：「无乃不可乎？」")),r("君不听谏，君将如何？",t("yi","hit","告老而已。不去则祸及己身。","石碏曰：「吾将老矣。」"),t("li","reason","当守其位，徐图之。","石碏曰：「弗听。」"),t("ming","evade","去留有时，不必固执。","石碏曰：「其子厚与州吁游，禁之不可。」"))],null,{success:"石碏曰：「君可与言礼矣。」",compromise:"石碏曰：「君之言，亦有理。」",fail:"石碏曰：「君之说，近于宠。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_shique_chunchen","纯臣","court","yi",!1,"石碏","卫之老臣","君子曰：「石碏，纯臣也。恶州吁而厚与焉。」",[r("何谓纯臣？",t("yi","hit","国而忘家，公而忘私。不以亲害义，不以私害公。","石碏曰：「此吾之所守也。」"),t("li","reason","忠而不愚，方为纯臣。","石碏曰：「吾何为不除害？」"),t("ming","evade","纯臣之名，后世所加。当时岂暇计此？","石碏曰：「君子曰：石碏，纯臣也。」")),r("国而忘家，则家何以安？",t("yi","hit","国不安则家无所托。故先国而后家。","石碏曰：「善哉！此纯臣之志也。」"),t("li","reason","家为国之本。家不宁则国不治。","石碏曰：「不可。」"),t("shi","evade","国与家，各有其时。","石碏曰：「吾将老矣。」")),r("纯臣之祸，往往及身。君不惧乎？",t("yi","hit","义之所在，祸不足避。","石碏曰：「此吾之所以为纯臣也。」"),t("li","reason","避祸者，人之常情。纯臣亦当自保。","石碏曰：「吾何为不除害？」"),t("ming","evade","祸福有命，非所豫虑。","石碏曰：「大义灭亲，其是之谓乎。」"))],null,{success:"石碏曰：「君可与言臣道矣。」",compromise:"石碏曰：「君之言，得半。」",fail:"石碏曰：「君犹以私家为重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Ju={theme:"在德不在鼎",intro:"楚子伐陆浑之戎，遂至于雒，观兵于周疆。问鼎之大小轻重焉。",debates:[f("v_wangsunman_ding","在德不在鼎","diplomacy","yi",!0,"王孙满","周之大夫","楚庄王问鼎之大小轻重。王孙满对曰：「在德不在鼎。」",[r("鼎之大小轻重，可得闻乎？",t("yi","hit","在德不在鼎。昔夏之方有德也，远方图物，贡金九牧，铸鼎象物。","王孙满曰：「此吾所以对也。」"),t("li","reason","鼎者重器，其数当有定。明示之以服楚。","王孙满曰：「周德虽衰，天命未改。」"),t("shi","evade","此周室之器，非使者所当问。","王孙满曰：「鼎之轻重，未可问也。」")),r("周德既衰，鼎何以为重？",t("yi","hit","德之休明，虽小重也；其奸回昏乱，虽大轻也。","王孙满曰：「此鼎之所以为重也。」"),t("li","reason","德衰则鼎轻。不如早迁之楚。","王孙满曰：「成王定鼎于郏鄏，卜世三十，卜年七百。」"),t("ming","evade","轻重之数，非人所知。","王孙满曰：「天所命也。」")),r("楚子问鼎，君以何辞拒之而不怒？",t("yi","hit","举天命以拒之，不斥其僭。彼虽强，不敢逆天。","王孙满曰：「周德虽衰，天命未改。」"),t("li","reason","当以兵威拒之，辞不足恃。","王孙满曰：「在德不在鼎。」"),t("shi","evade","顺其意而徐图之。","王孙满曰：「鼎之轻重，未可问也。」"))],k("九鼎图",1,"你呈上九鼎图：鼎象百物，使民知神奸。"),{success:"王孙满曰：「君可与言天命矣。」",compromise:"王孙满曰：「君之言，有可取。」",fail:"王孙满曰：「君犹以力论也。」"},{success:{fame:7,rel:8},compromise:{fame:3,rel:4},fail:{fame:-2,rel:-3}}),f("v_wangsunman_tianming","天命","court","yi",!1,"王孙满","周之大夫","王孙满曰：「周德虽衰，天命未改。鼎之轻重，未可问也。」",[r("天命可改乎？",t("yi","hit","可改，然非人力所能强。德至则天命归，德衰则天命去。","王孙满曰：「此吾所谓在德也。」"),t("li","reason","力强者受天命。楚之强，天命在楚。","王孙满曰：「卜世三十，卜年七百，天所命也。」"),t("ming","evade","天命之事，不可知。","王孙满曰：「未可问也。」")),r("周室微弱，诸侯不朝。君何以自处？",t("yi","hit","守其礼，不坠其名。名存则天下犹有所归。","王孙满曰：「此周之所以久也。」"),t("li","reason","弱而守虚名，不如自强。","王孙满曰：「德之休明，虽小重也。」"),t("shi","evade","时势如此，聊以自安而已。","王孙满曰：「天命未改。」")),r("德与力，孰能久？",t("yi","hit","德久。力者一时，德者百世。","王孙满曰：「善哉！君可与言矣。」"),t("li","reason","力久。无德有力者，尚可以存。","王孙满曰：「其奸回昏乱，虽大轻也。」"),t("ming","evade","久暂有数，非所豫知。","王孙满曰：「鼎之轻重，未可问也。」"))],null,{success:"王孙满曰：「君可与言德矣。」",compromise:"王孙满曰：「君之言，半是。」",fail:"王孙满曰：「君犹重鼎而轻德。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}}),f("v_wangsunman_li","礼与名","court","yi",!1,"王孙满","周之大夫","或问：「周室衰微，何恃而不亡？」王孙满曰：「恃礼与名。」",[r("礼与名，可使国不亡乎？",t("yi","hit","名存则诸侯犹有所忌。礼在则上下犹有所守。","王孙满曰：「此周室所以久也。」"),t("li","reason","空名不能御兵。不如务实。","王孙满曰：「在德不在鼎。」"),t("ming","evade","存亡有数，非一礼所能持。","王孙满曰：「天命未改。」")),r("若诸侯皆弃礼，则将如何？",t("yi","hit","则天下大乱。然弃礼者先亡，守礼者后亡。","王孙满曰：「此吾之所惧也。」"),t("li","reason","则当以兵威正之。","王孙满曰：「鼎之轻重，未可问也。」"),t("shi","evade","天下大势，非人力可回。","王孙满曰：「其奸回昏乱，虽大轻也。」")),r("君之职，在守礼乎？在强国乎？",t("yi","hit","守礼。周之职在礼，不在强。强非其所长，礼乃其所有。","王孙满曰：「此吾之所以自处也。」"),t("li","reason","当先强国。无国则礼无所施。","王孙满曰：「周德虽衰，天命未改。」"),t("ming","evade","二者皆当兼行。","王孙满曰：「在德不在鼎。」"))],null,{success:"王孙满曰：「君可与守礼矣。」",compromise:"王孙满曰：「君之言，可采。」",fail:"王孙满曰：「君未知礼之重。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},Xu={theme:"礼与刑",intro:"叔向，晋之贤大夫。郑铸刑书，叔向使诒子产书。",debates:[f("v_shuxiang_xingshu","论刑书","court","yi",!0,"叔向","晋之大夫","郑铸刑书。叔向使诒子产书曰：「始吾有虞于子，今则已矣。」",[r("昔先王议事以制，不为刑辟。君以为如何？",t("yi","hit","惧民之有争心也。闲之以义，纠之以政，行之以礼，守之以信。","叔向曰：「此吾之所以非刑书也。」"),t("li","reason","议事以制，则吏得任意。不如明法。","叔向曰：「民知有辟，则不忌于上。」"),t("ming","evade","法与礼，皆所以治，不必偏废。","叔向曰：「国将亡，必多制。」")),r("民知争端矣，将弃礼而征于书。君惧乎？",t("yi","hit","惧。锥刀之末，将尽争之。乱狱滋丰，贿赂并行。","叔向曰：「此吾所谓忧也。」"),t("li","reason","争讼虽繁，曲直有定，胜于无书。","叔向曰：「肸闻之，国将亡，必多制。」"),t("shi","evade","讼之繁简，在吏之贤否。","叔向曰：「民知有辟，则不忌于上。」")),r("刑书既铸，君以为后世如何？",t("yi","hit","后世必有以法为争者。然乱不在法，在无礼以先之。","叔向曰：「此吾之所以忧也。」"),t("li","reason","后世有法可循，胜于无法。","叔向曰：「国将亡，必多制。」"),t("ming","evade","后世之事，非今所及。","叔向曰：「肸闻之，国将亡，必多制。」"))],k("叔向诒子产书",1,"你呈上叔向致子产书：「肸闻之，国将亡，必多制。」"),{success:"叔向曰：「君可与言礼矣。」",compromise:"叔向曰：「君之言，有可取。」",fail:"叔向曰：「君之说，助刑书之势也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shuxiang_pin","贫与德","court","yi",!1,"叔向","晋之大夫","叔向见韩宣子。宣子忧贫，叔向贺之。宣子曰：「吾有卿之名，而无其实。」",[r("贫可贺乎？",t("yi","hit","可贺。昔栾武子无一卒之田，其宫不备其宗器，而德建行直。","叔向曰：「此吾之所以贺也。」"),t("li","reason","贫何可贺？富而后能施德。","叔向曰：「今吾子有栾武子之贫，吾以为能其德矣。」"),t("ming","evade","贫富皆外物，不必贺亦不必忧。","叔向曰：「若不忧德之不建，而患货之不足。」")),r("忧德与忧贫，孰为要？",t("yi","hit","忧德。德不建而货足，祸必及之。","叔向曰：「将吊不暇，何贺之有？」"),t("li","reason","忧贫。无财则无以立德。","叔向曰：「贺其贫也。」"),t("shi","evade","二者俱忧，方可无失。","叔向曰：「若不忧德之不建。」")),r("今有卿而贫，君贺之乎？吊之乎？",t("yi","hit","贺之。贫而能德，胜于富而无德。","叔向曰：「贺其贫也。」"),t("li","reason","吊之。卿而贫，是国之失政。","叔向曰：「若不忧德之不建。」"),t("ming","evade","贺吊皆虚文，不必较。","叔向曰：「将吊不暇，何贺之有？」"))],null,{success:"叔向曰：「君可与言德矣。」",compromise:"叔向曰：「君之言，半是。」",fail:"叔向曰：「君犹患货之不足。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},em={theme:"赏刑之度",intro:"申叔时，楚之贤大夫。",debates:[f("v_shenshushi_shang","赏不僭而刑不滥","court","yi",!0,"申叔时","楚之大夫","申叔时曰：「善为国者，赏不僭而刑不滥。」",[r("赏僭与刑滥，孰为害大？",t("yi","hit","赏僭则惧及淫人，刑滥则惧及善人。若不幸而过，宁僭无滥。","申叔时曰：「此吾所以言也。」"),t("li","reason","赏滥则人侥幸，刑轻则人无畏。二害相等。","申叔时曰：「与其失善，宁其利淫。」"),t("ming","evade","赏刑之度，各有其宜。","申叔时曰：「赏不僭而刑不滥。」")),r("宁僭无滥，无乃纵恶乎？",t("yi","hit","非纵恶也。与其杀不辜，宁失不经。此古之训也。","申叔时曰：「善哉！君知刑之本矣。」"),t("li","reason","纵恶则奸无所畏，乱之始也。","申叔时曰：「刑滥则惧及善人。」"),t("shi","evade","过与不及，皆失。宜持平。","申叔时曰：「赏不僭而刑不滥。」")),r("赏刑之柄，当操于谁？",t("yi","hit","操于君，而不可假于臣。假之则赏刑皆私。","申叔时曰：「此治国之要也。」"),t("li","reason","操于有司。君总其成而已。","申叔时曰：「赏不僭而刑不滥。」"),t("ming","evade","操于谁皆可，唯得其人。","申叔时曰：「善为国者。」"))],null,{success:"申叔时曰：「君可与言刑矣。」",compromise:"申叔时曰：「君之言，可采。」",fail:"申叔时曰：「君之说，失其本。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_shenshushi_chen","谏陈","diplomacy","yi",!1,"申叔时","楚之大夫","楚子入陈，杀夏徵舒，因县陈。申叔时使于齐，反，复命而退。",[r("讨贼而县其国，可乎？",t("yi","hit","不可。夏徵舒弑其君，讨之，义也；县陈，贪也。以义始而以贪终，非霸者之举。","申叔时曰：「此吾之所以不进也。」"),t("li","reason","陈既破，取之为县，可强国。","申叔时曰：「牵牛以蹊人之田，而夺之牛。」"),t("ming","evade","既已取之，何必多言？","申叔时曰：「诸侯之从者，曰讨有罪也。」")),r("「蹊田夺牛」之喻，君以为然乎？",t("yi","hit","然。牵牛蹊田者，信有罪矣；夺其牛，罚已重矣。","申叔时曰：「诸侯之从者，曰讨有罪也。」"),t("li","reason","譬喻不足以断事。罪当视其轻重。","申叔时曰：「此吾之所以喻也。」"),t("shi","evade","譬喻之词，听其意可也。","申叔时曰：「今县陈，贪其富也。」")),r("既县陈而复封之，君以为何如？",t("yi","hit","复封之，则义全。讨其罪而不利其地，诸侯自服。","申叔时曰：「此吾之所以言也。」"),t("li","reason","既已得之，复弃之，非计。","申叔时曰：「诸侯之从者，曰讨有罪也。」"),t("shi","evade","封与不封，皆楚之利。","申叔时曰：「今县陈，贪其富也。」"))],null,{success:"申叔时曰：「君可与言义矣。」",compromise:"申叔时曰：「君之言，可采。」",fail:"申叔时曰：「君犹贪其利。」"},{success:{fame:6,rel:7},compromise:{fame:2,rel:3},fail:{fame:-2,rel:-2}})]},im={theme:"直道事人",intro:"柳下惠为士师，三黜。人曰：「子未可以去乎？」曰：「直道而事人，焉往而不三黜？」",debates:[f("v_liuxiahui_sanchu","三黜不去","court","yi",!1,"展获","鲁之士师","柳下惠为士师，三黜。人曰：「子未可以去乎？」",[r("三黜而不去，何也？",t("yi","hit","直道而事人，焉往而不三黜？枉道而事人，何必去父母之邦？","展获曰：「此吾之所以不去也。」"),t("li","reason","三黜则知其不容，当去以求用。","展获曰：「枉道而事人，何必去父母之邦？」"),t("ming","evade","去留皆可，何必执着？","展获曰：「直道而事人，焉往而不三黜？」")),r("直道而屡黜，与枉道而显达，君取何者？",t("yi","hit","取直道。枉道而达，非达也。","展获曰：「此吾所守也。」"),t("li","reason","达而后可以行志。枉一时以伸百世。","展获曰：「枉道而事人，何必去父母之邦？」"),t("shi","evade","直与枉，视其时。","展获曰：「直道而事人。」")),r("父母之邦不可去，然君不见用。君将终老于此乎？",t("yi","hit","终老于此。道在我，用不用在人。","展获曰：「此吾之所以不去也。」"),t("li","reason","当去他国求用。道行而后可以言守。","展获曰：「枉道而事人，何必去父母之邦？」"),t("ming","evade","去留皆可，视其时而定。","展获曰：「直道而事人。」"))],null,{success:"展获曰：「君可与言直矣。」",compromise:"展获曰：「君之言，有可取。」",fail:"展获曰：「君之说，枉道之属也。」"},{success:{fame:6,rel:8},compromise:{fame:2,rel:4},fail:{fame:-2,rel:-3}}),f("v_liuxiahui_zuohuai","坐怀不乱","court","yi",!1,"展获","鲁之士师","柳下惠夜宿郭门，有女子来同宿，恐其冻死，坐之于怀，至晓不为乱。",[r("坐怀而不乱，君信之乎？",t("yi","hit","信之。心正者，虽处嫌疑之地而不失其守。","展获曰：「此吾之所为也。」"),t("li","reason","人情所难。此说近于夸。","展获曰：「吾岂以是自异哉？」"),t("ming","evade","信与不信，在人而已。","展获曰：「尔为尔，我为我。」")),r("处嫌疑之地，当避之乎？",t("yi","hit","当避则避，不可避则守其心。避与守，皆所以全德。","展获曰：「善哉！君知守身矣。」"),t("li","reason","当避之。君子不处嫌疑。","展获曰：「虽袒裼裸裎于我侧，尔焉能浼我哉？」"),t("shi","evade","嫌疑之迹，不必尽避。","展获曰：「尔为尔，我为我。」")),r("君子之守，当为人所见乎？抑在人所不见？",t("yi","hit","在人所不见。见而守之，未必真守。","展获曰：「此吾之所以能也。」"),t("li","reason","当为人所见。使人知有守，则风俗自正。","展获曰：「尔为尔，我为我。」"),t("ming","evade","见与不见，皆外也。","展获曰：「虽袒裼裸裎于我侧，尔焉能浼我哉？」"))],null,{success:"展获曰：「君可与言守矣。」",compromise:"展获曰：「君之言，半得。」",fail:"展获曰：「君犹重迹而轻心。」"},{success:{fame:5,rel:7},compromise:{fame:2,rel:3},fail:{fame:-1,rel:-2}})]},tm={theme:"以乐谏君",intro:"师旷，晋之乐师，目盲而善听。",debates:[f("v_shikuang_yin","以乐谏","court","ming",!1,"师旷","晋之乐师","晋平公铸大钟，使工听之，皆以为调。师旷曰：「不调。」",[r("众工皆以为调，君独曰不调，何也？",t("ming","hit","钟声不和于心。心不和则声不和，臣以耳听之。","师旷曰：「此臣之所以能听也。」"),t("li","reason","众工之听，精于一人。当从众。","师旷曰：「後世有知音者，将知钟之不调也。」"),t("yi","evade","调与不调，皆细事，何必争？","师旷曰：「臣窃为君耻之。」")),r("乐之调否，何关于政？",t("ming","hit","大有关。乐者政之象。钟不调则政不和。","师旷曰：「此吾之所以谏也。」"),t("li","reason","乐者娱耳，政者治民，二者无涉。","师旷曰：「夫乐，以开山川之风也。」"),t("shi","evade","调否自有工师，君不必问。","师旷曰：「不调。」")),r("君有过，乐师当以何谏？",t("ming","hit","托于声。声不和则君自知，不待言也。","师旷曰：「此吾之所以托于乐也。」"),t("yi","reason","当直言。托于声则近于戏。","师旷曰：「臣非不直也，直而无益。」"),t("li","reason","当择其可谏者谏之，不必尽言。","师旷曰：「不调。」"))],null,{success:
