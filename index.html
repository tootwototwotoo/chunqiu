<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春秋·列国志</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-brand">
      <span class="brand-seal">春</span>
      <span class="brand-text">列国志</span>
    </div>
    <div class="hud-player">
      <span id="hud-name" class="hud-name">—</span>
      <span id="hud-prof" class="hud-prof">—</span>
      <span id="hud-rank" class="hud-rank"></span>
    </div>
    <div class="hud-stats">
      <span class="stat" title="金钱"><i>金</i><b id="hud-money">0</b></span>
      <span class="stat" title="名声"><i>名</i><b id="hud-fame">0</b></span>
      <span class="stat" title="体力"><i>力</i><b id="hud-stamina">0/0</b></span>
      <span class="stat" title="健康"><i>康</i><b id="hud-health">0</b></span>
    </div>
    <div class="hud-time">
      <span id="hud-date">—</span>
      <span id="hud-season" class="season">春</span>
    </div>
    <nav class="hud-nav" id="hud-nav">
      <button data-screen="map">舆图</button>
      <button data-screen="city">城中</button>
      <button data-screen="character">人物</button>
      <button data-screen="quests">差事</button>
      <button data-screen="relations">交游</button>
      <button data-screen="cards">名鉴</button>
      <button data-screen="save">存档</button>
    </nav>
  </header>

  <main id="screen" class="screen"></main>

  <aside id="log-panel">
    <h3>纪 事</h3>
    <ul id="log-list"></ul>
  </aside>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="tick-bar"><div id="tick-fill"></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
